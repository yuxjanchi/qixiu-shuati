,"type":"judge","module":"汽车概论与机械基础","q":"汽车车身的主要作用是安装各总成和部件，并为驾驶员和乘客提供安全、舒适的乘坐空间。","opts":[],"a":"√","e":"车身是驾驶人工作和乘员乘坐的场所，同时安装发动机、底盘等总成，承受并传递载荷，保障安全舒适。"},{"id":243,"oid":"A1-047","type":"judge","module":"汽车概论与机械基础","q":"交流异步（感应）驱动电机结构简单坚固、免维护，但效率和功率密度一般不如永磁同步电机。","opts":[],"a":"√","e":"异步电机无永磁体、转子坚固耐用、可弱磁调速，但低速效率和功率密度低于永磁同步电机；永磁同步是当前主流。"},{"id":244,"oid":"A1-048","type":"judge","module":"汽车概论与机械基础","q":"三元锂电池和磷酸铁锂电池都是目前新能源汽车常用的动力蓄电池类型。","opts":[],"a":"√","e":"车用动力电池主要有三元锂（NCM/NCA）和磷酸铁锂（LFP）两大类，前者能量密度高，后者安全、寿命长。"},{"id":245,"oid":"A1-049","type":"judge","module":"汽车概论与机械基础","q":"前置前驱（FF）汽车的变速器、主减速器和差速器常组合为一体（变速驱动桥），直接驱动前轮。","opts":[],"a":"√","e":"FF布置把发动机横置，变速器与主减速器、差速器集成于一体，省去长传动轴，结构紧凑、传动效率高。"},{"id":246,"oid":"A1-050","type":"judge","module":"汽车概论与机械基础","q":"汽车传动系的基本功用是将发动机发出的动力传递给驱动车轮。","opts":[],"a":"√","e":"传动系经离合器、变速器、万向传动、主减速器、差速器和半轴把发动机动力传给驱动轮，实现起步和行驶。"},{"id":247,"oid":"A1-051","type":"judge","module":"汽车概论与机械基础","q":"四轮驱动（4WD）汽车的全部车轮都可作为驱动轮，通过性好，但结构复杂、能耗较高。","opts":[],"a":"√","e":"4WD把动力同时传给前后桥，附着力大、越野通过性好；但增加分动器和传动部件，结构复杂、自重和能耗增大。"},{"id":248,"oid":"A1-052","type":"judge","module":"汽车概论与机械基础","q":"柴油机和汽油机都属于往复活塞式内燃机，柴油机在进气行程吸入气缸的是纯空气。","opts":[],"a":"√","e":"柴油机吸入纯空气、压缩后喷油自燃（压燃）；汽油机吸入的是汽油与空气的混合气，靠火花塞点燃。"},{"id":249,"oid":"A1-053","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车的高压线束一般用橙色作为醒目标识，以提醒维修人员注意高压危险。","opts":[],"a":"√","e":"橙色是高压安全警示色，用于高压线束、接插件和部件外壳，使维修人员易于识别并与低压线束区分。"},{"id":250,"oid":"A1-054","type":"judge","module":"汽车概论与机械基础","q":"汽车电气设备中的电源包括蓄电池和发电机。","opts":[],"a":"√","e":"汽车电源由蓄电池（起动和停机时供电）和发电机（发动机运转后主供电并给蓄电池充电）组成。"},{"id":251,"oid":"A1-055","type":"judge","module":"汽车概论与机械基础","q":"某纯电动汽车下电维修时，技师先断低压蓄电池负极、再拔高压维修开关并等待放电，这一流程同时涉及高压安全操作与车辆电气构造知识。","opts":[],"a":"√","e":"该说法正确。纯电动车高压回路断电须先断12V负极使接触器释放，再断高压维修开关并等待电容放电，是构造与高压安全的综合应用。"},{"id":252,"oid":"A1-056","type":"judge","module":"汽车概论与机械基础","q":"汽车按动力装置不同可分为内燃机汽车、电动汽车和混合动力汽车等。","opts":[],"a":"√","e":"按动力装置（发动机/电机）不同，汽车分为内燃机汽车、电动汽车（纯电、燃料电池）和混合动力汽车等类别。"},{"id":253,"oid":"A1-057","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车在制动或减速时，可通过驱动电机发电（再生制动）将部分动能回收为电能储存到动力电池。","opts":[],"a":"√","e":"松开加速踏板或制动时，驱动电机转为发电机工况，把车辆动能转为电能回充电池，提高能量利用率和续驶里程。"},{"id":254,"oid":"A1-058","type":"judge","module":"汽车概论与机械基础","q":"发动机按冷却方式可分为水冷式和风冷式两种。","opts":[],"a":"√","e":"水冷式以冷却液循环散热，风冷式以空气直接吹拂散热片散热；现代汽车发动机多为水冷式。"},{"id":255,"oid":"A1-059","type":"judge","module":"汽车概论与机械基础","q":"油电混合动力汽车（HEV）的动力电池容量较小，主要靠发动机和回收制动能量充电，不能外接充电。","opts":[],"a":"√","e":"HEV电池只用于调峰和能量回收，容量小、电压低，不能用外部电源充电；外接充电是PHEV的特征。"},{"id":256,"oid":"A1-060","type":"judge","module":"汽车概论与机械基础","q":"汽车的转向系用于控制汽车按驾驶员选定的方向行驶。","opts":[],"a":"√","e":"转向系通过转向盘、转向器和转向传动机构偏转前轮，使汽车按驾驶人意图改变行驶方向。"},{"id":257,"oid":"A1-061","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车因为没有发动机，所以行驶时完全没有任何噪声和振动。","opts":[],"a":"×","e":"该说法错误。纯电动车虽无发动机噪声，但仍有电机运转噪声、轮胎路噪和路面风噪，低速时还需外接提示音提醒行人。"},{"id":258,"oid":"A1-062","type":"judge","module":"汽车概论与机械基础","q":"汽车制动系的作用是使行驶中的汽车减速或停车，并使停放的汽车可靠驻留。","opts":[],"a":"√","e":"行车制动使行驶车辆减速停车，驻车制动使车辆停驻不溜动；两者共同保证行车和驻车安全。"},{"id":259,"oid":"A1-063","type":"judge","module":"汽车概论与机械基础","q":"磷酸铁锂电池热稳定性和安全性较好、循环寿命较长，但能量密度一般低于三元锂电池。","opts":[],"a":"√","e":"磷酸铁锂热分解温度高、不易热失控、循环寿命长，但单体电压低、能量密度较小；三元锂能量密度高但热稳定性略差。"},{"id":260,"oid":"A1-064","type":"judge","module":"汽车概论与机械基础","q":"后置后驱（RR）布置的发动机和驱动桥都布置在汽车后部。","opts":[],"a":"√","e":"RR把发动机、变速器和驱动桥都置于车尾，驱动后轮，常见于客车和部分跑车，可减轻前轴负荷、实现轴距合理分配。"},{"id":261,"oid":"A1-065","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车上的电动压缩机由高压电直接驱动，不依赖发动机皮带传动。","opts":[],"a":"√","e":"纯电动车无发动机皮带，空调制冷由高压电动压缩机独立驱动，可在停车时制冷，并便于热管理和能量调度。"},{"id":262,"oid":"A1-066","type":"judge","module":"汽车概论与机械基础","q":"汽车底盘由传动系、行驶系、转向系和制动系四大系统组成。","opts":[],"a":"√","e":"底盘四大系统分别承担传递动力、行驶支承、控制方向和减速停车功能，是汽车行驶的基础总成。"},{"id":263,"oid":"A1-067","type":"judge","module":"汽车概论与机械基础","q":"增程式电动汽车因发动机始终工作在高效区间发电，其长途高速行驶的能耗往往较经济。","opts":[],"a":"√","e":"增程发动机只在高效转速区带动发电机，避开低效工况，避免了发动机直驱时的频繁波动，长途能耗较经济。"},{"id":264,"oid":"A1-068","type":"judge","module":"汽车概论与机械基础","q":"汽车车身壳体是车身的基础件，发动机罩、车门、翼子板等属于车身外部覆盖件。","opts":[],"a":"√","e":"车身壳体是承载基础，发动机罩、车门、翼子板、行李厢盖等为覆盖件，主要起覆盖、导流和美观作用。"},{"id":265,"oid":"A1-069","type":"judge","module":"汽车概论与机械基础","q":"驱动电机在低速时就能输出大转矩，因此纯电动汽车通常不需要多挡变速器，多采用固定速比减速器。","opts":[],"a":"√","e":"电机低速大转矩、调速范围宽，单级减速即可满足起步和高速需求；多挡变速器会增加成本和复杂性，故纯电多用固定速比减速器。"},{"id":266,"oid":"A1-070","type":"judge","module":"汽车概论与机械基础","q":"传统汽车的动力装置是发动机，纯电动汽车的动力装置是驱动电机。","opts":[],"a":"√","e":"传统燃油车以发动机为动力装置，纯电动车以驱动电机为动力装置，两者能量来源和动力形式不同。"},{"id":267,"oid":"A1-071","type":"judge","module":"汽车概论与机械基础","q":"储氢罐是燃料电池汽车储存高压氢气的部件，储存压力很高，对安全性和密封要求严格。","opts":[],"a":"√","e":"燃料电池车把高压压缩氢（常达70MPa）储存在专用储氢罐中，罐体高强度、高密封，并有严格的安全防护和泄压装置。"},{"id":268,"oid":"A1-072","type":"judge","module":"汽车概论与机械基础","q":"汽车电气设备采用单线制，电源负极通过车身搭铁构成回路。","opts":[],"a":"√","e":"汽车电源正极经导线接到用电设备，负极经车身（车架）搭铁形成回路，即单线制，可节省导线、简化线路。"},{"id":269,"oid":"A1-073","type":"judge","module":"汽车概论与机械基础","q":"插电式混合动力汽车在结构上同时装有发动机和驱动电机，以及容量较大、可外接充电的动力电池。","opts":[],"a":"√","e":"PHEV同时具备燃油系统和电驱动系统，电池容量大、可外接充电，是介于燃油车与纯电车之间的过渡车型。"},{"id":270,"oid":"A1-074","type":"judge","module":"汽车概论与机械基础","q":"前置后驱（FR）汽车的发动机布置在汽车前部，动力经传动系传给后驱动桥，驱动后轮。","opts":[],"a":"√","e":"FR由前置发动机经离合器、变速器、传动轴、后驱动桥驱动后轮，前后轴负荷分配较均匀，多用于中高级轿车和货车。"},{"id":271,"oid":"A1-075","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车不需要更换机油和机油滤清器，因为它没有发动机润滑系统。","opts":[],"a":"√","e":"纯电动车无发动机及曲轴连杆机构，不存在机油润滑和机油滤清器，常规保养主要是检查高压系统、减速器齿轮油和冷却系统。"},{"id":272,"oid":"A1-076","type":"judge","module":"汽车概论与机械基础","q":"汽车按发动机使用燃料不同，可分为汽油车、柴油车和气体燃料汽车等。","opts":[],"a":"√","e":"按燃料分有汽油车、柴油车，以及使用天然气（CNG/LNG）、液化石油气（LPG）等气体燃料的汽车。"},{"id":273,"oid":"A1-077","type":"judge","module":"汽车概论与机械基础","q":"某新能源汽车既能外接充电、可纯电行驶50km，且发动机在行驶中既可发电又可直接驱动车轮，据此可判断它属于增程式电动汽车。","opts":[],"a":"×","e":"该判断错误。增程式发动机只发电、不直接驱动车轮；发动机可直接驱动车轮的是插电式混合动力（PHEV）汽车。"},{"id":274,"oid":"A1-078","type":"single","module":"汽车概论与机械基础","q":"传统汽车的四大组成部分是发动机、底盘、车身和（　）。","opts":[{"k":"A","t":"电气设备"},{"k":"B","t":"转向系"},{"k":"C","t":"制动系"},{"k":"D","t":"空调系统"}],"a":"A","e":"传统汽车由发动机、底盘、车身、电气设备四大部分组成；转向系、制动系属底盘，空调属电气设备附件，不与四大并列。"},{"id":275,"oid":"A1-079","type":"single","module":"汽车概论与机械基础","q":"汽车的动力装置是（　）。","opts":[{"k":"A","t":"底盘"},{"k":"B","t":"发动机"},{"k":"C","t":"车身"},{"k":"D","t":"电气设备"}],"a":"B","e":"发动机使燃料燃烧将热能转化为机械能，是传统汽车的动力装置；底盘、车身、电气设备均不产生动力。"},{"id":276,"oid":"A1-080","type":"single","module":"汽车概论与机械基础","q":"下列汽车中，不属于新能源汽车的是（　）。","opts":[{"k":"A","t":"纯电动汽车"},{"k":"B","t":"插电式混合动力汽车"},{"k":"C","t":"柴油轿车"},{"k":"D","t":"燃料电池汽车"}],"a":"C","e":"新能源汽车以电、氢等非常规能源驱动，包括纯电、插电混动、燃料电池；柴油轿车是传统内燃机汽车，不属新能源。"},{"id":277,"oid":"A1-081","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车（BEV）的能量来源是（　）。","opts":[{"k":"A","t":"汽油"},{"k":"B","t":"柴油"},{"k":"C","t":"动力蓄电池"},{"k":"D","t":"氢气"}],"a":"C","e":"纯电动车以动力电池储存的电能为唯一能源；汽油、柴油用于内燃机汽车，氢气是燃料电池车的燃料。"},{"id":278,"oid":"A1-082","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车中将动力电池高压直流电变换为12V低压直流电的部件是（　）。","opts":[{"k":"A","t":"车载充电机"},{"k":"B","t":"DC/DC转换器"},{"k":"C","t":"驱动电机"},{"k":"D","t":"电动空调压缩机"}],"a":"B","e":"DC/DC把高压直流降为12V供低压设备和蓄电池充电；OBC负责交流转直流给电池，电机是动力部件。"},{"id":279,"oid":"A1-083","type":"single","module":"汽车概论与机械基础","q":"负责把交流充电桩的交流电变换为直流电、给动力电池充电的部件是（　）。","opts":[{"k":"A","t":"驱动电机"},{"k":"B","t":"车载充电机（OBC）"},{"k":"C","t":"DC/DC转换器"},{"k":"D","t":"整车控制器"}],"a":"B","e":"交流慢充桩只出交流电，须经车载充电机OBC整流为直流再充入电池；DC/DC是高压转低压，电机是执行部件。"},{"id":280,"oid":"A1-084","type":"single","module":"汽车概论与机械基础","q":"下列关于增程式电动汽车的说法，正确的是（　）。","opts":[{"k":"A","t":"发动机直接驱动车轮"},{"k":"B","t":"发动机只带动发电机发电，由驱动电机驱动车轮"},{"k":"C","t":"完全没有发动机"},{"k":"D","t":"必须外接加油才能行驶"}],"a":"B","e":"增程车发动机仅驱动发电机发电，车轮始终由驱动电机驱动；纯电动才有发动机，且增程可纯电行驶一段。"},{"id":281,"oid":"A1-085","type":"single","module":"汽车概论与机械基础","q":"燃料电池汽车（FCEV）行驶时排出的物质主要是（　）。","opts":[{"k":"A","t":"二氧化碳"},{"k":"B","t":"水"},{"k":"C","t":"炭烟"},{"k":"D","t":"一氧化碳"}],"a":"B","e":"燃料电池中氢与氧电化学反应生成水并排出，无燃烧过程，不产生CO2、CO和炭烟。"},{"id":282,"oid":"A1-086","type":"single","module":"汽车概论与机械基础","q":"目前新能源汽车上应用最广泛、效率和功率密度较高的驱动电机是（　）。","opts":[{"k":"A","t":"直流有刷电机"},{"k":"B","t":"永磁同步电机"},{"k":"C","t":"串激电机"},{"k":"D","t":"步进电机"}],"a":"B","e":"永磁同步电机效率高、功率密度大、调速宽，是乘用车主流；直流有刷和串激已淘汰，步进电机用于小功率控制。"},{"id":283,"oid":"A1-087","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车的三大核心（三电）系统是动力电池系统、驱动电机系统和（　）。","opts":[{"k":"A","t":"电控系统"},{"k":"B","t":"冷却系统"},{"k":"C","t":"转向系统"},{"k":"D","t":"空调系统"}],"a":"A","e":"三电指电池、电机、电控系统；冷却、转向、空调属辅助系统，不列入三电核心。"},{"id":284,"oid":"A1-088","type":"single","module":"汽车概论与机械基础","q":"下列关于油电混合动力汽车（HEV）的说法，正确的是（　）。","opts":[{"k":"A","t":"可用家用电源外接充电"},{"k":"B","t":"动力电池容量较大，可长距离纯电行驶"},{"k":"C","t":"不能外接充电，电池靠发动机和回收制动能量充电"},{"k":"D","t":"没有发动机"}],"a":"C","e":"HEV电池小、不可外接充电，由发动机和再生制动维持电量；可外接充电、长距离纯电是PHEV特征。"},{"id":285,"oid":"A1-089","type":"single","module":"汽车概论与机械基础","q":"汽车底盘四大系统中，用于使行驶中汽车减速或停车的是（　）。","opts":[{"k":"A","t":"传动系"},{"k":"B","t":"行驶系"},{"k":"C","t":"转向系"},{"k":"D","t":"制动系"}],"a":"D","e":"制动系产生制动力使车辆减速停车；传动系传力、行驶系支承、转向系控制方向，均不负责减速。"},{"id":286,"oid":"A1-090","type":"single","module":"汽车概论与机械基础","q":"某前置前驱轿车行驶中动力不足，经检查发动机和电机均正常。从构造布置看，其动力传递路线应是（　）。","opts":[{"k":"A","t":"发动机→离合器→变速器→长传动轴→后驱动桥"},{"k":"B","t":"发动机→变速器（集成主减速器、差速器）→前轮"},{"k":"C","t":"后置发动机→后轮"},{"k":"D","t":"四轮独立电驱动"}],"a":"B","e":"FF把变速器、主减速器、差速器集成为变速驱动桥直接驱前轮，无长传动轴；A为FR后驱，C为RR，D为电四驱。"},{"id":287,"oid":"A1-091","type":"single","module":"汽车概论与机械基础","q":"汽车传动系的基本功用是（　）。","opts":[{"k":"A","t":"支承整车质量"},{"k":"B","t":"将发动机动力传给驱动车轮"},{"k":"C","t":"改变行驶方向"},{"k":"D","t":"缓和冲击"}],"a":"B","e":"传动系把发动机动力经离合器、变速器、主减速器等传给驱动轮；支承属行驶系，改向属转向系，缓冲属悬架。"},{"id":288,"oid":"A1-092","type":"single","module":"汽车概论与机械基础","q":"与传统燃油汽车相比，纯电动汽车上一般不存在的部件是（　）。","opts":[{"k":"A","t":"驱动电机"},{"k":"B","t":"动力电池"},{"k":"C","t":"排气消声器"},{"k":"D","t":"电控系统"}],"a":"C","e":"纯电动车无燃烧排气，故无排气消声器和三元催化；驱动电机、电池、电控是其核心部件。"},{"id":289,"oid":"A1-093","type":"single","module":"汽车概论与机械基础","q":"汽车按发动机燃料分类，使用柴油作为燃料的汽车称为（　）。","opts":[{"k":"A","t":"汽油车"},{"k":"B","t":"柴油车"},{"k":"C","t":"电动车"},{"k":"D","t":"气体燃料车"}],"a":"B","e":"以柴油为燃料的内燃机汽车称柴油车，柴油机压燃、热效率高；汽油车点燃，电动车不使用燃料。"},{"id":290,"oid":"A1-094","type":"single","module":"汽车概论与机械基础","q":"磷酸铁锂电池相比三元锂电池，突出的优点是（　）。","opts":[{"k":"A","t":"能量密度更高"},{"k":"B","t":"热稳定性好、安全性和循环寿命较好"},{"k":"C","t":"单体电压更高"},{"k":"D","t":"体积更小"}],"a":"B","e":"磷酸铁锂热稳定性好、循环寿命长、安全性高；三元锂能量密度和电压更高、体积更小，但热稳定性略差。"},{"id":291,"oid":"A1-095","type":"single","module":"汽车概论与机械基础","q":"汽车行驶系的组成是车架（或车身）、车桥、悬架和（　）。","opts":[{"k":"A","t":"转向器"},{"k":"B","t":"制动器"},{"k":"C","t":"车轮"},{"k":"D","t":"变速器"}],"a":"C","e":"行驶系由车架、车桥、悬架和车轮组成；转向器属转向系，制动器属制动系，变速器属传动系。"},{"id":292,"oid":"A1-096","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车的高压线束通常采用（　）色作醒目标识。","opts":[{"k":"A","t":"红"},{"k":"B","t":"橙"},{"k":"C","t":"蓝"},{"k":"D","t":"黑"}],"a":"B","e":"橙色是高压安全警示色，用于高压线束和部件；红色多用于低压正极，蓝色、黑色不表示高压。"},{"id":293,"oid":"A1-097","type":"single","module":"汽车概论与机械基础","q":"汽车电气设备的电源是蓄电池和（　）。","opts":[{"k":"A","t":"起动机"},{"k":"B","t":"发电机"},{"k":"C","t":"点火线圈"},{"k":"D","t":"保险丝"}],"a":"B","e":"发电机是发动机运转后的主电源，并给蓄电池充电；起动机是用电设备，点火线圈、保险丝不是电源。"},{"id":294,"oid":"A1-098","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车在减速或制动时，驱动电机可作为发电机运行，将动能回收为电能，称为（　）。","opts":[{"k":"A","t":"再生制动（能量回收）"},{"k":"B","t":"机械制动"},{"k":"C","t":"驻车制动"},{"k":"D","t":"发动机制动"}],"a":"A","e":"再生制动（能量回收）让电机转为发电机，把动能转为电能回充电池；纯电动车无发动机故无发动机制动。"},{"id":295,"oid":"A1-099","type":"single","module":"汽车概论与机械基础","q":"柴油机与汽油机相比，柴油机在进气行程吸入气缸的是（　）。","opts":[{"k":"A","t":"汽油与空气的混合气"},{"k":"B","t":"纯空气"},{"k":"C","t":"柴油与空气的混合气"},{"k":"D","t":"纯柴油"}],"a":"B","e":"柴油机吸入纯空气，压缩至终了高压高温时喷油自燃；汽油机吸入汽油与空气混合气，靠火花塞点燃。"},{"id":296,"oid":"A1-100","type":"single","module":"汽车概论与机械基础","q":"下列布置形式中，发动机和驱动桥都位于汽车后部、驱动后轮的是（　）。","opts":[{"k":"A","t":"前置前驱（FF）"},{"k":"B","t":"前置后驱（FR）"},{"k":"C","t":"后置后驱（RR）"},{"k":"D","t":"四轮驱动"}],"a":"C","e":"RR把发动机和驱动桥都置于车尾驱动后轮；FF前置前驱、FR前置后驱，4WD前后桥均驱动。"},{"id":297,"oid":"A1-101","type":"single","module":"汽车概论与机械基础","q":"汽车车身的主要作用不包括（　）。","opts":[{"k":"A","t":"安置各总成部件"},{"k":"B","t":"为乘员提供乘坐空间"},{"k":"C","t":"承受和传递整车载荷"},{"k":"D","t":"直接将燃料化学能转化为机械能"}],"a":"D","e":"车身用于安置总成、乘坐和承力；把化学能转为机械能是发动机的功能，不是车身的作用。"},{"id":298,"oid":"A1-102","type":"single","module":"汽车概论与机械基础","q":"关于插电式混合动力汽车（PHEV），下列说法错误的是（　）。","opts":[{"k":"A","t":"装有发动机和驱动电机"},{"k":"B","t":"动力电池可外接充电"},{"k":"C","t":"可纯电行驶一定里程"},{"k":"D","t":"不能使用燃油行驶"}],"a":"D","e":"PHEV既可充电纯电行驶，也可用燃油（发动机）行驶以延长续驶；说它不能用燃油是错误的。"},{"id":299,"oid":"A1-103","type":"single","module":"汽车概论与机械基础","q":"汽车转向系的作用是（　）。","opts":[{"k":"A","t":"传递动力"},{"k":"B","t":"控制汽车按驾驶员选定方向行驶"},{"k":"C","t":"支承车身"},{"k":"D","t":"储存能量"}],"a":"B","e":"转向系偏转车轮控制行驶方向；传力属传动系、支承属行驶系、储能是飞轮等的功能。"},{"id":300,"oid":"A1-104","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车空调系统中，给车厢制冷的压缩机通常由（　）驱动。","opts":[{"k":"A","t":"发动机皮带"},{"k":"B","t":"高压电驱动的电动压缩机"},{"k":"C","t":"手摇机构"},{"k":"D","t":"起动机"}],"a":"B","e":"纯电动车无发动机皮带，空调制冷用高压电动压缩机独立驱动，便于驻车制冷和整车能量管理。"},{"id":301,"oid":"A1-105","type":"single","module":"汽车概论与机械基础","q":"下列属于汽车用电设备的是（　）。","opts":[{"k":"A","t":"蓄电池"},{"k":"B","t":"发电机"},{"k":"C","t":"起动机"},{"k":"D","t":"动力电池"}],"a":"C","e":"起动机是用电设备；蓄电池和发电机是电源，动力电池是电动车的能源，均不是普通用电设备。"},{"id":302,"oid":"A1-106","type":"single","module":"汽车概论与机械基础","q":"燃料电池汽车的主要能量转换过程是（　）。","opts":[{"k":"A","t":"燃料化学能→热能→机械能"},{"k":"B","t":"氢气化学能→电能→机械能（驱动电机）"},{"k":"C","t":"电能→化学能"},{"k":"D","t":"机械能→电能"}],"a":"B","e":"燃料电池把氢气化学能直接电化学反应转为电能，再由驱动电机转为机械能，不经过燃烧做功。"},{"id":303,"oid":"A1-107","type":"single","module":"汽车概论与机械基础","q":"汽车按动力装置分类，以电动机为动力的汽车属于（　）。","opts":[{"k":"A","t":"内燃机汽车"},{"k":"B","t":"电动汽车"},{"k":"C","t":"蒸汽汽车"},{"k":"D","t":"太阳能专用车"}],"a":"B","e":"以电动机驱动的汽车属电动汽车（纯电、燃料电池等）；内燃机汽车以汽油、柴油发动机为动力。"},{"id":304,"oid":"A1-108","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车通常不需要多挡变速器，主要原因是（　）。","opts":[{"k":"A","t":"驱动电机低速转矩小"},{"k":"B","t":"电机转速范围宽、低速即可输出大转矩，固定速比减速器即可满足"},{"k":"C","t":"电机完全不能调速"},{"k":"D","t":"为了降低电机效率"}],"a":"B","e":"电机低速大转矩、调速范围宽，单级减速就能兼顾起步和高速，省去多挡变速，降低成本和复杂度。"},{"id":305,"oid":"A1-109","type":"single","module":"汽车概论与机械基础","q":"汽车制动系中，用于停车后防止车辆溜动的是（　）。","opts":[{"k":"A","t":"行车制动"},{"k":"B","t":"驻车制动"},{"k":"C","t":"发动机制动"},{"k":"D","t":"排气制动"}],"a":"B","e":"驻车制动（手刹/电子手刹）在停车后使车辆可靠驻留；行车制动用于行驶中减速停车。"},{"id":306,"oid":"A1-110","type":"single","module":"汽车概论与机械基础","q":"关于纯电动汽车暖风的说法，正确的是（　）。","opts":[{"k":"A","t":"利用发动机冷却液余热"},{"k":"B","t":"多采用PTC电加热器或热泵空调"},{"k":"C","t":"利用排气余热"},{"k":"D","t":"不需要暖风"}],"a":"B","e":"纯电动车无发动机冷却液余热，常用PTC电加热或热泵采暖；燃油车才靠冷却液余热。"},{"id":307,"oid":"A1-111","type":"single","module":"汽车概论与机械基础","q":"四冲程柴油机的点火（着火）方式是（　）。","opts":[{"k":"A","t":"火花塞点燃"},{"k":"B","t":"压缩终了高温使柴油自燃（压燃）"},{"k":"C","t":"电热塞点燃混合气"},{"k":"D","t":"电火花点燃柴油"}],"a":"B","e":"柴油机压缩纯空气至终了温度超过柴油自燃点，喷油后自行着火，即压燃；火花塞点燃是汽油机。"},{"id":308,"oid":"A1-112","type":"single","module":"汽车概论与机械基础","q":"四轮驱动（4WD）汽车的特点是（　）。","opts":[{"k":"A","t":"只有前轮驱动"},{"k":"B","t":"只有后轮驱动"},{"k":"C","t":"全部车轮都可作为驱动轮，通过性好"},{"k":"D","t":"结构最简单"}],"a":"C","e":"4WD把动力传给前后桥，四轮都参与驱动，附着和通过性好，但需分动器等，结构复杂、能耗高。"},{"id":309,"oid":"A1-113","type":"single","module":"汽车概论与机械基础","q":"汽车发动机按冷却方式可分为水冷式和（　）。","opts":[{"k":"A","t":"风冷式"},{"k":"B","t":"油冷式"},{"k":"C","t":"自然冷却式"},{"k":"D","t":"液氮冷却式"}],"a":"A","e":"发动机按冷却方式分水冷（冷却液循环）和风冷（空气吹拂散热片）；现代汽车以水冷为主。"},{"id":310,"oid":"A1-114","type":"single","module":"汽车概论与机械基础","q":"下列部件中，属于纯电动汽车高压系统的是（　）。","opts":[{"k":"A","t":"12V蓄电池"},{"k":"B","t":"动力电池包、驱动电机及高压线束"},{"k":"C","t":"雨刮电机"},{"k":"D","t":"音响喇叭"}],"a":"B","e":"动力电池包、驱动电机、MCU和橙色高压线束属高压回路（数百伏）；12V蓄电池、雨刮、音响是低压设备。"},{"id":311,"oid":"A1-115","type":"single","module":"汽车概论与机械基础","q":"汽车底盘中，将动力减速增扭并最终传给驱动车轮的是（　）。","opts":[{"k":"A","t":"转向系"},{"k":"B","t":"行驶系"},{"k":"C","t":"传动系"},{"k":"D","t":"制动系"}],"a":"C","e":"传动系通过变速器、主减速器减速增扭并把动力传给驱动轮；转向、行驶、制动系不传递动力。"},{"id":312,"oid":"A1-116","type":"single","module":"汽车概论与机械基础","q":"对比增程式与普通插电混动，判断两者本质区别的关键构造特征是（　）。","opts":[{"k":"A","t":"是否装有动力电池"},{"k":"B","t":"发动机是否直接驱动车轮"},{"k":"C","t":"是否装有驱动电机"},{"k":"D","t":"是否装有车轮"}],"a":"B","e":"增程发动机只发电不直驱车轮，插电混动发动机可经变速器直接驱动车轮；两者都有电池、电机和车轮。"},{"id":313,"oid":"A1-117","type":"single","module":"汽车概论与机械基础","q":"现代轿车普遍采用的车身承载形式是（　）。","opts":[{"k":"A","t":"非承载式车身"},{"k":"B","t":"承载式车身"},{"k":"C","t":"半承载式车身"},{"k":"D","t":"框架式车身"}],"a":"B","e":"承载式车身无独立车架、车身承全部载荷，轻而低，轿车广泛采用；非承载式有独立车架，多用于货车、越野。"},{"id":314,"oid":"A1-118","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车相比传统燃油汽车，需要重点遵守的特殊安全操作是（　）。","opts":[{"k":"A","t":"断电下电、防止高压触电"},{"k":"B","t":"防止机油泄漏"},{"k":"C","t":"无任何特殊要求"},{"k":"D","t":"只需防火花"}],"a":"A","e":"纯电动车动力电池电压达数百伏，作业前必须下电、验电、绝缘防护防触电；这是其有别于燃油车的安全重点。"},{"id":315,"oid":"A1-119","type":"single","module":"汽车概论与机械基础","q":"汽车传动系中，离合器位于（　）之间。","opts":[{"k":"A","t":"发动机与变速器"},{"k":"B","t":"变速器与驱动桥"},{"k":"C","t":"车轮与车桥"},{"k":"D","t":"转向盘与转向器"}],"a":"A","e":"离合器装在发动机飞轮与变速器之间，负责切断和接合动力，便于起步和平顺换挡。"},{"id":316,"oid":"A1-120","type":"single","module":"汽车概论与机械基础","q":"下列关于新能源汽车动力蓄电池的说法，正确的是（　）。","opts":[{"k":"A","t":"电压都是12V"},{"k":"B","t":"是储存和供给电能的核心部件，电压通常为数百伏"},{"k":"C","t":"与传统汽车蓄电池完全相同"},{"k":"D","t":"不能反复充放电"}],"a":"B","e":"动力电池是电动车储能核心，电压多为300～800V；它可反复充放电，与12V起动蓄电池不同。"},{"id":317,"oid":"A1-121","type":"single","module":"汽车概论与机械基础","q":"汽车车身外部覆盖件不包括（　）。","opts":[{"k":"A","t":"发动机罩"},{"k":"B","t":"车门"},{"k":"C","t":"翼子板"},{"k":"D","t":"车架纵梁"}],"a":"D","e":"发动机罩、车门、翼子板是覆盖件；车架纵梁是承载骨架件，属车架（或承载车身结构件），不是覆盖件。"},{"id":318,"oid":"A1-122","type":"single","module":"汽车概论与机械基础","q":"关于纯电动汽车行驶噪声，正确的说法是（　）。","opts":[{"k":"A","t":"完全没有任何噪声"},{"k":"B","t":"取消了发动机噪声，但仍有路噪、风噪和电机噪声"},{"k":"C","t":"比燃油车噪声大得多"},{"k":"D","t":"只有发动机噪声"}],"a":"B","e":"纯电动车无发动机噪声，但轮胎路噪、风噪和电机噪声仍存在；低速时还需外部提示音提醒行人。"},{"id":319,"oid":"A1-123","type":"single","module":"汽车概论与机械基础","q":"汽车发动机的功用是将燃料燃烧的热能转化为（　）。","opts":[{"k":"A","t":"电能"},{"k":"B","t":"机械能"},{"k":"C","t":"化学能"},{"k":"D","t":"液压能"}],"a":"B","e":"发动机把燃料化学能经燃烧变热能，再通过曲柄连杆机构转为曲轴旋转的机械能对外输出。"},{"id":320,"oid":"A1-124","type":"single","module":"汽车概论与机械基础","q":"下列哪种车型在构造上同时具有“可外接充电的大容量动力电池＋发动机＋驱动电机”？（　）","opts":[{"k":"A","t":"传统燃油轿车"},{"k":"B","t":"纯电动汽车"},{"k":"C","t":"插电式混合动力汽车"},{"k":"D","t":"燃料电池汽车"}],"a":"C","e":"PHEV兼有发动机、驱动电机和可外接充电的大电池；燃油车无电机大电池，纯电无发动机，燃料电池以氢代电池。"},{"id":321,"oid":"A1-125","type":"single","module":"汽车概论与机械基础","q":"汽车行驶系中，用于缓和冲击、衰减振动的悬架部件是（　）。","opts":[{"k":"A","t":"车架与车桥"},{"k":"B","t":"弹性元件与减振器"},{"k":"C","t":"车轮与轮胎"},{"k":"D","t":"主减速器与差速器"}],"a":"B","e":"悬架由弹性元件缓冲冲击、减振器衰减振动；车架车桥是支承件，主减速器差速器属传动系。"},{"id":322,"oid":"A1-126","type":"single","module":"汽车概论与机械基础","q":"关于汽车布置形式FF、FR、RR，下列对应正确的是（　）。","opts":[{"k":"A","t":"FF—后置后驱"},{"k":"B","t":"FR—前置前驱"},{"k":"C","t":"RR—后置后驱"},{"k":"D","t":"FF—四轮驱动"}],"a":"C","e":"FF前置前驱、FR前置后驱、RR后置后驱、4WD四轮驱动；把FF、FR对应反了是常见错误。"},{"id":323,"oid":"A1-127","type":"single","module":"汽车概论与机械基础","q":"汽车电气设备普遍采用的供电制式是（　）。","opts":[{"k":"A","t":"高压交流电、正极搭铁"},{"k":"B","t":"低压直流电、负极搭铁"},{"k":"C","t":"高压直流电、双线制"},{"k":"D","t":"低压交流电"}],"a":"B","e":"汽车用12V/24V低压直流、单线制、负极搭铁；高压交流、双线制均与汽车电气实际不符。"},{"id":324,"oid":"A1-128","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车上保留12V低压蓄电池的主要作用是（　）。","opts":[{"k":"A","t":"驱动车辆行驶"},{"k":"B","t":"给高压动力电池充电"},{"k":"C","t":"为整车控制器等低压设备供电并作上下电控制电源"},{"k":"D","t":"储存全部刹车能量"}],"a":"C","e":"12V蓄电池给控制器、灯光等低压设备供电并参与上下电时序；驱动车辆靠动力电池，高压充电由OBC完成。"},{"id":325,"oid":"A1-129","type":"single","module":"汽车概论与机械基础","q":"下列属于汽车底盘制动系部件的是（　）。","opts":[{"k":"A","t":"离合器"},{"k":"B","t":"制动器"},{"k":"C","t":"变速器"},{"k":"D","t":"转向器"}],"a":"B","e":"制动器是制动系部件；离合器、变速器属传动系，转向器属转向系。"},{"id":326,"oid":"A1-130","type":"single","module":"汽车概论与机械基础","q":"与传统汽车相比，下列哪项不是纯电动汽车在构造上的主要变化（　）。","opts":[{"k":"A","t":"以驱动电机取代发动机"},{"k":"B","t":"以动力电池取代燃油箱"},{"k":"C","t":"取消了排气系统"},{"k":"D","t":"保留了传统的多挡手动变速器"}],"a":"D","e":"纯电动车以电机代发动机、以电池代油箱、取消排气；因电机低速大转矩，一般不保留多挡手动变速器。"},{"id":327,"oid":"A1-131","type":"single","module":"汽车概论与机械基础","q":"按车身承载方式，越野车和货车常采用（　）。","opts":[{"k":"A","t":"承载式车身"},{"k":"B","t":"非承载式车身（有独立车架）"},{"k":"C","t":"无车架车身"},{"k":"D","t":"半骨架式车身"}],"a":"B","e":"非承载式车身有独立车架，刚度大、承载强，适合货车和越野车；轿车多用承载式车身。"},{"id":328,"oid":"A1-132","type":"single","module":"汽车概论与机械基础","q":"关于交流异步（感应）驱动电机，下列说法正确的是（　）。","opts":[{"k":"A","t":"必须使用永磁体"},{"k":"B","t":"结构简单坚固、免维护，但效率通常略低于永磁同步电机"},{"k":"C","t":"不能调速"},{"k":"D","t":"只能单向旋转"}],"a":"B","e":"异步电机靠旋转磁场感应产生转矩，转子无永磁体、坚固耐用，可变频调速正反转，但效率略低于永磁同步。"},{"id":329,"oid":"A1-133","type":"single","module":"汽车概论与机械基础","q":"汽车传动系中，变速器的主要功用是（　）。","opts":[{"k":"A","t":"改变传动比，扩大转矩和转速变化范围，并可实现倒向行驶"},{"k":"B","t":"产生动力"},{"k":"C","t":"制动"},{"k":"D","t":"转向"}],"a":"A","e":"变速器通过不同挡位改变传动比，扩大车速和转矩范围，设空挡和倒挡；产生动力是发动机，制动转向另有其系。"},{"id":330,"oid":"A1-134","type":"single","module":"汽车概论与机械基础","q":"下列关于燃料电池汽车的说法，错误的是（　）。","opts":[{"k":"A","t":"以氢气为燃料"},{"k":"B","t":"燃料电池堆将化学能转化为电能"},{"k":"C","t":"行驶中排放二氧化碳"},{"k":"D","t":"仍需驱动电机驱动车轮"}],"a":"C","e":"燃料电池车氢氧反应只生成水，不排CO2；说它排放二氧化碳是错误的。"},{"id":331,"oid":"A1-135","type":"single","module":"汽车概论与机械基础","q":"汽车车身的基础件是（　）。","opts":[{"k":"A","t":"车身壳体"},{"k":"B","t":"座椅"},{"k":"C","t":"仪表板"},{"k":"D","t":"保险杠"}],"a":"A","e":"车身壳体是承载基础件，覆盖件和内外饰都安装其上；座椅、仪表板、保险杠为附件或装饰件。"},{"id":332,"oid":"A1-136","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车的制动系统在传统液压制动基础上，多了（　）协同工作。","opts":[{"k":"A","t":"再生制动（能量回收）"},{"k":"B","t":"鼓式制动"},{"k":"C","t":"盘式制动"},{"k":"D","t":"驻车制动"}],"a":"A","e":"电动车制动时电机再生制动与液压制动协同，优先回收能量；鼓式、盘式是制动器结构，驻车制动本就有。"},{"id":333,"oid":"A1-137","type":"single","module":"汽车概论与机械基础","q":"下列部件中属于发动机的是（　）。","opts":[{"k":"A","t":"把燃料化学能转化为机械能的动力装置"},{"k":"B","t":"把电能转化为光能的装置"},{"k":"C","t":"储存电能的装置"},{"k":"D","t":"传递转向力的装置"}],"a":"A","e":"发动机是把燃料化学能转为机械能的动力装置；灯光、蓄电池、转向器分别是照明、储能和转向部件。"},{"id":334,"oid":"A1-138","type":"single","module":"汽车概论与机械基础","q":"增程式电动汽车长途行驶时，正确的能量流动路线是（　）。","opts":[{"k":"A","t":"发动机→车轮"},{"k":"B","t":"发动机→发电机→动力电池/驱动电机→车轮"},{"k":"C","t":"车轮→发动机"},{"k":"D","t":"动力电池→发动机"}],"a":"B","e":"增程发动机只驱动发电机发电，电能供驱动电机驱车轮（必要时充电池），发动机并不直驱车轮。"},{"id":335,"oid":"A1-139","type":"single","module":"汽车概论与机械基础","q":"汽车电气设备中，用来起动发动机的是（　）。","opts":[{"k":"A","t":"发电机"},{"k":"B","t":"起动机"},{"k":"C","t":"蓄电池"},{"k":"D","t":"点火线圈"}],"a":"B","e":"起动机把蓄电池电能转为机械能带动曲轴起动发动机；发电机是运转后供电，点火线圈产生高压电。"},{"id":336,"oid":"A1-140","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车“三电”系统中，负责整车能量与扭矩分配协调的核心控制器组合是（　）。","opts":[{"k":"A","t":"刹车灯开关与点烟器"},{"k":"B","t":"整车控制器VCU、电机控制器MCU和电池管理系统BMS"},{"k":"C","t":"雨刮继电器与闪光器"},{"k":"D","t":"玻璃升降开关"}],"a":"B","e":"VCU统筹整车、MCU控制驱动电机、BMS管理动力电池，三者构成电控核心；其余均为低压小电器。"},{"id":337,"oid":"A1-141","type":"single","module":"汽车概论与机械基础","q":"现代汽车发动机普遍使用的两大燃料是汽油和（　）。","opts":[{"k":"A","t":"煤"},{"k":"B","t":"柴油"},{"k":"C","t":"酒精"},{"k":"D","t":"煤气"}],"a":"B","e":"车用内燃机最常用汽油和柴油；煤、煤气不是车用燃料，酒精仅作掺烧燃料。"},{"id":338,"oid":"A1-142","type":"single","module":"汽车概论与机械基础","q":"关于纯电动汽车高压系统维修，正确的做法是（　）。","opts":[{"k":"A","t":"可直接拆解高压部件"},{"k":"B","t":"维修前应先断电下电、验电并做好绝缘防护"},{"k":"C","t":"高压与低压相同，无特殊要求"},{"k":"D","t":"不必等待电容放电"}],"a":"B","e":"高压维修须先断低压、拔维修开关、等待电容放电并验电、戴绝缘手套，否则有触电危险。"},{"id":339,"oid":"A1-143","type":"single","module":"汽车概论与机械基础","q":"汽车行驶系的作用是（　）。","opts":[{"k":"A","t":"支承汽车总质量，保证行驶平顺和操纵稳定"},{"k":"B","t":"产生动力"},{"k":"C","t":"改变车速"},{"k":"D","t":"点火"}],"a":"A","e":"行驶系支承整车质量，通过悬架和车轮缓和冲击、保证平顺与稳定；产生动力、变速、点火另有其系。"},{"id":340,"oid":"A1-144","type":"single","module":"汽车概论与机械基础","q":"现代纯电动汽车把大容量动力电池包平铺布置在车身底板上，其主要目的是（　）。","opts":[{"k":"A","t":"增大风阻"},{"k":"B","t":"降低整车重心、改善操纵稳定性并充分利用空间"},{"k":"C","t":"提高离地间隙"},{"k":"D","t":"便于拆卸油箱"}],"a":"B","e":"底盘平铺电池降低重心、提升操纵稳定性，且不占乘坐和行李空间；这是纯电动车总体布置的典型做法。"},{"id":341,"oid":"A1-145","type":"single","module":"汽车概论与机械基础","q":"汽车底盘转向系通过转动（　）来控制行驶方向。","opts":[{"k":"A","t":"离合器踏板"},{"k":"B","t":"转向盘"},{"k":"C","t":"制动踏板"},{"k":"D","t":"变速杆"}],"a":"B","e":"驾驶员转动转向盘，经转向器和传动机构偏转前轮控制方向；离合器、制动踏板和变速杆不控制方向。"},{"id":342,"oid":"A1-146","type":"single","module":"汽车概论与机械基础","q":"关于油电混合（HEV）与插电混合（PHEV），下列区别正确的是（　）。","opts":[{"k":"A","t":"HEV可外接充电，PHEV不能"},{"k":"B","t":"PHEV电池大、可外接充电纯电行驶，HEV电池小、不能外接充电"},{"k":"C","t":"两者构造完全相同"},{"k":"D","t":"HEV没有发动机"}],"a":"B","e":"PHEV电池大可外充短途纯电，HEV电池小不能外充、靠发动机和回收能量维持电量；两者都有发动机。"},{"id":343,"oid":"A1-147","type":"single","module":"汽车概论与机械基础","q":"下列属于汽车行驶系部件的是（　）。","opts":[{"k":"A","t":"车架"},{"k":"B","t":"喷油器"},{"k":"C","t":"火花塞"},{"k":"D","t":"机油泵"}],"a":"A","e":"车架（或承载车身）是行驶系基础件；喷油器、火花塞、机油泵都属发动机部件。"},{"id":344,"oid":"A1-148","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车中，把动力电池直流电逆变为三相交流电、控制驱动电机转速和转矩的部件是（　）。","opts":[{"k":"A","t":"车载充电机"},{"k":"B","t":"电机控制器（MCU）"},{"k":"C","t":"DC/DC转换器"},{"k":"D","t":"低压蓄电池"}],"a":"B","e":"MCU（电机控制器）把直流逆变为变频三相交流，调节电机转速转矩；OBC负责交流充电，DC/DC负责高压转低压。"},{"id":345,"oid":"A1-149","type":"single","module":"汽车概论与机械基础","q":"传统燃油车以油箱储存燃油，纯电动汽车则以（　）储存电能。","opts":[{"k":"A","t":"油箱"},{"k":"B","t":"动力蓄电池包"},{"k":"C","t":"储气罐"},{"k":"D","t":"水箱"}],"a":"B","e":"纯电动车以动力电池包储存电能，取代燃油车的油箱；储气罐用于天然气车或燃料电池车。"},{"id":346,"oid":"A1-150","type":"single","module":"汽车概论与机械基础","q":"关于承载式车身，下列说法正确的是（　）。","opts":[{"k":"A","t":"有独立车架"},{"k":"B","t":"取消独立车架、车身承受全部载荷，轿车广泛采用"},{"k":"C","t":"只用于货车"},{"k":"D","t":"车身不承受任何力"}],"a":"B","e":"承载式车身无独立车架、车身承全部载荷，质量轻重心低，轿车普遍采用；非承载式有车架，多用于货车。"},{"id":347,"oid":"A1-151","type":"single","module":"汽车概论与机械基础","q":"下列属于汽车电源的是（　）。","opts":[{"k":"A","t":"前照灯"},{"k":"B","t":"蓄电池"},{"k":"C","t":"雨刮器"},{"k":"D","t":"电动车窗"}],"a":"B","e":"蓄电池是电源之一；前照灯、雨刮器、电动车窗都是用电设备。"},{"id":348,"oid":"A1-152","type":"single","module":"汽车概论与机械基础","q":"某车既可纯电行驶、电量不足时发动机发电驱动电机，发动机也可在高效区直接驱动车轮，它最可能是（　）。","opts":[{"k":"A","t":"纯电动汽车"},{"k":"B","t":"增程式电动汽车"},{"k":"C","t":"插电式混合动力汽车"},{"k":"D","t":"燃料电池汽车"}],"a":"C","e":"发动机可直接驱动车轮是插电混动（含功率/并联混动）的特征；增程发动机不直驱，纯电无发动机，燃料电池以氢发电。"},{"id":349,"oid":"A1-153","type":"single","module":"汽车概论与机械基础","q":"汽车传动系中，万向传动装置主要用于连接（　）。","opts":[{"k":"A","t":"发动机与车轮"},{"k":"B","t":"变速器与驱动桥，适应二者间角度和距离变化"},{"k":"C","t":"转向盘与转向器"},{"k":"D","t":"制动器与车轮"}],"a":"B","e":"万向传动装置由万向节、传动轴等组成，连接变速器与驱动桥，适应悬架跳动引起的角度和距离变化。"},{"id":350,"oid":"A1-154","type":"single","module":"汽车概论与机械基础","q":"关于纯电动汽车取消发动机后的说法，错误的是（　）。","opts":[{"k":"A","t":"不需要更换机油"},{"k":"B","t":"没有排气污染"},{"k":"C","t":"仍需要冷却系统冷却电池和电机"},{"k":"D","t":"不再需要任何高压安全防护"}],"a":"D","e":"纯电动车虽无发动机，但有数百伏高压系统，仍须严格高压安全防护；说不需要防护是错误的。"},{"id":351,"oid":"A1-155","type":"single","module":"汽车概论与机械基础","q":"传统汽车常说的“三大件”一般指发动机、变速器和（　）。","opts":[{"k":"A","t":"底盘（含车桥传动）"},{"k":"B","t":"音响"},{"k":"C","t":"座椅"},{"k":"D","t":"空调"}],"a":"A","e":"汽车三大件通常指发动机、变速器和底盘，是决定车辆性能和品质的核心总成；音响、座椅、空调为配置件。"},{"id":352,"oid":"A1-156","type":"single","module":"汽车概论与机械基础","q":"关于新能源汽车高压系统电压，正确的说法是（　）。","opts":[{"k":"A","t":"与普通汽车一样为12V"},{"k":"B","t":"动力电池电压一般为数百伏（300～800V），属高压危险回路"},{"k":"C","t":"只有24V"},{"k":"D","t":"为安全均低于6V"}],"a":"B","e":"动力电池电压多为300～800V直流，远高于安全电压，必须高压防护；12V、24V只是低压辅助系统。"},{"id":353,"oid":"A1-157","type":"single","module":"汽车概论与机械基础","q":"发动机前置、前轮驱动的布置形式，英文缩写是（　）。","opts":[{"k":"A","t":"FR"},{"k":"B","t":"FF"},{"k":"C","t":"RR"},{"k":"D","t":"4WD"}],"a":"B","e":"FF表示前置前驱（Front engine Front drive）；FR前置后驱、RR后置后驱、4WD四轮驱动。"},{"id":354,"oid":"A1-158","type":"single","module":"汽车概论与机械基础","q":"关于汽车底盘的功能，下列说法错误的是（　）。","opts":[{"k":"A","t":"传动系传递动力"},{"k":"B","t":"行驶系支承整车并保证行驶"},{"k":"C","t":"转向系控制方向"},{"k":"D","t":"底盘直接产生动力"}],"a":"D","e":"底盘承担传力、行驶、转向、制动，不产生动力；产生动力的是发动机。说底盘直接产生动力是错误的。"},{"id":355,"oid":"A1-159","type":"single","module":"汽车概论与机械基础","q":"下列部件中，属于纯电动汽车而不属于传统燃油汽车的是（　）。","opts":[{"k":"A","t":"驱动电机与动力电池"},{"k":"B","t":"散热器"},{"k":"C","t":"制动盘"},{"k":"D","t":"转向器"}],"a":"A","e":"驱动电机和动力电池是纯电动车特有的动力与储能部件；散热器、制动盘、转向器在两类车上都有。"},{"id":356,"oid":"A1-160","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车取消发动机后，其典型动力传递路线为（　）。","opts":[{"k":"A","t":"发动机→离合器→变速器→传动轴→车轮"},{"k":"B","t":"动力电池→电机控制器→驱动电机→减速器→驱动车轮"},{"k":"C","t":"油箱→化油器→发动机"},{"k":"D","t":"发电机→蓄电池"}],"a":"B","e":"纯电动车电能经MCU控制驱动电机，再经固定速比减速器驱车轮；A是燃油车路线，电动车无发动机和化油器。"},{"id":357,"oid":"A1-161","type":"single","module":"汽车概论与机械基础","q":"某技师对一辆可上绿牌的乘用车进行保养，发现该车既无机油滤清器也无排气消声器，却有橙色高压线束和一个12V蓄电池。据此判断该车最可能是（　）。","opts":[{"k":"A","t":"前置后驱柴油货车"},{"k":"B","t":"纯电动汽车"},{"k":"C","t":"普通汽油轿车"},{"k":"D","t":"天然气客车"}],"a":"B","e":"无机油滤清器、无排气消声器说明无发动机，有橙色高压线束说明是高压电驱动，保留12V蓄电池符合纯电动构造；柴油车、汽油车、天然气车都有发动机和排气系统。"},{"id":358,"oid":"A1-422","type":"judge","module":"汽车概论与机械基础","q":"活塞在下止点时，活塞顶离曲轴回转中心最近，即活塞处于气缸内的最低位置。","opts":[],"a":"√","e":"下止点是活塞顶离曲轴回转中心最近（气缸最低）位置；上止点则最远（最高）。题干表述与定义一致。"},{"id":359,"oid":"A1-423","type":"judge","module":"汽车概论与机械基础","q":"活塞行程是指活塞从一个止点运动到另一个止点所经过的距离，其值等于曲柄半径的两倍。","opts":[],"a":"√","e":"活塞行程S=2R（R为曲柄半径），即活塞上下止点间距离。说等于曲柄半径两倍正确。"},{"id":360,"oid":"A1-424","type":"judge","module":"汽车概论与机械基础","q":"气缸工作容积是指活塞位于上止点时活塞顶上方的空间容积。","opts":[],"a":"×","e":"活塞在上止点时活塞顶上方的容积是燃烧室容积Vc；工作容积是活塞上、下止点间扫过的容积，题干张冠李戴。"},{"id":361,"oid":"A1-425","type":"judge","module":"汽车概论与机械基础","q":"发动机排量是各气缸工作容积之和，常用单位为升（L）表示。","opts":[],"a":"√","e":"排量Vh=单缸工作容积Vs×气缸数i，是多缸工作容积之和，单位常用升（L）或毫升(mL)。"},{"id":362,"oid":"A1-426","type":"judge","module":"汽车概论与机械基础","q":"压缩比越大，说明燃烧室容积越大。","opts":[],"a":"×","e":"压缩比ε=气缸总容积Va/燃烧室容积Vc。压缩比越大意味着燃烧室容积相对总容积越小，气体被压缩得越厉害。"},{"id":363,"oid":"A1-427","type":"judge","module":"汽车概论与机械基础","q":"四缸发动机的排量等于单个气缸工作容积的四倍。","opts":[],"a":"√","e":"排量等于单缸工作容积乘以缸数，四缸即Vs×4，因此单缸容积×4就是发动机排量。"},{"id":364,"oid":"A1-428","type":"judge","module":"汽车概论与机械基础","q":"活塞从上止点运动到下止点所扫过的容积称为燃烧室容积。","opts":[],"a":"×","e":"上止点到下止点扫过的容积是气缸工作容积Vs；燃烧室容积是活塞在上止点时活塞顶上方的最小容积。"},{"id":365,"oid":"A1-429","type":"judge","module":"汽车概论与机械基础","q":"气缸总容积等于气缸工作容积与燃烧室容积之和，即Va=Vs+Vc。","opts":[],"a":"√","e":"下止点时气缸内最大容积（总容积）=工作容积Vs+活塞在上止点时剩下的燃烧室容积Vc，公式正确。"},{"id":366,"oid":"A1-430","type":"judge","module":"汽车概论与机械基础","q":"汽油机的压缩比一般比柴油机高。","opts":[],"a":"×","e":"柴油机压缩比约15～22，汽油机约8～11，柴油机远高于汽油机，因为柴油靠压缩自燃需要更高压缩终温。"},{"id":367,"oid":"A1-431","type":"judge","module":"汽车概论与机械基础","q":"柴油机的压缩比通常为15～22，明显高于汽油机的8～11。","opts":[],"a":"√","e":"柴油机靠压缩自燃，压缩终了温度须超过柴油自燃点，故压缩比高；汽油机受爆燃限制压缩比较低。"},{"id":368,"oid":"A1-432","type":"judge","module":"汽车概论与机械基础","q":"上止点是活塞顶离曲轴回转中心最近的位置。","opts":[],"a":"×","e":"上止点是活塞顶离曲轴回转中心最远（气缸最高）位置；离中心最近的是下止点，题干说反。"},{"id":369,"oid":"A1-433","type":"judge","module":"汽车概论与机械基础","q":"曲柄半径增大一倍，活塞行程也随之增大一倍。","opts":[],"a":"√","e":"活塞行程S=2R，与曲柄半径R成正比，R增大一倍则S也增大一倍。"},{"id":370,"oid":"A1-434","type":"judge","module":"汽车概论与机械基础","q":"发动机排量相同的情况下，气缸数越多，单个气缸的工作容积越小。","opts":[],"a":"√","e":"排量Vh=Vs×i，排量一定时缸数i越多，单缸工作容积Vs越小，多缸机运转也更平稳。"},{"id":371,"oid":"A1-435","type":"judge","module":"汽车概论与机械基础","q":"燃烧室容积是活塞位于上止点时，活塞顶与气缸盖之间的容积。","opts":[],"a":"√","e":"活塞在上止点时，活塞顶上方剩余的、由活塞顶、气缸盖底面与气缸壁围成的空间即燃烧室容积Vc。"},{"id":372,"oid":"A1-436","type":"judge","module":"汽车概论与机械基础","q":"压缩比是指气缸总容积与燃烧室容积的比值。","opts":[],"a":"√","e":"压缩比ε=Va/Vc=（Vs+Vc）/Vc，反映气体被压缩的程度，是发动机重要结构参数。"},{"id":373,"oid":"A1-437","type":"judge","module":"汽车概论与机械基础","q":"活塞在气缸内从一个止点运动到另一个止点（完成一个行程）时，曲轴转过180°。","opts":[],"a":"√","e":"一个活塞行程对应曲轴转角180°（半圈），四个行程共720°（两圈）。"},{"id":374,"oid":"A1-438","type":"judge","module":"汽车概论与机械基础","q":"一台四冲程四缸发动机，每完成一个工作循环曲轴都要转两圈。","opts":[],"a":"√","e":"四冲程发动机无论缸数多少，一个工作循环都经过进气、压缩、做功、排气四个行程，曲轴转两圈（720°）。"},{"id":375,"oid":"A1-439","type":"judge","module":"汽车概论与机械基础","q":"按所用燃料不同，发动机可分为汽油机、柴油机和气体燃料发动机等。","opts":[],"a":"√","e":"按燃料分类有汽油机、柴油机及以天然气、液化石油气等为燃料的气体燃料发动机。"},{"id":376,"oid":"A1-440","type":"judge","module":"汽车概论与机械基础","q":"按冷却方式不同，发动机可分为水冷式和风冷式两大类。","opts":[],"a":"√","e":"水冷依靠冷却液在水套中循环散热；风冷依靠空气直接吹拂散热片散热。"},{"id":377,"oid":"A1-441","type":"judge","module":"汽车概论与机械基础","q":"按气缸排列方式不同，发动机可分为直列式、V型和水平对置式等。","opts":[],"a":"√","e":"气缸单列排列为直列；两列成夹角为V型；两列成180°对置为水平对置式。"},{"id":378,"oid":"A1-442","type":"judge","module":"汽车概论与机械基础","q":"二冲程发动机曲轴每转一圈（360°）即完成一个工作循环。","opts":[],"a":"√","e":"二冲程发动机在曲轴转一圈内完成进气、压缩、做功、排气过程，而四冲程需转两圈。"},{"id":379,"oid":"A1-443","type":"judge","module":"汽车概论与机械基础","q":"四冲程发动机每完成一个工作循环，曲轴转过720°。","opts":[],"a":"√","e":"四个行程各180°，共720°，即曲轴转两圈完成一个工作循环。"},{"id":380,"oid":"A1-444","type":"judge","module":"汽车概论与机械基础","q":"增压发动机是指利用增压器将空气预先压缩后再充入气缸的发动机。","opts":[],"a":"√","e":"增压通过压气机提高进气密度，使更多空气进入气缸，从而可多喷油、提高功率转矩。"},{"id":381,"oid":"A1-445","type":"judge","module":"汽车概论与机械基础","q":"一般压缩比高的发动机热效率较高，但汽油机压缩比过高容易发生爆燃。","opts":[],"a":"√","e":"压缩比高热效率高；但汽油机混合气火花点燃后末端易自燃产生爆燃，故压缩比受爆燃限制。"},{"id":382,"oid":"A1-446","type":"judge","module":"汽车概论与机械基础","q":"发动机的气缸工作容积又称为单缸排量。","opts":[],"a":"√","e":"单个气缸的工作容积Vs即该缸排量，乘以缸数即为发动机总排量。"},{"id":383,"oid":"A1-447","type":"judge","module":"汽车概论与机械基础","q":"已知气缸直径和活塞行程，就可以计算出单缸工作容积。","opts":[],"a":"√","e":"单缸工作容积Vs=πD²S/4，只要知道气缸直径D和活塞行程S即可算出。"},{"id":384,"oid":"A1-448","type":"judge","module":"汽车概论与机械基础","q":"活塞行程等于曲柄半径的长度。","opts":[],"a":"×","e":"活塞行程S=2R，是曲柄半径的两倍，而不是等于曲柄半径。"},{"id":385,"oid":"A1-449","type":"judge","module":"汽车概论与机械基础","q":"压缩比ε=10时，燃烧室容积约占气缸总容积的十分之一。","opts":[],"a":"√","e":"ε=Va/Vc=10，即Vc=Va/10，燃烧室容积占总容积的1/10。"},{"id":386,"oid":"A1-450","type":"judge","module":"汽车概论与机械基础","q":"风冷式发动机依靠空气直接吹拂气缸体、气缸盖外表面的散热片散热。","opts":[],"a":"√","e":"风冷发动机在缸体缸盖上铸有散热片增大散热面积，由风扇或行驶气流直接冷却。"},{"id":387,"oid":"A1-451","type":"judge","module":"汽车概论与机械基础","q":"发动机型号中的数字符号通常表示气缸数等结构参数。","opts":[],"a":"√","e":"国产发动机型号首部一般由缸数、缸径等组成，如“6100”表示6缸、缸径100mm。"},{"id":388,"oid":"A1-452","type":"judge","module":"汽车概论与机械基础","q":"上止点与下止点之间的距离称为活塞行程（冲程）。","opts":[],"a":"√","e":"活塞上下止点间的距离即一个行程的长度，也称冲程。"},{"id":389,"oid":"A1-453","type":"judge","module":"汽车概论与机械基础","q":"同一台发动机，气缸总容积减去燃烧室容积等于气缸工作容积。","opts":[],"a":"√","e":"由Va=Vs+Vc可得Vs=Va−Vc，总容积减燃烧室容积即为工作容积。"},{"id":390,"oid":"A1-454","type":"judge","module":"汽车概论与机械基础","q":"汽油机的压缩比一般约为8～11。","opts":[],"a":"√","e":"现代汽油机压缩比多在8～11之间，部分高压缩比机型可更高，但受爆燃限制。"},{"id":391,"oid":"A1-455","type":"judge","module":"汽车概论与机械基础","q":"柴油机的压缩比一般约为6～8。","opts":[],"a":"×","e":"柴油机压缩比约15～22；6～8是过低的数值，那样压缩终温不足以使柴油自燃。"},{"id":392,"oid":"A1-456","type":"judge","module":"汽车概论与机械基础","q":"增压可以提高进气密度，从而提高发动机的功率和转矩。","opts":[],"a":"√","e":"增压器压缩空气使进气密度增大，可充入更多空气并相应增加喷油量，提升功率转矩。"},{"id":393,"oid":"A1-457","type":"judge","module":"汽车概论与机械基础","q":"按进气方式不同，发动机可分为自然吸气式和增压式。","opts":[],"a":"√","e":"自然吸气靠活塞下行产生真空吸入空气；增压式靠增压器压入空气。"},{"id":394,"oid":"A1-458","type":"judge","module":"汽车概论与机械基础","q":"V型发动机左右两列气缸呈V形排列，相比直列发动机机体更短、结构更紧凑。","opts":[],"a":"√","e":"V型两列气缸成夹角布置，缩短了机体长度，降低高度并使布置紧凑，多用于大排量机型。"},{"id":395,"oid":"A1-459","type":"judge","module":"汽车概论与机械基础","q":"活塞从下止点运动到上止点时，曲轴转过180°。","opts":[],"a":"√","e":"无论上行下行，一个活塞行程都对应曲轴转角180°。"},{"id":396,"oid":"A1-460","type":"judge","module":"汽车概论与机械基础","q":"在其他条件相同时，增大发动机排量一般可提高输出功率和转矩。","opts":[],"a":"√","e":"排量大意味着每循环可进入的可燃混合气量多，做功能力强，功率转矩通常更高。"},{"id":397,"oid":"A1-461","type":"judge","module":"汽车概论与机械基础","q":"发动机常用符号中，燃烧室容积用Vc表示，工作容积用Vs表示，总容积用Va表示。","opts":[],"a":"√","e":"行业惯例：燃烧室容积Vc、气缸工作容积Vs、气缸总容积Va、压缩比ε。"},{"id":398,"oid":"A1-462","type":"judge","module":"汽车概论与机械基础","q":"压缩比是气缸工作容积与燃烧室容积之比。","opts":[],"a":"×","e":"压缩比是总容积Va与燃烧室容积Vc之比，即(Vs+Vc)/Vc，不是工作容积直接比燃烧室容积。"},{"id":399,"oid":"A1-463","type":"judge","module":"汽车概论与机械基础","q":"水冷发动机利用冷却液在气缸体和气缸盖的水套中循环流动带走热量。","opts":[],"a":"√","e":"水冷通过水泵驱动冷却液在水套内循环，把高温零件热量带到散热器散出。"},{"id":400,"oid":"A1-464","type":"judge","module":"汽车概论与机械基础","q":"柴油机压缩比较高，压缩终了缸内气体温度很高，可使喷入的柴油自行着火。","opts":[],"a":"√","e":"柴油机压缩终温超过柴油自燃点，喷油后自行燃烧，这就是压燃方式。"},{"id":401,"oid":"A1-465","type":"judge","module":"汽车概论与机械基础","q":"与四冲程发动机相比，二冲程发动机结构简单、体积小、功率密度高。","opts":[],"a":"√","e":"二冲程省去了专门的进排气行程，结构简单、体积小、同排量功率较高，但换气质量较差。"},{"id":402,"oid":"A1-466","type":"judge","module":"汽车概论与机械基础","q":"汽油机压缩比过高时，气缸内容易产生爆燃（爆震）。","opts":[],"a":"√","e":"压缩比过高使末端混合气温度压力升高，在火焰到达前自行爆燃，产生爆敲声并损坏机件。"},{"id":403,"oid":"A1-467","type":"judge","module":"汽车概论与机械基础","q":"活塞在两个止点之间往复运动，活塞每走完一个单程即称为一个行程（冲程）。","opts":[],"a":"√","e":"一个行程指活塞从一个止点到另一个止点的单程运动。"},{"id":404,"oid":"A1-468","type":"judge","module":"汽车概论与机械基础","q":"一台四缸发动机排量为2.0L，则单缸工作容积为0.5L。","opts":[],"a":"√","e":"排量=单缸容积×缸数，2.0L÷4=0.5L，即每缸工作容积0.5升。"},{"id":405,"oid":"A1-469","type":"judge","module":"汽车概论与机械基础","q":"按活塞运动方式不同，发动机可分为往复活塞式和旋转活塞式。","opts":[],"a":"√","e":"汽车广泛采用往复活塞式；转子发动机则是旋转活塞式（三角转子）。"},{"id":406,"oid":"A1-470","type":"judge","module":"汽车概论与机械基础","q":"气缸总容积Va=Vs+Vc，压缩比ε=Va/Vc，两者关系一致。","opts":[],"a":"√","e":"总容积为工作容积加燃烧室容积，压缩比为总容积与燃烧室容积之比，公式自洽。"},{"id":407,"oid":"A1-471","type":"single","module":"汽车概论与机械基础","q":"活塞顶离曲轴回转中心最近时所处的位置称为（　）。","opts":[{"k":"A","t":"上止点"},{"k":"B","t":"下止点"},{"k":"C","t":"压缩终点"},{"k":"D","t":"做功起点"}],"a":"B","e":"下止点是活塞顶离曲轴回转中心最近、即气缸内最低位置；上止点离中心最远。"},{"id":408,"oid":"A1-472","type":"single","module":"汽车概论与机械基础","q":"活塞从一个止点运动到另一个止点所经过的距离称为（　）。","opts":[{"k":"A","t":"气缸直径"},{"k":"B","t":"活塞行程"},{"k":"C","t":"曲柄半径"},{"k":"D","t":"燃烧室高度"}],"a":"B","e":"活塞上下止点间的距离即活塞行程（冲程），S=2R；它不是缸径、曲柄半径或燃烧室高度。"},{"id":409,"oid":"A1-473","type":"single","module":"汽车概论与机械基础","q":"活塞位于上止点时，活塞顶上方的空间容积称为（　）。","opts":[{"k":"A","t":"气缸工作容积"},{"k":"B","t":"燃烧室容积"},{"k":"C","t":"气缸总容积"},{"k":"D","t":"发动机排量"}],"a":"B","e":"上止点时活塞顶与缸盖之间的最小容积即燃烧室容积Vc；工作容积是上下止点间扫过的容积。"},{"id":410,"oid":"A1-474","type":"single","module":"汽车概论与机械基础","q":"多缸发动机各气缸工作容积之和称为（　）。","opts":[{"k":"A","t":"燃烧室容积"},{"k":"B","t":"气缸总容积"},{"k":"C","t":"发动机排量"},{"k":"D","t":"工作循环容积"}],"a":"C","e":"发动机排量Vh=单缸工作容积Vs×缸数i，是各缸工作容积之和；单缸总容积是Va=Vs+Vc。"},{"id":411,"oid":"A1-475","type":"single","module":"汽车概论与机械基础","q":"气缸总容积与燃烧室容积的比值称为（　）。","opts":[{"k":"A","t":"压缩比"},{"k":"B","t":"行程比"},{"k":"C","t":"缸径比"},{"k":"D","t":"充气效率"}],"a":"A","e":"压缩比ε=Va/Vc，反映气体被压缩的程度；它不是行程比、缸径比或充气效率。"},{"id":412,"oid":"A1-476","type":"single","module":"汽车概论与机械基础","q":"活塞从上止点到下止点所扫过的容积是（　）。","opts":[{"k":"A","t":"燃烧室容积"},{"k":"B","t":"气缸工作容积"},{"k":"C","t":"气缸总容积"},{"k":"D","t":"余隙容积"}],"a":"B","e":"工作容积Vs即活塞上止点到下止点扫过的容积；燃烧室容积是上止点时剩余的容积。"},{"id":413,"oid":"A1-477","type":"single","module":"汽车概论与机械基础","q":"活塞行程S与曲柄半径R的关系是（　）。","opts":[{"k":"A","t":"S=R"},{"k":"B","t":"S=2R"},{"k":"C","t":"S=R/2"},{"k":"D","t":"S=πR"}],"a":"B","e":"曲柄每转一周，活塞上下往复一次，行程等于曲柄销圆周直径，即S=2R。"},{"id":414,"oid":"A1-478","type":"single","module":"汽车概论与机械基础","q":"燃烧室容积的惯用符号是（　）。","opts":[{"k":"A","t":"Vs"},{"k":"B","t":"Va"},{"k":"C","t":"Vc"},{"k":"D","t":"Vh"}],"a":"C","e":"燃烧室容积记作Vc；Vs为工作容积，Va为总容积，Vh为发动机排量。"},{"id":415,"oid":"A1-479","type":"single","module":"汽车概论与机械基础","q":"发动机排量的常用单位是（　）。","opts":[{"k":"A","t":"千克（kg）"},{"k":"B","t":"升（L）"},{"k":"C","t":"千瓦（kW）"},{"k":"D","t":"牛·米（N·m）"}],"a":"B","e":"排量是容积，常用升（L）或毫升(mL)；千克是质量、千瓦是功率、牛·米是转矩单位。"},{"id":416,"oid":"A1-480","type":"single","module":"汽车概论与机械基础","q":"汽油机的压缩比一般约为（　）。","opts":[{"k":"A","t":"4～6"},{"k":"B","t":"8～11"},{"k":"C","t":"15～22"},{"k":"D","t":"25～30"}],"a":"B","e":"汽油机压缩比约8～11，受爆燃限制；15～22是柴油机范围，其余过低过高。"},{"id":417,"oid":"A1-481","type":"single","module":"汽车概论与机械基础","q":"柴油机的压缩比一般约为（　）。","opts":[{"k":"A","t":"4～6"},{"k":"B","t":"8～11"},{"k":"C","t":"16～22"},{"k":"D","t":"25～35"}],"a":"C","e":"柴油机靠压缩自燃，压缩比约16～22；8～11是汽油机范围。"},
