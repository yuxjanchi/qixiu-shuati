前充电、推后感应”。"}, {"id": 144, "oid": "D1-08", "type": "single", "module": "汽车电子与电器维修", "q": "三相交流电源的三相电压相位依次相差（　）。", "opts": [{"k": "A", "t": "60°"}, {"k": "B", "t": "90°"}, {"k": "C", "t": "120°"}, {"k": "D", "t": "180°"}], "a": "C", "e": "【考点】三相交流电的相位关系。\n【解析】三相对称交流电U、V、W三相电压大小相等、频率相同、相位依次相差120°电角度。故选C。\n【易错】三相相位差120°=360°÷3,把一周期均分成三段。不是90°(那是两相正交)。三相电的线电压380V=相电压220V×√3。"}, {"id": 145, "oid": "D1-09", "type": "judge", "module": "汽车电子与电器维修", "q": "三相绕组星形（Y形）连接时，线电压等于相电压；三角形（Δ形）连接时，线电压是相电压的√3倍。", "opts": [], "a": "×", "e": "【考点】三相绕组星形与三角形连接的电压关系。\n【解析】星形(Y形)连接:线电压=√3×相电压,线电流=相电流;三角形(Δ形)连接:线电压=相电压,线电流=√3×相电流。题干把两者说反,判断为×。\n【易错】口诀:“Y高Δ低”或“星线压高”:只有星形连接才出现√3倍的线电压。380V/220V系统就是星形(相电压220V、线电压380V)。"}, {"id": 146, "oid": "D1-10", "type": "single", "module": "汽车电子与电器维修", "q": "汽车三相交流发电机定子绕组采用星形连接时，其线电压为14V，则每相绕组的相电压约为（　）。", "opts": [{"k": "A", "t": "8V"}, {"k": "B", "t": "14V"}, {"k": "C", "t": "24V"}, {"k": "D", "t": "7V"}], "a": "A", "e": "【考点】星形连接相电压计算。\n【解析】星形连接:线电压=√3×相电压,故相电压=线电压÷√3=14÷1.732≈8.1V,取8V。故选A。\n【易错】注意谁除√3:已知线电压求相电压→除以√3;已知相电压求线电压→乘以√3。14V是汽车发电机整流前的线电压,整流后约14V给蓄电池充电。"}, {"id": 147, "oid": "D1-11", "type": "single", "module": "汽车电子与电器维修", "q": "电磁继电器的工作原理是（　）。", "opts": [{"k": "A", "t": "利用电流的热效应"}, {"k": "B", "t": "利用电磁铁吸合带动触点通断电路"}, {"k": "C", "t": "利用静电感应"}, {"k": "D", "t": "利用晶体管的放大作用"}], "a": "B", "e": "【考点】电磁继电器的工作原理。\n【解析】电磁继电器:线圈通以小电流→铁芯产生电磁吸力→吸合衔铁→触点闭合/断开→控制大电流电路通断。实现“以小控大”、隔离控制电路与主电路。故选B。\n【易错】继电器=“电磁开关”(小电流控大电流);不是热效应(那是熔丝/热继电器)、不是静电感应、不是放大(那是三极管)。起动机、喇叭、大灯常用继电器。"}, {"id": 148, "oid": "D1-12", "type": "single", "module": "汽车电子与电器维修", "q": "直流电动机的工作原理是（　）。", "opts": [{"k": "A", "t": "通电导体在磁场中受电磁力作用而运动"}, {"k": "B", "t": "电磁感应产生电流"}, {"k": "C", "t": "电流的热效应"}, {"k": "D", "t": "压电效应"}], "a": "A", "e": "【考点】直流电动机的工作原理。\n【解析】直流电动机:通电导体(电枢绕组)在磁场中受电磁力(安培力)作用而转动,电能→机械能。B是发电机原理(电磁感应,机械能→电能)。故选A。\n【易错】“电动机靠安培力转、发电机靠电磁感应发电”,两者结构相似、原理可逆。记:电生力=电动机,磁生电=发电机。"}, {"id": 149, "oid": "D1-13", "type": "judge", "module": "汽车电子与电器维修", "q": "汽车点火线圈是一个降压变压器，将蓄电池的高压电降低为火花塞点火所需的低压电。", "opts": [], "a": "×", "e": "【考点】点火线圈是升压变压器。\n【解析】点火线圈是升压变压器:初级绕组匝数少(几百匝、电阻约1～2Ω),次级绕组匝数多(上万匝)。初级电流突然断开时,次级感应出1.5万～3万伏高压供火花塞跳火。题干说“降压”,错误,判断为×。\n【易错】“匝数比=电压比”:次级匝数多是高压的根源。点火线圈输出是高压不是低压,把它当“降压变压器”是常见误判。"}, {"id": 150, "oid": "D1-14", "type": "single", "module": "汽车电子与电器维修", "q": "步进电动机的特点是（　）。", "opts": [{"k": "A", "t": "连续旋转，转速可调"}, {"k": "B", "t": "按脉冲信号步进式转动，转角与脉冲数成正比"}, {"k": "C", "t": "只能正转不能反转"}, {"k": "D", "t": "需要高压驱动"}], "a": "B", "e": "【考点】步进电动机的特点。\n【解析】步进电动机按脉冲信号步进转动:每来一个脉冲转过固定步距角,转角与脉冲数成正比、转速与脉冲频率成正比,可精确控制位置。常用于怠速控制阀(ISC)等。故选B。\n【易错】“脉冲数定转角、频率定转速”是步进电机的两大特征。它不需要位置传感器即可开环精确定位。A“连续旋转”是一般直流电机的特点。"}, {"id": 151, "oid": "D1-15", "type": "single", "module": "汽车电子与电器维修", "q": "二极管最重要的特性是（　）。", "opts": [{"k": "A", "t": "放大作用"}, {"k": "B", "t": "单向导电性"}, {"k": "C", "t": "稳压作用"}, {"k": "D", "t": "开关作用"}], "a": "B", "e": "【考点】二极管的单向导电性。\n【解析】二极管核心特性是单向导电性:正向偏置导通、反向偏置截止,用于整流(交流变直流)、检波。稳压是稳压二极管特性,放大和开关是三极管的特性。故选B。\n【易错】“二极管=单向导电;三极管=放大开关;稳压管=稳压”。发电机整流器就是用6个二极管做三相桥式整流。"}, {"id": 152, "oid": "D1-16", "type": "judge", "module": "汽车电子与电器维修", "q": "汽车交流发电机中的整流器由晶闸管组成，作用是将蓄电池的直流电逆变为三相交流电。", "opts": [], "a": "×", "e": "【考点】发电机整流器的组成与作用。\n【解析】整流器由硅二极管组成(三相桥式整流,常见6只或9只),把定子产生的三相交流电整成直流电供全车使用并给蓄电池充电。题干说“晶闸管、直流变交流”,方向全错,判断为×。\n【易错】“二极管整流、交流变直流”;逆变才是“直流变交流”。晶闸管多用于大功率可控整流场合,不在发电机整流器上。"}, {"id": 153, "oid": "D1-17", "type": "single", "module": "汽车电子与电器维修", "q": "用万用表电阻挡检测二极管时，正常的检测现象是（　）。", "opts": [{"k": "A", "t": "正反向都导通"}, {"k": "B", "t": "正向导通（阻值小），反向截止（阻值大）"}, {"k": "C", "t": "正反向都截止"}, {"k": "D", "t": "正反向阻值相同"}], "a": "B", "e": "【考点】用万用表检测二极管。\n【解析】用万用表电阻挡测二极管:正向(红笔接P、黑笔接N)应导通阻值小;反向应截止阻值很大。正反都通=击穿短路,正反都断=断路损坏。故选B。\n【易错】判断好坏看正反阻值对比:正常=一大一小;短路=两个都小;断路=两个都大。测二极管要用指针表或用二极管挡,数字表电阻挡测正向有时显示不通属正常(导通压降0.6V)。"}, {"id": 154, "oid": "D1-18", "type": "judge", "module": "汽车电子与电器维修", "q": "三极管有电流放大作用，其放大能力用电流放大倍数β表示，基极电流的微小变化可引起集电极电流的较大变化。", "opts": [], "a": "√", "e": "【考点】三极管的电流放大作用。\n【解析】三极管在放大状态时Ic=β×Ib:基极微小电流变化控制集电极大电流变化,β为电流放大倍数。还可用作开关(饱和/截止)。题干正确,判断为√。\n【易错】“基极控集电极、β是放大倍数”。三极管两大用途:放大(模拟)和开关(数字)。点火模块、电压调节器内部都有三极管。"}, {"id": 155, "oid": "D2-01", "type": "single", "module": "汽车电子与电器维修", "q": "铅酸蓄电池的电解液是（　）。", "opts": [{"k": "A", "t": "稀盐酸"}, {"k": "B", "t": "稀硫酸"}, {"k": "C", "t": "蒸馏水"}, {"k": "D", "t": "氢氧化钠溶液"}], "a": "B", "e": "【考点】铅酸蓄电池的电解液。\n【解析】铅酸蓄电池电解液是稀硫酸(密度约1.26～1.28g/cm³,25℃),参与充放电化学反应。蒸馏水只用于补充液面(蒸发损失),不能当电解液用。故选B。\n【易错】“电解液=稀硫酸;补液=蒸馏水”。加自来水会引入杂质加速自放电和极板损坏。电解液密度是判断荷电状态的重要参数。"}, {"id": 156, "oid": "D2-02", "type": "judge", "module": "汽车电子与电器维修", "q": "蓄电池在放电过程中，正负极板上的活性物质逐渐转化为二氧化铅，电解液密度升高。", "opts": [], "a": "×", "e": "【考点】蓄电池放电过程的化学变化。\n【解析】放电时:正极PbO2和负极Pb都转化为硫酸铅PbSO4,同时消耗硫酸,电解液密度下降;充电时逆反应,密度回升。题干说“生成二氧化铅、密度升高”,错误,判断为×。\n【易错】“放电生硫酸铅、密度降;充电还原、密度升”。所以用密度计测密度可判断存电:密度高=电足,密度低=亏电。"}, {"id": 157, "oid": "D2-03", "type": "single", "module": "汽车电子与电器维修", "q": "蓄电池自行放电过快、存电不足，最可能的内部原因是（　）。", "opts": [{"k": "A", "t": "电解液密度过高"}, {"k": "B", "t": "极板硫化或内部短路"}, {"k": "C", "t": "液面过高"}, {"k": "D", "t": "外壳破裂"}], "a": "B", "e": "【考点】蓄电池自放电过快的原因。\n【解析】自放电(存放时电量自行流失)过快的内部原因:极板硫化(表面生成粗大硫酸铅结晶)、内部短路(隔板破损、沉积物搭桥)、电解液不纯(杂质形成微电池)。故选B。\n【易错】“自放电=内部原因”:硫化、短路、杂质。外壳破裂是外部物理损坏(漏液),液面过高/密度过高是使用不当,不是自放电主因。"}, {"id": 158, "oid": "D2-04", "type": "judge", "module": "汽车电子与电器维修", "q": "测量蓄电池端电压判断存电情况时，应在发动机运转状态下测量，此时读数最能反映蓄电池的实际存电。", "opts": [], "a": "×", "e": "【考点】蓄电池存电的正确测量方法。\n【解析】判断存电应在发动机熄火、蓄电池静置后测量端电压(约12.6V为满电),或用高率放电计带负载测量。发动机运转时发电机充电抬高端电压(13.5～14.5V),不能反映真实存电。题干说“运转时测”,错误,判断为×。\n【易错】“量电要在熄火静置后”。运转时量的是充电电压。高率放电计模拟起动大电流放电,能真实反映存电能力。"}, {"id": 159, "oid": "D2-05", "type": "single", "module": "汽车电子与电器维修", "q": "汽车交流发电机由转子、（　）、整流器、前后端盖及电刷等组成。", "opts": [{"k": "A", "t": "定子"}, {"k": "B", "t": "换向器"}, {"k": "C", "t": "磁极"}, {"k": "D", "t": "集电环"}], "a": "A", "e": "【考点】交流发电机的组成。\n【解析】交流发电机由转子(磁场绕组)、定子(三相电枢绕组)、整流器(二极管)、前后端盖、电刷与滑环组成。转子转、定子发感应电。故选A定子。\n【易错】“转子=磁场、定子=电枢(绕组)”。换向器是直流电机的部件,交流发电机用滑环+电刷给转子绕组供电,不用换向器。"}, {"id": 160, "oid": "D2-06", "type": "single", "module": "汽车电子与电器维修", "q": "发电机在汽车上的主要作用是（　）。", "opts": [{"k": "A", "t": "起动发动机"}, {"k": "B", "t": "在发动机运转时向用电设备供电并向蓄电池充电"}, {"k": "C", "t": "产生点火高压"}, {"k": "D", "t": "驱动空调压缩机"}], "a": "B", "e": "【考点】发电机在车上的作用。\n【解析】发电机由发动机皮带带动,在发动机运转时向全车用电设备供电,并给蓄电池充电,维持电气系统正常工作。故选B。\n【易错】“发电机供电充电、起动机起动、点火线圈升压”分工:发电机不参与起动,起动靠蓄电池给起动机供电。发电机不发电时全车靠蓄电池,灯越用越暗。"}, {"id": 161, "oid": "D2-07", "type": "judge", "module": "汽车电子与电器维修", "q": "用万用表电阻挡检测发电机定子绕组时，三相对中性点（星形连接）的电阻应基本相等，若某相电阻无穷大则说明该相断路。", "opts": [], "a": "√", "e": "【考点】发电机定子绕组的电阻检测。\n【解析】星形连接的定子三相绕组对称:各相绕组对中性点电阻应基本相等(约零点几欧)。某相无穷大=该相断路;阻值过小或近零=匝间短路或搭铁。题干正确,判断为√。\n【易错】“三相平衡”是判断依据:三相对中点阻值应一致。断路(∞)、短路(≈0)、正常(等值)三种结果要会区分。检测时注意表笔接触可靠。"}, {"id": 162, "oid": "D2-08", "type": "single", "module": "汽车电子与电器维修", "q": "汽车运行中充电指示灯常亮（不熄灭），说明（　）。", "opts": [{"k": "A", "t": "发电机不发电或充电电路故障"}, {"k": "B", "t": "蓄电池已充满"}, {"k": "C", "t": "大灯开启"}, {"k": "D", "t": "发动机转速过高"}], "a": "A", "e": "【考点】充电指示灯常亮的原因。\n【解析】发电机正常发电时,充电指示灯(经中性点电压控制或调节器控制)熄灭;常亮说明发电机不发电或其电路故障:皮带断裂打滑、转子励磁绕组断路、调节器损坏、整流二极管击穿等。故选A。\n【易错】“灯亮=不发电,灯灭=在发电”。蓄电池已充满、开大灯、转速过高都不会使指示灯常亮。诊断先查发电机皮带和输出。"}, {"id": 163, "oid": "D2-09", "type": "single", "module": "汽车电子与电器维修", "q": "汽车起动机由直流电动机、（　）和单向离合器（驱动机构）三部分组成。", "opts": [{"k": "A", "t": "传动机构"}, {"k": "B", "t": "整流器"}, {"k": "C", "t": "飞轮"}, {"k": "D", "t": "调节器"}], "a": "A", "e": "【考点】起动机的组成。\n【解析】起动机由三部分组成:直流串励电动机(产生扭矩)、传动机构(含单向离合器,啮合小齿轮带动飞轮)、控制装置(电磁开关,接通主电路)。故选A传动机构。\n【易错】“电动机+传动机构+控制装置”三件套。电磁开关=控制装置(兼安全),单向离合器=传动机构,整流器/调节器是发电机部件,别混。"}, {"id": 164, "oid": "D2-10", "type": "single", "module": "汽车电子与电器维修", "q": "起动机单向离合器的作用是（　）。", "opts": [{"k": "A", "t": "起动时单向传递扭矩，发动机起动后自动打滑，防止飞轮带动电枢超速旋转"}, {"k": "B", "t": "增大起动扭矩"}, {"k": "C", "t": "降低起动电流"}, {"k": "D", "t": "改变电动机旋转方向"}], "a": "A", "e": "【考点】起动机单向离合器的作用。\n【解析】单向离合器(滚柱式/摩擦片式)只允许单向传递扭矩:起动时电动机带动飞轮;发动机起动后,飞轮转速超过电枢时离合器自动打滑,防止飞轮反拖电枢超速旋转“飞散”损坏。故选A。\n【易错】“只传单向、防止飞车”是核心。没有单向离合器,发动机起动后会把起动机电枢带到上万转,甩断绕组。它不增扭、不调速。"}, {"id": 165, "oid": "D2-11", "type": "single", "module": "汽车电子与电器维修", "q": "接通起动开关后起动机只发出“咔”的一声或毫无反应，灯光明显变暗，最可能的原因是（　）。", "opts": [{"k": "A", "t": "蓄电池严重亏电或起动机内部短路"}, {"k": "B", "t": "点火开关接触不良"}, {"k": "C", "t": "起动机继电器线圈断路"}, {"k": "D", "t": "起动电路熔丝熔断"}], "a": "A", "e": "【考点】起动机无反应且灯光变暗的诊断。\n【解析】灯光明显变暗说明起动时电流巨大:蓄电池严重亏电(电压被拉垮)或起动机内部短路(绕组搭铁、电刷短路)都会瞬间大量放电。继电器断路、熔丝断、点火开关接触不良时电流小,灯光不会明显变暗。故选A。\n【易错】“灯暗=大电流”:先判断是电瓶亏电还是起动机短路——测量起动时蓄电池电压,或用万用表区分。咔的一声=电磁开关吸合但主电路接触不良或机械卡滞。"}, {"id": 166, "oid": "D2-12", "type": "judge", "module": "汽车电子与电器维修", "q": "起动机运转无力且转速低，蓄电池正常时，应重点检查电刷磨损、换向器烧蚀和轴承（衬套）磨损等机械电气原因。", "opts": [], "a": "√", "e": "【考点】起动机运转无力的原因。\n【解析】蓄电池正常时起动机无力,查起动机本身:电刷过度磨损(接触不良)、换向器脏污烧蚀、电刷弹簧弹力不足、绕组匝间短路、轴承衬套磨损致电枢扫膛。题干正确,判断为√。\n【易错】“电瓶好而无力=起动机内部问题”。检查顺序:电刷与换向器→绕组→轴承。换向器烧蚀可车削修复,电刷磨损超限更换。"}, {"id": 167, "oid": "D2-13", "type": "single", "module": "汽车电子与电器维修", "q": "传统（触点式）点火系统主要由点火线圈、分电器、火花塞和（　）等组成。", "opts": [{"k": "A", "t": "高压线"}, {"k": "B", "t": "喷油器"}, {"k": "C", "t": "起动继电器"}, {"k": "D", "t": "稳压器"}], "a": "A", "e": "【考点】传统点火系统的组成。\n【解析】传统点火系由蓄电池、点火开关、点火线圈、断电器(触点)、配电器(分电器)、高压线、火花塞组成:低压电路产生高压,按点火顺序送至各缸火花塞。故选A高压线。\n【易错】“点火系=低压变高压+按序点火”。断电器(触点)是传统点火的特征件,电控点火已取消。喷油器、稳压器不属于点火系。"}, {"id": 168, "oid": "D2-14", "type": "single", "module": "汽车电子与电器维修", "q": "火花塞的电极间隙过大会造成（　）。", "opts": [{"k": "A", "t": "点火电压要求升高，高速时易断火（失火）"}, {"k": "B", "t": "火花减弱"}, {"k": "C", "t": "点火提前角增大"}, {"k": "D", "t": "火花塞短路"}], "a": "A", "e": "【考点】火花塞电极间隙过大的后果。\n【解析】间隙过大→击穿电压要求升高→高速时次级电压不足→断火(失火);间隙过小→火花弱、易积炭短路。故选A。间隙按车型规定调整(普通火花塞约0.6～1.3mm)。\n【易错】“间隙大→断火,间隙小→火花弱积炭”。调整用塞尺弯侧电极。电极烧蚀后间隙变大,需定期检查调整或更换。"}, {"id": 169, "oid": "D2-15", "type": "judge", "module": "汽车电子与电器维修", "q": "电控点火系统用点火线圈直接（或经分电器）向火花塞提供高压电，其点火时刻由ECU根据发动机转速和负荷等信号精确控制。", "opts": [], "a": "√", "e": "【考点】电控点火系统的特点。\n【解析】电控点火系统由ECU根据转速、负荷等信号精确计算点火提前角,控制点火线圈初级电流通断时刻,还具有爆燃控制(爆震传感器反馈)、闭合角控制等功能,取代传统机械点火提前装置。题干正确,判断为√。\n【易错】“ECU算提前角+爆燃闭环”是电控点火核心优势。对比:传统点火靠离心/真空调节器机械调提前角。分电器式电控点火仍有分电器,但点火控制已电控。"}, {"id": 170, "oid": "D2-16", "type": "single", "module": "汽车电子与电器维修", "q": "某汽油机有一缸不工作，拔下该缸高压线做跳火试验火花正常，但装回后该缸仍不工作，最可能的原因是（　）。", "opts": [{"k": "A", "t": "火花塞损坏"}, {"k": "B", "t": "点火线圈损坏"}, {"k": "C", "t": "分电器盖裂纹"}, {"k": "D", "t": "蓄电池亏电"}], "a": "A", "e": "【考点】单缸不工作的故障判断。\n【解析】高压线跳火试验火花正常,说明点火线圈、分电器、高压线都正常,装回仍不工作→故障在火花塞本身(积炭、电极烧蚀、绝缘体击穿漏电)或该缸机械/供油(缸压、喷油)。故选A。\n【易错】“跳火正常≠火花塞正常”:火花塞装在缸内承受高温高压,绝缘体裂纹在缸内可能击穿。先换火花塞试,再查缸压和喷油。"}, {"id": 171, "oid": "D2-17", "type": "single", "module": "汽车电子与电器维修", "q": "汽车电路图中，表示搭铁（接地）的图形符号是（　）。", "opts": [{"k": "A", "t": "由长到短的横线汇聚的“伞形”符号"}, {"k": "B", "t": "一个圆圈"}, {"k": "C", "t": "一个箭头"}, {"k": "D", "t": "波浪线"}], "a": "A", "e": "【考点】电路图中的搭铁符号。\n【解析】搭铁(接地)符号是几根由长到短的横线汇聚呈“伞形”或“梳子形”,表示该点与车身(电源负极)相连。汽车采用单线制,用电设备经搭铁构成回路。故选A。\n【易错】“伞形/梳形符号=搭铁”。圆圈多表示接线端子/插接器,箭头表示连接方向或二极管方向,波浪线表示电阻或线圈。看图先认搭铁点。"}, {"id": 172, "oid": "D2-18", "type": "judge", "module": "汽车电子与电器维修", "q": "汽车电路普遍采用双线制：每个用电设备都需两根导线分别连接电源正极和负极，不通过车身搭铁构成回路。", "opts": [], "a": "×", "e": "【考点】汽车电路的单线制。\n【解析】汽车电路普遍采用单线制:电源正极用导线接到各用电设备,负极通过车身搭铁构成回路,利用车身作公共负极,节省导线、简化线路、方便检修。题干说“双线制”,错误,判断为×。\n【易错】“单线制=一根火线+车身搭铁”。只有少数需高绝缘的场合(如部分安全气囊、CAN总线屏蔽)用双线。搭铁不良是很多电器故障的根源。"}, {"id": 173, "oid": "D2-19", "type": "single", "module": "汽车电子与电器维修", "q": "识读汽车电路图时，一般应先（　）。", "opts": [{"k": "A", "t": "找到电源，沿“电源→熔丝→开关→用电器→搭铁”的回路逐条分析"}, {"k": "B", "t": "从用电器向电源方向倒推"}, {"k": "C", "t": "只看线束颜色和插接器"}, {"k": "D", "t": "先查熔丝盒位置"}], "a": "A", "e": "【考点】识读汽车电路图的方法。\n【解析】识读电路图应先找到电源(蓄电池/发电机),沿“电源→熔丝→开关→用电器→搭铁”的回路逐条分析,理清供电关系与控制逻辑。故选A。\n【易错】“先电源、后回路、按顺序找”。回路分析法是基础:任何用电设备都有“火线进来、搭铁回去”的完整回路。B倒推法会混乱,不推荐作为主方法。"}, {"id": 174, "oid": "D2-20", "type": "single", "module": "汽车电子与电器维修", "q": "汽车前照灯（大灯）的远光灯丝位于反射镜（　）。", "opts": [{"k": "A", "t": "焦点处"}, {"k": "B", "t": "焦点上方"}, {"k": "C", "t": "焦点下方"}, {"k": "D", "t": "反射镜前方"}], "a": "A", "e": "【考点】前照灯远光灯丝的位置。\n【解析】远光灯丝位于抛物面反射镜焦点处,经反射成为平行光束照向远方;近光灯丝位于焦点上方(偏前),反射光线向下偏折形成明暗截止线,防眩目。故选A。\n【易错】“远光在焦点=平行光射远;近光偏焦点上方=光线下压防眩”。这就是双灯丝灯泡(远/近光)的结构原理。改装氙气/LED大灯也要保持原焦点位置。"}, {"id": 175, "oid": "D2-21", "type": "single", "module": "汽车电子与电器维修", "q": "夜间行车对面来车时，应使用近光灯，其主要目的是（　）。", "opts": [{"k": "A", "t": "节约电能"}, {"k": "B", "t": "避免远光造成对方驾驶员眩目，保证会车安全"}, {"k": "C", "t": "延长灯泡寿命"}, {"k": "D", "t": "照亮路边行人"}], "a": "B", "e": "【考点】会车使用近光灯的目的。\n【解析】远光平行强烈,会使对向驾驶员眩目看不清路况,极易引发事故;会车切换近光,光束下压照亮车前路面而不眩目,是法规强制要求。故选B。\n【易错】“近光=防眩目”是核心,不是省电、延长寿命。会车不关远光是交通违法也是事故高发原因。记住:近光保安全,远光才看得远。"}, {"id": 176, "oid": "D2-22", "type": "judge", "module": "汽车电子与电器维修", "q": "前照灯光束调整（灯光校准）时，应按规定将车停放在水平地面、轮胎气压正常，按车辆规定距离对光屏调整光束的照射位置和高度。", "opts": [], "a": "√", "e": "【考点】前照灯光束调整条件。\n【解析】灯光调整条件:车辆空载(或规定载荷)、停放在水平地面、轮胎气压正常,按规定距离(一般10m)对光屏或检测仪调整近光明暗截止线位置和高度。题干正确,判断为√。\n【易错】“空载+平地+标准胎压+规定距离”四条件。光束过高会眩目、过低照射近看不清。调整的是近光(防眩目基准),远光随之。"}, {"id": 177, "oid": "D2-23", "type": "judge", "module": "汽车电子与电器维修", "q": "转向信号灯由制动灯开关控制而常亮，闪光器只用于控制危险报警灯（双闪）。", "opts": [], "a": "×", "e": "【考点】转向信号灯与闪光器。\n【解析】转向灯由闪光器控制,按60～120次/分频率闪烁;危险报警灯(双闪)也由闪光器控制(四灯同闪)。制动灯由制动灯开关控制、常亮不闪。题干说反,判断为×。\n【易错】“闪光器管转向和双闪,制动灯开关管刹车灯”。转向灯一侧不闪查灯泡和该侧线路,两侧都不闪查闪光器。双闪开关接通时四个转向灯同时闪。"}, {"id": 178, "oid": "D2-24", "type": "single", "module": "汽车电子与电器维修", "q": "踩下制动踏板时制动灯不亮，而灯泡完好，应首先检查（　）。", "opts": [{"k": "A", "t": "制动灯开关及其线路、熔丝"}, {"k": "B", "t": "发电机"}, {"k": "C", "t": "蓄电池电解液"}, {"k": "D", "t": "转向闪光器"}], "a": "A", "e": "【考点】制动灯不亮的诊断。\n【解析】灯泡完好而不亮:制动灯开关(踩踏板未闭合)、熔丝熔断、线路断路/搭铁不良。两侧都不亮优先查公共部分(开关、熔丝);单侧不亮查该侧灯泡线路。故选A。\n【易错】“先公共后局部”:先量开关两端电压,再查熔丝,最后查线路。制动灯开关装在制动踏板支架上,踩下闭合。"}, {"id": 179, "oid": "D2-25", "type": "single", "module": "汽车电子与电器维修", "q": "汽车组合仪表中，燃油表、水温表等指示仪表通常由（　）传感器提供信号。", "opts": [{"k": "A", "t": "燃油液位（浮子变阻式）和水温（热敏电阻式）传感器"}, {"k": "B", "t": "车速传感器"}, {"k": "C", "t": "曲轴位置传感器"}, {"k": "D", "t": "氧传感器"}], "a": "A", "e": "【考点】指示仪表的传感器。\n【解析】燃油表用油箱内浮子变阻式油位传感器(浮子升降带动滑片变阻);水温表用发动机热敏电阻式水温传感器(负温度系数,温度越高电阻越小)。故选A。\n【易错】“油表=浮子变阻,水温=热敏电阻”。水温传感器电阻随温度降低而增大(NTC负温度系数)。燃油表指针不稳常是浮子滑片接触不良。"}, {"id": 180, "oid": "D2-26", "type": "judge", "module": "汽车电子与电器维修", "q": "发动机运转中机油压力过低时，仪表盘上的机油压力报警灯会点亮报警，提醒驾驶员立即停车检查。", "opts": [], "a": "√", "e": "【考点】机油压力报警灯原理。\n【解析】机油压力开关(传感器)装在主油道,压力低于设定值(如0.05MPa)时触点闭合,点亮报警灯,提示润滑不足;压力正常时开关断开灯灭。题干正确,判断为√。\n【易错】“灯亮=压力低”。接通点火开关未起动时灯亮是自检正常,起动后应熄灭。运转中灯亮必须立即停车,否则烧瓦抱轴。"}, {"id": 181, "oid": "D2-27", "type": "single", "module": "汽车电子与电器维修", "q": "电动雨刮器一般由雨刮电动机、（　）和雨刮臂、刮片组成。", "opts": [{"k": "A", "t": "传动机构（蜗轮蜗杆减速及连杆）"}, {"k": "B", "t": "压缩机"}, {"k": "C", "t": "继电器"}, {"k": "D", "t": "真空泵"}], "a": "A", "e": "【考点】电动雨刮器的组成。\n【解析】雨刮器由雨刮电动机(永磁式)、传动机构(蜗轮蜗杆减速+曲柄连杆,把旋转变往复摆动)和雨刮臂、刮片组成。故选A。\n【易错】“电机减速+连杆换向往复”是雨刮结构核心。蜗轮蜗杆减速增大扭矩,曲柄连杆把旋转运动变成刮臂摆动。继电器只是控制元件。"}, {"id": 182, "oid": "D2-28", "type": "judge", "module": "汽车电子与电器维修", "q": "雨刮器不工作但能听到电动机“嗡嗡”声，多为传动机构卡滞或连杆脱落，应断电检查，防止电动机烧毁。", "opts": [], "a": "√", "e": "【考点】雨刮器堵转故障。\n【解析】电机有“嗡嗡”声但不转=传动机构卡滞或连杆脱落、球头脱开:电机堵转发热,长时间会烧毁。必须先断电,检查连杆机构、蜗轮蜗杆。题干正确,判断为√。\n【易错】“嗡嗡响不转=机械卡死,电机堵转”。先断电再检查是安全要求。试通电不能超过几秒。检查各铰接点球头和蜗杆齿轮。"}, {"id": 183, "oid": "D2-29", "type": "judge", "module": "汽车电子与电器维修", "q": "电动车窗电动机只能单向旋转，车窗玻璃的升降依靠机械装置强制改变运动方向实现。", "opts": [], "a": "×", "e": "【考点】电动车窗电动机的工作原理。\n【解析】电动车窗电动机是永磁直流电机,通过改变电枢电流方向(换向开关)改变旋转方向,经减速器和升降器实现玻璃升降,并非只能单向旋转。题干说反,判断为×。\n【易错】“换电流方向=电机反转”。升降开关是双向开关:上升一个方向、下降另一个方向。防夹功能靠电流检测或霍尔传感器。"}, {"id": 184, "oid": "D2-30", "type": "single", "module": "汽车电子与电器维修", "q": "中控门锁系统的作用是（　）。", "opts": [{"k": "A", "t": "集中控制全部车门锁止与开启"}, {"k": "B", "t": "只控制驾驶员车门"}, {"k": "C", "t": "仅用于防盗报警"}, {"k": "D", "t": "控制车窗升降"}], "a": "A", "e": "【考点】中控门锁的作用。\n【解析】中控门锁集中控制全部车门:驾驶员操作主开关(或遥控钥匙)可同时锁止/开启所有车门,方便安全,常与防盗系统联动。故选A。\n【易错】“中控=集中控制全车门”。不是只控驾驶员门、不只是防盗、不管车窗。遥控锁车时中控门锁与防盗器协同工作。"}, {"id": 185, "oid": "D2-31", "type": "single", "module": "汽车电子与电器维修", "q": "汽车音响系统一般由主机（收音机/CD/多媒体播放器）、功放和（　）组成。", "opts": [{"k": "A", "t": "扬声器（喇叭）"}, {"k": "B", "t": "压缩机"}, {"k": "C", "t": "发电机"}, {"k": "D", "t": "起动机"}], "a": "A", "e": "【考点】汽车音响系统的组成。\n【解析】汽车音响由音源主机(收音/CD/USB/蓝牙)、功率放大器(功放,或主机内置)和扬声器(喇叭)组成,可加低音炮、天线等。故选A扬声器。\n【易错】“主机+功放+扬声器”三部分。扬声器是最终发声元件。发电机、起动机、压缩机都是动力或辅助系统部件,与音响无关。"}, {"id": 186, "oid": "D3-01", "type": "single", "module": "汽车电子与电器维修", "q": "汽车空调制冷系统的四大主要部件是压缩机、冷凝器、（　）和蒸发器。", "opts": [{"k": "A", "t": "膨胀阀（节流装置）"}, {"k": "B", "t": "干燥器"}, {"k": "C", "t": "鼓风机"}, {"k": "D", "t": "节温器"}], "a": "A", "e": "【考点】空调制冷系统的四大部件。\n【解析】制冷系统四大件:压缩机(动力)、冷凝器(散热)、膨胀阀(节流)、蒸发器(吸热),经管路构成密封循环,制冷剂在其中流动。故选A。\n【易错】“压、冷、膨、蒸”四大件记牢。储液干燥器、鼓风机是辅助部件不是四大件。节温器是发动机冷却系部件,别混。"}, {"id": 187, "oid": "D3-02", "type": "judge", "module": "汽车电子与电器维修", "q": "空调压缩机将高温高压的气态制冷剂膨胀为低温低压液体，是制冷循环中的节流元件。", "opts": [], "a": "×", "e": "【考点】压缩机在制冷循环中的作用。\n【解析】压缩机吸入低压气态制冷剂,压缩成高温高压气体送入冷凝器,是制冷循环的动力源(“心脏”);节流降压的是膨胀阀。题干说压缩机是节流元件,错误,判断为×。\n【易错】“压缩机升压、膨胀阀降压”一压一降。制冷循环四步:压缩(升压)→冷凝(放热)→节流(降压)→蒸发(吸热)。记住谁干什么。"}, {"id": 188, "oid": "D3-03", "type": "single", "module": "汽车电子与电器维修", "q": "制冷循环中，制冷剂在蒸发器内发生的变化是（　）。", "opts": [{"k": "A", "t": "低压液态制冷剂蒸发吸热，使流过的空气降温"}, {"k": "B", "t": "高温高压气体冷凝放热"}, {"k": "C", "t": "制冷剂被压缩升压"}, {"k": "D", "t": "制冷剂节流降压"}], "a": "A", "e": "【考点】蒸发器中的制冷剂变化。\n【解析】高压液态制冷剂经膨胀阀节流后成低压低温状态进入蒸发器,在蒸发器内蒸发(沸腾)吸热,吸收车厢空气热量使空气降温;气态制冷剂被压缩机吸入再循环。故选A。\n【易错】“蒸发吸热”是制冷原理核心:液态变气态要吸热,所以蒸发器是“冷”的;气态变液态放热,冷凝器是“热”的。"}, {"id": 189, "oid": "D3-04", "type": "single", "module": "汽车电子与电器维修", "q": "冷凝器的作用是（　）。", "opts": [{"k": "A", "t": "使高温高压气态制冷剂冷凝放热，变为高压液态制冷剂"}, {"k": "B", "t": "使液态制冷剂蒸发吸热"}, {"k": "C", "t": "储存制冷剂并过滤杂质"}, {"k": "D", "t": "调节制冷剂流量"}], "a": "A", "e": "【考点】冷凝器的作用。\n【解析】冷凝器装在散热器前方,使高温高压气态制冷剂散热冷凝成高压液态制冷剂,放出热量由迎面风与风扇带走。故选A。\n【易错】“冷凝器=气变液放热”。蒸发器=液变气吸热。一放一吸对称记忆。C储液干燥器才是储存过滤水分,D膨胀阀调节流量。"}, {"id": 190, "oid": "D3-05", "type": "single", "module": "汽车电子与电器维修", "q": "储液干燥器（干燥瓶）的作用是（　）。", "opts": [{"k": "A", "t": "储存制冷剂、过滤杂质并吸收系统水分"}, {"k": "B", "t": "节流降压"}, {"k": "C", "t": "压缩制冷剂"}, {"k": "D", "t": "加热制冷剂"}], "a": "A", "e": "【考点】储液干燥器的作用。\n【解析】储液干燥器:储存和补充制冷剂、过滤杂质、用干燥剂吸收水分(防冰堵和腐蚀),带视液镜可观察制冷剂状态。故选A。\n【易错】“储液+过滤+干燥”三合一。干燥剂吸湿饱和后失效,所以维修拆开后要更换干燥器。视液镜看到气泡=制冷剂不足。"}, {"id": 191, "oid": "D3-06", "type": "judge", "module": "汽车电子与电器维修", "q": "膨胀阀安装在蒸发器入口处，通过节流降压使高压液态制冷剂变为低压低温状态，并随蒸发器出口过热变化自动调节制冷剂流量。", "opts": [], "a": "√", "e": "【考点】膨胀阀的安装与作用。\n【解析】膨胀阀装在蒸发器入口:节流降压,高压液态制冷剂变低压低温;感温包感知蒸发器出口温度,自动调节流量,保证出口有适当过热度,防液态制冷剂回液损坏压缩机。题干正确,判断为√。\n【易错】“膨胀阀=节流+自动调流量”。感温包感知出口温度控制阀开度:出口过热→开大,过冷→关小。防止“液击”(液态制冷剂进压缩机)"}, {"id": 192, "oid": "D3-07", "type": "single", "module": "汽车电子与电器维修", "q": "传统燃油汽车暖风装置利用（　）作为热源，将空气加热后送入车厢。", "opts": [{"k": "A", "t": "发动机冷却液的余热"}, {"k": "B", "t": "排气余热"}, {"k": "C", "t": "空调制冷剂"}, {"k": "D", "t": "蓄电池电能"}], "a": "A", "e": "【考点】燃油车暖风的热源。\n【解析】燃油车暖风利用发动机冷却液余热:冷却液流经暖风水箱(加热器芯),鼓风机把加热后的空气送入车厢。故选A。电动车无发动机余热,用PTC电加热。\n【易错】“暖风=冷却液余热”。暖风水箱与散热器是并联支路。冬季开暖风不费油(余热不用白不用),但会影响暖机速度。"}, {"id": 193, "oid": "D3-08", "type": "judge", "module": "汽车电子与电器维修", "q": "空调配风系统通过风道和风门（模式风门、温度风门）将冷风或热风按除霜、吹面、吹脚等模式送到车厢不同位置。", "opts": [], "a": "√", "e": "【考点】空调配风系统的组成。\n【解析】空调箱内风门(混风门调温度、模式风门调出风方向)由拉索或伺服电机驱动,把冷/热风按除霜、吹面、吹脚等模式分配到不同出风口。题干正确,判断为√。\n【易错】“模式风门管方向、温度风门管冷热”。伺服电机故障会导致出风模式卡死或只有单一出风口。双区空调左右各一个温度风门。"}, {"id": 194, "oid": "D3-09", "type": "judge", "module": "汽车电子与电器维修", "q": "空调制冷剂R134a与早期使用的R12（氟利昂）不可混用，检修时应使用专用压力表和加注设备。", "opts": [], "a": "√", "e": "【考点】R134a与R12的区分。\n【解析】R134a与R12接头规格不同(防止误加)、冷冻机油和密封件材料不同,混用会损坏系统;R12破坏臭氧层已被淘汰。检漏、回收、加注须用专用设备。题干正确,判断为√。\n【易错】“R134a≠R12”:接头尺寸就故意不同,防止加错。常见误区是把R12系统的油、密封圈用在R134a系统。加注口标注和专用表组要认准。"}, {"id": 195, "oid": "D3-10", "type": "single", "module": "汽车电子与电器维修", "q": "用歧管压力表（空调压力表组）判断系统状态时，发动机怠速、制冷正常时，低压侧压力一般为（　）。", "opts": [{"k": "A", "t": "0.15～0.25MPa"}, {"k": "B", "t": "0.5～0.7MPa"}, {"k": "C", "t": "1.3～1.6MPa"}, {"k": "D", "t": "2.0MPa以上"}], "a": "A", "e": "【考点】空调系统正常压力值。\n【解析】R134a系统怠速制冷正常:低压侧约0.15～0.25MPa,高压侧约1.3～1.6MPa(随环境温度略有变化)。故选A。低压过高/高压过低=压缩不良;高低压均高=制冷剂过多或冷凝不良。\n【易错】“低压0.2上下、高压1.4上下”记数量级。B0.5～0.7是中间值不像任何正常压力,C1.3～1.6是高压值(干扰项)。压力判断是空调检修基本功。"}, {"id": 196, "oid": "D3-11", "type": "single", "module": "汽车电子与电器维修", "q": "系统维修后加注制冷剂前，必须对系统进行（　）操作，否则水分和空气进入系统会造成冰堵、腐蚀和制冷不良。", "opts": [{"k": "A", "t": "抽真空（用真空泵排除系统内的水分和空气）"}, {"k": "B", "t": "直接加注"}, {"k": "C", "t": "检漏后直接加注"}, {"k": "D", "t": "排放系统内制冷剂"}], "a": "A", "e": "【考点】加注制冷剂前必须抽真空。\n【解析】系统维修后必须用真空泵抽真空(抽至规定真空度并保持稳定),排净水分和空气,否则水分在膨胀阀处结冰冰堵、空气混入造成压力异常和腐蚀。抽完再按规定量加注。故选A。\n【易错】“抽真空是加注前的铁律”。加注量按铭牌规定(g),多了高压过高、少了制冷差。检漏(保持真空度/充气保压)也是必要的。"}, {"id": 197, "oid": "D3-12", "type": "judge", "module": "汽车电子与电器维修", "q": "用电子检漏仪或荧光检漏法检查制冷系统泄漏点，是空调维修的常用手段；检漏应在系统有一定压力时进行。", "opts": [], "a": "√", "e": "【考点】制冷系统检漏方法。\n【解析】检漏应在系统有一定压力时进行:电子检漏仪探头沿接头管路缓慢移动检测泄漏,或注入荧光剂后用紫外灯观察。重点查接头、轴封、软管。题干正确,判断为√。\n【易错】“带压检漏才有效”。系统无压时检不出泄漏。电子检漏仪要远离风扇气流(影响判断),荧光检漏适合大漏点定位。"}, {"id": 198, "oid": "D3-13", "type": "single", "module": "汽车电子与电器维修", "q": "空调制冷不良，歧管压力表显示低压侧和高压侧压力都偏低，最可能的原因是（　）。", "opts": [{"k": "A", "t": "制冷剂不足（系统泄漏）"}, {"k": "B", "t": "制冷剂过多"}, {"k": "C", "t": "冷凝器堵塞"}, {"k": "D", "t": "蒸发器结霜"}], "a": "A", "e": "【考点】高低压都偏低的故障诊断。\n【解析】高低压均偏低=系统制冷剂量不足(泄漏),压缩机吸气排气都“吃不饱”,应检漏补漏后按规定量加注。制冷剂过多表现为高低压均偏高;冷凝器堵塞=高压过高。故选A。\n【易错】“都低=缺制冷剂,都高=多制冷剂”。这一对应关系是空调压力诊断的核心。蒸发器结霜导致风量小但压力不都低。"}, {"id": 199, "oid": "E1-01", "type": "judge", "module": "汽车维修工操作知识", "q": "汽车维修车间应配备灭火器材，汽油、机油等易燃物品可以存放在车间作业区附近，便于随时取用。", "opts": [], "a": "×", "e": "【考点】车间消防安全管理。\n【解析】汽油、机油等易燃物品必须存放在远离火源、通风良好的专用库房/区域,严禁堆放在作业区(火花、热源多);车间须按消防规定配备灭火器材并定期检查。题干说“可放在作业区附近”,错误,判断为×。\n【易错】“易燃品=专库存放+远离火源”。汽修车间火灾多为油品管理不当引发。灭火器要定期检查压力,保持有效期内。"}, {"id": 200, "oid": "E1-02", "type": "single", "module": "汽车维修工操作知识", "q": "更换下来的废机油、废电池、废防冻液等属于（　），必须按环保规定分类收集处理。", "opts": [{"k": "A", "t": "一般生活垃圾"}, {"k": "B", "t": "危险废物（HW类）"}, {"k": "C", "t": "可回收普通废品"}, {"k": "D", "t": "建筑垃圾"}], "a": "B", "e": "【考点】危险废物的分类处理。\n【解析】废机油、废电池、废防冻液、废制动液、含油棉纱等属于危险废物(HW类),随意倾倒会污染土壤水源,必须分类收集、标识、交有资质单位处理。故选B。\n【易错】“危险废物≠生活垃圾≠可回收”。废机油严禁倒入下水道或混入生活垃圾。这也是环保法规的要求,维修厂需建危废暂存间。"}, {"id": 201, "oid": "E1-03", "type": "single", "module": "汽车维修工操作知识", "q": "在烤漆房或喷漆作业中，除个人防护外，还应注意（　）。", "opts": [{"k": "A", "t": "关闭通风系统"}, {"k": "B", "t": "保持良好通风，防止油漆蒸气积聚引发火灾和中毒"}, {"k": "C", "t": "使用普通照明灯具"}, {"k": "D", "t": "打开门窗即可，无需其他措施"}], "a": "B", "e": "【考点】喷漆作业的安全要求。\n【解析】油漆溶剂蒸气易燃易爆且有毒性,喷漆作业必须保持良好通风排风、使用防爆灯具、佩戴防毒面具,防止蒸气积聚引发火灾、爆炸和职业中毒。故选B。\n【易错】“通风+防爆+防毒”三要求。关闭通风、用普通照明都是违章。烤漆房有强制排风系统和防爆电气,个人防护不能省。"}, {"id": 202, "oid": "E1-04", "type": "judge", "module": "汽车维修工操作知识", "q": "排放的废气（如发动机运转时）含有CO等有毒气体，维修车间应开启通风排气装置，避免长时间在密闭空间运转发动机。", "opts": [], "a": "√", "e": "【考点】发动机废气CO的危害与防护。\n【解析】废气中CO无色无味但毒性极强,密闭空间内易造成人员中毒死亡。车间试车、诊断时必须开启排风装置或把尾气接到室外。题干正确,判断为√。\n【易错】“CO无色无味=最危险”。密闭车库发动车是常见中毒事故源。诊断台架要接排气管。发现头晕恶心立即通风撤离。"}, {"id": 203, "oid": "E2-01", "type": "single", "module": "汽车维修工操作知识", "q": "汽车修理中，将螺栓按规定力矩拧紧时，应使用（　）。", "opts": [{"k": "A", "t": "普通扳手"}, {"k": "B", "t": "扭力扳手"}, {"k": "C", "t": "套筒扳手"}, {"k": "D", "t": "活动扳手"}], "a": "B", "e": "【考点】扭力扳手的使用。\n【解析】缸盖螺栓、连杆螺栓、主轴承盖螺栓等关键紧固件必须用扭力扳手按规定力矩分次(2～3次)均匀拧紧,防止力矩不足松动或过大变形损坏。故选B。\n【易错】“重要螺栓=扭力扳手”。普通扳手拧紧凭手感误差大。拧紧顺序一般由中间向两端,最终力矩分几次递增到位,拆时反向。"}, {"id": 204, "oid": "E2-02", "type": "judge", "module": "汽车维修工操作知识", "q": "拆卸配合较紧的轴承、齿轮等过盈配合件时，可直接用锤子猛击零件，这样拆卸速度快、效率高。", "opts": [], "a": "×", "e": "【考点】过盈配合件的拆卸方法。\n【解析】过盈配合件(轴承、齿轮、衬套等)必须用拉拔器(拉马)或专用工具沿轴向均匀施力拆卸,直接锤击会造成零件变形、破裂和伤人。题干说“直接锤击效率高”,错误,判断为×。\n【易错】“拉马拆过盈件”是铁律。锤击还会损伤轴颈和轴承滚道。实在要敲,也只能垫铜棒、铅棒轻敲非配合面。"}, {"id": 205, "oid": "E2-03", "type": "single", "module": "汽车维修工操作知识", "q": "装配时对螺纹紧固件涂抹密封胶或螺纹锁固胶的目的不包括（　）。", "opts": [{"k": "A", "t": "防松"}, {"k": "B", "t": "密封防漏"}, {"k": "C", "t": "防止螺纹锈蚀咬死"}, {"k": "D", "t": "增加螺纹强度"}], "a": "D", "e": "【考点】螺纹锁固胶的作用。\n【解析】螺纹胶用途:防松(振动不脱落)、密封防漏(胶封螺纹缝隙)、防锈蚀咬死。螺纹强度由材料、直径和热处理决定,与涂胶无关。故选D(题干问“不包括的”)。\n【易错】“防松、密封、防锈”是胶的三大作用,“增强强度”不是。别把螺纹胶当补强剂。关键部位按手册指定胶型和扭矩。"}, {"id": 206, "oid": "E2-04", "type": "judge", "module": "汽车维修工操作知识", "q": "拆卸下来的零件应按拆装顺序和部位分类摆放，重要零件做好标记，防止装错和丢失，这也是文明生产的基本要求。", "opts": [], "a": "√", "e": "【考点】拆装零件管理与文明生产。\n【解析】零件按拆装顺序和部位分类摆放、重要零件做标记(各缸活塞、气门、轴瓦位置),防止装错丢失,是装配正确的保证,也是文明生产(5S)基本要求。题干正确,判断为√。\n【易错】“分类摆放+做标记”防装错。活塞、气门、轴瓦都有配对标记,乱了会破坏配合。零件盘、标签、工位清洁都是文明生产内容。"}, {"id": 207, "oid": "E3-01", "type": "single", "module": "汽车维修工操作知识", "q": "零件清洗时，应选用的清洗剂是（　）。", "opts": [{"k": "A", "t": "汽油"}, {"k": "B", "t": "专用金属清洗剂（或柴油、煤油）"}, {"k": "C", "t": "强酸溶液"}, {"k": "D", "t": "自来水"}], "a": "B", "e": "【考点】零件清洗剂的选择。\n【解析】零件清洗应使用专用金属清洗剂(或柴油、煤油):汽油闪点低、易燃易挥发,大量使用极不安全;强酸会腐蚀零件;自来水洗不净油污还生锈。故选B。\n【易错】“专用清洗剂/柴油/煤油可用,汽油禁用”。工厂清洗机用碱性或水基清洗剂。洗后零件要吹干防锈。别图省事用汽油。"}, {"id": 208, "oid": "E3-02", "type": "judge", "module": "汽车维修工操作知识", "q": "零件检验凭经验目测即可判断零件是否可用，无需对照维修手册的标准值和使用极限进行测量。", "opts": [], "a": "×", "e": "【考点】零件检验的规范要求。\n【解析】检验零件必须对照维修手册的标准值和使用极限,用正确量具(千分尺、百分表、塞尺等)测量判断,不能凭目测经验。题干说“凭目测即可”,错误,判断为×。\n【易错】“手册标准+量具测量”是检验依据:轴颈圆度圆柱度、缸径、间隙都有规定值。目测只能看表面损伤,尺寸判断必须测量。"}, {"id": 209, "oid": "E3-03", "type": "single", "module": "汽车维修工操作知识", "q": "发动机大修时，气缸体、曲轴等关键件在检验合格后，装配前必须（　）。", "opts": [{"k": "A", "t": "彻底清洗零件，特别是油道、水套内的金属屑和杂质必须清除干净"}, {"k": "B", "t": "直接装配，无需清洗"}, {"k": "C", "t": "只清洁零件外表面"}, {"k": "D", "t": "仅用压缩空气吹一遍即可"}], "a": "A", "e": "【考点】关键件装配前的清洗要求。\n【解析】气缸体、曲轴等关键件检验合格后,装配前必须彻底清洗,特别是油道、水套内的金属屑和杂质必须清除干净,否则会堵塞油道造成烧瓦等严重事故。故选A。\n【易错】“油道堵=烧瓦”是清洗不到位的典型后果。搪缸、磨轴产生的磨屑必须靠清洗和吹干清除。这道工序在装配工艺卡上是强制的。"}, {"id": 210, "oid": "E3-04", "type": "judge", "module": "汽车维修工操作知识", "q": "对有配合关系的零件（如轴与轴承、活塞与气缸）应成组选配、成对更换，以保证配合精度。", "opts": [], "a": "√", "e": "【考点】配合件的成组选配。\n【解析】有配合关系的零件按公差分组选配(活塞按分组号配缸、轴瓦按尺寸等级配轴),易损配合件成对/成套更换,避免新旧混装导致配合不均。题干正确,判断为√。\n【易错】“分组选配+成对更换”。活塞、活塞销、轴瓦都有颜色/字母分组标记,必须同组装配。轴瓦换一片不换另一片是常见返工原因。"}, {"id": 211, "oid": "E4-01", "type": "single", "module": "汽车维修工操作知识", "q": "进行故障诊断时，正确的思路是（　）。", "opts": [{"k": "A", "t": "凭经验直接更换高价总成"}, {"k": "B", "t": "先问诊了解故障现象，再按由简到繁、由外到内的原则检测分析"}, {"k": "C", "t": "盲目拆检发动机"}, {"k": "D", "t": "先更换全部传感器"}], "a": "B", "e": "【考点】故障诊断的思路原则。\n【解析】故障诊断遵循“先问后查、先简后繁、先外后内、先电后机”原则:先向车主问清故障现象(何时何地何条件下出现),再按由简到繁、由外到内逐步检测分析,避免盲目换总成。故选B。\n【易错】“问诊先行、由简到繁、先外后内”是诊断总纲。直接换高价总成、盲目拆发动机、全换传感器都是错误示范。诊断记录也要做好。"}, {"id": 212, "oid": "E4-02", "type": "judge", "module": "汽车维修工操作知识", "q": "电控发动机故障诊断时，应先读取故障码（DTC），再结合数据流和电路检测确认故障部位，故障码清除后还应路试验证。", "opts": [], "a": "√", "e": "【考点】电控发动机诊断流程。\n【解析】电控诊断标准流程:读故障码DTC→看数据流→电路检测(电阻电压波形)→确认故障点→维修→清码→路试验证。题干描述正确,判断为√。\n【易错】“读码→数据流→测电路→修→清码→路试”六步闭环。只清码不维修、故障码清除不复现都是诊断误区。偶发故障要记录冻结帧。"}, {"id": 213, "oid": "E4-03", "type": "single", "module": "汽车维修工操作知识", "q": "用万用表测量电路时，测量电压应（　），测量电流应（　）。", "opts": [{"k": "A", "t": "并联接入电路；串联接入电路"}, {"k": "B", "t": "串联接入电路；并联接入电路"}, {"k": "C", "t": "都并联接入"}, {"k": "D", "t": "都串联接入"}], "a": "A", "e": "【考点】万用表的正确接法。\n【解析】测量电压:电压表内阻大,并联接入被测元件两端,不改变电路;测量电流:电流表内阻小,必须串联在回路中,否则短路烧表。测量电阻必须断电。故选A。\n【易错】“电压并联、电流串联、电阻断电”三句话记牢。电流挡误并联=烧表。测量电流还要先选大挡位再调小。"}, {"id": 214, "oid": "E4-04", "type": "judge", "module": "汽车维修工操作知识", "q": "发动机“起动困难”故障诊断时，应首先拆检发动机内部零件，无需检查蓄电池电压和燃油供给情况。", "opts": [], "a": "×", "e": "【考点】起动困难诊断思路。\n【解析】起动困难原因涉及电、油、机多方面:先查电源(蓄电池电压、搭铁)、燃油(油量、压力、喷射),再查点火和压缩(缸压、正时、火花)。题干说“先拆检发动机”,错误,判断为×。\n【易错】“先电后油再机械”是起动困难诊断顺序,上来就拆发动机是典型的盲目作业。多数起动困难是电瓶亏电或油路问题。"}, {"id": 215, "oid": "E5-01", "type": "judge", "module": "汽车维修工操作知识", "q": "新车交付前的PDI（售前检查）包括外观检查、功能检查、油液检查、轮胎气压和紧固件检查等项目。", "opts": [], "a": "√", "e": "【考点】PDI售前检查内容。\n【解析】PDI(Pre-Delivery Inspection)是新车交付前标准检查:外观、灯光、功能、油液、轮胎气压、蓄电池、紧固件等,确保交付状态良好。题干正确,判断为√。\n【易错】“PDI=交付前检查”。4S店销售流程中必做,有标准检查单。项目覆盖:外观内饰、电气功能、油液液位、轮胎、紧固、随车资料。"}, {"id": 216, "oid": "E5-02", "type": "single", "module": "汽车维修工操作知识", "q": "新车走合期（磨合期）内，正确的使用要求是（　）。", "opts": [{"k": "A", "t": "高速满载长时间行驶，尽快磨合"}, {"k": "B", "t": "控制车速和负荷，避免超载和猛加速、急制动"}, {"k": "C", "t": "不更换机油"}, {"k": "D", "t": "添加抗磨剂代替磨合"}], "a": "B", "e": "【考点】走合期的使用要求。\n【解析】走合期(一般1000～2500km)要求:控制转速车速、避免满载超载、避免急加速急制动、按规定里程(通常首保)更换机油,让配合面逐步磨合。故选B。\n【易错】“走合期=轻载缓行+按时换油”。A高速满载、C不换机油、D用抗磨剂代替磨合都是错的。磨合期后首保更换机油并检查。"}, {"id": 217, "oid": "E5-03", "type": "single", "module": "汽车维修工操作知识", "q": "新车（或大修车）在交付使用前，还应对（　）进行专门检查，防止运输或存放期间松动。", "opts": [{"k": "A", "t": "底盘螺栓、轮胎螺母、蓄电池接线等紧固件"}, {"k": "B", "t": "音响系统"}, {"k": "C", "t": "空调滤芯"}, {"k": "D", "t": "车身漆面"}], "a": "A", "e": "【考点】新车交付前的紧固检查。\n【解析】新车经运输和存放,底盘螺栓、轮胎螺母、蓄电池接线等可能松动,交付前必须按规定力矩复紧关键紧固件并检查油液。故选A。\n【易错】“运输颠簸=紧固件可能松”。重点:轮胎螺母、悬挂螺栓、转向拉杆、蓄电池端子。这是PDI的组成部分,防止交付后出事故。"}, {"id": 218, "oid": "E6-01", "type": "judge", "module": "汽车维修工操作知识", "q": "日常维护（例行保养）由维修技师在车辆定期进厂时进行，主要内容是更换机油和机油滤清器。", "opts": [], "a": "×", "e": "【考点】日常维护与定期维护的区别。\n【解析】日常维护由驾驶员在出车前、行车中、收车后进行(清洁、检查、补给、紧固);定期更换机油和滤清器属定期维护(进厂作业)。题干说“日常维护由技师更换机油”,错误,判断为×。\n【易错】“日常=驾驶员三检(出车前/行车中/收车后),定期=进厂保养”。换机油是定期维护。把两者职责说反是常见考点。"}, {"id": 219, "oid": "E6-02", "type": "single", "module": "汽车维修工操作知识", "q": "出车前检查发动机机油液位，正确的方法是（　）。", "opts": [{"k": "A", "t": "冷车（或停机数分钟后）拔出机油尺擦净再插入，拔出观察油位在上下限之间"}, {"k": "B", "t": "热车立即拔尺观察"}, {"k": "C", "t": "只要有机油就行"}, {"k": "D", "t": "加满到油尺上限以上"}], "a": "A", "e": "【考点】机油液位检查方法。\n【解析】正确方法:冷车或停机数分钟后拔出机油尺,擦净再插入,拔出观察油位在上下刻度之间。热车立即拔尺油未回流,读数偏高。故选A。\n【易错】“熄火静置+擦净重插+上下限之间”。油位低于下限会润滑不足,高于上限增大曲轴阻力并可能烧机油。检查时机在早晨冷车最准。"}, {"id": 220, "oid": "E6-03", "type": "judge", "module": "汽车维修工操作知识", "q": "行车中若发现仪表报警（水温、机油压力、充电等），应立即安全停车检查，不可继续强行行驶。", "opts": [], "a": "√", "e": "【考点】行车中报警灯的处理。\n【解析】水温过高、机油压力低等报警灯点亮说明发动机处于危险状态,继续行驶可能拉缸、烧瓦、损坏机件,必须立即安全停车排查。题干正确,判断为√。\n【易错】“报警即停车”是安全铁律。机油灯亮再跑几十公里就可能报废发动机。水温开锅先怠速降温再检查,不可马上熄火或加冷水。"}, {"id": 221, "oid": "E7-01", "type": "single", "module": "汽车维修工操作知识", "q": "我国汽车维护制度中，定期维护分为日常维护、（　）和二级维护三个等级。", "opts": [{"k": "A", "t": "一级维护"}, {"k": "B", "t": "走合维护"}, {"k": "C", "t": "季节性维护"}, {"k": "D", "t": "换季维护"}], "a": "A", "e": "【考点】汽车维护制度的分级。\n【解析】按GB/T 18344《汽车维护、检测、诊断技术规范》,汽车维护分三级:日常维护、一级维护、二级维护。故选A。\n【易错】“日常、一级、二级”三级。一级维护以清洁润滑紧固为主(约间隔5000km),二级维护以检查调整为主(约间隔20000km)。"}, {"id": 222, "oid": "E7-02", "type": "single", "module": "汽车维修工操作知识", "q": "一级维护的中心内容是（　）。", "opts": [{"k": "A", "t": "清洁、润滑、紧固"}, {"k": "B", "t": "检测调整各总成"}, {"k": "C", "t": "更换全部易损件"}, {"k": "D", "t": "大修发动机"}], "a": "A", "e": "【考点】一级维护的中心内容。\n【解析】一级维护以“清洁、润滑、紧固”为中心:清洁滤清器、检查补充油液、按规定部位加注润滑脂、紧固各连接螺栓,并检查电气和制动。故选A。\n【易错】“一级=清洁润滑紧固”。检测调整总成是二级维护的事(B选项)。换易损件、大修发动机都不是定期维护常规内容。"}, {"id": 223, "oid": "E7-03", "type": "single", "module": "汽车维修工操作知识", "q": "二级维护作业中，除一级维护项目外，重点应（　）。", "opts": [{"k": "A", "t": "检查调整发动机、制动系、转向系、行驶系等各总成的工作状况"}, {"k": "B", "t": "只更换机油"}, {"k": "C", "t": "只清洗车身"}, {"k": "D", "t": "只检查轮胎气压"}], "a": "A", "e": "【考点】二级维护的中心内容。\n【解析】二级维护以“检查、调整”为中心:除一级维护项目外,检测调整发动机、制动系、转向系、行驶系各总成,调整气门间隙、制动间隙、前束等,更换规定油液滤芯。故选A。\n【易错】“二级=检查调整”。对比记忆:一级清洁润滑紧固、二级检查调整。二级维护还要做不解体检测(诊断)确定附加作业。"}, {"id": 224, "oid": "E7-04", "type": "judge", "module": "汽车维修工操作知识", "q": "定期更换机油及机油滤清器是发动机保养的基本项目，更换周期应遵循车辆维修手册的规定，并同时更换放油螺塞垫片。", "opts": [], "a": "√", "e": "【考点】机油更换周期与操作。\n【解析】机油高温氧化变质、添加剂消耗,必须按手册周期(一般5000～10000km或半年到一年)更换机油和滤芯,同时更换放油螺塞垫片防渗漏。题干正确,判断为√。\n【易错】“周期看手册+垫片同换”。全合成机油周期可更长。放油螺塞垫片是一次性密封件,反复用会漏油。更换后检查油位。"}, {"id": 225, "oid": "E8-01", "type": "judge", "module": "汽车维修工操作知识", "q": "拆装发动机气缸盖螺栓时，应按由两端向中间、一次性全部松开或拧紧的顺序操作。", "opts": [], "a": "×", "e": "【考点】缸盖螺栓的拧紧顺序。\n【解析】缸盖螺栓必须按“由中间向两端、分2～3次递增力矩”的顺序拧紧(拆卸相反),防止缸盖翘曲变形、密封不严。题干说“由两端向中间、一次拧紧”,错误,判断为×。\n【易错】“中间→两端、分次拧”是缸盖螺栓铁律。一次性拧紧会因缸盖变形漏气漏水。拆时反向(两端→中间)分次松开。扭力扳手+角度法常见。"}, {"id": 226, "oid": "E8-02", "type": "single", "module": "汽车维修工操作知识", "q": "安装油封（骨架油封）时，正确的做法是（　）。", "opts": [{"k": "A", "t": "检查唇口无损伤，装配面涂润滑油（脂），用专用工具均匀压入"}, {"k": "B", "t": "直接用力敲入"}, {"k": "C", "t": "不涂油直接压入"}, {"k": "D", "t": "用锤子猛击油封外圈"}], "a": "A", "e": "【考点】油封的正确安装。\n【解析】安装油封:检查唇口无损伤,装配面涂少量润滑油(脂),用专用压入工具均匀垂直压入,防止偏斜、变形、唇口翻卷导致漏油。故选A。\n【易错】“涂油+专用工具+垂直压入”三要点。直接敲击、猛击外圈会变形漏油。唇口朝向要正确(油封唇口朝机油侧)。安装偏斜是漏油主因。"}, {"id": 227, "oid": "E8-03", "type": "judge", "module": "汽车维修工操作知识", "q": "拆装正时带（链）前，应核对曲轴和凸轮轴的正时标记，拆下后转动曲轴前必须确认气门不与活塞干涉。", "opts": [], "a": "√", "e": "【考点】正时带(链)拆装安全。\n【解析】拆装正时带(链)前必须核对曲轴和凸轮轴正时标记;拆下后未装回前不得随意转动曲轴,防止气门与活塞干涉顶弯气门。题干正确,判断为√。\n【易错】“先对标记、装前不转曲轴”两条铁律。顶气门事故多发生在维修中误转曲轴。安装后手动盘车两圈验证无干涉再起动。"}, {"id": 228, "oid": "A1-032", "type": "judge", "module": "汽车概论与机械基础", "q": "传统汽车的电气设备主要由电源和用电设备两大部分组成，普遍采用低压直流供电、负极搭铁。", "opts": [], "a": "√", "e": "【考点】汽车电气设备的组成与供电。\n【解析】传统汽车电气设备由电源(蓄电池、发电机)和用电设备组成,采用12V或24V低压直流、负极搭铁(正极搭铁会腐蚀机件),所以普遍负极搭铁。题干正确,判断为√。\n【易错】“低压直流+负极搭铁”。正极搭铁在极少数老车上存在但易腐蚀,已被淘汰。搭铁极性决定电解腐蚀方向,负极搭铁是统一标准。"}, {"id": 229, "oid": "A1-033", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机是汽车的动力装置，其作用是使燃料燃烧并将热能转化为机械能对外输出。", "opts": [], "a": "√", "e": "【考点】发动机的作用。\n【解析】发动机把燃料的化学能经燃烧转化为热能,再经曲柄连杆机构转化为曲轴旋转的机械能对外输出,是汽车动力装置。题干正确,判断为√。\n【易错】能量链:化学能→热能→机械能。热能转换靠燃烧,机械能输出靠曲柄连杆机构。发动机“热机”本质要记牢。"}, {"id": 230, "oid": "A1-034", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车底盘中的行驶系由车架（或车身）、车桥、悬架和车轮组成，用于支承汽车总质量并保证正常行驶。", "opts": [], "a": "√", "e": "【考点】行驶系的组成与作用。\n【解析】行驶系由车架(或承载式车身)、车桥、悬架和车轮四部分组成,承受整车质量、传递力和力矩,保证行驶平顺与操纵稳定。题干正确,判断为√。\n【易错】“车架+车桥+悬架+车轮”四件套。此题与116题同知识点,考试常重复出现,说明是高频考点。悬架弹性连接车桥与车身。"}, {"id": 231, "oid": "A1-035", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车没有发动机，也没有传统的多挡变速器和排气系统。", "opts": [], "a": "√", "e": "【考点】纯电动汽车的结构特点。\n【解析】纯电动汽车以动力电池和驱动电机为动力,取消了发动机、多挡变速器和排气净化、消声系统,一般只配固定速比减速器。题干正确,判断为√。\n【易错】“纯电=无发动机、无多挡变速器、无排气系统”。电机低速大扭矩、调速范围宽,单速减速器就够。结构与燃油车对比记忆。"}, {"id": 232, "oid": "A1-036", "type": "judge", "module": "汽车概论与机械基础", "q": "新能源汽车是指采用非常规车用燃料作为动力来源的汽车，纯电动汽车属于新能源汽车。", "opts": [], "a": "√", "e": "【考点】新能源汽车的定义。\n【解析】新能源汽车指采用非常规车用燃料(电能、氢能等)作为动力来源的汽车,包括纯电动、插电混动、燃料电池等;传统汽油柴油车属内燃机汽车。题干正确,判断为√。\n【易错】“非常规燃料”是定义关键词。纯电动、PHEV、FCEV都是新能源;普通HEV(不能外接充电)在国家分类中一般归为节能车。"}, {"id": 233, "oid": "A1-037", "type": "judge", "module": "汽车概论与机械基础", "q": "混合动力汽车（HEV）必须外接充电，其动力电池容量较大，可纯电行驶较长距离。", "opts": [], "a": "×", "e": "【考点】HEV与PHEV的区别。\n【解析】HEV油电混动不能外接充电,电池容量小,靠发动机和制动能量回收充电;能外接充电、大容量电池、可纯电长距离行驶的是插电混动PHEV。题干说HEV可外接充电,错误,判断为×。\n【易错】“HEV不能充电、PHEV能充电”是核心区别。看“插电”二字:能插电的是PHEV。HEV电池只管调峰和回收。"}, {"id": 234, "oid": "A1-038", "type": "judge", "module": "汽车概论与机械基础", "q": "插电式混合动力汽车（PHEV）既可外接充电、纯电行驶，电量不足时又可由发动机驱动或发电。", "opts": [], "a": "√", "e": "【考点】插电混动PHEV的特点。\n【解析】PHEV装发动机+驱动电机+可外接充电的大容量电池:短途纯电行驶,长途或电量不足时发动机驱动或发电,兼顾纯电经济与燃油续驶。题干正确,判断为√。\n【易错】“PHEV=可充电+可纯电+可混动”三种模式。与HEV比多了外接充电和大电池;与增程比多了发动机直驱。"}, {"id": 235, "oid": "A1-039", "type": "judge", "module": "汽车概论与机械基础", "q": "燃料电池汽车（FCEV）行驶过程中直接向大气排放二氧化碳和水。", "opts": [], "a": "×", "e": "【考点】燃料电池汽车(增程车)的排放。\n【解析】燃料电池车氢气与氧气在燃料电池中反应,只生成水,不排放CO、HC和CO2;排放二氧化碳的是燃烧化石燃料的内燃机。题干说“排放二氧化碳和水”,错误,判断为×。\n【易错】“氢氧反应=只排水”。FCEV是零排放(尾气只有水)。注意别与“增程”混淆。碳排放来自化石燃料燃烧。"}, {"id": 236, "oid": "A1-040", "type": "judge", "module": "汽车概论与机械基础", "q": "驱动电机是纯电动汽车的动力装置，可将动力电池的电能转化为机械能驱动车轮。", "opts": [], "a": "√", "e": "【考点】纯电动汽车驱动电机的作用。\n【解析】驱动电机在电机控制器(MCU)控制下,把动力电池直流电逆变为三相交流电驱动电机转动,输出转矩经减速器驱动车轮。题干正确,判断为√。\n【易错】“电池直流→MCU逆变→电机交流”。电机既是电动机(驱动)也是发电机(制动回收),双向工作。MCU是电机的“大脑”。"}, {"id": 237, "oid": "A1-041", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车上的DC/DC转换器用于把动力电池的高压直流电变换为低压直流电，为12V用电设备供电并给低压蓄电池充电。", "opts": [], "a": "√", "e": "【考点】DC/DC转换器的作用。\n【解析】动力电池是高压直流(200～800V),不能直接供12V设备;DC/DC把高压降为低压(14V左右),代替传统发电机向12V用电设备供电并给低压蓄电池充电。题干正确,判断为√。\n【易错】“DC/DC=高压变低压”。车上还有AC/DC(OBC充电)、DC/AC(逆变器)。三个转换器功能别混。低压蓄电池仍在(给控制器、唤醒电路供电)。"}, {"id": 238, "oid": "A1-042", "type": "judge", "module": "汽车概论与机械基础", "q": "车载充电机（OBC）的作用是把交流充电桩输出的交流电变换为直流电，为动力电池充电。", "opts": [], "a": "√", "e": "【考点】车载充电机OBC的作用。\n【解析】交流充电桩只输出交流电,必须经车载充电机OBC整流为直流电,按BMS要求为动力电池充电;直流快充桩直接输出直流,不经OBC。题干正确,判断为√。\n【易错】“交流桩→OBC→电池;直流桩→直接”。OBC功率一般较小(慢充),快充靠桩端大功率直流。充电接口区分交流/直流。"}, {"id": 239, "oid": "A1-043", "type": "judge", "module": "汽车概论与机械基础", "q": "增程式电动汽车在动力电池电量充足时由发动机直接驱动车轮，电量不足时才由驱动电机驱动。", "opts": [], "a": "×", "e": "【考点】增程式电动汽车的动力结构。\n【解析】增程车全程由驱动电机驱动车轮,发动机只带动发电机发电(给电池充电或直接供电动机),发动机不直接驱动车轮。题干说“电量足时发动机直接驱动车轮”,错误,判断为×。\n【易错】“增程=发动机只发电不驱动”。对比:插混PHEV发动机可以直驱,增程EREV发动机永远不直驱。“串联式混动”也是增程。"}, {"id": 240, "oid": "A1-044", "type": "judge", "module": "汽车概论与机械基础", "q": "传统燃油汽车的暖风主要利用发动机冷却液余热，而纯电动汽车多采用PTC电加热器取暖。", "opts": [], "a": "√", "e": "【考点】不同能源车型的暖风热源。\n【解析】燃油车靠发动机冷却液余热经暖风水箱加热空气;纯电动车无发动机余热,用PTC电加热器或热泵空调采暖。题干正确,判断为√。\n【易错】“油车余热、电车电热”。冬季纯电暖风耗电明显(尤其PTC),热泵更省电。这也是纯电冬季续航打折的原因之一。"}, {"id": 241, "oid": "A1-045", "type": "judge", "module": "汽车概论与机械基础", "q": "与传统燃油汽车相比，纯电动汽车取消了发动机、变速器和排气系统，但仍保留12V低压蓄电池。", "opts": [], "a": "√", "e": "【考点】纯电动汽车的低压系统。\n【解析】纯电动车取消发动机、变速器、排气系统,高压系统经DC/DC供电,但仍保留12V低压蓄电池为控制器和低压设备供电,负责整车上下电。题干正确,判断为√。\n【易错】“12V蓄电池仍在”。低压蓄电池没电会导致高压上电失败(接触器无法吸合)。维修先断低压负极也是这个原因。"}, {"id": 242, "oid": "A1-046", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车车身的主要作用是安装各总成和部件，并为驾驶员和乘客提供安全、舒适的乘坐空间。", "opts": [], "a": "√", "e": "【考点】车身的作用。\n【解析】车身是驾驶员工作和乘员乘坐的场所,同时安装发动机、底盘等总成,承受并传递载荷,保障安全舒适。题干正确,判断为√。\n【易错】“车身=乘员空间+总成安装载体”。承载式车身本身还是受力结构。车身覆盖件与车身壳体(基础件)区分开。"}, {"id": 243, "oid": "A1-047", "type": "judge", "module": "汽车概论与机械基础", "q": "交流异步（感应）驱动电机结构简单坚固、免维护，但效率和功率密度一般不如永磁同步电机。", "opts": [], "a": "√", "e": "【考点】异步电机与永磁同步电机的比较。\n【解析】异步(感应)电机无永磁体、结构简单坚固、免维护、可弱磁调速,但低速效率和功率密度低于永磁同步电机;永磁同步是当前主流。题干正确,判断为√。\n【易错】“异步=简单便宜但效率低;永磁同步=高效主流”。特斯拉早期用异步,现在主驱也换永磁。高端车双电机常是永磁+异步组合。"}, {"id": 244, "oid": "A1-048", "type": "judge", "module": "汽车概论与机械基础", "q": "三元锂电池和磷酸铁锂电池都是目前新能源汽车常用的动力蓄电池类型。", "opts": [], "a": "√", "e": "【考点】车用动力电池的类型。\n【解析】车用动力电池主要有三元锂(NCM/NCA)和磷酸铁锂(LFP)两大类:三元能量密度高、低温好;磷酸铁锂安全、寿命长、成本低。题干正确,判断为√。\n【易错】“三元=高能量密度,铁锂=高安全长寿命”。宁德时代麒麟、刀片电池分别对应三元和铁锂方向。市占率两者都主流。"}, {"id": 245, "oid": "A1-049", "type": "judge", "module": "汽车概论与机械基础", "q": "前置前驱（FF）汽车的变速器、主减速器和差速器常组合为一体（变速驱动桥），直接驱动前轮。", "opts": [], "a": "√", "e": "【考点】前置前驱FF的驱动桥结构。\n【解析】FF布置发动机横置(或纵置),变速器与主减速器、差速器集成为一体(变速驱动桥),直接驱动前轮,省去长传动轴,结构紧凑、传动效率高。题干正确,判断为√。\n【易错】“FF=变速驱动桥一体”。FR才有独立后桥和传动轴。与92题重复考点,掌握FF/FR结构区别即可。"}, {"id": 246, "oid": "A1-050", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车传动系的基本功用是将发动机发出的动力传递给驱动车轮。", "opts": [], "a": "√", "e": "【考点】传动系的基本功用。\n【解析】传动系经离合器、变速器、万向传动装置、主减速器、差速器和半轴,把发动机动力传递给驱动车轮,实现起步和行驶。题干正确,判断为√。\n【易错】“传动系=动力传给驱动轮”。与91题同考点。传动链各环节:离合器(通断)→变速器(变速变扭)→万向传动→主减速器(增扭转向)→差速器→半轴。"}, {"id": 247, "oid": "A1-051", "type": "judge", "module": "汽车概论与机械基础", "q": "四轮驱动（4WD）汽车的全部车轮都可作为驱动轮，通过性好，但结构复杂、能耗较高。", "opts": [], "a": "√", "e": "【考点】四轮驱动4WD的特点。\n【解析】4WD把动力同时传给前后桥,附着力大、通过性好(越野),但增加分动器等传动部件,结构复杂、自重和能耗增大。题干正确,判断为√。\n【易错】“4WD=通过性好但费油”。全时/分时/适时四驱是常见类型。城市SUV多为适时四驱(平时两驱、打滑时介入)。"}, {"id": 248, "oid": "A1-052", "type": "judge", "module": "汽车概论与机械基础", "q": "柴油机和汽油机都属于往复活塞式内燃机，柴油机在进气行程吸入气缸的是纯空气。", "opts": [], "a": "√", "e": "【考点】柴油机与汽油机的区别。\n【解析】柴油机进气行程吸入纯空气,压缩末了喷入柴油靠高温自燃(压燃);汽油机吸入汽油与空气混合气,靠火花塞点燃(点燃)。题干正确,判断为√。\n【易错】“柴油压燃、汽油点燃”是核心区别。柴油机无火花塞、压缩比更高。进气成分:柴油机纯空气、汽油机混合气。"}, {"id": 249, "oid": "A1-053", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车的高压线束一般用橙色作为醒目标识，以提醒维修人员注意高压危险。", "opts": [], "a": "√", "e": "【考点】高压线束的橙色标识。\n【解析】橙色是高压安全警示色,用于高压线束、接插件和部件外壳,让维修人员易于识别、与低压线束区分,防止触电。题干正确,判断为√。\n【易错】“橙色=高压危险”。维修纯电车先认橙色线束和高压部件。高压作业要戴绝缘手套、断电等待放电。低压线束通常黑/红/蓝等。"}, {"id": 250, "oid": "A1-054", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车电气设备中的电源包括蓄电池和发电机。", "opts": [], "a": "√", "e": "【考点】汽车电源的组成。\n【解析】汽车电源由蓄电池(起动、停机时供电)和发电机(运转时主供电并给蓄电池充电)组成。题干正确,判断为√。\n【易错】“蓄电池+发电机=电源”。与用电设备(起动机、灯、仪表等)相对。发电机与蓄电池并联工作,电压一般13.5～14.5V。"}, {"id": 251, "oid": "A1-055", "type": "judge", "module": "汽车概论与机械基础", "q": "某纯电动汽车下电维修时，技师先断低压蓄电池负极、再拔高压维修开关并等待放电，这一流程同时涉及高压安全操作与车辆电气构造知识。", "opts": [], "a": "√", "e": "【考点】纯电动汽车高压断电维修流程。\n【解析】纯电动车下电维修:先断低压蓄电池负极(使高压接触器断电释放),再拔高压维修开关(手动维修断开装置),等待电容放电后再作业。题干流程正确,判断为√。\n【易错】“先低压后高压”顺序不能反:不断低压,接触器可能保持吸合,拔高压开关有危险。维修开关断开后还要等5～10分钟放电(或测量确认)。"}, {"id": 252, "oid": "A1-056", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车按动力装置不同可分为内燃机汽车、电动汽车和混合动力汽车等。", "opts": [], "a": "√", "e": "【考点】汽车按动力装置分类。\n【解析】按动力装置(发动机/电机)不同,汽车分为内燃机汽车、电动汽车(纯电、燃料电池)和混合动力汽车等类别。题干正确,判断为√。\n【易错】“动力装置分类法:内燃机、电动、混动”。对比按用途(轿车客车货车)、按行驶道路(公路/越野)等分类方式。新能源汽车归属电动车。"}, {"id": 253, "oid": "A1-057", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车在制动或减速时，可通过驱动电机发电（再生制动）将部分动能回收为电能储存到动力电池。", "opts": [], "a": "√", "e": "【考点】再生制动(能量回收)。\n【解析】纯电动车松开加速踏板或制动时,驱动电机转为发电机工况,把车辆动能转为电能回充动力电池,提高能量利用率、增加续驶里程。题干正确,判断为√。\n【易错】“制动回收=电机变发电机”。单踏板模式就是强能量回收。回收功率受电池SOC和温度限制(SOC高时回收弱)。"}, {"id": 254, "oid": "A1-058", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机按冷却方式可分为水冷式和风冷式两种。", "opts": [], "a": "√", "e": "【考点】发动机按冷却方式分类。\n【解析】发动机按冷却方式分水冷式和风冷式:水冷以冷却液循环散热,风冷以空气直接吹散热片散热;现代汽车发动机几乎全用水冷。题干正确,判断为√。\n【易错】“水冷为主流,风冷用于摩托车/老甲壳虫”。水冷均匀、噪声小、便于冬季暖风。风冷结构简单但散热不均、噪声大。"}, {"id": 255, "oid": "A1-059", "type": "judge", "module": "汽车概论与机械基础", "q": "油电混合动力汽车（HEV）的动力电池容量较小，主要靠发动机和回收制动能量充电，不能外接充电。", "opts": [], "a": "√", "e": "【考点】HEV动力电池特点。\n【解析】HEV电池容量小、电压低,只用于调峰和能量回收,靠发动机和制动回收充电,不能外接充电;外接充电是PHEV特征。题干正确,判断为√。\n【易错】“HEV=小电池不能插电”。与233题重复考点,说明考试重视HEV/PHEV区别。丰田THS就是典型HEV,电池仅1～2kWh。"}, {"id": 256, "oid": "A1-060", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车的转向系用于控制汽车按驾驶员选定的方向行驶。", "opts": [], "a": "√", "e": "【考点】转向系的作用。\n【解析】转向系通过转向盘、转向器和转向传动机构偏转前轮,使汽车按驾驶员选定方向行驶。题干正确,判断为√。\n【易错】“转向系=控制方向”。转向盘→转向器(放大扭矩、改变方向)→传动机构→车轮。助力转向(液压/电动)减轻操纵力。"}, {"id": 257, "oid": "A1-061", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车因为没有发动机，所以行驶时完全没有任何噪声和振动。", "opts": [], "a": "×", "e": "【考点】纯电动汽车的噪声。\n【解析】纯电动车无发动机噪声,但仍有电机运转噪声、轮胎路噪、风噪;低速时还需外接提示音(VSP)提醒行人。题干说“完全没有任何噪声振动”,错误,判断为×。\n【易错】“无发动机≠无声”。低速提示音是法规要求(行人安全),声音像“嗡嗡”模拟音。高速主要噪声是风噪胎噪。"}, {"id": 258, "oid": "A1-062", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车制动系的作用是使行驶中的汽车减速或停车，并使停放的汽车可靠驻留。", "opts": [], "a": "√", "e": "【考点】制动系的作用。\n【解析】制动系两大作用:行车制动使行驶中汽车减速或停车;驻车制动使停放汽车可靠驻留(防溜)。题干正确,判断为√。\n【易错】“减速停车+驻车防溜”两作用。与126题重复。行车制动四轮制动、驻车制动多作用于后轮。ABS、EBD等是制动辅助系统。"}, {"id": 259, "oid": "A1-063", "type": "judge", "module": "汽车概论与机械基础", "q": "磷酸铁锂电池热稳定性和安全性较好、循环寿命较长，但能量密度一般低于三元锂电池。", "opts": [], "a": "√", "e": "【考点】磷酸铁锂与三元锂电池比较。\n【解析】磷酸铁锂热分解温度高、不易热失控、循环寿命长,但单体电压低、能量密度较小;三元锂能量密度高但热稳定性略差。题干正确,判断为√。\n【易错】“铁锂=安全长寿低密度;三元=高能量密度略不安全”。与244题重复考点。买车选电池看需求:通勤重安全选铁锂,长续航选三元。"}, {"id": 260, "oid": "A1-064", "type": "judge", "module": "汽车概论与机械基础", "q": "后置后驱（RR）布置的发动机和驱动桥都布置在汽车后部。", "opts": [], "a": "√", "e": "【考点】后置后驱RR布置。\n【解析】RR把发动机、变速器和驱动桥都布置在汽车后部,驱动后轮,常见于客车和部分跑车(如保时捷911),可减轻前轴负荷、实现轴距合理分配。题干正确,判断为√。\n【易错】“RR=全部动力装置在后”。对比:FR发动机前置后驱、FF发动机前置前驱、MR中置后驱。客车常RR(发动机车尾)、轿车主流FF。"}, {"id": 261, "oid": "A1-065", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车上的电动压缩机由高压电直接驱动，不依赖发动机皮带传动。", "opts": [], "a": "√", "e": "【考点】纯电动汽车的空调压缩机。\n【解析】纯电动车无发动机皮带,空调制冷由高压电动压缩机(高压电机驱动)独立工作,可在驻车时制冷,并便于整车热管理和能量调度。题干正确,判断为√。\n【易错】“电动压缩机=高压驱动、独立于发动机”。燃油车压缩机由发动机皮带带动。纯电空调是高压部件,维修注意断电。"}, {"id": 262, "oid": "A1-066", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车底盘由传动系、行驶系、转向系和制动系四大系统组成。", "opts": [], "a": "√", "e": "【考点】底盘四大系统。\n【解析】底盘由传动系、行驶系、转向系和制动系四大系统组成,分别承担传递动力、行驶支承、控制方向和减速停车功能。题干正确,判断为√。\n【易错】“传动、行驶、转向、制动”四系统。总览题:底盘=4系,汽车=发动机+底盘+车身+电气设备。两大总览考点配套记。"}, {"id": 263, "oid": "A1-067", "type": "judge", "module": "汽车概论与机械基础", "q": "增程式电动汽车因发动机始终工作在高效区间发电，其长途高速行驶的能耗往往较经济。", "opts": [], "a": "√", "e": "【考点】增程式电动汽车的能耗特点。\n【解析】增程发动机只在高效转速区带动发电机发电,避开低效和频繁波动工况,长途高速时能耗相对经济。题干正确,判断为√。\n【易错】“增程=发动机工作在高效区”。但高速工况电机效率和传动损耗叠加,增程高速能耗并不总优于直驱,这是行业讨论点;本题按题干教材表述判√。"}, {"id": 264, "oid": "A1-068", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车车身壳体是车身的基础件，发动机罩、车门、翼子板等属于车身外部覆盖件。", "opts": [], "a": "√", "e": "【考点】车身壳体与覆盖件。\n【解析】车身壳体是车身基础件(承载、连接);发动机罩、车门、翼子板、行李厢盖属于外部覆盖件,起覆盖、导流和美观作用。题干正确,判断为√。\n【易错】“壳体=基础,覆盖件=外壳”。覆盖件变形只影响外观和密封,壳体变形影响结构强度。钣金修复区分两者。"}, {"id": 265, "oid": "A1-069", "type": "judge", "module": "汽车概论与机械基础", "q": "驱动电机在低速时就能输出大转矩，因此纯电动汽车通常不需要多挡变速器，多采用固定速比减速器。", "opts": [], "a": "√", "e": "【考点】纯电动车无需多挡变速器的原因。\n【解析】驱动电机低速就能输出大转矩、调速范围宽,单级减速器即可满足起步和高速需求;多挡变速器增加成本和复杂度,故纯电多用固定速比减速器。题干正确,判断为√。\n【易错】“电机低速大扭矩+宽调速=单速够用”。对比燃油车发动机低速扭矩小,必须多挡变速。这是纯电结构优势的核心原因。"}, {"id": 266, "oid": "A1-070", "type": "judge", "module": "汽车概论与机械基础", "q": "传统汽车的动力装置是发动机，纯电动汽车的动力装置是驱动电机。", "opts": [], "a": "√", "e": "【考点】传统车与纯电车动力装置。\n【解析】传统燃油车以发动机为动力装置,纯电动车以驱动电机为动力装置,能量来源和动力形式不同。题干正确,判断为√。\n【易错】“发动机vs驱动电机”对应“燃油vs电能”。动力装置是汽车的核心分类依据(内燃机汽车/电动汽车/混动)。"}, {"id": 267, "oid": "A1-071", "type": "judge", "module": "汽车概论与机械基础", "q": "储氢罐是燃料电池汽车储存高压氢气的部件，储存压力很高，对安全性和密封要求严格。", "opts": [], "a": "√", "e": "【考点】燃料电池车的储氢罐。\n【解析】燃料电池车把高压压缩氢(最高约70MPa)储存在专用储氢罐中,罐体高强度、高密封,配安全泄压装置和严格防护。题干正确,判断为√。\n【易错】“70MPa高压储氢”数量级记牢。氢气分子小易泄漏,密封要求极高。储氢罐需定期检验,碰撞后必须检查。"}, {"id": 268, "oid": "A1-072", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车电气设备采用单线制，电源负极通过车身搭铁构成回路。", "opts": [], "a": "√", "e": "【考点】汽车电路单线制。\n【解析】汽车电源正极经导线接到用电设备,负极经车身(车架)搭铁形成回路,即单线制,节省导线、简化线路。题干正确,判断为√。\n【易错】“正极走线、负极搭铁”。单线制是汽车电路基本特点,与172题重复考点。搭铁不良会导致电器工作异常。"}, {"id": 269, "oid": "A1-073", "type": "judge", "module": "汽车概论与机械基础", "q": "插电式混合动力汽车在结构上同时装有发动机和驱动电机，以及容量较大、可外接充电的动力电池。", "opts": [], "a": "√", "e": "【考点】插电混动PHEV的结构。\n【解析】PHEV同时装发动机和驱动电机,电池容量较大、可外接充电,是介于燃油车与纯电车之间的过渡车型。题干正确,判断为√。\n【易错】“PHEV=油电双系统+大电池+可插电”。与233、234题同知识链。理解HEV/PHEV/EREV三者区别是新能源高频考点。"}, {"id": 270, "oid": "A1-074", "type": "judge", "module": "汽车概论与机械基础", "q": "前置后驱（FR）汽车的发动机布置在汽车前部，动力经传动系传给后驱动桥，驱动后轮。", "opts": [], "a": "√", "e": "【考点】前置后驱FR布置。\n【解析】FR发动机前置,动力经离合器、变速器、传动轴、后驱动桥驱动后轮,前后轴负荷分配较均匀,多用于中高级轿车和货车。题干正确,判断为√。\n【易错】“FR=前发动机+长传动轴+后桥”。对比FF(前驱无长轴)、RR(后置后驱)。FR操控性好、加速时重心后移增加后轮抓地。"}, {"id": 271, "oid": "A1-075", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车不需要更换机油和机油滤清器，因为它没有发动机润滑系统。", "opts": [], "a": "√", "e": "【考点】纯电动车的保养特点。\n【解析】纯电动车无发动机和曲柄连杆机构,无机油润滑系统,不需换机油和机滤;常规保养主要是检查高压系统、减速器齿轮油和冷却系统。题干正确,判断为√。\n【易错】“纯电不换机油,但保养≠没有”:减速器油、冷却液、制动液、空调滤芯、高压绝缘检查都要做。别误以为纯电零保养。"}, {"id": 272, "oid": "A1-076", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车按发动机使用燃料不同，可分为汽油车、柴油车和气体燃料汽车等。", "opts": [], "a": "√", "e": "【考点】汽车按燃料分类。\n【解析】按发动机使用燃料分:汽油车、柴油车,以及天然气(CNG/LNG)、液化石油气(LPG)等气体燃料汽车。题干正确,判断为√。\n【易错】“汽油、柴油、气体燃料”三类。气体燃料车以CNG/LNG/LPG为燃料。电动车不消耗燃料,按动力装置另分。"}, {"id": 273, "oid": "A1-077", "type": "judge", "module": "汽车概论与机械基础", "q": "某新能源汽车既能外接充电、可纯电行驶50km，且发动机在行驶中既可发电又可直接驱动车轮，据此可判断它属于增程式电动汽车。", "opts": [], "a": "×", "e": "【考点】增程与插混的区分判断。\n【解析】能外接充电、纯电50km、发动机既可发电又可直接驱动车轮——发动机能直驱是PHEV(插电混动)特征;增程车发动机只发电不直驱。题干判为增程,错误,判断为×。\n【易错】“能不能直驱”是增程vs插混的分水岭:增程不直驱、插混可直驱。看到“发动机直接驱动车轮”就选插混。"}, {"id": 274, "oid": "A1-078", "type": "single", "module": "汽车概论与机械基础", "q": "传统汽车的四大组成部分是发动机、底盘、车身和（　）。", "opts": [{"k": "A", "t": "电气设备"}, {"k": "B", "t": "转向系"}, {"k": "C", "t": "制动系"}, {"k": "D", "t": "空调系统"}], "a": "A", "e": "【考点】传统汽车的四大组成。\n【解析】传统汽车由发动机、底盘、车身、电气设备四大部分组成。转向系、制动系属于底盘;空调属于电气设备附件。故选A。\n【易错】“四大=发动机+底盘+车身+电气”。底盘内部再分四系。不要选转向系/制动系/空调,它们不是与发动机并列的大类。"}, {"id": 275, "oid": "A1-079", "type": "single", "module": "汽车概论与机械基础", "q": "汽车的动力装置是（　）。", "opts": [{"k": "A", "t": "底盘"}, {"k": "B", "t": "发动机"}, {"k": "C", "t": "车身"}, {"k": "D", "t": "电气设备"}], "a": "B", "e": "【考点】汽车的动力装置。\n【解析】发动机使燃料燃烧将热能转化为机械能,是传统汽车的动力装置;底盘、车身、电气设备均不产生动力。故选B。\n【易错】“动力装置=发动机”。产生动力的是发动机,底盘只传递动力。纯电动车动力装置是驱动电机,注意题目语境(传统汽车)。"}, {"id": 276, "oid": "A1-080", "type": "single", "module": "汽车概论与机械基础", "q": "下列汽车中，不属于新能源汽车的是（　）。", "opts": [{"k": "A", "t": "纯电动汽车"}, {"k": "B", "t": "插电式混合动力汽车"}, {"k": "C", "t": "柴油轿车"}, {"k": "D", "t": "燃料电池汽车"}], "a": "C", "e": "【考点】新能源汽车的范围。\n【解析】新能源=纯电、插电混动、燃料电池;柴油轿车是传统内燃机汽车,不属于新能源。故选C(题干问“不属于的”)。\n【易错】“PHEV算新能源,HEV(非插电)在国家口径中一般算节能车不算新能源”。柴油车烧化石燃料,肯定不是新能源。"}, {"id": 277, "oid": "A1-081", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车（BEV）的能量来源是（　）。", "opts": [{"k": "A", "t": "汽油"}, {"k": "B", "t": "柴油"}, {"k": "C", "t": "动力蓄电池"}, {"k": "D", "t": "氢气"}], "a": "C", "e": "【考点】纯电动车BEV的能量来源。\n【解析】纯电动车以动力电池储存的电能为唯一能源;汽油柴油用于内燃机,氢气是燃料电池车燃料。故选C。\n【易错】“BEV=电能唯一”。FCEV用氢气,HEV用汽油+电能。把四种新能源车的能源对应清楚。"}, {"id": 278, "oid": "A1-082", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车中将动力电池高压直流电变换为12V低压直流电的部件是（　）。", "opts": [{"k": "A", "t": "车载充电机"}, {"k": "B", "t": "DC/DC转换器"}, {"k": "C", "t": "驱动电机"}, {"k": "D", "t": "电动空调压缩机"}], "a": "B", "e": "【考点】DC/DC转换器的识别。\n【解析】DC/DC把动力电池高压直流降为12V低压,供低压设备和低压蓄电池充电;OBC是交流转直流(充电),电机是动力部件。故选B。\n【易错】“DC/DC=高压→低压直流;OBC=交流→直流”。两个“转换器”别混:一个在车上分压,一个在充电链路整流。与237题重复。"}, {"id": 279, "oid": "A1-083", "type": "single", "module": "汽车概论与机械基础", "q": "负责把交流充电桩的交流电变换为直流电、给动力电池充电的部件是（　）。", "opts": [{"k": "A", "t": "驱动电机"}, {"k": "B", "t": "车载充电机（OBC）"}, {"k": "C", "t": "DC/DC转换器"}, {"k": "D", "t": "整车控制器"}], "a": "B", "e": "【考点】车载充电机OBC的作用。\n【解析】交流慢充桩只出交流电,须经车载充电机OBC整流为直流给动力电池充电;DC/DC是高压转低压,电机是执行部件。故选B。\n【易错】“交流桩充电走OBC”。直流快充桩直接直流输出不走OBC。与238题重复考点,识别OBC/DC-DC/电机三者职责。"}, {"id": 280, "oid": "A1-084", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于增程式电动汽车的说法，正确的是（　）。", "opts": [{"k": "A", "t": "发动机直接驱动车轮"}, {"k": "B", "t": "发动机只带动发电机发电，由驱动电机驱动车轮"}, {"k": "C", "t": "完全没有发动机"}, {"k": "D", "t": "必须外接加油才能行驶"}], "a": "B", "e": "【考点】增程式电动汽车的动力特点。\n【解析】增程车发动机只带动发电机发电,车轮始终由驱动电机驱动;它并非没有发动机,也主要靠电/油补能。故选B。\n【易错】“增程=串联式:发动机→发电机→电机→车轮”。A(发动机直驱)是插混;C(无发动机)是纯电。三个车型一句话区分。"}, {"id": 281, "oid": "A1-085", "type": "single", "module": "汽车概论与机械基础", "q": "燃料电池汽车（FCEV）行驶时排出的物质主要是（　）。", "opts": [{"k": "A", "t": "二氧化碳"}, {"k": "B", "t": "水"}, {"k": "C", "t": "炭烟"}, {"k": "D", "t": "一氧化碳"}], "a": "B", "e": "【考点】燃料电池的产物。\n【解析】燃料电池中氢与氧电化学反应生成水排出,无燃烧过程,不产生CO2、CO和炭烟。故选B。\n【易错】“FCEV排放=水”。零排放但注意制氢过程可能仍有碳排放(灰氢)。考试层面:行驶排放物是水。与235题重复。"}, {"id": 282, "oid": "A1-086", "type": "single", "module": "汽车概论与机械基础", "q": "目前新能源汽车上应用最广泛、效率和功率密度较高的驱动电机是（　）。", "opts": [{"k": "A", "t": "直流有刷电机"}, {"k": "B", "t": "永磁同步电机"}, {"k": "C", "t": "串激电机"}, {"k": "D", "t": "步进电机"}], "a": "B", "e": "【考点】主流驱动电机类型。\n【解析】永磁同步电机效率高、功率密度大、调速范围宽,是乘用车主流;直流有刷/串激电机已淘汰,步进电机用于小功率位置控制。故选B。\n【易错】“永磁同步=主流”。异步电机用于少数车型和双电机辅驱。记住排序:永磁同步>异步>有刷直流>步进。"}, {"id": 283, "oid": "A1-087", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车的三大核心（三电）系统是动力电池系统、驱动电机系统和（　）。", "opts": [{"k": "A", "t": "电控系统"}, {"k": "B", "t": "冷却系统"}, {"k": "C", "t": "转向系统"}, {"k": "D", "t": "空调系统"}], "a": "A", "e": "【考点】纯电动汽车三电系统。\n【解析】三电=动力电池系统、驱动电机系统、电控系统(整车/电机控制器);冷却、转向、空调是辅助系统。故选A。\n【易错】“三电=电池+电机+电控”。这是纯电核心技术,常考常新。VCU(整车控制器)/MCU(电机控制器)/BMS(电池管理系统)属于电控。"}, {"id": 284, "oid": "A1-088", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于油电混合动力汽车（HEV）的说法，正确的是（　）。", "opts": [{"k": "A", "t": "可用家用电源外接充电"}, {"k": "B", "t": "动力电池容量较大，可长距离纯电行驶"}, {"k": "C", "t": "不能外接充电，电池靠发动机和回收制动能量充电"}, {"k": "D", "t": "没有发动机"}], "a": "C", "e": "【考点】HEV的特点。\n【解析】HEV电池小、不能外接充电,靠发动机和再生制动维持电量;可外接充电、长距离纯电是PHEV特征;HEV有发动机。故选C。\n【易错】“HEV=不插电、电池小、油电协同”。与233、255题重复。三个选项(A可充电、B大电池、D无发动机)都是PHEV或纯电特征。"}, {"id": 285, "oid": "A1-089", "type": "single", "module": "汽车概论与机械基础", "q": "汽车底盘四大系统中，用于使行驶中汽车减速或停车的是（　）。", "opts": [{"k": "A", "t": "传动系"}, {"k": "B", "t": "行驶系"}, {"k": "C", "t": "转向系"}, {"k": "D", "t": "制动系"}], "a": "D", "e": "【考点】底盘四大系统功能对应。\n【解析】制动系产生制动力使车辆减速停车;传动系传力、行驶系支承、转向系控方向。题干问“减速停车”,选D制动系。\n【易错】“四系功能口诀”:传动传力、行驶支承、转向定向、制动减速。把功能与系统一一对应。"}, {"id": 286, "oid": "A1-090", "type": "single", "module": "汽车概论与机械基础", "q": "某前置前驱轿车行驶中动力不足，经检查发动机和电机均正常。从构造布置看，其动力传递路线应是（　）。", "opts": [{"k": "A", "t": "发动机→离合器→变速器→长传动轴→后驱动桥"}, {"k": "B", "t": "发动机→变速器（集成主减速器、差速器）→前轮"}, {"k": "C", "t": "后置发动机→后轮"}, {"k": "D", "t": "四轮独立电驱动"}], "a": "B", "e": "【考点】FF的动力传递路线。\n【解析】FF将变速器、主减速器、差速器集成为变速驱动桥,直接驱动前轮,无长传动轴。A是FR(传动轴到后桥),B正确。故选B。\n【易错】“FF=短链直接到前轮;FR=长链到后桥”。认准“是否经过长传动轴”:有=FR/RR,无=FF。结合布置形式选路线。"}, {"id": 287, "oid": "A1-091", "type": "single", "module": "汽车概论与机械基础", "q": "汽车传动系的基本功用是（　）。", "opts": [{"k": "A", "t": "支承整车质量"}, {"k": "B", "t": "将发动机动力传给驱动车轮"}, {"k": "C", "t": "改变行驶方向"}, {"k": "D", "t": "缓和冲击"}], "a": "B", "e": "【考点】传动系的基本功用。\n【解析】传动系把发动机动力经离合器、变速器、主减速器等传给驱动车轮;支承质量是行驶系、改变方向是转向系、缓冲冲击是悬架。故选B。\n【易错】“传力给驱动轮”。与246、91题重复。四系功能口诀再次使用:传力(传动)、支承(行驶)、定向(转向)、减速(制动)。"}, {"id": 288, "oid": "A1-092", "type": "single", "module": "汽车概论与机械基础", "q": "与传统燃油汽车相比，纯电动汽车上一般不存在的部件是（　）。", "opts": [{"k": "A", "t": "驱动电机"}, {"k": "B", "t": "动力电池"}, {"k": "C", "t": "排气消声器"}, {"k": "D", "t": "电控系统"}], "a": "C", "e": "【考点】纯电动车与燃油车结构差异。\n【解析】纯电动车无燃烧排气,故无排气消声器和三元催化器;驱动电机、动力电池、电控系统是其核心部件。故选C。\n【易错】“纯电没有:发动机、排气管、消声器、催化器、油箱”。它有:电池、电机、电控、减速器、12V电瓶。结构对比记牢。"}, {"id": 289, "oid": "A1-093", "type": "single", "module": "汽车概论与机械基础", "q": "汽车按发动机燃料分类，使用柴油作为燃料的汽车称为（　）。", "opts": [{"k": "A", "t": "汽油车"}, {"k": "B", "t": "柴油车"}, {"k": "C", "t": "电动车"}, {"k": "D", "t": "气体燃料车"}], "a": "B", "e": "【考点】按燃料分类命名。\n【解析】以柴油为燃料的内燃机汽车称柴油车,柴油机压燃、热效率高;汽油车点燃,电动车不使用燃料。故选B。\n【易错】“烧柴油=柴油车”。柴油机与汽油机的点火方式区别(压燃vs点燃)是配套考点。气体燃料车烧CNG/LNG/LPG。"}, {"id": 290, "oid": "A1-094", "type": "single", "module": "汽车概论与机械基础", "q": "磷酸铁锂电池相比三元锂电池，突出的优点是（　）。", "opts": [{"k": "A", "t": "能量密度更高"}, {"k": "B", "t": "热稳定性好、安全性和循环寿命较好"}, {"k": "C", "t": "单体电压更高"}, {"k": "D", "t": "体积更小"}], "a": "B", "e": "【考点】磷酸铁锂与三元对比(单选)。\n【解析】磷酸铁锂热稳定性好、循环寿命长、安全性高;三元锂能量密度和单体电压更高、体积更小,但热稳定性略差。故选B。\n【易错】“铁锂=安全长寿;三元=高密小体积”。题干问铁锂“突出优点”,抓“热稳定性/安全/寿命”。与259题重复。"}, {"id": 291, "oid": "A1-095", "type": "single", "module": "汽车概论与机械基础", "q": "汽车行驶系的组成是车架（或车身）、车桥、悬架和（　）。", "opts": [{"k": "A", "t": "转向器"}, {"k": "B", "t": "制动器"}, {"k": "C", "t": "车轮"}, {"k": "D", "t": "变速器"}], "a": "C", "e": "【考点】行驶系的组成(单选)。\n【解析】行驶系由车架(或车身)、车桥、悬架和车轮组成;转向器属转向系、制动器属制动系、变速器属传动系。故选C。\n【易错】“车架+车桥+悬架+车轮”。与116、230题重复,是反复出现的高频考点,务必记住四件套。"}, {"id": 292, "oid": "A1-096", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车的高压线束通常采用（　）色作醒目标识。", "opts": [{"k": "A", "t": "红"}, {"k": "B", "t": "橙"}, {"k": "C", "t": "蓝"}, {"k": "D", "t": "黑"}], "a": "B", "e": "【考点】高压线束颜色标识。\n【解析】橙色是高压安全警示色,用于高压线束和部件;红色多用于低压正极线,蓝色黑色不表示高压。故选B。\n【易错】“橙=高压”。与249题重复。维修纯电时先识别橙色线束和高压连接器,注意绝缘防护。"}, {"id": 293, "oid": "A1-097", "type": "single", "module": "汽车概论与机械基础", "q": "汽车电气设备的电源是蓄电池和（　）。", "opts": [{"k": "A", "t": "起动机"}, {"k": "B", "t": "发电机"}, {"k": "C", "t": "点火线圈"}, {"k": "D", "t": "保险丝"}], "a": "B", "e": "【考点】电气设备电源组成。\n【解析】发电机是发动机运转后的主电源并给蓄电池充电;蓄电池+发电机=电源。起动机是用电设备,点火线圈、保险丝不是电源。故选B。\n【易错】“电源=蓄电池+发电机”。与250题重复。起动机虽然耗电大,但它是用电设备不是电源。"}, {"id": 294, "oid": "A1-098", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车在减速或制动时，驱动电机可作为发电机运行，将动能回收为电能，称为（　）。", "opts": [{"k": "A", "t": "再生制动（能量回收）"}, {"k": "B", "t": "机械制动"}, {"k": "C", "t": "驻车制动"}, {"k": "D", "t": "发动机制动"}], "a": "A", "e": "【考点】再生制动的定义。\n【解析】再生制动(能量回收):减速或制动时驱动电机转为发电机,把动能转为电能回充电池。故选A。\n【易错】“再生制动=电机反转当发电机”。纯电车无发动机,所以没有发动机制动(D)。机械制动靠摩擦片,驻车制动管停车。"}, {"id": 295, "oid": "A1-099", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机与汽油机相比，柴油机在进气行程吸入气缸的是（　）。", "opts": [{"k": "A", "t": "汽油与空气的混合气"}, {"k": "B", "t": "纯空气"}, {"k": "C", "t": "柴油与空气的混合气"}, {"k": "D", "t": "纯柴油"}], "a": "B", "e": "【考点】柴油机进气成分。\n【解析】柴油机进气行程吸入纯空气,压缩终了喷柴油靠高压高温自燃;汽油机吸入汽油与空气的混合气靠火花塞点燃。故选B。\n【易错】“柴油=纯空气+缸内喷油自燃”。汽油=混合气+火花点燃。与248题重复。C“柴油与空气混合气”是常见干扰项。"}, {"id": 296, "oid": "A1-100", "type": "single", "module": "汽车概论与机械基础", "q": "下列布置形式中，发动机和驱动桥都位于汽车后部、驱动后轮的是（　）。", "opts": [{"k": "A", "t": "前置前驱（FF）"}, {"k": "B", "t": "前置后驱（FR）"}, {"k": "C", "t": "后置后驱（RR）"}, {"k": "D", "t": "四轮驱动"}], "a": "C", "e": "【考点】后置后驱RR识别。\n【解析】RR把发动机和驱动桥都置于车尾驱动后轮;FF前置前驱、FR前置后驱、4WD前后桥都驱动。故选C。\n【易错】“RR=全部在后”。与260题重复。布置形式字母记忆:F=F(ront)前,R=R(ear)后,第一位是发动机位置,第二位是驱动轮位置。"}, {"id": 297, "oid": "A1-101", "type": "single", "module": "汽车概论与机械基础", "q": "汽车车身的主要作用不包括（　）。", "opts": [{"k": "A", "t": "安置各总成部件"}, {"k": "B", "t": "为乘员提供乘坐空间"}, {"k": "C", "t": "承受和传递整车载荷"}, {"k": "D", "t": "直接将燃料化学能转化为机械能"}], "a": "D", "e": "【考点】车身的作用(单选)。\n【解析】车身用于安置总成、提供乘员空间、承受传递载荷;把化学能转机械能是发动机的功能。故选D(题干问“不包括的”)。\n【易错】“车身=安置+乘坐+承力”。D是发动机职责,注意题干“不包括”。车身不产生动力。"}, {"id": 298, "oid": "A1-102", "type": "single", "module": "汽车概论与机械基础", "q": "关于插电式混合动力汽车（PHEV），下列说法错误的是（　）。", "opts": [{"k": "A", "t": "装有发动机和驱动电机"}, {"k": "B", "t": "动力电池可外接充电"}, {"k": "C", "t": "可纯电行驶一定里程"}, {"k": "D", "t": "不能使用燃油行驶"}], "a": "D", "e": "【考点】PHEV特点(反向选择)。\n【解析】PHEV装有发动机和驱动电机、电池可外接充电、可纯电行驶,也可用燃油(发动机)行驶延长续驶。D说“不能用燃油”,错误,故选D(题干问“错误的”)。\n【易错】“PHEV=油电两用”,当然能用燃油。反向题读清题干问“错误/不包括”。插混的核心优势就是燃油+纯电双模式。"}, {"id": 299, "oid": "A1-103", "type": "single", "module": "汽车概论与机械基础", "q": "汽车转向系的作用是（　）。", "opts": [{"k": "A", "t": "传递动力"}, {"k": "B", "t": "控制汽车按驾驶员选定方向行驶"}, {"k": "C", "t": "支承车身"}, {"k": "D", "t": "储存能量"}], "a": "B", "e": "【考点】转向系作用(单选)。\n【解析】转向系偏转车轮控制行驶方向;传力是传动系、支承是行驶系、储能在飞轮等。故选B。\n【易错】“转向=定向”。与256题重复。四系功能口诀持续复现:传力、支承、定向、减速。"}, {"id": 300, "oid": "A1-104", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车空调系统中，给车厢制冷的压缩机通常由（　）驱动。", "opts": [{"k": "A", "t": "发动机皮带"}, {"k": "B", "t": "高压电驱动的电动压缩机"}, {"k": "C", "t": "手摇机构"}, {"k": "D", "t": "起动机"}], "a": "B", "e": "【考点】新能源汽车维修的安全意识与基础结构(综合)。\n【解析】纯电动车维修必须先断低压负极(使高压接触器断开)再断高压维修开关并等待电容放电,涉及高压安全与电气构造知识;题目场景综合了两个考点,判断为√。\n【易错】“先低压后高压+等待放电”。别直接拔高压插头。高压部件断电后仍有电容储能,须等待5分钟以上或测量确认无电压。"}, {"id": 301, "oid": "A1-105", "type": "single", "module": "汽车概论与机械基础", "q": "下列属于汽车用电设备的是（　）。", "opts": [{"k": "A", "t": "蓄电池"}, {"k": "B", "t": "发电机"}, {"k": "C", "t": "起动机"}, {"k": "D", "t": "动力电池"}], "a": "C", "e": "【考点】汽车用电设备的识别。\n【解析】起动机是把电能转为机械能的用电设备;蓄电池和发电机是电源,动力电池是电动车的能源。故选C。\n【易错】“电源(蓄电池/发电机)vs用电设备(起动机、灯、喇叭)”。动力电池是高压能源,不属于普通用电设备。"}, {"id": 302, "oid": "A1-106", "type": "single", "module": "汽车概论与机械基础", "q": "燃料电池汽车的主要能量转换过程是（　）。", "opts": [{"k": "A", "t": "燃料化学能→热能→机械能"}, {"k": "B", "t": "氢气化学能→电能→机械能（驱动电机）"}, {"k": "C", "t": "电能→化学能"}, {"k": "D", "t": "机械能→电能"}], "a": "B", "e": "【考点】燃料电池的能量转换链。\n【解析】燃料电池把氢气化学能经电化学反应直接转为电能,再由驱动电机把电能转为机械能,不经燃烧做功。故选B。\n【易错】“氢化学能→电能→机械能”三步。内燃机才是“化学能→热能→机械能”(A)。燃料电池无燃烧环节是核心区别。"}, {"id": 303, "oid": "A1-107", "type": "single", "module": "汽车概论与机械基础", "q": "汽车按动力装置分类，以电动机为动力的汽车属于（　）。", "opts": [{"k": "A", "t": "内燃机汽车"}, {"k": "B", "t": "电动汽车"}, {"k": "C", "t": "蒸汽汽车"}, {"k": "D", "t": "太阳能专用车"}], "a": "B", "e": "【考点】汽车按动力装置分类。\n【解析】以电动机为动力的汽车属于电动汽车(纯电、燃料电池等);内燃机汽车以汽油、柴油发动机为动力。故选B。\n【易错】“电机=电动车,发动机=内燃机车”。蒸汽汽车是历史名词,太阳能车按动力装置归电动类。按动力装置分类法记牢。"}, {"id": 304, "oid": "A1-108", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车通常不需要多挡变速器，主要原因是（　）。", "opts": [{"k": "A", "t": "驱动电机低速转矩小"}, {"k": "B", "t": "电机转速范围宽、低速即可输出大转矩，固定速比减速器即可满足"}, {"k": "C", "t": "电机完全不能调速"}, {"k": "D", "t": "为了降低电机效率"}], "a": "B", "e": "【考点】纯电动车不需多挡变速的原因。\n【解析】电机转速范围宽、低速就能输出大转矩,固定速比减速器即可兼顾起步和高速,省去多挡变速,降低成本复杂度。故选B。\n【易错】“电机低速大扭矩”是核心。A说反(电机低速转矩大);C电机完全能调速(D错误理由)。与265题重复考点。"}, {"id": 305, "oid": "A1-109", "type": "single", "module": "汽车概论与机械基础", "q": "汽车制动系中，用于停车后防止车辆溜动的是（　）。", "opts": [{"k": "A", "t": "行车制动"}, {"k": "B", "t": "驻车制动"}, {"k": "C", "t": "发动机制动"}, {"k": "D", "t": "排气制动"}], "a": "B", "e": "【考点】驻车制动的功能。\n【解析】驻车制动(手刹/电子手刹)在停车后使车辆可靠驻留防溜;行车制动用于行驶中减速停车。故选B。\n【易错】“驻车=防溜,行车=减速”。与258、126题重复。发动机制动、排气制动是辅助制动(货车长下坡用),不是驻车。"}, {"id": 306, "oid": "A1-110", "type": "single", "module": "汽车概论与机械基础", "q": "关于纯电动汽车暖风的说法，正确的是（　）。", "opts": [{"k": "A", "t": "利用发动机冷却液余热"}, {"k": "B", "t": "多采用PTC电加热器或热泵空调"}, {"k": "C", "t": "利用排气余热"}, {"k": "D", "t": "不需要暖风"}], "a": "B", "e": "【考点】纯电动车暖风方式。\n【解析】纯电动车无发动机冷却液余热,暖风多用PTC电加热器或热泵空调;燃油车才用冷却液余热。故选B。\n【易错】“纯电=电加热/热泵,油车=冷却液余热”。与240题重复。热泵比PTC省电,是高端纯电主流方案。"}, {"id": 307, "oid": "A1-111", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程柴油机的点火（着火）方式是（　）。", "opts": [{"k": "A", "t": "火花塞点燃"}, {"k": "B", "t": "压缩终了高温使柴油自燃（压燃）"}, {"k": "C", "t": "电热塞点燃混合气"}, {"k": "D", "t": "电火花点燃柴油"}], "a": "B", "e": "【考点】柴油机的着火方式。\n【解析】柴油机压缩纯空气至终了,温度超过柴油自燃点,喷油后自行着火(压燃);火花塞点燃是汽油机。故选B。\n【易错】“柴油压燃、汽油点燃”。电热塞只辅助冷起动,不是点火方式。与248、295题重复,点火方式对比是必考点。"}, {"id": 308, "oid": "A1-112", "type": "single", "module": "汽车概论与机械基础", "q": "四轮驱动（4WD）汽车的特点是（　）。", "opts": [{"k": "A", "t": "只有前轮驱动"}, {"k": "B", "t": "只有后轮驱动"}, {"k": "C", "t": "全部车轮都可作为驱动轮，通过性好"}, {"k": "D", "t": "结构最简单"}], "a": "C", "e": "【考点】4WD的特点(单选)。\n【解析】4WD把动力传给前后桥,四轮都可作驱动轮,附着和通过性好,但需分动器、结构复杂、能耗高。故选C。\n【易错】“4WD=四轮驱动+通过性好”。D“结构最简单”说反。与247题重复。注意4WD不是前后轮流驱动,是同时四轮驱动。"}, {"id": 309, "oid": "A1-113", "type": "single", "module": "汽车概论与机械基础", "q": "汽车发动机按冷却方式可分为水冷式和（　）。", "opts": [{"k": "A", "t": "风冷式"}, {"k": "B", "t": "油冷式"}, {"k": "C", "t": "自然冷却式"}, {"k": "D", "t": "液氮冷却式"}], "a": "A", "e": "【考点】发动机按冷却方式分类。\n【解析】发动机按冷却方式分水冷(冷却液循环)和风冷(空气吹散热片);现代汽车以水冷为主。故选A。\n【易错】“水冷+风冷”两类。油冷是辅助润滑,不是独立冷却方式。与254题重复考点。"}, {"id": 310, "oid": "A1-114", "type": "single", "module": "汽车概论与机械基础", "q": "下列部件中，属于纯电动汽车高压系统的是（　）。", "opts": [{"k": "A", "t": "12V蓄电池"}, {"k": "B", "t": "动力电池包、驱动电机及高压线束"}, {"k": "C", "t": "雨刮电机"}, {"k": "D", "t": "音响喇叭"}], "a": "B", "e": "【考点】纯电动车高压系统的组成。\n【解析】动力电池包、驱动电机、电机控制器MCU和橙色高压线束属高压回路(数百伏);12V蓄电池、雨刮、音响是低压设备。故选B。\n【易错】“橙色+电池+电机+MCU=高压”。12V电瓶、雨刮、喇叭都是低压。区分高/低压系统是纯电维修安全基础。"}, {"id": 311, "oid": "A1-115", "type": "single", "module": "汽车概论与机械基础", "q": "汽车底盘中，将动力减速增扭并最终传给驱动车轮的是（　）。", "opts": [{"k": "A", "t": "转向系"}, {"k": "B", "t": "行驶系"}, {"k": "C", "t": "传动系"}, {"k": "D", "t": "制动系"}], "a": "C", "e": "【考点】传动系的功能定位。\n【解析】传动系通过变速器、主减速器减速增扭并把动力传给驱动轮;转向、行驶、制动系不传递动力。故选C。\n【易错】“减速增扭+传力=传动系”。与285题互补:285考制动系“减速停车”,本题考传动系“减速增扭”。四系功能反复考。"}, {"id": 312, "oid": "A1-116", "type": "single", "module": "汽车概论与机械基础", "q": "对比增程式与普通插电混动，判断两者本质区别的关键构造特征是（　）。", "opts": [{"k": "A", "t": "是否装有动力电池"}, {"k": "B", "t": "发动机是否直接驱动车轮"}, {"k": "C", "t": "是否装有驱动电机"}, {"k": "D", "t": "是否装有车轮"}], "a": "B", "e": "【考点】增程与插混的本质区别。\n【解析】增程车发动机只发电不直驱车轮,插混发动机可经变速器直接驱动车轮——这是两者本质区别;两者都有电池、电机、车轮。故选B。\n【易错】“是否直驱”是判断本质特征。A、C都有,不能区分;D更是两者共有。与273题重复,直驱与否是关键。"}, {"id": 313, "oid": "A1-117", "type": "single", "module": "汽车概论与机械基础", "q": "现代轿车普遍采用的车身承载形式是（　）。", "opts": [{"k": "A", "t": "非承载式车身"}, {"k": "B", "t": "承载式车身"}, {"k": "C", "t": "半承载式车身"}, {"k": "D", "t": "框架式车身"}], "a": "B", "e": "【考点】承载式与非承载式车身。\n【解析】承载式车身无独立车架,车身承受全部载荷,重量轻、重心低,轿车广泛采用;非承载式有独立车架,多用于货车、越野车。故选B。\n【易错】“轿车=承载式,货车越野=非承载式”。半承载式是过渡形式。承重结构:承载式靠车身壳体,非承载式靠车架。"}, {"id": 314, "oid": "A1-118", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车相比传统燃油汽车，需要重点遵守的特殊安全操作是（　）。", "opts": [{"k": "A", "t": "断电下电、防止高压触电"}, {"k": "B", "t": "防止机油泄漏"}, {"k": "C", "t": "无任何特殊要求"}, {"k": "D", "t": "只需防火花"}], "a": "A", "e": "【考点】纯电动车作业的特殊安全。\n【解析】纯电动车动力电池电压达数百伏,作业前必须下电(断低压→断高压维修开关)、验电、戴绝缘手套防触电。故选A。\n【易错】“高压触电防护”是纯电与燃油车最大安全差异。防机油泄漏、防火花是燃油车也要做的,不是“特殊”要求。"}, {"id": 315, "oid": "A1-119", "type": "single", "module": "汽车概论与机械基础", "q": "汽车传动系中，离合器位于（　）之间。", "opts": [{"k": "A", "t": "发动机与变速器"}, {"k": "B", "t": "变速器与驱动桥"}, {"k": "C", "t": "车轮与车桥"}, {"k": "D", "t": "转向盘与转向器"}], "a": "A", "e": "【考点】离合器的安装位置。\n【解析】离合器装在发动机飞轮与变速器之间,负责切断和接合动力,便于起步和平顺换挡。故选A。\n【易错】“飞轮与变速器之间”。手动挡才有离合器;自动挡用液力变矩器或双离合。变速器与驱动桥之间是万向传动装置。"}, {"id": 316, "oid": "A1-120", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于新能源汽车动力蓄电池的说法，正确的是（　）。", "opts": [{"k": "A", "t": "电压都是12V"}, {"k": "B", "t": "是储存和供给电能的核心部件，电压通常为数百伏"}, {"k": "C", "t": "与传统汽车蓄电池完全相同"}, {"k": "D", "t": "不能反复充放电"}], "a": "B", "e": "【考点】动力蓄电池的特点。\n【解析】动力电池是电动车储能核心,电压多为300～800V,可反复充放电,与12V起动蓄电池完全不同。故选B。\n【易错】“动力电池=高压可充电,12V电瓶=低压起动”。A说电压都12V、C说完全相同、D说不能充电,全错。注意两者不能互换。"}, {"id": 317, "oid": "A1-121", "type": "single", "module": "汽车概论与机械基础", "q": "汽车车身外部覆盖件不包括（　）。", "opts": [{"k": "A", "t": "发动机罩"}, {"k": "B", "t": "车门"}, {"k": "C", "t": "翼子板"}, {"k": "D", "t": "车架纵梁"}], "a": "D", "e": "【考点】车身覆盖件与结构件区分。\n【解析】发动机罩、车门、翼子板是外部覆盖件;车架纵梁是承载骨架件,属车架(结构件),不是覆盖件。故选D(题干问“不包括的”)。\n【易错】“覆盖件=蒙皮外壳,结构件=骨架”。车架纵梁承担载荷,是结构件。与264题重复覆盖件概念。"}, {"id": 318, "oid": "A1-122", "type": "single", "module": "汽车概论与机械基础", "q": "关于纯电动汽车行驶噪声，正确的说法是（　）。", "opts": [{"k": "A", "t": "完全没有任何噪声"}, {"k": "B", "t": "取消了发动机噪声，但仍有路噪、风噪和电机噪声"}, {"k": "C", "t": "比燃油车噪声大得多"}, {"k": "D", "t": "只有发动机噪声"}], "a": "B", "e": "【考点】纯电动车噪声特点。\n【解析】纯电动车取消发动机噪声,但仍有轮胎路噪、风噪和电机噪声;低速时还需外部提示音提醒行人。故选B。\n【易错】“无发动机≠无声”。A“完全无噪声”绝对化,错。与257题重复。高速时风噪胎噪是主要噪声源。"}, {"id": 319, "oid": "A1-123", "type": "single", "module": "汽车概论与机械基础", "q": "汽车发动机的功用是将燃料燃烧的热能转化为（　）。", "opts": [{"k": "A", "t": "电能"}, {"k": "B", "t": "机械能"}, {"k": "C", "t": "化学能"}, {"k": "D", "t": "液压能"}], "a": "B", "e": "【考点】发动机的能量转换。\n【解析】发动机把燃料化学能经燃烧变热能,再经曲柄连杆机构转为曲轴旋转的机械能对外输出。故选B。\n【易错】“化学能→热能→机械能”。输出的是机械能。与229题重复。电动车电机是电能→机械能,别混。"}, {"id": 320, "oid": "A1-124", "type": "single", "module": "汽车概论与机械基础", "q": "下列哪种车型在构造上同时具有“可外接充电的大容量动力电池＋发动机＋驱动电机”？（　）", "opts": [{"k": "A", "t": "传统燃油轿车"}, {"k": "B", "t": "纯电动汽车"}, {"k": "C", "t": "插电式混合动力汽车"}, {"k": "D", "t": "燃料电池汽车"}], "a": "C", "e": "【考点】PHEV的构造组合识别。\n【解析】插电混动PHEV同时具有发动机、驱动电机和可外接充电的大容量动力电池;燃油车无电机大电池,纯电无发动机,燃料电池以氢代油。故选C。\n【易错】“三合一(发动机+电机+大电池)=PHEV”。三要素同时满足才选插混。增程也有三要素但发动机不直驱。"}, {"id": 321, "oid": "A1-125", "type": "single", "module": "汽车概论与机械基础", "q": "汽车行驶系中，用于缓和冲击、衰减振动的悬架部件是（　）。", "opts": [{"k": "A", "t": "车架与车桥"}, {"k": "B", "t": "弹性元件与减振器"}, {"k": "C", "t": "车轮与轮胎"}, {"k": "D", "t": "主减速器与差速器"}], "a": "B", "e": "【考点】悬架缓冲衰减部件。\n【解析】悬架中弹性元件(弹簧)缓冲冲击、减振器衰减振动;车架车桥是支承件,主减速器差速器属传动系。故选B。\n【易错】“弹性元件=缓冲,减振器=衰减”。与117题重复。两个部件配套工作:没减振器,弹簧一直颠。"}, {"id": 322, "oid": "A1-126", "type": "single", "module": "汽车概论与机械基础", "q": "关于汽车布置形式FF、FR、RR，下列对应正确的是（　）。", "opts": [{"k": "A", "t": "FF—后置后驱"}, {"k": "B", "t": "FR—前置前驱"}, {"k": "C", "t": "RR—后置后驱"}, {"k": "D", "t": "FF—四轮驱动"}], "a": "C", "e": "【考点】布置形式字母对应。\n【解析】FF=前置前驱、FR=前置后驱、RR=后置后驱、4WD=四轮驱动。A、B把FF/FR对应反了,D把FF说成四驱。故选C。\n【易错】“第一位=发动机位置,第二位=驱动轮位置”。F=Front前,R=Rear后。FF=前面发动机+前面驱动轮=前置前驱。"}, {"id": 323, "oid": "A1-127", "type": "single", "module": "汽车概论与机械基础", "q": "汽车电气设备普遍采用的供电制式是（　）。", "opts": [{"k": "A", "t": "高压交流电、正极搭铁"}, {"k": "B", "t": "低压直流电、负极搭铁"}, {"k": "C", "t": "高压直流电、双线制"}, {"k": "D", "t": "低压交流电"}], "a": "B", "e": "【考点】汽车电气供电制式。\n【解析】汽车用12V/24V低压直流、单线制、负极搭铁。故选B。\n【易错】“低压直流+负极搭铁”是统一制式。高压交流、双线制、正极搭铁都与实际不符。与228、268题重复。"}, {"id": 324, "oid": "A1-128", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车上保留12V低压蓄电池的主要作用是（　）。", "opts": [{"k": "A", "t": "驱动车辆行驶"}, {"k": "B", "t": "给高压动力电池充电"}, {"k": "C", "t": "为整车控制器等低压设备供电并作上下电控制电源"}, {"k": "D", "t": "储存全部刹车能量"}], "a": "C", "e": "【考点】纯电车12V蓄电池的作用。\n【解析】12V蓄电池给整车控制器、灯光等低压设备供电,并作为上下电控制电源(接触器吸合需低压电);驱动靠动力电池,高压充电由OBC完成。故选C。\n【易错】“12V管低压和控制”。A驱动行驶是动力电池的事,B充电是OBC的事,D刹车能量回收进动力电池。12V亏电会导致高压无法上电。"}, {"id": 325, "oid": "A1-129", "type": "single", "module": "汽车概论与机械基础", "q": "下列属于汽车底盘制动系部件的是（　）。", "opts": [{"k": "A", "t": "离合器"}, {"k": "B", "t": "制动器"}, {"k": "C", "t": "变速器"}, {"k": "D", "t": "转向器"}], "a": "B", "e": "【考点】制动系部件识别。\n【解析】制动器(盘式/鼓式)是制动系部件;离合器、变速器属传动系,转向器属转向系。故选B。\n【易错】“制动器=制动系”。按系统归属识别部件:离合器/变速器→传动系,转向器→转向系。与系统组成题配套考。"}, {"id": 326, "oid": "A1-130", "type": "single", "module": "汽车概论与机械基础", "q": "与传统汽车相比，下列哪项不是纯电动汽车在构造上的主要变化（　）。", "opts": [{"k": "A", "t": "以驱动电机取代发动机"}, {"k": "B", "t": "以动力电池取代燃油箱"}, {"k": "C", "t": "取消了排气系统"}, {"k": "D", "t": "保留了传统的多挡手动变速器"}], "a": "D", "e": "【考点】纯电动车结构变化(反向)。\n【解析】纯电车以电机代发动机、以电池代油箱、取消排气系统;因电机低速大扭矩,一般不保留多挡手动变速器。D说“保留多挡手动变速器”,错误,故选D(题干问“不是主要变化”)。\n【易错】“纯电=无多挡变速器”。A、B、C都是真实变化,D是错误说法。与265、288题重复。"}, {"id": 327, "oid": "A1-131", "type": "single", "module": "汽车概论与机械基础", "q": "按车身承载方式，越野车和货车常采用（　）。", "opts": [{"k": "A", "t": "承载式车身"}, {"k": "B", "t": "非承载式车身（有独立车架）"}, {"k": "C", "t": "无车架车身"}, {"k": "D", "t": "半骨架式车身"}], "a": "B", "e": "【考点】非承载式车身的应用。\n【解析】非承载式车身有独立车架,刚度大、承载强、抗扭转好,适合货车和越野车;轿车多用承载式。故选B。\n【易错】“货车越野=非承载式(带车架)”。与313题对比记忆:轿车承载式、货车越野非承载式。车架纵梁+横梁结构。"}, {"id": 328, "oid": "A1-132", "type": "single", "module": "汽车概论与机械基础", "q": "关于交流异步（感应）驱动电机，下列说法正确的是（　）。", "opts": [{"k": "A", "t": "必须使用永磁体"}, {"k": "B", "t": "结构简单坚固、免维护，但效率通常略低于永磁同步电机"}, {"k": "C", "t": "不能调速"}, {"k": "D", "t": "只能单向旋转"}], "a": "B", "e": "【考点】交流异步电机的特点。\n【解析】异步电机靠旋转磁场感应产生转矩,转子无永磁体、结构坚固耐用,可变频调速和正反转,但效率略低于永磁同步。故选B。\n【易错】“异步=无永磁、简单耐用、效率略低”。与243题重复。特斯拉曾用异步,现在主驱多为永磁同步。"}, {"id": 329, "oid": "A1-133", "type": "single", "module": "汽车概论与机械基础", "q": "汽车传动系中，变速器的主要功用是（　）。", "opts": [{"k": "A", "t": "改变传动比，扩大转矩和转速变化范围，并可实现倒向行驶"}, {"k": "B", "t": "产生动力"}, {"k": "C", "t": "制动"}, {"k": "D", "t": "转向"}], "a": "A", "e": "【考点】变速器的主要功用。\n【解析】变速器通过不同挡位改变传动比,扩大转矩和转速变化范围,并设空挡(怠速停车)和倒挡(倒向行驶)。产生动力是发动机,制动、转向另有其系。故选A。\n【易错】“变速器=变传动比+空挡+倒挡”。注意“倒向行驶”也是变速器功能。产生动力的是发动机,别混。"}, {"id": 330, "oid": "A1-134", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于燃料电池汽车的说法，错误的是（　）。", "opts": [{"k": "A", "t": "以氢气为燃料"}, {"k": "B", "t": "燃料电池堆将化学能转化为电能"}, {"k": "C", "t": "行驶中排放二氧化碳"}, {"k": "D", "t": "仍需驱动电机驱动车轮"}], "a": "C", "e": "【考点】燃料电池车特点(反向)。\n【解析】燃料电池车以氢气为燃料,电堆把化学能转电能,由电机驱动车轮,氢氧反应只生成水,不排CO2。C说“排放二氧化碳”,错误,故选C(题干问“错误的”)。\n【易错】“FCEV=只排水”。与281题重复。反向题读清“错误”二字,不排CO2是核心考点。"}, {"id": 331, "oid": "A1-135", "type": "single", "module": "汽车概论与机械基础", "q": "汽车车身的基础件是（　）。", "opts": [{"k": "A", "t": "车身壳体"}, {"k": "B", "t": "座椅"}, {"k": "C", "t": "仪表板"}, {"k": "D", "t": "保险杠"}], "a": "A", "e": "【考点】车身基础件。\n【解析】车身壳体是承载基础件,覆盖件和内外饰都安装在它上面;座椅、仪表板、保险杠是附件或装饰件。故选A。\n【易错】“基础件=车身壳体”。与264题重复:壳体是基础,覆盖件/内饰是附属。基础件决定结构强度。"}, {"id": 332, "oid": "A1-136", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车的制动系统在传统液压制动基础上，多了（　）协同工作。", "opts": [{"k": "A", "t": "再生制动（能量回收）"}, {"k": "B", "t": "鼓式制动"}, {"k": "C", "t": "盘式制动"}, {"k": "D", "t": "驻车制动"}], "a": "A", "e": "【考点】纯电动车制动系统特点。\n【解析】电动车制动时电机再生制动与液压制动协同:优先回收能量(动能转电能),不足时液压制动补充。鼓式/盘式是制动器结构类型,驻车制动本就有。故选A。\n【易错】“再生制动+液压制动协同”。再生制动是纯电特有的新增功能。鼓式/盘式是传统结构,不是新增。"}, {"id": 333, "oid": "A1-137", "type": "single", "module": "汽车概论与机械基础", "q": "下列部件中属于发动机的是（　）。", "opts": [{"k": "A", "t": "把燃料化学能转化为机械能的动力装置"}, {"k": "B", "t": "把电能转化为光能的装置"}, {"k": "C", "t": "储存电能的装置"}, {"k": "D", "t": "传递转向力的装置"}], "a": "A", "e": "【考点】发动机的定义识别。\n【解析】发动机是把燃料化学能转化为机械能的动力装置;电能转光能是灯光、储能是蓄电池、传转向力是转向器。故选A。\n【易错】“化学能→机械能=发动机”。用“能量转换”识别部件:光能(灯)、储能(电池)、转向(转向器)。功能定义题。"}, {"id": 334, "oid": "A1-138", "type": "single", "module": "汽车概论与机械基础", "q": "增程式电动汽车长途行驶时，正确的能量流动路线是（　）。", "opts": [{"k": "A", "t": "发动机→车轮"}, {"k": "B", "t": "发动机→发电机→动力电池/驱动电机→车轮"}, {"k": "C", "t": "车轮→发动机"}, {"k": "D", "t": "动力电池→发动机"}], "a": "B", "e": "【考点】增程车能量流动路线。\n【解析】增程车长途行驶:发动机→发电机→(动力电池)/驱动电机→车轮,发动机只发电不直驱车轮。故选B。\n【易错】“发动机→发电机→电机→车轮”链条。A“发动机→车轮”是插混直驱。与280题重复。能量流方向题按链条选。"}, {"id": 335, "oid": "A1-139", "type": "single", "module": "汽车概论与机械基础", "q": "汽车电气设备中，用来起动发动机的是（　）。", "opts": [{"k": "A", "t": "发电机"}, {"k": "B", "t": "起动机"}, {"k": "C", "t": "蓄电池"}, {"k": "D", "t": "点火线圈"}], "a": "B", "e": "【考点】起动机的作用。\n【解析】起动机把蓄电池电能转为机械能,带动曲轴旋转起动发动机;发电机是运转后供电,点火线圈产生高压电。故选B。\n【易错】“起动用起动机、充电用发电机、点火用线圈”。与301题配套:起动机是用电设备不是电源。起动瞬间电流巨大(200A以上)。"}, {"id": 336, "oid": "A1-140", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车“三电”系统中，负责整车能量与扭矩分配协调的核心控制器组合是（　）。", "opts": [{"k": "A", "t": "刹车灯开关与点烟器"}, {"k": "B", "t": "整车控制器VCU、电机控制器MCU和电池管理系统BMS"}, {"k": "C", "t": "雨刮继电器与闪光器"}, {"k": "D", "t": "玻璃升降开关"}], "a": "B", "e": "【考点】三电系统的控制器。\n【解析】VCU(整车控制器)统筹整车能量与扭矩分配、MCU(电机控制器)控制驱动电机、BMS(电池管理系统)管理动力电池,三者构成电控核心。故选B。\n【易错】“VCU+MCU+BMS”三控制器缩写要记。A、C、D都是低压小电器,与电控核心无关。三电=电池+电机+电控。"}, {"id": 337, "oid": "A1-141", "type": "single", "module": "汽车概论与机械基础", "q": "现代汽车发动机普遍使用的两大燃料是汽油和（　）。", "opts": [{"k": "A", "t": "煤"}, {"k": "B", "t": "柴油"}, {"k": "C", "t": "酒精"}, {"k": "D", "t": "煤气"}], "a": "B", "e": "【考点】车用两大燃料。\n【解析】现代汽车内燃机最常用汽油和柴油;煤、煤气不是车用燃料,酒精仅作掺烧。故选B。\n【易错】“汽油+柴油=两大燃料”。酒精做掺烧(E10乙醇汽油)不是独立主流燃料。煤气/煤用于固定式发动机。"}, {"id": 338, "oid": "A1-142", "type": "single", "module": "汽车概论与机械基础", "q": "关于纯电动汽车高压系统维修，正确的做法是（　）。", "opts": [{"k": "A", "t": "可直接拆解高压部件"}, {"k": "B", "t": "维修前应先断电下电、验电并做好绝缘防护"}, {"k": "C", "t": "高压与低压相同，无特殊要求"}, {"k": "D", "t": "不必等待电容放电"}], "a": "B", "e": "【考点】纯电动车高压维修操作。\n【解析】高压维修顺序:先断低压蓄电池负极→拔高压维修开关→等待电容放电→验电→戴绝缘手套作业。B描述完整,故选B。\n【易错】“断电→放电→验电→防护”四步。A直接拆高压、C无特殊要求、D不等放电,都危险。与314题重复,高压安全必考。"}, {"id": 339, "oid": "A1-143", "type": "single", "module": "汽车概论与机械基础", "q": "汽车行驶系的作用是（　）。", "opts": [{"k": "A", "t": "支承汽车总质量，保证行驶平顺和操纵稳定"}, {"k": "B", "t": "产生动力"}, {"k": "C", "t": "改变车速"}, {"k": "D", "t": "点火"}], "a": "A", "e": "【考点】行驶系的作用。\n【解析】行驶系支承汽车总质量,通过悬架和车轮缓和冲击,保证行驶平顺和操纵稳定。产生动力、变速、点火各有其系。故选A。\n【易错】“行驶系=支承+平顺+稳定”。与四系功能口诀配套。点火是点火系/电控,变速是传动系。"}, {"id": 340, "oid": "A1-144", "type": "single", "module": "汽车概论与机械基础", "q": "现代纯电动汽车把大容量动力电池包平铺布置在车身底板上，其主要目的是（　）。", "opts": [{"k": "A", "t": "增大风阻"}, {"k": "B", "t": "降低整车重心、改善操纵稳定性并充分利用空间"}, {"k": "C", "t": "提高离地间隙"}, {"k": "D", "t": "便于拆卸油箱"}], "a": "B", "e": "【考点】纯电车电池平铺布置的意义。\n【解析】动力电池平铺在车身底板:降低整车重心(提升操纵稳定性),且不占用乘坐和行李空间,还利于碰撞安全。故选B。\n【易错】“电池底盘一体化(CTC/CTB)=低重心+省空间”。A增大风阻、C提高离地间隙、D拆油箱都与实际相反。"}, {"id": 341, "oid": "A1-145", "type": "single", "module": "汽车概论与机械基础", "q": "汽车底盘转向系通过转动（　）来控制行驶方向。", "opts": [{"k": "A", "t": "离合器踏板"}, {"k": "B", "t": "转向盘"}, {"k": "C", "t": "制动踏板"}, {"k": "D", "t": "变速杆"}], "a": "B", "e": "【考点】转向系的操作部件。\n【解析】驾驶员转动转向盘,经转向器和传动机构偏转前轮控制方向。离合器踏板、制动踏板、变速杆不控制方向。故选B。\n【易错】“控制方向=转向盘”。对比:制动踏板管减速、离合器踏板管动力通断、变速杆管挡位。"}, {"id": 342, "oid": "A1-146", "type": "single", "module": "汽车概论与机械基础", "q": "关于油电混合（HEV）与插电混合（PHEV），下列区别正确的是（　）。", "opts": [{"k": "A", "t": "HEV可外接充电，PHEV不能"}, {"k": "B", "t": "PHEV电池大、可外接充电纯电行驶，HEV电池小、不能外接充电"}, {"k": "C", "t": "两者构造完全相同"}, {"k": "D", "t": "HEV没有发动机"}], "a": "B", "e": "【考点】HEV与PHEV区别(单选)。\n【解析】PHEV电池大、可外接充电、可纯电行驶;HEV电池小、不能外接充电,靠发动机和回收能量维持电量;两者都有发动机。故选B。\n【易错】“PHEV可充、HEV不充”。A说反,C完全相同错,D“HEV无发动机”错。与233、255、284题重复,此区别高频必考。"}, {"id": 343, "oid": "A1-147", "type": "single", "module": "汽车概论与机械基础", "q": "下列属于汽车行驶系部件的是（　）。", "opts": [{"k": "A", "t": "车架"}, {"k": "B", "t": "喷油器"}, {"k": "C", "t": "火花塞"}, {"k": "D", "t": "机油泵"}], "a": "A", "e": "【考点】行驶系部件识别。\n【解析】车架(或承载车身)是行驶系基础件;喷油器、火花塞、机油泵都属于发动机部件。故选A。\n【易错】“按系统认部件”:喷油器/火花塞/机油泵→发动机;车架/悬架/车轮→行驶系。与325题互补。"}, {"id": 344, "oid": "A1-148", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车中，把动力电池直流电逆变为三相交流电、控制驱动电机转速和转矩的部件是（　）。", "opts": [{"k": "A", "t": "车载充电机"}, {"k": "B", "t": "电机控制器（MCU）"}, {"k": "C", "t": "DC/DC转换器"}, {"k": "D", "t": "低压蓄电池"}], "a": "B", "e": "【考点】电机控制器MCU的作用。\n【解析】MCU把动力电池直流电逆变为三相交流电,控制驱动电机转速和转矩(变频调速);OBC负责交流充电整流,DC/DC负责高压转低压。故选B。\n【易错】“MCU=直流变交流控电机”。三个转换器再区分:MCU(逆变控电机)、OBC(充电整流)、DC/DC(高压降压)。与278、279题配套。"}, {"id": 345, "oid": "A1-149", "type": "single", "module": "汽车概论与机械基础", "q": "传统燃油车以油箱储存燃油，纯电动汽车则以（　）储存电能。", "opts": [{"k": "A", "t": "油箱"}, {"k": "B", "t": "动力蓄电池包"}, {"k": "C", "t": "储气罐"}, {"k": "D", "t": "水箱"}], "a": "B", "e": "【考点】纯电车储能方式。\n【解析】纯电动车以动力电池包储存电能,取代燃油车的油箱;储气罐用于天然气车或燃料电池车。故选B。\n【易错】“油箱vs电池包vs储气罐”对应“燃油车/纯电车/气体车”。能源储存方式随车型不同。"}, {"id": 346, "oid": "A1-150", "type": "single", "module": "汽车概论与机械基础", "q": "关于承载式车身，下列说法正确的是（　）。", "opts": [{"k": "A", "t": "有独立车架"}, {"k": "B", "t": "取消独立车架、车身承受全部载荷，轿车广泛采用"}, {"k": "C", "t": "只用于货车"}, {"k": "D", "t": "车身不承受任何力"}], "a": "B", "e": "【考点】承载式车身特点。\n【解析】承载式车身取消独立车架、车身承受全部载荷,质量轻、重心低,轿车广泛采用;非承载式有独立车架,多用于货车。故选B。\n【易错】“承载式=无车架承全载”。A“有独立车架”是非承载式,C“只用于货车”错,D“车身不受力”错。与313题重复。"}, {"id": 347, "oid": "A1-151", "type": "single", "module": "汽车概论与机械基础", "q": "下列属于汽车电源的是（　）。", "opts": [{"k": "A", "t": "前照灯"}, {"k": "B", "t": "蓄电池"}, {"k": "C", "t": "雨刮器"}, {"k": "D", "t": "电动车窗"}], "a": "B", "e": "【考点】电源识别。\n【解析】蓄电池是电源之一(与发电机并列);前照灯、雨刮器、电动车窗都是用电设备。故选B。\n【易错】“电源=蓄电池+发电机”。凡是灯、窗、刮、喇叭都是用电设备。与301、293题同考点,电源vs用电设备反复考。"}, {"id": 348, "oid": "A1-152", "type": "single", "module": "汽车概论与机械基础", "q": "某车既可纯电行驶、电量不足时发动机发电驱动电机，发动机也可在高效区直接驱动车轮，它最可能是（　）。", "opts": [{"k": "A", "t": "纯电动汽车"}, {"k": "B", "t": "增程式电动汽车"}, {"k": "C", "t": "插电式混合动力汽车"}, {"k": "D", "t": "燃料电池汽车"}], "a": "C", "e": "【考点】车型识别(发动机可直驱)。\n【解析】发动机既发电又可直接驱动车轮=插电混动(含功率分流/并联混动);增程发动机不直驱,纯电无发动机,燃料电池以氢发电。故选C。\n【易错】“能直驱=插混”。与273、312题重复,直驱是判断关键。题目描述“发动机高效区直接驱动车轮”直接指向插混。"}, {"id": 349, "oid": "A1-153", "type": "single", "module": "汽车概论与机械基础", "q": "汽车传动系中，万向传动装置主要用于连接（　）。", "opts": [{"k": "A", "t": "发动机与车轮"}, {"k": "B", "t": "变速器与驱动桥，适应二者间角度和距离变化"}, {"k": "C", "t": "转向盘与转向器"}, {"k": "D", "t": "制动器与车轮"}], "a": "B", "e": "【考点】万向传动装置的作用。\n【解析】万向传动装置(万向节、传动轴等)连接变速器与驱动桥,适应悬架跳动引起的角度和距离变化。故选B。\n【易错】“变速器↔驱动桥”。与104题重复。转向盘↔转向器是转向轴传动,制动器↔车轮是制动传动,不属万向传动。"}, {"id": 350, "oid": "A1-154", "type": "single", "module": "汽车概论与机械基础", "q": "关于纯电动汽车取消发动机后的说法，错误的是（　）。", "opts": [{"k": "A", "t": "不需要更换机油"}, {"k": "B", "t": "没有排气污染"}, {"k": "C", "t": "仍需要冷却系统冷却电池和电机"}, {"k": "D", "t": "不再需要任何高压安全防护"}], "a": "D", "e": "【考点】纯电动车安全防护(反向)。\n【解析】纯电动车虽无发动机,但有数百伏高压系统,维修保养仍须严格高压安全防护;D说“不再需要任何高压防护”,错误,故选D(题干问“错误的”)。\n【易错】“无发动机≠无高压”。A、B、C都是取消发动机后的真实特点。反向题:高压防护永远需要。"}, {"id": 351, "oid": "A1-155", "type": "single", "module": "汽车概论与机械基础", "q": "传统汽车常说的“三大件”一般指发动机、变速器和（　）。", "opts": [{"k": "A", "t": "底盘（含车桥传动）"}, {"k": "B", "t": "音响"}, {"k": "C", "t": "座椅"}, {"k": "D", "t": "空调"}], "a": "A", "e": "【考点】汽车三大件。\n【解析】传统汽车“三大件”指发动机、变速器和底盘,是决定性能品质的核心总成;音响、座椅、空调是配置件。故选A。\n【易错】“三大件=发动机+变速器+底盘”。这是行业俗称。注意与“四大组成(发动机+底盘+车身+电气)”区分。"}, {"id": 352, "oid": "A1-156", "type": "single", "module": "汽车概论与机械基础", "q": "关于新能源汽车高压系统电压，正确的说法是（　）。", "opts": [{"k": "A", "t": "与普通汽车一样为12V"}, {"k": "B", "t": "动力电池电压一般为数百伏（300～800V），属高压危险回路"}, {"k": "C", "t": "只有24V"}, {"k": "D", "t": "为安全均低于6V"}], "a": "B", "e": "【考点】新能源汽车高压电压等级。\n【解析】动力电池电压一般300～800V直流,远超安全电压(36V),属高压危险回路;12V/24V只是低压辅助系统。故选B。\n【易错】“数百伏=高压”。A12V、C24V、D低于6V都是低压说法。高压防护贯穿纯电维修全流程。"}, {"id": 353, "oid": "A1-157", "type": "single", "module": "汽车概论与机械基础", "q": "发动机前置、前轮驱动的布置形式，英文缩写是（　）。", "opts": [{"k": "A", "t": "FR"}, {"k": "B", "t": "FF"}, {"k": "C", "t": "RR"}, {"k": "D", "t": "4WD"}], "a": "B", "e": "【考点】布置形式缩写。\n【解析】FF=前置前驱(Front engine Front drive);FR前置后驱、RR后置后驱、4WD四轮驱动。故选B。\n【易错】“FF=前置前驱”。与322题重复:第一位发动机位置、第二位驱动轮位置。F=前、R=后。"}, {"id": 354, "oid": "A1-158", "type": "single", "module": "汽车概论与机械基础", "q": "关于汽车底盘的功能，下列说法错误的是（　）。", "opts": [{"k": "A", "t": "传动系传递动力"}, {"k": "B", "t": "行驶系支承整车并保证行驶"}, {"k": "C", "t": "转向系控制方向"}, {"k": "D", "t": "底盘直接产生动力"}], "a": "D", "e": "【考点】底盘功能(反向)。\n【解析】底盘承担传力(传动)、行驶(行驶)、定向(转向)、减速(制动),不产生动力;产生动力的是发动机。D说“底盘直接产生动力”,错误,故选D(题干问“错误的”)。\n【易错】“底盘不产动力”。A、B、C都是底盘功能。反向题常把“产生动力”安到底盘上,选错者多。"}, {"id": 355, "oid": "A1-159", "type": "single", "module": "汽车概论与机械基础", "q": "下列部件中，属于纯电动汽车而不属于传统燃油汽车的是（　）。", "opts": [{"k": "A", "t": "驱动电机与动力电池"}, {"k": "B", "t": "散热器"}, {"k": "C", "t": "制动盘"}, {"k": "D", "t": "转向器"}], "a": "A", "e": "【考点】纯电车特有部件。\n【解析】驱动电机和动力电池是纯电动车特有的动力与储能部件;散热器、制动盘、转向器在两类车上都有(纯电有电池散热器)。故选A。\n【易错】“电机+电池=纯电特有”。散热器、制动盘、转向器两类车都有。注意纯电车也有散热系统(冷却电池电机)。"}, {"id": 356, "oid": "A1-160", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车取消发动机后，其典型动力传递路线为（　）。", "opts": [{"k": "A", "t": "发动机→离合器→变速器→传动轴→车轮"}, {"k": "B", "t": "动力电池→电机控制器→驱动电机→减速器→驱动车轮"}, {"k": "C", "t": "油箱→化油器→发动机"}, {"k": "D", "t": "发电机→蓄电池"}], "a": "B", "e": "【考点】纯电动车动力传递路线。\n【解析】纯电动车:动力电池→MCU(逆变)→驱动电机→固定速比减速器→车轮;A是燃油车路线(发动机→离合器→变速器→传动轴→车轮),纯电无发动机和化油器。故选B。\n【易错】“电→控→机→减速→轮”链条。对比燃油车“油机→离合→变速→轴→轮”。两路线对比记忆。"}, {"id": 357, "oid": "A1-161", "type": "single", "module": "汽车概论与机械基础", "q": "某技师对一辆可上绿牌的乘用车进行保养，发现该车既无机油滤清器也无排气消声器，却有橙色高压线束和一个12V蓄电池。据此判断该车最可能是（　）。", "opts": [{"k": "A", "t": "前置后驱柴油货车"}, {"k": "B", "t": "纯电动汽车"}, {"k": "C", "t": "普通汽油轿车"}, {"k": "D", "t": "天然气客车"}], "a": "B", "e": "【考点】纯电动车构造特征的识别判断。\n【解析】无机油滤清器、无排气消声器→无发动机;有橙色高压线束→高压电驱动;保留12V蓄电池→纯电构造。柴油车、汽油车、天然气车都有发动机和排气系统。故选B。\n【易错】“橙色高压线束+无发动机+有12V电瓶=纯电”。这是综合判断题,用结构特征倒推车型,把纯电特点串起来记。"}, {"id": 358, "oid": "A1-422", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞在下止点时，活塞顶离曲轴回转中心最近，即活塞处于气缸内的最低位置。", "opts": [], "a": "√", "e": "【考点】下止点的定义。\n【解析】下止点=活塞顶离曲轴回转中心最近(气缸最低)的位置;上止点=最远(最高)。题干说“最近、最低”,与定义一致,判断为√。\n【易错】“离中心最近=下止点”。与368题(说上止点最近,错)对比:中心距离看“最近/最远”,气缸位置看“最高/最低”,两套说法要对应正确。"}, {"id": 359, "oid": "A1-423", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞行程是指活塞从一个止点运动到另一个止点所经过的距离，其值等于曲柄半径的两倍。", "opts": [], "a": "√", "e": "【考点】活塞行程与曲柄半径。\n【解析】活塞行程S=2R(R为曲柄半径):曲轴转一周,曲柄销画一个圆,活塞上下各一次,行程=圆的直径=2R。题干正确,判断为√。\n【易错】“S=2R”是基本公式。别记成S=R(那是曲柄半径本身,384题专门考这个错误)。曲柄半径=行程的一半。"}, {"id": 360, "oid": "A1-424", "type": "judge", "module": "汽车概论与机械基础", "q": "气缸工作容积是指活塞位于上止点时活塞顶上方的空间容积。", "opts": [], "a": "×", "e": "【考点】工作容积与燃烧室容积区分。\n【解析】活塞在上止点时活塞顶上方的容积=燃烧室容积Vc;工作容积Vs是上下止点间扫过的容积。题干把两者混淆,判断为×。\n【易错】“上止点上的容积=Vc,扫过的容积=Vs”。这个区分是容积概念题的核心,配合Va=Vs+Vc记。"}, {"id": 361, "oid": "A1-425", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机排量是各气缸工作容积之和，常用单位为升（L）表示。", "opts": [], "a": "√", "e": "【考点】发动机排量的定义。\n【解析】排量Vh=单缸工作容积Vs×缸数i,即各缸工作容积之和,常用单位升(L)。题干正确,判断为√。\n【易错】“排量=Σ各缸工作容积”。单位L或mL。2.0T=2.0L涡轮增压。排量是发动机尺寸的重要参数。"}, {"id": 362, "oid": "A1-426", "type": "judge", "module": "汽车概论与机械基础", "q": "压缩比越大，说明燃烧室容积越大。", "opts": [], "a": "×", "e": "【考点】压缩比与燃烧室容积关系。\n【解析】压缩比ε=(Vs+Vc)/Vc。ε越大→Vc相对总容积越小(燃烧室越小),气体压缩越厉害。题干说“压缩比越大燃烧室容积越大”,错误,判断为×。\n【易错】“ε大=Vc小”。推导:ε=10时Vc占总容积1/10(385题)。燃烧室小→压缩比高→易爆燃。"}, {"id": 363, "oid": "A1-427", "type": "judge", "module": "汽车概论与机械基础", "q": "四缸发动机的排量等于单个气缸工作容积的四倍。", "opts": [], "a": "√", "e": "【考点】四缸排量计算。\n【解析】排量=单缸工作容积×缸数,四缸发动机排量=单缸容积×4。题干正确,判断为√。\n【易错】“四缸=Vs×4”。与404题配套:2.0L四缸→单缸0.5L。反向计算也要会。"}, {"id": 364, "oid": "A1-428", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞从上止点运动到下止点所扫过的容积称为燃烧室容积。", "opts": [], "a": "×", "e": "【考点】工作容积定义(反向)。\n【解析】上止点→下止点扫过的容积=气缸工作容积Vs;燃烧室容积是上止点时活塞顶上的最小容积。题干张冠李戴,判断为×。\n【易错】“扫过的=Vs,剩下的=Vc”。与360题完全同考点,这种易混概念考试常换着说,记住定义本身即可。"}, {"id": 365, "oid": "A1-429", "type": "judge", "module": "汽车概论与机械基础", "q": "气缸总容积等于气缸工作容积与燃烧室容积之和，即Va=Vs+Vc。", "opts": [], "a": "√", "e": "【考点】气缸总容积公式。\n【解析】总容积Va=下止点时的最大容积=工作容积Vs+燃烧室容积Vc。公式正确,判断为√。\n【易错】“Va=Vs+Vc”。三大容积关系Va最大、Vs居中、Vc最小。用“总=工+燃”记忆。"}, {"id": 366, "oid": "A1-430", "type": "judge", "module": "汽车概论与机械基础", "q": "汽油机的压缩比一般比柴油机高。", "opts": [], "a": "×", "e": "【考点】汽柴油机压缩比比较。\n【解析】柴油机压缩比约15～22,汽油机约8～11,柴油机远高于汽油机(靠压缩自燃需高终温)。题干说“汽油机比柴油机高”,错误,判断为×。\n【易错】“柴油压缩比高”。与367题互证。汽油机压缩比受爆燃限制上不去,柴油机压燃必须高。数字15-22 vs 8-11要记。"}, {"id": 367, "oid": "A1-431", "type": "judge", "module": "汽车概论与机械基础", "q": "柴油机的压缩比通常为15～22，明显高于汽油机的8～11。", "opts": [], "a": "√", "e": "【考点】柴油机压缩比数值。\n【解析】柴油机压缩比15～22,明显高于汽油机8～11:柴油靠压缩自燃,压缩终温须超柴油自燃点;汽油机受爆燃限制。题干正确,判断为√。\n【易错】“柴油15-22、汽油8-11”。数值范围是选择题和判断题常考。压缩比高→热效率高→省油,这也是柴油机热效率高的原因之一。"}, {"id": 368, "oid": "A1-432", "type": "judge", "module": "汽车概论与机械基础", "q": "上止点是活塞顶离曲轴回转中心最近的位置。", "opts": [], "a": "×", "e": "【考点】上止点定义(反向)。\n【解析】上止点=活塞顶离曲轴回转中心最远(气缸最高)位置;离中心最近的是下止点。题干说反,判断为×。\n【易错】“上止点=最远/最高,下止点=最近/最低”。与358题对比记忆:最近↔下止点,最远↔上止点。"}, {"id": 369, "oid": "A1-433", "type": "judge", "module": "汽车概论与机械基础", "q": "曲柄半径增大一倍，活塞行程也随之增大一倍。", "opts": [], "a": "√", "e": "【考点】行程与曲柄半径正比关系。\n【解析】S=2R,行程与曲柄半径成正比:R增大一倍→S也增大一倍。题干正确,判断为√。\n【易错】“正比=同倍变化”。比例关系题:S=2R,R翻倍S翻倍。别受“2倍系数”干扰,比例关系是1:1。"}, {"id": 370, "oid": "A1-434", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机排量相同的情况下，气缸数越多，单个气缸的工作容积越小。", "opts": [], "a": "√", "e": "【考点】排量与缸数关系。\n【解析】排量Vh=Vs×i:排量一定时,缸数i越多→单缸工作容积Vs越小;多缸机动力输出更平稳。题干正确,判断为√。\n【易错】“排量=单缸×缸数,此消彼长”。6缸比4缸平顺就是因为每缸小、做功间隔密。公式正反推理都要会。"}, {"id": 371, "oid": "A1-435", "type": "judge", "module": "汽车概论与机械基础", "q": "燃烧室容积是活塞位于上止点时，活塞顶与气缸盖之间的容积。", "opts": [], "a": "√", "e": "【考点】燃烧室容积的几何定义。\n【解析】活塞上止点时,活塞顶与气缸盖底面(及缸壁)围成的空间=
