":[{"k":"A","t":"油箱容积"},{"k":"B","t":"发动机排量"},{"k":"C","t":"冷却液容量"},{"k":"D","t":"机油容量"}],"a":"B","e":"尾部或铭牌的1.6L表示发动机排量（各缸工作容积之和）约1.6升。"},{"id":478,"oid":"A1-542","type":"single","module":"汽车概论与机械基础","q":"下列关于压缩比的说法，错误的是（　）。","opts":[{"k":"A","t":"压缩比是总容积与燃烧室容积之比"},{"k":"B","t":"柴油机压缩比高于汽油机"},{"k":"C","t":"汽油机压缩比越高越好，不受任何限制"},{"k":"D","t":"压缩比影响热效率"}],"a":"C","e":"汽油机压缩比过高会爆燃，并非越高越好，受爆燃限制；其余说法正确。"},{"id":479,"oid":"A1-543","type":"single","module":"汽车概论与机械基础","q":"气缸体上活塞往复运动的圆柱形空间称为（　）。","opts":[{"k":"A","t":"气缸"},{"k":"B","t":"曲轴箱"},{"k":"C","t":"油底壳"},{"k":"D","t":"进气管"}],"a":"A","e":"气缸是活塞在其中往复运动的圆柱形空腔，燃烧室在其顶部。"},{"id":480,"oid":"A1-544","type":"single","module":"汽车概论与机械基础","q":"活塞由上止点下行时，气缸内容积（　）。","opts":[{"k":"A","t":"逐渐增大"},{"k":"B","t":"逐渐减小"},{"k":"C","t":"不变"},{"k":"D","t":"变为零"}],"a":"A","e":"活塞下行离开上止点，扫过空间使缸内容积由燃烧室容积逐渐增大到总容积。"},{"id":481,"oid":"A1-545","type":"single","module":"汽车概论与机械基础","q":"活塞由下止点上行时，气缸内气体被（　）。","opts":[{"k":"A","t":"压缩"},{"k":"B","t":"膨胀"},{"k":"C","t":"排出为零"},{"k":"D","t":"冷却为液体"}],"a":"A","e":"活塞上行、容积减小，缸内气体被压缩，压力温度升高（压缩行程）。"},{"id":482,"oid":"A1-546","type":"single","module":"汽车概论与机械基础","q":"下列发动机中，靠压燃方式工作的是（　）。","opts":[{"k":"A","t":"柴油机"},{"k":"B","t":"汽油机"},{"k":"C","t":"转子点燃机"},{"k":"D","t":"煤气点燃机"}],"a":"A","e":"柴油机压燃；汽油机及转子点燃机靠火花点火。"},{"id":483,"oid":"A1-547","type":"single","module":"汽车概论与机械基础","q":"与自然吸气相比，废气涡轮增压发动机的进气特点是（　）。","opts":[{"k":"A","t":"进气更多、密度更大"},{"k":"B","t":"进气更少"},{"k":"C","t":"只进废气"},{"k":"D","t":"不需要空气"}],"a":"A","e":"增压器把空气压缩后充入气缸，进气量和密度增大，可多做功。"},{"id":484,"oid":"A1-548","type":"single","module":"汽车概论与机械基础","q":"发动机排量的大小直接影响（　）。","opts":[{"k":"A","t":"每循环做功能力和动力性"},{"k":"B","t":"轮胎花纹"},{"k":"C","t":"车身颜色"},{"k":"D","t":"座椅材质"}],"a":"A","e":"排量大则每循环进气量多、做功能力强，动力性好；与轮胎、车身、座椅无关。"},{"id":485,"oid":"A1-549","type":"single","module":"汽车概论与机械基础","q":"当其他条件相同，仅把燃烧室容积增大时，压缩比将（　）。","opts":[{"k":"A","t":"增大"},{"k":"B","t":"减小"},{"k":"C","t":"不变"},{"k":"D","t":"无法判断"}],"a":"B","e":"ε=(Vs+Vc)/Vc=1+Vs/Vc，Vc增大则分母增大，压缩比减小。"},{"id":486,"oid":"A1-550","type":"single","module":"汽车概论与机械基础","q":"下列参数中，随活塞行程增大而增大的是（　）。","opts":[{"k":"A","t":"单缸工作容积"},{"k":"B","t":"燃烧室容积"},{"k":"C","t":"蓄电池电压"},{"k":"D","t":"轮胎直径"}],"a":"A","e":"Vs=πD²S/4，行程S增大则工作容积增大；燃烧室容积由结构决定，与S无此直接关系。"},{"id":487,"oid":"A1-551","type":"single","module":"汽车概论与机械基础","q":"按冷却方式，现代汽车发动机普遍采用（　）。","opts":[{"k":"A","t":"水冷式"},{"k":"B","t":"风冷式"},{"k":"C","t":"自然冷却"},{"k":"D","t":"油冷式"}],"a":"A","e":"现代汽车发动机多为水冷式，温度均匀、噪声小；风冷多用于摩托车等。"},{"id":488,"oid":"A1-552","type":"single","module":"汽车概论与机械基础","q":"下列关于二冲程发动机的说法，正确的是（　）。","opts":[{"k":"A","t":"曲轴转一圈完成一个工作循环"},{"k":"B","t":"曲轴转两圈完成一个工作循环"},{"k":"C","t":"没有做功行程"},{"k":"D","t":"不需要换气"}],"a":"A","e":"二冲程曲轴转一圈（360°）完成进、压、功、排一个循环，但仍需换气。"},{"id":489,"oid":"A1-553","type":"single","module":"汽车概论与机械基础","q":"柴油机吸入纯空气、汽油形成混合气后才进入气缸，这是二者在（　）上的主要区别。","opts":[{"k":"A","t":"进气成分与着火方式"},{"k":"B","t":"车轮数量"},{"k":"C","t":"车身颜色"},{"k":"D","t":"轮胎规格"}],"a":"A","e":"柴油机进纯空气、缸内压燃；汽油机进可燃混合气、火花塞点燃，属进气成分与着火方式区别。"},{"id":490,"oid":"A1-554","type":"single","module":"汽车概论与机械基础","q":"下列术语中，表示“活塞上止点时活塞顶上方容积”的是（　）。","opts":[{"k":"A","t":"燃烧室容积"},{"k":"B","t":"工作容积"},{"k":"C","t":"总容积"},{"k":"D","t":"排量"}],"a":"A","e":"燃烧室容积Vc是活塞在上止点时活塞顶与缸盖间的容积；工作容积是行程扫过的容积。"},{"id":491,"oid":"A1-555","type":"single","module":"汽车概论与机械基础","q":"发动机按燃料分为汽油机和柴油机，其分类依据是（　）。","opts":[{"k":"A","t":"使用的燃料不同"},{"k":"B","t":"冷却方式不同"},{"k":"C","t":"气缸排列不同"},{"k":"D","t":"车轮数量不同"}],"a":"A","e":"按使用燃料（汽油/柴油）区分汽油机和柴油机；其余分类依据不同。"},{"id":492,"oid":"A2-011","type":"judge","module":"汽车概论与机械基础","q":"我国机械制图国家标准规定，图样上的尺寸以毫米为单位时，不必在尺寸数字后标注单位符号。","opts":[],"a":"√","e":"按GB/T 4458.4，机械图样默认以mm为单位，数字后不注单位；只有采用其他单位时才必须注明，如英寸。"},{"id":493,"oid":"A2-012","type":"judge","module":"汽车概论与机械基础","q":"绘制机械图样时，粗实线的线宽d一般取细实线线宽的2倍左右。","opts":[],"a":"√","e":"图线分粗细两种，粗线宽d在0.5～2mm间选用，细线宽约为d/2，二者成2:1关系，使图面层次分明。"},{"id":494,"oid":"A2-013","type":"judge","module":"汽车概论与机械基础","q":"机械图样中的对称中心线和轴线应采用细点画线绘制。","opts":[],"a":"√","e":"按GB/T 4457.4，轴线、对称中心线、回转体中心线及轨迹线用细点画线表示；不可见轮廓才用细虚线。"},{"id":495,"oid":"A2-014","type":"judge","module":"汽车概论与机械基础","q":"绘制断裂处的边界线时，只能用波浪线，不允许采用双折线。","opts":[],"a":"×","e":"断裂边界既可画波浪线，也可画双折线；波浪线用于较短的断裂处，双折线用于较长或简化的断裂处。"},{"id":496,"oid":"A2-015","type":"judge","module":"汽车概论与机械基础","q":"尺寸标注由尺寸界线、尺寸线和尺寸数字三个要素组成。","opts":[],"a":"√","e":"一个完整的尺寸包含尺寸界线（所量范围）、尺寸线（带箭头）和尺寸数字（数值）三要素，缺一不可。"},{"id":497,"oid":"A2-016","type":"judge","module":"汽车概论与机械基础","q":"在零件图上，水平方向的尺寸数字应字头朝上，竖直方向的尺寸数字应字头朝左书写。","opts":[],"a":"√","e":"为便于读图，水平尺寸数字注写在尺寸线上方、字头朝上；竖直尺寸注写在尺寸线左侧、字头朝左。"},{"id":498,"oid":"A2-017","type":"judge","module":"汽车概论与机械基础","q":"标注角度尺寸时，角度数字可以根据角度倾斜方向随意书写。","opts":[],"a":"×","e":"角度数字一律水平书写（字头朝上），一般注写在尺寸线中断处，不随尺寸线倾斜，以保证读数一致。"},{"id":499,"oid":"A2-018","type":"judge","module":"汽车概论与机械基础","q":"图样的比例是指图形与其实物相应要素的线性尺寸之比。","opts":[],"a":"√","e":"比例是线性尺寸之比：2:1为放大，1:1为原值，1:2为缩小；不论放大或缩小，图上标注的始终是实物真实尺寸。"},{"id":500,"oid":"A2-019","type":"judge","module":"汽车概论与机械基础","q":"不论采用放大还是缩小比例绘图，图样上标注的尺寸数字都应是机件的实际真实尺寸。","opts":[],"a":"√","e":"比例只改变图形大小，不改变标注数值；图上所注尺寸一律为机件实际尺寸，与绘图比例无关。"},{"id":501,"oid":"A2-020","type":"judge","module":"汽车概论与机械基础","q":"我国规定机械图样采用第一角画法，即“人—物—图”的投射顺序。","opts":[],"a":"√","e":"GB/T 17452规定我国采用第一角投影，投射关系为人、机件、投影面依次排列；第三角画法用于少数国家，须加识别符号。"},{"id":502,"oid":"A2-021","type":"judge","module":"汽车概论与机械基础","q":"机械制图中的汉字应写成长仿宋体，并采用国家正式公布的简化字。","opts":[],"a":"√","e":"国标规定图样汉字用长仿宋体，做到字体端正、笔画清楚；汉字必须采用正式公布的简化字。"},{"id":503,"oid":"A2-022","type":"judge","module":"汽车概论与机械基础","q":"A4图纸的幅面尺寸为297mm×210mm。","opts":[],"a":"√","e":"A系列幅面中A4为297mm×210mm；A3为420×297，A2为594×420，每加大一号面积约增大一倍。"},{"id":504,"oid":"A2-023","type":"judge","module":"汽车概论与机械基础","q":"装配图和零件图的标题栏一般应配置在图框的左下角。","opts":[],"a":"×","e":"标题栏应位于图框的右下角，其长边通常与下图框线重合，读图方向与标题栏方向一致。"},{"id":505,"oid":"A2-024","type":"judge","module":"汽车概论与机械基础","q":"金属材料的剖面符号画成与水平方向成45°、间隔均匀的细实线。","opts":[],"a":"√","e":"金属零件剖视图的剖面线为向右倾斜45°（或135°）、等距平行的细实线；同一零件在各视图中剖面线方向和间距应一致。"},{"id":506,"oid":"A2-025","type":"judge","module":"汽车概论与机械基础","q":"在同一零件的不同剖视图中，剖面线可以画成不同方向和不同间隔。","opts":[],"a":"×","e":"同一零件各剖视图的剖面线必须方向相同、间隔相等，以便与相邻零件区分；随意改变会造成识图混乱。"},{"id":507,"oid":"A2-026","type":"judge","module":"汽车概论与机械基础","q":"画尺寸线时，尺寸线可以与图样上的轮廓线重合或画在其延长线上。","opts":[],"a":"×","e":"尺寸线应单独画出，不能与轮廓线、中心线重合或画在其延长线上；尺寸界线一般从轮廓线引出并与尺寸线垂直。"},{"id":508,"oid":"A2-027","type":"judge","module":"汽车概论与机械基础","q":"标注直径尺寸时应在数字前加注符号“φ”，标注半径时加注符号“R”。","opts":[],"a":"√","e":"直径符号φ、半径符号R是国标规定：整圆或大于半圆注直径φ，半圆或小于半圆注半径R，便于读图。"},{"id":509,"oid":"A2-028","type":"judge","module":"汽车概论与机械基础","q":"零件图上标注球面直径或半径时，应在φ或R前再加写符号“S”。","opts":[],"a":"√","e":"为与一般圆柱面区别，球面尺寸须加注S，如Sφ20、SR15；否则容易误认为普通圆柱面的直径或半径。"},{"id":510,"oid":"A2-029","type":"judge","module":"汽车概论与机械基础","q":"图样中尺寸数字不允许被任何图线穿过，当不可避免时应将该图线断开。","opts":[],"a":"√","e":"为保证尺寸数字清晰可读，任何图线（含轮廓线、剖面线）都不得穿过数字；无法避开时应断开该处图线。"},{"id":511,"oid":"A2-030","type":"judge","module":"汽车概论与机械基础","q":"机件的真实大小应以图上所注尺寸数字为依据，并与图形的绘制大小和准确度有关。","opts":[],"a":"×","e":"机件真实大小以所注尺寸数字为唯一依据，与绘图比例、画图准确度无关；图形大小不影响标注数值。"},{"id":512,"oid":"A2-031","type":"judge","module":"汽车概论与机械基础","q":"绘制圆的中心线时，细点画线应超出轮廓圆外2～5mm，且圆心处应是线段相交。","opts":[],"a":"√","e":"中心线、轴线应适当超出轮廓2～5mm，交点处应为画（长线段）与画相交，不能是点相交，以明确圆心位置。"},{"id":513,"oid":"A2-032","type":"judge","module":"汽车概论与机械基础","q":"当图形不能充分表达平面时，可用平面符号（相交的两条细实线）表示该平面。","opts":[],"a":"√","e":"在不致引起误解时，可用两条相交细实线表示平面，常用于薄板、棱角处平面的简化表达。"},{"id":514,"oid":"A2-033","type":"judge","module":"汽车概论与机械基础","q":"标注45°倒角时，可用符号“C”加倒角轴向尺寸表示，如C2。","opts":[],"a":"√","e":"国标规定45°倒角可用C表示，C2即轴向倒角尺寸为2mm、角度45°；非45°倒角则需分别注出角度和尺寸。"},{"id":515,"oid":"A2-034","type":"judge","module":"汽车概论与机械基础","q":"表面粗糙度轮廓算术平均偏差Ra的数值越大，表示该表面越光滑。","opts":[],"a":"×","e":"Ra数值越小，表面轮廓起伏越小、越光滑；数值越大越粗糙。如Ra1.6比Ra6.3表面更光洁。"},{"id":516,"oid":"A2-035","type":"judge","module":"汽车概论与机械基础","q":"公差等于最大极限尺寸与最小极限尺寸之差，也就是上偏差减下偏差的绝对值。","opts":[],"a":"√","e":"允许尺寸的变动量即公差=最大极限尺寸−最小极限尺寸=上偏差−下偏差，恒为正值，反映加工难易程度。"},{"id":517,"oid":"A2-036","type":"judge","module":"汽车概论与机械基础","q":"基本偏差一般是指靠近零线的那个偏差，用以确定公差带相对于零线的位置。","opts":[],"a":"√","e":"基本偏差是公差带靠近零线的那一个偏差（上偏差或下偏差），它决定公差带位置；另一偏差由公差大小确定。"},{"id":518,"oid":"A2-037","type":"judge","module":"汽车概论与机械基础","q":"基孔制配合中，孔的基本偏差固定为H（下偏差为零），通过改变轴的公差带来得到各种配合。","opts":[],"a":"√","e":"基孔制以基准孔H为基准，其下偏差为零，靠改变轴的基本偏差获得间隙、过渡或过盈配合，应用广泛。"},{"id":519,"oid":"A2-038","type":"judge","module":"汽车概论与机械基础","q":"形状公差包括直线度、平面度、圆度和圆柱度等，它们不涉及基准。","opts":[],"a":"√","e":"形状公差是对单一要素本身形状的要求（直线度、平面度、圆度、圆柱度等），没有基准；位置公差才需要基准。"},{"id":520,"oid":"A2-039","type":"judge","module":"汽车概论与机械基础","q":"装配图中相邻两个金属零件的剖面线，应画成方向相反或方向相同而间隔不同。","opts":[],"a":"√","e":"装配图上相邻零件剖面线必须有区别：方向相反，或方向相同但间距不等；同一零件在各视图中则保持一致。"},{"id":521,"oid":"A2-040","type":"judge","module":"汽车概论与机械基础","q":"零件图一般包括一组视图、完整的尺寸、技术要求和标题栏四方面内容。","opts":[],"a":"√","e":"零件图是制造和检验零件的依据，应包含表达形状的一组视图、全部尺寸、技术要求（公差粗糙度等）和标题栏。"},{"id":522,"oid":"A2-041","type":"judge","module":"汽车概论与机械基础","q":"画外螺纹时，大径用粗实线、小径用细实线表示；在投影为圆的视图上，大径圆画粗实线整圆。","opts":[],"a":"×","e":"外螺纹规定画法：大径用粗实线、小径用细实线；在圆视图上小径圆画约3/4圈细实线，大径圆画粗实线整圆，题干把圆视图画法说反。"},{"id":523,"oid":"A2-042","type":"judge","module":"汽车概论与机械基础","q":"在剖视图中画内螺纹时，小径（牙底）用粗实线、大径（牙顶）用细实线表示。","opts":[],"a":"×","e":"内螺纹剖视规定：小径（牙底）为粗实线、大径（牙顶）为细实线，这与外螺纹正好相反，不能混淆。"},{"id":524,"oid":"A2-043","type":"judge","module":"汽车概论与机械基础","q":"用丁字尺配合图板可以方便地画出水平线，用三角板配合丁字尺可以画出竖直线和倾斜线。","opts":[],"a":"√","e":"丁字尺沿图板上下移动画水平线；三角板靠在丁字尺上左右移动可画竖直线，两块三角板配合可画常见角度斜线。"},{"id":525,"oid":"A2-044","type":"judge","module":"汽车概论与机械基础","q":"绘图加深时，应选用较硬的H类铅笔来加深粗实线，用较软的B类铅笔来写字。","opts":[],"a":"×","e":"加深粗实线应用较软的B或HB铅笔（线条浓黑），画细线、写字用较硬的H或2H铅笔（线条细淡），题干正好颠倒。"},{"id":526,"oid":"A2-045","type":"judge","module":"汽车概论与机械基础","q":"徒手画草图时必须使用比例尺和圆规，不能凭眼睛估计比例。","opts":[],"a":"×","e":"草图是不用绘图仪器、凭目测比例徒手绘制的图样，贵在迅速方便；用仪器精确绘制的不是草图。"},{"id":527,"oid":"A2-046","type":"judge","module":"汽车概论与机械基础","q":"某零件轴径标注为φ30g6，其中基本尺寸是30，g表示轴的基本偏差代号，6表示公差等级。","opts":[],"a":"√","e":"尺寸标注中φ30为基本尺寸，g为轴基本偏差代号（决定位置），6为标准公差等级（决定公差带大小），三者共同确定加工范围。"},{"id":528,"oid":"A2-047","type":"judge","module":"汽车概论与机械基础","q":"对轴与孔的配合φ30H7/g6，由于g为轴的上偏差且多为负值，因此该配合属于过盈配合。","opts":[],"a":"×","e":"H7/g6属基孔制间隙配合：H孔下偏差为零，g轴上偏差为负但仍可留有间隙；过盈配合的轴基本偏差多为p、r、s等，不是g。"},{"id":529,"oid":"A2-048","type":"judge","module":"汽车概论与机械基础","q":"在零件图上标注尺寸时，应把尺寸注成封闭的尺寸链，以便各段尺寸都有明确数值。","opts":[],"a":"×","e":"不能注成封闭尺寸链，应留一个不注尺寸的“开口环”，让误差积累在开口环上；封闭尺寸链会造成各尺寸精度互相牵制。"},{"id":530,"oid":"A2-049","type":"judge","module":"汽车概论与机械基础","q":"读装配图时，一般先从标题栏和明细栏入手了解部件名称、组成和工作原理，再分析视图。","opts":[],"a":"√","e":"读装配图的顺序通常是：看标题栏、明细栏了解概况，再对照视图分析装配关系和工作原理，最后看懂零件结构和尺寸。"},{"id":531,"oid":"A2-050","type":"single","module":"汽车概论与机械基础","q":"机械制图中，机件可见轮廓线应采用的图线是（　）。","opts":[{"k":"A","t":"粗实线"},{"k":"B","t":"细实线"},{"k":"C","t":"细虚线"},{"k":"D","t":"细点画线"}],"a":"A","e":"按GB/T 4457.4，可见轮廓线用粗实线绘制；细实线用于尺寸线、剖面线；细虚线画不可见轮廓；细点画线画轴线和中心线。"},{"id":532,"oid":"A2-051","type":"single","module":"汽车概论与机械基础","q":"下列图线中，主要用于绘制尺寸线、尺寸界线和剖面线的是（　）。","opts":[{"k":"A","t":"粗实线"},{"k":"B","t":"细实线"},{"k":"C","t":"细虚线"},{"k":"D","t":"波浪线"}],"a":"B","e":"细实线宽度约为粗线的1/2，用于尺寸线、尺寸界线、剖面线、引出线和过渡线等；粗实线专画可见轮廓。"},{"id":533,"oid":"A2-052","type":"single","module":"汽车概论与机械基础","q":"细双点画线通常用来表示（　）。","opts":[{"k":"A","t":"机件的可见轮廓"},{"k":"B","t":"假想投影轮廓和相邻辅助零件轮廓"},{"k":"C","t":"断裂边界"},{"k":"D","t":"轴线"}],"a":"B","e":"细双点画线用于假想轮廓、相邻零件、极限位置轮廓；可见轮廓用粗实线，断裂用波浪线，轴线用细点画线。"},{"id":534,"oid":"A2-053","type":"single","module":"汽车概论与机械基础","q":"我国国家标准规定，机械图样采用的投影画法是（　）。","opts":[{"k":"A","t":"第三角画法"},{"k":"B","t":"第一角画法"},{"k":"C","t":"任意角画法"},{"k":"D","t":"中心投影"}],"a":"B","e":"我国采用第一角画法（人—物—图）；第三角画法（人—图—物）主要见于美国、日本等，图样上须加识别符号。"},{"id":535,"oid":"A2-054","type":"single","module":"汽车概论与机械基础","q":"图样上标注尺寸时，尺寸线终端一般采用的形式是（　）。","opts":[{"k":"A","t":"斜线"},{"k":"B","t":"箭头"},{"k":"C","t":"圆点"},{"k":"D","t":"不画终端"}],"a":"B","e":"机械图样尺寸线终端多画实心箭头；斜线终端常用于建筑图和某些尺寸，机械图以箭头为标准形式。"},{"id":536,"oid":"A2-055","type":"single","module":"汽车概论与机械基础","q":"下列符号中，表示直径的是（　）。","opts":[{"k":"A","t":"R"},{"k":"B","t":"φ"},{"k":"C","t":"S"},{"k":"D","t":"C"}],"a":"B","e":"φ表示直径，R表示半径，S用于球面（Sφ、SR），C表示45°倒角，四者不得混用。"},{"id":537,"oid":"A2-056","type":"single","module":"汽车概论与机械基础","q":"半圆柱形或小于半圆的圆弧，标注其尺寸时应使用（　）。","opts":[{"k":"A","t":"直径φ"},{"k":"B","t":"半径R"},{"k":"C","t":"球面Sφ"},{"k":"D","t":"边长δ"}],"a":"B","e":"半圆或小于半圆的弧注半径R；整圆或大于半圆才注直径φ；球面另加S。"},{"id":538,"oid":"A2-057","type":"single","module":"汽车概论与机械基础","q":"A4图纸装订时的标准幅面（短边×长边）是（　）。","opts":[{"k":"A","t":"210mm×297mm"},{"k":"B","t":"297mm×420mm"},{"k":"C","t":"420mm×594mm"},{"k":"D","t":"594mm×841mm"}],"a":"A","e":"A4为210×297mm，A3为297×420mm，A2为420×594mm，A1为594×841mm；A0为841×1189mm。"},{"id":539,"oid":"A2-058","type":"single","module":"汽车概论与机械基础","q":"机械图样中书写的汉字字体应是（　）。","opts":[{"k":"A","t":"楷体"},{"k":"B","t":"长仿宋体"},{"k":"C","t":"黑体"},{"k":"D","t":"隶书"}],"a":"B","e":"国标规定图样汉字写成长仿宋体，要求端正清晰；数字和字母可写成斜体或直体。"},{"id":540,"oid":"A2-059","type":"single","module":"汽车概论与机械基础","q":"图样中字号（如10号字）是指字体的（　）。","opts":[{"k":"A","t":"字宽"},{"k":"B","t":"字高"},{"k":"C","t":"字间距"},{"k":"D","t":"笔画粗细"}],"a":"B","e":"字号按字高（mm）划分，10号字高为10mm，字宽约为字高的2/3；常用字号有3.5、5、7、10等。"},{"id":541,"oid":"A2-060","type":"single","module":"汽车概论与机械基础","q":"绘图比例1:2表示（　）。","opts":[{"k":"A","t":"图形比实物放大1倍"},{"k":"B","t":"图形比实物缩小一半"},{"k":"C","t":"图形与实物一样大"},{"k":"D","t":"实物是图形的1/2"}],"a":"B","e":"比例为图形:实物，1:2即图形尺寸是实物的1/2，属缩小绘图；2:1才是放大。"},{"id":542,"oid":"A2-061","type":"single","module":"汽车概论与机械基础","q":"一张零件图的标题栏一般不包含下列哪项内容（　）。","opts":[{"k":"A","t":"零件名称"},{"k":"B","t":"材料"},{"k":"C","t":"绘图比例"},{"k":"D","t":"零件的价格"}],"a":"D","e":"标题栏含零件名称、材料、比例、图号、设计审核签名等，不标注零件价格；价格属生产经营信息。"},{"id":543,"oid":"A2-062","type":"single","module":"汽车概论与机械基础","q":"在绘制金属零件剖视图时，剖面线应画成（　）。","opts":[{"k":"A","t":"与水平成45°的等距细实线"},{"k":"B","t":"与水平成45°的粗实线"},{"k":"C","t":"竖直细实线"},{"k":"D","t":"任意方向的虚线"}],"a":"A","e":"金属剖面符号为与水平成45°、间距均匀的细实线；不能用粗实线，也不能画成虚线。"},{"id":544,"oid":"A2-063","type":"single","module":"汽车概论与机械基础","q":"标注角度尺寸时，角度数字的书写方向是（　）。","opts":[{"k":"A","t":"随角度倾斜"},{"k":"B","t":"一律水平（字头朝上）"},{"k":"C","t":"字头朝左"},{"k":"D","t":"字头朝下"}],"a":"B","e":"角度数字一律水平书写、字头朝上，注在尺寸线中断处；这与线性数字随尺寸线方向书写不同。"},{"id":545,"oid":"A2-064","type":"single","module":"汽车概论与机械基础","q":"尺寸界线一般应从下列哪项引出（　）。","opts":[{"k":"A","t":"轮廓线、轴线或对称中心线"},{"k":"B","t":"尺寸线"},{"k":"C","t":"剖面线"},{"k":"D","t":"图框线"}],"a":"A","e":"尺寸界线一般由图形的轮廓线、轴线或对称中心线引出，并与尺寸线垂直；必要时也可沿轮廓线延长引出。"},{"id":546,"oid":"A2-065","type":"single","module":"汽车概论与机械基础","q":"丁字尺在绘图中的主要作用是（　）。","opts":[{"k":"A","t":"画各种圆弧"},{"k":"B","t":"画水平线"},{"k":"C","t":"量取长度"},{"k":"D","t":"画剖面线"}],"a":"B","e":"丁字尺靠图板导边上下移动，主要用来画水平方向直线；画圆用圆规，量尺寸用分规。"},{"id":547,"oid":"A2-066","type":"single","module":"汽车概论与机械基础","q":"专门用来在图上量取和等分线段的工具是（　）。","opts":[{"k":"A","t":"圆规"},{"k":"B","t":"分规"},{"k":"C","t":"三角板"},{"k":"D","t":"曲线板"}],"a":"B","e":"分规两腿均为钢针，用于量取尺寸、转移线段和等分；圆规带铅芯用于画圆。"},{"id":548,"oid":"A2-067","type":"single","module":"汽车概论与机械基础","q":"画圆或圆弧应使用的绘图工具是（　）。","opts":[{"k":"A","t":"圆规"},{"k":"B","t":"丁字尺"},{"k":"C","t":"三棱尺"},{"k":"D","t":"三角板"}],"a":"A","e":"圆规装有铅芯脚，用于画圆和圆弧；比例尺用于量取比例长度，不画圆。"},{"id":549,"oid":"A2-068","type":"single","module":"汽车概论与机械基础","q":"在零件图上，用于确定零件加工后表面光滑程度的符号是（　）。","opts":[{"k":"A","t":"表面粗糙度符号"},{"k":"B","t":"尺寸线箭头"},{"k":"C","t":"剖面线"},{"k":"D","t":"波浪线"}],"a":"A","e":"表面粗糙度符号标注在表面上，用以表示该表面加工后应达到的光滑程度（如去除材料、不去除材料等）。"},{"id":550,"oid":"A2-069","type":"single","module":"汽车概论与机械基础","q":"图样上标注的尺寸数字表示机件的（　）。","opts":[{"k":"A","t":"图上量得的长度"},{"k":"B","t":"实际尺寸"},{"k":"C","t":"放大后的尺寸"},{"k":"D","t":"缩小后的尺寸"}],"a":"B","e":"尺寸数字一律为机件实际尺寸，不随比例变化；图上量到的长度不能作为加工依据。"},{"id":551,"oid":"A2-070","type":"single","module":"汽车概论与机械基础","q":"粗点画线在机械图中主要用于（　）。","opts":[{"k":"A","t":"可见轮廓线"},{"k":"B","t":"表示有特殊要求的表面或结构的范围线"},{"k":"C","t":"尺寸线"},{"k":"D","t":"中断线"}],"a":"B","e":"粗点画线用于限定有特殊要求（如特定表面、热处理范围）的区域；可见轮廓用粗实线，尺寸线用细实线。"},{"id":552,"oid":"A2-071","type":"single","module":"汽车概论与机械基础","q":"下列关于尺寸数字书写的说法，正确的是（　）。","opts":[{"k":"A","t":"任何图线都可穿过尺寸数字"},{"k":"B","t":"图线穿过数字时不得断开"},{"k":"C","t":"图线不得穿过数字，必要时断开图线"},{"k":"D","t":"数字可写在任意位置"}],"a":"C","e":"尺寸数字必须清晰，任何图线穿过时都应断开该处图线，保证数字完整可读，不能让轮廓线或剖面线压在数字上。"},{"id":553,"oid":"A2-072","type":"single","module":"汽车概论与机械基础","q":"当零件上结构相同、且均匀分布的孔（如4个φ10圆孔），国标允许（　）。","opts":[{"k":"A","t":"全部逐个画出并标注"},{"k":"B","t":"只画一个或几个，其余用细点画线表示位置并在尺寸前注明数量"},{"k":"C","t":"不画这些孔"},{"k":"D","t":"用虚线代替"}],"a":"B","e":"相同结构均匀分布时可简化：详细画出一个（或几个），其余以中心线定位，并在尺寸前注明个数，如4×φ10。"},{"id":554,"oid":"A2-073","type":"single","module":"汽车概论与机械基础","q":"表面粗糙度符号上加注Ra3.2，表示该表面（　）。","opts":[{"k":"A","t":"必须用去除材料的方法获得"},{"k":"B","t":"是最光滑的表面"},{"k":"C","t":"不需要任何加工"},{"k":"D","t":"公差为3.2mm"}],"a":"A","e":"基本符号加一小横表示用去除材料（车、铣、磨等）获得；Ra3.2是轮廓算术平均偏差值，不是最光滑也不是毛坯面。"},{"id":555,"oid":"A2-074","type":"single","module":"汽车概论与机械基础","q":"配合种类中，孔的尺寸大于轴的尺寸、装配后能产生相对运动的是（　）。","opts":[{"k":"A","t":"间隙配合"},{"k":"B","t":"过盈配合"},{"k":"C","t":"过渡配合"},{"k":"D","t":"过渡或过盈"}],"a":"A","e":"间隙配合孔大于轴，存在间隙，可相对运动（如滑动轴承与轴）；过盈配合轴大于孔，过渡配合介于两者之间。"},{"id":556,"oid":"A2-075","type":"single","module":"汽车概论与机械基础","q":"公称尺寸相同的孔与轴装配后，可能得到间隙也可能得到过盈的配合是（　）。","opts":[{"k":"A","t":"间隙配合"},{"k":"B","t":"过盈配合"},{"k":"C","t":"过渡配合"},{"k":"D","t":"任何配合"}],"a":"C","e":"过渡配合的公差带相互交叠，装配后可能有小间隙也可能有小过盈，用于要求对中性好又需拆卸的场合。"},{"id":557,"oid":"A2-076","type":"single","module":"汽车概论与机械基础","q":"基孔制配合中，作为基准的孔，其基本偏差代号是（　）。","opts":[{"k":"A","t":"h"},{"k":"B","t":"H"},{"k":"C","t":"g"},{"k":"D","t":"m"}],"a":"B","e":"基孔制基准孔用代号H，下偏差为零；基轴制基准轴用h，上偏差为零。孔用大写字母、轴用小写字母。"},{"id":558,"oid":"A2-077","type":"single","module":"汽车概论与机械基础","q":"下列公差中，属于位置公差的是（　）。","opts":[{"k":"A","t":"平面度"},{"k":"B","t":"圆度"},{"k":"C","t":"同轴度"},{"k":"D","t":"直线度"}],"a":"C","e":"同轴度需要以基准轴线为参照，属位置公差；平面度、圆度、直线度都是形状公差，不涉及基准。"},{"id":559,"oid":"A2-078","type":"single","module":"汽车概论与机械基础","q":"下列公差中，属于形状公差的是（　）。","opts":[{"k":"A","t":"平行度"},{"k":"B","t":"垂直度"},{"k":"C","t":"圆跳动"},{"k":"D","t":"圆柱度"}],"a":"D","e":"圆柱度是对圆柱面自身形状的要求，属形状公差；平行度、垂直度、圆跳动均需基准，属位置公差。"},{"id":560,"oid":"A2-079","type":"single","module":"汽车概论与机械基础","q":"零件外螺纹的规定画法是（　）。","opts":[{"k":"A","t":"大径粗实线、小径细实线"},{"k":"B","t":"大径细实线、小径粗实线"},{"k":"C","t":"大小径都用粗实线"},{"k":"D","t":"大小径都用虚线"}],"a":"A","e":"外螺纹：大径（牙顶）粗实线、小径（牙底）细实线；内螺纹剖视时相反。圆视图上小径画3/4圈细实线。"},{"id":561,"oid":"A2-080","type":"single","module":"汽车概论与机械基础","q":"剖视图中内螺纹的规定画法是（　）。","opts":[{"k":"A","t":"小径粗实线、大径细实线"},{"k":"B","t":"小径细实线、大径粗实线"},{"k":"C","t":"都画虚线"},{"k":"D","t":"都画点画线"}],"a":"A","e":"剖视内螺纹：小径（牙底）粗实线、大径（牙顶）细实线；剖面线要画到粗实线（小径）处为止。"},{"id":562,"oid":"A2-081","type":"single","module":"汽车概论与机械基础","q":"装配图是表达部件或机器（　）的技术文件。","opts":[{"k":"A","t":"单个零件形状"},{"k":"B","t":"工作原理、装配关系和主要结构"},{"k":"C","t":"零件的全部尺寸"},{"k":"D","t":"零件材料"}],"a":"B","e":"装配图表达机器或部件的工作原理、零件间装配连接关系和主要结构，并附明细栏；零件图才表达单个零件全部细节。"},{"id":563,"oid":"A2-082","type":"single","module":"汽车概论与机械基础","q":"读零件图时，首先应看（　）。","opts":[{"k":"A","t":"技术要求"},{"k":"B","t":"标题栏"},{"k":"C","t":"尺寸公差"},{"k":"D","t":"表面粗糙度"}],"a":"B","e":"读零件图先看标题栏，了解零件名称、材料、比例和用途，再分析视图想象形状，然后看尺寸和技术要求。"},{"id":564,"oid":"A2-083","type":"single","module":"汽车概论与机械基础","q":"国标规定的基本视图共有几个（　）。","opts":[{"k":"A","t":"3个"},{"k":"B","t":"4个"},{"k":"C","t":"6个"},{"k":"D","t":"8个"}],"a":"C","e":"基本视图共6个：主、俯、左、右、仰、后视图，分别由六个方向投射得到，用于完整表达零件外形。"},{"id":565,"oid":"A2-084","type":"single","module":"汽车概论与机械基础","q":"对机件上倾斜于基本投影面的结构，为表达其真实形状，可采用（　）。","opts":[{"k":"A","t":"局部视图"},{"k":"B","t":"斜视图"},{"k":"C","t":"旋转视图"},{"k":"D","t":"向视图"}],"a":"B","e":"斜视图是将倾斜部分向与之平行的辅助投影面投射得到的视图，反映倾斜面实形；局部视图表达局部外形。"},{"id":566,"oid":"A2-085","type":"single","module":"汽车概论与机械基础","q":"在不影响读图的前提下，零件上均匀分布的肋、轮辐等结构，当纵向剖切时（　）。","opts":[{"k":"A","t":"一律画剖面线"},{"k":"B","t":"按不剖处理（不画剖面线），并用粗实线与相邻部分分开"},{"k":"C","t":"用虚线表示"},{"k":"D","t":"必须移出"}],"a":"B","e":"国标简化画法规定：肋、轮辐、薄壁等沿纵向剖切时按不剖处理，不画剖面线，用粗实线把它与相邻结构分开。"},{"id":567,"oid":"A2-086","type":"single","module":"汽车概论与机械基础","q":"绘制机械图样时，对对称机件的视图，允许只画一半或四分之一，并在对称中心线两端画出（　）。","opts":[{"k":"A","t":"两条与之垂直的平行细实线（对称符号）"},{"k":"B","t":"箭头"},{"k":"C","t":"剖面线"},{"k":"D","t":"波浪线"}],"a":"A","e":"对称机件可简化为半幅或1/4幅，在对称中心线两端画两条垂直平行细实线作为对称符号，表示图形左右（或上下）对称。"},{"id":568,"oid":"A2-087","type":"single","module":"汽车概论与机械基础","q":"图样中用于表示零件上正方形截面边长的符号是（　）。","opts":[{"k":"A","t":"δ"},{"k":"B","t":"□"},{"k":"C","t":"R"},{"k":"D","t":"C"}],"a":"B","e":"正方形截面边长前加注符号□，如□20；δ或t常表示板厚，R为半径，C为45°倒角。"},{"id":569,"oid":"A2-088","type":"single","module":"汽车概论与机械基础","q":"对零件上的退刀槽，通常标注形式为（　）。","opts":[{"k":"A","t":"槽宽×槽深（或槽宽×直径）"},{"k":"B","t":"只注长度"},{"k":"C","t":"只注角度"},{"k":"D","t":"用R即可"}],"a":"A","e":"退刀槽一般标注槽宽×槽深或槽宽×槽底直径（如2×φ20），以便车刀退刀和磨削时留出空隙。"},{"id":570,"oid":"A2-089","type":"single","module":"汽车概论与机械基础","q":"将机件向不平行于任何基本投影面的平面投射所得的视图，称为（　）。","opts":[{"k":"A","t":"斜视图"},{"k":"B","t":"基本视图"},{"k":"C","t":"局部视图"},{"k":"D","t":"右视图"}],"a":"A","e":"斜视图投射到非基本投影面，用于表达倾斜结构实形；基本视图是六个正方向视图，局部视图只表达局部。"},{"id":571,"oid":"A2-090","type":"single","module":"汽车概论与机械基础","q":"国标规定粗实线宽度d的可选范围一般为（　）。","opts":[{"k":"A","t":"0.15～2mm"},{"k":"B","t":"0.5～2mm"},{"k":"C","t":"5～10mm"},{"k":"D","t":"与字高无关任意选"}],"a":"B","e":"粗线宽d优先在0.5～2mm间选取，细线宽为d/2；按图样大小和复杂程度选定，同一图样线宽应一致。"},{"id":572,"oid":"A2-091","type":"single","module":"汽车概论与机械基础","q":"下列哪种图线可用于表示运动零件的极限位置和中间位置（　）。","opts":[{"k":"A","t":"粗实线"},{"k":"B","t":"细双点画线"},{"k":"C","t":"细虚线"},{"k":"D","t":"波浪线"}],"a":"B","e":"运动零件的极限位置、初始位置和相邻辅助零件轮廓用细双点画线表示；不可见轮廓用细虚线。"},{"id":573,"oid":"A2-092","type":"single","module":"汽车概论与机械基础","q":"画在视图外、用于表达机件某局部结构并用波浪线（或双折线）断开的视图是（　）。","opts":[{"k":"A","t":"局部视图"},{"k":"B","t":"斜视图"},{"k":"C","t":"全剖视图"},{"k":"D","t":"断面图"}],"a":"A","e":"局部视图只表达机件局部外形，断裂处用波浪线或双折线，按投影关系或箭头标注配置；它表达的是外形而非断面。"},{"id":574,"oid":"A2-093","type":"single","module":"汽车概论与机械基础","q":"中心孔在零件图上的标注，下列说法正确的是（　）。","opts":[{"k":"A","t":"中心孔不必在图上标注"},{"k":"B","t":"中心孔可用规定符号标注其类型和尺寸"},{"k":"C","t":"中心孔只能用剖视表达"},{"k":"D","t":"中心孔按螺纹标注"}],"a":"B","e":"中心孔（如A型、B型）可用规定符号在轴端标注其标记和尺寸，不必画出详细结构，属简化标注。"},{"id":575,"oid":"A2-094","type":"single","module":"汽车概论与机械基础","q":"读装配图时，明细栏的作用是（　）。","opts":[{"k":"A","t":"列出零件序号、名称、数量和材料等"},{"k":"B","t":"表示尺寸公差"},{"k":"C","t":"表示表面粗糙度"},{"k":"D","t":"表示投影方向"}],"a":"A","e":"明细栏按序号列出各零件的名称、数量、材料、备注等，与视图上零件序号对应，便于了解组成和配合。"},{"id":576,"oid":"A2-095","type":"single","module":"汽车概论与机械基础","q":"零件图上标注φ50H7，其中数字“7”表示（　）。","opts":[{"k":"A","t":"基本尺寸"},{"k":"B","t":"孔的公差等级"},{"k":"C","t":"孔的基本偏差"},{"k":"D","t":"实际尺寸"}],"a":"B","e":"φ50为基本尺寸，H为孔基本偏差，7为标准公差等级（IT7）；公差等级数字越大公差带越宽、精度越低。"},{"id":577,"oid":"A2-096","type":"single","module":"汽车概论与机械基础","q":"已知某轴尺寸标注为φ30±0.02，则该轴的公差为（　）。","opts":[{"k":"A","t":"0.02mm"},{"k":"B","t":"0.04mm"},{"k":"C","t":"30mm"},{"k":"D","t":"0mm"}],"a":"B","e":"上偏差+0.02、下偏差−0.02，公差=上偏差−下偏差=0.02−(−0.02)=0.04mm，恒为正值。"},{"id":578,"oid":"A2-097","type":"single","module":"汽车概论与机械基础","q":"配合φ20H7/h6属于（　）。","opts":[{"k":"A","t":"基孔制间隙配合"},{"k":"B","t":"基轴制过盈配合"},{"k":"C","t":"基孔制过盈配合"},{"k":"D","t":"过渡配合"}],"a":"A","e":"H7是基准孔（基孔制），h6是上偏差为零的轴，配合后存在间隙，属基孔制间隙配合，常用于可滑动的定心部位。"},{"id":579,"oid":"A2-098","type":"single","module":"汽车概论与机械基础","q":"某滚动轴承内孔与轴配合选用φ20H7/k6，该配合最可能属于（　）。","opts":[{"k":"A","t":"间隙配合"},{"k":"B","t":"过盈配合"},{"k":"C","t":"过渡配合"},{"k":"D","t":"无配合"}],"a":"C","e":"k轴基本偏差位于过渡区，H7/k6装配后可能有小过盈或小间隙，属过渡配合，常用于定心要求高、需拆卸的轴。"},{"id":580,"oid":"A2-099","type":"single","module":"汽车概论与机械基础","q":"在零件图上，既要标注尺寸又要标注公差和表面粗糙度，其主要目的是（　）。","opts":[{"k":"A","t":"便于美观"},{"k":"B","t":"保证零件加工精度和互换性"},{"k":"C","t":"增加题量"},{"k":"D","t":"满足绘图习惯"}],"a":"B","e":"公差、配合和表面粗糙度规定了加工精度和表面质量，是保证零件达到设计要求并实现互换装配的技术依据。"},{"id":581,"oid":"A2-100","type":"single","module":"汽车概论与机械基础","q":"看零件图时，根据视图想象出零件形状，并搞清尺寸和技术要求，这种过程称为（　）。","opts":[{"k":"A","t":"测绘"},{"k":"B","t":"读图（识图）"},{"k":"C","t":"抄图"},{"k":"D","t":"描图"}],"a":"B","e":"读图是依据视图投影关系想象立体形状、理解尺寸和技术要求的过程；测绘是凭实物测量画草图，性质不同。"},{"id":582,"oid":"A2-101","type":"single","module":"汽车概论与机械基础","q":"对形状复杂、内部结构较多的零件，仅用外形视图不能表达清楚时，最有效的表达方法是（　）。","opts":[{"k":"A","t":"放大比例"},{"k":"B","t":"采用剖视图"},{"k":"C","t":"增加虚线"},{"k":"D","t":"改用网格纸"}],"a":"B","e":"剖视图假想用剖切面剖开零件，移去前部、将剩余部分向投影面投射，可清楚表达内部孔、腔结构，比画虚线更清晰。"},{"id":583,"oid":"A2-102","type":"single","module":"汽车概论与机械基础","q":"当只需要表达机件上某一局部断面形状（如键槽深度）时，应采用（　）。","opts":[{"k":"A","t":"断面图"},{"k":"B","t":"全剖视图"},{"k":"C","t":"局部放大图"},{"k":"D","t":"向视图"}],"a":"A","e":"断面图只画出被剖切处断面的形状，用于表达键槽、肋、型材断面等；剖视图除断面外还要画出剖切后的剩余可见部分。"},{"id":584,"oid":"A2-103","type":"single","module":"汽车概论与机械基础","q":"移出断面图的轮廓线用（　）绘制。","opts":[{"k":"A","t":"粗实线"},{"k":"B","t":"细实线"},{"k":"C","t":"细虚线"},{"k":"D","t":"点画线"}],"a":"A","e":"移出断面图画在视图外，其轮廓用粗实线；重合断面图的轮廓则用细实线，并应在其上画剖面线。"},{"id":585,"oid":"A2-104","type":"single","module":"汽车概论与机械基础","q":"同一装配图中，画相邻两个零件的剖面线时，正确做法是（　）。","opts":[{"k":"A","t":"两零件剖面线完全相同"},{"k":"B","t":"方向相反或同方向但间距不同"},{"k":"C","t":"都不画剖面线"},{"k":"D","t":"用粗实线代替"}],"a":"B","e":"相邻零件用相反方向或同方向不同间距的剖面线加以区分；同一零件在各视图中剖面线必须一致。"},{"id":586,"oid":"A2-105","type":"single","module":"汽车概论与机械基础","q":"画半剖视图时，以对称中心线为界，一半画成视图、一半画成剖视图，其适用条件是（　）。","opts":[{"k":"A","t":"内外形状都需要表达且机件左右（或上下）对称"},{"k":"B","t":"只有外形"},{"k":"C","t":"只有内部且不对称"},{"k":"D","t":"任意零件"}],"a":"A","e":"半剖视图适用于内外形状都需表达且机件对称的零件，一半表达外形、一半表达内部，对称处用点画线分界，不画轮廓线。"},{"id":587,"oid":"A2-106","type":"single","module":"汽车概论与机械基础","q":"当机件只有局部内部结构需要表达，又没有必要全剖时，应采用（　）。","opts":[{"k":"A","t":"局部剖视图"},{"k":"B","t":"全剖视图"},{"k":"C","t":"半剖视图"},{"k":"D","t":"旋转剖视图"}],"a":"A","e":"局部剖视用剖切面局部剖开，以波浪线分界，用于只需表达个别孔、槽而不宜全剖或半剖的场合，灵活且保留大部分外形。"},{"id":588,"oid":"A2-107","type":"single","module":"汽车概论与机械基础","q":"国标规定的第一角画法识别符号，其图形是（　）。","opts":[{"k":"A","t":"圆锥台在左侧、圆柱在右侧的投影示意"},{"k":"B","t":"两个圆"},{"k":"C","t":"三角形"},{"k":"D","t":"正方形"}],"a":"A","e":"第一角识别符号为截头圆锥（台）与圆柱的两组投影，圆锥台在左、圆柱在右；第三角符号则相反，用于图样上标明画法。"},{"id":589,"oid":"A2-108","type":"single","module":"汽车概论与机械基础","q":"将机件的部分结构用大于原图的比例画出的图形，称为（　）。","opts":[{"k":"A","t":"局部放大图"},{"k":"B","t":"斜视图"},{"k":"C","t":"向视图"},{"k":"D","t":"剖视图"}],"a":"A","e":"局部放大图把细小结构（如退刀槽、螺纹牙型）用较大比例单独画出，并用细实线圈出部位、标注罗马数字和比例。"},{"id":590,"oid":"A2-109","type":"single","module":"汽车概论与机械基础","q":"在零件图上，下列尺寸标注组合最合理的是（　）。","opts":[{"k":"A","t":"注成封闭尺寸链"},{"k":"B","t":"重要尺寸直接标注，其余按加工顺序标注并留开口环"},{"k":"C","t":"所有尺寸都从同一基准引出"},{"k":"D","t":"重复标注同一尺寸"}],"a":"B","e":"尺寸标注应重要尺寸直接注出，按设计和工艺要求选择基准，避免封闭尺寸链和重复标注，保证加工与测量方便。"},{"id":591,"oid":"A2-110","type":"single","module":"汽车概论与机械基础","q":"一张完整的零件图中，用于说明零件热处理、表面处理等要求的是（　）。","opts":[{"k":"A","t":"标题栏"},{"k":"B","t":"技术要求（文字说明）"},{"k":"C","t":"明细栏"},{"k":"D","t":"视图名称"}],"a":"B","e":"热处理、表面处理、未注圆角、倒角等不便用符号标注的要求，以“技术要求”文字形式写在图纸空白处。"},{"id":592,"oid":"A2-111","type":"single","module":"汽车概论与机械基础","q":"绘制机械图样时，确定主视图的选择原则是（　）。","opts":[{"k":"A","t":"任意选一个方向"},{"k":"B","t":"最能反映零件形状结构特征和加工（或工作）位置的方向"},{"k":"C","t":"图纸最大的方向"},{"k":"D","t":"线条最少的方向"}],"a":"B","e":"主视图是表达核心，应选最能反映零件各组成部分形状和相对位置（形状特征），并兼顾加工或工作位置的投射方向。"},{"id":593,"oid":"A2-112","type":"single","module":"汽车概论与机械基础","q":"对长杆件（如轴、连杆）上相同结构（如多个键槽）均匀分布时，国标允许（　）。","opts":[{"k":"A","t":"详细画出全部"},{"k":"B","t":"只画一处，其余用点画线标明位置"},{"k":"C","t":"完全省略"},{"k":"D","t":"用虚线全部画出"}],"a":"B","e":"相同结构均匀分布时可只详细画一处，其余以中心线（点画线）表示位置，并注明数量和尺寸，简化作图。"},{"id":594,"oid":"A2-113","type":"single","module":"汽车概论与机械基础","q":"下列关于图纸幅面与图框的说法，正确的是（　）。","opts":[{"k":"A","t":"需要装订的图框四边留边相等"},{"k":"B","t":"需要装订时一侧留装订边a，其余留c边"},{"k":"C","t":"图框可画在图纸中央任意位置"},{"k":"D","t":"不留装订边时不画图框"}],"a":"B","e":"需装订的图样装订边留a（较宽），其余各边留c；不留装订边时四边留e。图框用粗实线画出，边界明确。"},{"id":595,"oid":"A2-114","type":"single","module":"汽车概论与机械基础","q":"读零件图分析尺寸时，首先要找出（　）。","opts":[{"k":"A","t":"最大的尺寸"},{"k":"B","t":"尺寸基准（设计基准）"},{"k":"C","t":"最长的尺寸线"},{"k":"D","t":"最多的数字"}],"a":"B","e":"尺寸基准是标注和测量尺寸的起点，分析尺寸先找设计基准和工艺基准，再看各形体的定形、定位尺寸，理清尺寸关系。"},{"id":596,"oid":"A2-115","type":"single","module":"汽车概论与机械基础","q":"当零件上有若干不同直径的同轴圆柱面时，读图时判断其轴向位置关系主要依据（　）。","opts":[{"k":"A","t":"尺寸数字大小"},{"k":"B","t":"视图上各端面的投影对应及轴向定位尺寸"},{"k":"C","t":"线条颜色"},{"k":"D","t":"剖面线方向"}],"a":"B","e":"同轴圆柱的轴向位置要靠主、左（或俯）视图的投影对应，并结合轴向定位尺寸判断，不能只看直径数字大小。"},{"id":597,"oid":"A2-116","type":"single","module":"汽车概论与机械基础","q":"在装配图中，若两个零件配合表面间隙很小，按国标规定（　）。","opts":[{"k":"A","t":"必须画成两条粗实线"},{"k":"B","t":"配合表面只画一条轮廓线"},{"k":"C","t":"用虚线表示"},{"k":"D","t":"用波浪线分开"}],"a":"B","e":"两零件的配合（接触）表面只画一条轮廓线；非配合、有间隙的表面才画两条线，这是装配图的基本规定。"},{"id":598,"oid":"A2-117","type":"single","module":"汽车概论与机械基础","q":"机械图样上不可见轮廓原来用虚线，改用剖视表达后（　）。","opts":[{"k":"A","t":"虚线仍要保留"},{"k":"B","t":"剖到的内部轮廓变为粗实线，一般不再画虚线"},{"k":"C","t":"全部用点画线"},{"k":"D","t":"用细实线"}],"a":"B","e":"剖视图中已表达清楚的内部结构用粗实线画出，通常省略不必要的虚线；只有尚未表达清的结构才补充虚线。"},{"id":599,"oid":"A2-118","type":"single","module":"汽车概论与机械基础","q":"关于比例的选用，下列做法正确的是（　）。","opts":[{"k":"A","t":"不论零件大小都用1:1"},{"k":"B","t":"尽量按实物大小画图，过小或过大时才用放大或缩小比例"},{"k":"C","t":"复杂零件一律放大10倍"},{"k":"D","t":"比例可随意，与标注无关"}],"a":"B","e":"优先选用1:1，便于直观感觉实物大小；过小零件放大、过大零件缩小，选用国标规定比例，所注尺寸仍为实物尺寸。"},{"id":600,"oid":"A2-119","type":"single","module":"汽车概论与机械基础","q":"图样中画出的局部放大图上方标注“I 2:1”，其含义是（　）。","opts":[{"k":"A","t":"第I处放大图，放大比例为2:1"},{"k":"B","t":"零件总长2:1"},{"k":"C","t":"缩小一半"},{"k":"D","t":"粗糙度等级"}],"a":"A","e":"罗马数字I表示被放大部位编号，2:1表示该局部放大图采用的比例；须与视图上圈出部位的编号一一对应。"},{"id":601,"oid":"A2-120","type":"single","module":"汽车概论与机械基础","q":"下列做法中，不符合机械制图国家标准的是（　）。","opts":[{"k":"A","t":"尺寸数字不被图线穿过"},{"k":"B","t":"同一零件各视图剖面线方向间隔一致"},{"k":"C","t":"把尺寸链注成封闭形式"},{"k":"D","t":"标题栏位于右下角"}],"a":"C","e":"封闭尺寸链会使各段尺寸精度互相牵制，是不允许的；其余三项都是国标正确规定，必须遵守。"},{"id":602,"oid":"A2-121","type":"judge","module":"汽车概论与机械基础","q":"制图时画圆应使用圆规，而量取和等分线段应使用分规。","opts":[],"a":"√","e":"圆规带铅芯用于画圆和圆弧；分规两腿为钢针，用于量取尺寸、转移线段和等分线段，两者用途不同不能互换。"},{"id":603,"oid":"A2-122","type":"single","module":"汽车概论与机械基础","q":"下列图纸幅面代号中，幅面面积最大的是（　）。","opts":[{"k":"A","t":"A4"},{"k":"B","t":"A3"},{"k":"C","t":"A2"},{"k":"D","t":"A1"}],"a":"D","e":"A1为594×841mm，A2为420×594，A3为297×420，A4为210×297；幅面代号越小（如A0）面积越大。"},{"id":604,"oid":"A2-123","type":"single","module":"汽车概论与机械基础","q":"机械图样中采用2:1的比例，属于（　）。","opts":[{"k":"A","t":"放大比例"},{"k":"B","t":"缩小比例"},{"k":"C","t":"原值比例"},{"k":"D","t":"等比比例"}],"a":"A","e":"比例为图形:实物，2:1表示图形比实物放大一倍，属放大比例；1:2才是缩小，1:1为原值。"},{"id":605,"oid":"A2-124","type":"single","module":"汽车概论与机械基础","q":"金属零件剖视图中，剖面线一般与水平方向成（　）。","opts":[{"k":"A","t":"30°"},{"k":"B","t":"45°"},{"k":"C","t":"60°"},{"k":"D","t":"90°"}],"a":"B","e":"金属剖面符号为与水平方向成45°（或135°）、间隔均匀的细实线；同一零件各视图方向和间距保持一致。"},{"id":606,"oid":"A2-125","type":"single","module":"汽车概论与机械基础","q":"零件图标题栏在图框中的位置一般是（　）。","opts":[{"k":"A","t":"左上角"},{"k":"B","t":"右下角"},{"k":"C","t":"正中央"},{"k":"D","t":"右上角"}],"a":"B","e":"国标规定标题栏位于图框右下角，其方向与读图方向一致，便于了解零件名称、材料、比例等信息。"},{"id":607,"oid":"B1-004","type":"judge","module":"汽车发动机维修","q":"使用举升机举升车辆进行发动机底盘作业时，车辆升至工作高度后不必落下安全锁止臂，因为液压系统能自动保压。","opts":[],"a":"×","e":"该说法错误。举升机升到工作高度后必须确认机械安全锁止可靠啮合后方可进入车下作业，液压系统可能泄漏泄压，只靠液压保压不安全。"},{"id":608,"oid":"B1-005","type":"judge","module":"汽车发动机维修","q":"在车间地面直接用千斤顶顶起车辆后，人即可钻到车下进行发动机维修，无需再用安全支座支撑。","opts":[],"a":"×","e":"该说法错误。千斤顶仅用于举升车辆，不能长期承重；车下作业前必须换用安全支座垫实，防止千斤顶泄压、滑卸造成压伤。"},{"id":609,"oid":"B1-006","type":"judge","module":"汽车发动机维修","q":"发动机运转时，为检查皮带或风扇状况，可以用手直接靠近或接触旋转的风扇和皮带轮。","opts":[],"a":"×","e":"该说法错误。风扇、皮带轮等旋转部件在发动机运转时严禁用手触摸，以防衣物、手指被卷入造成绞伤，应在停机后检查。"},{"id":610,"oid":"B1-007","type":"judge","module":"汽车发动机维修","q":"拆卸燃油管接头前，应对燃油系统进行泄压，防止带压燃油喷出遇火源引发火灾或喷溅伤人。","opts":[],"a":"√","e":"该说法正确。电动燃油泵在油管内保持约300kPa压力，直接拔管会喷出高压燃油，应先泄压再作业，并备好接油盘和灭火器。"},{"id":611,"oid":"B1-008","type":"judge","module":"汽车发动机维修","q":"车间内进行发动机大修时，可以用汽油清洗手上油污和零件，因为汽油去污效果好。","opts":[],"a":"×","e":"该说法错误。汽油闪点低、易挥发，与空气形成爆炸性混合气，严禁用汽油洗手和大量清洗零件；应使用专用金属清洗剂并保持通风。"},{"id":612,"oid":"B1-009","type":"judge","module":"汽车发动机维修","q":"蓄电池电解液溅到皮肤上时，应立即用大量清水冲洗，再就医处理。","opts":[],"a":"√","e":"该说法正确。电解液为稀硫酸，具有强腐蚀性，溅到皮肤或眼睛应立即用大量清水冲洗15分钟以上并就医，不能只用干布擦拭。"},{"id":613,"oid":"B1-010","type":"judge","module":"汽车发动机维修","q":"发动机排气中的一氧化碳无色无味，在密闭车间怠速运转发动机会造成人员中毒。","opts":[],"a":"√","e":"该说法正确。CO无色无味，被吸入后与血红蛋白结合使人缺氧中毒甚至死亡，车间运转发动机必须开启排风或把排气管引出室外。"},{"id":614,"oid":"B1-011","type":"judge","module":"汽车发动机维修","q":"在运转的发动机旁作业时，可以穿宽松飘逸的长袖工作服、戴手表和手链，不会有安全问题。","opts":[],"a":"×","e":"该说法错误。运转发动机旁禁止穿宽松衣物、佩戴首饰、留长发不束起，防止被旋转部件卷入，应穿合体工作服并束紧袖口、束发。"},{"id":615,"oid":"B1-012","type":"judge","module":"汽车发动机维修","q":"发现地面有机油、冷却液滴落时，应及时清理并铺设吸油垫，防止人员滑倒。","opts":[],"a":"√","e":"该说法正确。机油、防冻液地面湿滑易使人摔倒受伤，还可能污染环境，应立即用吸油棉、沙土覆盖清理，保持工位整洁。"},{"id":616,"oid":"B1-013","type":"judge","module":"汽车发动机维修","q":"发动机温度过高“开锅”时，应立即打开散热器盖加水降温。","opts":[],"a":"×","e":"该说法错误。“开锅”时系统内高压高温，立即开盖会喷出滚烫蒸汽和沸水造成严重烫伤，应让发动机自然降温泄压后再缓慢开盖。"},{"id":617,"oid":"B1-014","type":"judge","module":"汽车发动机维修","q":"车间配置的干粉灭火器适用于扑救燃油、电器和一般固体火灾，应放置在明显易取处并定期检查压力。","opts":[],"a":"√","e":"该说法正确。干粉灭火器可扑救可燃液体、带电设备和一般固体初起火灾，是维修车间常备器材；压力表指针应在绿区并定期检查。"},{"id":618,"oid":"B1-015","type":"judge","module":"汽车发动机维修","q":"举升车辆时，应将举升臂支撑在制造厂指定的举升点，不能顶在油底壳、下护板等薄弱部位。","opts":[],"a":"√","e":"该说法正确。油底壳、下护板承力弱，举升会压裂变形；必须顶在门槛加强筋、车架纵梁等设计指定的举升点上。"},{"id":619,"oid":"B1-016","type":"judge","module":"汽车发动机维修","q":"拆卸沉重的发动机总成时，必须使用起重设备并挂好吊点，禁止多人徒手抬运。","opts":[],"a":"√","e":"该说法正确。发动机总成质量达一二百千克，徒手抬运易扭伤腰、砸伤脚；应用行车或葫芦，吊索挂在专用吊装吊耳上，下方严禁站人。"},{"id":620,"oid":"B1-017","type":"judge","module":"汽车发动机维修","q":"维修发动机电气线路时，可以不断开蓄电池电源，带电插拔ECU插头不会损坏电子元件。","opts":[],"a":"×","e":"该说法错误。带电插拔ECU、传感器插头会产生瞬时过电压，容易击穿ECU内部微电子元件；拆装电气插头前应先断开蓄电池负极。"},{"id":621,"oid":"B1-018","type":"judge","module":"汽车发动机维修","q":"作业中受伤出血应先止血并及时报告、就医，不得隐瞒伤情继续作业。","opts":[],"a":"√","e":"该说法正确。发生割伤、砸伤等应立即停止作业、按压止血并报告班组长，必要时就医；隐瞒伤情可能导致伤口感染或延误重伤救治。"},{"id":622,"oid":"B1-019","type":"judge","module":"汽车发动机维修","q":"废旧蓄电池应直立存放、不得倒置和短路，按危险废物收集处理。","opts":[],"a":"√","e":"该说法正确。倒置会流出腐蚀电解液，正负极短接会大电流发热引燃；废电池属危险废物，应放在专用托盘直立存放，交有资质单位回收。"},{"id":623,"oid":"B1-020","type":"judge","module":"汽车发动机维修","q":"在发动机舱内使用照明灯时，应使用安全电压防爆行灯，禁止使用220V普通白炽灯。","opts":[],"a":"√","e":"该说法正确。油底壳、缸体内潮湿且可能有燃油蒸气，使用220V灯具一旦灯泡破碎或漏电极易触电、引燃混合气，应使用低压防爆工作灯。"},{"id":624,"oid":"B1-021","type":"judge","module":"汽车发动机维修","q":"维修现场可以一边作业一边吸烟休息，只要不把烟头扔在油棉纱上即可。","opts":[],"a":"×","e":"该说法错误。维修车间属易燃易爆场所，严禁烟火；烟头温度高，足以引燃燃油蒸气和油污棉纱，必须在指定吸烟区吸烟。"},{"id":625,"oid":"B1-022","type":"judge","module":"汽车发动机维修","q":"发动机维修后竣工交车前，应清点工具、检查抹布和套筒是否遗落在发动机舱内。","opts":[],"a":"√","e":"该说法正确。工具、螺栓遗落在发动机舱内，运转时可能卷入皮带、掉入气缸造成重大故障；竣工前必须清点工具并清洁工位。"},{"id":626,"oid":"B1-023","type":"judge","module":"汽车发动机维修","q":"拆卸蓄电池电缆时，应先拆正极再拆负极；安装时先装负极再装正极。","opts":[],"a":"×","e":"该说法错误。正确顺序是先拆负极后拆正极，防止扳手拆正极时碰车体短路打火；安装时先接正极后接负极，顺序说反了。"},{"id":627,"oid":"B1-024","type":"judge","module":"汽车发动机维修","q":"对装有安全气囊的车辆进行发动机维修前，应断开蓄电池负极并等待一段时间（让备用电源电容放电）后再作业。","opts":[],"a":"√","e":"该说法正确。安全气囊系统自带储能电容，断电后仍能短时供电起爆气囊；拆电瓶负极后需等待数十秒放电后再作业。"},{"id":628,"oid":"B1-025","type":"judge","module":"汽车发动机维修","q":"砂轮机磨削时，操作者应站在砂轮正前方，正对砂轮轴线方向观察火花。","opts":[],"a":"×","e":"该说法错误。砂轮高速旋转有破裂飞出危险，操作者应站在砂轮侧面并佩戴防护眼镜，不得正对砂轮站立。"},{"id":629,"oid":"B1-026","type":"judge","module":"汽车发动机维修","q":"使用扭力螺栓（塑性区域螺栓）时，按厂家要求应采用“力矩+转角”法拧紧，拆下后常需按规定更换。","opts":[],"a":"√","e":"该说法正确。连杆、缸盖等塑性区螺栓拉伸进入屈服阶段，拆卸后产生永久变形，再次拧紧受力不一致，必须按手册规定更换。"},{"id":630,"oid":"B1-027","type":"judge","module":"汽车发动机维修","q":"在车辆下方用气动机拆卸螺栓时，身体应避开螺栓甩出方向，必要时用托架托住车轮。","opts":[],"a":"√","e":"该说法正确。风炮扭矩大，螺栓、车轮松脱瞬间可能高速甩出，人员应避开旋转切线方向，车轮较重时用安全支架托住。"},{"id":631,"oid":"B1-028","type":"judge","module":"汽车发动机维修","q":"气动工具连接气管前，应检查快速接头是否锁牢、气管有无老化裂纹，气压不得超过工具额定值。","opts":[],"a":"√","e":"该说法正确。气管接头脱落会抽打伤人，超压会使工具爆裂、砂轮片飞脱；使用前检查管路和接头，按铭牌调节气源压力。"},{"id":632,"oid":"B1-029","type":"judge","module":"汽车发动机维修","q":"使用拉马拆卸皮带轮、齿轮时，丝杆应对正工件中心、拉爪受力均匀，身体避开工件甩出方向。","opts":[],"a":"√","e":"该说法正确。过盈件拆卸时储能突然释放可能使工件或拉爪崩脱飞出，应对中均匀施力、身体避开，不得用锤敲击丝杆辅助。"},{"id":633,"oid":"B1-030","type":"judge","module":"汽车发动机维修","q":"发动机电脑（ECU）等电子元件对静电敏感，拆装时可直接用手随意拿取电路板部位。","opts":[],"a":"×","e":"该说法错误。人体静电可达数千伏，直接触摸ECU电路板焊点可能击穿敏感元件；应先触摸接地点释放静电或戴防静电手环。"},{"id":634,"oid":"B1-031","type":"judge","module":"汽车发动机维修","q":"在车辆下方进行发动机下部作业时，地面人员不得随意操作车辆起动，应挂“有人作业、禁止动车”警示牌。","opts":[],"a":"√","e":"该说法正确。车下作业时误起动、误移动车辆会造成人员挤压、坠落伤害，应挂警示牌、由专人监护，车钥匙由作业人保管。"},{"id":635,"oid":"B1-032","type":"judge","module":"汽车发动机维修","q":"在未熄火的发动机舱内用万用表测量电压时，表笔可以随意搭在皮带轮附近测量。","opts":[],"a":"×","e":"该说法错误。运转发动机测量时表笔、导线应避开风扇、皮带轮等旋转部件，防止线被卷入拉走表笔或碰触高温排气管烫伤。"},{"id":636,"oid":"B1-033","type":"judge","module":"汽车发动机维修","q":"发动机上的气门弹簧拆卸时，应使用专用气门弹簧压缩器，不能用螺丝刀强行撬出。","opts":[],"a":"√","e":"该说法正确。气门弹簧储存弹性势能，直接撬拆会使弹簧、锁片高速弹出伤人，必须用专用压缩器压簧后再取锁片。"},{"id":637,"oid":"B1-034","type":"judge","module":"汽车发动机维修","q":"举升双柱举升机时，两车臂支撑点应对称落在底盘指定举升位，车辆重心位于两柱之间。","opts":[],"a":"√","e":"该说法正确。支撑不对称或偏载会使车辆在举升中滑移、倾覆；应确认支撑到位，先举升一小段晃动检查稳固后再升至作业高度。"},{"id":638,"oid":"B1-035","type":"judge","module":"汽车发动机维修","q":"拧紧发动机进排气歧管螺栓时，应从中间向两端分次交叉均匀拧紧，防止变形漏气。","opts":[],"a":"√","e":"该说法正确。歧管、缸盖等件若一次单向拧紧会造成平面翘曲、垫片密封不严；应按规定顺序分2~3次拧到规定力矩。"},{"id":639,"oid":"B1-036","type":"judge","module":"汽车发动机维修","q":"安装缸盖螺栓应按由中间向两端、分2~3次顺序拧紧，不能由两端向中间一次性拧紧。","opts":[],"a":"√","e":"该说法正确。由中向两端分次拧紧可使缸盖均匀贴合气缸垫，防止翘曲变形和漏水漏气；由两端向中间一次拧紧易造成缸盖变形。"},{"id":640,"oid":"B1-037","type":"judge","module":"汽车发动机维修","q":"使用活动扳手时，应让拉力作用在固定钳口上，不允许随意在手柄上加套管加长力臂。","opts":[],"a":"√","e":"该说法正确。活动扳手应使拉力作用在固定钳口、活动钳口受推力，张口受力不致滑脱；加套管超力矩会使扳手断裂、螺栓扭断伤手。"},{"id":641,"oid":"B1-038","type":"judge","module":"汽车发动机维修","q":"轮胎亏气、车辆歪斜时也可直接用举升机举升，不影响安全。","opts":[],"a":"×","e":"该说法错误。轮胎亏气、车辆歪斜会破坏举升对称性和稳定，应先停在平整硬地、检查轮胎，再按规范举升对位。"},{"id":642,"oid":"B1-039","type":"judge","module":"汽车发动机维修","q":"发动机皮带张紧器拆卸时可能有张紧弹簧力，应用专用工具缓慢释放，人员避开弹出方向。","opts":[],"a":"√","e":"该说法正确。张紧器弹簧储能，快速释放会使工具、张紧轮弹出；应用专用工具缓慢均匀释放张力，身体避开弹出方向。"},{"id":643,"oid":"B1-040","type":"judge","module":"汽车发动机维修","q":"发动机维修中使用化油器清洗剂时，应保持通风、远离火源和高温件，喷后稍等再起动。","opts":[],"a":"√","e":"该说法正确。化清剂易燃易挥发、气雾刺激呼吸道，应在通风处使用、远离火源高温件，喷后待溶剂挥发再点火，避免吸入和溅眼。"},{"id":644,"oid":"B1-041","type":"judge","module":"汽车发动机维修","q":"发动机舱发生焦糊味并冒烟（机油滴在排气管上），此时正确的处置顺序是立即熄火断电、用干粉灭火器扑救，而不是马上大开舱盖用水浇。","opts":[],"a":"√","e":"该说法正确。机舱油火贸然大开盖会因大量进风轰燃，用水会使油火飞溅并可能触电；应先断电断油、从缝隙用干粉灭火器扑救并报火警。"},{"id":645,"oid":"B1-042","type":"judge","module":"汽车发动机维修","q":"更换水泵后首次试车水温报警、地面可见防冻液渗漏，正确的安全检查顺序是先熄火、待降温泄压后再查漏，而不是热车立即开盖补加。","opts":[],"a":"√","e":"该说法正确。水温报警且地面漏液说明冷却系统密封或节温器故障，热车开盖会喷汽烫伤；应熄火自然降温泄压后再检查水管卡箍、水泵密封面。"},{"id":646,"oid":"B1-043","type":"judge","module":"汽车发动机维修","q":"两人配合在车下拆装发动机机脚胶时，必须先用千斤顶加木块托住发动机，并约定“再松手”口令后才能拆支撑螺栓。","opts":[],"a":"√","e":"该说法正确。机脚胶是发动机主要支承，拆前须托住发动机重量，否则发动机突然下沉坠落砸伤手脚；配合作业应统一口令、确认后再施力。"},{"id":647,"oid":"B1-044","type":"judge","module":"汽车发动机维修","q":"蓄电池亏电需要跨接起动时，正确做法是先接正极、再接负极，两车负极最后相连，起动后先拆负极再拆正极，防止短路打火。","opts":[],"a":"√","e":"该说法正确。跨接线接错顺序或正负极相碰会大电流短路、烧蚀并打火；规范顺序减小火花风险，也保护电控系统。"},{"id":648,"oid":"B1-045","type":"judge","module":"汽车发动机维修","q":"发动机运转中皮带打滑发出焦烟味时，应立即熄火停机，而不是继续高速运转观察。","opts":[],"a":"√","e":"该说法正确。皮带打滑冒烟说明张紧不足或轴承卡滞，继续运转会烧毁皮带、拉断后水泵风扇停转导致过热；应停机检查张紧轮、惰轮和皮带状态。"},{"id":649,"oid":"B1-046","type":"single","module":"汽车发动机维修","q":"车辆停在平整地面、拉紧手刹后，用千斤顶顶升进行发动机下护板拆卸，车下作业前最安全可靠的做法是（　）。","opts":[{"k":"A","t":"一直用千斤顶顶着作业"},{"k":"B","t":"换用安全支座将车辆支承牢固后再作业"},{"k":"C","t":"用砖块垫在轮胎旁即可"},{"k":"D","t":"让同伴在车顶压着增加稳定"}],"a":"B","e":"千斤顶仅用于短时间举升，不能长期承重；车下作业必须用安全支座在车身指定支撑点垫实，砖块易碎不可靠，人压车顶无意义。"},{"id":650,"oid":"B1-047","type":"single","module":"汽车发动机维修","q":"在密闭车间内需要短时间起动发动机检查，正确的安全措施是（　）。","opts":[{"k":"A","t":"关闭门窗保温"},{"k":"B","t":"开启排风装置或把排气管引出室外，并确认空挡、拉手刹"},{"k":"C","t":"挂入一挡防止溜车"},{"k":"D","t":"让一人站在车前推车"}],"a":"B","e":"发动机怠速排出CO会在密闭车间积聚中毒，必须通风；起动前确认空挡/P挡、拉手刹；挂一挡起动会使车辆突然前冲。"},{"id":651,"oid":"B1-048","type":"single","module":"汽车发动机维修","q":"拆卸发动机燃油系统部件前，为防止喷油起火，首先应（　）。","opts":[{"k":"A","t":"直接拔下油管"},{"k":"B","t":"先释放燃油系统残余压力，并准备好接油盘和灭火器"},{"k":"C","t":"用打火机照亮观察油位"},{"k":"D","t":"把蓄电池正极拆下即可"}],"a":"B","e":"燃油系统保持约0.3MPa压力，直接拔管会喷油；应先泄压、用接油盘承接残油、远离火源并备好灭火器。"},{"id":652,"oid":"B1-049","type":"single","module":"汽车发动机维修","q":"下列关于车间灭火器材使用，做法正确的是（　）。","opts":[{"k":"A","t":"电器起火先用水泼"},{"k":"B","t":"发动机舱机油着火，先断电、用干粉灭火器，必要时掀缝扑救"},{"k":"C","t":"油面着火用嘴吹灭"},{"k":"D","t":"灭火器可随意挪动位置"}],"a":"B","e":"电器、油类火灾不能用水（触电、油火蔓延）；应先断电、用干粉灭火器，机舱着火不宜立即大开盖防助燃。"},{"id":653,"oid":"B1-050","type":"single","module":"汽车发动机维修","q":"运转发动机检查时，人员和衣物应特别避开的危险部位是（　）。","opts":[{"k":"A","t":"车门把手"},{"k":"B","t":"风扇、皮带轮等旋转部件"},{"k":"C","t":"座椅"},{"k":"D","t":"后视镜"}],"a":"B","e":"风扇和皮带轮转速高、卷入力大，运转时严禁靠近触摸；车门、座椅、后视镜与发动机运转无关。"},{"id":654,"oid":"B1-051","type":"single","module":"汽车发动机维修","q":"检查发动机机油液位时，正确的安全与操作做法是（　）。","opts":[{"k":"A","t":"热车立即拔出机油尺"},{"k":"B","t":"车辆停平地、熄火静置数分钟后拔出机油尺观察"},{"k":"C","t":"发动机高速运转时查看"},{"k":"D","t":"让机油加满到溢出"}],"a":"B","e":"热车机油未回流立即看会偏高，应熄火静置数分钟、车辆水平停放后观察油尺在上下刻线之间；运转中检查有卷入风险。"},{"id":655,"oid":"B1-052","type":"single","module":"汽车发动机维修","q":"使用扭力扳手的主要目的是（　）。","opts":[{"k":"A","t":"加快拆卸速度"},{"k":"B","t":"控制螺栓拧紧力矩达到维修手册规定值，防止过紧或过松"},{"k":"C","t":"代替普通扳手"},{"k":"D","t":"增大摩擦力"}],"a":"B","e":"缸盖、连杆等重要连接必须按规定力矩拧紧：不足会松动漏油，过大造成螺栓拉伸、零件变形，扭力扳手用于精确控力矩。"},{"id":656,"oid":"B1-053","type":"single","module":"汽车发动机维修","q":"发动机“开锅”后，正确处理是（　）。","opts":[{"k":"A","t":"立即拧开散热器盖"},{"k":"B","t":"立即泼冷水到缸体上"},{"k":"C","t":"让发动机怠速或自然降温，待冷却泄压后再检查补液"},{"k":"D","t":"马上熄火用嘴吹"}],"a":"C","e":"高温高压下开盖或骤冷都会造成喷汽烫伤、缸体炸裂；应自然降温泄压后再处理，同时查明缺水、节温器、风扇等原因。"},{"id":657,"oid":"B1-054","type":"single","module":"汽车发动机维修","q":"安全支座的正确使用方法是（　）。","opts":[{"k":"A","t":"垫在轮胎下方"},{"k":"B","t":"顶在车身/底盘指定支承部位，与举升设备配合"},{"k":"C","t":"用砖块代替"},{"k":"D","t":"越高越好"}],"a":"B","e":"安全支座应支承在车身坚固部位，与千斤顶配合形成二道防线；砖块易碎不能代替，垫轮胎旁不支承车身。"},{"id":658,"oid":"B1-055","type":"single","module":"汽车发动机维修","q":"车间内汽油的存放，正确做法是（　）。","opts":[{"k":"A","t":"用普通塑料桶敞口放在工位旁"},{"k":"B","t":"用专用金属密封油桶存放在远离火源、通风良好的危险品区"},{"k":"C","t":"倒在玻璃瓶中"},{"k":"D","t":"与棉纱堆在一起"}],"a":"B","e":"汽油易挥发易燃易爆，敞口、塑料桶（易积聚静电）、靠近火源都极危险；应使用专用金属密封容器，存放在通风危险品柜。"},{"id":659,"oid":"B1-056","type":"single","module":"汽车发动机维修","q":"下列属于发动机维修中防止烫伤的正确做法是（　）。","opts":[{"k":"A","t":"热车立即拆排气管"},{"k":"B","t":"发动机高温时先待其降温或戴隔热手套，不随意触摸排气管、涡轮、散热器"},{"k":"C","t":"用湿抹布直接盖在高温管路上"},{"k":"D","t":"开锅立刻开盖"}],"a":"B","e":"排气歧管、涡轮、水箱表面温度可达百余摄氏度，触碰即烫伤；应待降温或戴隔热手套，热车开盖会喷蒸汽。"},{"id":660,"oid":"B1-057","type":"single","module":"汽车发动机维修","q":"关于发动机维修用电安全，正确的是（　）。","opts":[{"k":"A","t":"电线绝缘破损可继续使用"},{"k":"B","t":"使用漏电保护插座，电动工具外壳接地、线缆不碾压在油污下"},{"k":"C","t":"湿手插拔插头"},{"k":"D","t":"用铁丝代替保险丝"}],"a":"B","e":"电动工具必须接漏电保护、外壳接地，线缆完好防止漏电触电；湿手插拔、铁丝代替保险、绝缘破损都是违章。"},{"id":661,"oid":"B1-058","type":"single","module":"汽车发动机维修","q":"下列哪种行为在发动机维修车间属于违章（　）。","opts":[{"k":"A","t":"按规定穿戴劳保用品"},{"k":"B","t":"穿拖鞋、赤脚作业"},{"k":"C","t":"使用合格工具"},{"k":"D","t":"作业后清理工位"}],"a":"B","e":"穿拖鞋、赤脚易被油污滑倒、被零件砸伤、被高温件烫伤，进入车间必须穿防砸工作鞋并符合着装规范。"},{"id":662,"oid":"B1-059","type":"single","module":"汽车发动机维修","q":"进入发动机维修车间作业，下列穿戴符合要求的是（　）。","opts":[{"k":"A","t":"拖鞋、短裤"},{"k":"B","t":"合体工作服、防砸工作鞋、必要时护目镜/手套"},{"k":"C","t":"宽松飘带衣物"},{"k":"D","t":"佩戴领带、手链"}],"a":"B","e":"合体工作服、防砸鞋、护目镜是基本劳保；拖鞋短裤、宽松衣物、首饰易被旋转件卷入或被砸烫伤。"},{"id":663,"oid":"B1-060","type":"single","module":"汽车发动机维修","q":"关于发动机维修中防止误起动的措施，错误的是（　）。","opts":[{"k":"A","t":"拔掉点火钥匙由作业人保管"},{"k":"B","t":"在点火开关处挂“正在维修、禁止起动”警示牌"},{"k":"C","t":"为方便随时试车，钥匙插在点火开关上"},{"k":"D","t":"手动挡挂空挡、自动挡挂P挡"}],"a":"C","e":"钥匙留在点火开关上，他人误拧就会起动发动机，造成正在车下或舱内作业人员受伤；应拔钥匙、挂牌、专人监护。"},{"id":664,"oid":"B1-061","type":"single","module":"汽车发动机维修","q":"冷却液（防冻液）溅入眼睛，首先应（　）。","opts":[{"k":"A","t":"揉眼睛"},{"k":"B","t":"立即用大量清水冲洗眼睛并就医"},{"k":"C","t":"滴眼药水即可"},{"k":"D","t":"闭眼休息"}],"a":"B","e":"防冻液含乙二醇及添加剂，有刺激性和毒性，溅眼应立即用洗眼器/清水冲洗15分钟并就医，揉眼会加重化学损伤。"},{"id":665,"oid":"B1-062","type":"single","module":"汽车发动机维修","q":"下列关于发动机维修中棉纱、抹布使用正确的是（　）。","opts":[{"k":"A","t":"用棉纱擦拭高温排气管"},{"k":"B","t":"维修用抹布集中存放，油污抹布放入金属带盖桶"},{"k":"C","t":"抹布扔在进气管口"},{"k":"D","t":"用棉纱堵住水管"}],"a":"B","e":"油污棉纱自燃风险高，应放入金属带盖容器；堵在管口会被吸入气缸，抹布不得遗留进排气口和机舱内。"},{"id":666,"oid":"B1-063","type":"single","module":"汽车发动机维修","q":"在发动机下部使用千斤顶时，地面应为（　）。","opts":[{"k":"A","t":"松软泥地"},{"k":"B","t":"平整坚硬的水泥地面"},{"k":"C","t":"带坡度的地面"},{"k":"D","t":"铺地毯处"}],"a":"B","e":"松软、斜坡地面会使千斤顶下陷、滑移；应在平整坚硬地面作业，必要时垫钢板扩大支承面。"},{"id":667,"oid":"B1-064","type":"single","module":"汽车发动机维修","q":"举升车辆时发现车辆在举升机上明显歪斜、支撑点未到位，应（　）。","opts":[{"k":"A","t":"继续升到作业高度"},{"k":"B","t":"落回地面重新调整支撑点，确认对称稳固后再举升"},{"k":"C","t":"在车下垫石头"},{"k":"D","t":"用手扳正"}],"a":"B","e":"歪斜、支撑不到位的车辆随时可能滑移倾覆，必须落回重新对位；预升晃动检查正是为了避免带隐患升车。"},{"id":668,"oid":"B1-065","type":"single","module":"汽车发动机维修","q":"维修发动机时，拆卸下来的螺栓、螺母应（　）。","opts":[{"k":"A","t":"随便放在发动机罩上"},{"k":"B","t":"分类放在零件盒/托盘中，防止丢失和混入异物"},{"k":"C","t":"扔在地上"},{"k":"D","t":"塞进口袋"}],"a":"B","e":"拆下紧固件分类摆放、做好标记，防止遗失、错装（长短螺栓装错顶坏机体），也避免落入发动机内部。"},{"id":669,"oid":"B1-066","type":"single","module":"汽车发动机维修","q":"关于发动机维修中防止火灾，说法错误的是（　）。","opts":[{"k":"A","t":"维修区禁止烟火"},{"k":"B","t":"燃油系统作业前泄压"},{"k":"C","t":"漏油不必处理，干了就好"},{"k":"D","t":"备好灭火器"}],"a":"C","e":"漏油会在高温排气管上自燃，必须及时擦净、查找漏点；禁烟、泄压、配灭火器都是防火基本要求。"},{"id":670,"oid":"B1-067","type":"single","module":"汽车发动机维修","q":"发动机维修现场，发生人员机械伤害出血时，现场首要处理是（　）。","opts":[{"k":"A","t":"继续作业"},{"k":"B","t":"立即停止作业，对伤口止血并报告、视情送医"},{"k":"C","t":"涂口水消毒"},{"k":"D","t":"用脏布包扎"}],"a":"B","e":"受伤后应立即停机、按压止血、报告并就医；脏布包扎易感染，小伤也应规范处理。"},{"id":671,"oid":"B1-068","type":"single","module":"汽车发动机维修","q":"下列关于发动机冷却液系统带压维修，说法正确的是（　）。","opts":[{"k":"A","t":"热车可拆水管"},{"k":"B","t":"应待发动机降温泄压后再拆卸水管、暖风管"},{"k":"C","t":"拆管时脸正对管口"},{"k":"D","t":"用手堵管口"}],"a":"B","e":"热车水管内高压，拆卸会喷出高温冷却液烫伤；应降温泄压后操作，并避开管口方向。"},{"id":672,"oid":"B1-069","type":"single","module":"汽车发动机维修","q":"下列行为符合发动机维修车间安全规范的是（　）。","opts":[{"k":"A","t":"在工位追逐打闹"},{"k":"B","t":"按操作规程使用设备，不随意拆除安全防护装置"},{"k":"C","t":"私拉乱接电线"},{"k":"D","t":"把工具当暗器扔来扔去"}],"a":"B","e":"防护装置（皮带护罩、风扇护网）不得拆除，防止卷入；追逐打闹、私拉电线、乱扔工具都是违章。"},{"id":673,"oid":"B1-070","type":"single","module":"汽车发动机维修","q":"关于发动机维修现场的通道管理，正确的是（　）。","opts":[{"k":"A","t":"通道堆放零件和油桶"},{"k":"B","t":"保持消防通道、安全出口畅通不被占用"},{"k":"C","t":"把废件堆在出口"},{"k":"D","t":"拉线跨通道"}],"a":"B","e":"消防通道、安全出口必须畅通，便于紧急疏散和灭火器材取用；堆物堵塞通道在事故时会延误逃生。"},{"id":674,"oid":"B1-071","type":"single","module":"汽车发动机维修","q":"安全色中，表示“禁止、停止”的颜色是（　）。","opts":[{"k":"A","t":"红色"},{"k":"B","t":"蓝色"},{"k":"C","t":"绿色"},{"k":"D","t":"黄色"}],"a":"A","e":"红色表示禁止、停止、危险（如禁止标志、消防设备）；蓝色表示指令，黄色表示警告，绿色表示安全状态、通行。"},{"id":675,"oid":"B1-072","type":"single","module":"汽车发动机维修","q":"发动机维修车间发生火情，报警电话应拨打（　）。","opts":[{"k":"A","t":"110"},{"k":"B","t":"119"},{"k":"C","t":"120"},{"k":"D","t":"122"}],"a":"B","e":"火警拨打119；110为匪警、120为急救、122为交通事故。报警时讲清地点、火势、有无被困人员并派人引导。"},{"id":676,"oid":"B1-073","type":"single","module":"汽车发动机维修","q":"废机油的正确处理方式是（　）。","opts":[{"k":"A","t":"倒入下水道或花坛"},{"k":"B","t":"用专用容器收集，作为危险废物交有资质单位回收"},{"k":"C","t":"倒进生活垃圾"},{"k":"D","t":"洒在地面吸尘"}],"a":"B","e":"废机油属危险废物，乱倒污染土壤水源、违法；应集中收集、交有资质单位回收处理。"},{"id":677,"oid":"B1-074","type":"single","module":"汽车发动机维修","q":"发动机维修中，下列关于扳手使用错误的是（　）。","opts":[{"k":"A","t":"按螺栓尺寸选合适开口"},{"k":"B","t":"在扳手手柄上加套管随意加长力臂"},{"k":"C","t":"拉力方向作用在固定钳口"},{"k":"D","t":"不用锤子击打扳手手柄"}],"a":"B","e":"加套管会使力矩超设计值，造成扳手断裂、螺栓扭断伤手；应选合适工具、正确施力方向。"},{"id":678,"oid":"B1-075","type":"single","module":"汽车发动机维修","q":"下列属于发动机维修中个人防护的正确做法是（　）。","opts":[{"k":"A","t":"接触机油、清洗剂戴耐油手套"},{"k":"B","t":"不戴护目镜"},{"k":"C","t":"光脚穿凉鞋"},{"k":"D","t":"长发披肩"}],"a":"A","e":"机油、化学清洗剂伤手、致敏，应戴耐油手套；同时须护目镜、防砸鞋、束发。"},{"id":679,"oid":"B1-076","type":"single","module":"汽车发动机维修","q":"下列关于发动机维修中使用砂轮机，错误的是（　）。","opts":[{"k":"A","t":"检查砂轮有无裂纹、防护罩齐全"},{"k":"B","t":"站在砂轮侧面磨削"},{"k":"C","t":"两人同时共用一台砂轮"},{"k":"D","t":"戴护目镜"}],"a":"C","e":"一台砂轮只能一人操作，两人同时靠近容易相互干扰或工件飞出伤人；使用前查裂纹、防护罩，站侧面、戴护目镜。"},{"id":680,"oid":"B1-077","type":"single","module":"汽车发动机维修","q":"在车间内推动放置发动机零件的零件车时，应（　）。","opts":[{"k":"A","t":"快速奔跑"},{"k":"B","t":"控制速度、注意脚下和通道，零件固定不超高"},{"k":"C","t":"让车自己滑行"},{"k":"D","t":"坐在车上滑行"}],"a":"B","e":"零件车应稳推慢走、载荷固定不超高，防止倾倒砸伤；快速奔跑、坐滑会撞人撞物。"},{"id":681,"oid":"B1-078","type":"single","module":"汽车发动机维修","q":"维修发动机中，对待维修手册和量具的态度，正确的是（　）。","opts":[{"k":"A","t":"凭经验不用手册"},{"k":"B","t":"按维修手册规定的力矩、顺序和标准值操作，并正确使用量具"},{"k":"C","t":"量具不需要校准"},{"k":"D","t":"手册可随便猜"}],"a":"B","e":"现代发动机技术要求高，必须按手册力矩、顺序、标准值作业；量具须校准，凭经验易出安全质量事故。"},{"id":682,"oid":"B1-079","type":"single","module":"汽车发动机维修","q":"下列哪种做法是发动机维修中正确的文明安全生产行为（　）。","opts":[{"k":"A","t":"工具用完不归位"},{"k":"B","t":"工位整洁、油路畅通、零件有序、安全第一"},{"k":"C","t":"试车不挂警示牌"},{"k":"D","t":"漏油不擦"}],"a":"B","e":"文明生产要求工位整洁、油液不滴漏、零件工具有序、严守安全操作规程，确保人身和设备安全。"},{"id":683,"oid":"B1-080","type":"single","module":"汽车发动机维修","q":"关于发动机维修中“三不伤害”原则，正确理解是（　）。","opts":[{"k":"A","t":"不伤害自己、不伤害他人、不被他人伤害"},{"k":"B","t":"不损坏工具、不浪费材料、不迟到"},{"k":"C","t":"不换件、不解体、不试车"},{"k":"D","t":"不记录、不报告、不清洁"}],"a":"A","e":"“三不伤害”是安全生产基本准则：不伤害自己、不伤害他人、不被他人伤害，通过规范操作和互保落实。"},{"id":684,"oid":"B1-081","type":"single","module":"汽车发动机维修","q":"发动机大修吊装时，吊索应挂在（　）。","opts":[{"k":"A","t":"油底壳螺栓上"},{"k":"B","t":"缸体、缸盖上制造厂设计的专用吊装吊耳上"},{"k":"C","t":"水管接头处"},{"k":"D","t":"任意方便的部位"}],"a":"B","e":"吊装必须挂在缸体上专门的起重吊耳，油底壳、水管等薄壁件承力不足会撕裂脱落；挂错点发动机可能滑脱坠落。"},{"id":685,"oid":"B1-082","type":"single","module":"汽车发动机维修","q":"对装备安全气囊的车辆进行发动机维修，断开蓄电池负极后通常应（　）再拆卸相关部件。","opts":[{"k":"A","t":"立即动手"},{"k":"B","t":"等待数十秒让气囊备用电源电容放电"},{"k":"C","t":"反复按喇叭"},{"k":"D","t":"打开点火开关"}],"a":"B","e":"气囊控制模块自带储能电容，断电后仍能短时供电起爆气囊；须等待规定时间放电，防止在靠近转向盘、座椅侧饰板作业时气囊意外爆开。"},{"id":686,"oid":"B1-083","type":"single","module":"汽车发动机维修","q":"在车下使用手电钻或砂轮打磨底盘零件时，护目镜的佩戴要求是（　）。","opts":[{"k":"A","t":"不用戴，注意即可"},{"k":"B","t":"必须佩戴防护眼镜，防止铁屑、磨粒飞溅伤眼"},{"k":"C","t":"戴普通近视眼镜即可替代"},{"k":"D","t":"闭眼操作"}],"a":"B","e":"打磨、钻孔产生高速飞溅铁屑，易击穿眼球，必须戴符合标准的防护眼镜；普通近视镜不防侧面冲击，不能替代。"},{"id":687,"oid":"B1-084","type":"single","module":"汽车发动机维修","q":"举升机举升车辆进行发动机作业时，正确的顺序是（　）。","opts":[{"k":"A","t":"直接升到最高马上钻车底"},{"k":"B","t":"支撑到指定举升点、举升一小段检查稳固、确认安全锁止后再升至工作高度"},{"k":"C","t":"车顶站人增加配重"},{"k":"D","t":"车辆斜着支撑没关系"}],"a":"B","e":"正确流程：对准举升点→预升晃动检查→确认机械锁止→升至作业高度；未锁止、未确认稳固严禁进入车下。"},{"id":688,"oid":"B1-085","type":"single","module":"汽车发动机维修","q":"吊装发动机总成时，下列做法错误的是（　）。","opts":[{"k":"A","t":"检查吊索、卸扣有无断丝裂纹"},{"k":"B","t":"吊物下方严禁站人"},{"k":"C","t":"可以斜拉歪吊快速就位"},{"k":"D","t":"由专人指挥、平稳起吊"}],"a":"C","e":"斜拉歪吊会使载荷摆动、脱钩并损伤起重设备；应垂直平稳起吊、下方严禁站人、起吊前检查索具。"},{"id":689,"oid":"B1-086","type":"single","module":"汽车发动机维修","q":"在发动机旁使用万用表检测时，错误的做法是（　）。","opts":[{"k":"A","t":"选对电压/电流量程档"},{"k":"B","t":"表笔绝缘层完好"},{"k":"C","t":"测量时表笔远离旋转和高温部件"},{"k":"D","t":"用电流档直接测量蓄电池两端电压"}],"a":"D","e":"用电流档短接蓄电池相当于短路，会烧表、打火；其余都是带电测量的基本安全要求。"},{"id":690,"oid":"B1-087","type":"single","module":"汽车发动机维修","q":"发动机舱内电子散热风扇可能突然启动伤人，检修冷凝器、风扇周边前应（　）。","opts":[{"k":"A","t":"直接伸手检查"},{"k":"B","t":"关闭发动机并拔出点火钥匙，确认风扇完全停转"},{"k":"C","t":"打开空调让风扇转更快"},{"k":"D","t":"用手按住叶片"}],"a":"B","e":"电子风扇在水温高或开空调时会自动旋转，且断电后有时还会温控启动；作业前熄火拔钥匙，待风扇停稳再靠近。"},{"id":691,"oid":"B1-088","type":"single","module":"汽车发动机维修","q":"使用手电钻钻孔时，下列操作错误的是（　）。","opts":[{"k":"A","t":"戴防护眼镜"},{"k":"B","t":"工件用台虎钳夹紧"},{"k":"C","t":"戴棉纱手套握持钻头附近"},{"k":"D","t":"钻孔时控制进给压力"}],"a":"C","e":"旋转钻头易卷入线手套造成绞手，钻床、电钻作业严禁戴线手套；工件须夹紧、戴护目镜、均匀施力。"},{"id":692,"oid":"B1-089","type":"single","module":"汽车发动机维修","q":"对发动机进行焊接（如焊修排气管）时，下列措施错误的是（　）。","opts":[{"k":"A","t":"移开附近燃油管、线束"},{"k":"B","t":"备好灭火器并设监火人"},{"k":"C","t":"在满是油污棉纱的工位直接动火"},{"k":"D","t":"断开蓄电池、ECU插头"}],"a":"C","e":"动火作业周围应清除易燃物，油污棉纱极易被焊渣引燃；应清理现场、断电、备灭火器并监火，作业后留观。"},{"id":693,"oid":"B1-090","type":"single","module":"汽车发动机维修","q":"发现举升机下行时异响、自行下滑，应（　）。","opts":[{"k":"A","t":"继续使用"},{"k":"B","t":"立即停止使用、挂牌报修，由专业人员检修"},{"k":"C","t":"自己拆开修理"},{"k":"D","t":"在车下垫东西继续"}],"a":"B","e":"举升机异常下滑存在严重坠落风险，应停用、挂“故障停用”牌并报修；非专业人员拆修可能引发更大事故。"},{"id":694,"oid":"B1-091","type":"single","module":"汽车发动机维修","q":"发动机大修后第一次起动试车，正确做法是（　）。","opts":[{"k":"A","t":"直接全速运转"},{"k":"B","t":"先检查机油压力、冷却水连接，低速怠速运转观察有无异响漏水漏油"},{"k":"C","t":"立即挂挡行驶"},{"k":"D","t":"不接散热器盖"}],"a":"B","e":"大修后应先确认润滑、冷却、紧固到位，怠速磨合并观察机油压力、水温及泄漏异响；直接全速、行驶易因装配问题烧毁发动机。"},{"id":695,"oid":"B1-092","type":"single","module":"汽车发动机维修","q":"拆卸发动机正时皮带后再装回，为保证配气相位正确，装配时必须（　）。","opts":[{"k":"A","t":"随便装上即可"},{"k":"B","t":"将曲轴、凸轮轴对准维修手册规定的正时标记后再装皮带"},{"k":"C","t":"皮带越紧越好"},{"k":"D","t":"旋转几圈后不用复查"}],"a":"B","e":"正时错位会使气门与活塞碰撞；必须对准正时标记安装，按规定张力张紧，盘车两圈后复查标记仍对正。"},{"id":696,"oid":"B1-093","type":"single","module":"汽车发动机维修","q":"维修作业中听到发动机舱发出异常“哒哒”金属声并伴有异味，应（　）。","opts":[{"k":"A","t":"继续运转观察"},{"k":"B","t":"立即熄火断电，检查是否缺机油、轴承抱死或有异物"},{"k":"C","t":"加大油门冲过去"},{"k":"D","t":"用水浇"}],"a":"B","e":"异常金属响多为缺油、拉瓦或异物卷入，继续运转会迅速扩大为抱轴、捣缸大修；应立即熄火检查，不得带病运转。"},{"id":697,"oid":"B1-094","type":"single","module":"汽车发动机维修","q":"两人配合抬运较重的发动机缸盖时，正确做法是（　）。","opts":[{"k":"A","t":"各自突然发力"},{"k":"B","t":"统一口令、同时起身，注意脚下防滑，走指定通道"},{"k":"C","t":"一人扛起就走"},{"k":"D","t":"从别人头顶递过"}],"a":"B","e":"重物抬运应步调一致、统一口令，防止脱手砸脚、扭腰；应优先用起重设备，人工抬运时配合默契。"},{"id":698,"oid":"B1-095","type":"single","module":"汽车发动机维修","q":"使用扭力扳手拆卸过紧螺栓后再用它拧紧重要螺栓，应注意（　）。","opts":[{"k":"A","t":"扭力扳手可以当普通扳手随意撬"},{"k":"B","t":"扭力扳手仅用于达到设定力矩后即停，不得超量程加套管"},{"k":"C","t":"越用力拧越准"},{"k":"D","t":"用完不用校检"}],"a":"B","e":"扭力扳手是精密量具，超力矩、当撬棍、加套管会使其失准；达到设定值发出“咔哒”感应立即停手，并定期送校。"},{"id":699,"oid":"B1-096","type":"single","module":"汽车发动机维修","q":"拆装发动机进气管卡箍锈蚀拆不动，正确做法是（　）。","opts":[{"k":"A","t":"用螺丝刀硬撬管接头"},{"k":"B","t":"喷松动剂浸润后用卡箍钳拆卸，避免塑料管接头崩裂伤手"},{"k":"C","t":"用牙咬"},{"k":"D","t":"猛拉管子"}],"a":"B","e":"锈蚀卡箍硬撬会崩裂塑料接头、橡胶管回弹伤手；应喷松动剂浸润，用专用卡箍钳拆卸，部件老化时一并更换。"},{"id":700,"oid":"B1-097","type":"single","module":"汽车发动机维修","q":"车辆在举升机上进行发动机维修时，下列哪种做法存在倾覆风险（　）。","opts":[{"k":"A","t":"支撑点对称落在举升位"},{"k":"B","t":"把沉重发动机整个吊出后在车头上方长时间晃动"},{"k":"C","t":"先举升小高度检查"},{"k":"D","t":"确认锁止后作业"}],"a":"B","e":"吊出发动机后车辆前轴配重变化，在举升机上大幅晃动重物会改变重心引发倾翻；应先落车或用支架固定，平稳操作。"},{"id":701,"oid":"B1-098","type":"single","module":"汽车发动机维修","q":"在底盘和发动机之间作业（如换离合器），变速器下方应（　）。","opts":[{"k":"A","t":"徒手托住即可"},{"k":"B","t":"用安全支架或托架托住变速器，防止坠落砸伤"},{"k":"C","t":"不用支撑"},{"k":"D","t":"让同伴抱住"}],"a":"B","e":"变速器沉重（数十千克），徒手托住一旦滑落会砸伤手脚；应用托架、吊装设备支撑，防止挤压砸伤。"},{"id":702,"oid":"B1-099","type":"single","module":"汽车发动机维修","q":"安全检查中发现发动机舱蓄电池接线柱氧化、松动，可能造成（　）。","opts":[{"k":"A","t":"接触电阻大、起动机无力甚至发热打火"},{"k":"B","t":"没有影响"},{"k":"C","t":"油耗降低"},{"k":"D","t":"功率增大"}],"a":"A","e":"接线柱氧化松动使接触电阻增大，起动机大电流时发热、电压降增大、起动无力，严重时发热引燃；应清洁紧固并涂凡士林。"},{"id":703,"oid":"B1-100","type":"single","module":"汽车发动机维修","q":"发动机大修后，对缸盖螺栓按维修手册“力矩+转角”法拧紧，其目的是（　）。","opts":[{"k":"A","t":"节省时间"},{"k":"B","t":"精确控制螺栓拉伸量，保证缸盖密封又不过载"},{"k":"C","t":"越紧越好"},{"k":"D","t":"凭手感即可"}],"a":"B","e":"塑性区螺栓用力矩+转角法可精确控制预紧力和拉伸，均匀压紧气缸垫；只凭手感或一味加力会造成密封不良或螺栓断裂。"},{"id":704,"oid":"B1-101","type":"single","module":"汽车发动机维修","q":"断开蓄电池负极会导致ECU自适应学习值、收放机密码等丢失，正确认识是（　）。","opts":[{"k":"A","t":"拔负极不会丢失任何数据"},{"k":"B","t":"维修前应了解并做好记录，必要时按规范供电更换电瓶"},{"k":"C","t":"必须先拆正极"},{"k":"D","t":"断电对ECU有保护作用可随意断"}],"a":"B","e":"直接断电瓶负极会清除ECU学习值、收放机密码、车窗一键升降设定；维修前应确认，重要数据记录在案。"},{"id":705,"oid":"B1-102","type":"single","module":"汽车发动机维修","q":"检查发动机皮带张力时，发动机应处于（　）。","opts":[{"k":"A","t":"高速运转"},{"k":"B","t":"熄火状态，按规定挠度（或张力计）检查"},{"k":"C","t":"怠速即可"},{"k":"D","t":"一边运转一边用手按"}],"a":"B","e":"皮带检查须熄火后进行，防止手指、衣物被卷入；按手册用拇指按压挠度或张力计测量，过松打滑、过紧损轴承。"},{"id":706,"oid":"B1-103","type":"single","module":"汽车发动机维修","q":"发动机上的塑料（尼龙）真空管老化后拆卸容易碎裂，正确做法是（　）。","opts":[{"k":"A","t":"用螺丝刀大力撬"},{"k":"B","t":"喷润滑剂软化后轻轻转动拔出，碎片及时清除干净"},{"k":"C","t":"用火烧软"},{"k":"D","t":"剪断即可，碎片留管内"}],"a":"B","e":"老化塑料件脆硬，硬撬会崩裂伤手、碎片落入进气管；应润滑软化后轻拔，碎裂物必须全部取出，否则吸入气缸。"},{"id":707,"oid":"B1-104","type":"single","module":"汽车发动机维修","q":"两人配合作业（一人操作一人观察）时，正确做法是（　）。","opts":[{"k":"A","t":"各行其是"},{"k":"B","t":"统一口令和信号，操作者得到确认指令后再起动或施力"},{"k":"C","t":"观察者可以随意突然拍肩"},{"k":"D","t":"谁先动手听谁"}],"a":"B","e":"起动、吊装、大扭矩施力等作业需配合默契、统一口令；突然拍肩惊吓可能造成误操作伤人，应事先约定信号。"},{"id":708,"oid":"B1-105","type":"single","module":"汽车发动机维修","q":"发动机维修中，关于发动机上的高温部件重新装配，操作错误的是（　）。","opts":[{"k":"A","t":"排气歧管垫片按规定更换"},{"k":"B","t":"热车时徒手紧固排气管螺栓"},{"k":"C","t":"螺栓按顺序分次拧紧"},{"k":"D","t":"待冷却后拆装"}],"a":"B","e":"热车排气管表面温度高，徒手紧固会烫伤；应在冷却后按顺序分次拧到规定力矩，必要时戴隔热手套。"},{"id":709,"oid":"B1-106","type":"single","module":"汽车发动机维修","q":"用风炮拆卸轮胎或飞轮螺栓时，人员应（　）。","opts":[{"k":"A","t":"正对螺栓站立观察"},{"k":"B","t":"身体避开螺栓和工件甩出方向，必要时用支架托住车轮"},{"k":"C","t":"用手扶住螺栓"},{"k":"D","t":"让别人用手按住车轮"}],"a":"B","e":"风炮扭矩大，螺栓松脱瞬间高速飞出会击伤人员；应避开飞出方向、车轮用支架托住，不得用手扶持转动中的工件。"},{"id":710,"oid":"B1-107","type":"single","module":"汽车发动机维修","q":"发动机上的高温排气管、涡轮在维修后，应防止机油滴落在其表面，原因是（　）。","opts":[{"k":"A","t":"没有影响"},{"k":"B","t":"高温会使机油受热自燃，引发发动机舱火灾"},{"k":"C","t":"会降低功率"},{"k":"D","t":"会使排气管生锈"}],"a":"B","e":"排气管、涡轮表面温度可达数百摄氏度，滴上机油会受热自燃；应擦净残油、消除渗漏，防止机舱火灾。"},{"id":711,"oid":"B1-108","type":"single","module":"汽车发动机维修","q":"发动机维修现场油液洒漏后的应急处理，正确的是（　）。","opts":[{"k":"A","t":"用大量水冲入下水道"},{"k":"B","t":"用吸油棉/沙土覆盖吸收后收集到危废桶"},{"k":"C","t":"用扫帚扫进地沟"},{"k":"D","t":"不管它"}],"a":"B","e":"油液应用吸油材料吸附收集作危废处理，冲入下水道污染环境且违法；及时清理也防滑。"},{"id":712,"oid":"B1-109","type":"single","module":"汽车发动机维修","q":"在发动机舱上方取放工具，正确做法是（　）。","opts":[{"k":"A","t":"工具放在翼子板上随手拿"},{"k":"B","t":"使用工具腰带或磁性工具盘，防止工具掉落"},{"k":"C","t":"把工具扔上车再扔下来"},{"k":"D","t":"叠放在进气口"}],"a":"B","e":"工具放在车身上易滑落砸脚、掉入机舱；用工具腰带、磁性盘取用方便，防止坠落伤人损件。"},{"id":713,"oid":"B1-110","type":"single","module":"汽车发动机维修","q":"发动机维修中若发现轮胎气压不足、车辆歪斜，应在举升前（　）。","opts":[{"k":"A","t":"直接举升"},{"k":"B","t":"先检查轮胎、停稳垫好再举升"},{"k":"C","t":"放掉更多气"},{"k":"D","t":"不管"}],"a":"B","e":"轮胎亏气、车辆歪斜会影响举升对称和稳定，应先停在平整硬地、检查轮胎、必要时垫好，再按规范举升。"},{"id":714,"oid":"B1-111","type":"single","module":"汽车发动机维修","q":"车辆事故后发动机舱变形、燃油管破裂并有汽油味渗出，现场首要处置是（　）。","opts":[{"k":"A","t":"立即打开发动机罩查看"},{"k":"B","t":"切断电源、远离明火、备好灭火器并设警戒，联系救援拖车"},{"k":"C","t":"用棉布把漏油擦干"},{"k":"D","t":"起动车辆试试能否开走"}],"a":"B","e":"燃油泄漏遇电火花或明火即起火，应先断电断油、远离火源、警戒现场，不能贸然开盖或起动，应等待专业救援。"},{"id":715,"oid":"B1-112","type":"single","module":"汽车发动机维修","q":"更换水泵后试车水温报警、地面有防冻液，正确的安全检查顺序是（　）。","opts":[{"k":"A","t":"立即开盖补防冻液"},{"k":"B","t":"熄火自然降温泄压后，再检查水管卡箍、水泵密封面和空气是否排尽"},{"k":"C","t":"继续高速行驶散热"},{"k":"D","t":"用冷水直接冲水箱"}],"a":"B","e":"水温报警伴漏液说明密封不良或有气阻，热车开盖会喷汽烫伤；应先降温泄压再查漏、排空气，不可热车开盖或骤冷。"},{"id":716,"oid":"B1-113","type":"single","module":"汽车发动机维修","q":"机油压力报警灯点亮，同时听到发动机内部金属异响，正确处置是（　）。","opts":[{"k":"A","t":"立即靠边熄火，停机检查机油量和机油泵，不得继续行驶"},{"k":"B","t":"继续开到修理厂"},{"k":"C","t":"加大油门提高油压"},{"k":"D","t":"关闭报警灯继续开"}],"a":"A","e":"机油压力低加金属响说明润滑失效、可能拉瓦，继续运转会迅速抱轴捣缸；应立即熄火检查机油油位和机油泵，避免发动机报废。"},{"id":717,"oid":"B1-114","type":"single","module":"汽车发动机维修","q":"蓄电池严重亏电需跨接起动另一辆救援车，正确接线与安全顺序是（　）。","opts":[{"k":"A","t":"先接正极→再接两车负极→起动后先拆正极后拆负极"},{"k":"B","t":"先接负极→再接正极"},{"k":"C","t":"正负极随意接"},{"k":"D","t":"起动后立即全部拔掉"}],"a":"A","e":"规范顺序减小短路火花并保护电控模块：先正后负，拆时相反先负后正；接错或短路会烧蚀线束甚至引起电瓶爆炸。"},{"id":718,"oid":"B1-115","type":"single","module":"汽车发动机维修","q":"举升机上更换机油时放油螺塞垫圈损坏导致螺纹滑丝、机油渗漏，正确处置是（　）。","opts":[{"k":"A","t":"继续拧入强行密封"},{"k":"B","t":"待机油流完后更换螺塞或修复螺纹，清理地面油污，不得带病装配"},{"k":"C","t":"涂胶后不换"},{"k":"D","t":"不管渗漏"}],"a":"B","e":"滑丝强行装配会越漏越大，热机油还会溅到排气管起火；应更换螺塞/攻丝修复、清理油污，确认密封后再加注机油。"},{"id":719,"oid":"B1-116","type":"single","module":"汽车发动机维修","q":"发动机无法起动且闻到电瓶处有焦糊味、看到接线柱冒烟，正确排查顺序是（　）。","opts":[{"k":"A","t":"立即断电瓶负极、移开易燃物、灭火，再查线路短路"},{"k":"B","t":"用手按住冒烟处"},{"k":"C","t":"反复拧起动开关"},{"k":"D","t":"用水浇接线柱"}],"a":"A","e":"接线柱冒烟说明线路短路大电流发热，有起火危险；应先断电、灭火、移开易燃物，再查短路点，不能带火反复起动。"},{"id":720,"oid":"B1-117","type":"single","module":"汽车发动机维修","q":"大修后使用电钻打磨隔板，同时地面有机油泄漏且电源线绝缘层破损，此时应（　）。","opts":[{"k":"A","t":"先继续打磨完"},{"k":"B","t":"立即停止作业，更换破损电源线或停用该工具，清理油污后再作业"},{"k":"C","t":"用胶布缠一下继续"},{"k":"D","t":"用水冲洗油污"}],"a":"B","e":"电源线破损遇油湿地面有触电风险，油污也滑；应先断电停用破损工具、清理油污，消除隐患后再作业。"},{"id":721,"oid":"B1-118","type":"single","module":"汽车发动机维修","q":"两人在车辆下方和上方同时作业拆装发动机机脚胶，下列安全措施最关键的是（　）。","opts":[{"k":"A","t":"车下用千斤顶托住发动机、上方约定口令、防止误起动和坠落"},{"k":"B","t":"各自抓紧即可"},{"k":"C","t":"车钥匙插在车上"},{"k":"D","t":"发动机不托住直接拆螺栓"}],"a":"A","e":"机脚胶拆后发动机失去支承，必须先用千斤顶托住；配合时统一口令、拔钥匙挂牌防误起动，防止发动机坠落压伤。"},{"id":722,"oid":"B1-119","type":"single","module":"汽车发动机维修","q":"冬季维修发现车辆因冷却液冰点不足曾结冰冻裂水箱，再次加注冷却液前应（　）。","opts":[{"k":"A","t":"直接补加水"},{"k":"B","t":"检查确认水道无渗漏、无冻裂，加注规定牌号防冻液并测冰点"},{"k":"C","t":"加自来水即可"},{"k":"D","t":"继续使用原冷却液"}],"a":"B","e":"冻裂后系统可能有隐性裂纹和残余应力，直接加水复热会渗漏扩大；应先查漏修复，再加防冻液并测冰点达标。"},{"id":723,"oid":"B1-120","type":"single","module":"汽车发动机维修","q":"更换涡轮增压器后，进气和润滑油管内残留清洗剂或异物，起动前必须（　）。","opts":[{"k":"A","t":"直接起动"},{"k":"B","t":"检查管路清洁无异物、按规定预润滑，确认机油压力正常后再起动"},{"k":"C","t":"多喷油帮助起动"},{"k":"D","t":"拆空气滤芯"}],"a":"B","e":"增压器转速高、润滑要求严，残留异物会打坏叶轮，缺油起动会烧轴瓦；应清洁管路、预润滑、确认油压后再起动。"},{"id":724,"oid":"B1-121","type":"single","module":"汽车发动机维修","q":"发动机同时存在底盘和发动机两处作业，为防止误起动和互相伤害，正确做法是（　）。","opts":[{"k":"A","t":"各自为战"},{"k":"B","t":"统一指挥、拔钥匙挂牌、明确谁在车下、谁负责起动"},{"k":"C","t":"一人在车下一人随意拧钥匙"},{"k":"D","t":"用喇叭通知即可"}],"a":"B","e":"多处作业信息不畅最易误起动伤人，应设专人统一指挥、拔钥匙挂警示牌、明确分工和信号，确认无人处于危险区再操作。"},{"id":725,"oid":"B1-122","type":"single","module":"汽车发动机维修","q":"对车身进行焊接（动火）同时发动机舱有历史漏油痕迹，正确做法是（　）。","opts":[{"k":"A","t":"边焊边擦"},{"k":"B","t":"先彻底清除油污、备好灭火器、办理动火许可并设监火人，作业后留观"},{"k":"C","t":"直接焊"},{"k":"D","t":"用水冲油污后立即焊"}],"a":"B","e":"油污+焊渣=火灾，必须先清油污、动火审批、配灭火器监火；水冲后未干燥就焊接仍有触电和爆燃风险。"},{"id":726,"oid":"B1-123","type":"single","module":"汽车发动机维修","q":"用扭力扳手复检缸盖螺栓时发现力矩明显低于规定值，且发动机曾出现过冷却液窜入现象，应（　）。","opts":[{"k":"A","t":"继续装车使用"},{"k":"B","t":"停机解体检查缸盖垫和缸盖平面，查明密封失效原因后再按规范复装"},{"k":"C","t":"把螺栓再拧紧几圈即可"},{"k":"D","t":"补加冷却液继续用"}],"a":"B","e":"缸盖螺栓力矩衰减+冷却液窜缸说明气缸垫密封失效，单纯补紧不能消除裂纹或平面翘曲；应解体检查缸盖垫、缸盖平面度后复装。"},{"id":727,"oid":"B4-006","type":"judge","module":"汽车发动机维修","q":"活塞的主要作用是承受气缸内燃气压力，并通过活塞销和连杆把力传给曲轴。","opts":[],"a":"√","e":"活塞在气缸内承受燃气高压，经活塞销、连杆将力传给曲轴输出转矩，这是活塞的基本功用。"},{"id":728,"oid":"B4-007","type":"judge","module":"汽车发动机维修","q":"现代汽车发动机活塞广泛采用铝合金制造，因其导热性好、质量轻、膨胀系数小。","opts":[],"a":"√","e":"铝合金活塞导热好、质量轻、往复惯性力小，广泛用于现代发动机；铸铁活塞因质量大已少用。"},{"id":729,"oid":"B4-008","type":"judge","module":"汽车发动机维修","q":"活塞裙部的主要作用是为活塞在气缸内运动导向，并承受侧压力。","opts":[],"a":"√","e":"裙部与气缸壁配合起导向作用，并承受侧向力，保证活塞不倾斜、不敲缸。"},{"id":730,"oid":"B4-009","type":"judge","module":"汽车发动机维修","q":"活塞顶部是燃烧室的组成部分，直接承受高温高压燃气的作用。","opts":[],"a":"√","e":"活塞顶与气缸盖底面共同构成燃烧室，直接受燃气冲刷，热负荷最高。"},{"id":731,"oid":"B4-010","type":"judge","module":"汽车发动机维修","q":"为减小裙部热变形，通常将活塞裙部横断面制成椭圆形，其长轴沿活塞销座方向布置。","opts":[],"a":"×","e":"说法错误。裙部销座方向金属多、膨胀大，故椭圆长轴应垂直于活塞销方向，以补偿销座方向膨胀。"},{"id":732,"oid":"B4-011","type":"judge","module":"汽车发动机维修","q":"气环的主要作用是密封气缸，防止燃气漏入曲轴箱，并把活塞头部热量传给气缸壁。","opts":[],"a":"√","e":"气环靠弹性贴紧缸壁密封燃气，同时将活塞顶热量导给缸壁散热。"},{"id":733,"oid":"B4-012","type":"judge","module":"汽车发动机维修","q":"油环的主要作用是刮除气缸壁上多余的机油，并在缸壁上均匀布油形成油膜。","opts":[],"a":"√","e":"油环下行刮油、上行布油，控制缸壁油量，防止机油窜入燃烧室燃烧。"},{"id":734,"oid":"B4-013","type":"judge","module":"汽车发动机维修","q":"安装扭曲环时，应将其内圆切口（倒角）向上、外圆切口向下，使环产生扭曲刮油。","opts":[],"a":"√","e":"扭曲环切口方向决定扭曲方向：内切口向上、外切口向下，环扭曲后外缘与缸壁呈线接触，密封刮油更好。"},{"id":735,"oid":"B4-014","type":"judge","module":"汽车发动机维修","q":"活塞环端隙（开口间隙）是指活塞装入气缸后，环开口处两端之间的间隙。","opts":[],"a":"√","e":"端隙即环开口处的间隙，给环受热膨胀留余地，防止环口顶死折断。"},{"id":736,"oid":"B4-015","type":"judge","module":"汽车发动机维修","q":"活塞环侧隙过大，泵油作用增强、机油消耗增加；侧隙过小，环易在环槽内卡死。","opts":[],"a":"√","e":"侧隙过大环上下窜动泵油多，侧隙过小环受热涨卡死失去弹性，两种都不行。"},{"id":737,"oid":"B4-016","type":"judge","module":"汽车发动机维修","q":"活塞销用来连接活塞和连杆小头，并将活塞承受的力传给连杆。","opts":[],"a":"√","e":"活塞销穿连活塞销座与连杆小头，是活塞与连杆之间传力的铰接件。"},{"id":738,"oid":"B4-017","type":"judge","module":"汽车发动机维修","q":"全浮式活塞销在发动机正常工作温度下，可在连杆小头衬套和活塞销座孔内缓慢转动。","opts":[],"a":"√","e":"全浮式销在衬套和销座中都能转动，使销表面磨损均匀，是汽油机常用形式。"},{"id":739,"oid":"B4-018","type":"judge","module":"汽车发动机维修","q":"半浮式活塞销是将活塞销固定在连杆小头孔中，只在活塞销座孔内转动。","opts":[],"a":"√","e":"半浮式销与连杆小头紧配固定，只在销座孔转动，多用于连杆小头较小的发动机。"},{"id":740,"oid":"B4-019","type":"judge","module":"汽车发动机维修","q":"连杆大头是分开的，分开部分称为连杆盖，两者用连杆螺栓连接成一体。","opts":[],"a":"√","e":"连杆大头剖开以便装到曲轴连杆轴颈上，连杆盖与连杆配对用螺栓紧固。"},{"id":741,"oid":"B4-020","type":"judge","module":"汽车发动机维修","q":"连杆螺栓是重要紧固件，拆装时应按规定力矩分次均匀拧紧并检查锁止装置。","opts":[],"a":"√","e":"连杆螺栓受交变载荷，力矩不足会松动、过大会拉伸断裂，故必须按规范拧紧并锁止。"},{"id":742,"oid":"B4-021","type":"judge","module":"汽车发动机维修","q":"连杆轴瓦装在连杆大头孔和连杆盖内，起减磨和支承连杆轴颈的作用。","opts":[],"a":"√","e":"轴瓦衬在大头孔内形成滑动轴承，减磨并支承连杆轴颈。"},{"id":743,"oid":"B4-022","type":"judge","module":"汽车发动机维修","q":"为保证连杆大头与连杆盖不装错，两者打有配对记号，装配时记号必须在同一侧。","opts":[],"a":"√","e":"连杆盖与大头是配对镗削加工的，互换会破坏圆度和配合，故记号须同侧。"},{"id":744,"oid":"B4-023","type":"judge","module":"汽车发动机维修","q":"连杆在工作中只受拉力，不受压力和弯曲作用。","opts":[],"a":"×","e":"说法错误。连杆在做功行程受压力、在惯性力作用下受拉力，且因受压杆身会受弯曲，属交变载荷。"},{"id":745,"oid":"B4-024","type":"judge","module":"汽车发动机维修","q":"活塞销座处金属多、受热膨胀大，为此常在裙部开有膨胀槽（T形或U形槽）。","opts":[],"a":"√","e":"膨胀槽增加裙部弹性，补偿销座方向热膨胀，防止活塞在销座方向卡死。"},{"id":746,"oid":"B4-025","type":"judge","module":"汽车发动机维修","q":"活塞头部第一道环槽以上开有绝热槽（恒温槽），目的是减少头部热量向裙部传递。","opts":[],"a":"√","e":"绝热槽切断部分传热通道，使裙部少受热、减小裙部膨胀，保持正常配合间隙。"},{"id":747,"oid":"B4-026","type":"judge","module":"汽车发动机维修","q":"更换活塞环时应同时检查气缸壁磨损，若气缸磨损超限应先镗缸或换缸套再换环。","opts":[],"a":"√","e":"缸壁磨损起棱、失圆时新环不能很好贴合，换环会很快窜油，须先修气缸。"},{"id":748,"oid":"B4-027","type":"judge","module":"汽车发动机维修","q":"测量活塞环端隙时，应将活塞环平推入气缸下部未磨损处，再用塞尺测量开口间隙。","opts":[],"a":"√","e":"在缸筒未磨损的下部测量才反映环与缸壁的真实端隙，推环应用活塞头部推平。"},{"id":749,"oid":"B4-028","type":"judge","module":"汽车发动机维修","q":"安装活塞连杆组时，活塞顶部的朝前记号应朝向发动机前端。","opts":[],"a":"√","e":"朝前记号对准发动机前端，保证燃烧室形状、避阀坑和连杆方向与原设计一致。"},{"id":750,"oid":"B4-029","type":"judge","module":"汽车发动机维修","q":"活塞环的泵油作用会使缸壁机油经环与环槽间隙被泵入燃烧室，导致机油消耗增大。","opts":[],"a":"√","e":"气环在往复运动中像泵一样把机油向上压入燃烧室，是窜机油的重要原因之一。"},{"id":751,"oid":"B4-030","type":"judge","module":"汽车发动机维修","q":"铝合金活塞膨胀系数比铸铁大，因此活塞与气缸壁之间必须留有适当的热态间隙。","opts":[],"a":"√","e":"铝膨胀系数大，不留间隙热车会胀死拉缸；间隙过小抱缸，过大敲缸窜气。"},{"id":752,"oid":"B4-031","type":"judge","module":"汽车发动机维修","q":"活塞裙部制成上小下大的锥形，是为补偿活塞沿高度方向受热膨胀不均匀。","opts":[],"a":"√","e":"活塞上部温度高、膨胀大，下部温度低，故做成上小下大锥形，热态后趋于正圆柱形。"},{"id":753,"oid":"B4-032","type":"judge","module":"汽车发动机维修","q":"连杆杆身通常做成工字形断面，以在保证刚度强度的前提下减轻质量。","opts":[],"a":"√","e":"工字形断面抗弯、抗扭能力强且省材料，使连杆质量小、往复惯性力小。"},{"id":754,"oid":"B4-033","type":"judge","module":"汽车发动机维修","q":"为使发动机运转平稳，同一台发动机各连杆的质量应尽量一致，并按大小头分别分组称重。","opts":[],"a":"√","e":"各连杆质量差过大会引起运转不平衡、振动，故按质量分组选配。"},{"id":755,"oid":"B4-034","type":"judge","module":"汽车发动机维修","q":"拆卸活塞连杆组前，应先检查缸口是否有台阶，必要时用缸口铰刀去除，以免拉坏活塞环。","opts":[],"a":"√","e":"缸口磨损形成台阶，抽出连杆时活塞环会被台阶挂断，故先铰掉台阶。"},{"id":756,"oid":"B4-035","type":"judge","module":"汽车发动机维修","q":"连杆弯扭曲校正后，应进行时效处理，防止校正产生的内应力使连杆再次变形。","opts":[],"a":"√","e":"冷压校正产生内应力，时效（或加温）处理消除应力，稳定形状。"},{"id":757,"oid":"B4-036","type":"judge","module":"汽车发动机维修","q":"活塞环装入环槽后，应能在槽内自由转动，无卡滞现象。","opts":[],"a":"√","e":"环在槽中应活动自如，卡滞说明侧隙过小或环槽积炭，会导致密封失效。"},{"id":758,"oid":"B4-037","type":"judge","module":"汽车发动机维修","q":"桶面环与气缸壁呈圆弧接触，磨合好、密封性好，适合高速高负荷发动机。","opts":[],"a":"√","e":"桶面环上下行都形成楔形油膜，润滑好、磨合快，广泛用于高速柴油机。"},{"id":759,"oid":"B4-038","type":"judge","module":"汽车发动机维修","q":"活塞顶部形状中，平顶结构简单、受热面积小，应用最广。","opts":[],"a":"√","e":"平顶活塞加工简单、吸热少，汽油机多用平顶或微凸顶。"},{"id":760,"oid":"B4-039","type":"judge","module":"汽车发动机维修","q":"柴油机活塞顶部多采用凹顶（ω形或球形），以形成燃烧室并促进混合气形成。","opts":[],"a":"√","e":"柴油靠压缩着火，活塞顶凹坑与缸盖形状构成燃烧室，组织空气涡流促进混合气形成。"},{"id":761,"oid":"B4-040","type":"judge","module":"汽车发动机维修","q":"活塞销一般用低碳钢或低碳合金钢制造，表面经渗碳淬火提高耐磨性。","opts":[],"a":"√","e":"活塞销表面硬而耐磨、内部韧而抗冲击，靠渗碳淬火实现外硬内韧。"},{"id":762,"oid":"B4-041","type":"judge","module":"汽车发动机维修","q":"全浮式活塞销销座两端装有卡环（挡圈），防止活塞销轴向窜动刮伤气缸壁。","opts":[],"a":"√","e":"全浮销工作时会轴向游动，两端卡环限位，防止销端刮伤缸壁。"},{"id":763,"oid":"B4-042","type":"judge","module":"汽车发动机维修","q":"测量活塞裙部直径时，应在垂直于活塞销轴线方向、裙部规定位置测量。","opts":[],"a":"√","e":"裙部椭圆长轴垂直销孔，故在垂直销孔方向测量才是裙部真实直径。"},{"id":764,"oid":"B4-043","type":"judge","module":"汽车发动机维修","q":"活塞与气缸配合间隙过小，发动机热车时易出现活塞拉缸、卡死（抱缸）现象。","opts":[],"a":"√","e":"间隙过小热膨胀后活塞与缸壁咬死，拉伤表面甚至抱死。"},{"id":765,"oid":"B4-044","type":"judge","module":"汽车发动机维修","q":"连杆大头剖分有平切口和斜切口两种，斜切口常用于强化柴油机以减小大头径向尺寸。","opts":[],"a":"√","e":"斜切口使大头能从气缸上端抽出，减小连杆大头径向尺寸，便于拆卸。"},{"id":766,"oid":"B4-045","type":"judge","module":"汽车发动机维修","q":"斜切口连杆大头结合面靠锯齿（或定位套筒）定位，以承受工作中的横向剪切力。","opts":[],"a":"√","e":"斜切口结合面在侧向力作用下有滑移趋势，靠锯齿或套筒定位抗剪切。"},{"id":767,"oid":"B4-046","type":"judge","module":"汽车发动机维修","q":"安装活塞环应使用活塞环卡钳（扩张钳），不得用手随意掰开，以防环变形折断。","opts":[],"a":"√","e":"用专用卡钳均匀扩张，手掰易使环过度张开产生塑性变形或折断。"},{"id":768,"oid":"B4-047","type":"judge","module":"汽车发动机维修","q":"活塞环背隙是指环装入环槽后，环背面与环槽底之间的径向间隙。","opts":[],"a":"√","e":"背隙使环能沉入环槽，为环的径向退让和积炭容纳留余地。"},{"id":769,"oid":"B4-048","type":"judge","module":"汽车发动机维修","q":"拆装活塞连杆组时，应按气缸顺序摆放零件，并注意各缸配对记号，不得混装。","opts":[],"a":"√","e":"各缸活塞、连杆、轴瓦都是配对选配的，混装会破坏配合和平衡。"},{"id":770,"oid":"B4-049","type":"judge","module":"汽车发动机维修","q":"活塞环端隙过小，发动机工作时环受热膨胀会被顶死、折断；过大则漏气窜油。","opts":[],"a":"√","e":"端隙给环热膨胀留余地，过小顶死折断，过大密封不良漏气窜油。"},{"id":771,"oid":"B4-050","type":"judge","module":"汽车发动机维修","q":"连杆小头衬套压入后，需用铰刀或珩磨加工至规定尺寸，并测量与活塞销的配合间隙。","opts":[],"a":"√","e":"衬套压入后内孔变形，须铰削至标准尺寸，保证与活塞销有正确间隙。"},{"id":772,"oid":"B4-051","type":"judge","module":"汽车发动机维修","q":"检查连杆小头衬套磨损时，常用内径百分表测衬套内径，与活塞销外径比较求间隙。","opts":[],"a":"√","e":"衬套磨损后内径增大、间隙变大，用内径百分表与千分尺配合测量判断。"},{"id":773,"oid":"B4-052","type":"judge","module":"汽车发动机维修","q":"活塞工作时承受周期性气体压力和惯性力，是发动机中工作条件最苛刻的零件之一。","opts":[],"a":"√","e":"活塞高温、高速往复，受交变气体力和惯性力，润滑条件差，工作条件苛刻。"},{"id":774,"oid":"B4-053","type":"judge","module":"汽车发动机维修","q":"采用喷油嘴向活塞内腔喷机油冷却（油冷活塞），目的是降低活塞顶温度，防止过热烧顶。","opts":[],"a":"√","e":"高强化柴油机活塞热负荷大，喷机油到活塞顶内腔带走热量，防止活塞顶过热烧损。"},{"id":775,"oid":"B4-054","type":"judge","module":"汽车发动机维修","q":"更换活塞时，同一台发动机应选用同一厂牌、同一分组尺寸的活塞，保证质量和间隙一致。","opts":[],"a":"√","e":"活塞按尺寸分组，同组活塞质量、尺寸一致，保证各缸配合和平衡。"},{"id":776,"oid":"B4-055","type":"judge","module":"汽车发动机维修","q":"活塞裙部镀锡（或石墨）处理的目的是改善磨合性能、减少拉缸倾向。","opts":[],"a":"√","e":"镀层改善初期磨合，防止拉缸，提高裙部表面跑合性。"},{"id":777,"oid":"B4-056","type":"judge","module":"汽车发动机维修","q":"发动机机油消耗大、排气管冒蓝烟，拆检发现气环开口未错开且端隙过大，故障为活塞环密封不良窜机油。","opts":[],"a":"√","e":"环口未错开形成漏气通道，端隙过大密封不良，机油上窜燃烧室，属活塞环装配与磨损综合故障。"},{"id":778,"oid":"B4-057","type":"judge","module":"汽车发动机维修","q":"活塞环端隙过小是造成活塞环折断的常见原因之一。","opts":[],"a":"√","e":"环受热膨胀无余地，开口处顶死产生内应力导致环折断，是环折断的常见原因。"},{"id":779,"oid":"B4-058","type":"single","module":"汽车发动机维修","q":"活塞由顶部、头部和（　）三部分组成。","opts":[{"k":"A","t":"销座"},{"k":"B","t":"裙部"},{"k":"C","t":"底部"},{"k":"D","t":"燃烧室"}],"a":"B","e":"活塞分顶部、头部（环带部）和裙部三部分；销座在裙部中部，不是独立的第三大部分。"},{"id":780,"oid":"B4-059","type":"single","module":"汽车发动机维修","q":"现代汽车发动机活塞广泛采用的材料是（　）。","opts":[{"k":"A","t":"灰铸铁"},{"k":"B","t":"铝合金"},{"k":"C","t":"铜合金"},{"k":"D","t":"铸钢"}],"a":"B","e":"铝合金活塞质量轻、导热好，现代发动机广泛采用；铸铁活塞质量大已少用。"},{"id":781,"oid":"B4-060","type":"single","module":"汽车发动机维修","q":"活塞顶部形状中，结构最简单、受热面积最小、应用最广的是（　）。","opts":[{"k":"A","t":"平顶"},{"k":"B","t":"凸顶"},{"k":"C","t":"凹顶"},{"k":"D","t":"楔形顶"}],"a":"A","e":"平顶结构简单、吸热少，汽油机应用最广；凹顶多用于柴油机形成燃烧室。"},{"id":782,"oid":"B4-061","type":"single","module":"汽车发动机维修","q":"为使裙部受热后保持正确圆柱形，常将裙部横断面制成椭圆形，其长轴方向为（　）。","opts":[{"k":"A","t":"沿活塞销轴线方向"},{"k":"B","t":"垂直于活塞销轴线方向"},{"k":"C","t":"与销孔成45°"},{"k":"D","t":"任意方向"}],"a":"B","e":"销座方向金属多膨胀大，椭圆长轴垂直销孔，可补偿销孔方向膨胀，使热态接近正圆。"},{"id":783,"oid":"B4-062","type":"single","module":"汽车发动机维修","q":"活塞裙部制成上小下大的锥形，主要目的是（　）。","opts":[{"k":"A","t":"减轻质量"},{"k":"B","t":"补偿沿高度方向受热膨胀不均匀"},{"k":"C","t":"增大强度"},{"k":"D","t":"减小摩擦"}],"a":"B","e":"活塞上部温度高膨胀大，做成上小下大锥形，热态后裙部趋于正圆柱，保持正确间隙。"},{"id":784,"oid":"B4-063","type":"single","module":"汽车发动机维修","q":"活塞销座通常位于活塞的（　）。","opts":[{"k":"A","t":"顶部"},{"k":"B","t":"头部"},{"k":"C","t":"裙部中部"},{"k":"D","t":"底部"}],"a":"C","e":"销座在裙部中部，用于安装活塞销连接连杆小头。"},{"id":785,"oid":"B4-064","type":"single","module":"汽车发动机维修","q":"铝合金活塞膨胀系数大，为补偿裙部热变形，常在裙部开有（　）。","opts":[{"k":"A","t":"油孔"},{"k":"B","t":"膨胀槽（T形或U形槽）"},{"k":"C","t":"减重孔"},{"k":"D","t":"散热片"}],"a":"B","e":"膨胀槽切开裙部增加弹性，补偿销座方向热膨胀，防止卡死。"},{"id":786,"oid":"B4-065","type":"single","module":"汽车发动机维修","q":"活塞头部（环带部）的主要作用是（　）。","opts":[{"k":"A","t":"安装活塞环、密封气缸并导热"},{"k":"B","t":"导向"},{"k":"C","t":"承受侧压力"},{"k":"D","t":"连接活塞销"}],"a":"A","e":"头部开环槽装活塞环，起密封和导热作用；导向、侧压力由裙部承担。"},{"id":787,"oid":"B4-066","type":"single","module":"汽车发动机维修","q":"活塞第一道气环槽温度最高，为改善其工作条件，第一道环槽常采用（　）。","opts":[{"k":"A","t":"耐热铸铁镶圈"},{"k":"B","t":"镀铬处理"},{"k":"C","t":"镀铜处理"},{"k":"D","t":"喷钼处理"}],"a":"A","e":"高强化柴油机第一道环槽嵌耐热铸铁（镍-石墨）镶圈，提高耐磨性和耐热性。"},{"id":788,"oid":"B4-067","type":"single","module":"汽车发动机维修","q":"活塞裙部的主要作用是（　）。","opts":[{"k":"A","t":"密封气缸"},{"k":"B","t": 质量可减小惯性力。"},{"id":797,"oid":"B4-076","type":"single","module":"汽车发动机维修","q":"高速发动机为减小往复惯性力，在保证强度刚度前提下应（　）。","opts":[{"k":"A","t":"增大活塞质量"},{"k":"B","t":"尽量减轻活塞质量"},{"k":"C","t":"改用铸铁活塞"},{"k":"D","t":"增大活塞直径"}],"a":"B","e":"惯性力与质量成正比，减轻活塞质量可减小惯性力和振动。"},{"id":798,"oid":"B4-077","type":"single","module":"汽车发动机维修","q":"活塞顶面上的凹坑除形成燃烧室外，还可以（　）。","opts":[{"k":"A","t":"避免气门开启时与活塞相撞（避阀坑）"},{"k":"B","t":"增大压缩比"},{"k":"C","t":"减轻质量"},{"k":"D","t":"便于加工"}],"a":"A","e":"避阀坑让开启的气门不与活塞顶相碰，是顶置气门发动机活塞顶的常见结构。"},{"id":799,"oid":"B4-078","type":"single","module":"汽车发动机维修","q":"测量活塞裙部与气缸壁配合间隙时，所用的量具是（　）。","opts":[{"k":"A","t":"游标卡尺"},{"k":"B","t":"外径千分尺和量缸表"},{"k":"C","t":"塞尺"},{"k":"D","t":"百分表"}],"a":"B","e":"千分尺测活塞裙部外径，量缸表测气缸内径，两者之差即为配合间隙。"},{"id":800,"oid":"B4-079","type":"single","module":"汽车发动机维修","q":"活塞工作时第一道环槽处温度可达（　）。","opts":[{"k":"A","t":"约100℃"},{"k":"B","t":"200~300℃"},{"k":"C","t":"500℃以上"},{"k":"D","t":"常温"}],"a":"B","e":"第一道环槽离燃烧室最近，温度可达200~300℃，故环槽易磨损。"},{"id":801,"oid":"B4-080","type":"single","module":"汽车发动机维修","q":"为减小活塞销座的膨胀变形，有些活塞在销座处镶有（　）。","opts":[{"k":"A","t":"热膨胀系数小的恒范钢片"},{"k":"B","t":"铜套"},{"k":"C","t":"铝套"},{"k":"D","t":"铸铁圈"}],"a":"A","e":"镶入膨胀系数小的恒范钢片拉住销座，限制销座方向膨胀，减小活塞椭圆变形。"},{"id":802,"oid":"B4-081","type":"single","module":"汽车发动机维修","q":"活塞与气缸壁之间间隙过小会导致（　）。","opts":[{"k":"A","t":"敲缸"},{"k":"B","t":"拉缸、卡死（抱缸）"},{"k":"C","t":"漏气"},{"k":"D","t":"窜机油"}],"a":"B","e":"间隙过小热膨胀后活塞与缸壁咬死，拉伤表面甚至抱缸。"},{"id":803,"oid":"B4-082","type":"single","module":"汽车发动机维修","q":"活塞裙部镀铬或镀锡的主要目的是（　）。","opts":[{"k":"A","t":"提高硬度"},{"k":"B","t":"改善磨合性、减少拉缸"},{"k":"C","t":"增大摩擦"},{"k":"D","t":"防锈美观"}],"a":"B","e":"镀层改善初期磨合、防止拉缸，提高裙部表面跑合性能。"},{"id":804,"oid":"B4-083","type":"single","module":"汽车发动机维修","q":"气环实现密封主要依靠（　）。","opts":[{"k":"A","t":"环的弹力和燃气压力"},{"k":"B","t":"机油粘度"},{"k":"C","t":"活塞惯性"},{"k":"D","t":"离心力"}],"a":"A","e":"气环靠自身弹力贴缸壁，再靠燃气压力把环往下、向外压，双重作用密封。"},{"id":805,"oid":"B4-084","type":"single","module":"汽车发动机维修","q":"刮油效果好、应用最广的油环结构是（　）。","opts":[{"k":"A","t":"整体式油环"},{"k const TYPE_META = {judge:"判断题", single:"单选题", multi:"多选题", short:"简答题", case:"案例分析题"};
const TYPE_COUNTS = QUESTIONS.reduce((m,q)=>{m[q.type]=(m[q.type]||0)+1;return m;},{});
const MOD_COUNTS = QUESTIONS.reduce((m,q)=>{m[q.module]=(m[q.module]||0)+1;return m;},{});
const MODULES = ["汽车概论与机械基础","汽车发动机维修","汽车底盘维修","汽车电子与电器维修","汽车维修工操作知识"];
const STORE_KEY = "qc_progress_v1";

/* ---------- 进度持久化 ---------- */
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
let progress = loadProgress();
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} }

function stats(){
  const ids = Object.keys(progress).map(Number);
  let okCount = 0, totalTry = 0;
  ids.forEach(id => { const p = progress[id]; okCount += p.c || 0; totalTry += p.n || 0; });
  const rate = totalTry ? Math.round(okCount / totalTry * 100) : 0;
  const wrong = ids.filter(id => progress[id].last === false).length;
  return { answered: ids.length, totalTry, rate, wrong };
}

/* ---------- 会话 ---------- */
let session = null; // {mode, ids, idx, answers:{id:...}, verdicts:{id:true/false}}

/* ---------- 工具 ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sortedKey(sel){ return (Array.isArray(sel)?sel:[]).slice().sort().join(""); }

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2000);
}

/* ---------- 路由 ---------- */
function route(){
  const h = location.hash || "#/home";
  const nav = h.startsWith("#/quiz") ? "quiz" : h.startsWith("#/wrong") ? "wrong" : h.startsWith("#/fav") ? "fav" : "home";
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active", a.dataset.nav===nav));
  if(h.startsWith("#/quiz")) renderQuiz();
  else if(h.startsWith("#/wrong")) renderWrong();
  else if(h.startsWith("#/fav")) renderFav();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
