燃烧室容积Vc。题干正确,判断为√。\n【易错】“Vc=上止点时活塞顶上方空间”。结合360、364题:同一个定义换三种说法考,抓住“上止点时、活塞顶上”关键词即可。"}, {"id": 372, "oid": "A1-436", "type": "judge", "module": "汽车概论与机械基础", "q": "压缩比是指气缸总容积与燃烧室容积的比值。", "opts": [], "a": "√", "e": "【考点】压缩比定义。\n【解析】压缩比ε=Va/Vc=(Vs+Vc)/Vc,反映气体被压缩的程度。题干正确,判断为√。\n【易错】“ε=总/燃”。398题说“工作容积/燃烧室容积”就是错的(漏了Vc)。公式要写全:ε=(Vs+Vc)/Vc。"}, {"id": 373, "oid": "A1-437", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞在气缸内从一个止点运动到另一个止点（完成一个行程）时，曲轴转过180°。", "opts": [], "a": "√", "e": "【考点】行程与曲轴转角。\n【解析】一个活塞行程=曲轴转180°(半圈);四个行程=720°(两圈)。题干正确,判断为√。\n【易错】“一行程=180°”。配合374、379题:四冲程循环=720°。判断题常把这组角度和圈数混着考。"}, {"id": 374, "oid": "A1-438", "type": "judge", "module": "汽车概论与机械基础", "q": "一台四冲程四缸发动机，每完成一个工作循环曲轴都要转两圈。", "opts": [], "a": "√", "e": "【考点】四冲程循环与曲轴圈数。\n【解析】四冲程发动机无论几缸,一个工作循环都含进气、压缩、做功、排气四行程,曲轴转两圈(720°)。题干正确,判断为√。\n【易错】“循环=720°=两圈”与缸数无关。别被“四缸”带偏——缸数只影响各缸相位错开,不影响单缸循环转角。"}, {"id": 375, "oid": "A1-439", "type": "judge", "module": "汽车概论与机械基础", "q": "按所用燃料不同，发动机可分为汽油机、柴油机和气体燃料发动机等。", "opts": [], "a": "√", "e": "【考点】发动机按燃料分类。\n【解析】按燃料分:汽油机、柴油机、气体燃料发动机(天然气CNG/LNG、液化石油气LPG)。题干正确,判断为√。\n【易错】“汽油/柴油/气体燃料”三类。与272题(汽车按燃料分类)对应:汽车分汽油车柴油车气体车,发动机分汽油机柴油机气体机。"}, {"id": 376, "oid": "A1-440", "type": "judge", "module": "汽车概论与机械基础", "q": "按冷却方式不同，发动机可分为水冷式和风冷式两大类。", "opts": [], "a": "√", "e": "【考点】发动机按冷却方式分类。\n【解析】水冷靠冷却液在水套循环散热,风冷靠空气吹散热片散热。题干正确,判断为√。\n【易错】“水冷+风冷”两类。与254、309题重复。现代汽车几乎全水冷,风冷见于摩托车和部分老车型。"}, {"id": 377, "oid": "A1-441", "type": "judge", "module": "汽车概论与机械基础", "q": "按气缸排列方式不同，发动机可分为直列式、V型和水平对置式等。", "opts": [], "a": "√", "e": "【考点】发动机按气缸排列分类。\n【解析】直列式(单列)、V型(两列成夹角)、水平对置式(两列成180°)。题干正确,判断为√。\n【易错】“直列、V型、水平对置”三类。V6/V8即V型;保时捷、斯巴鲁用水平对置。排列方式决定发动机长度和高度。"}, {"id": 378, "oid": "A1-442", "type": "judge", "module": "汽车概论与机械基础", "q": "二冲程发动机曲轴每转一圈（360°）即完成一个工作循环。", "opts": [], "a": "√", "e": "【考点】二冲程循环特点。\n【解析】二冲程发动机曲轴转一圈(360°)完成一个工作循环,比四冲程(720°)少一半;换气靠扫气孔完成。题干正确,判断为√。\n【易错】“二冲程=360°一个循环”。同排量二冲程功率密度高但换气质量差、油耗高,现在乘用车已淘汰,摩托车/割草机等还有。"}, {"id": 379, "oid": "A1-443", "type": "judge", "module": "汽车概论与机械基础", "q": "四冲程发动机每完成一个工作循环，曲轴转过720°。", "opts": [], "a": "√", "e": "【考点】四冲程循环转角。\n【解析】四行程各180°,共720°=曲轴两圈完成一个工作循环。题干正确,判断为√。\n【易错】“四冲程=720°”。与373、374题同组:一行程180°、一循环720°。圆周角与圈数换算:720°=2圈。"}, {"id": 380, "oid": "A1-444", "type": "judge", "module": "汽车概论与机械基础", "q": "增压发动机是指利用增压器将空气预先压缩后再充入气缸的发动机。", "opts": [], "a": "√", "e": "【考点】增压发动机定义。\n【解析】增压器(涡轮/机械)把空气预先压缩,提高进气密度后充入气缸,可多喷油提高功率转矩。题干正确,判断为√。\n【易错】“增压=预压缩空气”。对比自然吸气靠活塞下行吸真空。增压后进气密度↑→喷油↑→功率转矩↑(392题)。"}, {"id": 381, "oid": "A1-445", "type": "judge", "module": "汽车概论与机械基础", "q": "一般压缩比高的发动机热效率较高，但汽油机压缩比过高容易发生爆燃。", "opts": [], "a": "√", "e": "【考点】压缩比与热效率、爆燃。\n【解析】压缩比高→热效率高(省油有力);但汽油机压缩比过高,末端混合气会自行爆燃(爆震),损坏机件,所以汽油机压缩比受限。题干正确,判断为√。\n【易错】“高压缩比=高效率但易爆燃”。爆燃是汽油机特有的限制因素。柴油机靠压燃不怕爆燃(无火花),所以能上高压缩比。"}, {"id": 382, "oid": "A1-446", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机的气缸工作容积又称为单缸排量。", "opts": [], "a": "√", "e": "【考点】单缸工作容积别称。\n【解析】气缸工作容积Vs=单缸排量,乘以缸数就是发动机总排量。题干正确,判断为√。\n【易错】“Vs=单缸排量”。注意“单缸排量”≠“发动机排量”(那是总和)。术语辨析题。"}, {"id": 383, "oid": "A1-447", "type": "judge", "module": "汽车概论与机械基础", "q": "已知气缸直径和活塞行程，就可以计算出单缸工作容积。", "opts": [], "a": "√", "e": "【考点】单缸工作容积计算。\n【解析】Vs=πD²S/4(D=缸径,S=行程):知道缸径和行程即可算出单缸容积。题干正确,判断为√。\n【易错】“公式Vs=πD²S/4”。这是圆柱体体积公式在发动机上的应用。会算:如D=80mm=0.8dm,S=90mm=0.9dm,Vs≈0.452L。"}, {"id": 384, "oid": "A1-448", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞行程等于曲柄半径的长度。", "opts": [], "a": "×", "e": "【考点】行程与曲柄半径(反向)。\n【解析】S=2R,行程是曲柄半径的两倍,不是等于。题干说“等于曲柄半径”,错误,判断为×。\n【易错】“S=2R”。与359题同考点反向考。曲柄半径=行程一半。单位:行程和半径都是mm。"}, {"id": 385, "oid": "A1-449", "type": "judge", "module": "汽车概论与机械基础", "q": "压缩比ε=10时，燃烧室容积约占气缸总容积的十分之一。", "opts": [], "a": "√", "e": "【考点】压缩比与容积占比。\n【解析】ε=Va/Vc=10→Vc=Va/10,燃烧室容积占总容积的1/10。题干正确,判断为√。\n【易错】“ε=10→Vc=1/10 Va”。数学推导:ε=N,则Vc=Va/N。与362题(压缩比大Vc小)配套理解。"}, {"id": 386, "oid": "A1-450", "type": "judge", "module": "汽车概论与机械基础", "q": "风冷式发动机依靠空气直接吹拂气缸体、气缸盖外表面的散热片散热。", "opts": [], "a": "√", "e": "【考点】风冷发动机散热原理。\n【解析】风冷发动机缸体缸盖铸散热片增大散热面积,由风扇或行驶气流直接吹拂冷却。题干正确,判断为√。\n【易错】“风冷=散热片+空气直吹”。对比水冷:水套+冷却液循环。风冷无水泵散热器,结构简单但散热不均噪声大。"}, {"id": 387, "oid": "A1-451", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机型号中的数字符号通常表示气缸数等结构参数。", "opts": [], "a": "√", "e": "【考点】发动机型号的含义。\n【解析】国产发动机型号首部由缸数、缸径等结构参数组成,如6100=6缸、缸径100mm。题干正确,判断为√。\n【易错】“型号数字=缸数+缸径”。6100Q=六缸100mm缸径(Q表示汽车用)。型号识读是基本功。"}, {"id": 388, "oid": "A1-452", "type": "judge", "module": "汽车概论与机械基础", "q": "上止点与下止点之间的距离称为活塞行程（冲程）。", "opts": [], "a": "√", "e": "【考点】行程(冲程)定义。\n【解析】上止点与下止点之间的距离=活塞行程(冲程)。题干正确,判断为√。\n【易错】“行程=上下止点距离”。与408题(单选)同考点。行程/冲程是同一概念两种叫法。"}, {"id": 389, "oid": "A1-453", "type": "judge", "module": "汽车概论与机械基础", "q": "同一台发动机，气缸总容积减去燃烧室容积等于气缸工作容积。", "opts": [], "a": "√", "e": "【考点】容积公式变形。\n【解析】由Va=Vs+Vc移项得Vs=Va−Vc,总容积减燃烧室容积=工作容积。题干正确,判断为√。\n【易错】“Vs=Va−Vc”。公式变形的逆向考法。三容积关系滚瓜烂熟:总=工+燃。"}, {"id": 390, "oid": "A1-454", "type": "judge", "module": "汽车概论与机械基础", "q": "汽油机的压缩比一般约为8～11。", "opts": [], "a": "√", "e": "【考点】汽油机压缩比范围。\n【解析】现代汽油机压缩比多在8～11,高压缩比机型更高,但受爆燃限制。题干正确,判断为√。\n【易错】“汽油8-11”。与366、367题配套记忆:汽油8-11、柴油15-22。数字是考点。"}, {"id": 391, "oid": "A1-455", "type": "judge", "module": "汽车概论与机械基础", "q": "柴油机的压缩比一般约为6～8。", "opts": [], "a": "×", "e": "【考点】柴油机压缩比范围(反向)。\n【解析】柴油机压缩比约15～22;6～8太低,压缩终温不足以使柴油自燃。题干说6～8,错误,判断为×。\n【易错】“柴油15-22不是6-8”。6-8接近汽油机低值,干扰设计。压燃需要高压缩比,数值记牢。"}, {"id": 392, "oid": "A1-456", "type": "judge", "module": "汽车概论与机械基础", "q": "增压可以提高进气密度，从而提高发动机的功率和转矩。", "opts": [], "a": "√", "e": "【考点】增压提高功率的原理。\n【解析】增压器压缩空气→进气密度增大→充入更多空气→可多喷油→功率转矩提升。题干正确,判断为√。\n【易错】“增压=多进气多喷油”。与380题同考点。增压是提高升功率的主要手段,涡轮增压是现代主流。"}, {"id": 393, "oid": "A1-457", "type": "judge", "module": "汽车概论与机械基础", "q": "按进气方式不同，发动机可分为自然吸气式和增压式。", "opts": [], "a": "√", "e": "【考点】发动机按进气方式分类。\n【解析】自然吸气(活塞下行吸真空)vs增压式(增压器压入)。题干正确,判断为√。\n【易错】“自然吸气+增压”两类。NA、Turbo、机械增压。增压再分废气涡轮增压和机械增压。"}, {"id": 394, "oid": "A1-458", "type": "judge", "module": "汽车概论与机械基础", "q": "V型发动机左右两列气缸呈V形排列，相比直列发动机机体更短、结构更紧凑。", "opts": [], "a": "√", "e": "【考点】V型发动机特点。\n【解析】V型两列气缸成夹角布置,缩短机体长度、降低高度、结构紧凑,多用于大排量多缸机。题干正确,判断为√。\n【易错】“V型=短而紧凑”。对比直列:直列长、V型短、水平对置矮。V6比直6短,便于横置前驱。"}, {"id": 395, "oid": "A1-459", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞从下止点运动到上止点时，曲轴转过180°。", "opts": [], "a": "√", "e": "【考点】行程与转角(方向无关)。\n【解析】无论活塞上行还是下行,一个行程都对应曲轴转角180°。题干正确,判断为√。\n【易错】“180°与方向无关”。与373题同考点。别以为上行下行角度不同,曲柄对称运动都是半圈。"}, {"id": 396, "oid": "A1-460", "type": "judge", "module": "汽车概论与机械基础", "q": "在其他条件相同时，增大发动机排量一般可提高输出功率和转矩。", "opts": [], "a": "√", "e": "【考点】排量与功率关系。\n【解析】排量大→每循环可燃混合气多→做功能力强→功率转矩更高(其他条件相同时)。题干正确,判断为√。\n【易错】“排量大=有力”。这是“排量为王”的常识基础。但同排量下增压、技术差异也影响功率,题干限定“其他条件相同”。"}, {"id": 397, "oid": "A1-461", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机常用符号中，燃烧室容积用Vc表示，工作容积用Vs表示，总容积用Va表示。", "opts": [], "a": "√", "e": "【考点】容积符号惯例。\n【解析】行业符号:Vc=燃烧室容积、Vs=气缸工作容积、Va=气缸总容积、ε=压缩比、Vh=排量。题干正确,判断为√。\n【易错】“Vc/Vs/Va三符号”。与414题配套。Vh是排量(总工作容积)别与Va(单缸总容积)混。"}, {"id": 398, "oid": "A1-462", "type": "judge", "module": "汽车概论与机械基础", "q": "压缩比是气缸工作容积与燃烧室容积之比。", "opts": [], "a": "×", "e": "【考点】压缩比公式(反向)。\n【解析】压缩比=总容积Va/燃烧室容积Vc=(Vs+Vc)/Vc,不是“工作容积/燃烧室容积”。题干漏了+Vc,错误,判断为×。\n【易错】“ε=(Vs+Vc)/Vc≠Vs/Vc”。这是最常见的公式陷阱。若ε=Vs/Vc,结果会偏小很多。"}, {"id": 399, "oid": "A1-463", "type": "judge", "module": "汽车概论与机械基础", "q": "水冷发动机利用冷却液在气缸体和气缸盖的水套中循环流动带走热量。", "opts": [], "a": "√", "e": "【考点】水冷发动机散热原理。\n【解析】水泵驱动冷却液在缸体缸盖水套中循环,把高温零件热量带到散热器散出。题干正确,判断为√。\n【易错】“水冷=水套+循环+散热器”。配合386题风冷对比记忆。水冷均匀可靠,是汽车主流。"}, {"id": 400, "oid": "A1-464", "type": "judge", "module": "汽车概论与机械基础", "q": "柴油机压缩比较高，压缩终了缸内气体温度很高，可使喷入的柴油自行着火。", "opts": [], "a": "√", "e": "【考点】柴油机压燃原理。\n【解析】柴油机压缩比高→压缩终温超过柴油自燃点→喷入柴油自行着火(压燃)。题干正确,判断为√。\n【易错】“压燃=高温自燃”。与307题同考点。自燃点:柴油比汽油低,所以柴油机更容易压燃。"}, {"id": 401, "oid": "A1-465", "type": "judge", "module": "汽车概论与机械基础", "q": "与四冲程发动机相比，二冲程发动机结构简单、体积小、功率密度高。", "opts": [], "a": "√", "e": "【考点】二冲程发动机特点。\n【解析】二冲程省专门进排气行程,结构简单、体积小、同排量功率密度高,但换气质量差、油耗排放高。题干正确,判断为√。\n【易错】“二冲程=简单高功率密度但费油”。与378题配套。乘用车已淘汰,现用于摩托车、舷外机、割草机。"}, {"id": 402, "oid": "A1-466", "type": "judge", "module": "汽车概论与机械基础", "q": "汽油机压缩比过高时，气缸内容易产生爆燃（爆震）。", "opts": [], "a": "√", "e": "【考点】汽油机爆燃成因。\n【解析】压缩比过高→末端混合气温度压力升高→在火焰到达前自行爆燃,产生爆震(金属敲击声)并损坏机件。题干正确,判断为√。\n【易错】“高压缩比→爆燃”。与381题同考点。防爆燃手段:用高标号汽油(抗爆性好)、降低压缩比、推迟点火。"}, {"id": 403, "oid": "A1-467", "type": "judge", "module": "汽车概论与机械基础", "q": "活塞在两个止点之间往复运动，活塞每走完一个单程即称为一个行程（冲程）。", "opts": [], "a": "√", "e": "【考点】行程(冲程)定义。\n【解析】活塞从一个止点到另一个止点的单程运动=一个行程(冲程)。题干正确,判断为√。\n【易错】“单程=一行程”。与388题同定义。注意“单程”关键词,往返是两个行程。"}, {"id": 404, "oid": "A1-468", "type": "judge", "module": "汽车概论与机械基础", "q": "一台四缸发动机排量为2.0L，则单缸工作容积为0.5L。", "opts": [], "a": "√", "e": "【考点】排量与单缸容积换算。\n【解析】排量=单缸容积×缸数→单缸=排量/缸数=2.0L/4=0.5L。题干正确,判断为√。\n【易错】“除法换算”。与363题反向。会乘会除:四缸2.0L→单缸0.5L;单缸0.5L四缸→2.0L。"}, {"id": 405, "oid": "A1-469", "type": "judge", "module": "汽车概论与机械基础", "q": "按活塞运动方式不同，发动机可分为往复活塞式和旋转活塞式。", "opts": [], "a": "√", "e": "【考点】发动机按活塞运动方式分类。\n【解析】往复活塞式(汽车主流)vs旋转活塞式(转子发动机,三角转子)。题干正确,判断为√。\n【易错】“往复+旋转”两类。转子发动机(汪克尔)是旋转活塞式的代表,曾用于马自达RX系列,现已少见。"}, {"id": 406, "oid": "A1-470", "type": "judge", "module": "汽车概论与机械基础", "q": "气缸总容积Va=Vs+Vc，压缩比ε=Va/Vc，两者关系一致。", "opts": [], "a": "√", "e": "【考点】容积公式与压缩比公式自洽。\n【解析】Va=Vs+Vc,ε=Va/Vc,两公式一致:把Va代入即ε=(Vs+Vc)/Vc。题干正确,判断为√。\n【易错】“两公式配套使用”。公式一致性题:总=工+燃,压缩比=总/燃。数学变形要熟练。"}, {"id": 407, "oid": "A1-471", "type": "single", "module": "汽车概论与机械基础", "q": "活塞顶离曲轴回转中心最近时所处的位置称为（　）。", "opts": [{"k": "A", "t": "上止点"}, {"k": "B", "t": "下止点"}, {"k": "C", "t": "压缩终点"}, {"k": "D", "t": "做功起点"}], "a": "B", "e": "【考点】下止点定义(单选)。\n【解析】下止点=活塞顶离曲轴回转中心最近(气缸最低)位置;上止点离中心最远。故选B。\n【易错】“最近↔下止点”。与358题同考点单选化。压缩终点、做功起点不是止点概念。"}, {"id": 408, "oid": "A1-472", "type": "single", "module": "汽车概论与机械基础", "q": "活塞从一个止点运动到另一个止点所经过的距离称为（　）。", "opts": [{"k": "A", "t": "气缸直径"}, {"k": "B", "t": "活塞行程"}, {"k": "C", "t": "曲柄半径"}, {"k": "D", "t": "燃烧室高度"}], "a": "B", "e": "【考点】行程定义(单选)。\n【解析】上下止点间距离=活塞行程(冲程)S=2R。缸径是直径、曲柄半径是R、燃烧室高度是上止点到缸盖距离。故选B。\n【易错】“行程≠曲柄半径≠缸径”。行程=2R。三个易混量:缸径D、行程S、曲柄半径R。"}, {"id": 409, "oid": "A1-473", "type": "single", "module": "汽车概论与机械基础", "q": "活塞位于上止点时，活塞顶上方的空间容积称为（　）。", "opts": [{"k": "A", "t": "气缸工作容积"}, {"k": "B", "t": "燃烧室容积"}, {"k": "C", "t": "气缸总容积"}, {"k": "D", "t": "发动机排量"}], "a": "B", "e": "【考点】燃烧室容积定义(单选)。\n【解析】上止点时活塞顶上方的最小容积=燃烧室容积Vc;工作容积是扫过的容积。故选B。\n【易错】“上止点上方=Vc”。与360、371题同考点三种题型(判断/单选)都考,定义必须烂熟。"}, {"id": 410, "oid": "A1-474", "type": "single", "module": "汽车概论与机械基础", "q": "多缸发动机各气缸工作容积之和称为（　）。", "opts": [{"k": "A", "t": "燃烧室容积"}, {"k": "B", "t": "气缸总容积"}, {"k": "C", "t": "发动机排量"}, {"k": "D", "t": "工作循环容积"}], "a": "C", "e": "【考点】排量定义(单选)。\n【解析】发动机排量Vh=单缸工作容积Vs×缸数i=各缸工作容积之和。故选C。\n【易错】“Σ各缸Vs=排量”。燃烧室容积、单缸总容积都不是“各缸之和”的概念。术语对位题。"}, {"id": 411, "oid": "A1-475", "type": "single", "module": "汽车概论与机械基础", "q": "气缸总容积与燃烧室容积的比值称为（　）。", "opts": [{"k": "A", "t": "压缩比"}, {"k": "B", "t": "行程比"}, {"k": "C", "t": "缸径比"}, {"k": "D", "t": "充气效率"}], "a": "A", "e": "【考点】压缩比定义(单选)。\n【解析】压缩比ε=总容积Va/燃烧室容积Vc,反映气体压缩程度。故选A。\n【易错】“ε=总/燃”。行程比、缸径比、充气效率都是其他概念。公式对位题。"}, {"id": 412, "oid": "A1-476", "type": "single", "module": "汽车概论与机械基础", "q": "活塞从上止点到下止点所扫过的容积是（　）。", "opts": [{"k": "A", "t": "燃烧室容积"}, {"k": "B", "t": "气缸工作容积"}, {"k": "C", "t": "气缸总容积"}, {"k": "D", "t": "余隙容积"}], "a": "B", "e": "【考点】工作容积定义(单选)。\n【解析】上止点→下止点扫过的容积=工作容积Vs。燃烧室容积是上止点剩余的,总容积是下止点总空间。故选B。\n【易错】“扫过=Vs”。与360、364题同考点。三个“容积”三选一,抓关键词:扫过/剩下/总和。"}, {"id": 413, "oid": "A1-477", "type": "single", "module": "汽车概论与机械基础", "q": "活塞行程S与曲柄半径R的关系是（　）。", "opts": [{"k": "A", "t": "S=R"}, {"k": "B", "t": "S=2R"}, {"k": "C", "t": "S=R/2"}, {"k": "D", "t": "S=πR"}], "a": "B", "e": "【考点】行程与半径关系(单选)。\n【解析】S=2R:曲轴转一周,曲柄销画直径=2R,活塞往复一次。故选B。\n【易错】“S=2R”公式单选。A(S=R)、C(S=R/2)、D(S=πR)都是错误关系。πR是半圆周长,无物理意义。"}, {"id": 414, "oid": "A1-478", "type": "single", "module": "汽车概论与机械基础", "q": "燃烧室容积的惯用符号是（　）。", "opts": [{"k": "A", "t": "Vs"}, {"k": "B", "t": "Va"}, {"k": "C", "t": "Vc"}, {"k": "D", "t": "Vh"}], "a": "C", "e": "【考点】容积符号(单选)。\n【解析】Vc=燃烧室容积、Vs=工作容积、Va=总容积、Vh=排量。故选C。\n【易错】“Vc=燃烧室”。四个符号四选一,与397题配套。Vh是排量别与Va混。"}, {"id": 415, "oid": "A1-479", "type": "single", "module": "汽车概论与机械基础", "q": "发动机排量的常用单位是（　）。", "opts": [{"k": "A", "t": "千克（kg）"}, {"k": "B", "t": "升（L）"}, {"k": "C", "t": "千瓦（kW）"}, {"k": "D", "t": "牛·米（N·m）"}], "a": "B", "e": "【考点】排量单位。\n【解析】排量是容积,单位升(L)或毫升(mL);千克是质量、千瓦是功率、牛·米是转矩。故选B。\n【易错】“L/mL是容积单位”。单位与物理量对应:kg-质量、kW-功率、N·m-转矩。排量不是重量。"}, {"id": 416, "oid": "A1-480", "type": "single", "module": "汽车概论与机械基础", "q": "汽油机的压缩比一般约为（　）。", "opts": [{"k": "A", "t": "4～6"}, {"k": "B", "t": "8～11"}, {"k": "C", "t": "15～22"}, {"k": "D", "t": "25～30"}], "a": "B", "e": "【考点】汽油机压缩比数值。\n【解析】汽油机压缩比一般8～11,受爆燃限制;15～22是柴油机范围。故选B。\n【易错】“汽油8-11”。与390、434题重复。数字题:别把柴油机的15-22安到汽油机上。"}, {"id": 417, "oid": "A1-481", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机的压缩比一般约为（　）。", "opts": [{"k": "A", "t": "4～6"}, {"k": "B", "t": "8～11"}, {"k": "C", "t": "16～22"}, {"k": "D", "t": "25～35"}], "a": "C", "e": "【考点】柴油机压缩比数值。\n【解析】柴油机靠压缩自燃,压缩比约16～22;8～11是汽油机。故选C。\n【易错】“柴油16-22”。与367、391题重复。柴油机范围两写法:15-22或16-22,都在“十几到二十出头”。"}, {"id": 418, "oid": "A1-482", "type": "single", "module": "汽车概论与机械基础", "q": "汽油机压缩比过高时，气缸内最容易发生的不正常燃烧是（　）。", "opts": [{"k": "A", "t": "回火"}, {"k": "B", "t": "爆燃（爆震）"}, {"k": "C", "t": "早燃后熄灭"}, {"k": "D", "t": "排气放炮"}], "a": "B", "e": "【考点】爆燃与压缩比关系(单选)。\n【解析】压缩比过高→末端混合气自燃→爆燃(爆震),金属敲击声;回火(进气管放炮)多与混合气过稀、点火过早有关,排气放炮与过浓有关。故选B。\n【易错】“压缩比高→爆燃”。回火是“向进气方向烧”,放炮是“排气方向”,爆燃是“缸内末端自燃”。三种不正常燃烧现象要区分。"}, {"id": 419, "oid": "A1-483", "type": "single", "module": "汽车概论与机械基础", "q": "按冷却方式不同，发动机可分为（　）。", "opts": [{"k": "A", "t": "直列式和V型"}, {"k": "B", "t": "水冷式和风冷式"}, {"k": "C", "t": "四冲程和二冲程"}, {"k": "D", "t": "汽油机和柴油机"}], "a": "B", "e": "【考点】冷却方式分类(单选)。\n【解析】按冷却方式分水冷式、风冷式;直列/V型是排列方式、四/二冲程是行程数、汽/柴油机是燃料类型。故选B。\n【易错】“水冷+风冷”。与376题同考点单选化。分类标准与选项一一对应,看清题干问的是哪个标准。"}, {"id": 420, "oid": "A1-484", "type": "single", "module": "汽车概论与机械基础", "q": "按气缸排列方式不同，发动机常见形式有（　）。", "opts": [{"k": "A", "t": "水冷式和风冷式"}, {"k": "B", "t": "直列式、V型和水平对置式"}, {"k": "C", "t": "自然吸气和增压式"}, {"k": "D", "t": "点燃式和压燃式"}], "a": "B", "e": "【考点】排列方式分类(单选)。\n【解析】按气缸排列:直列、V型、水平对置等;其余分别是冷却、进气、点火方式分类。故选B。\n【易错】“直列、V型、水平对置”。与377题同考点单选化。四个分类标准(燃料/冷却/排列/进气/点火/行程)要能互相对应。"}, {"id": 421, "oid": "A1-485", "type": "single", "module": "汽车概论与机械基础", "q": "按进气方式不同，发动机可分为（　）。", "opts": [{"k": "A", "t": "水冷式和风冷式"}, {"k": "B", "t": "自然吸气式和增压式"}, {"k": "C", "t": "直列式和V型"}, {"k": "D", "t": "二冲程和四冲程"}], "a": "B", "e": "【考点】进气方式分类(单选)。\n【解析】按进气方式:自然吸气、增压式;水冷/风冷是冷却方式,直列/V型是排列方式,二/四冲程是行程数。故选B。\n【易错】“自然吸气+增压”。与393题同考点单选化。六个分类维度交叉出题,看题干问哪个。"}, {"id": 422, "oid": "A1-486", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程发动机完成一个工作循环，曲轴转过（　）。", "opts": [{"k": "A", "t": "180°"}, {"k": "B", "t": "360°"}, {"k": "C", "t": "540°"}, {"k": "D", "t": "720°"}], "a": "D", "e": "【考点】四冲程循环转角(单选)。\n【解析】四行程各180°→一循环720°=两圈。故选D。\n【易错】“720°”。与379题重复。180°=一行程,360°=二冲程一循环,720°=四冲程一循环。"}, {"id": 423, "oid": "A1-487", "type": "single", "module": "汽车概论与机械基础", "q": "二冲程发动机完成一个工作循环，曲轴转过（　）。", "opts": [{"k": "A", "t": "180°"}, {"k": "B", "t": "360°"}, {"k": "C", "t": "540°"}, {"k": "D", "t": "720°"}], "a": "B", "e": "【考点】二冲程循环转角(单选)。\n【解析】二冲程在360°(一圈)内完成一循环。故选B。\n【易错】“360°”。与378题重复。二冲程=一圈,四冲程=两圈,正好差一倍。"}, {"id": 424, "oid": "A1-488", "type": "single", "module": "汽车概论与机械基础", "q": "增压发动机与同排量自然吸气发动机相比，其进气特点是（　）。", "opts": [{"k": "A", "t": "进气未经压缩直接吸入"}, {"k": "B", "t": "空气经增压器压缩后再进入气缸"}, {"k": "C", "t": "只吸入汽油蒸气"}, {"k": "D", "t": "进气量更少"}], "a": "B", "e": "【考点】增压发动机进气特点。\n【解析】增压式:空气经增压器压缩(密度↑)后再进气缸;自然吸气才是靠真空直接吸入。故选B。\n【易错】“增压=预压缩”。A是自然吸气特点,C“只吸汽油蒸气”无此说法,D与增压原理相反。与380题同考点。"}, {"id": 425, "oid": "A1-489", "type": "single", "module": "汽车概论与机械基础", "q": "计算单缸工作容积Vs时，正确的公式是（　）。", "opts": [{"k": "A", "t": "Vs=πD²S/4"}, {"k": "B", "t": "Vs=πDS²/4"}, {"k": "C", "t": "Vs=D·S"}, {"k": "D", "t": "Vs=πD²S"}], "a": "A", "e": "【考点】单缸工作容积公式。\n【解析】Vs=活塞截面积×行程=(πD²/4)×S=πD²S/4。故选A。\n【易错】“πD²S/4”。B把D²S位置颠倒、C漏π、D漏除4。公式=圆面积×行程,圆面积πD²/4。"}, {"id": 426, "oid": "A1-490", "type": "single", "module": "汽车概论与机械基础", "q": "某四缸发动机排量为2.0L，其单缸工作容积为（　）。", "opts": [{"k": "A", "t": "0.25L"}, {"k": "B", "t": "0.5L"}, {"k": "C", "t": "1.0L"}, {"k": "D", "t": "2.0L"}], "a": "B", "e": "【考点】单缸容积换算(单选)。\n【解析】单缸=排量÷缸数=2.0÷4=0.5L。故选B。\n【易错】“0.5L”。与404题重复。会除会乘:2.0L四缸=每缸0.5L。别算成0.25(÷8)或1.0(÷2)。"}, {"id": 427, "oid": "A1-491", "type": "single", "module": "汽车概论与机械基础", "q": "当压缩比ε=10时，燃烧室容积Vc与气缸总容积Va的关系为（　）。", "opts": [{"k": "A", "t": "Vc=Va"}, {"k": "B", "t": "Vc=Va/10"}, {"k": "C", "t": "Vc=10Va"}, {"k": "D", "t": "Vc=Va/2"}], "a": "B", "e": "【考点】压缩比与容积关系(单选)。\n【解析】ε=Va/Vc=10→Vc=Va/10,燃烧室占总容积1/10。故选B。\n【易错】“Vc=Va/10”。与385题重复。数学变形:ε=N→Vc=Va/N。A(C=V)、C(Vc=10Va)方向错,D是ε=2。"}, {"id": 428, "oid": "A1-492", "type": "single", "module": "汽车概论与机械基础", "q": "在燃烧室容积Vc不变时，增大气缸工作容积Vs，压缩比将（　）。", "opts": [{"k": "A", "t": "增大"}, {"k": "B", "t": "减小"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "先增后减"}], "a": "A", "e": "【考点】压缩比变化趋势。\n【解析】ε=(Vs+Vc)/Vc:Vc不变,Vs增大→分子增大→ε增大。故选A。\n【易错】“Vs↑→ε↑”。推导题:总容积变大,燃烧室不变,压缩更狠。反之缩小缸径(减小Vs)→ε下降。"}, {"id": 429, "oid": "A1-493", "type": "single", "module": "汽车概论与机械基础", "q": "V型发动机与直列发动机相比，突出特点是（　）。", "opts": [{"k": "A", "t": "机体更长"}, {"k": "B", "t": "机体更短、结构更紧凑"}, {"k": "C", "t": "只能用于摩托车"}, {"k": "D", "t": "没有曲轴"}], "a": "B", "e": "【考点】V型发动机特点(单选)。\n【解析】V型两列成夹角→机体更短、更紧凑,降低高度;它有曲轴,不只用于摩托车。故选B。\n【易错】“V型=短而紧凑”。与394题重复。A“机体更长”是直列特点,C、D明显错误。"}, {"id": 430, "oid": "A1-494", "type": "single", "module": "汽车概论与机械基础", "q": "风冷发动机散热主要依靠（　）。", "opts": [{"k": "A", "t": "冷却液循环"}, {"k": "B", "t": "空气吹拂散热片"}, {"k": "C", "t": "机油循环"}, {"k": "D", "t": "制冷剂蒸发"}], "a": "B", "e": "【考点】风冷散热原理(单选)。\n【解析】风冷靠空气直接吹拂缸体缸盖上的散热片散热;冷却液循环是水冷。故选B。\n【易错】“空气吹散热片”。与386题重复。机油循环是润滑散热,制冷剂蒸发是空调。"}, {"id": 431, "oid": "A1-495", "type": "single", "module": "汽车概论与机械基础", "q": "自然吸气发动机吸入空气依靠（　）。", "opts": [{"k": "A", "t": "增压器压入"}, {"k": "B", "t": "活塞下行在气缸内形成真空"}, {"k": "C", "t": "风扇鼓风"}, {"k": "D", "t": "喷油泵加压"}], "a": "B", "e": "【考点】自然吸气原理(单选)。\n【解析】自然吸气靠活塞下行产生真空(负压)吸入空气;增压才靠增压器。故选B。\n【易错】“活塞下行真空吸入”。A是增压方式。风扇鼓风不是发动机进气方式,喷油泵加压是供油。"}, {"id": 432, "oid": "A1-496", "type": "single", "module": "汽车概论与机械基础", "q": "某发动机型号为“6100”，其中数字“6”通常表示（　）。", "opts": [{"k": "A", "t": "排量6.0L"}, {"k": "B", "t": "6个气缸"}, {"k": "C", "t": "缸径60mm"}, {"k": "D", "t": "6气门"}], "a": "B", "e": "【考点】发动机型号识读(单选)。\n【解析】国产型号首部数字=缸数,“6100”中6表示6缸,后面100表示缸径100mm。故选B。\n【易错】“首位=缸数”。与387题重复。6.0L是排量、60mm是缸径都错。型号读法:缸数+缸径。"}, {"id": 433, "oid": "A1-497", "type": "single", "module": "汽车概论与机械基础", "q": "单缸工作容积公式Vs=πD²S/4中，字母D表示（　）。", "opts": [{"k": "A", "t": "活塞行程"}, {"k": "B", "t": "气缸直径"}, {"k": "C", "t": "曲柄半径"}, {"k": "D", "t": "燃烧室容积"}], "a": "B", "e": "【考点】公式符号含义。\n【解析】Vs=πD²S/4中D=气缸直径、S=活塞行程。故选B。\n【易错】“D=缸径”。与425题配套。A(S)是行程、C是曲柄半径、D是燃烧室容积,注意符号对位。"}, {"id": 434, "oid": "A1-498", "type": "single", "module": "汽车概论与机械基础", "q": "压缩比约为10.5的发动机一般属于（　）。", "opts": [{"k": "A", "t": "柴油机"}, {"k": "B", "t": "汽油机"}, {"k": "C", "t": "二冲程机"}, {"k": "D", "t": "风冷机"}], "a": "B", "e": "【考点】按压缩比判断机型。\n【解析】10.5落在汽油机8～11范围→汽油机;柴油机16～22。故选B。\n【易错】“10.5=汽油机”。反向应用:给数值判断机型。>14基本是柴油,8-12是汽油。"}, {"id": 435, "oid": "A1-499", "type": "single", "module": "汽车概论与机械基础", "q": "压缩比约为18的发动机一般属于（　）。", "opts": [{"k": "A", "t": "汽油机"}, {"k": "B", "t": "柴油机"}, {"k": "C", "t": "电动机"}, {"k": "D", "t": "燃气轮机"}], "a": "B", "e": "【考点】按压缩比判断机型(反向)。\n【解析】18在柴油机16～22范围→柴油机;汽油机≤11。故选B。\n【易错】“18=柴油机”。与434题互逆。压燃需要高压缩比,数值题直接对范围。"}, {"id": 436, "oid": "A1-500", "type": "single", "module": "汽车概论与机械基础", "q": "风冷发动机气缸体外表面铸有许多散热片，其作用是（　）。", "opts": [{"k": "A", "t": "增大散热面积"}, {"k": "B", "t": "减轻重量"}, {"k": "C", "t": "提高缸压"}, {"k": "D", "t": "装饰"}], "a": "A", "e": "【考点】散热片作用。\n【解析】散热片增大与空气的接触面积,提高风冷散热效果。故选A。\n【易错】“散热片=增大散热面积”。B减重、C提缸压、D装饰都不是散热片的设计目的。散热面积↑→散热量↑。"}, {"id": 437, "oid": "A1-501", "type": "single", "module": "汽车概论与机械基础", "q": "与风冷发动机相比，水冷发动机的突出优点是（　）。", "opts": [{"k": "A", "t": "结构更简单"}, {"k": "B", "t": "缸体温度均匀、工作噪声小"}, {"k": "C", "t": "不需要水泵"}, {"k": "D", "t": "完全不用维护"}], "a": "B", "e": "【考点】水冷vs风冷对比。\n【解析】水冷温度均匀、噪声小(冷却液包裹缸体);但需要水泵、散热器、管路,结构复杂、需维护。故选B。\n【易错】“水冷=均匀安静但复杂”。A“结构更简单”是风冷优点,C“不需要水泵”是风冷,D“不用维护”错。优点/代价成对记。"}, {"id": 438, "oid": "A1-502", "type": "single", "module": "汽车概论与机械基础", "q": "废气涡轮增压器中驱动涡轮的动力来自（　）。", "opts": [{"k": "A", "t": "曲轴直接皮带"}, {"k": "B", "t": "发动机排出的废气能量"}, {"k": "C", "t": "电动机"}, {"k": "D", "t": "蓄电池"}], "a": "B", "e": "【考点】废气涡轮增压原理。\n【解析】废气涡轮增压器利用排气能量驱动涡轮,带动同轴压气机压缩进气。故选B。\n【易错】“废气能量驱动”。A曲轴皮带是机械增压方式,C、D电动是电辅助。三种增压:废气涡轮/机械/电动。"}, {"id": 439, "oid": "A1-503", "type": "single", "module": "汽车概论与机械基础", "q": "活塞在上止点时，气缸内的容积（　）。", "opts": [{"k": "A", "t": "最大"}, {"k": "B", "t": "最小"}, {"k": "C", "t": "等于零"}, {"k": "D", "t": "等于总容积"}], "a": "B", "e": "【考点】上止点时缸内容积。\n【解析】上止点活塞顶最高→缸内只剩燃烧室容积Vc→最小。故选B。\n【易错】“上止点=最小”。配合440题:下止点=总容积=最大。上小下大。"}, {"id": 440, "oid": "A1-504", "type": "single", "module": "汽车概论与机械基础", "q": "活塞在下止点时，气缸内的容积（　）。", "opts": [{"k": "A", "t": "最小"}, {"k": "B", "t": "最大"}, {"k": "C", "t": "等于燃烧室容积"}, {"k": "D", "t": "为零"}], "a": "B", "e": "【考点】下止点时缸内容积。\n【解析】下止点活塞最低→缸内为总容积Va=Vs+Vc→最大。故选B。\n【易错】“下止点=最大”。与439题互逆:上止点最小(只剩Vc)、下止点最大(全部Va)。"}, {"id": 441, "oid": "A1-505", "type": "single", "module": "汽车概论与机械基础", "q": "压缩比是用来描述（　）的结构参数。", "opts": [{"k": "A", "t": "气体被压缩程度"}, {"k": "B", "t": "气缸直径大小"}, {"k": "C", "t": "发动机重量"}, {"k": "D", "t": "机油压力"}], "a": "A", "e": "【考点】压缩比的含义。\n【解析】压缩比ε=Va/Vc反映混合气被压缩的程度,影响热效率和燃烧。故选A。\n【易错】“压缩比=压缩程度”。B缸径、C重量、D油压与压缩比无关。定义理解题。"}, {"id": 442, "oid": "A1-506", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机压缩比远高于汽油机，主要是因为柴油机（　）。", "opts": [{"k": "A", "t": "靠压缩自燃，需要很高的压缩终温"}, {"k": "B", "t": "转速更高"}, {"k": "C", "t": "排量更小"}, {"k": "D", "t": "没有活塞"}], "a": "A", "e": "【考点】柴油机高压缩比原因。\n【解析】柴油靠压缩自燃→压缩终温须高于柴油自燃点→压缩比必须高。故选A。\n【易错】“压燃=高终温=高压缩比”。与400题重复。B转速、C排量、D“无活塞”都不是原因。"}, {"id": 443, "oid": "A1-507", "type": "single", "module": "汽车概论与机械基础", "q": "汽油机压缩比不能过高，主要受（　）限制。", "opts": [{"k": "A", "t": "爆燃"}, {"k": "B", "t": "机油压力"}, {"k": "C", "t": "蓄电池电压"}, {"k": "D", "t": "轮胎气压"}], "a": "A", "e": "【考点】汽油机压缩比受限原因。\n【解析】汽油机压缩比过高→末端混合气自燃→爆燃,故受爆燃限制。故选A。\n【易错】“爆燃限制”。与381、402题重复。B机油压力、C、D都与压缩比上限无关。"}, {"id": 444, "oid": "A1-508", "type": "single", "module": "汽车概论与机械基础", "q": "发动机排量一般在车辆铭牌或尾部标识中标注，它指的是（　）。", "opts": [{"k": "A", "t": "单缸工作容积"}, {"k": "B", "t": "各缸工作容积之和"}, {"k": "C", "t": "燃烧室容积"}, {"k": "D", "t": "油箱容积"}], "a": "B", "e": "【考点】铭牌排量的含义。\n【解析】铭牌标注的排量=各缸工作容积之和(Vh=Vs·i);不是单缸容积、燃烧室容积或油箱容积。故选B。\n【易错】“排量=Σ工作容积”。与410题重复。铭牌“1.5L”=总排量。油箱容积是另一个参数,别混。"}, {"id": 445, "oid": "A1-509", "type": "single", "module": "汽车概论与机械基础", "q": "其他条件不变，增大气缸直径D，单缸工作容积将（　）。", "opts": [{"k": "A", "t": "增大"}, {"k": "B", "t": "减小"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "变为零"}], "a": "A", "e": "【考点】缸径与容积关系。\n【解析】Vs=πD²S/4,与D²成正比:缸径D增大→容积显著增大。故选A。\n【易错】“D²正比”。平方关系:缸径增10%,容积增约21%。与428题(Vs↑→ε↑)衔接。"}, {"id": 446, "oid": "A1-510", "type": "single", "module": "汽车概论与机械基础", "q": "排量相同时，多缸发动机与单缸发动机相比，运转更（　）。", "opts": [{"k": "A", "t": "抖动剧烈"}, {"k": "B", "t": "平稳"}, {"k": "C", "t": "噪声更大"}, {"k": "D", "t": "无法工作"}], "a": "B", "e": "【考点】多缸机运转特性。\n【解析】多缸机各缸做功间隔均匀、相互补偿→运转更平稳。故选B。\n【易错】“多缸=平稳”。与370题重复。缸数多→做功频率高→扭矩波动小。四缸比三缸平顺,六缸比四缸平顺。"}, {"id": 447, "oid": "A1-511", "type": "single", "module": "汽车概论与机械基础", "q": "下列发动机分类中，按工作循环（行程数）划分的是（　）。", "opts": [{"k": "A", "t": "直列与V型"}, {"k": "B", "t": "四冲程与二冲程"}, {"k": "C", "t": "水冷与风冷"}, {"k": "D", "t": "增压与自然吸气"}], "a": "B", "e": "【考点】按行程数分类(单选)。\n【解析】按工作循环(行程数)分四冲程、二冲程;直列/V型是排列、水冷/风冷是冷却、增压/自然吸气是进气。故选B。\n【易错】“行程数=四/二冲程”。六个分类维度交叉出题,先看题干问的标准再对答案。"}, {"id": 448, "oid": "A1-512", "type": "single", "module": "汽车概论与机械基础", "q": "水平对置发动机两列气缸的夹角约为（　）。", "opts": [{"k": "A", "t": "30°"}, {"k": "B", "t": "60°"}, {"k": "C", "t": "90°"}, {"k": "D", "t": "180°"}], "a": "D", "e": "【考点】水平对置发动机夹角。\n【解析】水平对置两列气缸夹角180°(水平相对),重心低、运转平衡好。故选D。\n【易错】“180°”。V型常见夹角60°/90°,水平对置=180°。角度题:V型<180°,对置=180°。"}, {"id": 449, "oid": "A1-513", "type": "single", "module": "汽车概论与机械基础", "q": "提高压缩比（在合理范围内）一般可使发动机热效率（　）。", "opts": [{"k": "A", "t": "提高"}, {"k": "B", "t": "降低"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "变为零"}], "a": "A", "e": "【考点】压缩比与热效率。\n【解析】压缩比高→膨胀比大→热效率高(合理范围内);但汽油机受爆燃限制。故选A。\n【易错】“ε↑→效率↑”。与381题重复。这是柴油机省油的理论基础之一。"}, {"id": 450, "oid": "A1-514", "type": "single", "module": "汽车概论与机械基础", "q": "活塞在气缸内的运动形式是（　）。", "opts": [{"k": "A", "t": "旋转运动"}, {"k": "B", "t": "往复直线运动"}, {"k": "C", "t": "圆周摆动"}, {"k": "D", "t": "静止"}], "a": "B", "e": "【考点】活塞运动形式。\n【解析】活塞在气缸内作往复直线运动,经连杆把力传给曲轴转成旋转。故选B。\n【易错】“活塞=往复直线”。与451题互逆:曲轴=旋转运动。活塞↔曲轴,一往复一旋转,靠连杆转换。"}, {"id": 451, "oid": "A1-515", "type": "single", "module": "汽车概论与机械基础", "q": "曲轴的运动形式是（　）。", "opts": [{"k": "A", "t": "往复直线运动"}, {"k": "B", "t": "旋转运动"}, {"k": "C", "t": "上下跳动"}, {"k": "D", "t": "左右摆动"}], "a": "B", "e": "【考点】曲轴运动形式。\n【解析】曲轴绕主轴颈轴线旋转,把活塞往复运动变为旋转运动输出。故选B。\n【易错】“曲轴=旋转”。与450题配套。整机能量输出端是旋转的曲轴,飞轮端向外输出扭矩。"}, {"id": 452, "oid": "A1-516", "type": "single", "module": "汽车概论与机械基础", "q": "活塞通过（　）与曲轴相连，把往复运动传给曲轴。", "opts": [{"k": "A", "t": "气门"}, {"k": "B", "t": "连杆"}, {"k": "C", "t": "活塞环"}, {"k": "D", "t": "飞轮"}], "a": "B", "e": "【考点】连杆的作用。\n【解析】活塞销连连杆小头、连杆大头连曲轴连杆轴颈,连杆传递力并转换运动形式。故选B。\n【易错】“连杆=活塞↔曲轴”。气门管进排气、活塞环密封、飞轮存能量。曲柄连杆机构:活塞+连杆+曲轴。"}, {"id": 453, "oid": "A1-517", "type": "single", "module": "汽车概论与机械基础", "q": "一台发动机压缩比为9.5，燃烧室容积为0.5L，则其气缸总容积约为（　）。", "opts": [{"k": "A", "t": "4.75L"}, {"k": "B", "t": "0.5L"}, {"k": "C", "t": "5.0L"}, {"k": "D", "t": "9.5L"}], "a": "A", "e": "【考点】总容积计算。\n【解析】ε=Va/Vc→Va=ε·Vc=9.5×0.5=4.75L。故选A。\n【易错】“Va=ε×Vc”。计算题:给ε和Vc求Va,直接用公式。4.75L合理(压缩比9.5、燃烧室0.5L的大缸)。"}, {"id": 454, "oid": "A1-518", "type": "single", "module": "汽车概论与机械基础", "q": "某发动机单缸工作容积0.5L，燃烧室容积0.05L，其压缩比约为（　）。", "opts": [{"k": "A", "t": "5"}, {"k": "B", "t": "10"}, {"k": "C", "t": "11"}, {"k": "D", "t": "20"}], "a": "C", "e": "【考点】压缩比计算。\n【解析】Va=Vs+Vc=0.5+0.05=0.55L,ε=Va/Vc=0.55/0.05=11。故选C。\n【易错】“先加后除”。两步:先求总容积,再除以燃烧室容积。别直接用0.5/0.05=10(漏了Vc)。与398题呼应。"}, {"id": 455, "oid": "A1-519", "type": "single", "module": "汽车概论与机械基础", "q": "下列属于发动机按燃料分类的是（　）。", "opts": [{"k": "A", "t": "水冷机"}, {"k": "B", "t": "直列机"}, {"k": "C", "t": "柴油机"}, {"k": "D", "t": "增压机"}], "a": "C", "e": "【考点】按燃料分类识别。\n【解析】柴油机按所用燃料(柴油)分类;水冷按冷却、直列按排列、增压按进气方式。故选C。\n【易错】“柴油机=燃料分类”。六个分类标准互考:燃料(汽油/柴油/气体)、冷却(水/风)、排列(直/V/对置)、进气(自吸/增压)、点火(点燃/压燃)、行程(四/二)。"}, {"id": 456, "oid": "A1-520", "type": "single", "module": "汽车概论与机械基础", "q": "增压中冷（中间冷却）的主要作用是（　）。", "opts": [{"k": "A", "t": "降低进气温度、提高进气密度"}, {"k": "B", "t": "提高排气温度"}, {"k": "C", "t": "增加机油量"}, {"k": "D", "t": "降低压缩比"}], "a": "A", "e": "【考点】增压中冷的作用。\n【解析】增压后空气被压缩温度升高、密度下降;中冷器降温→密度回升→功率提升、降低热负荷。故选A。\n【易错】“中冷=降温提密度”。增压三步曲:增压(压)→中冷(冷)→进缸。B提排气温度是错的,D降压缩比无此作用。"}, {"id": 457, "oid": "A1-521", "type": "single", "module": "汽车概论与机械基础", "q": "气缸工作容积的计量单位通常采用（　）。", "opts": [{"k": "A", "t": "毫升（mL）或升（L）"}, {"k": "B", "t": "毫米（mm）"}, {"k": "C", "t": "千克（kg）"}, {"k": "D", "t": "千瓦（kW）"}], "a": "A", "e": "【考点】容积单位。\n【解析】工作容积单位mL或L;mm是长度、kg是质量、kW是功率。故选A。\n【易错】“mL/L”。与415题重复。物理量-单位对位:容积/长度/质量/功率。"}, {"id": 458, "oid": "A1-522", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于发动机排量的说法，正确的是（　）。", "opts": [{"k": "A", "t": "排量越大，每循环做功能力通常越强"}, {"k": "B", "t": "排量等于燃烧室容积"}, {"k": "C", "t": "排量单位是kW"}, {"k": "D", "t": "排量与缸数无关"}], "a": "A", "e": "【考点】排量概念辨析。\n【解析】排量大→每循环进油多→做功能力强;排量=Σ工作容积,与缸数有关,单位是容积单位。故选A。\n【易错】“排量=功率(错)”。B排量=燃烧室容积错、C单位kW错、D与缸数无关错。综合辨析题,逐项排除。"}, {"id": 459, "oid": "A1-523", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程发动机每个活塞行程对应的曲轴转角是（　）。", "opts": [{"k": "A", "t": "90°"}, {"k": "B", "t": "180°"}, {"k": "C", "t": "360°"}, {"k": "D", "t": "720°"}], "a": "B", "e": "【考点】行程对应转角。\n【解析】一个活塞行程=曲轴180°。故选B。\n【易错】“180°”。与373、395题重复。一行程180°,四冲程循环720°。"}, {"id": 460, "oid": "A1-524", "type": "single", "module": "汽车概论与机械基础", "q": "与同排量四冲程汽油机相比，柴油机在压缩比方面的特点是（　）。", "opts": [{"k": "A", "t": "压缩比更低"}, {"k": "B", "t": "压缩比更高"}, {"k": "C", "t": "压缩比相同"}, {"k": "D", "t": "没有压缩行程"}], "a": "B", "e": "【考点】汽柴油机压缩比对比。\n【解析】柴油机压燃需要更高压缩终温→压缩比远高于汽油机。故选B。\n【易错】“柴油=高压缩比”。与366、442题重复。压燃原理决定高压缩比。"}, {"id": 461, "oid": "A1-525", "type": "single", "module": "汽车概论与机械基础", "q": "下列发动机中，依靠火花塞点火的是（　）。", "opts": [{"k": "A", "t": "柴油机"}, {"k": "B", "t": "汽油机"}, {"k": "C", "t": "转子柴油机"}, {"k": "D", "t": "压燃式发动机"}], "a": "B", "e": "【考点】点燃与压燃识别。\n【解析】汽油机靠火花塞电火花点燃混合气(点燃式);柴油机压燃无火花塞。故选B。\n【易错】“火花塞=汽油机”。与462题互逆。点燃=火花塞,压燃=高温自燃。"}, {"id": 462, "oid": "A1-526", "type": "single", "module": "汽车概论与机械基础", "q": "下列发动机中，没有火花塞、依靠压缩自燃的是（　）。", "opts": [{"k": "A", "t": "汽油机"}, {"k": "B", "t": "柴油机"}, {"k": "C", "t": "甲醇点燃机"}, {"k": "D", "t": "天然气点燃机"}], "a": "B", "e": "【考点】压燃识别(反向)。\n【解析】柴油机把柴油喷入高温高压空气中自行着火(压燃),无火花塞;汽油机、甲醇/天然气点燃机都有火花塞。故选B。\n【易错】“压燃=柴油机”。与461题互逆。甲醇、天然气做燃料仍可用点燃方式。"}, {"id": 463, "oid": "A1-527", "type": "single", "module": "汽车概论与机械基础", "q": "汽油机在进气行程中进入气缸的是（　）。", "opts": [{"k": "A", "t": "纯空气"}, {"k": "B", "t": "汽油与空气的可燃混合气"}, {"k": "C", "t": "纯柴油"}, {"k": "D", "t": "水蒸气"}], "a": "B", "e": "【考点】汽油机进气行程介质。\n【解析】汽油机缸外形成汽油与空气混合气,进气行程吸入混合气;柴油机吸纯空气。故选B。\n【易错】“汽油机吸混合气”。与464题互逆。混合气在进气道/缸内形成(直喷在缸内形成,但吸入的仍是空气+油雾),柴油机先吸空气后喷油。"}, {"id": 464, "oid": "A1-528", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机在进气行程中进入气缸的是（　）。", "opts": [{"k": "A", "t": "纯空气"}, {"k": "B", "t": "柴油与空气的混合气"}, {"k": "C", "t": "汽油混合气"}, {"k": "D", "t": "废气"}], "a": "A", "e": "【考点】柴油机进气行程介质。\n【解析】柴油机进气行程只吸纯空气,柴油在压缩终了由喷油器喷入缸内。故选A。\n【易错】“柴油机吸纯空气”。与463题互逆。这是汽柴油机最本质区别之一:混合气形成地点和时机不同。"}, {"id": 465, "oid": "A1-529", "type": "single", "module": "汽车概论与机械基础", "q": "发动机型号“EQ6100”中，“100”通常表示（　）。", "opts": [{"k": "A", "t": "100kW"}, {"k": "B", "t": "气缸直径约100mm"}, {"k": "C", "t": "100牛·米"}, {"k": "D", "t": "100升排量"}], "a": "B", "e": "【考点】型号缸径识别。\n【解析】缸数后数字表示缸径(mm):EQ6100→6缸、缸径100mm。故选B。\n【易错】“100=缸径mm”。与387、432题重复。EQ是东风、6100=6缸100mm。"}, {"id": 466, "oid": "A1-530", "type": "single", "module": "汽车概论与机械基础", "q": "下列措施中，能够直接提高发动机排量的是（　）。", "opts": [{"k": "A", "t": "增大气缸直径或活塞行程"}, {"k": "B", "t": "减小缸径"}, {"k": "C", "t": "缩短行程"}, {"k": "D", "t": "减少缸数且不改变单缸容积"}], "a": "A", "e": "【考点】提高排量的途径。\n【解析】排量=πD²S/4×缸数:增大D或S→排量提高;减小则降低。故选A。\n【易错】“增D或增S”。B、C、D都是减小排量。这是“扩缸/加长行程”改装的理论依据。"}, {"id": 467, "oid": "A1-531", "type": "single", "module": "汽车概论与机械基础", "q": "按活塞运动方式，现代汽车广泛采用的是（　）。", "opts": [{"k": "A", "t": "往复活塞式"}, {"k": "B", "t": "旋转活塞式"}, {"k": "C", "t": "涡轮式"}, {"k": "D", "t": "蒸汽式"}], "a": "A", "e": "【考点】主流发动机类型。\n【解析】现代汽车普遍采用往复活塞式内燃机;转子发动机仅少数车型。故选A。\n【易错】“往复活塞式”。与405题重复。旋转活塞式(转子)是少数,涡轮式用于航空/发电,蒸汽式早淘汰。"}, {"id": 468, "oid": "A1-532", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机压缩终了温度高，主要目的是（　）。", "opts": [{"k": "A", "t": "使喷入的柴油自行着火"}, {"k": "B", "t": "提高机油黏度"}, {"k": "C", "t": "降低进气阻力"}, {"k": "D", "t": "加热冷却液"}], "a": "A", "e": "【考点】柴油机高压缩终温目的。\n【解析】压缩终温超过柴油自燃点→喷入柴油自行着火→实现压燃。故选A。\n【易错】“高温=让柴油自燃”。与400、442题重复。其他选项都是干扰:机油黏度、进气阻力、冷却液与压缩终温目的无关。"}, {"id": 469, "oid": "A1-533", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于上止点的叙述，正确的是（　）。", "opts": [{"k": "A", "t": "活塞顶离曲轴中心最远"}, {"k": "B", "t": "活塞顶离曲轴中心最近"}, {"k": "C", "t": "气缸容积最大"}, {"k": "D", "t": "位于行程中点"}], "a": "A", "e": "【考点】上止点叙述。\n【解析】上止点=活塞最高、离曲轴中心最远、缸内只剩燃烧室容积(最小)。故选A。\n【易错】“上止点=最远”。与368题重复。B最近是下止点、C容积最大是下止点、D行程中点无此概念。"}, {"id": 470, "oid": "A1-534", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于下止点的叙述，正确的是（　）。", "opts": [{"k": "A", "t": "活塞顶离曲轴中心最远"}, {"k": "B", "t": "活塞顶离曲轴中心最近"}, {"k": "C", "t": "气缸容积最小"}, {"k": "D", "t": "位于行程中点"}], "a": "B", "e": "【考点】下止点叙述。\n【解析】下止点=活塞最低、离曲轴中心最近、缸内总容积(最大)。故选B。\n【易错】“下止点=最近”。与358题重复。A最远是上止点、C容积最小是上止点、D无此概念。上下止点对照记。"}, {"id": 471, "oid": "A1-535", "type": "single", "module": "汽车概论与机械基础", "q": "发动机的工作容积是指（　）。", "opts": [{"k": "A", "t": "一个气缸的排量"}, {"k": "B", "t": "燃烧室容积"}, {"k": "C", "t": "油箱容积"}, {"k": "D", "t": "冷却系容积"}], "a": "A", "e": "【考点】工作容积定义。\n【解析】工作容积=一个气缸的排量=活塞扫过的容积(Vs)。故选A。\n【易错】“工作容积=单缸排量”。与382题重复。B燃烧室容积、C油箱容积都不是。注意“工作容积”即“单缸排量”。"}, {"id": 472, "oid": "A1-536", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机与汽油机相比，压缩终了缸内气体的温度和压力（　）。", "opts": [{"k": "A", "t": "更低"}, {"k": "B", "t": "更高"}, {"k": "C", "t": "相同"}, {"k": "D", "t": "为零"}], "a": "B", "e": "【考点】汽柴油机压缩终了状态对比。\n【解析】柴油机压缩比高(16~22)>汽油机(8~11),压缩终了温度、压力都明显更高,以保证喷入柴油自行着火。故选B。\n【易错】“柴油=高温高压”。与366、460题同考点。压燃条件:高压缩比→高终温终压。零压不可能,相同也不对。"}, {"id": 473, "oid": "A1-537", "type": "single", "module": "汽车概论与机械基础", "q": "下列选项中，属于发动机结构参数（术语）的是（　）。", "opts": [{"k": "A", "t": "压缩比"}, {"k": "B", "t": "最高车速"}, {"k": "C", "t": "百公里油耗"}, {"k": "D", "t": "整备质量"}], "a": "A", "e": "【考点】结构参数与性能参数区分。\n【解析】压缩比、排量、行程等描述发动机结构;最高车速、百公里油耗、整备质量是整车性能参数。故选A。\n【易错】“压缩比=结构参数”。结构参数描述“造得怎么样”,性能参数描述“跑得怎么样”。整理:结构=缸径/行程/排量/压缩比;性能=功率/扭矩/油耗/车速。"}, {"id": 474, "oid": "A1-538", "type": "single", "module": "汽车概论与机械基础", "q": "某发动机单缸燃烧室容积0.04L，工作容积0.40L，其压缩比为（　）。", "opts": [{"k": "A", "t": "10"}, {"k": "B", "t": "11"}, {"k": "C", "t": "10.5"}, {"k": "D", "t": "9"}], "a": "B", "e": "【考点】压缩比计算(小数数据)。\n【解析】Va=Vs+Vc=0.40+0.04=0.44L,ε=Va/Vc=0.44/0.04=11。故选B。\n【易错】“先加后除”。与454题同型:先求总容积再加除。0.40/0.04=10是漏加Vc的错误算法(同398题陷阱)。"}, {"id": 475, "oid": "A1-539", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程发动机一个工作循环中，活塞往复运动（　）。", "opts": [{"k": "A", "t": "一次"}, {"k": "B", "t": "两次"}, {"k": "C", "t": "四次"}, {"k": "D", "t": "八次"}], "a": "B", "e": "【考点】四冲程活塞往复次数。\n【解析】四个行程=上、下、上、下,活塞共往复两次,曲轴转两圈。故选B。\n【易错】“一循环=往复两次”。四个行程不是四次往复:上+下=1次往复。行程数÷2=往复次数。"}, {"id": 476, "oid": "A1-540", "type": "single", "module": "汽车概论与机械基础", "q": "二冲程发动机与四冲程发动机相比，相同排量下其做功频率（　）。", "opts": [{"k": "A", "t": "更低"}, {"k": "B", "t": "更高"}, {"k": "C", "t": "相同"}, {"k": "D", "t": "为零"}], "a": "B", "e": "【考点】二冲程做功频率。\n【解析】二冲程曲轴转一圈做功一次,同转速下做功次数约为四冲程的2倍→功率密度更高。故选B。\n【易错】“二冲程=做功频率翻倍”。与401题重复。做功频率高是二冲程功率密度高的原因,但换气质量差是代价。"}, {"id": 477, "oid": "A1-541", "type": "single", "module": "汽车概论与机械基础", "q": "发动机铭牌上标注的“1.6L”指的是（　）。", "opts": [{"k": "A", "t": "油箱容积"}, {"k": "B", "t": "发动机排量"}, {"k": "C", "t": "冷却液容量"}, {"k": "D", "t": "机油容量"}], "a": "B", "e": "【考点】铭牌“1.6L”含义。\n【解析】车尾或铭牌的“1.6L”=发动机排量约1.6升(各缸工作容积之和)。故选B。\n【易错】“L=排量”。与444题重复。油箱、冷却液、机油容量都不标在“排量位”。轿车“1.5T”“2.0L”就是排量。"}, {"id": 478, "oid": "A1-542", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于压缩比的说法，错误的是（　）。", "opts": [{"k": "A", "t": "压缩比是总容积与燃烧室容积之比"}, {"k": "B", "t": "柴油机压缩比高于汽油机"}, {"k": "C", "t": "汽油机压缩比越高越好，不受任何限制"}, {"k": "D", "t": "压缩比影响热效率"}], "a": "C", "e": "【考点】压缩比综合(反向)。\n【解析】汽油机压缩比受爆燃限制,并非越高越好;C说“不受任何限制”,错误,故选C(题干问“错误的”)。\n【易错】“汽油机压缩比有限制”。A定义、B柴油高、D影响效率都正确。反向题:注意“越高越好不受限”这类绝对化表述往往是错项。"}, {"id": 479, "oid": "A1-543", "type": "single", "module": "汽车概论与机械基础", "q": "气缸体上活塞往复运动的圆柱形空间称为（　）。", "opts": [{"k": "A", "t": "气缸"}, {"k": "B", "t": "曲轴箱"}, {"k": "C", "t": "油底壳"}, {"k": "D", "t": "进气管"}], "a": "A", "e": "【考点】气缸定义。\n【解析】气缸=活塞往复运动的圆柱形空腔,顶部是燃烧室;曲轴箱、油底壳在缸体下方,进气管在缸盖上方。故选A。\n【易错】“气缸=活塞活动空间”。术语对位:气缸(活塞活动)/曲轴箱(曲轴)/油底壳(机油)/进气管(进气)。"}, {"id": 480, "oid": "A1-544", "type": "single", "module": "汽车概论与机械基础", "q": "活塞由上止点下行时，气缸内容积（　）。", "opts": [{"k": "A", "t": "逐渐增大"}, {"k": "B", "t": "逐渐减小"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "变为零"}], "a": "A", "e": "【考点】活塞下行容积变化。\n【解析】活塞从上止点下行→扫过空间增大→缸内容积由Vc逐渐增大到Va(下止点最大)。故选A。\n【易错】“下行=容积增大”。与439、440题衔接:上小下大。下行对应进气/做功行程。"}, {"id": 481, "oid": "A1-545", "type": "single", "module": "汽车概论与机械基础", "q": "活塞由下止点上行时，气缸内气体被（　）。", "opts": [{"k": "A", "t": "压缩"}, {"k": "B", "t": "膨胀"}, {"k": "C", "t": "排出为零"}, {"k": "D", "t": "冷却为液体"}], "a": "A", "e": "【考点】活塞上行气体状态。\n【解析】活塞从下止点上行→容积减小→气体被压缩,压力温度升高(压缩行程)。故选A。\n【易错】“上行=压缩”。压缩行程是做功前的准备。B膨胀是做功行程,D“排为零”无此说法。"}, {"id": 482, "oid": "A1-546", "type": "single", "module": "汽车概论与机械基础", "q": "下列发动机中，靠压燃方式工作的是（　）。", "opts": [{"k": "A", "t": "柴油机"}, {"k": "B", "t": "汽油机"}, {"k": "C", "t": "转子点燃机"}, {"k": "D", "t": "煤气点燃机"}], "a": "A", "e": "【考点】压燃方式识别。\n【解析】柴油机压燃;汽油机、转子点燃机、煤气点燃机都是火花点火。故选A。\n【易错】“压燃=柴油机”。与462题重复。压燃/点燃是点火方式分类:点燃有火花塞,压燃无火花塞。"}, {"id": 483, "oid": "A1-547", "type": "single", "module": "汽车概论与机械基础", "q": "与自然吸气相比，废气涡轮增压发动机的进气特点是（　）。", "opts": [{"k": "A", "t": "进气更多、密度更大"}, {"k": "B", "t": "进气更少"}, {"k": "C", "t": "只进废气"}, {"k": "D", "t": "不需要空气"}], "a": "A", "e": "【考点】增压进气特点。\n【解析】增压器压缩空气→进气量和密度增大→可多喷油多做功。故选A。\n【易错】“增压=多进气”。与424题重复。B进气更少错、C只进废气错、D不需要空气错。增压的收益全在“进气密度↑”。"}, {"id": 484, "oid": "A1-548", "type": "single", "module": "汽车概论与机械基础", "q": "发动机排量的大小直接影响（　）。", "opts": [{"k": "A", "t": "每循环做功能力和动力性"}, {"k": "B", "t": "轮胎花纹"}, {"k": "C", "t": "车身颜色"}, {"k": "D", "t": "座椅材质"}], "a": "A", "e": "【考点】排量对性能的影响。\n【解析】排量大→每循环进气量多→做功能力强→动力性好。故选A。\n【易错】“排量=动力性”。与396题重复。轮胎花纹、车身颜色、座椅材质与排量无关。"}, {"id": 485, "oid": "A1-549", "type": "single", "module": "汽车概论与机械基础", "q": "当其他条件相同，仅把燃烧室容积增大时，压缩比将（　）。", "opts": [{"k": "A", "t": "增大"}, {"k": "B", "t": "减小"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "无法判断"}], "a": "B", "e": "【考点】燃烧室容积变化对压缩比影响。\n【解析】ε=1+Vs/Vc:Vc增大→分母增大→ε减小。故选B。\n【易错】“Vc↑→ε↓”。与428题互逆:Vs↑→ε↑,Vc↑→ε↓。两个方向都考,记公式推导。"}, {"id": 486, "oid": "A1-550", "type": "single", "module": "汽车概论与机械基础", "q": "下列参数中，随活塞行程增大而增大的是（　）。", "opts": [{"k": "A", "t": "单缸工作容积"}, {"k": "B", "t": "燃烧室容积"}, {"k": "C", "t": "蓄电池电压"}, {"k": "D", "t": "轮胎直径"}], "a": "A", "e": "【考点】行程增大影响。\n【解析】Vs=πD²S/4:行程S增大→单缸工作容积增大。故选A。\n【易错】“S↑→Vs↑”。与445题同型(缸径D↑→Vs↑)。燃烧室容积由缸盖结构决定,与行程无直接关系。"}, {"id": 487, "oid": "A1-551", "type": "single", "module": "汽车概论与机械基础", "q": "按冷却方式，现代汽车发动机普遍采用（　）。", "opts": [{"k": "A", "t": "水冷式"}, {"k": "B", "t": "风冷式"}, {"k": "C", "t": "自然冷却"}, {"k": "D", "t": "油冷式"}], "a": "A", "e": "【考点】现代汽车主流冷却方式。\n【解析】现代汽车发动机普遍采用水冷式(温度均匀、噪声小);风冷用于摩托车等小排量。故选A。\n【易错】“水冷=主流”。与437题配套。风冷结构简单但散热不均。油冷是辅助方式,自然冷却不够用。"}, {"id": 488, "oid": "A1-552", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于二冲程发动机的说法，正确的是（　）。", "opts": [{"k": "A", "t": "曲轴转一圈完成一个工作循环"}, {"k": "B", "t": "曲轴转两圈完成一个工作循环"}, {"k": "C", "t": "没有做功行程"}, {"k": "D", "t": "不需要换气"}], "a": "A", "e": "【考点】二冲程特点综合。\n【解析】二冲程曲轴转一圈(360°)完成一个循环,仍有做功行程,换气靠扫气。故选A。\n【易错】“二冲程=360°一循环”。B两圈是四冲程,C“无做功行程”错(没有做功行程就不叫发动机),D“不需换气”错。"}, {"id": 489, "oid": "A1-553", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机吸入纯空气、汽油形成混合气后才进入气缸，这是二者在（　）上的主要区别。", "opts": [{"k": "A", "t": "进气成分与着火方式"}, {"k": "B", "t": "车轮数量"}, {"k": "C", "t": "车身颜色"}, {"k": "D", "t": "轮胎规格"}], "a": "A", "e": "【考点】汽柴油机本质区别。\n【解析】柴油机进纯空气、缸内压燃;汽油机进可燃混合气、火花塞点燃——区别在进气成分与着火方式。故选A。\n【易错】“进气成分+着火方式”。与463、464题综合。这是两者最本质区别,常综合考。"}, {"id": 490, "oid": "A1-554", "type": "single", "module": "汽车概论与机械基础", "q": "下列术语中，表示“活塞上止点时活塞顶上方容积”的是（　）。", "opts": [{"k": "A", "t": "燃烧室容积"}, {"k": "B", "t": "工作容积"}, {"k": "C", "t": "总容积"}, {"k": "D", "t": "排量"}], "a": "A", "e": "【考点】燃烧室容积术语对位。\n【解析】“活塞上止点时活塞顶上方容积”=燃烧室容积Vc。故选A。\n【易错】“上止点上方=Vc”。与409题重复。工作容积=扫过、总容积=全部、排量=各缸之和。术语对位题。"}, {"id": 491, "oid": "A1-555", "type": "single", "module": "汽车概论与机械基础", "q": "发动机按燃料分为汽油机和柴油机，其分类依据是（　）。", "opts": [{"k": "A", "t": "使用的燃料不同"}, {"k": "B", "t": "冷却方式不同"}, {"k": "C", "t": "气缸排列不同"}, {"k": "D", "t": "车轮数量不同"}], "a": "A", "e": "【考点】燃料分类依据。\n【解析】汽油机/柴油机按使用燃料不同区分。故选A。\n【易错】“燃料=分类依据”。与455题重复。分类标准与分类结果要对应:燃料/冷却/排列/进气/点火/行程六维度。"}, {"id": 492, "oid": "A2-011", "type": "judge", "module": "汽车概论与机械基础", "q": "我国机械制图国家标准规定，图样上的尺寸以毫米为单位时，不必在尺寸数字后标注单位符号。", "opts": [], "a": "√", "e": "【考点】机械制图尺寸单位规定。\n【解析】按GB/T 4458.4,机械图样默认以mm为单位,尺寸数字后不注单位;采用其他单位(如英寸)时才必须注明。题干正确,判断为√。\n【易错】“默认mm不注单位”。看到图上“50”不是50cm是50mm。只有特殊单位才标注,这是读图常识。"}, {"id": 493, "oid": "A2-012", "type": "judge", "module": "汽车概论与机械基础", "q": "绘制机械图样时，粗实线的线宽d一般取细实线线宽的2倍左右。", "opts": [], "a": "√", "e": "【考点】图线粗细关系。\n【解析】粗线宽d在0.5~2mm选用,细线宽约为d/2,粗细比2:1,图面层次分明。题干正确,判断为√。\n【易错】“粗:细=2:1”。粗实线画可见轮廓,细实线画尺寸线剖面线。比例关系常考。"}, {"id": 494, "oid": "A2-013", "type": "judge", "module": "汽车概论与机械基础", "q": "机械图样中的对称中心线和轴线应采用细点画线绘制。", "opts": [], "a": "√", "e": "【考点】细点画线的用途。\n【解析】轴线、对称中心线、回转体中心线、轨迹线用细点画线;不可见轮廓用细虚线。题干正确,判断为√。\n【易错】“中心线=细点画线”。图线用途对照表:粗实线=可见轮廓、细实线=尺寸/剖面、细虚线=不可见轮廓、细点画线=中心/轴线、双点画线=假想轮廓、波浪线=断裂。"}, {"id": 495, "oid": "A2-014", "type": "judge", "module": "汽车概论与机械基础", "q": "绘制断裂处的边界线时，只能用波浪线，不允许采用双折线。", "opts": [], "a": "×", "e": "【考点】断裂边界线画法。\n【解析】断裂边界既可画波浪线(短断裂),也可画双折线(长断裂或简化);说“只能用波浪线”错误,判断为×。\n【易错】“波浪线+双折线都行”。短断裂波浪线、长断裂双折线。这是判断题常考的“绝对化”陷阱。"}, {"id": 496, "oid": "A2-015", "type": "judge", "module": "汽车概论与机械基础", "q": "尺寸标注由尺寸界线、尺寸线和尺寸数字三个要素组成。", "opts": [], "a": "√", "e": "【考点】尺寸标注三要素。\n【解析】完整尺寸=尺寸界线(范围)+尺寸线(带箭头)+尺寸数字(数值),缺一不可。题干正确,判断为√。\n【易错】“三要素=界线+线+数字”。尺寸界线从轮廓引出、尺寸线平行于所注方向、数字标在线上方。"}, {"id": 497, "oid": "A2-016", "type": "judge", "module": "汽车概论与机械基础", "q": "在零件图上，水平方向的尺寸数字应字头朝上，竖直方向的尺寸数字应字头朝左书写。", "opts": [], "a": "√", "e": "【考点】尺寸数字书写方向。\n【解析】水平尺寸数字注在尺寸线上方、字头朝上;竖直尺寸注在尺寸线左侧、字头朝左。题干正确,判断为√。\n【易错】“水平朝上、竖直朝左”。对比角度数字一律水平书写(498题)。线性数字的书写方向随尺寸线方向变。"}, {"id": 498, "oid": "A2-017", "type": "judge", "module": "汽车概论与机械基础", "q": "标注角度尺寸时，角度数字可以根据角度倾斜方向随意书写。", "opts": [], "a": "×", "e": "【考点】角度数字书写。\n【解析】角度数字一律水平书写、字头朝上,注在尺寸线中断处,不随角度倾斜。题干说“随意书写”,错误,判断为×。\n【易错】“角度=水平书写”。与497题对比:线性数字随方向,角度数字固定水平。两题常一起考。"}, {"id": 499, "oid": "A2-018", "type": "judge", "module": "汽车概论与机械基础", "q": "图样的比例是指图形与其实物相应要素的线性尺寸之比。", "opts": [], "a": "√", "e": "【考点】比例定义。\n【解析】比例=图形:实物线性尺寸。2:1放大、1:1原值、1:2缩小。题干正确,判断为√。\n【易错】“比例=图:物”。注意书写顺序,1:2是图小物大(缩小)。比例只影响图形大小不影响标注数值(500题)。"}, {"id": 500, "oid": "A2-019", "type": "judge", "module": "汽车概论与机械基础", "q": "不论采用放大还是缩小比例绘图，图样上标注的尺寸数字都应是机件的实际真实尺寸。", "opts": [], "a": "√", "e": "【考点】比例与标注数值关系。\n【解析】比例只改变图形大小,图上标注的永远是机件实际尺寸,与绘图比例无关。题干正确,判断为√。\n【易错】“标注=实际尺寸”。与499题配套。放大缩小只是画法,数字不变。这是读图的基本原则。"}, {"id": 501, "oid": "A2-020", "type": "judge", "module": "汽车概论与机械基础", "q": "我国规定机械图样采用第一角画法，即“人—物—图”的投射顺序。", "opts": [], "a": "√", "e": "【考点】第一角画法。\n【解析】GB/T 17452规定我国用第一角投影(人—物—图);第三角画法(人—图—物)用于少数国家,须加识别符号。题干正确,判断为√。\n【易错】“第一角=人-物-图”。口诀:第一角“人物图”,第三角“人图物”。欧美图纸常标第三角符号,中外图纸交流要看清楚。"}, {"id": 502, "oid": "A2-021", "type": "judge", "module": "汽车概论与机械基础", "q": "机械制图中的汉字应写成长仿宋体，并采用国家正式公布的简化字。", "opts": [], "a": "√", "e": "【考点】图样汉字字体。\n【解析】国标规定图样汉字用长仿宋体,端正清晰,用正式公布的简化字。题干正确,判断为√。\n【易错】“汉字=长仿宋”。数字字母可用斜体或直体。手写图样也要尽量靠拢长仿宋,这是制图基本功。"}, {"id": 503, "oid": "A2-022", "type": "judge", "module": "汽车概论与机械基础", "q": "A4图纸的幅面尺寸为297mm×210mm。", "opts": [], "a": "√", "e": "【考点】A4幅面尺寸。\n【解析】A4=297×210mm;A3=420×297、A2=594×420、A1=841×594、A0=1189×841,每加一号面积翻倍。题干正确,判断为√。\n【易错】“A4=297×210”。记住A0=1189×841,每折半一次即小一号。数字常考,建议记A4和A3。"}, {"id": 504, "oid": "A2-023", "type": "judge", "module": "汽车概论与机械基础", "q": "装配图和零件图的标题栏一般应配置在图框的左下角。", "opts": [], "a": "×", "e": "【考点】标题栏位置。\n【解析】标题栏在图纸右下角,长边与下图框线重合。题干说“左下角”,错误,判断为×。\n【易错】“标题栏=右下角”。读图方向与标题栏一致:拿到图纸先看右下角标题栏。左上是明细栏/装配图位置。"}, {"id": 505, "oid": "A2-024", "type": "judge", "module": "汽车概论与机械基础", "q": "金属材料的剖面符号画成与水平方向成45°、间隔均匀的细实线。", "opts": [], "a": "√", "e": "【考点】金属剖面线画法。\n【解析】金属零件剖面线为与水平成45°(或135°)、等距平行的细实线,同一零件各视图方向间距一致。题干正确,判断为√。\n【易错】“45°细实线”。剖面线=斜45°、均匀、细实线。方向间距一致性见506题。"}, {"id": 506, "oid": "A2-025", "type": "judge", "module": "汽车概论与机械基础", "q": "在同一零件的不同剖视图中，剖面线可以画成不同方向和不同间隔。", "opts": [], "a": "×", "e": "【考点】同一零件剖面线一致性。\n【解析】同一零件各剖视图剖面线必须方向相同、间隔相等,便于与相邻零件区分。题干说“可不同”,错误,判断为×。\n【易错】“同零件=同方向同间距”。装配图中相邻零件才要求方向相反或间距不同(520题)。一条规律两处考。"}, {"id": 507, "oid": "A2-026", "type": "judge", "module": "汽车概论与机械基础", "q": "画尺寸线时，尺寸线可以与图样上的轮廓线重合或画在其延长线上。", "opts": [], "a": "×", "e": "【考点】尺寸线画法规定。\n【解析】尺寸线必须单独画出,不能与轮廓线、中心线重合或画在其延长线上;尺寸界线从轮廓引出且与尺寸线垂直。题干错误,判断为×。\n【易错】“尺寸线独立”。尺寸线是“空线”,两端有箭头指向界线。与轮廓重合会分不清谁是谁。"}, {"id": 508, "oid": "A2-027", "type": "judge", "module": "汽车概论与机械基础", "q": "标注直径尺寸时应在数字前加注符号“φ”，标注半径时加注符号“R”。", "opts": [], "a": "√", "e": "【考点】直径半径符号。\n【解析】整圆或大于半圆注φ,半圆或小于半圆注R。题干正确,判断为√。\n【易错】“φ直径、R半径”。大小判断:整圆φ、半圆R。球面加S(509题),45°倒角用C。"}, {"id": 509, "oid": "A2-028", "type": "judge", "module": "汽车概论与机械基础", "q": "零件图上标注球面直径或半径时，应在φ或R前再加写符号“S”。", "opts": [], "a": "√", "e": "【考点】球面尺寸符号。\n【解析】球面尺寸须加S区分:Sφ20、SR15。题干正确,判断为√。\n【易错】“球面=Sφ/SR”。不加S会被误认为普通圆柱面。符号家族:φ/R/S/C,各管各的。"}, {"id": 510, "oid": "A2-029", "type": "judge", "module": "汽车概论与机械基础", "q": "图样中尺寸数字不允许被任何图线穿过，当不可避免时应将该图线断开。", "opts": [], "a": "√", "e": "【考点】尺寸数字不被图线穿过。\n【解析】任何图线不得穿过尺寸数字,不可避免时断开该处图线。题干正确,判断为√。\n【易错】“数字优先、图线让路”。可读性优先。断开的图线不影响表达,压在数字上才影响读图。"}, {"id": 511, "oid": "A2-030", "type": "judge", "module": "汽车概论与机械基础", "q": "机件的真实大小应以图上所注尺寸数字为依据，并与图形的绘制大小和准确度有关。", "opts": [], "a": "×", "e": "【考点】尺寸数字为准(反向)。\n【解析】机件真实大小以所注尺寸数字为唯一依据,与绘图比例、画图准确度无关。题干说“与准确度有关”,错误,判断为×。\n【易错】“数字=唯一依据”。与500题同考点。图上量多少不算数,标注数字才算。判断题“有关”二字是陷阱。"}, {"id": 512, "oid": "A2-031", "type": "judge", "module": "汽车概论与机械基础", "q": "绘制圆的中心线时，细点画线应超出轮廓圆外2～5mm，且圆心处应是线段相交。", "opts": [], "a": "√", "e": "【考点】中心线画法。\n【解析】圆的中心线(细点画线)超出轮廓2~5mm,圆心处应是画(长线段)相交而非点相交。题干正确,判断为√。\n【易错】“中心线超2-5mm+画线相交”。圆心的交点是长画线相交,这样圆心才明确。画线细节题,实操制图会用到。"}, {"id": 513, "oid": "A2-032", "type": "judge", "module": "汽车概论与机械基础", "q": "当图形不能充分表达平面时，可用平面符号（相交的两条细实线）表示该平面。", "opts": [], "a": "√", "e": "【考点】平面符号。\n【解析】图形不能充分表达平面时,用相交的两条细实线表示该平面(薄板、棱角处简化表达)。题干正确,判断为√。\n【易错】“两条相交细实线=平面”。这是平面符号的约定画法。看到对角细实线,代表那里是个平面。"}, {"id": 514, "oid": "A2-033", "type": "judge", "module": "汽车概论与机械基础", "q": "标注45°倒角时，可用符号“C”加倒角轴向尺寸表示，如C2。", "opts": [], "a": "√", "e": "【考点】45°倒角标注。\n【解析】45°倒角用符号C表示,C2=轴向倒角尺寸2mm、角度45°;非45°倒角须分别注出角度和尺寸。题干正确,判断为√。\n【易错】“C=45°倒角”。C2不是半径2,是倒角宽度2mm。非45°倒角要标“30°×2”这样的形式。"}, {"id": 515, "oid": "A2-034", "type": "judge", "module": "汽车概论与机械基础", "q": "表面粗糙度轮廓算术平均偏差Ra的数值越大，表示该表面越光滑。", "opts": [], "a": "×", "e": "【考点】Ra值与表面光滑度。\n【解析】Ra数值越小→表面轮廓起伏越小→越光滑;数值越大越粗糙。题干说反,判断为×。\n【易错】“Ra小=光滑”。Ra1.6比Ra6.3光洁。方向记反是高频错误。Ra是轮廓算术平均偏差,是表面粗糙度最常用参数。"}, {"id": 516, "oid": "A2-035", "type": "judge", "module": "汽车概论与机械基础", "q": "公差等于最大极限尺寸与最小极限尺寸之差，也就是上偏差减下偏差的绝对值。", "opts": [], "a": "√", "e": "【考点】公差定义。\n【解析】公差=最大极限尺寸−最小极限尺寸=上偏差−下偏差,恒为正值,反映加工难易。题干正确,判断为√。\n【易错】“公差=上偏差−下偏差”。注意是“上−下”不是“下−上”。公差永远为正。相关公式:最大极限尺寸=基本尺寸+上偏差。"}, {"id": 517, "oid": "A2-036", "type": "judge", "module": "汽车概论与机械基础", "q": "基本偏差一般是指靠近零线的那个偏差，用以确定公差带相对于零线的位置。", "opts": [], "a": "√", "e": "【考点】基本偏差定义。\n【解析】基本偏差=公差带靠近零线的那个偏差(上或下),决定公差带相对零线的位置;另一偏差由公差大小定。题干正确,判断为√。\n【易错】“基本偏差=靠零线的偏差”。它管“位置”,公差管“大小”。位置+大小=完整公差带。"}, {"id": 518, "oid": "A2-037", "type": "judge", "module": "汽车概论与机械基础", "q": "基孔制配合中，孔的基本偏差固定为H（下偏差为零），通过改变轴的公差带来得到各种配合。", "opts": [], "a": "√", "e": "【考点】基孔制配合。\n【解析】基孔制以基准孔H为基准(下偏差为零),靠改变轴的公差带获得间隙/过渡/过盈配合,应用最广。题干正确,判断为√。\n【易错】“基孔制=孔H不动、轴变”。基准孔下偏差为0。与基轴制(h,上偏差0)对应。孔大写、轴小写。"}, {"id": 519, "oid": "A2-038", "type": "judge", "module": "汽车概论与机械基础", "q": "形状公差包括直线度、平面度、圆度和圆柱度等，它们不涉及基准。", "opts": [], "a": "√", "e": "【考点】形状公差特点。\n【解析】形状公差(直线度、平面度、圆度、圆柱度等)针对单一要素自身形状,不涉及基准;位置公差才需要基准。题干正确,判断为√。\n【易错】“形状公差=无基准”。口诀:形状管“自身形状”,位置管“与基准的关系”。判断一个公差是否有基准是识别形状/位置公差的关键。"}, {"id": 520, "oid": "A2-039", "type": "judge", "module": "汽车概论与机械基础", "q": "装配图中相邻两个金属零件的剖面线，应画成方向相反或方向相同而间隔不同。", "opts": [], "a": "√", "e": "【考点】装配图相邻零件剖面线。\n【解析】装配图中相邻零件剖面线要有区别:方向相反或方向相同间距不同;同一零件各视图保持一致。题干正确,判断为√。\n【易错】“相邻=不同、同一=相同”。与506题对比:506考“同一零件各视图一致”,本题考“相邻零件要区分”。同一条画法规则两种考法。"}, {"id": 521, "oid": "A2-040", "type": "judge", "module": "汽车概论与机械基础", "q": "零件图一般包括一组视图、完整的尺寸、技术要求和标题栏四方面内容。", "opts": [], "a": "√", "e": "【考点】零件图组成。\n【解析】零件图=一组视图(表达形状)+完整尺寸+技术要求(公差粗糙度等)+标题栏。题干正确,判断为√。\n【易错】“四部分:视图+尺寸+技术要求+标题栏”。这是零件图的完整内容清单,常与装配图组成对比考。"}, {"id": 522, "oid": "A2-041", "type": "judge", "module": "汽车概论与机械基础", "q": "画外螺纹时，大径用粗实线、小径用细实线表示；在投影为圆的视图上，大径圆画粗实线整圆。", "opts": [], "a": "×", "e": "【考点】外螺纹规定画法。\n【解析】外螺纹:轴向视图大径(牙顶)用粗实线、小径(牙底)用细实线;投影为圆的视图上,大径画粗实线整圆、小径画约3/4圈细实线。题干圆视图部分表述与规定不符(小径应为约3/4圈细实线),故判断为×。\n【易错】“大粗小细、圆视图小径3/4圈”。螺纹画法必记:轴向看大径粗、小径细;圆视图大径整圆、小径3/4圈(缺口在左下方)。"}, {"id": 523, "oid": "A2-042", "type": "judge", "module": "汽车概论与机械基础", "q": "在剖视图中画内螺纹时，小径（牙底）用粗实线、大径（牙顶）用细实线表示。", "opts": [], "a": "×", "e": "【考点】内螺纹剖视画法。\n【解析】剖视内螺纹:小径(牙底)粗实线、大径(牙顶)细实线,与外螺纹相反。题干说“小径细、大径粗”,错误,判断为×。\n【易错】“内外螺纹粗细相反”。外螺纹:大粗小细;内螺纹剖视:小粗大细。对比记忆是本题核心。"}, {"id": 524, "oid": "A2-043", "type": "judge", "module": "汽车概论与机械基础", "q": "用丁字尺配合图板可以方便地画出水平线，用三角板配合丁字尺可以画出竖直线和倾斜线。", "opts": [], "a": "√", "e": "【考点】绘图工具配合使用。\n【解析】丁字尺画水平线,三角板靠丁字尺画竖直线,两块三角板配合画常见角度斜线。题干正确,判断为√。\n【易错】“丁字尺水平、三角板竖直”。工具用途题:丁字尺水平线、三角板垂直线/斜线、圆规画圆、分规量取。配套记忆。"}, {"id": 525, "oid": "A2-044", "type": "judge", "module": "汽车概论与机械基础", "q": "绘图加深时，应选用较硬的H类铅笔来加深粗实线，用较软的B类铅笔来写字。", "opts": [], "a": "×", "e": "【考点】铅笔软硬选用。\n【解析】加深粗实线用较软的B或HB(线条浓黑);画细线、写字用较硬的H或2H(线条细淡)。题干颠倒,判断为×。\n【易错】“粗线用软笔”。B=Black(软黑),H=Hard(硬)。软铅笔画粗黑线,硬铅笔画细线写字。别记反。"}, {"id": 526, "oid": "A2-045", "type": "judge", "module": "汽车概论与机械基础", "q": "徒手画草图时必须使用比例尺和圆规，不能凭眼睛估计比例。", "opts": [], "a": "×", "e": "【考点】草图定义。\n【解析】草图是不用绘图仪器、凭目测比例徒手绘制的图样,贵在快速方便。题干说“必须用比例尺圆规”,错误,判断为×。\n【易错】“草图=徒手目测”。草图≠潦草,仍需比例大致准确。用了仪器的叫仪器图不是草图。"}, {"id": 527, "oid": "A2-046", "type": "judge", "module": "汽车概论与机械基础", "q": "某零件轴径标注为φ30g6，其中基本尺寸是30，g表示轴的基本偏差代号，6表示公差等级。", "opts": [], "a": "√", "e": "【考点】尺寸标注代号含义。\n【解析】φ30g6:30=基本尺寸,g=轴基本偏差代号(位置),6=公差等级(大小)。题干正确,判断为√。\n【易错】“数字=等级、字母=偏差”。φ30基本尺寸、g位置、6大小。这套“尺寸+代号+等级”读法要熟练。"}, {"id": 528, "oid": "A2-047", "type": "judge", "module": "汽车概论与机械基础", "q": "对轴与孔的配合φ30H7/g6，由于g为轴的上偏差且多为负值，因此该配合属于过盈配合。", "opts": [], "a": "×", "e": "【考点】配合性质判断。\n【解析】H7/g6是基孔制间隙配合:基准孔H下偏差为0,g轴上偏差为负→轴比孔小→间隙。g不属于过盈配合偏差。题干说“过盈”,错误,判断为×。\n【易错】“g=间隙”。g是间隙配合的典型轴偏差(a~h区间隙、j~n过渡、p~zc过盈)。区间口诀记牢。"}, {"id": 529, "oid": "A2-048", "type": "judge", "module": "汽车概论与机械基础", "q": "在零件图上标注尺寸时，应把尺寸注成封闭的尺寸链，以便各段尺寸都有明确数值。", "opts": [], "a": "×", "e": "【考点】尺寸链开口原则。\n【解析】不能注成封闭尺寸链,须留一个“开口环”不注尺寸,让误差积累在开口环上。题干说“注成封闭”,错误,判断为×。\n【易错】“留开口环”。封闭尺寸链是制图大忌。实际加工时若各段都标死,误差无处释放。这是一条重要原则。"}, {"id": 530, "oid": "A2-049", "type": "judge", "module": "汽车概论与机械基础", "q": "读装配图时，一般先从标题栏和明细栏入手了解部件名称、组成和工作原理，再分析视图。", "opts": [], "a": "√", "e": "【考点】读装配图顺序。\n【解析】读装配图顺序:先标题栏明细栏了解概况→对照视图分析装配关系→再读零件结构尺寸。题干正确,判断为√。\n【易错】“先概况后视图”。与读零件图(先标题栏)呼应。明细栏作用见575题。读图顺序题常考。"}, {"id": 531, "oid": "A2-050", "type": "single", "module": "汽车概论与机械基础", "q": "机械制图中，机件可见轮廓线应采用的图线是（　）。", "opts": [{"k": "A", "t": "粗实线"}, {"k": "B", "t": "细实线"}, {"k": "C", "t": "细虚线"}, {"k": "D", "t": "细点画线"}], "a": "A", "e": "【考点】可见轮廓线图线。\n【解析】可见轮廓用粗实线;细实线画尺寸/剖面线、细虚线画不可见轮廓、细点画线画中心线。故选A。\n【易错】“可见=粗实线”。图线用途对照表,四类线四种用途,必须分清。这是制图基础题。"}, {"id": 532, "oid": "A2-051", "type": "single", "module": "汽车概论与机械基础", "q": "下列图线中，主要用于绘制尺寸线、尺寸界线和剖面线的是（　）。", "opts": [{"k": "A", "t": "粗实线"}, {"k": "B", "t": "细实线"}, {"k": "C", "t": "细虚线"}, {"k": "D", "t": "波浪线"}], "a": "B", "e": "【考点】细实线用途。\n【解析】细实线用于尺寸线、尺寸界线、剖面线、引出线、过渡线;粗实线画可见轮廓。故选B。\n【易错】“尺寸/剖面=细实线”。细实线是用途最杂的线型。波浪线是断裂线,别混。"}, {"id": 533, "oid": "A2-052", "type": "single", "module": "汽车概论与机械基础", "q": "细双点画线通常用来表示（　）。", "opts": [{"k": "A", "t": "机件的可见轮廓"}, {"k": "B", "t": "假想投影轮廓和相邻辅助零件轮廓"}, {"k": "C", "t": "断裂边界"}, {"k": "D", "t": "轴线"}], "a": "B", "e": "【考点】细双点画线用途。\n【解析】细双点画线画假想轮廓、相邻辅助零件、极限位置轮廓。故选B。\n【易错】“双点画线=假想”。与572题重复。极限位置、运动轨迹、假想轮廓都用双点画线。"}, {"id": 534, "oid": "A2-053", "type": "single", "module": "汽车概论与机械基础", "q": "我国国家标准规定，机械图样采用的投影画法是（　）。", "opts": [{"k": "A", "t": "第三角画法"}, {"k": "B", "t": "第一角画法"}, {"k": "C", "t": "任意角画法"}, {"k": "D", "t": "中心投影"}], "a": "B", "e": "【考点】投影画法。\n【解析】我国用第一角画法(人-物-图);第三角画法(人-图-物)主要见于美日等,图样上加识别符号。故选B。\n【易错】“中国=第一角”。与501题重复。口诀:第一角“人物图”。进口图纸看识别符号防误读。"}, {"id": 535, "oid": "A2-054", "type": "single", "module": "汽车概论与机械基础", "q": "图样上标注尺寸时，尺寸线终端一般采用的形式是（　）。", "opts": [{"k": "A", "t": "斜线"}, {"k": "B", "t": "箭头"}, {"k": "C", "t": "圆点"}, {"k": "D", "t": "不画终端"}], "a": "B", "e": "【考点】尺寸线终端。\n【解析】机械图样尺寸线终端多画实心箭头;斜线终端用于建筑图。故选B。\n【易错】“机械=箭头”。箭头画法:长约4倍粗度、实心。斜线是建筑制图习惯。行业差异题。"}, {"id": 536, "oid": "A2-055", "type": "single", "module": "汽车概论与机械基础", "q": "下列符号中，表示直径的是（　）。", "opts": [{"k": "A", "t": "R"}, {"k": "B", "t": "φ"}, {"k": "C", "t": "S"}, {"k": "D", "t": "C"}], "a": "B", "e": "【考点】符号含义。\n【解析】φ=直径、R=半径、S=球面、C=45°倒角。故选B。\n【易错】“φ=直径”。符号家族:φ(直径)/R(半径)/Sφ、SR(球)/C(45°倒角)。四个符号四选一,对位记。"}, {"id": 537, "oid": "A2-056", "type": "single", "module": "汽车概论与机械基础", "q": "半圆柱形或小于半圆的圆弧，标注其尺寸时应使用（　）。", "opts": [{"k": "A", "t": "直径φ"}, {"k": "B", "t": "半径R"}, {"k": "C", "t": "球面Sφ"}, {"k": "D", "t": "边长δ"}], "a": "B", "e": "【考点】半径标注适用。\n【解析】半圆或小于半圆注半径R;整圆或大于半圆注直径φ。故选B。\n【易错】“半圆=R”。与508题互逆。判断标准:圆心角≤180°用R,整圆或大半圆用φ。"}, {"id": 538, "oid": "A2-057", "type": "single", "module": "汽车概论与机械基础", "q": "A4图纸装订时的标准幅面（短边×长边）是（　）。", "opts": [{"k": "A", "t": "210mm×297mm"}, {"k": "B", "t": "297mm×420mm"}, {"k": "C", "t": "420mm×594mm"}, {"k": "D", "t": "594mm×841mm"}], "a": "A", "e": "【考点】A4幅面尺寸。\n【解析】A4=210×297mm。故选A。\n【易错】“A4=210×297”。A3=297×420、A2=420×594、A1=594×841。记住A4两个数,其余翻倍推。"}, {"id": 539, "oid": "A2-058", "type": "single", "module": "汽车概论与机械基础", "q": "机械图样中书写的汉字字体应是（　）。", "opts": [{"k": "A", "t": "楷体"}, {"k": "B", "t": "长仿宋体"}, {"k": "C", "t": "黑体"}, {"k": "D", "t": "隶书"}], "a": "B", "e": "【考点】图样汉字字体。\n【解析】国标规定图样汉字用长仿宋体。故选B。\n【易错】“长仿宋”。楷体、黑体、隶书都不是国标图样字体。与502题重复,单选版。"}, {"id": 540, "oid": "A2-059", "type": "single", "module": "汽车概论与机械基础", "q": "图样中字号（如10号字）是指字体的（　）。", "opts": [{"k": "A", "t": "字宽"}, {"k": "B", "t": "字高"}, {"k": "C", "t": "字间距"}, {"k": "D", "t": "笔画粗细"}], "a": "B", "e": "【考点】字号含义。\n【解析】字号按字高mm划分,10号字高10mm,字宽约字高2/3。故选B。\n【易错】“字号=字高”。字号不是“号数”那样模糊概念,是具体毫米数。3.5/5/7/10号常用。"}, {"id": 541, "oid": "A2-060", "type": "single", "module": "汽车概论与机械基础", "q": "绘图比例1:2表示（　）。", "opts": [{"k": "A", "t": "图形比实物放大1倍"}, {"k": "B", "t": "图形比实物缩小一半"}, {"k": "C", "t": "图形与实物一样大"}, {"k": "D", "t": "实物是图形的1/2"}], "a": "B", "e": "【考点】比例含义。\n【解析】1:2=图形:实物,图形是实物的1/2,缩小比例。故选B。\n【易错】“1:2=缩小一半”。比例前小后大是缩小,前大后小是放大(2:1)。别反了。与499题重复。"}, {"id": 542, "oid": "A2-061", "type": "single", "module": "汽车概论与机械基础", "q": "一张零件图的标题栏一般不包含下列哪项内容（　）。", "opts": [{"k": "A", "t": "零件名称"}, {"k": "B", "t": "材料"}, {"k": "C", "t": "绘图比例"}, {"k": "D", "t": "零件的价格"}], "a": "D", "e": "【考点】标题栏内容。\n【解析】标题栏含名称、材料、比例、图号、签名等,不标零件价格。故选D。\n【易错】“价格不在标题栏”。标题栏是技术信息,价格是经营信息。这题考“不属于”,看清题目。"}, {"id": 543, "oid": "A2-062", "type": "single", "module": "汽车概论与机械基础", "q": "在绘制金属零件剖视图时，剖面线应画成（　）。", "opts": [{"k": "A", "t": "与水平成45°的等距细实线"}, {"k": "B", "t": "与水平成45°的粗实线"}, {"k": "C", "t": "竖直细实线"}, {"k": "D", "t": "任意方向的虚线"}], "a": "A", "e": "【考点】金属剖面线画法。\n【解析】金属剖面线=与水平成45°的等距细实线。故选A。\n【易错】“45°细实线”。与505题重复单选化。B粗实线、C竖直、D虚线都不对。"}, {"id": 544, "oid": "A2-063", "type": "single", "module": "汽车概论与机械基础", "q": "标注角度尺寸时，角度数字的书写方向是（　）。", "opts": [{"k": "A", "t": "随角度倾斜"}, {"k": "B", "t": "一律水平（字头朝上）"}, {"k": "C", "t": "字头朝左"}, {"k": "D", "t": "字头朝下"}], "a": "B", "e": "【考点】角度数字书写。\n【解析】角度数字一律水平书写、字头朝上。故选B。\n【易错】“角度=水平”。与498题重复。角度数字不随线倾斜,与线性尺寸数字不同。"}, {"id": 545, "oid": "A2-064", "type": "single", "module": "汽车概论与机械基础", "q": "尺寸界线一般应从下列哪项引出（　）。", "opts": [{"k": "A", "t": "轮廓线、轴线或对称中心线"}, {"k": "B", "t": "尺寸线"}, {"k": "C", "t": "剖面线"}, {"k": "D", "t": "图框线"}], "a": "A", "e": "【考点】尺寸界线引出。\n【解析】尺寸界线从轮廓线、轴线、对称中心线引出,与尺寸线垂直。故选A。\n【易错】“界线从轮廓引出”。不能从尺寸线、剖面线、图框线引出。界线一般超出尺寸线约2mm。"}, {"id": 546, "oid": "A2-065", "type": "single", "module": "汽车概论与机械基础", "q": "丁字尺在绘图中的主要作用是（　）。", "opts": [{"k": "A", "t": "画各种圆弧"}, {"k": "B", "t": "画水平线"}, {"k": "C", "t": "量取长度"}, {"k": "D", "t": "画剖面线"}], "a": "B", "e": "【考点】丁字尺用途。\n【解析】丁字尺靠图板导边上下移动画水平线。故选B。\n【易错】“丁字尺=水平线”。画圆弧用圆规、量取用分规、画斜线用三角板。工具用途题。"}, {"id": 547, "oid": "A2-066", "type": "single", "module": "汽车概论与机械基础", "q": "专门用来在图上量取和等分线段的工具是（　）。", "opts": [{"k": "A", "t": "圆规"}, {"k": "B", "t": "分规"}, {"k": "C", "t": "三角板"}, {"k": "D", "t": "曲线板"}], "a": "B", "e": "【考点】分规用途。\n【解析】分规两腿都是钢针,用于量取尺寸、转移线段、等分线段。故选B。\n【易错】“分规=量取等分”。圆规带铅芯画圆,分规两钢针量尺寸。一画一量,别混。"}, {"id": 548, "oid": "A2-067", "type": "single", "module": "汽车概论与机械基础", "q": "画圆或圆弧应使用的绘图工具是（　）。", "opts": [{"k": "A", "t": "圆规"}, {"k": "B", "t": "丁字尺"}, {"k": "C", "t": "三棱尺"}, {"k": "D", "t": "三角板"}], "a": "A", "e": "【考点】圆规用途。\n【解析】圆规带铅芯脚画圆和圆弧。故选A。\n【易错】“圆规=画圆”。丁字尺水平线、三棱尺量比例、三角板直线。工具用途对位。"}, {"id": 549, "oid": "A2-068", "type": "single", "module": "汽车概论与机械基础", "q": "在零件图上，用于确定零件加工后表面光滑程度的符号是（　）。", "opts": [{"k": "A", "t": "表面粗糙度符号"}, {"k": "B", "t": "尺寸线箭头"}, {"k": "C", "t": "剖面线"}, {"k": "D", "t": "波浪线"}], "a": "A", "e": "【考点】表面粗糙度符号。\n【解析】表面粗糙度符号标注表面光滑程度要求。故选A。\n【易错】“粗糙度=光滑度符号”。箭头是尺寸、剖面线是剖切、波浪线是断裂。与515题(Ra)配套。"}, {"id": 550, "oid": "A2-069", "type": "single", "module": "汽车概论与机械基础", "q": "图样上标注的尺寸数字表示机件的（　）。", "opts": [{"k": "A", "t": "图上量得的长度"}, {"k": "B", "t": "实际尺寸"}, {"k": "C", "t": "放大后的尺寸"}, {"k": "D", "t": "缩小后的尺寸"}], "a": "B", "e": "【考点】尺寸数字含义。\n【解析】尺寸数字=机件实际尺寸,不随比例变化。故选B。\n【易错】“数字=实际尺寸”。与500、511题同考点。图上量长度不算数,数字才算。"}, {"id": 551, "oid": "A2-070", "type": "single", "module": "汽车概论与机械基础", "q": "粗点画线在机械图中主要用于（　）。", "opts": [{"k": "A", "t": "可见轮廓线"}, {"k": "B", "t": "表示有特殊要求的表面或结构的范围线"}, {"k": "C", "t": "尺寸线"}, {"k": "D", "t": "中断线"}], "a": "B", "e": "【考点】粗点画线用途。\n【解析】粗点画线用于限定特殊要求区域(热处理、特定表面范围)。故选B。\n【易错】“粗点画线=特殊区域”。常见线型里它最特殊:粗线+点画。热处理范围标注常用。"}, {"id": 552, "oid": "A2-071", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于尺寸数字书写的说法，正确的是（　）。", "opts": [{"k": "A", "t": "任何图线都可穿过尺寸数字"}, {"k": "B", "t": "图线穿过数字时不得断开"}, {"k": "C", "t": "图线不得穿过数字，必要时断开图线"}, {"k": "D", "t": "数字可写在任意位置"}], "a": "C", "e": "【考点】尺寸数字与图线关系。\n【解析】图线不得穿过尺寸数字,必要时断开图线。故选C。\n【易错】“数字优先”。与510题重复。A“可穿过”、B“不得断开”、D“任意位置”都错。"}, {"id": 553, "oid": "A2-072", "type": "single", "module": "汽车概论与机械基础", "q": "当零件上结构相同、且均匀分布的孔（如4个φ10圆孔），国标允许（　）。", "opts": [{"k": "A", "t": "全部逐个画出并标注"}, {"k": "B", "t": "只画一个或几个，其余用细点画线表示位置并在尺寸前注明数量"}, {"k": "C", "t": "不画这些孔"}, {"k": "D", "t": "用虚线代替"}], "a": "B", "e": "【考点】相同结构孔的简化画法。\n【解析】相同且均匀分布的结构(如4个φ10孔):详细画出一个,其余用细点画线定中心位置,尺寸前注明数量(4×φ10)。故选B。\n【易错】“画一个+点画线定位+注明数量”。与593题重复。简化画法是制图效率的关键,全画既费时又易乱。"}, {"id": 554, "oid": "A2-073", "type": "single", "module": "汽车概论与机械基础", "q": "表面粗糙度符号上加注Ra3.2，表示该表面（　）。", "opts": [{"k": "A", "t": "必须用去除材料的方法获得"}, {"k": "B", "t": "是最光滑的表面"}, {"k": "C", "t": "不需要任何加工"}, {"k": "D", "t": "公差为3.2mm"}], "a": "A", "e": "【考点】表面粗糙度符号含义。\n【解析】基本符号加横线=必须用去除材料方法获得(车铣磨等);Ra3.2是轮廓算术平均偏差值。故选A。\n【易错】“加横线=去除材料”。Ra3.2不是最光滑(还有更小的0.8等),不是不加工,也不是公差。符号形态:✓/倒三角/加横线各有含义。"}, {"id": 555, "oid": "A2-074", "type": "single", "module": "汽车概论与机械基础", "q": "配合种类中，孔的尺寸大于轴的尺寸、装配后能产生相对运动的是（　）。", "opts": [{"k": "A", "t": "间隙配合"}, {"k": "B", "t": "过盈配合"}, {"k": "C", "t": "过渡配合"}, {"k": "D", "t": "过渡或过盈"}], "a": "A", "e": "【考点】配合种类定义。\n【解析】孔>轴、有间隙、可相对运动=间隙配合(滑动轴承与轴);过盈配合轴>孔,过渡配合介于之间。故选A。\n【易错】“间隙=孔大轴小”。配合三兄弟:间隙(可动)、过盈(固定)、过渡(可能间隙可能过盈)。方向记牢。"}, {"id": 556, "oid": "A2-075", "type": "single", "module": "汽车概论与机械基础", "q": "公称尺寸相同的孔与轴装配后，可能得到间隙也可能得到过盈的配合是（　）。", "opts": [{"k": "A", "t": "间隙配合"}, {"k": "B", "t": "过盈配合"}, {"k": "C", "t": "过渡配合"}, {"k": "D", "t": "任何配合"}], "a": "C", "e": "【考点】过渡配合定义。\n【解析】公差带交叠→可能小间隙也可能小过盈=过渡配合,用于定心好又需拆卸。故选C。\n【易错】“过渡=可能隙可能盈”。与555题配套。过渡配合的“两可性”是判断题和单选都爱考的点。"}, {"id": 557, "oid": "A2-076", "type": "single", "module": "汽车概论与机械基础", "q": "基孔制配合中，作为基准的孔，其基本偏差代号是（　）。", "opts": [{"k": "A", "t": "h"}, {"k": "B", "t": "H"}, {"k": "C", "t": "g"}, {"k": "D", "t": "m"}], "a": "B", "e": "【考点】基孔制基准孔代号。\n【解析】基孔制基准孔=H(下偏差0);基轴制基准轴=h(上偏差0)。孔大写、轴小写。故选B。\n【易错】“基孔=H、基轴=h”。字母大小写规则:孔大写、轴小写。g、m是轴的其他偏差代号。"}, {"id": 558, "oid": "A2-077", "type": "single", "module": "汽车概论与机械基础", "q": "下列公差中，属于位置公差的是（　）。", "opts": [{"k": "A", "t": "平面度"}, {"k": "B", "t": "圆度"}, {"k": "C", "t": "同轴度"}, {"k": "D", "t": "直线度"}], "a": "C", "e": "【考点】位置公差识别。\n【解析】同轴度需以基准轴线为参照→位置公差;平面度、圆度、直线度是形状公差,无基准。故选C。\n【易错】“同轴度=位置公差”。口诀:形状=自身形状(无基准),位置=与基准关系。同轴、平行、垂直、位置度、跳动都是位置公差。"}, {"id": 559, "oid": "A2-078", "type": "single", "module": "汽车概论与机械基础", "q": "下列公差中，属于形状公差的是（　）。", "opts": [{"k": "A", "t": "平行度"}, {"k": "B", "t": "垂直度"}, {"k": "C", "t": "圆跳动"}, {"k": "D", "t": "圆柱度"}], "a": "D", "e": "【考点】形状公差识别。\n【解析】圆柱度=圆柱面自身形状要求→形状公差;平行度、垂直度、圆跳动都要基准→位置公差。故选D。\n【易错】“圆柱度=形状”。与558题互逆。形状公差四个:直线度、平面度、圆度、圆柱度。其余带“位置关系”的都是位置公差。"}, {"id": 560, "oid": "A2-079", "type": "single", "module": "汽车概论与机械基础", "q": "零件外螺纹的规定画法是（　）。", "opts": [{"k": "A", "t": "大径粗实线、小径细实线"}, {"k": "B", "t": "大径细实线、小径粗实线"}, {"k": "C", "t": "大小径都用粗实线"}, {"k": "D", "t": "大小径都用虚线"}], "a": "A", "e": "【考点】外螺纹画法(单选)。\n【解析】外螺纹:大径(牙顶)粗实线、小径(牙底)细实线。故选A。\n【易错】“外螺纹=大粗小细”。与522题重复。圆视图上小径画3/4圈。记住“外大粗内小粗”的对比关系。"}, {"id": 561, "oid": "A2-080", "type": "single", "module": "汽车概论与机械基础", "q": "剖视图中内螺纹的规定画法是（　）。", "opts": [{"k": "A", "t": "小径粗实线、大径细实线"}, {"k": "B", "t": "小径细实线、大径粗实线"}, {"k": "C", "t": "都画虚线"}, {"k": "D", "t": "都画点画线"}], "a": "A", "e": "【考点】内螺纹剖视画法(单选)。\n【解析】剖视内螺纹:小径(牙底)粗实线、大径(牙顶)细实线,与外螺纹相反。故选A。\n【易错】“内螺纹=小粗大细”。与523题重复。内外螺纹画法正好相反,这是制图最经典的易混点。"}, {"id": 562, "oid": "A2-081", "type": "single", "module": "汽车概论与机械基础", "q": "装配图是表达部件或机器（　）的技术文件。", "opts": [{"k": "A", "t": "单个零件形状"}, {"k": "B", "t": "工作原理、装配关系和主要结构"}, {"k": "C", "t": "零件的全部尺寸"}, {"k": "D", "t": "零件材料"}], "a": "B", "e": "【考点】装配图作用。\n【解析】装配图表达工作原理、装配连接关系和主要结构,附明细栏;零件图才表达单个零件全部细节。故选B。\n【易错】“装配图=工作原理+装配关系”。A、C、D是零件图职责。两种图的分工对比是常考点。"}, {"id": 563, "oid": "A2-082", "type": "single", "module": "汽车概论与机械基础", "q": "读零件图时，首先应看（　）。", "opts": [{"k": "A", "t": "技术要求"}, {"k": "B", "t": "标题栏"}, {"k": "C", "t": "尺寸公差"}, {"k": "D", "t": "表面粗糙度"}], "a": "B", "e": "【考点】读零件图顺序。\n【解析】读零件图先看标题栏(名称/材料/比例)→再分析视图→看尺寸→看技术要求。故选B。\n【易错】“先标题栏”。与530题(读装配图先概况)呼应。读图顺序题:零件图看标题栏起步。"}, {"id": 564, "oid": "A2-083", "type": "single", "module": "汽车概论与机械基础", "q": "国标规定的基本视图共有几个（　）。", "opts": [{"k": "A", "t": "3个"}, {"k": "B", "t": "4个"}, {"k": "C", "t": "6个"}, {"k": "D", "t": "8个"}], "a": "C", "e": "【考点】基本视图数量。\n【解析】基本视图6个:主、俯、左、右、仰、后。故选C。\n【易错】“6个基本视图”。六个方向投射:前后左右上下。三视图只是常用的三个,完整是六个。"}, {"id": 565, "oid": "A2-084", "type": "single", "module": "汽车概论与机械基础", "q": "对机件上倾斜于基本投影面的结构，为表达其真实形状，可采用（　）。", "opts": [{"k": "A", "t": "局部视图"}, {"k": "B", "t": "斜视图"}, {"k": "C", "t": "旋转视图"}, {"k": "D", "t": "向视图"}], "a": "B", "e": "【考点】斜视图适用。\n【解析】倾斜结构向平行于它的辅助投影面投射→斜视图,反映实形;局部视图表达局部外形。故选B。\n【易错】“斜视图=倾斜结构实形”。与570题重复。关键:辅助投影面平行于倾斜面。"}, {"id": 566, "oid": "A2-085", "type": "single", "module": "汽车概论与机械基础", "q": "在不影响读图的前提下，零件上均匀分布的肋、轮辐等结构，当纵向剖切时（　）。", "opts": [{"k": "A", "t": "一律画剖面线"}, {"k": "B", "t": "按不剖处理（不画剖面线），并用粗实线与相邻部分分开"}, {"k": "C", "t": "用虚线表示"}, {"k": "D", "t": "必须移出"}], "a": "B", "e": "【考点】肋的剖视简化画法。\n【解析】肋、轮辐、薄壁沿纵向剖切按不剖处理(不画剖面线),用粗实线与相邻部分分开。故选B。\n【易错】“纵向剖切不画剖面线”。这是简化规定:肋不是实体性结构,纵向剖不画线。横向剖切才画。"}, {"id": 567, "oid": "A2-086", "type": "single", "module": "汽车概论与机械基础", "q": "绘制机械图样时，对对称机件的视图，允许只画一半或四分之一，并在对称中心线两端画出（　）。", "opts": [{"k": "A", "t": "两条与之垂直的平行细实线（对称符号）"}, {"k": "B", "t": "箭头"}, {"k": "C", "t": "剖面线"}, {"k": "D", "t": "波浪线"}], "a": "A", "e": "【考点】对称机件简化画法。\n【解析】对称机件可画半幅或1/4幅,对称中心线两端画两条垂直平行细实线(对称符号)。故选A。\n【易错】“对称符号=两条垂直细实线”。简化画法:中心线+对称符号表示“另一边对称”。读懂符号含义就不会误解图形。"}, {"id": 568, "oid": "A2-087", "type": "single", "module": "汽车概论与机械基础", "q": "图样中用于表示零件上正方形截面边长的符号是（　）。", "opts": [{"k": "A", "t": "δ"}, {"k": "B", "t": "□"}, {"k": "C", "t": "R"}, {"k": "D", "t": "C"}], "a": "B", "e": "【考点】正方形截面符号。\n【解析】正方形边长前加□,如□20;δ/t=板厚、R=半径、C=45°倒角。故选B。\n【易错】“□=正方形”。符号对位:□正方形、δ板厚、R半径、C倒角。别把□当直径。"}, {"id": 569, "oid": "A2-088", "type": "single", "module": "汽车概论与机械基础", "q": "对零件上的退刀槽，通常标注形式为（　）。", "opts": [{"k": "A", "t": "槽宽×槽深（或槽宽×直径）"}, {"k": "B", "t": "只注长度"}, {"k": "C", "t": "只注角度"}, {"k": "D", "t": "用R即可"}], "a": "A", "e": "【考点】退刀槽标注。\n【解析】退刀槽标注“槽宽×槽深”或“槽宽×槽底直径”(如2×φ20)。故选A。\n【易错】“槽宽×槽深”。退刀槽为车刀让刀留空隙,标注两个数。不是只标长度或角度。"}, {"id": 570, "oid": "A2-089", "type": "single", "module": "汽车概论与机械基础", "q": "将机件向不平行于任何基本投影面的平面投射所得的视图，称为（　）。", "opts": [{"k": "A", "t": "斜视图"}, {"k": "B", "t": "基本视图"}, {"k": "C", "t": "局部视图"}, {"k": "D", "t": "右视图"}], "a": "A", "e": "【考点】斜视图定义。\n【解析】斜视图=向不平行于任何基本投影面的平面投射;基本视图是六正方向、局部视图只表达局部。故选A。\n【易错】“斜视图=非基本投影面”。与565题重复。倾斜结构才需要斜视图。"}, {"id": 571, "oid": "A2-090", "type": "single", "module": "汽车概论与机械基础", "q": "国标规定粗实线宽度d的可选范围一般为（　）。", "opts": [{"k": "A", "t": "0.15～2mm"}, {"k": "B", "t": "0.5～2mm"}, {"k": "C", "t": "5～10mm"}, {"k": "D", "t": "与字高无关任意选"}], "a": "B", "e": "【考点】粗实线宽度范围。\n【解析】粗线宽d在0.5~2mm选取,细线d/2。故选B。\n【易错】“粗线0.5~2mm”。0.15mm是细线级别,5-10mm太粗。数字范围题,记0.5~2。"}, {"id": 572, "oid": "A2-091", "type": "single", "module": "汽车概论与机械基础", "q": "下列哪种图线可用于表示运动零件的极限位置和中间位置（　）。", "opts": [{"k": "A", "t": "粗实线"}, {"k": "B", "t": "细双点画线"}, {"k": "C", "t": "细虚线"}, {"k": "D", "t": "波浪线"}], "a": "B", "e": "【考点】细双点画线用途。\n【解析】运动零件极限位置、初始位置、相邻辅助零件轮廓用细双点画线。故选B。\n【易错】“极限位置=双点画线”。与533题重复。想象机构运动图:虚线是极限位置。"}, {"id": 573, "oid": "A2-092", "type": "single", "module": "汽车概论与机械基础", "q": "画在视图外、用于表达机件某局部结构并用波浪线（或双折线）断开的视图是（　）。", "opts": [{"k": "A", "t": "局部视图"}, {"k": "B", "t": "斜视图"}, {"k": "C", "t": "全剖视图"}, {"k": "D", "t": "断面图"}], "a": "A", "e": "【考点】局部视图定义。\n【解析】局部视图=表达局部外形,断裂处用波浪线或双折线,配置在视图外。故选A。\n【易错】“局部视图=局部外形”。与斜视图区分:局部视图切的是基本方向上的局部,斜视图是倾斜面实形。"}, {"id": 574, "oid": "A2-093", "type": "single", "module": "汽车概论与机械基础", "q": "中心孔在零件图上的标注，下列说法正确的是（　）。", "opts": [{"k": "A", "t": "中心孔不必在图上标注"}, {"k": "B", "t": "中心孔可用规定符号标注其类型和尺寸"}, {"k": "C", "t": "中心孔只能用剖视表达"}, {"k": "D", "t": "中心孔按螺纹标注"}], "a": "B", "e": "【考点】中心孔标注。\n【解析】中心孔可用规定符号标注类型和尺寸(如A型),不必画出详细结构。故选B。\n【易错】“中心孔=符号标注”。轴两端中心孔是加工定位基准,符号标注简化。A“不必标注”错,C“只能剖视”错。"}, {"id": 575, "oid": "A2-094", "type": "single", "module": "汽车概论与机械基础", "q": "读装配图时，明细栏的作用是（　）。", "opts": [{"k": "A", "t": "列出零件序号、名称、数量和材料等"}, {"k": "B", "t": "表示尺寸公差"}, {"k": "C", "t": "表示表面粗糙度"}, {"k": "D", "t": "表示投影方向"}], "a": "A", "e": "【考点】明细栏作用。\n【解析】明细栏列出零件序号、名称、数量、材料、备注,与视图序号对应。故选A。\n【易错】“明细栏=零件清单”。与标题栏区分:标题栏=本图信息,明细栏=零件组成清单。读装配图先看明细栏。"}, {"id": 576, "oid": "A2-095", "type": "single", "module": "汽车概论与机械基础", "q": "零件图上标注φ50H7，其中数字“7”表示（　）。", "opts": [{"k": "A", "t": "基本尺寸"}, {"k": "B", "t": "孔的公差等级"}, {"k": "C", "t": "孔的基本偏差"}, {"k": "D", "t": "实际尺寸"}], "a": "B", "e": "【考点】公差代号含义。\n【解析】φ50H7:50=基本尺寸、H=孔基本偏差、7=公差等级(IT7)。数字大→公差带宽→精度低。故选B。\n【易错】“7=公差等级”。与527题(轴g6)配套。数字管大小,字母管位置。精度:IT6比IT7高。"}, {"id": 577, "oid": "A2-096", "type": "single", "module": "汽车概论与机械基础", "q": "已知某轴尺寸标注为φ30±0.02，则该轴的公差为（　）。", "opts": [{"k": "A", "t": "0.02mm"}, {"k": "B", "t": "0.04mm"}, {"k": "C", "t": "30mm"}, {"k": "D", "t": "0mm"}], "a": "B", "e": "【考点】公差计算。\n【解析】公差=上偏差−下偏差=0.02−(−0.02)=0.04mm。故选B。\n【易错】“上−下”。±0.02的公差是0.04不是0.02。别把公差当“偏差的绝对值”。计算:最大−最小。"}, {"id": 578, "oid": "A2-097", "type": "single", "module": "汽车概论与机械基础", "q": "配合φ20H7/h6属于（　）。", "opts": [{"k": "A", "t": "基孔制间隙配合"}, {"k": "B", "t": "基轴制过盈配合"}, {"k": "C", "t": "基孔制过盈配合"}, {"k": "D", "t": "过渡配合"}], "a": "A", "e": "【考点】配合性质判断。\n【解析】H7基准孔+ h6(上偏差0的轴)=基孔制间隙配合,用于可滑动定心。故选A。\n【易错】“H/h=间隙”。基孔制H、基轴制h,两者配合是间隙配合的经典组合。与528题(g间隙)呼应。"}, {"id": 579, "oid": "A2-098", "type": "single", "module": "汽车概论与机械基础", "q": "某滚动轴承内孔与轴配合选用φ20H7/k6，该配合最可能属于（　）。", "opts": [{"k": "A", "t": "间隙配合"}, {"k": "B", "t": "过盈配合"}, {"k": "C", "t": "过渡配合"}, {"k": "D", "t": "无配合"}], "a": "C", "e": "【考点】过渡配合识别。\n【解析】k轴基本偏差在过渡区,H7/k6可能有小过盈或小间隙→过渡配合。故选C。\n【易错】“k=过渡”。偏差区间口诀:a~h间隙、j~n过渡、p~zc过盈。k在过渡区。轴承与轴常用过渡配合定心。"}, {"id": 580, "oid": "A2-099", "type": "single", "module": "汽车概论与机械基础", "q": "在零件图上，既要标注尺寸又要标注公差和表面粗糙度，其主要目的是（　）。", "opts": [{"k": "A", "t": "便于美观"}, {"k": "B", "t": "保证零件加工精度和互换性"}, {"k": "C", "t": "增加题量"}, {"k": "D", "t": "满足绘图习惯"}], "a": "B", "e": "【考点】公差粗糙度的作用。\n【解析】公差+配合+粗糙度规定加工精度和表面质量→保证零件达到设计要求、实现互换装配。故选B。\n【易错】“公差粗糙度=保证精度和互换性”。这是互换性生产的技术基础。A美观、C题量、D习惯都不是目的。"}, {"id": 581, "oid": "A2-100", "type": "single", "module": "汽车概论与机械基础", "q": "看零件图时，根据视图想象出零件形状，并搞清尺寸和技术要求，这种过程称为（　）。", "opts": [{"k": "A", "t": "测绘"}, {"k": "B", "t": "读图（识图）"}, {"k": "C", "t": "抄图"}, {"k": "D", "t": "描图"}], "a": "B", "e": "【考点】读图定义。\n【解析】读图(识图)=根据视图投影关系想象立体形状、理解尺寸和技术要求;测绘=凭实物测量画草图。故选B。\n【易错】“读图=识图”。抄图、描图是依样画葫芦,测绘是实物反推图纸。术语对位题。"}, {"id": 582, "oid": "A2-101", "type": "single", "module": "汽车概论与机械基础", "q": "对形状复杂、内部结构较多的零件，仅用外形视图不能表达清楚时，最有效的表达方法是（　）。", "opts": [{"k": "A", "t": "放大比例"}, {"k": "B", "t": "采用剖视图"}, {"k": "C", "t": "增加虚线"}, {"k": "D", "t": "改用网格纸"}], "a": "B", "e": "【考点】剖视图作用。\n【解析】剖视图假想剖开零件,移去前部投射剩余部分,清楚表达内部孔腔,比虚线清晰。故选B。\n【易错】“内部复杂=剖视”。放大比例不解决表达问题、增加虚线反而更乱。剖视是表达内部结构的主要手段。"}, {"id": 583, "oid": "A2-102", "type": "single", "module": "汽车概论与机械基础", "q": "当只需要表达机件上某一局部断面形状（如键槽深度）时，应采用（　）。", "opts": [{"k": "A", "t": "断面图"}, {"k": "B", "t": "全剖视图"}, {"k": "C", "t": "局部放大图"}, {"k": "D", "t": "向视图"}], "a": "A", "e": "【考点】断面图适用。\n【解析】断面图只画剖切处断面形状(键槽、肋、型材);剖视图除断面外还画剩余可见部分。故选A。\n【易错】“断面图=只画断面”。与剖视图区别:断面图不画剖切面后的投影。表达键槽深度用断面图最简洁。"}, {"id": 584, "oid": "A2-103", "type": "single", "module": "汽车概论与机械基础", "q": "移出断面图的轮廓线用（　）绘制。", "opts": [{"k": "A", "t": "粗实线"}, {"k": "B", "t": "细实线"}, {"k": "C", "t": "细虚线"}, {"k": "D", "t": "点画线"}], "a": "A", "e": "【考点】移出断面轮廓线。\n【解析】移出断面画在视图外,轮廓用粗实线;重合断面画在视图内,轮廓用细实线。故选A。\n【易错】“移出=粗、重合=细”。两种断面图位置不同、线型不同。对比记忆。"}, {"id": 585, "oid": "A2-104", "type": "single", "module": "汽车概论与机械基础", "q": "同一装配图中，画相邻两个零件的剖面线时，正确做法是（　）。", "opts": [{"k": "A", "t": "两零件剖面线完全相同"}, {"k": "B", "t": "方向相反或同方向但间距不同"}, {"k": "C", "t": "都不画剖面线"}, {"k": "D", "t": "用粗实线代替"}], "a": "B", "e": "【考点】相邻零件剖面线。\n【解析】相邻零件剖面线方向相反或同向间距不同;同一零件各视图一致。故选B。\n【易错】“相邻=区分”。与520题重复单选化。判断装配图零件分界就看剖面线差异。"}, {"id": 586, "oid": "A2-105", "type": "single", "module": "汽车概论与机械基础", "q": "画半剖视图时，以对称中心线为界，一半画成视图、一半画成剖视图，其适用条件是（　）。", "opts": [{"k": "A", "t": "内外形状都需要表达且机件左右（或上下）对称"}, {"k": "B", "t": "只有外形"}, {"k": "C", "t": "只有内部且不对称"}, {"k": "D", "t": "任意零件"}], "a": "A", "e": "【考点】半剖视图适用条件。\n【解析】半剖适用于内外都需表达且左右(或上下)对称的机件:一半视图一半剖视,点画线分界。故选A。\n【易错】“半剖=对称”。不对称不能半剖(会误导)。半剖以对称中心线为界,分界处不画轮廓线。"}, {"id": 587, "oid": "A2-106", "type": "single", "module": "汽车概论与机械基础", "q": "当机件只有局部内部结构需要表达，又没有必要全剖时，应采用（　）。", "opts": [{"k": "A", "t": "局部剖视图"}, {"k": "B", "t": "全剖视图"}, {"k": "C", "t": "半剖视图"}, {"k": "D", "t": "旋转剖视图"}], "a": "A", "e": "【考点】局部剖视图。\n【解析】局部剖以波浪线分界,只剖需要表达的部位,灵活保留大部分外形。故选A。\n【易错】“局部剖=波浪线分界”。全剖全切开、半剖对称切、局部剖局部切。三个剖视按需求选。"}, {"id": 588, "oid": "A2-107", "type": "single", "module": "汽车概论与机械基础", "q": "国标规定的第一角画法识别符号，其图形是（　）。", "opts": [{"k": "A", "t": "圆锥台在左侧、圆柱在右侧的投影示意"}, {"k": "B", "t": "两个圆"}, {"k": "C", "t": "三角形"}, {"k": "D", "t": "正方形"}], "a": "A", "e": "【考点】第一角画法识别符号。\n【解析】第一角识别符号=圆锥台(左)+圆柱(右)的投影示意;第三角相反(圆柱左、锥台右)。故选A。\n【易错】“锥台左柱右=第一角”。识别符号图形要认得出。第三角画法图纸靠这个符号区分。"}, {"id": 589, "oid": "A2-108", "type": "single", "module": "汽车概论与机械基础", "q": "将机件的部分结构用大于原图的比例画出的图形，称为（　）。", "opts": [{"k": "A", "t": "局部放大图"}, {"k": "B", "t": "斜视图"}, {"k": "C", "t": "向视图"}, {"k": "D", "t": "剖视图"}], "a": "A", "e": "【考点】局部放大图。\n【解析】局部放大图把细小结构(退刀槽、牙型)按大比例单独画出,细实线圈出部位,标罗马数字和比例。故选A。\n【易错】“局部放大=大比例”。与600题配套:标注“I 2:1”。罗马数字编号对应原图圈注。"}, {"id": 590, "oid": "A2-109", "type": "single", "module": "汽车概论与机械基础", "q": "在零件图上，下列尺寸标注组合最合理的是（　）。", "opts": [{"k": "A", "t": "注成封闭尺寸链"}, {"k": "B", "t": "重要尺寸直接标注，其余按加工顺序标注并留开口环"}, {"k": "C", "t": "所有尺寸都从同一基准引出"}, {"k": "D", "t": "重复标注同一尺寸"}], "a": "B", "e": "【考点】尺寸标注原则。\n【解析】合理标注:重要尺寸直接注出、按加工顺序注其余、避免封闭链和重复标注。故选B。\n【易错】“重要尺寸直接注”。A封闭链是错的,C全部同一基准不实际,D重复标注禁止。综合判断题。"}, {"id": 591, "oid": "A2-110", "type": "single", "module": "汽车概论与机械基础", "q": "一张完整的零件图中，用于说明零件热处理、表面处理等要求的是（　）。", "opts": [{"k": "A", "t": "标题栏"}, {"k": "B", "t": "技术要求（文字说明）"}, {"k": "C", "t": "明细栏"}, {"k": "D", "t": "视图名称"}], "a": "B", "e": "【考点】技术要求内容。\n【解析】热处理、表面处理、未注圆角倒角等文字要求写在“技术要求”栏。故选B。\n【易错】“技术要求=文字说明”。标题栏是名称材料比例,明细栏是零件清单,视图名称是视图标记。四者职责分清。"}, {"id": 592, "oid": "A2-111", "type": "single", "module": "汽车概论与机械基础", "q": "绘制机械图样时，确定主视图的选择原则是（　）。", "opts": [{"k": "A", "t": "任意选一个方向"}, {"k": "B", "t": "最能反映零件形状结构特征和加工（或工作）位置的方向"}, {"k": "C", "t": "图纸最大的方向"}, {"k": "D", "t": "线条最少的方向"}], "a": "B", "e": "【考点】主视图选择原则。\n【解析】主视图选最能反映零件形状结构特征、兼顾加工或工作位置的方向。故选B。\n【易错】“主视图=形状特征”。A任意、C最大方向、D线条最少都是错误标准。形状特征原则+工作位置原则。"}, {"id": 593, "oid": "A2-112", "type": "single", "module": "汽车概论与机械基础", "q": "对长杆件（如轴、连杆）上相同结构（如多个键槽）均匀分布时，国标允许（　）。", "opts": [{"k": "A", "t": "详细画出全部"}, {"k": "B", "t": "只画一处，其余用点画线标明位置"}, {"k": "C", "t": "完全省略"}, {"k": "D", "t": "用虚线全部画出"}], "a": "B", "e": "【考点】相同结构简化画法。\n【解析】相同结构均匀分布时只详细画一处,其余用点画线标明位置并注明数量。故选B。\n【易错】“画一处+点画线定位”。与553题重复(孔、键槽都适用)。简化画法三要素:画一、定位、注数。"}, {"id": 594, "oid": "A2-113", "type": "single", "module": "汽车概论与机械基础", "q": "下列关于图纸幅面与图框的说法，正确的是（　）。", "opts": [{"k": "A", "t": "需要装订的图框四边留边相等"}, {"k": "B", "t": "需要装订时一侧留装订边a，其余留c边"}, {"k": "C", "t": "图框可画在图纸中央任意位置"}, {"k": "D", "t": "不留装订边时不画图框"}], "a": "B", "e": "【考点】图框留边规定。\n【解析】需装订:一侧留装订边a,其余留c;不装订:四边留e。图框用粗实线。故选B。\n【易错】“装订边≠四边相等”。a比c宽(留装订孔位)。图框粗实线、图纸边界细实线。"}, {"id": 595, "oid": "A2-114", "type": "single", "module": "汽车概论与机械基础", "q": "读零件图分析尺寸时，首先要找出（　）。", "opts": [{"k": "A", "t": "最大的尺寸"}, {"k": "B", "t": "尺寸基准（设计基准）"}, {"k": "C", "t": "最长的尺寸线"}, {"k": "D", "t": "最多的数字"}], "a": "B", "e": "【考点】尺寸基准。\n【解析】读尺寸先找尺寸基准(设计/工艺基准),再看定形定位尺寸。故选B。\n【易错】“先找基准”。基准是标注和测量的起点。没有基准,尺寸无从分析。"}, {"id": 596, "oid": "A2-115", "type": "single", "module": "汽车概论与机械基础", "q": "当零件上有若干不同直径的同轴圆柱面时，读图时判断其轴向位置关系主要依据（　）。", "opts": [{"k": "A", "t": "尺寸数字大小"}, {"k": "B", "t": "视图上各端面的投影对应及轴向定位尺寸"}, {"k": "C", "t": "线条颜色"}, {"k": "D", "t": "剖面线方向"}], "a": "B", "e": "【考点】同轴圆柱读图。\n【解析】同轴圆柱轴向位置靠视图端面投影对应+轴向定位尺寸判断,不能只看直径数字。故选B。\n【易错】“投影对应+定位尺寸”。直径数字只说明大小,不说明位置。长轴类零件(阶梯轴)读图要点。"}, {"id": 597, "oid": "A2-116", "type": "single", "module": "汽车概论与机械基础", "q": "在装配图中，若两个零件配合表面间隙很小，按国标规定（　）。", "opts": [{"k": "A", "t": "必须画成两条粗实线"}, {"k": "B", "t": "配合表面只画一条轮廓线"}, {"k": "C", "t": "用虚线表示"}, {"k": "D", "t": "用波浪线分开"}], "a": "B", "e": "【考点】装配图配合表面画法。\n【解析】两零件配合(接触)表面只画一条轮廓线;非配合有间隙的表面画两条线。故选B。\n【易错】“配合面一条线”。这是装配图基本规定。间隙小也画一条,表示实际配合接触。"}, {"id": 598, "oid": "A2-117", "type": "single", "module": "汽车概论与机械基础", "q": "机械图样上不可见轮廓原来用虚线，改用剖视表达后（　）。", "opts": [{"k": "A", "t": "虚线仍要保留"}, {"k": "B", "t": "剖到的内部轮廓变为粗实线，一般不再画虚线"}, {"k": "C", "t": "全部用点画线"}, {"k": "D", "t": "用细实线"}], "a": "B", "e": "【考点】剖视后虚线处理。\n【解析】剖视图已表达清楚的内部结构用粗实线,一般不再画虚线;只有未表达清的才补虚线。故选B。\n【易错】“剖后免虚线”。虚线冗余是制图禁忌。剖视的目的之一就是替代虚线表达内部。"}, {"id": 599, "oid": "A2-118", "type": "single", "module": "汽车概论与机械基础", "q": "关于比例的选用，下列做法正确的是（　）。", "opts": [{"k": "A", "t": "不论零件大小都用1:1"}, {"k": "B", "t": "尽量按实物大小画图，过小或过大时才用放大或缩小比例"}, {"k": "C", "t": "复杂零件一律放大10倍"}, {"k": "D", "t": "比例可随意，与标注无关"}], "a": "B", "e": "【考点】比例选用原则。\n【解析】优先1:1直观,过小放大、过大缩小,用国标规定比例,标注仍为实物尺寸。故选B。\n【易错】“优先1:1”。A“不论大小都用1:1”不实际,C放大10倍武断,D比例与标注无关错。按需选比例。"}, {"id": 600, "oid": "A2-119", "type": "single", "module": "汽车概论与机械基础", "q": "图样中画出的局部放大图上方标注“I 2:1”，其含义是（　）。", "opts": [{"k": "A", "t": "第I处放大图，放大比例为2:1"}, {"k": "B", "t": "零件总长2:1"}, {"k": "C", "t": "缩小一半"}, {"k": "D", "t": "粗糙度等级"}], "a": "A", "e": "【考点】局部放大图标注。\n【解析】“I 2:1”=第I处放大部位,放大比例2:1,与原图圈注编号对应。故选A。\n【易错】“罗马数字=编号、数字=比例”。与589题配套。B、C、D含义错误。"}, {"id": 601, "oid": "A2-120", "type": "single", "module": "汽车概论与机械基础", "q": "下列做法中，不符合机械制图国家标准的是（　）。", "opts": [{"k": "A", "t": "尺寸数字不被图线穿过"}, {"k": "B", "t": "同一零件各视图剖面线方向间隔一致"}, {"k": "C", "t": "把尺寸链注成封闭形式"}, {"k": "D", "t": "标题栏位于右下角"}], "a": "C", "e": "【考点】国标规定符合性(反向)。\n【解析】封闭尺寸链使各段尺寸精度互相牵制,不符合国标;其余三项都是国标正确规定。故选C(题干问“不符合的”)。\n【易错】“封闭链=禁止”。A数字不被穿过、B剖面线一致、D标题栏右下角都正确。找“不符合”选项,选中C。"}, {"id": 602, "oid": "A2-121", "type": "judge", "module": "汽车概论与机械基础", "q": "制图时画圆应使用圆规，而量取和等分线段应使用分规。", "opts": [], "a": "√", "e": "【考点】绘图工具用途。\n【解析】圆规带铅芯画圆和圆弧;分规两腿钢针量取尺寸、转移线段、等分线段。题干正确,判断为√。\n【易错】“圆规画圆、分规量取”。与547、548题重复。两规用途不同不能互换。工具题高频。"}, {"id": 603, "oid": "A2-122", "type": "single", "module": "汽车概论与机械基础", "q": "下列图纸幅面代号中，幅面面积最大的是（　）。", "opts": [{"k": "A", "t": "A4"}, {"k": "B", "t": "A3"}, {"k": "C", "t": "A2"}, {"k": "D", "t": "A1"}], "a": "D", "e": "【考点】幅面大小比较。\n【解析】A1=594×841mm最大,A2=420×594、A3=297×420、A4=210×297依次变小。故选D。\n【易错】“代号小=面积大”。A0最大(1189×841),往下每号减半。A1在选项中最大。别被“A4常用”误导。"}, {"id": 604, "oid": "A2-123", "type": "single", "module": "汽车概论与机械基础", "q": "机械图样中采用2:1的比例，属于（　）。", "opts": [{"k": "A", "t": "放大比例"}, {"k": "B", "t": "缩小比例"}, {"k": "C", "t": "原值比例"}, {"k": "D", "t": "等比比例"}], "a": "A", "e": "【考点】放大比例。\n【解析】2:1=图形:实物=2:1,图形比实物放大一倍→放大比例。故选A。\n【易错】“2:1=放大”。与541题互逆:1:2缩小、2:1放大、1:1原值。比例前后顺序决定放大缩小。"}, {"id": 605, "oid": "A2-124", "type": "single", "module": "汽车概论与机械基础", "q": "金属零件剖视图中，剖面线一般与水平方向成（　）。", "opts": [{"k": "A", "t": "30°"}, {"k": "B", "t": "45°"}, {"k": "C", "t": "60°"}, {"k": "D", "t": "90°"}], "a": "B", "e": "【考点】剖面线角度。\n【解析】金属剖面线与水平成45°(或135°),等距细实线。故选B。\n【易错】“45°”。与505、543题重复。30°/60°/90°都是干扰。同一零件各视图方向间距一致。"}, {"id": 606, "oid": "A2-125", "type": "single", "module": "汽车概论与机械基础", "q": "零件图标题栏在图框中的位置一般是（　）。", "opts": [{"k": "A", "t": "左上角"}, {"k": "B", "t": "右下角"}, {"k": "C", "t": "正中央"}, {"k": "D", "t": "右上角"}], "a": "B", "e": "【考点】标题栏位置。\n【解析】标题栏在右下角,与读图方向一致。故选B。\n【易错】“右下角”。与504题重复。看图先找右下角标题栏。"}, {"id": 607, "oid": "B1-004", "type": "judge", "module": "汽车发动机维修", "q": "使用举升机举升车辆进行发动机底盘作业时，车辆升至工作高度后不必落下安全锁止臂，因为液压系统能自动保压。", "opts": [], "a": "×", "e": "【考点】举升机安全锁止。\n【解析】举升到工作高度必须确认机械安全锁止臂可靠啮合后才可车下作业;液压系统可能泄漏泄压,仅靠保压不安全。题干说法错误,判断为×。\n【易错】“必须锁止”。液压保压不可靠,机械锁止是第二道防线。这是车下作业第一安全守则。"}, {"id": 608, "oid": "B1-005", "type": "judge", "module": "汽车发动机维修", "q": "在车间地面直接用千斤顶顶起车辆后，人即可钻到车下进行发动机维修，无需再用安全支座支撑。", "opts": [], "a": "×", "e": "【考点】千斤顶与安全支座。\n【解析】千斤顶只用于举升,不能长期承重;车下作业必须换安全支座垫实,防泄压滑卸压伤。题干说法错误,判断为×。\n【易错】“千斤顶+支座搭配”。与649题配套。砖块易碎不能用。安全支座顶在指定支承点。"}, {"id": 609, "oid": "B1-006", "type": "judge", "module": "汽车发动机维修", "q": "发动机运转时，为检查皮带或风扇状况，可以用手直接靠近或接触旋转的风扇和皮带轮。", "opts": [], "a": "×", "e": "【考点】旋转部件防护。\n【解析】运转中严禁手靠近风扇、皮带轮等旋转部件,防卷入绞伤,须停机检查。题干说法错误,判断为×。\n【易错】“旋转件禁摸”。与653题配套。运转检查看转速、听声音、观现象,不碰实物。"}, {"id": 610, "oid": "B1-007", "type": "judge", "module": "汽车发动机维修", "q": "拆卸燃油管接头前，应对燃油系统进行泄压，防止带压燃油喷出遇火源引发火灾或喷溅伤人。", "opts": [], "a": "√", "e": "【考点】燃油系统泄压。\n【解析】电动燃油泵保持约300kPa压力,拆管前先泄压,防高压燃油喷出遇火源起火伤人。题干正确,判断为√。\n【易错】“拆管前泄压”。与651题配套。泄压方法:拔燃油泵保险/继电器,让发动机运转到熄火。"}, {"id": 611, "oid": "B1-008", "type": "judge", "module": "汽车发动机维修", "q": "车间内进行发动机大修时，可以用汽油清洗手上油污和零件，因为汽油去污效果好。", "opts": [], "a": "×", "e": "【考点】禁用汽油清洗。\n【解析】汽油闪点低易挥发,与空气形成爆炸性混合气,严禁洗手指油污和大量清洗零件;用专用清洗剂。题干说法错误,判断为×。\n【易错】“汽油禁洗手”。汽油去污强但极危险。清冼件用金属清洗剂、煤油替代也要通风防火。"}, {"id": 612, "oid": "B1-009", "type": "judge", "module": "汽车发动机维修", "q": "蓄电池电解液溅到皮肤上时，应立即用大量清水冲洗，再就医处理。", "opts": [], "a": "√", "e": "【考点】电解液灼伤处理。\n【解析】电解液(稀硫酸)溅皮肤/眼睛:立即大量清水冲洗15分钟以上并就医。题干正确,判断为√。\n【易错】“先冲洗再就医”。不能干布擦(会扩大灼伤面积)。大量水冲洗是第一步。酸碱灼伤通用处理。"}, {"id": 613, "oid": "B1-010", "type": "judge", "module": "汽车发动机维修", "q": "发动机排气中的一氧化碳无色无味，在密闭车间怠速运转发动机会造成人员中毒。", "opts": [], "a": "√", "e": "【考点】CO中毒预防。\n【解析】CO无色无味,与血红蛋白结合致缺氧,密闭车间怠速运转会中毒;必须通风或排气管引出室外。题干正确,判断为√。\n【易错】“CO无色无味”。CO是发动机尾气主要毒物,比气味刺鼻的汽油味更危险。与650题配套。"}, {"id": 614, "oid": "B1-011", "type": "judge", "module": "汽车发动机维修", "q": "在运转的发动机旁作业时，可以穿宽松飘逸的长袖工作服、戴手表和手链，不会有安全问题。", "opts": [], "a": "×", "e": "【考点】运转发动机旁着装安全。\n【解析】运转发动机旁禁止宽松衣物、首饰、散长发,防止被旋转部件卷入;应穿合体工作服、束紧袖口、束发。题干说法错误,判断为×。\n【易错】“宽松衣物=卷入风险”。与662题配套。着装三禁:宽松、首饰、长发。发动机维修车间劳保是硬要求。"}, {"id": 615, "oid": "B1-012", "type": "judge", "module": "汽车发动机维修", "q": "发现地面有机油、冷却液滴落时，应及时清理并铺设吸油垫，防止人员滑倒。", "opts": [], "a": "√", "e": "【考点】地面油液清理。\n【解析】机油防冻液滴落地面湿滑易滑倒,应及时用吸油棉、沙土覆盖清理,保持工位整洁。题干正确,判断为√。\n【易错】“及时清+吸油垫”。滑倒是维修车间高发事故。发现滴漏先处理再继续作业。"}, {"id": 616, "oid": "B1-013", "type": "judge", "module": "汽车发动机维修", "q": "发动机温度过高“开锅”时，应立即打开散热器盖加水降温。", "opts": [], "a": "×", "e": "【考点】开锅处理。\n【解析】“开锅”时系统高压高温,立即开盖会喷出滚烫蒸汽沸水烫伤;应自然降温泄压后再缓慢开盖。题干说法错误,判断为×。\n【易错】“开锅不能立即开盖”。与656题配套。高温高压是烫伤根源,先降温泄压。"}, {"id": 617, "oid": "B1-014", "type": "judge", "module": "汽车发动机维修", "q": "车间配置的干粉灭火器适用于扑救燃油、电器和一般固体火灾，应放置在明显易取处并定期检查压力。", "opts": [], "a": "√", "e": "【考点】干粉灭火器。\n【解析】干粉灭火器可扑救可燃液体、带电设备和一般固体初起火灾,常备车间,压力表指针应在绿区。题干正确,判断为√。\n【易错】“干粉=油/电/固通用”。灭火器分类:干粉(万能)、CO2(电器)、泡沫(油)。压力绿区才有效。"}, {"id": 618, "oid": "B1-015", "type": "judge", "module": "汽车发动机维修", "q": "举升车辆时，应将举升臂支撑在制造厂指定的举升点，不能顶在油底壳、下护板等薄弱部位。", "opts": [], "a": "√", "e": "【考点】举升点选择。\n【解析】举升臂必须顶在制造厂指定的举升点(门槛加强筋、纵梁),不能顶油底壳、下护板等薄弱部位。题干正确,判断为√。\n【易错】“举升点=加强部位”。油底壳承力弱会压裂。双柱举升机两臂对称落在指定点(637题)。"}, {"id": 619, "oid": "B1-016", "type": "judge", "module": "汽车发动机维修", "q": "拆卸沉重的发动机总成时，必须使用起重设备并挂好吊点，禁止多人徒手抬运。", "opts": [], "a": "√", "e": "【考点】发动机总成吊装。\n【解析】发动机总成百公斤级,必须用行车/葫芦挂专用吊耳吊装,禁止徒手抬运,吊物下方严禁站人。题干正确,判断为√。\n【易错】“重件用起重设备”。徒手抬运易扭腰砸脚。吊装要点:挂专用吊耳、下方不站人。"}, {"id": 620, "oid": "B1-017", "type": "judge", "module": "汽车发动机维修", "q": "维修发动机电气线路时，可以不断开蓄电池电源，带电插拔ECU插头不会损坏电子元件。", "opts": [], "a": "×", "e": "【考点】带电插拔ECU插头。\n【解析】带电插拔ECU、传感器插头产生瞬时过电压,易击穿微电子元件;拆装前先断开蓄电池负极。题干说法错误,判断为×。\n【易错】“先断电再拔插头”。与633题(静电防护)配套。电控时代,断电拔插是基本规范。"}, {"id": 621, "oid": "B1-018", "type": "judge", "module": "汽车发动机维修", "q": "作业中受伤出血应先止血并及时报告、就医，不得隐瞒伤情继续作业。", "opts": [], "a": "√", "e": "【考点】受伤处置。\n【解析】作业受伤先止血、及时报告就医,不得隐瞒伤情继续作业。题干正确,判断为√。\n【易错】“先止血再报告”。隐瞒小伤可能酿成大祸。车间急救原则:止血→报告→就医。"}, {"id": 622, "oid": "B1-019", "type": "judge", "module": "汽车发动机维修", "q": "废旧蓄电池应直立存放、不得倒置和短路，按危险废物收集处理。", "opts": [], "a": "√", "e": "【考点】废旧电池处置。\n【解析】废电池直立存放、不得倒置短路,按危险废物交有资质单位回收。题干正确,判断为√。\n【易错】“倒置漏液、短路起火”。铅酸电池含稀硫酸和铅,属危废。直立+防短路+专业回收三要求。"}, {"id": 623, "oid": "B1-020", "type": "judge", "module": "汽车发动机维修", "q": "在发动机舱内使用照明灯时，应使用安全电压防爆行灯，禁止使用220V普通白炽灯。", "opts": [], "a": "√", "e": "【考点】机舱照明安全。\n【解析】机舱可能有燃油蒸气,应使用安全电压(≤36V)防爆行灯,禁止220V普通白炽灯(爆裂漏电引燃)。题干正确,判断为√。\n【易错】“低压防爆灯”。220V灯具在油污潮湿环境是隐患。安全电压36V以下。"}, {"id": 624, "oid": "B1-021", "type": "judge", "module": "汽车发动机维修", "q": "维修现场可以一边作业一边吸烟休息，只要不把烟头扔在油棉纱上即可。", "opts": [], "a": "×", "e": "【考点】车间禁烟。\n【解析】维修车间易燃易爆严禁烟火,烟头温度高足以引燃燃油蒸气;只能在指定吸烟区。题干说法错误,判断为×。\n【易错】“车间禁烟”。烟头中心温度可达700℃,远高于汽油闪点。“不扔油棉纱就行”是侥幸心理。"}, {"id": 625, "oid": "B1-022", "type": "judge", "module": "汽车发动机维修", "q": "发动机维修后竣工交车前，应清点工具、检查抹布和套筒是否遗落在发动机舱内。", "opts": [], "a": "√", "e": "【考点】竣工工具清点。\n【解析】交车前清点工具、检查抹布套筒是否遗落机舱,防止运转时卷入皮带或掉入气缸。题干正确,判断为√。\n【易错】“交车前清点”。工具遗落是低级但严重的事故源。清点制度是维修质量管理一环。"}, {"id": 626, "oid": "B1-023", "type": "judge", "module": "汽车发动机维修", "q": "拆卸蓄电池电缆时，应先拆正极再拆负极；安装时先装负极再装正极。", "opts": [], "a": "×", "e": "【考点】蓄电池拆装顺序。\n【解析】拆卸:先拆负极后拆正极(防扳手碰车体短路);安装:先接正极后接负极。题干顺序说反,判断为×。\n【易错】“拆负装正”。口诀:拆先负、装先正。车身搭铁=负极,先拆正极容易通过扳手短路打火。"}, {"id": 627, "oid": "B1-024", "type": "judge", "module": "汽车发动机维修", "q": "对装有安全气囊的车辆进行发动机维修前，应断开蓄电池负极并等待一段时间（让备用电源电容放电）后再作业。", "opts": [], "a": "√", "e": "【考点】气囊车维修断电。\n【解析】SRS系统自带储能电容,断电后仍可短时供电起爆;拆电瓶负极后须等待数十秒放电再作业。题干正确,判断为√。\n【易错】“断电+等待放电”。气囊起爆是弹射伤害。等电容放电是防误爆的关键一步。"}
