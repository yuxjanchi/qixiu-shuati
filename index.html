, {"id": 628, "oid": "B1-025", "type": "judge", "module": "汽车发动机维修", "q": "砂轮机磨削时，操作者应站在砂轮正前方，正对砂轮轴线方向观察火花。", "opts": [], "a": "×", "e": "【考点】砂轮机安全。\n【解析】砂轮高速旋转可能破裂飞出,操作者应站侧面、戴防护眼镜,不得正对砂轮。题干说法错误,判断为×。\n【易错】“站侧面不站正面”。砂轮破裂碎片沿切线飞出,正面正对最危险。打磨护目镜必备。"}, {"id": 629, "oid": "B1-026", "type": "judge", "module": "汽车发动机维修", "q": "使用扭力螺栓（塑性区域螺栓）时，按厂家要求应采用“力矩+转角”法拧紧，拆下后常需按规定更换。", "opts": [], "a": "√", "e": "【考点】塑性区域螺栓。\n【解析】塑性区螺栓(连杆、缸盖)按“力矩+转角”法拧紧,拉伸进入屈服产生永久变形,拆下后按规定更换。题干正确,判断为√。\n【易错】“力矩+转角+换新”。这类螺栓靠塑性变形保证夹紧,变形后不可复用。换发动机缸垫时螺栓必须换。"}, {"id": 630, "oid": "B1-027", "type": "judge", "module": "汽车发动机维修", "q": "在车辆下方用气动机拆卸螺栓时，身体应避开螺栓甩出方向，必要时用托架托住车轮。", "opts": [], "a": "√", "e": "【考点】气动工具拆轮安全。\n【解析】风炮扭矩大,螺栓车轮松脱瞬间可能甩出,身体避开切线方向,重轮用托架托住。题干正确,判断为√。\n【易错】“避开甩出方向”。松脱瞬间储能释放。轮胎拆卸是常见伤手场景。"}, {"id": 631, "oid": "B1-028", "type": "judge", "module": "汽车发动机维修", "q": "气动工具连接气管前，应检查快速接头是否锁牢、气管有无老化裂纹，气压不得超过工具额定值。", "opts": [], "a": "√", "e": "【考点】气动工具检查。\n【解析】接气管前检查快速接头锁牢、气管无老化裂纹,气压不超过额定值。题干正确,判断为√。\n【易错】“接头+气压双查”。接头脱落抽打伤人、超压爆裂飞脱。气动安全从源头查起。"}, {"id": 632, "oid": "B1-029", "type": "judge", "module": "汽车发动机维修", "q": "使用拉马拆卸皮带轮、齿轮时，丝杆应对正工件中心、拉爪受力均匀，身体避开工件甩出方向。", "opts": [], "a": "√", "e": "【考点】拉马使用。\n【解析】拉马丝杆对正中心、拉爪受力均匀,身体避开工件甩出方向,不锤敲丝杆。题干正确,判断为√。\n【易错】“对中+均匀+避开”。过盈件拆卸储能突然释放会崩飞。敲击丝杆会损坏螺纹和轴承。"}, {"id": 633, "oid": "B1-030", "type": "judge", "module": "汽车发动机维修", "q": "发动机电脑（ECU）等电子元件对静电敏感，拆装时可直接用手随意拿取电路板部位。", "opts": [], "a": "×", "e": "【考点】静电防护。\n【解析】人体静电数千伏,直接触摸ECU电路板会击穿敏感元件;先触摸接地释放静电或戴防静电手环。题干说法错误,判断为×。\n【易错】“ECU防静电”。与620题配套。拿ECU拿壳体不碰焊点。静电腕带/接地是电子件作业标配。"}, {"id": 634, "oid": "B1-031", "type": "judge", "module": "汽车发动机维修", "q": "在车辆下方进行发动机下部作业时，地面人员不得随意操作车辆起动，应挂“有人作业、禁止动车”警示牌。", "opts": [], "a": "√", "e": "【考点】车下作业防误动。\n【解析】车下作业挂“禁止动车”警示牌、钥匙作业人保管、专人监护,防误起动移动挤压伤害。题干正确,判断为√。\n【易错】“挂牌+钥匙保管”。与663题配套。防误起动三件套:拔钥匙、挂牌、监护。"}, {"id": 635, "oid": "B1-032", "type": "judge", "module": "汽车发动机维修", "q": "在未熄火的发动机舱内用万用表测量电压时，表笔可以随意搭在皮带轮附近测量。", "opts": [], "a": "×", "e": "【考点】运转中测量安全。\n【解析】运转发动机测量时表笔导线应避开风扇、皮带轮、排气管等旋转和高温部件,防卷入拉走或烫伤。题干说法错误,判断为×。\n【易错】“表笔避开旋转件”。测量先规划走线,别让线跨越旋转区域。与653题同源风险。"}, {"id": 636, "oid": "B1-033", "type": "judge", "module": "汽车发动机维修", "q": "发动机上的气门弹簧拆卸时，应使用专用气门弹簧压缩器，不能用螺丝刀强行撬出。", "opts": [], "a": "√", "e": "【考点】气门弹簧拆卸。\n【解析】气门弹簧储存弹性势能,必须用专用压缩器压簧后取锁片,不能螺丝刀强撬(锁片弹簧高速弹出)。题干正确,判断为√。\n【易错】“弹簧=专用工具”。弹簧储能释放会伤眼伤手。凡弹簧类拆卸都要用压缩/释放工具(642题张紧器同理)。"}, {"id": 637, "oid": "B1-034", "type": "judge", "module": "汽车发动机维修", "q": "举升双柱举升机时，两车臂支撑点应对称落在底盘指定举升位，车辆重心位于两柱之间。", "opts": [], "a": "√", "e": "【考点】举升机对称支撑。\n【解析】双柱举升两臂对称落在指定举升位、重心在两柱之间;先小升一段晃动检查稳固再升到位。题干正确,判断为√。\n【易错】“对称+重心居中”。偏载举升会滑移倾覆。与618题(举升点)配套。"}, {"id": 638, "oid": "B1-035", "type": "judge", "module": "汽车发动机维修", "q": "拧紧发动机进排气歧管螺栓时，应从中间向两端分次交叉均匀拧紧，防止变形漏气。", "opts": [], "a": "√", "e": "【考点】歧管螺栓拧紧顺序。\n【解析】进排气歧管螺栓从中间向两端分次交叉均匀拧紧,防平面翘曲、垫片漏气。题干正确,判断为√。\n【易错】“中到端分次拧”。与639题(缸盖螺栓)同理。所有大平面件都从中间向四周分次拧。"}, {"id": 639, "oid": "B1-036", "type": "judge", "module": "汽车发动机维修", "q": "安装缸盖螺栓应按由中间向两端、分2~3次顺序拧紧，不能由两端向中间一次性拧紧。", "opts": [], "a": "√", "e": "【考点】缸盖螺栓拧紧。\n【解析】缸盖螺栓由中间向两端分2~3次拧紧,使缸盖均匀贴合气缸垫;由两端向中间一次性拧会变形。题干正确,判断为√。\n【易错】“中到端分次”。拧紧顺序+分次力矩(如40N·m→80N·m→转角90°)是缸盖装配关键。与638题同规律。"}, {"id": 640, "oid": "B1-037", "type": "judge", "module": "汽车发动机维修", "q": "使用活动扳手时，应让拉力作用在固定钳口上，不允许随意在手柄上加套管加长力臂。", "opts": [], "a": "√", "e": "【考点】活动扳手使用。\n【解析】活动扳手拉力作用在固定钳口,不加套管加长力臂(会断裂扭断伤手)。题干正确,判断为√。\n【易错】“固定钳口受力”。活动扳手别当锤用、别加套管。力矩不够换大扳手。"}, {"id": 641, "oid": "B1-038", "type": "judge", "module": "汽车发动机维修", "q": "轮胎亏气、车辆歪斜时也可直接用举升机举升，不影响安全。", "opts": [], "a": "×", "e": "【考点】举升前提条件。\n【解析】轮胎亏气、车辆歪斜会破坏举升对称稳定,先停平硬地、查轮胎再按规范举升。题干说法错误,判断为×。\n【易错】“先整备再举升”。车不正不举升。举升三查:地面平、胎正常、支撑对称。"}, {"id": 642, "oid": "B1-039", "type": "judge", "module": "汽车发动机维修", "q": "发动机皮带张紧器拆卸时可能有张紧弹簧力，应用专用工具缓慢释放，人员避开弹出方向。", "opts": [], "a": "√", "e": "【考点】张紧器拆卸。\n【解析】张紧器弹簧储能,用专用工具缓慢释放,身体避开弹出方向。题干正确,判断为√。\n【易错】“缓慢释放+避开”。与636题(气门弹簧)同规律:弹簧件都是专用工具+缓慢+避开。"}, {"id": 643, "oid": "B1-040", "type": "judge", "module": "汽车发动机维修", "q": "发动机维修中使用化油器清洗剂时，应保持通风、远离火源和高温件，喷后稍等再起动。", "opts": [], "a": "√", "e": "【考点】化油器清洗剂使用。\n【解析】化清剂易燃易挥发刺激,通风、远离火源高温件、喷后稍等再起动,防吸入和溅眼。题干正确,判断为√。\n【易错】“通风+防火+等待”。化清剂是车间常用但易燃。喷后立即点火有引燃蒸气风险。"}, {"id": 644, "oid": "B1-041", "type": "judge", "module": "汽车发动机维修", "q": "发动机舱发生焦糊味并冒烟（机油滴在排气管上），此时正确的处置顺序是立即熄火断电、用干粉灭火器扑救，而不是马上大开舱盖用水浇。", "opts": [], "a": "√", "e": "【考点】机舱起火处置。\n【解析】机舱油火:先断电断油、从缝隙用干粉灭火器扑救;不能大开盖(进风轰燃)也不能用水浇(油火飞溅、触电)。题干正确,判断为√。\n【易错】“油火禁水、禁大开盖”。与652题配套。机舱起火处置顺序:断电→缝隙扑救→报警。"}, {"id": 645, "oid": "B1-042", "type": "judge", "module": "汽车发动机维修", "q": "更换水泵后首次试车水温报警、地面可见防冻液渗漏，正确的安全检查顺序是先熄火、待降温泄压后再查漏，而不是热车立即开盖补加。", "opts": [], "a": "√", "e": "【考点】换泵后漏水处置。\n【解析】水温报警+漏液:先熄火降温泄压再查漏,不能热车开盖补加(喷汽烫伤)。题干正确,判断为√。\n【易错】“先降温再查漏”。与616、656题同一原则:高温高压先降温。查水管卡箍、水泵密封面。"}, {"id": 646, "oid": "B1-043", "type": "judge", "module": "汽车发动机维修", "q": "两人配合在车下拆装发动机机脚胶时，必须先用千斤顶加木块托住发动机，并约定“再松手”口令后才能拆支撑螺栓。", "opts": [], "a": "√", "e": "【考点】机脚胶拆卸配合。\n【解析】拆机脚胶前必须用千斤顶+木块托住发动机重量,统一口令确认后再松支撑螺栓。题干正确,判断为√。\n【易错】“先托住再拆”。机脚胶是发动机支承,不托住会突然下沉坠落砸伤。配合作业统一口令。"}, {"id": 647, "oid": "B1-044", "type": "judge", "module": "汽车发动机维修", "q": "蓄电池亏电需要跨接起动时，正确做法是先接正极、再接负极，两车负极最后相连，起动后先拆负极再拆正极，防止短路打火。", "opts": [], "a": "√", "e": "【考点】跨接起动接线顺序。\n【解析】跨接:先接正极再接负极,两车负极最后相连;起动后先拆负极再拆正极,防短路打火。题干正确,判断为√。\n【易错】“接:正-负-负;拆:负-正”。与626题(电池拆装)同顺序逻辑:拆先负装先正。跨接电缆别搭铁短路。"}, {"id": 648, "oid": "B1-045", "type": "judge", "module": "汽车发动机维修", "q": "发动机运转中皮带打滑发出焦烟味时，应立即熄火停机，而不是继续高速运转观察。", "opts": [], "a": "√", "e": "【考点】皮带打滑冒烟处置。\n【解析】皮带打滑冒烟说明张紧不足或轴承卡滞,继续运转会烧毁皮带、水泵风扇停转过热;应停机检查。题干正确,判断为√。\n【易错】“冒烟即停机”。焦糊味/冒烟是皮带故障信号,别继续运转观察。停机后查张紧轮、惰轮、皮带。"}, {"id": 649, "oid": "B1-046", "type": "single", "module": "汽车发动机维修", "q": "车辆停在平整地面、拉紧手刹后，用千斤顶顶升进行发动机下护板拆卸，车下作业前最安全可靠的做法是（　）。", "opts": [{"k": "A", "t": "一直用千斤顶顶着作业"}, {"k": "B", "t": "换用安全支座将车辆支承牢固后再作业"}, {"k": "C", "t": "用砖块垫在轮胎旁即可"}, {"k": "D", "t": "让同伴在车顶压着增加稳定"}], "a": "B", "e": "【考点】千斤顶+安全支座(单选)。\n【解析】千斤顶只能短时举升,车下作业必须换安全支座垫实指定支撑点;砖块易碎不可靠。故选B。\n【易错】“支座垫实才作业”。与608题重复。A一直用千斤顶、C砖块、D人压车顶都不安全。"}, {"id": 650, "oid": "B1-047", "type": "single", "module": "汽车发动机维修", "q": "在密闭车间内需要短时间起动发动机检查，正确的安全措施是（　）。", "opts": [{"k": "A", "t": "关闭门窗保温"}, {"k": "B", "t": "开启排风装置或把排气管引出室外，并确认空挡、拉手刹"}, {"k": "C", "t": "挂入一挡防止溜车"}, {"k": "D", "t": "让一人站在车前推车"}], "a": "B", "e": "【考点】密闭车间起动发动机。\n【解析】怠速排放CO会在密闭车间积聚中毒;必须通风或排气管引出室外,起动前确认空挡/P挡、拉手刹。故选B。\n【易错】“通风+空挡手刹”。与613题配套。A关门保温错,C挂一挡会前冲,D推车危险。CO中毒是隐性杀手。"}, {"id": 651, "oid": "B1-048", "type": "single", "module": "汽车发动机维修", "q": "拆卸发动机燃油系统部件前，为防止喷油起火，首先应（　）。", "opts": [{"k": "A", "t": "直接拔下油管"}, {"k": "B", "t": "先释放燃油系统残余压力，并准备好接油盘和灭火器"}, {"k": "C", "t": "用打火机照亮观察油位"}, {"k": "D", "t": "把蓄电池正极拆下即可"}], "a": "B", "e": "【考点】燃油系统拆卸前泄压。\n【解析】燃油系统约0.3MPa压力,拆管前先泄压、接油盘、远离火源、备灭火器。故选B。\n【易错】“先泄压”。与610题重复单选化。A直接拔管喷油,C打火机照明会引爆,D拆电瓶不解决管路余压。"}, {"id": 652, "oid": "B1-049", "type": "single", "module": "汽车发动机维修", "q": "下列关于车间灭火器材使用，做法正确的是（　）。", "opts": [{"k": "A", "t": "电器起火先用水泼"}, {"k": "B", "t": "发动机舱机油着火，先断电、用干粉灭火器，必要时掀缝扑救"}, {"k": "C", "t": "油面着火用嘴吹灭"}, {"k": "D", "t": "灭火器可随意挪动位置"}], "a": "B", "e": "【考点】灭火器材使用。\n【解析】电器油类火灾不能用水;机舱油火先断电用干粉灭火器、掀缝扑救防助燃。故选B。\n【易错】“油电禁水”。A泼水触电/油火蔓延,C嘴吹无效,D灭火器固定位置。与644题配套。"}, {"id": 653, "oid": "B1-050", "type": "single", "module": "汽车发动机维修", "q": "运转发动机检查时，人员和衣物应特别避开的危险部位是（　）。", "opts": [{"k": "A", "t": "车门把手"}, {"k": "B", "t": "风扇、皮带轮等旋转部件"}, {"k": "C", "t": "座椅"}, {"k": "D", "t": "后视镜"}], "a": "B", "e": "【考点】运转中危险部位。\n【解析】风扇、皮带轮转速高卷入力大,运转时严禁靠近触摸。故选B。\n【易错】“旋转件=最危险”。与609题配套。车门、座椅、后视镜与运转无关。运转检查的“三不碰”:皮带、风扇、排气管。"}, {"id": 654, "oid": "B1-051", "type": "single", "module": "汽车发动机维修", "q": "检查发动机机油液位时，正确的安全与操作做法是（　）。", "opts": [{"k": "A", "t": "热车立即拔出机油尺"}, {"k": "B", "t": "车辆停平地、熄火静置数分钟后拔出机油尺观察"}, {"k": "C", "t": "发动机高速运转时查看"}, {"k": "D", "t": "让机油加满到溢出"}], "a": "B", "e": "【考点】机油液位检查。\n【解析】热车机油未回流读数偏高,应熄火静置数分钟、车辆水平后看油尺在上下刻线间;运转中查有卷入风险。故选B。\n【易错】“熄火静置+平地”。A热车立即看偏高,C运转中危险,D加满溢出损坏。机油尺检查要点。"}, {"id": 655, "oid": "B1-052", "type": "single", "module": "汽车发动机维修", "q": "使用扭力扳手的主要目的是（　）。", "opts": [{"k": "A", "t": "加快拆卸速度"}, {"k": "B", "t": "控制螺栓拧紧力矩达到维修手册规定值，防止过紧或过松"}, {"k": "C", "t": "代替普通扳手"}, {"k": "D", "t": "增大摩擦力"}], "a": "B", "e": "【考点】扭力扳手用途。\n【解析】扭力扳手精确控制拧紧力矩到手册规定值,防止过紧(拉伸变形)过松(松动漏油)。故选B。\n【易错】“控力矩”。A加快拆卸不是, C代替普通扳手不对,D增大摩擦力错。缸盖连杆等关键件必用。"}, {"id": 656, "oid": "B1-053", "type": "single", "module": "汽车发动机维修", "q": "发动机“开锅”后，正确处理是（　）。", "opts": [{"k": "A", "t": "立即拧开散热器盖"}, {"k": "B", "t": "立即泼冷水到缸体上"}, {"k": "C", "t": "让发动机怠速或自然降温，待冷却泄压后再检查补液"}, {"k": "D", "t": "马上熄火用嘴吹"}], "a": "C", "e": "【考点】开锅处理(单选)。\n【解析】开锅:让发动机自然降温,待冷却泄压后再检查补液;立即开盖喷汽烫伤、泼冷水缸体炸裂。故选C。\n【易错】“先降温”。与616题重复单选化。A开盖烫伤、B骤冷炸裂、D嘴吹无意义。"}, {"id": 657, "oid": "B1-054", "type": "single", "module": "汽车发动机维修", "q": "安全支座的正确使用方法是（　）。", "opts": [{"k": "A", "t": "垫在轮胎下方"}, {"k": "B", "t": "顶在车身/底盘指定支承部位，与举升设备配合"}, {"k": "C", "t": "用砖块代替"}, {"k": "D", "t": "越高越好"}], "a": "B", "e": "【考点】安全支座使用。\n【解析】安全支座顶在车身/底盘指定支承部位,与千斤顶配合形成二道防线;砖块易碎不能用。故选B。\n【易错】“顶在指定部位”。A垫轮胎下不承车身,C砖块代替危险,D越高越不稳定。安全支座的“第二道防线”定位要清楚。"}, {"id": 658, "oid": "B1-055", "type": "single", "module": "汽车发动机维修", "q": "车间内汽油的存放，正确做法是（　）。", "opts": [{"k": "A", "t": "用普通塑料桶敞口放在工位旁"}, {"k": "B", "t": "用专用金属密封油桶存放在远离火源、通风良好的危险品区"}, {"k": "C", "t": "倒在玻璃瓶中"}, {"k": "D", "t": "与棉纱堆在一起"}], "a": "B", "e": "【考点】汽油存放。\n【解析】汽油用专用金属密封油桶,放远离火源通风的危险品区;塑料桶易积静电、敞口挥发、棉纱旁易燃。故选B。\n【易错】“金属密封+危险品区”。静电积聚是塑料桶装汽油的隐患。与611题(禁汽油洗手)同安全主题。"}, {"id": 659, "oid": "B1-056", "type": "single", "module": "汽车发动机维修", "q": "下列属于发动机维修中防止烫伤的正确做法是（　）。", "opts": [{"k": "A", "t": "热车立即拆排气管"}, {"k": "B", "t": "发动机高温时先待其降温或戴隔热手套，不随意触摸排气管、涡轮、散热器"}, {"k": "C", "t": "用湿抹布直接盖在高温管路上"}, {"k": "D", "t": "开锅立刻开盖"}], "a": "B", "e": "【考点】防烫伤。\n【解析】排气管、涡轮、散热器表面高温(上百度),先降温或戴隔热手套,不随意触摸;热车开盖喷蒸汽。故选B。\n【易错】“高温件先降温”。A热车拆管烫伤,C湿布盖高温管会瞬间汽化烫伤,D开锅开盖喷汽。烫伤是维修常见伤。"}, {"id": 660, "oid": "B1-057", "type": "single", "module": "汽车发动机维修", "q": "关于发动机维修用电安全，正确的是（　）。", "opts": [{"k": "A", "t": "电线绝缘破损可继续使用"}, {"k": "B", "t": "使用漏电保护插座，电动工具外壳接地、线缆不碾压在油污下"}, {"k": "C", "t": "湿手插拔插头"}, {"k": "D", "t": "用铁丝代替保险丝"}], "a": "B", "e": "【考点】用电安全。\n【解析】电动工具接漏电保护、外壳接地、线缆完好;湿手插拔、铁丝代保险、绝缘破损都违章。故选B。\n【易错】“漏保+接地”。电安全三查:漏保、接地、线缆。C湿手触电,D铁丝代保险短路起火。"}, {"id": 661, "oid": "B1-058", "type": "single", "module": "汽车发动机维修", "q": "下列哪种行为在发动机维修车间属于违章（　）。", "opts": [{"k": "A", "t": "按规定穿戴劳保用品"}, {"k": "B", "t": "穿拖鞋、赤脚作业"}, {"k": "C", "t": "使用合格工具"}, {"k": "D", "t": "作业后清理工位"}], "a": "B", "e": "【考点】违章行为识别(反向)。\n【解析】穿拖鞋、赤脚作业易滑倒、砸伤、烫伤,属违章;其余三项都是规范操作。故选B(题干问“违章的”)。\n【易错】“拖鞋=违章”。找“违章”项:拖鞋赤脚。劳保三件套:工作服、防砸鞋、护目镜。"}, {"id": 662, "oid": "B1-059", "type": "single", "module": "汽车发动机维修", "q": "进入发动机维修车间作业，下列穿戴符合要求的是（　）。", "opts": [{"k": "A", "t": "拖鞋、短裤"}, {"k": "B", "t": "合体工作服、防砸工作鞋、必要时护目镜/手套"}, {"k": "C", "t": "宽松飘带衣物"}, {"k": "D", "t": "佩戴领带、手链"}], "a": "B", "e": "【考点】劳保穿戴。\n【解析】合体工作服、防砸工作鞋、必要时护目镜手套;拖鞋短裤、宽松衣物、首饰都危险。故选B。\n【易错】“合体+防砸”。与614、661题配套。着装安全是进入车间第一课。"}, {"id": 663, "oid": "B1-060", "type": "single", "module": "汽车发动机维修", "q": "关于发动机维修中防止误起动的措施，错误的是（　）。", "opts": [{"k": "A", "t": "拔掉点火钥匙由作业人保管"}, {"k": "B", "t": "在点火开关处挂“正在维修、禁止起动”警示牌"}, {"k": "C", "t": "为方便随时试车，钥匙插在点火开关上"}, {"k": "D", "t": "手动挡挂空挡、自动挡挂P挡"}], "a": "C", "e": "【考点】防误起动(反向)。\n【解析】钥匙插在点火开关上,他人误拧即起动,危害车下/舱内作业人员;应拔钥匙、挂牌、监护。C做法错误,故选C(题干问“错误的”)。\n【易错】“钥匙拔掉保管”。与634题配套。A拔钥匙、B挂牌、D空挡/P挡都是正确措施。"}, {"id": 664, "oid": "B1-061", "type": "single", "module": "汽车发动机维修", "q": "冷却液（防冻液）溅入眼睛，首先应（　）。", "opts": [{"k": "A", "t": "揉眼睛"}, {"k": "B", "t": "立即用大量清水冲洗眼睛并就医"}, {"k": "C", "t": "滴眼药水即可"}, {"k": "D", "t": "闭眼休息"}], "a": "B", "e": "【考点】冷却液溅眼处理。\n【解析】防冻液含乙二醇等有毒刺激性成分,溅眼立即用洗眼器/大量清水冲洗15分钟并就医;揉眼加重化学损伤。故选B。\n【易错】“冲洗15分钟+就医”。化学灼眼处理通则:冲洗>就医。揉眼、滴眼药水、闭眼都延误冲洗时机。"}, {"id": 665, "oid": "B1-062", "type": "single", "module": "汽车发动机维修", "q": "下列关于发动机维修中棉纱、抹布使用正确的是（　）。", "opts": [{"k": "A", "t": "用棉纱擦拭高温排气管"}, {"k": "B", "t": "维修用抹布集中存放，油污抹布放入金属带盖桶"}, {"k": "C", "t": "抹布扔在进气管口"}, {"k": "D", "t": "用棉纱堵住水管"}], "a": "B", "e": "【考点】棉纱抹布管理。\n【解析】油污棉纱易自燃,放金属带盖容器;棉纱堵管口会被吸入,抹布不得遗留进排气口和机舱。故选B。\n【易错】“油污棉纱=带盖金属桶”。A擦高温排气管会起火,C堵进气管吸入,D堵水管。棉纱管理是火灾预防一环。"}, {"id": 666, "oid": "B1-063", "type": "single", "module": "汽车发动机维修", "q": "在发动机下部使用千斤顶时，地面应为（　）。", "opts": [{"k": "A", "t": "松软泥地"}, {"k": "B", "t": "平整坚硬的水泥地面"}, {"k": "C", "t": "带坡度的地面"}, {"k": "D", "t": "铺地毯处"}], "a": "B", "e": "【考点】千斤顶作业地面。\n【解析】千斤顶须在平整坚硬水泥地面作业,松软斜坡会下陷滑移,必要时垫钢板扩大支承面。故选B。\n【易错】“平硬地面”。松软泥地下陷、坡面滑移。地面条件决定千斤顶稳定性。"}, {"id": 667, "oid": "B1-064", "type": "single", "module": "汽车发动机维修", "q": "举升车辆时发现车辆在举升机上明显歪斜、支撑点未到位，应（　）。", "opts": [{"k": "A", "t": "继续升到作业高度"}, {"k": "B", "t": "落回地面重新调整支撑点，确认对称稳固后再举升"}, {"k": "C", "t": "在车下垫石头"}, {"k": "D", "t": "用手扳正"}], "a": "B", "e": "【考点】举升歪斜处置。\n【解析】举升中发现歪斜、支撑不到位,必须落回重新对位,确认对称稳固再升;不能带隐患升车。故选B。\n【易错】“落回重调”。与667题配套。预升晃动检查正是为了发现此类问题。"}, {"id": 668, "oid": "B1-065", "type": "single", "module": "汽车发动机维修", "q": "维修发动机时，拆卸下来的螺栓、螺母应（　）。", "opts": [{"k": "A", "t": "随便放在发动机罩上"}, {"k": "B", "t": "分类放在零件盒/托盘中，防止丢失和混入异物"}, {"k": "C", "t": "扔在地上"}, {"k": "D", "t": "塞进口袋"}], "a": "B", "e": "【考点】拆下螺栓管理。\n【解析】拆卸紧固件分类摆放、做标记,防遗失错装(长短螺栓装错顶坏机体)、防落入发动机内部。故选B。\n【易错】“分类+标记”。A乱放易丢,C地上易混,D口袋易丢。螺栓管理是维修质量基本功。"}, {"id": 669, "oid": "B1-066", "type": "single", "module": "汽车发动机维修", "q": "关于发动机维修中防止火灾，说法错误的是（　）。", "opts": [{"k": "A", "t": "维修区禁止烟火"}, {"k": "B", "t": "燃油系统作业前泄压"}, {"k": "C", "t": "漏油不必处理，干了就好"}, {"k": "D", "t": "备好灭火器"}], "a": "C", "e": "【考点】防火灾(反向)。\n【解析】漏油会在高温排气管上自燃,必须及时擦净找漏;禁烟、泄压、配灭火器都是防火要求。C说“漏油不必处理”,错误,故选C(题干问“错误的”)。\n【易错】“漏油必处理”。机油滴排气管是自燃隐患。反向题:安全红线选项必是错项。"}, {"id": 670, "oid": "B1-067", "type": "single", "module": "汽车发动机维修", "q": "发动机维修现场，发生人员机械伤害出血时，现场首要处理是（　）。", "opts": [{"k": "A", "t": "继续作业"}, {"k": "B", "t": "立即停止作业，对伤口止血并报告、视情送医"}, {"k": "C", "t": "涂口水消毒"}, {"k": "D", "t": "用脏布包扎"}], "a": "B", "e": "【考点】机械伤害出血处置。\n【解析】受伤后立即停机、止血、报告并视情就医;脏布包扎易感染。故选B。\n【易错】“停机止血报告”。与621题配套。A继续作业、C涂口水、D脏布包扎都错。"}, {"id": 671, "oid": "B1-068", "type": "single", "module": "汽车发动机维修", "q": "下列关于发动机冷却液系统带压维修，说法正确的是（　）。", "opts": [{"k": "A", "t": "热车可拆水管"}, {"k": "B", "t": "应待发动机降温泄压后再拆卸水管、暖风管"}, {"k": "C", "t": "拆管时脸正对管口"}, {"k": "D", "t": "用手堵管口"}], "a": "B", "e": "【考点】冷却系带压维修。\n【解析】热车水管内高压,拆管喷高温冷却液烫伤;降温泄压后操作,避开管口方向。故选B。\n【易错】“降温泄压+避开管口”。与645、656题同原则。脸对管口、手堵管口都危险。"}, {"id": 672, "oid": "B1-069", "type": "single", "module": "汽车发动机维修", "q": "下列行为符合发动机维修车间安全规范的是（　）。", "opts": [{"k": "A", "t": "在工位追逐打闹"}, {"k": "B", "t": "按操作规程使用设备，不随意拆除安全防护装置"}, {"k": "C", "t": "私拉乱接电线"}, {"k": "D", "t": "把工具当暗器扔来扔去"}], "a": "B", "e": "【考点】车间安全规范。\n【解析】按规程使用设备、不拆除安全防护装置(皮带护罩、风扇护网);追逐打闹、私拉电线、乱扔工具违章。故选B。\n【易错】“不拆防护装置”。防护罩是防卷入第一道防线。A、C、D都是违章行为。"}, {"id": 673, "oid": "B1-070", "type": "single", "module": "汽车发动机维修", "q": "关于发动机维修现场的通道管理，正确的是（　）。", "opts": [{"k": "A", "t": "通道堆放零件和油桶"}, {"k": "B", "t": "保持消防通道、安全出口畅通不被占用"}, {"k": "C", "t": "把废件堆在出口"}, {"k": "D", "t": "拉线跨通道"}], "a": "B", "e": "【考点】通道管理。\n【解析】消防通道、安全出口必须畅通,便于疏散和灭火器材取用;堆物堵塞延误逃生。故选B。\n【易错】“通道畅通”。A堆零件油桶、C堆出口、D拉线跨通道都堵塞通道。安全通道是生命通道。"}, {"id": 674, "oid": "B1-071", "type": "single", "module": "汽车发动机维修", "q": "安全色中，表示“禁止、停止”的颜色是（　）。", "opts": [{"k": "A", "t": "红色"}, {"k": "B", "t": "蓝色"}, {"k": "C", "t": "绿色"}, {"k": "D", "t": "黄色"}], "a": "A", "e": "【考点】安全色含义。\n【解析】红色=禁止停止危险;蓝色=指令;黄色=警告;绿色=安全通行。故选A。\n【易错】“红=禁止”。安全色口诀:红禁、蓝令、黄警、绿通。消防器材红底白字。"}, {"id": 675, "oid": "B1-072", "type": "single", "module": "汽车发动机维修", "q": "发动机维修车间发生火情，报警电话应拨打（　）。", "opts": [{"k": "A", "t": "110"}, {"k": "B", "t": "119"}, {"k": "C", "t": "120"}, {"k": "D", "t": "122"}], "a": "B", "e": "【考点】火警电话。\n【解析】火警119;110匪警、120急救、122交通事故。报警讲清地点火势被困情况并派人引导。故选B。\n【易错】“火警119”。四个报警电话对应:匪警110、火警119、急救120、事故122。应急电话必考。"}, {"id": 676, "oid": "B1-073", "type": "single", "module": "汽车发动机维修", "q": "废机油的正确处理方式是（　）。", "opts": [{"k": "A", "t": "倒入下水道或花坛"}, {"k": "B", "t": "用专用容器收集，作为危险废物交有资质单位回收"}, {"k": "C", "t": "倒进生活垃圾"}, {"k": "D", "t": "洒在地面吸尘"}], "a": "B", "e": "【考点】废机油处理。\n【解析】废机油属危险废物,乱倒污染水土违法;专用容器收集、交有资质单位回收。故选B。\n【易错】“废油=危废”。A倒下水道污染水源、C生活垃圾混投、D洒地面。环保合规是维修店红线。"}, {"id": 677, "oid": "B1-074", "type": "single", "module": "汽车发动机维修", "q": "发动机维修中，下列关于扳手使用错误的是（　）。", "opts": [{"k": "A", "t": "按螺栓尺寸选合适开口"}, {"k": "B", "t": "在扳手手柄上加套管随意加长力臂"}, {"k": "C", "t": "拉力方向作用在固定钳口"}, {"k": "D", "t": "不用锤子击打扳手手柄"}], "a": "B", "e": "【考点】扳手使用(反向)。\n【解析】加套管使力矩超设计值,扳手断裂、螺栓扭断伤手;按尺寸选扳手、拉力作用固定钳口、不锤击手柄。B错误,故选B(题干问“错误的”)。\n【易错】“禁加套管”。与640题重复。A、C、D都是正确做法。"}, {"id": 678, "oid": "B1-075", "type": "single", "module": "汽车发动机维修", "q": "下列属于发动机维修中个人防护的正确做法是（　）。", "opts": [{"k": "A", "t": "接触机油、清洗剂戴耐油手套"}, {"k": "B", "t": "不戴护目镜"}, {"k": "C", "t": "光脚穿凉鞋"}, {"k": "D", "t": "长发披肩"}], "a": "A", "e": "【考点】个人防护。\n【解析】接触机油清洗剂戴耐油手套;护目镜、防砸鞋、束发都是基本防护。故选A。\n【易错】“耐油手套”。B不戴护目镜、C光脚、D长发披肩都违规。化学品+油污手部防护优先。"}, {"id": 679, "oid": "B1-076", "type": "single", "module": "汽车发动机维修", "q": "下列关于发动机维修中使用砂轮机，错误的是（　）。", "opts": [{"k": "A", "t": "检查砂轮有无裂纹、防护罩齐全"}, {"k": "B", "t": "站在砂轮侧面磨削"}, {"k": "C", "t": "两人同时共用一台砂轮"}, {"k": "D", "t": "戴护目镜"}], "a": "C", "e": "【考点】砂轮机使用(反向)。\n【解析】一台砂轮只能一人操作,两人共用相互干扰、工件飞出伤人;使用前查裂纹防护罩、站侧面戴护目镜。C错误,故选C。\n【易错】“一机一人”。与628题配套。A查裂纹、B站侧面、D护目镜都对。"}, {"id": 680, "oid": "B1-077", "type": "single", "module": "汽车发动机维修", "q": "在车间内推动放置发动机零件的零件车时，应（　）。", "opts": [{"k": "A", "t": "快速奔跑"}, {"k": "B", "t": "控制速度、注意脚下和通道，零件固定不超高"}, {"k": "C", "t": "让车自己滑行"}, {"k": "D", "t": "坐在车上滑行"}], "a": "B", "e": "【考点】零件车推行。\n【解析】零件车稳推慢走、载荷固定不超高,防倾倒砸伤;快速奔跑、坐滑撞人撞物。故选B。\n【易错】“稳推慢走”。推车安全:控制速度、看脚下、固定载荷。车间内移动设备规范。"}, {"id": 681, "oid": "B1-078", "type": "single", "module": "汽车发动机维修", "q": "维修发动机中，对待维修手册和量具的态度，正确的是（　）。", "opts": [{"k": "A", "t": "凭经验不用手册"}, {"k": "B", "t": "按维修手册规定的力矩、顺序和标准值操作，并正确使用量具"}, {"k": "C", "t": "量具不需要校准"}, {"k": "D", "t": "手册可随便猜"}], "a": "B", "e": "【考点】维修手册与量具。\n【解析】按手册规定力矩顺序标准值作业、正确使用量具;凭经验易出质量安全事故。故选B。\n【易错】“按手册+量具校准”。A凭经验、C量具不需校准、D手册乱猜都错。规范化维修是现代要求。"}, {"id": 682, "oid": "B1-079", "type": "single", "module": "汽车发动机维修", "q": "下列哪种做法是发动机维修中正确的文明安全生产行为（　）。", "opts": [{"k": "A", "t": "工具用完不归位"}, {"k": "B", "t": "工位整洁、油路畅通、零件有序、安全第一"}, {"k": "C", "t": "试车不挂警示牌"}, {"k": "D", "t": "漏油不擦"}], "a": "B", "e": "【考点】文明生产。\n【解析】文明生产:工位整洁、油路畅通、零件有序、安全第一。故选B。\n【易错】“工位整洁”。A工具不归位、C试车不挂牌、D漏油不擦都是不文明生产。文明生产=安全+质量。"}, {"id": 683, "oid": "B1-080", "type": "single", "module": "汽车发动机维修", "q": "关于发动机维修中“三不伤害”原则，正确理解是（　）。", "opts": [{"k": "A", "t": "不伤害自己、不伤害他人、不被他人伤害"}, {"k": "B", "t": "不损坏工具、不浪费材料、不迟到"}, {"k": "C", "t": "不换件、不解体、不试车"}, {"k": "D", "t": "不记录、不报告、不清洁"}], "a": "A", "e": "【考点】三不伤害原则。\n【解析】三不伤害:不伤害自己、不伤害他人、不被他人伤害,通过规范操作和互保落实。故选A。\n【易错】“三不伤害”。其他选项都是望文生义的干扰。安全生产基本准则,必背。"}, {"id": 684, "oid": "B1-081", "type": "single", "module": "汽车发动机维修", "q": "发动机大修吊装时，吊索应挂在（　）。", "opts": [{"k": "A", "t": "油底壳螺栓上"}, {"k": "B", "t": "缸体、缸盖上制造厂设计的专用吊装吊耳上"}, {"k": "C", "t": "水管接头处"}, {"k": "D", "t": "任意方便的部位"}], "a": "B", "e": "【考点】吊装挂点。\n【解析】吊索挂在缸体/缸盖设计专用吊耳;油底壳、水管薄壁件承力不足会撕裂,挂错点发动机滑脱坠落。故选B。\n【易错】“专用吊耳”。与619、688题配套。吊装三查:吊耳、索具、下方无人。"}, {"id": 685, "oid": "B1-082", "type": "single", "module": "汽车发动机维修", "q": "对装备安全气囊的车辆进行发动机维修，断开蓄电池负极后通常应（　）再拆卸相关部件。", "opts": [{"k": "A", "t": "立即动手"}, {"k": "B", "t": "等待数十秒让气囊备用电源电容放电"}, {"k": "C", "t": "反复按喇叭"}, {"k": "D", "t": "打开点火开关"}], "a": "B", "e": "【考点】气囊断电等待。\n【解析】气囊控制模块储能电容断电后仍可短时供电起爆,须等待数十秒放电再拆相关部件。故选B。\n【易错】“等待放电”。与627题重复单选化。C按喇叭、D开点火开关都危险。"}, {"id": 686, "oid": "B1-083", "type": "single", "module": "汽车发动机维修", "q": "在车下使用手电钻或砂轮打磨底盘零件时，护目镜的佩戴要求是（　）。", "opts": [{"k": "A", "t": "不用戴，注意即可"}, {"k": "B", "t": "必须佩戴防护眼镜，防止铁屑、磨粒飞溅伤眼"}, {"k": "C", "t": "戴普通近视眼镜即可替代"}, {"k": "D", "t": "闭眼操作"}], "a": "B", "e": "【考点】打磨护目镜。\n【解析】打磨钻孔产生高速飞溅铁屑易击穿眼球,必须戴防护眼镜;普通近视镜不防侧面冲击。故选B。\n【易错】“护目镜必备”。A不戴、C近视镜替代、D闭眼操作都错。眼伤是维修致残高发伤。"}, {"id": 687, "oid": "B1-084", "type": "single", "module": "汽车发动机维修", "q": "举升机举升车辆进行发动机作业时，正确的顺序是（　）。", "opts": [{"k": "A", "t": "直接升到最高马上钻车底"}, {"k": "B", "t": "支撑到指定举升点、举升一小段检查稳固、确认安全锁止后再升至工作高度"}, {"k": "C", "t": "车顶站人增加配重"}, {"k": "D", "t": "车辆斜着支撑没关系"}], "a": "B", "e": "【考点】举升机操作顺序。\n【解析】顺序:对准举升点→预升晃动检查→确认机械锁止→升至作业高度;未锁止禁止车下作业。故选B。\n【易错】“预升→锁止→到位”。与687题配套。A直接升最高危险,C站人配重错,D斜支撑错。"}, {"id": 688, "oid": "B1-085", "type": "single", "module": "汽车发动机维修", "q": "吊装发动机总成时，下列做法错误的是（　）。", "opts": [{"k": "A", "t": "检查吊索、卸扣有无断丝裂纹"}, {"k": "B", "t": "吊物下方严禁站人"}, {"k": "C", "t": "可以斜拉歪吊快速就位"}, {"k": "D", "t": "由专人指挥、平稳起吊"}], "a": "C", "e": "【考点】吊装安全(反向)。\n【解析】斜拉歪吊使载荷摆动脱钩、损伤设备;应垂直平稳起吊、下方禁站人、检查索具。C错误,故选C(题干问“错误的”)。\n【易错】“禁斜拉歪吊”。A查索具、B下方不站人、D专人指挥都对。吊装“十不吊”精神。"}, {"id": 689, "oid": "B1-086", "type": "single", "module": "汽车发动机维修", "q": "在发动机旁使用万用表检测时，错误的做法是（　）。", "opts": [{"k": "A", "t": "选对电压/电流量程档"}, {"k": "B", "t": "表笔绝缘层完好"}, {"k": "C", "t": "测量时表笔远离旋转和高温部件"}, {"k": "D", "t": "用电流档直接测量蓄电池两端电压"}], "a": "D", "e": "【考点】万用表使用(反向)。\n【解析】电流档短接蓄电池=短路,烧表打火;选对量程、表笔绝缘、远离旋转高温件。D错误,故选D(题干问“错误的”)。\n【易错】“电流档不能测电压”。测电压用电压档并联,电流档串联且不能直接跨接电源。量程选错是烧表主因。"}, {"id": 690, "oid": "B1-087", "type": "single", "module": "汽车发动机维修", "q": "发动机舱内电子散热风扇可能突然启动伤人，检修冷凝器、风扇周边前应（　）。", "opts": [{"k": "A", "t": "直接伸手检查"}, {"k": "B", "t": "关闭发动机并拔出点火钥匙，确认风扇完全停转"}, {"k": "C", "t": "打开空调让风扇转更快"}, {"k": "D", "t": "用手按住叶片"}], "a": "B", "e": "【考点】电子风扇突然启动。\n【解析】电子风扇水温高或开空调自动旋转,断电后仍可温控启动;作业前熄火拔钥匙、确认风扇停转。故选B。\n【易错】“拔钥匙等风扇停”。电子风扇是“会自己转的风扇”,无钥匙断电后也可能转。A直接伸手、C加速转、D按叶片都危险。"}, {"id": 691, "oid": "B1-088", "type": "single", "module": "汽车发动机维修", "q": "使用手电钻钻孔时，下列操作错误的是（　）。", "opts": [{"k": "A", "t": "戴防护眼镜"}, {"k": "B", "t": "工件用台虎钳夹紧"}, {"k": "C", "t": "戴棉纱手套握持钻头附近"}, {"k": "D", "t": "钻孔时控制进给压力"}], "a": "C", "e": "【考点】手电钻钻孔(反向)。\n【解析】旋转钻头卷入线手套绞手,钻孔作业严禁戴线手套;工件夹紧、戴护目镜、均匀施力。C错误,故选C(题干问“错误的”)。\n【易错】“旋转设备禁线手套”。A护目镜、B夹紧工件、D控进给都对。手套禁令:钻床/车床等旋转设备。"}, {"id": 692, "oid": "B1-089", "type": "single", "module": "汽车发动机维修", "q": "对发动机进行焊接（如焊修排气管）时，下列措施错误的是（　）。", "opts": [{"k": "A", "t": "移开附近燃油管、线束"}, {"k": "B", "t": "备好灭火器并设监火人"}, {"k": "C", "t": "在满是油污棉纱的工位直接动火"}, {"k": "D", "t": "断开蓄电池、ECU插头"}], "a": "C", "e": "【考点】焊接动火安全(反向)。\n【解析】动火前清除易燃物(油污棉纱极易引燃)、断电、备灭火器、监火、作业后留观。C说“不需清理油污棉纱”,错误,故选C。\n【易错】“动火先清场”。焊渣飞溅点燃油棉纱是维修火灾常见原因。动火作业审批+监火+留观。"}, {"id": 693, "oid": "B1-090", "type": "single", "module": "汽车发动机维修", "q": "发现举升机下行时异响、自行下滑，应（　）。", "opts": [{"k": "A", "t": "继续使用"}, {"k": "B", "t": "立即停止使用、挂牌报修，由专业人员检修"}, {"k": "C", "t": "自己拆开修理"}, {"k": "D", "t": "在车下垫东西继续"}], "a": "B", "e": "【考点】设备异常处置。\n【解析】举升机下行异响、自行下滑是严重机械故障,随时可能坠落;立即停用、挂“故障停用”牌、报修,由专业人员检修。故选B。\n【易错】“停用挂牌报修”。A继续用会压伤人,C自己拆修危险,D垫东西更危险。设备带病作业零容忍。"}, {"id": 694, "oid": "B1-091", "type": "single", "module": "汽车发动机维修", "q": "发动机大修后第一次起动试车，正确做法是（　）。", "opts": [{"k": "A", "t": "直接全速运转"}, {"k": "B", "t": "先检查机油压力、冷却水连接，低速怠速运转观察有无异响漏水漏油"}, {"k": "C", "t": "立即挂挡行驶"}, {"k": "D", "t": "不接散热器盖"}], "a": "B", "e": "【考点】大修后首次起动。\n【解析】大修后先确认机油压力、冷却连接、紧固到位,低速怠速磨合并观察异响、泄漏;直接全速、行驶易因装配问题烧毁发动机。故选B。\n【易错】“怠速磨合观察”。A全速运转、C挂挡行驶、D不接散热器盖都会扩大故障。大修后磨合三查:油压、水温、异响。"}, {"id": 695, "oid": "B1-092", "type": "single", "module": "汽车发动机维修", "q": "拆卸发动机正时皮带后再装回，为保证配气相位正确，装配时必须（　）。", "opts": [{"k": "A", "t": "随便装上即可"}, {"k": "B", "t": "将曲轴、凸轮轴对准维修手册规定的正时标记后再装皮带"}, {"k": "C", "t": "皮带越紧越好"}, {"k": "D", "t": "旋转几圈后不用复查"}], "a": "B", "e": "【考点】正时皮带装配。\n【解析】正时错位会使气门顶活塞(顶气门);必须对准曲轴、凸轮轴正时标记装皮带,按规定张力张紧,盘车两圈复查标记仍对正。故选B。\n【易错】“对标记+盘车复查”。A随便装顶气门,C越紧越伤轴承,D不复查漏检。正时作业三步:对标记→装皮带→盘车验。"}, {"id": 696, "oid": "B1-093", "type": "single", "module": "汽车发动机维修", "q": "维修作业中听到发动机舱发出异常“哒哒”金属声并伴有异味，应（　）。", "opts": [{"k": "A", "t": "继续运转观察"}, {"k": "B", "t": "立即熄火断电，检查是否缺机油、轴承抱死或有异物"}, {"k": "C", "t": "加大油门冲过去"}, {"k": "D", "t": "用水浇"}], "a": "B", "e": "【考点】发动机异响处置。\n【解析】异常金属响多为缺油拉瓦、异物卷入,继续运转会迅速扩大为抱轴捣缸;立即熄火断电,查机油、轴承、异物。故选B。\n【易错】“异响即熄火”。A继续观察、C加大油门、D浇水都错。异响是发动机内部故障报警器。"}, {"id": 697, "oid": "B1-094", "type": "single", "module": "汽车发动机维修", "q": "两人配合抬运较重的发动机缸盖时，正确做法是（　）。", "opts": [{"k": "A", "t": "各自突然发力"}, {"k": "B", "t": "统一口令、同时起身，注意脚下防滑，走指定通道"}, {"k": "C", "t": "一人扛起就走"}, {"k": "D", "t": "从别人头顶递过"}], "a": "B", "e": "【考点】重物抬运。\n【解析】缸盖重物抬运应统一口令、同时起身、注意脚下防滑、走指定通道;各自发力、一人扛起易脱手砸脚扭腰。故选B。\n【易错】“统一口令”。重件优先用起重设备;人工抬运讲究步调一致。与619吊装原则同源。"}, {"id": 698, "oid": "B1-095", "type": "single", "module": "汽车发动机维修", "q": "使用扭力扳手拆卸过紧螺栓后再用它拧紧重要螺栓，应注意（　）。", "opts": [{"k": "A", "t": "扭力扳手可以当普通扳手随意撬"}, {"k": "B", "t": "扭力扳手仅用于达到设定力矩后即停，不得超量程加套管"}, {"k": "C", "t": "越用力拧越准"}, {"k": "D", "t": "用完不用校检"}], "a": "B", "e": "【考点】扭力扳手正确使用。\n【解析】扭力扳手是精密量具,达到设定力矩“咔哒”即停;不能当撬棍、超量程加套管、越用力拧,用完定期送校。故选B。\n【易错】“设定即停+定期校”。与655题配套。A撬、C越紧越准、D不校检都错。扭力扳手失准=螺栓事故。"}, {"id": 699, "oid": "B1-096", "type": "single", "module": "汽车发动机维修", "q": "拆装发动机进气管卡箍锈蚀拆不动，正确做法是（　）。", "opts": [{"k": "A", "t": "用螺丝刀硬撬管接头"}, {"k": "B", "t": "喷松动剂浸润后用卡箍钳拆卸，避免塑料管接头崩裂伤手"}, {"k": "C", "t": "用牙咬"}, {"k": "D", "t": "猛拉管子"}], "a": "B", "e": "【考点】锈蚀卡箍拆卸。\n【解析】锈蚀卡箍硬撬会崩裂塑料接头、橡胶管回弹伤手;喷松动剂浸润后用卡箍钳拆卸,老化件一并更换。故选B。\n【易错】“松动剂+卡箍钳”。A硬撬崩裂,C牙咬,D猛拉管子伤手。遇锈先润滑、用专用工具。"}, {"id": 700, "oid": "B1-097", "type": "single", "module": "汽车发动机维修", "q": "车辆在举升机上进行发动机维修时，下列哪种做法存在倾覆风险（　）。", "opts": [{"k": "A", "t": "支撑点对称落在举升位"}, {"k": "B", "t": "把沉重发动机整个吊出后在车头上方长时间晃动"}, {"k": "C", "t": "先举升小高度检查"}, {"k": "D", "t": "确认锁止后作业"}], "a": "B", "e": "【考点】举升机倾覆风险。\n【解析】吊出发动机后车前轴配重变化,在举升机上大幅晃动重物会改变重心引发倾翻;应落车或用支架固定、平稳操作。B做法危险,故选B(题干问“存在倾覆风险的”)。\n【易错】“重物晃动=倾覆”。A对称支撑、C预升检查、D锁止作业都对。举升机作业“重物稳、重心正”。"}, {"id": 701, "oid": "B1-098", "type": "single", "module": "汽车发动机维修", "q": "在底盘和发动机之间作业（如换离合器），变速器下方应（　）。", "opts": [{"k": "A", "t": "徒手托住即可"}, {"k": "B", "t": "用安全支架或托架托住变速器，防止坠落砸伤"}, {"k": "C", "t": "不用支撑"}, {"k": "D", "t": "让同伴抱住"}], "a": "B", "e": "【考点】重件坠落防护。\n【解析】变速器数十千克,徒手托住滑落会砸伤手脚;应用安全支架或托架托住支撑。故选B。\n【易错】“支架托住”。A徒手、C不支撑、D同伴抱住都不安全。底盘重件作业“先支撑后拆装”。"}, {"id": 702, "oid": "B1-099", "type": "single", "module": "汽车发动机维修", "q": "安全检查中发现发动机舱蓄电池接线柱氧化、松动，可能造成（　）。", "opts": [{"k": "A", "t": "接触电阻大、起动机无力甚至发热打火"}, {"k": "B", "t": "没有影响"}, {"k": "C", "t": "油耗降低"}, {"k": "D", "t": "功率增大"}], "a": "A", "e": "【考点】蓄电池接线柱氧化。\n【解析】接线柱氧化松动→接触电阻增大→大电流发热、电压降增大、起动无力,严重时发热引燃;应清洁紧固并涂凡士林。故选A。\n【易错】“氧化=接触电阻大”。B没影响、C油耗降、D功率增都错。接触不良的“发热-打火”链要记牢。"}, {"id": 703, "oid": "B1-100", "type": "single", "module": "汽车发动机维修", "q": "发动机大修后，对缸盖螺栓按维修手册“力矩+转角”法拧紧，其目的是（　）。", "opts": [{"k": "A", "t": "节省时间"}, {"k": "B", "t": "精确控制螺栓拉伸量，保证缸盖密封又不过载"}, {"k": "C", "t": "越紧越好"}, {"k": "D", "t": "凭手感即可"}], "a": "B", "e": "【考点】力矩+转角法。\n【解析】塑性区螺栓用力矩+转角法精确控制拉伸量和预紧力,均匀压紧缸垫;凭手感、一味加力会造成密封不良或螺栓断裂。故选B。\n【易错】“控拉伸不过载”。与629、655题配套。A省时间、C越紧越好、D凭手感都错。缸盖密封质量看螺栓控制。"}, {"id": 704, "oid": "B1-101", "type": "single", "module": "汽车发动机维修", "q": "断开蓄电池负极会导致ECU自适应学习值、收放机密码等丢失，正确认识是（　）。", "opts": [{"k": "A", "t": "拔负极不会丢失任何数据"}, {"k": "B", "t": "维修前应了解并做好记录，必要时按规范供电更换电瓶"}, {"k": "C", "t": "必须先拆正极"}, {"k": "D", "t": "断电对ECU有保护作用可随意断"}], "a": "B", "e": "【考点】断负极丢数据。\n【解析】断开蓄电池会清除ECU自适应学习值、收放机密码、车窗一键升降设定;维修前应了解记录,必要时规范供电更换电瓶。故选B。\n【易错】“维修前记录数据”。A不丢数据错,C先拆正极错,D随意断电错。断电影响电控记忆是常识。"}, {"id": 705, "oid": "B1-102", "type": "single", "module": "汽车发动机维修", "q": "检查发动机皮带张力时，发动机应处于（　）。", "opts": [{"k": "A", "t": "高速运转"}, {"k": "B", "t": "熄火状态，按规定挠度（或张力计）检查"}, {"k": "C", "t": "怠速即可"}, {"k": "D", "t": "一边运转一边用手按"}], "a": "B", "e": "【考点】皮带张力检查。\n【解析】皮带检查须熄火进行,防手指衣物卷入;按手册用拇指按压挠度或张力计测量,过松打滑、过紧损轴承。故选B。\n【易错】“熄火检查”。A高速运转、C怠速、D运转中手按都会卷入。与609、653题同旋转件风险。"}, {"id": 706, "oid": "B1-103", "type": "single", "module": "汽车发动机维修", "q": "发动机上的塑料（尼龙）真空管老化后拆卸容易碎裂，正确做法是（　）。", "opts": [{"k": "A", "t": "用螺丝刀大力撬"}, {"k": "B", "t": "喷润滑剂软化后轻轻转动拔出，碎片及时清除干净"}, {"k": "C", "t": "用火烧软"}, {"k": "D", "t": "剪断即可，碎片留管内"}], "a": "B", "e": "【考点】塑料真空管拆卸。\n【解析】老化塑料件脆硬,硬撬崩裂伤手、碎片落入进气管;喷润滑剂软化后轻转拔出,碎裂物必须清尽防吸入气缸。故选B。\n【易错】“润滑软化轻拔”。A大力撬,C火烧软化变脆,D碎片留管内会被吸入。塑料件“先软化后轻取”。"}, {"id": 707, "oid": "B1-104", "type": "single", "module": "汽车发动机维修", "q": "两人配合作业（一人操作一人观察）时，正确做法是（　）。", "opts": [{"k": "A", "t": "各行其是"}, {"k": "B", "t": "统一口令和信号，操作者得到确认指令后再起动或施力"}, {"k": "C", "t": "观察者可以随意突然拍肩"}, {"k": "D", "t": "谁先动手听谁"}], "a": "B", "e": "【考点】两人配合作业。\n【解析】起动、吊装、大扭矩施力需统一口令信号,操作者确认后再动作;突然拍肩惊吓会造成误操作伤人。故选B。\n【易错】“口令确认再动作”。A各行其是、C突然拍肩、D听谁的乱套。配合作业“先约定后动手”。"}, {"id": 708, "oid": "B1-105", "type": "single", "module": "汽车发动机维修", "q": "发动机维修中，关于发动机上的高温部件重新装配，操作错误的是（　）。", "opts": [{"k": "A", "t": "排气歧管垫片按规定更换"}, {"k": "B", "t": "热车时徒手紧固排气管螺栓"}, {"k": "C", "t": "螺栓按顺序分次拧紧"}, {"k": "D", "t": "待冷却后拆装"}], "a": "B", "e": "【考点】高温件装配(反向)。\n【解析】热车排气管表面温度高,徒手紧固会烫伤;应在冷却后按顺序分次拧到规定力矩,必要时戴隔热手套。B错误,故选B(题干问“错误的”)。\n【易错】“高温件冷却后拆装”。A垫片按规定换、C分次拧紧、D待冷却都对。与659防烫伤配套。"}, {"id": 709, "oid": "B1-106", "type": "single", "module": "汽车发动机维修", "q": "用风炮拆卸轮胎或飞轮螺栓时，人员应（　）。", "opts": [{"k": "A", "t": "正对螺栓站立观察"}, {"k": "B", "t": "身体避开螺栓和工件甩出方向，必要时用支架托住车轮"}, {"k": "C", "t": "用手扶住螺栓"}, {"k": "D", "t": "让别人用手按住车轮"}], "a": "B", "e": "【考点】风炮使用安全。\n【解析】风炮扭矩大,螺栓松脱瞬间高速飞出会击伤;身体避开螺栓和工件甩出方向,车轮用支架托住,不手扶转动工件。故选B。\n【易错】“避开甩出方向”。与630题配套。A正对站立、C手扶螺栓、D别人按轮都危险。松脱瞬间储能释放。"}, {"id": 710, "oid": "B1-107", "type": "single", "module": "汽车发动机维修", "q": "发动机上的高温排气管、涡轮在维修后，应防止机油滴落在其表面，原因是（　）。", "opts": [{"k": "A", "t": "没有影响"}, {"k": "B", "t": "高温会使机油受热自燃，引发发动机舱火灾"}, {"k": "C", "t": "会降低功率"}, {"k": "D", "t": "会使排气管生锈"}], "a": "B", "e": "【考点】机油滴排气管自燃。\n【解析】排气管、涡轮表面数百摄氏度,滴上机油受热自燃;应擦净残油、消除渗漏,防机舱火灾。故选B。\n【易错】“高温+油=自燃”。与644、669题配套。A没影响、C降功率、D生锈都错。机舱火灾防“油落热面”。"}, {"id": 711, "oid": "B1-108", "type": "single", "module": "汽车发动机维修", "q": "发动机维修现场油液洒漏后的应急处理，正确的是（　）。", "opts": [{"k": "A", "t": "用大量水冲入下水道"}, {"k": "B", "t": "用吸油棉/沙土覆盖吸收后收集到危废桶"}, {"k": "C", "t": "用扫帚扫进地沟"}, {"k": "D", "t": "不管它"}], "a": "B", "e": "【考点】油液洒漏应急处理。\n【解析】油液用吸油棉/沙土覆盖吸附后收集到危废桶,冲入下水道污染环境且违法;及时清理也防滑。故选B。\n【易错】“吸附+危废桶”。与615、666题配套。A冲下水道违法、C扫地沟、D不管都错。油污处理“吸-收-交”。"}, {"id": 712, "oid": "B1-109", "type": "single", "module": "汽车发动机维修", "q": "在发动机舱上方取放工具，正确做法是（　）。", "opts": [{"k": "A", "t": "工具放在翼子板上随手拿"}, {"k": "B", "t": "使用工具腰带或磁性工具盘，防止工具掉落"}, {"k": "C", "t": "把工具扔上车再扔下来"}, {"k": "D", "t": "叠放在进气口"}], "a": "B", "e": "【考点】机舱取放工具。\n【解析】工具放车身上易滑落砸脚、掉入机舱;用工具腰带、磁性盘取用方便,防坠落伤人损件。故选B。\n【易错】“工具腰带/磁性盘”。A放翼子板易滑落、C扔来扔去、D叠进气口会被吸入。工具管理防“坠-落-误入”。"}, {"id": 713, "oid": "B1-110", "type": "single", "module": "汽车发动机维修", "q": "发动机维修中若发现轮胎气压不足、车辆歪斜，应在举升前（　）。", "opts": [{"k": "A", "t": "直接举升"}, {"k": "B", "t": "先检查轮胎、停稳垫好再举升"}, {"k": "C", "t": "放掉更多气"}, {"k": "D", "t": "不管"}], "a": "B", "e": "【考点】举升前整备。\n【解析】轮胎亏气、车辆歪斜影响举升对称稳定,应停平整硬地、检查轮胎、必要时垫好,再按规范举升。故选B。\n【易错】“先整备再举升”。与641题配套。A直接举升、C放气、D不管都错。举升三查:地面、轮胎、支撑。"}, {"id": 714, "oid": "B1-111", "type": "single", "module": "汽车发动机维修", "q": "车辆事故后发动机舱变形、燃油管破裂并有汽油味渗出，现场首要处置是（　）。", "opts": [{"k": "A", "t": "立即打开发动机罩查看"}, {"k": "B", "t": "切断电源、远离明火、备好灭火器并设警戒，联系救援拖车"}, {"k": "C", "t": "用棉布把漏油擦干"}, {"k": "D", "t": "起动车辆试试能否开走"}], "a": "B", "e": "【考点】事故燃油泄漏处置。\n【解析】燃油泄漏遇电火花明火即起火:切断电源、远离明火、备灭火器、设警戒、联系救援拖车;不开盖不起动。故选B。\n【易错】“断电断油警戒”。A开盖看遇火爆炸,C擦干不解决渗漏,D起动引爆。燃油泄漏现场“禁火禁电禁起动”。"}, {"id": 715, "oid": "B1-112", "type": "single", "module": "汽车发动机维修", "q": "更换水泵后试车水温报警、地面有防冻液，正确的安全检查顺序是（　）。", "opts": [{"k": "A", "t": "立即开盖补防冻液"}, {"k": "B", "t": "熄火自然降温泄压后，再检查水管卡箍、水泵密封面和空气是否排尽"}, {"k": "C", "t": "继续高速行驶散热"}, {"k": "D", "t": "用冷水直接冲水箱"}], "a": "B", "e": "【考点】水温报警查漏顺序。\n【解析】水温报警伴漏液说明密封不良或有气阻,热车开盖喷汽烫伤;先熄火自然降温泄压,再查水管卡箍、水泵密封面、排空气。故选B。\n【易错】“降温泄压再查”。与645题重复单选化。A热车开盖、C高速行驶、D冷水冲水箱都错。"}, {"id": 716, "oid": "B1-113", "type": "single", "module": "汽车发动机维修", "q": "机油压力报警灯点亮，同时听到发动机内部金属异响，正确处置是（　）。", "opts": [{"k": "A", "t": "立即靠边熄火，停机检查机油量和机油泵，不得继续行驶"}, {"k": "B", "t": "继续开到修理厂"}, {"k": "C", "t": "加大油门提高油压"}, {"k": "D", "t": "关闭报警灯继续开"}], "a": "A", "e": "【考点】机油压力低+异响。\n【解析】机油压力低加金属响说明润滑失效、可能拉瓦,继续运转迅速抱轴捣缸;立即靠边熄火,查机油量和机油泵。故选A。\n【易错】“立即熄火”。B继续开报废发动机、C加大油门更伤、D关报警灯自欺。机油灯亮=立即停车。"}, {"id": 717, "oid": "B1-114", "type": "single", "module": "汽车发动机维修", "q": "蓄电池严重亏电需跨接起动另一辆救援车，正确接线与安全顺序是（　）。", "opts": [{"k": "A", "t": "先接正极→再接两车负极→起动后先拆正极后拆负极"}, {"k": "B", "t": "先接负极→再接正极"}, {"k": "C", "t": "正负极随意接"}, {"k": "D", "t": "起动后立即全部拔掉"}], "a": "A", "e": "【考点】跨接起动顺序。\n【解析】跨接先接正极→再接两车负极,减小短路火花;拆时相反。题库给定答案为A,注意规范拆卸顺序为先拆负极后拆正极(选项表述以教材为准)。故选A。\n【易错】“接先正、拆先负”。与647题配套。正负极接反烧蚀线束甚至电瓶爆炸。此题为题库差异题,记规范:拆时先负后正。"}, {"id": 718, "oid": "B1-115", "type": "single", "module": "汽车发动机维修", "q": "举升机上更换机油时放油螺塞垫圈损坏导致螺纹滑丝、机油渗漏，正确处置是（　）。", "opts": [{"k": "A", "t": "继续拧入强行密封"}, {"k": "B", "t": "待机油流完后更换螺塞或修复螺纹，清理地面油污，不得带病装配"}, {"k": "C", "t": "涂胶后不换"}, {"k": "D", "t": "不管渗漏"}], "a": "B", "e": "【考点】放油螺塞滑丝处置。\n【解析】滑丝强行装配越漏越大,热机油溅排气管起火;待机油流完后更换螺塞或修复螺纹、清理地面油污,确认密封再加注。故选B。\n【易错】“滑丝必须修”。A强拧、C涂胶不换、D不管都会漏油起火。螺纹修复:换塞、攻丝(加大一级)、钢丝螺套。"}, {"id": 719, "oid": "B1-116", "type": "single", "module": "汽车发动机维修", "q": "发动机无法起动且闻到电瓶处有焦糊味、看到接线柱冒烟，正确排查顺序是（　）。", "opts": [{"k": "A", "t": "立即断电瓶负极、移开易燃物、灭火，再查线路短路"}, {"k": "B", "t": "用手按住冒烟处"}, {"k": "C", "t": "反复拧起动开关"}, {"k": "D", "t": "用水浇接线柱"}], "a": "A", "e": "【考点】接线柱冒烟处置。\n【解析】接线柱冒烟=线路短路大电流发热,有起火危险;立即断电瓶负极、移开易燃物、灭火,再查短路点。故选A。\n【易错】“先断电后排查”。B手按冒烟处烫伤、C反复起动扩大短路、D水浇触电。短路冒烟“先断电”。"}, {"id": 720, "oid": "B1-117", "type": "single", "module": "汽车发动机维修", "q": "大修后使用电钻打磨隔板，同时地面有机油泄漏且电源线绝缘层破损，此时应（　）。", "opts": [{"k": "A", "t": "先继续打磨完"}, {"k": "B", "t": "立即停止作业，更换破损电源线或停用该工具，清理油污后再作业"}, {"k": "C", "t": "用胶布缠一下继续"}, {"k": "D", "t": "用水冲洗油污"}], "a": "B", "e": "【考点】破损电源线作业。\n【解析】电源线破损遇油湿地面有触电风险,油污也滑;先断电停用破损工具、更换电源线、清理油污后再作业。故选B。\n【易错】“先消除隐患”。A继续打磨触电,C胶布缠不可靠,D水冲油污更湿更危险。用电安全三查:漏保、接地、线缆。"}, {"id": 721, "oid": "B1-118", "type": "single", "module": "汽车发动机维修", "q": "两人在车辆下方和上方同时作业拆装发动机机脚胶，下列安全措施最关键的是（　）。", "opts": [{"k": "A", "t": "车下用千斤顶托住发动机、上方约定口令、防止误起动和坠落"}, {"k": "B", "t": "各自抓紧即可"}, {"k": "C", "t": "车钥匙插在车上"}, {"k": "D", "t": "发动机不托住直接拆螺栓"}], "a": "A", "e": "【考点】机脚胶配合拆装。\n【解析】机脚胶拆后发动机失去支承,必须车下千斤顶托住;上方约定口令、拔钥匙挂牌防误起动,防发动机坠落压伤。故选A。\n【易错】“托住+口令+防误起动”。与646题配套。B各自抓紧、C钥匙插车上、D不托直接拆螺栓都危险。"}, {"id": 722, "oid": "B1-119", "type": "single", "module": "汽车发动机维修", "q": "冬季维修发现车辆因冷却液冰点不足曾结冰冻裂水箱，再次加注冷却液前应（　）。", "opts": [{"k": "A", "t": "直接补加水"}, {"k": "B", "t": "检查确认水道无渗漏、无冻裂，加注规定牌号防冻液并测冰点"}, {"k": "C", "t": "加自来水即可"}, {"k": "D", "t": "继续使用原冷却液"}], "a": "B", "e": "【考点】冻裂水箱处置。\n【解析】冻裂后系统有隐性裂纹残余应力,直接加水复热渗漏扩大;先查漏修复,再加规定牌号防冻液并测冰点达标。故选B。\n【易错】“查漏+测冰点”。A直接加水、C自来水、D继续旧液都会二次冻裂。防冻液冰点要低于当地最低气温。"}, {"id": 723, "oid": "B1-120", "type": "single", "module": "汽车发动机维修", "q": "更换涡轮增压器后，进气和润滑油管内残留清洗剂或异物，起动前必须（　）。", "opts": [{"k": "A", "t": "直接起动"}, {"k": "B", "t": "检查管路清洁无异物、按规定预润滑，确认机油压力正常后再起动"}, {"k": "C", "t": "多喷油帮助起动"}, {"k": "D", "t": "拆空气滤芯"}], "a": "B", "e": "【考点】涡轮增压器预润滑。\n【解析】增压器转速高润滑严,残留异物打坏叶轮、缺油起动烧轴瓦;检查管路清洁、按规定预润滑、确认机油压力正常再起动。故选B。\n【易错】“预润滑+查油压”。A直接起动烧轴瓦、C多喷油无效、D拆空滤无关。换增压器“先油后转”。"}, {"id": 724, "oid": "B1-121", "type": "single", "module": "汽车发动机维修", "q": "发动机同时存在底盘和发动机两处作业，为防止误起动和互相伤害，正确做法是（　）。", "opts": [{"k": "A", "t": "各自为战"}, {"k": "B", "t": "统一指挥、拔钥匙挂牌、明确谁在车下、谁负责起动"}, {"k": "C", "t": "一人在车下一人随意拧钥匙"}, {"k": "D", "t": "用喇叭通知即可"}], "a": "B", "e": "【考点】多处作业协调。\n【解析】底盘+发动机多处作业最易误起动伤人:统一指挥、拔钥匙挂牌、明确谁在车下谁负责起动、确认无人危险区再操作。故选B。\n【易错】“统一指挥”。A各自为战、C一人随意拧钥匙、D喇叭通知不可靠。多工位作业“一口令一指挥”。"}, {"id": 725, "oid": "B1-122", "type": "single", "module": "汽车发动机维修", "q": "对车身进行焊接（动火）同时发动机舱有历史漏油痕迹，正确做法是（　）。", "opts": [{"k": "A", "t": "边焊边擦"}, {"k": "B", "t": "先彻底清除油污、备好灭火器、办理动火许可并设监火人，作业后留观"}, {"k": "C", "t": "直接焊"}, {"k": "D", "t": "用水冲油污后立即焊"}], "a": "B", "e": "【考点】焊接动火+油污。\n【解析】油污+焊渣=火灾:先彻底清除油污、备灭火器、办理动火许可、设监火人,作业后留观;水冲未干即焊有触电爆燃风险。故选B。\n【易错】“清油+审批+监火”。与682题配套。A边焊边擦、C直接焊、D水冲即焊都错。动火“先清场后点火”。"}, {"id": 726, "oid": "B1-123", "type": "single", "module": "汽车发动机维修", "q": "用扭力扳手复检缸盖螺栓时发现力矩明显低于规定值，且发动机曾出现过冷却液窜入现象，应（　）。", "opts": [{"k": "A", "t": "继续装车使用"}, {"k": "B", "t": "停机解体检查缸盖垫和缸盖平面，查明密封失效原因后再按规范复装"}, {"k": "C", "t": "把螺栓再拧紧几圈即可"}, {"k": "D", "t": "补加冷却液继续用"}], "a": "B", "e": "【考点】缸盖密封失效排查。\n【解析】缸盖螺栓力矩衰减+冷却液窜缸说明气缸垫密封失效,单纯补紧不能消除裂纹或平面翘曲;解体检查缸垫、缸盖平面度后复装。故选B。\n【易错】“查根因不复装”。A继续用漏液,C多拧几圈治标不治本,D补冷却液掩盖。窜缸查“垫-面-螺栓”三因。"}, {"id": 727, "oid": "B4-006", "type": "judge", "module": "汽车发动机维修", "q": "活塞的主要作用是承受气缸内燃气压力，并通过活塞销和连杆把力传给曲轴。", "opts": [], "a": "√", "e": "【考点】活塞作用。\n【解析】活塞承受气缸内燃气压力,经活塞销、连杆把力传给曲轴输出转矩。题干正确,判断为√。\n【易错】“活塞-销-连杆-曲轴”传力链。活塞是燃气压力到旋转动力的第一环。"}, {"id": 728, "oid": "B4-007", "type": "judge", "module": "汽车发动机维修", "q": "现代汽车发动机活塞广泛采用铝合金制造，因其导热性好、质量轻、膨胀系数小。", "opts": [], "a": "√", "e": "【考点】活塞材料。\n【解析】铝合金活塞导热好、质量轻、往复惯性力小,现代发动机广泛采用;铸铁质量大已少用。题干正确,判断为√。\n【易错】“铝活塞三优点:导热、轻、惯性小”。注意题目说“膨胀系数小”是教材常见表述(相对铸铁铝膨胀大,但靠结构补偿),本题按题干判√。"}, {"id": 729, "oid": "B4-008", "type": "judge", "module": "汽车发动机维修", "q": "活塞裙部的主要作用是为活塞在气缸内运动导向，并承受侧压力。", "opts": [], "a": "√", "e": "【考点】活塞裙部作用。\n【解析】裙部与气缸壁配合起导向作用,并承受侧向力,保证活塞不倾斜不敲缸。题干正确,判断为√。\n【易错】“裙部=导向+承侧压力”。裙部是活塞与缸壁的直接接触段。"}, {"id": 730, "oid": "B4-009", "type": "judge", "module": "汽车发动机维修", "q": "活塞顶部是燃烧室的组成部分，直接承受高温高压燃气的作用。", "opts": [], "a": "√", "e": "【考点】活塞顶部。\n【解析】活塞顶与缸盖底面构成燃烧室,直接承受高温高压燃气,热负荷最高。题干正确,判断为√。\n【易错】“顶部=燃烧室一部分”。顶部形状(平/凹/凸)决定燃烧室形状。"}, {"id": 731, "oid": "B4-010", "type": "judge", "module": "汽车发动机维修", "q": "为减小裙部热变形，通常将活塞裙部横断面制成椭圆形，其长轴沿活塞销座方向布置。", "opts": [], "a": "×", "e": "【考点】裙部椭圆方向。\n【解析】销座方向金属多、膨胀大,故椭圆长轴垂直于活塞销方向(沿受力方向),补偿销座方向膨胀。题干说“长轴沿销座方向”,错误,判断为×。\n【易错】“长轴垂直销座”。这是判断题高频易错点:活塞受力方向(垂直销孔)膨胀小,销座方向膨胀大,故长轴垂直销孔。"}, {"id": 732, "oid": "B4-011", "type": "judge", "module": "汽车发动机维修", "q": "气环的主要作用是密封气缸，防止燃气漏入曲轴箱，并把活塞头部热量传给气缸壁。", "opts": [], "a": "√", "e": "【考点】气环作用。\n【解析】气环靠弹性贴紧缸壁密封燃气防漏入曲轴箱,并把活塞顶热量导给缸壁散热。题干正确,判断为√。\n【易错】“气环=密封+导热”。气环两作用:密封(主)、导热(辅)。与油环刮油区别开。"}, {"id": 733, "oid": "B4-012", "type": "judge", "module": "汽车发动机维修", "q": "油环的主要作用是刮除气缸壁上多余的机油，并在缸壁上均匀布油形成油膜。", "opts": [], "a": "√", "e": "【考点】油环作用。\n【解析】油环下行刮除缸壁多余机油、上行均匀布油形成油膜,控制缸壁油量防窜油燃烧。题干正确,判断为√。\n【易错】“油环=刮油布油”。油环控制机油消耗,气环管密封。一密封一刮油,别混。"}, {"id": 734, "oid": "B4-013", "type": "judge", "module": "汽车发动机维修", "q": "安装扭曲环时，应将其内圆切口（倒角）向上、外圆切口向下，使环产生扭曲刮油。", "opts": [], "a": "√", "e": "【考点】扭曲环安装方向。\n【解析】扭曲环内圆切口向上、外圆切口向下,环受热扭曲后外缘与缸壁呈线接触,密封刮油更好。题干正确,判断为√。\n【易错】“内切口上、外切口下”。装反扭曲方向相反,密封失效、窜油。安装方向是维修考核点。"}, {"id": 735, "oid": "B4-014", "type": "judge", "module": "汽车发动机维修", "q": "活塞环端隙（开口间隙）是指活塞装入气缸后，环开口处两端之间的间隙。", "opts": [], "a": "√", "e": "【考点】端隙定义。\n【解析】端隙(开口间隙)=环装入气缸后开口两端之间间隙,为环受热膨胀留余地,防环口顶死折断。题干正确,判断为√。\n【易错】“端隙=开口间隙”。与背隙、侧隙三者区分:端隙(开口)、侧隙(上下)、背隙(径向)。"}, {"id": 736, "oid": "B4-015", "type": "judge", "module": "汽车发动机维修", "q": "活塞环侧隙过大，泵油作用增强、机油消耗增加；侧隙过小，环易在环槽内卡死。", "opts": [], "a": "√", "e": "【考点】侧隙影响。\n【解析】侧隙过大环上下窜动泵油强、机油消耗大;过小环受热卡死失去弹性。题干正确,判断为√。\n【易错】“侧隙过大泵油、过小卡死”。侧隙过小卡死是环折断诱因之一。间隙“过大窜油、过小卡滞”。"}, {"id": 737, "oid": "B4-016", "type": "judge", "module": "汽车发动机维修", "q": "活塞销用来连接活塞和连杆小头，并将活塞承受的力传给连杆。", "opts": [], "a": "√", "e": "【考点】活塞销作用。\n【解析】活塞销穿连活塞销座与连杆小头,是活塞与连杆之间的传力铰接件。题干正确,判断为√。\n【易错】“销=传力铰接”。活塞力→销→连杆小头。"}, {"id": 738, "oid": "B4-017", "type": "judge", "module": "汽车发动机维修", "q": "全浮式活塞销在发动机正常工作温度下，可在连杆小头衬套和活塞销座孔内缓慢转动。", "opts": [], "a": "√", "e": "【考点】全浮式活塞销。\n【解析】全浮式销在连杆小头衬套和活塞销座孔内都能缓慢转动,磨损均匀,汽油机常用。题干正确,判断为√。\n【易错】“全浮=两处都转”。与半浮式(固定小头)区别:全浮磨损均匀、半浮结构简单。"}, {"id": 739, "oid": "B4-018", "type": "judge", "module": "汽车发动机维修", "q": "半浮式活塞销是将活塞销固定在连杆小头孔中，只在活塞销座孔内转动。", "opts": [], "a": "√", "e": "【考点】半浮式活塞销。\n【解析】半浮式销与连杆小头孔紧配固定,只在活塞销座孔内转动。题干正确,判断为√。\n【易错】“半浮=小头固定”。与738题对偶记忆:全浮两处转、半浮小头锁。"}, {"id": 740, "oid": "B4-019", "type": "judge", "module": "汽车发动机维修", "q": "连杆大头是分开的，分开部分称为连杆盖，两者用连杆螺栓连接成一体。", "opts": [], "a": "√", "e": "【考点】连杆大头结构。\n【解析】连杆大头剖开分成连杆体和连杆盖,用连杆螺栓紧固成一体,便于装到曲轴连杆轴颈。题干正确,判断为√。\n【易错】“大头分体+螺栓连”。大头必须剖分才能套上曲轴轴颈。"}, {"id": 741, "oid": "B4-020", "type": "judge", "module": "汽车发动机维修", "q": "连杆螺栓是重要紧固件，拆装时应按规定力矩分次均匀拧紧并检查锁止装置。", "opts": [], "a": "√", "e": "【考点】连杆螺栓。\n【解析】连杆螺栓受交变载荷,力矩不足松动、过大会拉伸断裂,必须按规定力矩分次均匀拧紧并锁止。题干正确,判断为√。\n【易错】“连杆螺栓=关键紧固件”。与629、703题配套。连杆螺栓失效=捣缸,力矩必须精确。"}, {"id": 742, "oid": "B4-021", "type": "judge", "module": "汽车发动机维修", "q": "连杆轴瓦装在连杆大头孔和连杆盖内，起减磨和支承连杆轴颈的作用。", "opts": [], "a": "√", "e": "【考点】连杆轴瓦。\n【解析】轴瓦衬在连杆大头孔和连杆盖内,形成滑动轴承,减磨并支承连杆轴颈。题干正确,判断为√。\n【易错】“轴瓦=减磨支承”。轴瓦有定位唇防转动,选配注意与轴颈间隙。"}, {"id": 743, "oid": "B4-022", "type": "judge", "module": "汽车发动机维修", "q": "为保证连杆大头与连杆盖不装错，两者打有配对记号，装配时记号必须在同一侧。", "opts": [], "a": "√", "e": "【考点】连杆配对记号。\n【解析】连杆盖与大头配对镗削加工,互换破坏圆度和配合,故配对记号必须同侧。题干正确,判断为√。\n【易错】“记号同侧”。与769题配套。配对件“不换位、不混装”。"}, {"id": 744, "oid": "B4-023", "type": "judge", "module": "汽车发动机维修", "q": "连杆在工作中只受拉力，不受压力和弯曲作用。", "opts": [], "a": "×", "e": "【考点】连杆受力分析。\n【解析】连杆做功行程受压、惯性力作用下受拉,且受压时杆身受弯曲,属交变载荷。题干说“只受拉力”,错误,判断为×。\n【易错】“连杆拉压交变”。连杆受:压力+拉力+弯曲。只受拉力是错误认识,判断易错点。"}, {"id": 745, "oid": "B4-024", "type": "judge", "module": "汽车发动机维修", "q": "活塞销座处金属多、受热膨胀大，为此常在裙部开有膨胀槽（T形或U形槽）。", "opts": [], "a": "√", "e": "【考点】裙部膨胀槽。\n【解析】销座处金属多、膨胀大,裙部开T/U形膨胀槽增加弹性,补偿销座方向热膨胀,防卡死。题干正确,判断为√。\n【易错】“膨胀槽补偿销座膨胀”。与731题配套:椭圆长轴+膨胀槽都是防销座方向卡死的手段。"}, {"id": 746, "oid": "B4-025", "type": "judge", "module": "汽车发动机维修", "q": "活塞头部第一道环槽以上开有绝热槽（恒温槽），目的是减少头部热量向裙部传递。", "opts": [], "a": "√", "e": "【考点】绝热槽。\n【解析】第一道环槽以上开绝热(恒温)槽,切断部分传热通道,减少热量向裙部传递,保持配合间隙。题干正确,判断为√。\n【易错】“绝热槽=隔热”。绝热槽与膨胀槽作用不同:前者隔热保间隙、后者补偿膨胀。高强化柴油机常用。"}, {"id": 747, "oid": "B4-026", "type": "judge", "module": "汽车发动机维修", "q": "更换活塞环时应同时检查气缸壁磨损，若气缸磨损超限应先镗缸或换缸套再换环。", "opts": [], "a": "√", "e": "【考点】换环先查缸壁。\n【解析】缸壁磨损起棱失圆时新环不能贴合,换环很快窜油;先镗缸或换缸套再换环。题干正确,判断为√。\n【易错】“先修缸再换环”。换环不修缸=白换。维修思路:查根因再换件。"}, {"id": 748, "oid": "B4-027", "type": "judge", "module": "汽车发动机维修", "q": "测量活塞环端隙时，应将活塞环平推入气缸下部未磨损处，再用塞尺测量开口间隙。", "opts": [], "a": "√", "e": "【考点】端隙测量位置。\n【解析】端隙应在气缸下部未磨损处测量(用活塞头部推平),才反映环与缸壁真实端隙,再用塞尺量开口。题干正确,判断为√。\n【易错】“下部未磨损处”。上部磨损处测端隙偏小失真。测量位置是实操考点。"}, {"id": 749, "oid": "B4-028", "type": "judge", "module": "汽车发动机维修", "q": "安装活塞连杆组时，活塞顶部的朝前记号应朝向发动机前端。", "opts": [], "a": "√", "e": "【考点】朝前记号。\n【解析】活塞顶朝前记号对准发动机前端,保证燃烧室形状、避阀坑和连杆方向与原设计一致。题干正确,判断为√。\n【易错】“记号朝前”。装反会顶气门、燃烧室错位。活塞连杆组装配“对记号”三步:环口错开、记号朝前、配对同侧。"}, {"id": 750, "oid": "B4-029", "type": "judge", "module": "汽车发动机维修", "q": "活塞环的泵油作用会使缸壁机油经环与环槽间隙被泵入燃烧室，导致机油消耗增大。", "opts": [], "a": "√", "e": "【考点】泵油作用。\n【解析】气环往复运动像泵一样把缸壁机油经环与环槽间隙压入燃烧室,是窜机油的重要原因。题干正确,判断为√。\n【易错】“泵油=窜机油主因”。侧隙大、扭曲环装反都加剧泵油。冒蓝烟查“环-油-间隙”。"}, {"id": 751, "oid": "B4-030", "type": "judge", "module": "汽车发动机维修", "q": "铝合金活塞膨胀系数比铸铁大，因此活塞与气缸壁之间必须留有适当的热态间隙。", "opts": [], "a": "√", "e": "【考点】铝活塞热态间隙。\n【解析】铝膨胀系数比铸铁大,不留间隙热车胀死拉缸;间隙过小抱缸、过大敲缸窜气。题干正确,判断为√。\n【易错】“间隙过大敲缸、过小抱缸”。铝活塞必须留热态间隙。与764题配套。"}, {"id": 752, "oid": "B4-031", "type": "judge", "module": "汽车发动机维修", "q": "活塞裙部制成上小下大的锥形，是为补偿活塞沿高度方向受热膨胀不均匀。", "opts": [], "a": "√", "e": "【考点】裙部锥形。\n【解析】活塞上部温度高膨胀大、下部低,裙部做成上小下大锥形,热态后趋于正圆柱。题干正确,判断为√。\n【易错】“上小下大锥形”。与763题配套。活塞形状设计都是为补偿热膨胀不均匀。"}, {"id": 753, "oid": "B4-032", "type": "judge", "module": "汽车发动机维修", "q": "连杆杆身通常做成工字形断面，以在保证刚度强度的前提下减轻质量。", "opts": [], "a": "√", "e": "【考点】连杆杆身断面。\n【解析】工字形断面抗弯抗扭强且省材料,使连杆质量小、往复惯性力小。题干正确,判断为√。\n【易错】“工字形=轻而强”。连杆轻量化减惯性力。工字梁是抗弯经典断面。"}, {"id": 754, "oid": "B4-033", "type": "judge", "module": "汽车发动机维修", "q": "为使发动机运转平稳，同一台发动机各连杆的质量应尽量一致，并按大小头分别分组称重。", "opts": [], "a": "√", "e": "【考点】连杆质量分组。\n【解析】各连杆质量差过大会引起运转不平衡振动,按大小头分别分组称重选配。题干正确,判断为√。\n【易错】“分组称重”。与775题(活塞同组)配套。动平衡质量靠分组控制。"}, {"id": 755, "oid": "B4-034", "type": "judge", "module": "汽车发动机维修", "q": "拆卸活塞连杆组前，应先检查缸口是否有台阶，必要时用缸口铰刀去除，以免拉坏活塞环。", "opts": [], "a": "√", "e": "【考点】缸口台阶处理。\n【解析】缸口磨损形成台阶,抽出连杆时活塞环被台阶挂断,先铰掉台阶再拆。题干正确,判断为√。\n【易错】“先铰台阶”。不铰台阶拆装必断环。拆卸前检查是规范操作。"}, {"id": 756, "oid": "B4-035", "type": "judge", "module": "汽车发动机维修", "q": "连杆弯扭曲校正后，应进行时效处理，防止校正产生的内应力使连杆再次变形。", "opts": [], "a": "√", "e": "【考点】连杆校正时效。\n【解析】冷压校正产生内应力,时效(或加温)处理消除应力,稳定形状防再变形。题干正确,判断为√。\n【易错】“校正后时效”。不时效连杆装车后回弹变形。金属加工“校正必时效”。"}, {"id": 757, "oid": "B4-036", "type": "judge", "module": "汽车发动机维修", "q": "活塞环装入环槽后，应能在槽内自由转动，无卡滞现象。", "opts": [], "a": "√", "e": "【考点】环在槽内活动。\n【解析】环装槽后应活动自如、无卡滞;卡滞说明侧隙过小或积炭,会导致密封失效。题干正确,判断为√。\n【易错】“环应自由转动”。卡滞=隐患。装环后检查“转动灵活”。"}, {"id": 758, "oid": "B4-037", "type": "judge", "module": "汽车发动机维修", "q": "桶面环与气缸壁呈圆弧接触，磨合好、密封性好，适合高速高负荷发动机。", "opts": [], "a": "√", "e": "【考点】桶面环。\n【解析】桶面环与缸壁圆弧接触,上下行都形成楔形油膜,润滑好、磨合快、密封好,适合高速高负荷柴油机。题干正确,判断为√。\n【易错】“桶面=楔形油膜”。桶面环是对传统矩形环的改进,广泛用于柴油机。"}, {"id": 759, "oid": "B4-038", "type": "judge", "module": "汽车发动机维修", "q": "活塞顶部形状中，平顶结构简单、受热面积小，应用最广。", "opts": [], "a": "√", "e": "【考点】平顶活塞。\n【解析】平顶结构简单、受热面积小,汽油机多用平顶或微凸顶。题干正确,判断为√。\n【易错】“汽油机平顶、柴油机凹顶”。与760题配套。顶部形状随机型用途。"}, {"id": 760, "oid": "B4-039", "type": "judge", "module": "汽车发动机维修", "q": "柴油机活塞顶部多采用凹顶（ω形或球形），以形成燃烧室并促进混合气形成。", "opts": [], "a": "√", "e": "【考点】柴油机凹顶活塞。\n【解析】柴油机靠压缩着火,活塞顶凹坑与缸盖构成燃烧室,组织涡流促进混合气形成。题干正确,判断为√。\n【易错】“凹顶=燃烧室”。ω形/球形凹坑组织空气涡流。与759题对比记忆。"}, {"id": 761, "oid": "B4-040", "type": "judge", "module": "汽车发动机维修", "q": "活塞销一般用低碳钢或低碳合金钢制造，表面经渗碳淬火提高耐磨性。", "opts": [], "a": "√", "e": "【考点】活塞销材料。\n【解析】活塞销用低碳钢/低碳合金钢,表面渗碳淬火实现外硬内韧:表面耐磨、内部抗冲击。题干正确,判断为√。\n【易错】“渗碳=外硬内韧”。渗碳件心部低碳保持韧性。典型渗碳件:活塞销、齿轮。"}, {"id": 762, "oid": "B4-041", "type": "judge", "module": "汽车发动机维修", "q": "全浮式活塞销销座两端装有卡环（挡圈），防止活塞销轴向窜动刮伤气缸壁。", "opts": [], "a": "√", "e": "【考点】全浮销卡环。\n【解析】全浮销工作时轴向游动,两端卡环(挡圈)限位,防销端刮伤缸壁。题干正确,判断为√。\n【易错】“卡环防窜动”。卡环漏装→销窜动刮缸壁(拉缸)。拆装防漏件。"}, {"id": 763, "oid": "B4-042", "type": "judge", "module": "汽车发动机维修", "q": "测量活塞裙部直径时，应在垂直于活塞销轴线方向、裙部规定位置测量。", "opts": [], "a": "√", "e": "【考点】裙部直径测量。\n【解析】裙部椭圆长轴垂直销孔,故在垂直活塞销轴线方向、裙部规定位置测量才是真实直径。题干正确,判断为√。\n【易错】“垂直销孔方向测”。测量方向错误=数据失真。与731题配套。"}, {"id": 764, "oid": "B4-043", "type": "judge", "module": "汽车发动机维修", "q": "活塞与气缸配合间隙过小，发动机热车时易出现活塞拉缸、卡死（抱缸）现象。", "opts": [], "a": "√", "e": "【考点】配合间隙过小。\n【解析】间隙过小热膨胀后活塞与缸壁咬死,拉伤表面甚至抱缸。题干正确,判断为√。\n【易错】“过小抱缸、过大敲缸”。与751题配套。配合间隙是装配质量核心。"}, {"id": 765, "oid": "B4-044", "type": "judge", "module": "汽车发动机维修", "q": "连杆大头剖分有平切口和斜切口两种，斜切口常用于强化柴油机以减小大头径向尺寸。", "opts": [], "a": "√", "e": "【考点】连杆切口形式。\n【解析】平切口和斜切口两种;斜切口减小大头径向尺寸、便于从缸上端抽出,强化柴油机常用。题干正确,判断为√。\n【易错】“斜切口=小尺寸”。斜切口配合锯齿定位抗剪切(766题)。"}, {"id": 766, "oid": "B4-045", "type": "judge", "module": "汽车发动机维修", "q": "斜切口连杆大头结合面靠锯齿（或定位套筒）定位，以承受工作中的横向剪切力。", "opts": [], "a": "√", "e": "【考点】斜切口定位。\n【解析】斜切口结合面受横向剪切力有滑移趋势,靠锯齿(或定位套筒)定位抗剪切。题干正确,判断为√。\n【易错】“锯齿抗剪切”。斜切口必须定位装置,否则工作错位断螺栓。"}, {"id": 767, "oid": "B4-046", "type": "judge", "module": "汽车发动机维修", "q": "安装活塞环应使用活塞环卡钳（扩张钳），不得用手随意掰开，以防环变形折断。", "opts": [], "a": "√", "e": "【考点】活塞环安装工具。\n【解析】用专用活塞环卡钳(扩张钳)均匀扩张安装,手掰易过度张开产生塑性变形或折断。题干正确,判断为√。\n【易错】“专用卡钳”。徒手掰环是装配大忌。装环“扩张有度、环口错位”。"}, {"id": 768, "oid": "B4-047", "type": "judge", "module": "汽车发动机维修", "q": "活塞环背隙是指环装入环槽后，环背面与环槽底之间的径向间隙。", "opts": [], "a": "√", "e": "【考点】背隙定义。\n【解析】背隙=环装入环槽后,环背面与环槽底之间径向间隙,为环径向退让和积炭容纳留余地。题干正确,判断为√。\n【易错】“三隙分辨”。端隙(开口)、侧隙(上下)、背隙(径向)。定义题必考。"}, {"id": 769, "oid": "B4-048", "type": "judge", "module": "汽车发动机维修", "q": "拆装活塞连杆组时，应按气缸顺序摆放零件，并注意各缸配对记号，不得混装。", "opts": [], "a": "√", "e": "【考点】按缸序摆放零件。\n【解析】各缸活塞、连杆、轴瓦都是配对选配,拆装按气缸顺序摆放、注意配对记号,不得混装。题干正确,判断为√。\n【易错】“按缸序+记号”。与743题配套。混装破坏配合平衡。"}, {"id": 770, "oid": "B4-049", "type": "judge", "module": "汽车发动机维修", "q": "活塞环端隙过小，发动机工作时环受热膨胀会被顶死、折断；过大则漏气窜油。", "opts": [], "a": "√", "e": "【考点】端隙影响。\n【解析】端隙过小环受热膨胀顶死折断,过大密封不良漏气窜油。题干正确,判断为√。\n【易错】“端隙过小折断”。与778题配套。端隙是最易超限的间隙之一。"}, {"id": 771, "oid": "B4-050", "type": "judge", "module": "汽车发动机维修", "q": "连杆小头衬套压入后，需用铰刀或珩磨加工至规定尺寸，并测量与活塞销的配合间隙。", "opts": [], "a": "√", "e": "【考点】衬套铰削。\n【解析】连杆小头衬套压入后内孔变形,用铰刀或珩磨加工至规定尺寸,测量与活塞销配合间隙。题干正确,判断为√。\n【易错】“压入必铰削”。衬套过盈压入内孔缩小,不加工无法装配。"}, {"id": 772, "oid": "B4-051", "type": "judge", "module": "汽车发动机维修", "q": "检查连杆小头衬套磨损时，常用内径百分表测衬套内径，与活塞销外径比较求间隙。", "opts": [], "a": "√", "e": "【考点】衬套磨损检测。\n【解析】衬套磨损内径增大、间隙变大,用内径百分表测衬套内径,与活塞销外径(千分尺)比较求间隙。题干正确,判断为√。\n【易错】“内径表+千分尺配合”。间隙=孔径-销径。测量工具配对使用是实操考点。"}, {"id": 773, "oid": "B4-052", "type": "judge", "module": "汽车发动机维修", "q": "活塞工作时承受周期性气体压力和惯性力，是发动机中工作条件最苛刻的零件之一。", "opts": [], "a": "√", "e": "【考点】活塞工作条件。\n【解析】活塞高温、高速往复,受交变气体压力和惯性力,润滑条件差,是发动机工作条件最苛刻的零件之一。题干正确,判断为√。\n【易错】“苛刻=高温高压交变”。活塞-连杆-曲轴是曲柄连杆机构三大件,活塞首当其冲。"}, {"id": 774, "oid": "B4-053", "type": "judge", "module": "汽车发动机维修", "q": "采用喷油嘴向活塞内腔喷机油冷却（油冷活塞），目的是降低活塞顶温度，防止过热烧顶。", "opts": [], "a": "√", "e": "【考点】油冷活塞。\n【解析】高强化柴油机活塞热负荷大,喷油嘴向活塞顶内腔喷机油带走热量,降低顶温防烧顶。题干正确,判断为√。\n【易错】“油冷=防烧顶”。喷油冷却与润滑销座不同:目的在冷却。与791题配套。"}, {"id": 775, "oid": "B4-054", "type": "judge", "module": "汽车发动机维修", "q": "更换活塞时，同一台发动机应选用同一厂牌、同一分组尺寸的活塞，保证质量和间隙一致。", "opts": [], "a": "√", "e": "【考点】活塞选配。\n【解析】活塞按尺寸分组,同一发动机选同一厂牌、同组尺寸,保证质量和间隙一致、各缸平衡。题干正确,判断为√。\n【易错】“同厂牌同组”。混装活塞间隙不一,冷敲缸热抱缸。与754题(连杆分组)配套。"}, {"id": 776, "oid": "B4-055", "type": "judge", "module": "汽车发动机维修", "q": "活塞裙部镀锡（或石墨）处理的目的是改善磨合性能、减少拉缸倾向。", "opts": [], "a": "√", "e": "【考点】裙部镀层。\n【解析】裙部镀锡(或石墨)改善初期磨合、防止拉缸,提高跑合性。题干正确,判断为√。\n【易错】“镀层=磨合防拉缸”。与803题配套。镀层作用是“跑合”不是“加硬”。"}, {"id": 777, "oid": "B4-056", "type": "judge", "module": "汽车发动机维修", "q": "发动机机油消耗大、排气管冒蓝烟，拆检发现气环开口未错开且端隙过大，故障为活塞环密封不良窜机油。", "opts": [], "a": "√", "e": "【考点】烧机油故障判断。\n【解析】冒蓝烟+拆检环口未错开、端隙过大=气环密封不良、机油上窜,属活塞环装配与磨损综合故障。题干正确,判断为√。\n【易错】“蓝烟=窜机油”。环口错开(相邻环口错开90°~180°)是装配要点。诊断链:冒烟→查环→查缸。"}, {"id": 778, "oid": "B4-057", "type": "judge", "module": "汽车发动机维修", "q": "活塞环端隙过小是造成活塞环折断的常见原因之一。", "opts": [], "a": "√", "e": "【考点】端隙过小折断。\n【解析】端隙过小环受热膨胀无余地,开口顶死产生内应力导致折断,是环折断常见原因。题干正确,判断为√。\n【易错】“端隙小=折断”。与770题配套。端隙是“热膨胀余量”。"}, {"id": 779, "oid": "B4-058", "type": "single", "module": "汽车发动机维修", "q": "活塞由顶部、头部和（　）三部分组成。", "opts": [{"k": "A", "t": "销座"}, {"k": "B", "t": "裙部"}, {"k": "C", "t": "底部"}, {"k": "D", "t": "燃烧室"}], "a": "B", "e": "【考点】活塞三部分。\n【解析】活塞由顶部、头部(环带部)和裙部三部分组成;销座在裙部中部,不是独立第三部分。故选B。\n【易错】“顶-头-裙”。A销座、C底部、D燃烧室都是干扰。活塞结构组成题高频。"}, {"id": 780, "oid": "B4-059", "type": "single", "module": "汽车发动机维修", "q": "现代汽车发动机活塞广泛采用的材料是（　）。", "opts": [{"k": "A", "t": "灰铸铁"}, {"k": "B", "t": "铝合金"}, {"k": "C", "t": "铜合金"}, {"k": "D", "t": "铸钢"}], "a": "B", "e": "【考点】活塞材料。\n【解析】铝合金活塞质量轻、导热好,现代发动机广泛采用;铸铁质量大已少用。故选B。\n【易错】“铝合金”。与728题配套。A灰铸铁、C铜合金、D铸钢都是干扰。"}, {"id": 781, "oid": "B4-060", "type": "single", "module": "汽车发动机维修", "q": "活塞顶部形状中，结构最简单、受热面积最小、应用最广的是（　）。", "opts": [{"k": "A", "t": "平顶"}, {"k": "B", "t": "凸顶"}, {"k": "C", "t": "凹顶"}, {"k": "D", "t": "楔形顶"}], "a": "A", "e": "【考点】平顶活塞。\n【解析】平顶结构简单、吸热少,汽油机应用最广;凹顶用于柴油机。故选A。\n【易错】“汽油机平顶”。与760、792题配套。B凸顶、C凹顶、D楔形顶各有用途。"}, {"id": 782, "oid": "B4-061", "type": "single", "module": "汽车发动机维修", "q": "为使裙部受热后保持正确圆柱形，常将裙部横断面制成椭圆形，其长轴方向为（　）。", "opts": [{"k": "A", "t": "沿活塞销轴线方向"}, {"k": "B", "t": "垂直于活塞销轴线方向"}, {"k": "C", "t": "与销孔成45°"}, {"k": "D", "t": "任意方向"}], "a": "B", "e": "【考点】裙部椭圆长轴方向。\n【解析】销座方向金属多膨胀大,椭圆长轴垂直于销孔,补偿销孔方向膨胀,使热态接近正圆。故选B。\n【易错】“长轴垂直销孔”。与731题配套(判断+单选双考)。A沿销孔、C45°、D任意都错。"}, {"id": 783, "oid": "B4-062", "type": "single", "module": "汽车发动机维修", "q": "活塞裙部制成上小下大的锥形，主要目的是（　）。", "opts": [{"k": "A", "t": "减轻质量"}, {"k": "B", "t": "补偿沿高度方向受热膨胀不均匀"}, {"k": "C", "t": "增大强度"}, {"k": "D", "t": "减小摩擦"}], "a": "B", "e": "【考点】裙部锥形目的。\n【解析】上部温度高膨胀大,做成上小下大锥形,热态后裙部趋于正圆柱,保持正确间隙。故选B。\n【易错】“补偿受热膨胀不均”。与752题配套。A减轻质量、C增大强度、D减小摩擦是干扰。"}, {"id": 784, "oid": "B4-063", "type": "single", "module": "汽车发动机维修", "q": "活塞销座通常位于活塞的（　）。", "opts": [{"k": "A", "t": "顶部"}, {"k": "B", "t": "头部"}, {"k": "C", "t": "裙部中部"}, {"k": "D", "t": "底部"}], "a": "C", "e": "【考点】销座位置。\n【解析】活塞销座位于裙部中部,安装活塞销连接连杆小头。故选C。\n【易错】“销座在裙部”。A顶部、B头部、D底部都错。与779题(三部分)配套。"}, {"id": 785, "oid": "B4-064", "type": "single", "module": "汽车发动机维修", "q": "铝合金活塞膨胀系数大，为补偿裙部热变形，常在裙部开有（　）。", "opts": [{"k": "A", "t": "油孔"}, {"k": "B", "t": "膨胀槽（T形或U形槽）"}, {"k": "C", "t": "减重孔"}, {"k": "D", "t": "散热片"}], "a": "B", "e": "【考点】膨胀槽。\n【解析】膨胀槽(T/U形)切开裙部增加弹性,补偿销座方向热膨胀,防卡死。故选B。\n【易错】“膨胀槽=补偿膨胀”。与745题配套。A油孔、C减重孔、D散热片是干扰。"}, {"id": 786, "oid": "B4-065", "type": "single", "module": "汽车发动机维修", "q": "活塞头部（环带部）的主要作用是（　）。", "opts": [{"k": "A", "t": "安装活塞环、密封气缸并导热"}, {"k": "B", "t": "导向"}, {"k": "C", "t": "承受侧压力"}, {"k": "D", "t": "连接活塞销"}], "a": "A", "e": "【考点】活塞头部作用。\n【解析】头部开环槽装活塞环,起密封和导热作用;导向、承侧压是裙部的活。故选A。\n【易错】“头部=装环密封导热”。B导向、C侧压、D连销都错配。三部分职责分清:顶-燃烧、头-环、裙-导向。"}, {"id": 787, "oid": "B4-066", "type": "single", "module": "汽车发动机维修", "q": "活塞第一道气环槽温度最高，为改善其工作条件，第一道环槽常采用（　）。", "opts": [{"k": "A", "t": "耐热铸铁镶圈"}, {"k": "B", "t": "镀铬处理"}, {"k": "C", "t": "镀铜处理"}, {"k": "D", "t": "喷钼处理"}], "a": "A", "e": "【考点】第一道环槽镶圈。\n【解析】第一道环槽温度最高,高强化柴油机嵌耐热铸铁(镍-石墨)镶圈,提高耐磨耐热。故选A。\n【易错】“镶圈=耐热耐磨”。B镀铬、C镀铜、D喷钼是对环表面处理,不是环槽。"}, {"id": 788, "oid": "B4-067", "type": "single", "module": "汽车发动机维修", "q": "活塞裙部的主要作用是（　）。", "opts": [{"k": "A", "t": "密封气缸"}, {"k": "B", "t": "导向并承受侧压力"}, {"k": "C", "t": "传导热量"}, {"k": "D", "t": "连接连杆"}], "a": "B", "e": "【考点】裙部作用。\n【解析】裙部与缸壁配合导向并承受侧压力;密封靠气环,导热靠头部。故选B。\n【易错】“裙部=导向承侧压”。与729、786题配套。A密封、C导热、D连连杆都是别部件职责。"}, {"id": 789, "oid": "B4-068", "type": "single", "module": "汽车发动机维修", "q": "活塞顶面上一般打有朝前记号，装配时该记号应朝向（　）。", "opts": [{"k": "A", "t": "发动机后端"}, {"k": "B", "t": "发动机前端"}, {"k": "C", "t": "左侧"}, {"k": "D", "t": "右侧"}], "a": "B", "e": "【考点】朝前记号。\n【解析】活塞顶朝前记号对准发动机前端,保证燃烧室形状、避阀坑与连杆方向正确。故选B。\n【易错】“记号朝前”。与749题配套。A后端、C左、D右都是干扰。装反顶气门。"}, {"id": 790, "oid": "B4-069", "type": "single", "module": "汽车发动机维修", "q": "活塞在气缸内往复运动时，承受的侧压力方向（　）。", "opts": [{"k": "A", "t": "始终不变"}, {"k": "B", "t": "在膨胀和压缩行程中交替变换"}, {"k": "C", "t": "只在做功行程存在"}, {"k": "D", "t": "与转向无关"}], "a": "B", "e": "【考点】侧压力方向。\n【解析】侧压力在做功和压缩行程作用于不同缸壁面,方向交替变换,故活塞两侧都受侧压。故选B。\n【易错】“侧压交替”。A始终不变、C只在做功行程都错。侧压力是裙部磨损原因。"}, {"id": 791, "oid": "B4-070", "type": "single", "module": "汽车发动机维修", "q": "采用喷油嘴向活塞内腔喷油冷却的主要目的是（　）。", "opts": [{"k": "A", "t": "润滑活塞销"}, {"k": "B", "t": "降低活塞顶温度、防止过热烧顶"}, {"k": "C", "t": "清洗活塞顶"}, {"k": "D", "t": "密封气环"}], "a": "B", "e": "【考点】油冷活塞目的。\n【解析】高强化柴油机用机油喷活塞顶内腔带走热量,降低热负荷防烧顶。故选B。\n【易错】“油冷=降温”。与774题配套。A润滑销座、C清洗、D密封都是干扰。"}, {"id": 792, "oid": "B4-071", "type": "single", "module": "汽车发动机维修", "q": "柴油机活塞顶部多制成凹顶（ω形），主要作用是（　）。", "opts": [{"k": "A", "t": "减轻质量"}, {"k": "B", "t": "形成燃烧室、促进混合气形成"}, {"k": "C", "t": "增大压缩比"}, {"k": "D", "t": "便于安装"}], "a": "B", "e": "【考点】凹顶活塞作用。\n【解析】柴油靠压缩着火,活塞顶凹坑与缸盖构成燃烧室,组织涡流促进混合气形成。故选B。\n【易错】“凹顶=燃烧室”。与760题配套。A减重、C增压缩比、D便于安装是干扰。"}, {"id": 793, "oid": "B4-072", "type": "single", "module": "汽车发动机维修", "q": "活塞销座处金属多、膨胀大，为防止销座处卡死，销座孔附近常制成（　）。", "opts": [{"k": "A", "t": "椭圆形"}, {"k": "B", "t": "凹陷让开槽"}, {"k": "C", "t": "圆柱形"}, {"k": "D", "t": "方形"}], "a": "B", "e": "【考点】销座防卡结构。\n【解析】销座外圆两侧切出凹陷让开槽,让开膨胀量,防止销座方向活塞卡死缸壁。故选B。\n【易错】“让开槽=让开膨胀”。与785(膨胀槽)、801(恒范钢片)配套,都是销座方向防卡手段。A椭圆是裙部断面,不是销座结构。"}, {"id": 794, "oid": "B4-073", "type": "single", "module": "汽车发动机维修", "q": "普通活塞的环槽数量一般为（　）。", "opts": [{"k": "A", "t": "1道"}, {"k": "B", "t": "2~3道气环加1道油环"}, {"k": "C", "t": "全部为油环"}, {"k": "D", "t": "4道油环"}], "a": "B", "e": "【考点】环槽数量。\n【解析】普通活塞一般装2~3道气环密封、1道油环刮油,是常规配置。故选B。\n【易错】“2~3气环+1油环”。A1道太少、C全油环、D4油环都错。环数:密封靠气环,刮油靠油环。"}, {"id": 795, "oid": "B4-074", "type": "single", "module": "汽车发动机维修", "q": "活塞第一道气环工作温度最高，为提高耐磨性，其表面通常（　）。", "opts": [{"k": "A", "t": "镀铬"}, {"k": "B", "t": "镀铜"}, {"k": "C", "t": "镀锌"}, {"k": "D", "t": "发蓝"}], "a": "A", "e": "【考点】第一道气环镀铬。\n【解析】第一道气环温度最高,镀铬层硬且耐磨、磨合好,普遍镀铬延长寿命。故选A。\n【易错】“第一道环镀铬”。与787(环槽镶圈)配套:B镀铜、C镀锌、D发蓝不是耐磨镀层。"}, {"id": 796, "oid": "B4-075", "type": "single", "module": "汽车发动机维修", "q": "活塞往复惯性力的大小与活塞质量的关系是（　）。", "opts": [{"k": "A", "t": "与质量成正比"}, {"k": "B", "t": "与质量成反比"}, {"k": "C", "t": "与质量无关"}, {"k": "D", "t": "与质量平方成正比"}], "a": "A", "e": "【考点】往复惯性力。\n【解析】往复惯性力F=ma,加速度a一定时与活塞质量成正比,减轻质量可减小惯性力。故选A。\n【易错】“惯性力∝质量”。B反比、C无关、D平方都错。减质量是高速发动机设计方向。"}, {"id": 797, "oid": "B4-076", "type": "single", "module": "汽车发动机维修", "q": "高速发动机为减小往复惯性力，在保证强度刚度前提下应（　）。", "opts": [{"k": "A", "t": "增大活塞质量"}, {"k": "B", "t": "尽量减轻活塞质量"}, {"k": "C", "t": "改用铸铁活塞"}, {"k": "D", "t": "增大活塞直径"}], "a": "B", "e": "【考点】高速发动机减重。\n【解析】惯性力与质量成正比,高速发动机在保证强度刚度前提下尽量减轻活塞质量,减小惯性力和振动。故选B。\n【易错】“减质量”。与796题配套。A增质量、C铸铁、D增直径都加重惯性力。"}, {"id": 798, "oid": "B4-077", "type": "single", "module": "汽车发动机维修", "q": "活塞顶面上的凹坑除形成燃烧室外，还可以（　）。", "opts": [{"k": "A", "t": "避免气门开启时与活塞相撞（避阀坑）"}, {"k": "B", "t": "增大压缩比"}, {"k": "C", "t": "减轻质量"}, {"k": "D", "t": "便于加工"}], "a": "A", "e": "【考点】避阀坑。\n【解析】活塞顶凹坑除形成燃烧室外,还起避阀坑作用:让开启的气门不与活塞顶相碰。故选A。\n【易错】“避阀坑=防顶气门”。B增压缩比、C减重、D便于加工是干扰。顶置气门机活塞顶常见。"}, {"id": 799, "oid": "B4-078", "type": "single", "module": "汽车发动机维修", "q": "测量活塞裙部与气缸壁配合间隙时，所用的量具是（　）。", "opts": [{"k": "A", "t": "游标卡尺"}, {"k": "B", "t": "外径千分尺和量缸表"}, {"k": "C", "t": "塞尺"}, {"k": "D", "t": "百分表"}], "a": "B", "e": "【考点】配合间隙量具。\n【解析】外径千分尺测活塞裙部外径,量缸表测气缸内径,两者之差即配合间隙。故选B。\n【易错】“千分尺+量缸表”。A游标卡尺精度不够、C塞尺测间隙不适用、D百分表单件。间隙=孔径-外径。"}, {"id": 800, "oid": "B4-079", "type": "single", "module": "汽车发动机维修", "q": "活塞工作时第一道环槽处温度可达（　）。", "opts": [{"k": "A", "t": "约100℃"}, {"k": "B", "t": "200~300℃"}, {"k": "C", "t": "500℃以上"}, {"k": "D", "t": "常温"}], "a": "B", "e": "【考点】第一道环槽温度。\n【解析】第一道环槽离燃烧室最近,温度可达200~300℃,故环槽易磨损。故选B。\n【易错】“200~300℃”。A100℃太低、C500℃以上过高(活塞顶才接近)、D常温错。"}, {"id": 801, "oid": "B4-080", "type": "single", "module": "汽车发动机维修", "q": "为减小活塞销座的膨胀变形，有些活塞在销座处镶有（　）。", "opts": [{"k": "A", "t": "热膨胀系数小的恒范钢片"}, {"k": "B", "t": "铜套"}, {"k": "C", "t": "铝套"}, {"k": "D", "t": "铸铁圈"}], "a": "A", "e": "【考点】恒范钢片。\n【解析】销座镶入热膨胀系数小的恒范钢片拉住销座,限制销座方向膨胀,减小活塞椭圆变形。故选A。\n【易错】“恒范钢片=限制膨胀”。与793(让开槽)、785(膨胀槽)配套。B铜套、C铝套、D铸铁圈膨胀大不符。"}, {"id": 802, "oid": "B4-081", "type": "single", "module": "汽车发动机维修", "q": "活塞与气缸壁之间间隙过小会导致（　）。", "opts": [{"k": "A", "t": "敲缸"}, {"k": "B", "t": "拉缸、卡死（抱缸）"}, {"k": "C", "t": "漏气"}, {"k": "D", "t": "窜机油"}], "a": "B", "e": "【考点】间隙过小后果。\n【解析】间隙过小热膨胀后活塞与缸壁咬死,拉伤表面甚至抱缸。故选B。\n【易错】“过小拉缸抱缸”。A敲缸是间隙过大、C漏气D窜油是环问题。与764题配套。"}, {"id": 803, "oid": "B4-082", "type": "single", "module": "汽车发动机维修", "q": "活塞裙部镀铬或镀锡的主要目的是（　）。", "opts": [{"k": "A", "t": "提高硬度"}, {"k": "B", "t": "改善磨合性、减少拉缸"}, {"k": "C", "t": "增大摩擦"}, {"k": "D", "t": "防锈美观"}], "a": "B", "e": "【考点】裙部镀层目的。\n【解析】裙部镀铬或镀锡改善初期磨合、防止拉缸,提高跑合性。故选B。\n【易错】“镀层=磨合防拉缸”。与776题配套。A提高硬度、C增大摩擦、D防锈美观都非主要目的。"}, {"id": 804, "oid": "B4-083", "type": "single", "module": "汽车发动机维修", "q": "气环实现密封主要依靠（　）。", "opts": [{"k": "A", "t": "环的弹力和燃气压力"}, {"k": "B", "t": "机油粘度"}, {"k": "C", "t": "活塞惯性"}, {"k": "D", "t": "离心力"}], "a": "A", "e": "【考点】气环密封原理。\n【解析】气环靠自身弹力贴缸壁,再靠燃气压力把环下压外推,双重作用密封。故选A。\n【易错】“弹力+燃气压力”。B机油粘度、C活塞惯性、D离心力都错。密封“一弹二压”。"}, {"id": 805, "oid": "B4-084", "type": "single", "module": "汽车发动机维修", "q": "刮油效果好、应用最广的油环结构是（　）。", "opts": [{"k": "A", "t": "整体式油环"}, {"k": "B", "t": "组合式油环（刮片加胀簧）"}, {"k": "C", "t": "矩形环"}, {"k": "D", "t": "锥面环"}], "a": "B", "e": "【考点】组合油环。\n【解析】组合油环由上下刮片和轴向胀簧组成,径向压力均匀、刮油好、寿命长,应用最广。故选B。\n【易错】“组合环=应用最广”。A整体式、C矩形环、D锥面环是气环。组合环件多但性能优。"}, {"id": 806, "oid": "B4-085", "type": "single", "module": "汽车发动机维修", "q": "安装扭曲环时，其内圆切口（倒角）应（　）。", "opts": [{"k": "A", "t": "向上"}, {"k": "B", "t": "向下"}, {"k": "C", "t": "任意"}, {"k": "D", "t": "朝左"}], "a": "A", "e": "【考点】扭曲环内切口方向。\n【解析】扭曲环内圆切口向上、外圆切口向下,装入后产生扭曲,外缘线接触密封刮油好。故选A。\n【易错】“内切口向上”。与734题配套。B向下装反泵油,C任意、D朝左都错。"}, {"id": 807, "oid": "B4-086", "type": "single", "module": "汽车发动机维修", "q": "扭曲环外圆下切口（倒角）应（　）。", "opts": [{"k": "A", "t": "向上"}, {"k": "B", "t": "向下"}, {"k": "C", "t": "任意"}, {"k": "D", "t": "朝上"}], "a": "B", "e": "【考点】扭曲环外切口方向。\n【解析】扭曲环外圆切口朝下,与内圆切口向上配合形成正确扭曲方向,装反会泵油窜机油。故选B。\n【易错】“外切口向下”。与806题配套对偶记忆:内上外下。装反=窜机油。"}, {"id": 808, "oid": "B4-087", "type": "single", "module": "汽车发动机维修", "q": "测量活塞环端隙时，应将活塞环平推到气缸的（　）测量。", "opts": [{"k": "A", "t": "最上端"}, {"k": "B", "t": "下部未磨损处"}, {"k": "C", "t": "中部任意位置"}, {"k": "D", "t": "最下端即可"}], "a": "B", "e": "【考点】端隙测量位置。\n【解析】在缸筒下部未磨损段测量端隙,才能反映环与缸壁真实开口间隙。故选B。\n【易错】“下部未磨损处”。与748题配套。A最上端磨损处失真、C中部、D最下端都非规范位置。"}, {"id": 809, "oid": "B4-088", "type": "single", "module": "汽车发动机维修", "q": "活塞环端隙过小，发动机工作时会导致（　）。", "opts": [{"k": "A", "t": "漏气"}, {"k": "B", "t": "环受热膨胀顶死、折断"}, {"k": "C", "t": "窜油"}, {"k": "D", "t": "磨损减小"}], "a": "B", "e": "【考点】端隙过小后果。\n【解析】端隙过小环受热膨胀无余地,开口处顶死产生内应力而折断。故选B。\n【易错】“过小顶死折断”。A漏气、C窜油是端隙过大,与770、778题配套。端隙=热膨胀余量。"}, {"id": 810, "oid": "B4-089", "type": "single", "module": "汽车发动机维修", "q": "活塞环侧隙是指（　）。", "opts": [{"k": "A", "t": "环开口处两端间隙"}, {"k": "B", "t": "环与环槽侧面之间的间隙"}, {"k": "C", "t": "环背面与环槽底间隙"}, {"k": "D", "t": "环与缸壁间隙"}], "a": "B", "e": "【考点】侧隙定义。\n【解析】侧隙=环与环槽侧面(上下方向)之间间隙;端隙=开口间隙;背隙=径向间隙。故选B。\n【易错】“三隙分辨”。A端隙、C背隙、D缸壁间隙都是干扰。定义题高频,一字之差。"}, {"id": 811, "oid": "B4-090", "type": "single", "module": "汽车发动机维修", "q": "活塞环侧隙过大会造成（　）。", "opts": [{"k": "A", "t": "环卡死"}, {"k": "B", "t": "泵油作用增强、机油消耗增大"}, {"k": "C", "t": "漏气减少"}, {"k": "D", "t": "密封增强"}], "a": "B", "e": "【考点】侧隙过大后果。\n【解析】侧隙过大环上下窜动,泵油作用加剧,机油上窜燃烧室消耗增大。故选B。\n【易错】“过大泵油”。A环卡死是侧隙过小,与736题配套。侧隙过大窜油、过小卡死。"}, {"id": 812, "oid": "B4-091", "type": "single", "module": "汽车发动机维修", "q": "活塞环背隙一般是指（　）。", "opts": [{"k": "A", "t": "环与环槽侧面间隙"}, {"k": "B", "t": "环沉入环槽后环背与环槽底的径向间隙"}, {"k": "C", "t": "开口间隙"}, {"k": "D", "t": "与缸壁间隙"}], "a": "B", "e": "【考点】背隙定义。\n【解析】背隙=环沉入环槽后环背与环槽底的径向间隙,使环能退让并容纳积炭。故选B。\n【易错】“背隙=径向”。A侧面间隙=侧隙、C开口=端隙、D缸壁间隙无关。三隙一起背。"}, {"id": 813, "oid": "B4-092", "type": "single", "module": "汽车发动机维修", "q": "桶面环特别适合高速发动机，其主要优点是（　）。", "opts": [{"k": "A", "t": "成本低"}, {"k": "B", "t": "与缸壁圆弧接触、磨合好、密封性好"}, {"k": "C", "t": "弹力大"}, {"k": "D", "t": "易加工"}], "a": "B", "e": "【考点】桶面环优点。\n【解析】桶面环与缸壁圆弧接触,上下行都形成楔形油膜,润滑磨合好、密封好,适合高速机。故选B。\n【易错】“圆弧接触=楔形油膜”。与758题配套。A成本低、C弹力大、D易加工不是特点。"}, {"id": 814, "oid": "B4-093", "type": "single", "module": "汽车发动机维修", "q": "矩形环是最基本的气环断面形式，其主要缺点是（　）。", "opts": [{"k": "A", "t": "密封性差"}, {"k": "B", "t": "泵油作用严重"}, {"k": "C", "t": "弹力小"}, {"k": "D", "t": "不耐磨"}], "a": "B", "e": "【考点】矩形环缺点。\n【解析】矩形环与缸壁面接触,泵油作用严重易窜机油,故发展出扭曲环等改进断面。故选B。\n【易错】“矩形环泵油严重”。A密封差(密封可以)、C弹力小、D不耐磨都不准确。改进方向:扭曲环。"}, {"id": 815, "oid": "B4-094", "type": "single", "module": "汽车发动机维修", "q": "锥面环安装时，外圆斜面的小口（上边缘）应（　）。", "opts": [{"k": "A", "t": "朝上"}, {"k": "B", "t": "朝下"}, {"k": "C", "t": "任意"}, {"k": "D", "t": "朝外"}], "a": "A", "e": "【考点】锥面环安装方向。\n【解析】锥面环外圆上小下大,带标记一面朝上,下行刮油上行布油,装反会窜油。故选A。\n【易错】“小口朝上”。与734、806、807题(扭曲环)同类:断面环都有安装方向,装反窜油。"}, {"id": 816, "oid": "B4-095", "type": "single", "module": "汽车发动机维修", "q": "组合式油环的组成是（　）。", "opts": [{"k": "A", "t": "一个刮片和一个胀簧"}, {"k": "B", "t": "上下两个刮片和一个轴向胀簧"}, {"k": "C", "t": "三个刮片"}, {"k": "D", "t": "一个矩形环"}], "a": "B", "e": "【考点】组合油环组成。\n【解析】组合油环由上下两片刮钢片和一个轴向胀簧组成,径向压力均匀、刮油好。故选B。\n【易错】“两刮片+一胀簧”。A一片一簧、C三刮片、D矩形环都错。与805题配套。"}, {"id": 817, "oid": "B4-096", "type": "single", "module": "汽车发动机维修", "q": "活塞环在气缸内的开口位置应避开（　）。", "opts": [{"k": "A", "t": "活塞销方向"}, {"k": "B", "t": "气缸正上方"}, {"k": "C", "t": "任意位置"}, {"k": "D", "t": "连杆方向"}], "a": "A", "e": "【考点】环口位置。\n【解析】环口避开销孔方向:销座处缸壁间隙大,环口正对易漏气窜油。故选A。\n【易错】“避开销孔”。B正上方、C任意、D连杆方向都不对。环口布置三原则:错开、避销、均布。"}, {"id": 818, "oid": "B4-097", "type": "single", "module": "汽车发动机维修", "q": "各道活塞环开口在圆周上应相互错开，一般错开角度为（　）。", "opts": [{"k": "A", "t": "30°"}, {"k": "B", "t": "120°~180°"}, {"k": "C", "t": "90°"}, {"k": "D", "t": "0°"}], "a": "B", "e": "【考点】环口错开角度。\n【解析】相邻环口错开120°~180°并避开销孔,防止形成直通漏气通道。故选B。\n【易错】“120°~180°”。A30°太近、C90°、D0°同向都易直通漏气。与777题(环口未错开)配套。"}, {"id": 819, "oid": "B4-098", "type": "single", "module": "汽车发动机维修", "q": "梯形环（歪梯形环）主要用于（　）。", "opts": [{"k": "A", "t": "汽油机"}, {"k": "B", "t": "热负荷较高的柴油机，防止环在环槽中咬死"}, {"k": "C", "t": "摩托车"}, {"k": "D", "t": "二冲程机"}], "a": "B", "e": "【考点】梯形环用途。\n【解析】梯形环侧隙随活塞摆动变化,挤出槽内积炭防环咬死,用于热负荷较高柴油机。故选B。\n【易错】“梯形环=柴油机防咬死”。A汽油机、C摩托车、D二冲程不是主要用途。梯形环是防积炭咬环的“活环”。"}, {"id": 820, "oid": "B4-099", "type": "single", "module": "汽车发动机维修", "q": "活塞环的泵油作用会导致（　）。", "opts": [{"k": "A", "t": "机油消耗增大、燃烧室积炭"}, {"k": "B", "t": "机油压力升高"}, {"k": "C", "t": "气缸冷却改善"}, {"k": "D", "t": "密封增强"}], "a": "A", "e": "【考点】泵油作用后果。\n【解析】泵油作用把机油压入燃烧室,消耗机油并形成积炭。故选A。\n【易错】“泵油=耗油+积炭”。与750题配套。B油压升高、C冷却改善、D密封增强都错。"}, {"id": 821, "oid": "B4-100", "type": "single", "module": "汽车发动机维修", "q": "为减轻活塞环的泵油作用，应（　）。", "opts": [{"k": "A", "t": "增大端隙"}, {"k": "B", "t": "合理选用气环断面（如扭曲环）并保证侧隙正常"}, {"k": "C", "t": "减小油环弹力"}, {"k": "D", "t": "增大侧隙"}], "a": "B", "e": "【考点】减轻泵油。\n【解析】合理选用气环断面(扭曲环)并保证侧隙正常可减小泵油;增大端隙侧隙反而加重。故选B。\n【易错】“扭曲环+正常侧隙”。A增端隙、D增侧隙加重泵油,C减油环弹力刮油差。与811、814题配套。"}, {"id": 822, "oid": "B4-101", "type": "single", "module": "汽车发动机维修", "q": "第一道气环表面镀铬的主要目的是（　）。", "opts": [{"k": "A", "t": "美观"}, {"k": "B", "t": "提高耐磨性和磨合性"}, {"k": "C", "t": "降低摩擦"}, {"k": "D", "t": "防锈"}], "a": "B", "e": "【考点】第一道环镀铬目的。\n【解析】第一道环温度高磨损大,镀铬层硬而耐磨、磨合好,延长寿命。故选B。\n【易错】“镀铬=耐磨”。与795题配套。A美观、C降摩擦、D防锈不是主要目的。"}, {"id": 823, "oid": "B4-102", "type": "single", "module": "汽车发动机维修", "q": "检查活塞环弹性时，应使用（　）。", "opts": [{"k": "A", "t": "塞尺"}, {"k": "B", "t": "活塞环弹力检验仪"}, {"k": "C", "t": "千分尺"}, {"k": "D", "t": "百分表"}], "a": "B", "e": "【考点】环弹力检查。\n【解析】用活塞环弹力检验仪测环径向弹力,弹力不足的环密封差应更换。故选B。\n【易错】“弹力检验仪”。A塞尺测间隙、C千分尺测外径、D百分表测跳动。量具与用途配对。"}, {"id": 824, "oid": "B4-103", "type": "single", "module": "汽车发动机维修", "q": "活塞环开口间隙（端隙）的检查应在（　）进行。", "opts": [{"k": "A", "t": "环装入环槽后"}, {"k": "B", "t": "环平推入气缸后"}, {"k": "C", "t": "环自由状态"}, {"k": "D", "t": "环加热后"}], "a": "B", "e": "【考点】端隙检查位置。\n【解析】端隙是环装入气缸后的开口间隙,须将环平推入缸内用塞尺测量。故选B。\n【易错】“推入缸内测”。与748、808题配套。A环槽内是侧隙、C自由状态无意义、D加热后错。"}, {"id": 825, "oid": "B4-104", "type": "single", "module": "汽车发动机维修", "q": "曲轴箱通风（PCV）不良会使窜气增多，加剧（　）。", "opts": [{"k": "A", "t": "活塞环密封"}, {"k": "B", "t": "机油变质和窜油"}, {"k": "C", "t": "气缸磨损减小"}, {"k": "D", "t": "活塞冷却"}], "a": "B", "e": "【考点】PCV与窜气。\n【解析】窜气含酸性物质和热量,PCV通风不良会污染机油,加剧机油变质和窜油。故选B。\n【易错】“通风不良→油变质”。A活塞环密封、C磨损减小、D活塞冷却都是干扰。PCV阀堵是常见故障源。"}, {"id": 826, "oid": "B4-105", "type": "single", "module": "汽车发动机维修", "q": "油环的作用除刮油外，还能（　）。", "opts": [{"k": "A", "t": "在缸壁上均匀布油、改善润滑"}, {"k": "B", "t": "密封燃气"}, {"k": "C", "t": "传导热量"}, {"k": "D", "t": "导向"}], "a": "A", "e": "【考点】油环布油。\n【解析】油环上行在缸壁均匀布油改善润滑,下行刮油,控制油膜厚度。故选A。\n【易错】“布油+刮油”。与733题配套。B密封燃气是气环、C导热头部、D导向裙部。"}, {"id": 827, "oid": "B4-106", "type": "single", "module": "汽车发动机维修", "q": "下列不属于活塞环折断常见原因的是（　）。", "opts": [{"k": "A", "t": "端隙过小"}, {"k": "B", "t": "气缸壁积炭过多"}, {"k": "C", "t": "环槽磨损松旷"}, {"k": "D", "t": "端隙过大"}], "a": "D", "e": "【考点】断环原因(反向)。\n【解析】端隙过小顶死、积炭卡环、环槽松旷都易断环;端隙过大主要漏气窜油,不是断环原因。故选D(题干问“不属于的”)。\n【易错】“端隙过大≠断环”。A过小、B积炭、C槽松旷是断环三因。找“不是”选项。"}, {"id": 828, "oid": "B4-107", "type": "single", "module": "汽车发动机维修", "q": "拆装活塞环应使用的专用工具是（　）。", "opts": [{"k": "A", "t": "鲤鱼钳"}, {"k": "B", "t": "活塞环卡钳（扩张钳）"}, {"k": "C", "t": "钢丝钳"}, {"k": "D", "t": "螺丝刀"}], "a": "B", "e": "【考点】环安装工具。\n【解析】拆装活塞环用活塞环卡钳(扩张钳)均匀扩张,防止手掰变形折断。故选B。\n【易错】“活塞环卡钳”。与767题配套。A鲤鱼钳、C钢丝钳、D螺丝刀都非专用工具。"}, {"id": 829, "oid": "B4-108", "type": "single", "module": "汽车发动机维修", "q": "活塞销的作用是（　）。", "opts": [{"k": "A", "t": "密封气缸"}, {"k": "B", "t": "连接活塞和连杆小头、传力"}, {"k": "C", "t": "导向"}, {"k": "D", "t": "刮油"}], "a": "B", "e": "【考点】活塞销作用。\n【解析】活塞销铰接活塞与连杆小头,传递燃气力和惯性力,是传力铰接件。故选B。\n【易错】“销=传力”。与737题配套。A密封、C导向、D刮油都是别件职责。"}, {"id": 830, "oid": "B4-109", "type": "single", "module": "汽车发动机维修", "q": "活塞销的结构形状是（　）。", "opts": [{"k": "A", "t": "实心圆柱"}, {"k": "B", "t": "空心圆柱体"}, {"k": "C", "t": "空心圆锥"}, {"k": "D", "t": "方形"}], "a": "B", "e": "【考点】活塞销形状。\n【解析】活塞销做成空心圆柱,在保证刚度强度下减轻质量、减小惯性力。故选B。\n【易错】“空心圆柱”。空心减重不减强度。A实心重、C圆锥、D方形都错。与796题(惯性力∝质量)呼应。"}, {"id": 831, "oid": "B4-110", "type": "single", "module": "汽车发动机维修", "q": "全浮式活塞销在正常工作温度时，与（　）之间可相对转动。", "opts": [{"k": "A", "t": "只在连杆小头衬套"}, {"k": "B", "t": "连杆小头衬套和活塞销座孔"}, {"k": "C", "t": "只在活塞销座"}, {"k": "D", "t": "完全固定"}], "a": "B", "e": "【考点】全浮销转动。\n【解析】全浮销在连杆小头衬套和活塞销座孔中都缓慢转动,磨损均匀寿命长。故选B。\n【易错】“两处都转”。与738题配套。A只衬套、C只销座、D完全固定都是半浮/固定式特征。"}, {"id": 832, "oid": "B4-111", "type": "single", "module": "汽车发动机维修", "q": "全浮式活塞销销座两端安装卡环（挡圈）的目的是（　）。", "opts": [{"k": "A", "t": "防止活塞销轴向窜动刮伤气缸壁"}, {"k": "B", "t": "增大弹力"}, {"k": "C", "t": "润滑"}, {"k": "D", "t": "定位活塞环"}], "a": "A", "e": "【考点】卡环作用。\n【解析】全浮销轴向游动,两端卡环(挡圈)限位,防止销端刮伤缸壁。故选A。\n【易错】“卡环防窜动”。与762题配套。B增弹力、C润滑、D定位环都错。"}, {"id": 833, "oid": "B4-112", "type": "single", "module": "汽车发动机维修", "q": "活塞销表面要耐磨、内部要有韧性，常采用（　）。", "opts": [{"k": "A", "t": "低碳钢渗碳淬火"}, {"k": "B", "t": "铸铁"}, {"k": "C", "t": "铝合金"}, {"k": "D", "t": "黄铜"}], "a": "A", "e": "【考点】活塞销材料工艺。\n【解析】低碳钢渗碳淬火实现外硬内韧:表面硬耐磨、内部韧抗冲击。故选A。\n【易错】“渗碳=外硬内韧”。与761题配套。B铸铁脆、C铝合金软、D黄铜不耐磨。"}, {"id": 834, "oid": "B4-113", "type": "single", "module": "汽车发动机维修", "q": "半浮式活塞销的特点是（　）。", "opts": [{"k": "A", "t": "销在连杆小头和销座内都转动"}, {"k": "B", "t": "销固定在连杆小头孔中、只在销座孔内转动"}, {"k": "C", "t": "销完全不转动"}, {"k": "D", "t": "销用螺栓固定在活塞上"}], "a": "B", "e": "【考点】半浮式销特点。\n【解析】半浮式销与连杆小头孔紧配固定,只在活塞销座孔内转动。故选B。\n【易错】“小头固定、销座转”。与739题配套。A两处都转是全浮式。"}, {"id": 835, "oid": "B4-114", "type": "single", "module": "汽车发动机维修", "q": "连杆小头孔内压装的衬套材料一般是（　）。", "opts": [{"k": "A", "t": "钢套"}, {"k": "B", "t": "青铜（铜铅合金）衬套"}, {"k": "C", "t": "铸铁套"}, {"k": "D", "t": "铝套"}], "a": "B", "e": "【考点】连杆小头衬套材料。\n【解析】连杆小头衬套用青铜(铜铅合金)减磨材料,与活塞销形成滑动轴承。故选B。\n【易错】“青铜衬套”。A钢套硬、C铸铁、D铝套不耐磨。衬套=减磨材料。"}, {"id": 836, "oid": "B4-115", "type": "single", "module": "汽车发动机维修", "q": "连杆小头衬套与活塞销配合间隙过小，会导致（　）。", "opts": [{"k": "A", "t": "敲击异响"}, {"k": "B", "t": "润滑不良、烧衬套"}, {"k": "C", "t": "间隙过大"}, {"k": "D", "t": "磨损减小"}], "a": "B", "e": "【考点】衬套间隙过小。\n【解析】间隙过小油膜难形成,衬套与销干摩擦发热烧损。故选B。\n【易错】“过小烧衬套”。A敲击异响是间隙过大、D磨损减小错。间隙“过小烧、过大响”。"}, {"id": 837, "oid": "B4-116", "type": "single", "module": "汽车发动机维修", "q": "测量活塞销与连杆衬套配合间隙时，常用（　）。", "opts": [{"k": "A", "t": "塞尺"}, {"k": "B", "t": "外径千分尺和内径百分表"}, {"k": "C", "t": "游标卡尺"}, {"k": "D", "t": "直尺"}], "a": "B", "e": "【考点】销与衬套间隙测量。\n【解析】千分尺测活塞销外径,内径百分表测衬套内径,差值即配合间隙。故选B。\n【易错】“千分尺+内径表”。与772题配套。A塞尺、C游标卡尺、D直尺精度不够。"}, {"id": 838, "oid": "B4-117", "type": "single", "module": "汽车发动机维修", "q": "全浮式活塞销在冷态时与销座孔的配合一般为（　）。", "opts": [{"k": "A", "t": "间隙配合"}, {"k": "B", "t": "过渡配合（稍紧，需热装）"}, {"k": "C", "t": "大间隙"}, {"k": "D", "t": "无要求"}], "a": "B", "e": "【考点】全浮销冷态配合。\n【解析】冷态销与销座稍紧(过渡配合),靠加热活塞热装,热态后形成间隙可转动。故选B。\n【易错】“冷紧热松”。全浮销“冷态过渡、热态浮动”。A冷态间隙会响、C大间隙错。热装是实操要点。"}, {"id": 839, "oid": "B4-118", "type": "single", "module": "汽车发动机维修", "q": "连杆由小头、杆身和（　）三部分组成。", "opts": [{"k": "A", "t": "大头"}, {"k": "B", "t": "螺栓"}, {"k": "C", "t": "轴瓦"}, {"k": "D", "t": "衬套"}], "a": "A", "e": "【考点】连杆三部分。\n【解析】连杆分小头(连活塞销)、杆身、大头(连曲轴轴颈)三部分。故选A。\n【易错】“小头-杆身-大头”。B螺栓、C轴瓦、D衬套是零件不是组成部分。结构组成题。"}, {"id": 840, "oid": "B4-119", "type": "single", "module": "汽车发动机维修", "q": "连杆杆身断面通常制成（　）。", "opts": [{"k": "A", "t": "工字形"}, {"k": "B", "t": "圆形"}, {"k": "C", "t": "矩形"}, {"k": "D", "t": "方形"}], "a": "A", "e": "【考点】连杆杆身断面。\n【解析】工字形断面抗弯抗扭强、质量轻,是连杆杆身标准断面。故选A。\n【易错】“工字形”。与753题配套。B圆形、C矩形、D方形抗弯效率低。"}, {"id": 841, "oid": "B4-120", "type": "single", "module": "汽车发动机维修", "q": "连杆大头分开的部分称为（　）。", "opts": [{"k": "A", "t": "连杆瓦盖"}, {"k": "B", "t": "连杆盖"}, {"k": "C", "t": "连杆衬套"}, {"k": "D", "t": "连杆螺栓"}], "a": "B", "e": "【考点】连杆盖。\n【解析】连杆大头剖开的部分叫连杆盖,与连杆配对用螺栓紧固。故选B。\n【易错】“大头分开=连杆盖”。与740题配套。A瓦盖、C衬套、D螺栓都非标准叫法。"}, {"id": 842, "oid": "B4-121", "type": "single", "module": "汽车发动机维修", "q": "连杆大头的剖分形式有（　）。", "opts": [{"k": "A", "t": "平切口和斜切口"}, {"k": "B", "t": "整体式"}, {"k": "C", "t": "对半式"}, {"k": "D", "t": "焊接式"}], "a": "A", "e": "【考点】大头剖分形式。\n【解析】连杆大头结合面有垂直的平切口和倾斜的斜切口两种。故选A。\n【易错】“平切口+斜切口”。与765题配套。B整体式(大头不可剖分无法装轴颈)、C对半、D焊接都错。"}, {"id": 843, "oid": "B4-122", "type": "single", "module": "汽车发动机维修", "q": "斜切口连杆大头主要用于（　）。", "opts": [{"k": "A", "t": "汽油机"}, {"k": "B", "t": "强化柴油机，以减小大头尺寸、便于从气缸取出"}, {"k": "C", "t": "摩托车"}, {"k": "D", "t": "单缸机"}], "a": "B", "e": "【考点】斜切口用途。\n【解析】斜切口使大头径向尺寸减小,便于从缸筒上端抽出连杆,多用于强化柴油机。故选B。\n【易错】“斜切口=柴油机”。与765题配套。A汽油机多用平切口、C摩托车、D单缸机非主要。"}, {"id": 844, "oid": "B4-123", "type": "single", "module": "汽车发动机维修", "q": "斜切口连杆大头结合面承受较大横向力，靠（　）定位。", "opts": [{"k": "A", "t": "螺栓光杆"}, {"k": "B", "t": "锯齿形结合面（或定位套筒）"}, {"k": "C", "t": "销钉"}, {"k": "D", "t": "止口"}], "a": "B", "e": "【考点】斜切口定位。\n【解析】斜切口结合面靠锯齿或定位套筒承受侧向剪切力,防止连杆盖横向滑移。故选B。\n【易错】“锯齿/套筒定位”。与766题配套。A螺栓光杆不抗剪、C销钉、D止口非标准。"}, {"id": 845, "oid": "B4-124", "type": "single", "module": "汽车发动机维修", "q": "连杆螺栓拆装时应（　）。", "opts": [{"k": "A", "t": "一次拧紧到位"}, {"k": "B", "t": "按规定力矩分次均匀拧紧"}, {"k": "C", "t": "越紧越好"}, {"k": "D", "t": "用风炮快速拧紧"}], "a": "B", "e": "【考点】连杆螺栓拧紧。\n【解析】连杆螺栓按规定力矩分次均匀拧紧,保证大头压紧均匀,防松动或拉伸断裂。故选B。\n【易错】“分次均匀”。与741题配套。A一次拧紧不均、C越紧越好断裂、D风炮失控。"}, {"id": 846, "oid": "B4-125", "type": "single", "module": "汽车发动机维修", "q": "连杆盖与连杆大头的装配位置必须靠（　）保证。", "opts": [{"k": "A", "t": "随意装配"}, {"k": "B", "t": "配对记号和定位结构（套筒或锯齿）"}, {"k": "C", "t": "螺栓长度"}, {"k": "D", "t": "垫片"}], "a": "B", "e": "【考点】连杆盖装配位置。\n【解析】连杆盖与大头配对加工,靠配对记号和定位结构(套筒/锯齿)保证原位装复,不得互换。故选B。\n【易错】“记号+定位”。与743题配套。A随意装配、C螺栓长度、D垫片都错。"}, {"id": 847, "oid": "B4-126", "type": "single", "module": "汽车发动机维修", "q": "连杆轴瓦（大头轴瓦）的材料一般是（　）。", "opts": [{"k": "A", "t": "铝基或铜铅合金薄壁轴瓦"}, {"k": "B", "t": "铸铁"}, {"k": "C", "t": "铜"}, {"k": "D", "t": "钢片"}], "a": "A", "e": "【考点】轴瓦材料。\n【解析】连杆轴瓦为钢背减磨合金(铝基、铜铅或巴氏合金)薄壁瓦,减磨耐用。故选A。\n【易错】“钢背+合金层”。B铸铁、C铜、D钢片都非轴瓦结构。轴瓦“软合金耐磨、钢背承力”。"}, {"id": 848, "oid": "B4-127", "type": "single", "module": "汽车发动机维修", "q": "连杆轴瓦上定位凸键（定位唇）的作用是（　）。", "opts": [{"k": "A", "t": "防止轴瓦在大头孔中转动和轴向移动"}, {"k": "B", "t": "增强润滑"}, {"k": "C", "t": "提高刚度"}, {"k": "D", "t": "便于拆卸"}], "a": "A", "e": "【考点】定位凸键。\n【解析】轴瓦定位凸键(定位唇)嵌入大头孔槽中,防止轴瓦转动和轴向窜动。故选A。\n【易错】“凸键防转动”。B增强润滑、C提高刚度、D便于拆卸都错。轴瓦错位会堵油孔。"}, {"id": 849, "oid": "B4-128", "type": "single", "module": "汽车发动机维修", "q": "检查连杆是否弯曲，常用的方法是（　）。", "opts": [{"k": "A", "t": "目测"}, {"k": "B", "t": "连杆校正器（检验台）上用塞尺检查"}, {"k": "C", "t": "千分尺"}, {"k": "D", "t": "天平"}], "a": "B", "e": "【考点】连杆弯扭检测。\n【解析】在连杆校正器(检验台)上V形座架住大头,塞尺测小头孔与平板间隙判断弯扭。故选B。\n【易错】“校正器+塞尺”。A目测不可靠、C千分尺测外径、D天平称重。检测工具与用途配对。"}, {"id": 850, "oid": "B4-129", "type": "single", "module": "汽车发动机维修", "q": "连杆在工作中承受的载荷是（　）。", "opts": [{"k": "A", "t": "恒定拉力"}, {"k": "B", "t": "交变的拉、压和弯曲载荷"}, {"k": "C", "t": "只受压力"}, {"k": "D", "t": "只受弯曲"}], "a": "B", "e": "【考点】连杆载荷。\n【解析】连杆受交变的拉压载荷,且受压时杆身弯曲,属复杂交变载荷。故选B。\n【易错】“拉压交变+弯曲”。与744题配套。A恒定拉力、C只受压、D只受弯都不完整。"}, {"id": 851, "oid": "B4-130", "type": "single", "module": "汽车发动机维修", "q": "同一台发动机各连杆的质量应（　）。", "opts": [{"k": "A", "t": "差别越大越好"}, {"k": "B", "t": "尽量一致，按大小头分别分组称重"}, {"k": "C", "t": "完全不管"}, {"k": "D", "t": "随便选配"}], "a": "B", "e": "【考点】连杆质量一致。\n【解析】各连杆质量差过大会引起运转不平衡,按大小头分别分组称重选配。故选B。\n【易错】“分组称重”。与754题配套。A差别大、C不管、D随便选配都破坏平衡。"}, {"id": 852, "oid": "B4-131", "type": "single", "module": "汽车发动机维修", "q": "连杆弯曲过大将导致（　）。", "opts": [{"k": "A", "t": "活塞偏缸、气缸和活塞环偏磨损"}, {"k": "B", "t": "机油压力升高"}, {"k": "C", "t": "敲击声减小"}, {"k": "D", "t": "密封增强"}], "a": "A", "e": "【考点】连杆弯曲危害。\n【解析】连杆弯曲使活塞在缸内偏斜,造成气缸和活塞环单边偏磨、敲缸。故选A。\n【易错】“弯曲=偏磨”。B油压升高、C响声减小、D密封增强都错。连杆弯扭是发动机异响源。"}, {"id": 853, "oid": "B4-132", "type": "single", "module": "汽车发动机维修", "q": "连杆小头衬套磨损后，会出现（　）。", "opts": [{"k": "A", "t": "连杆小点头部异响（敲击声）"}, {"k": "B", "t": "机油压力升高"}, {"k": "C", "t": "活塞冷却"}, {"k": "D", "t": "密封好"}], "a": "A", "e": "【考点】衬套磨损异响。\n【解析】衬套磨损间隙增大,活塞销在衬套内敲击,发出清脆的小点头部异响。故选A。\n【易错】“小头异响”。与836题配套(过小烧、过大响)。B油压升高、C冷却、D密封都错。"}, {"id": 854, "oid": "B4-133", "type": "single", "module": "汽车发动机维修", "q": "校正连杆弯扭曲后，通常要进行（　）。", "opts": [{"k": "A", "t": "表面淬火"}, {"k": "B", "t": "时效处理消除内应力"}, {"k": "C", "t": "喷丸"}, {"k": "D", "t": "镀铬"}], "a": "B", "e": "【考点】校正后时效。\n【解析】冷压校正产生内应力,时效处理消除应力,防止连杆再次变形。故选B。\n【易错】“时效除应力”。与756题配套。A淬火、C喷丸、D镀铬都非除应力手段。"}, {"id": 855, "oid": "B4-134", "type": "single", "module": "汽车发动机维修", "q": "拆装活塞连杆组时，为保护气缸壁和轴瓦，连杆螺栓螺纹处应（　）。", "opts": [{"k": "A", "t": "涂润滑脂"}, {"k": "B", "t": "套上橡胶管或塑料管（螺纹防护）"}, {"k": "C", "t": "不处理"}, {"k": "D", "t": "涂密封胶"}], "a": "B", "e": "【考点】连杆螺纹防护。\n【解析】抽出连杆时螺纹易刮伤缸壁和轴瓦,套橡胶管或塑料管防护。故选B。\n【易错】“套防护管”。A涂润滑脂不防刮、C不处理伤缸、D密封胶无用。抽装连杆的细节保护。"}, {"id": 856, "oid": "B4-135", "type": "single", "module": "汽车发动机维修", "q": "连杆螺栓松动或断裂会导致（　）。", "opts": [{"k": "A", "t": "发动机怠速平稳"}, {"k": "B", "t": "连杆脱出打碎气缸的严重机械事故"}, {"k": "C", "t": "机油压力升高"}, {"k": "D", "t": "无影响"}], "a": "B", "e": "【考点】连杆螺栓失效后果。\n【解析】连杆螺栓松动或断裂会使连杆大头脱出,打碎缸体,是重大机械事故。故选B。\n【易错】“断裂=捣缸”。与741、845题配套。A怠速平稳、C油压升高、D无影响都错。连杆螺栓是“保命件”。"}, {"id": 857, "oid": "B4-136", "type": "single", "module": "汽车发动机维修", "q": "装配活塞连杆组时，连杆大头上的缸序记号应（　）。", "opts": [{"k": "A", "t": "朝向发动机前端"}, {"k": "B", "t": "与缸号对应、朝同一侧"}, {"k": "C", "t": "朝后"}, {"k": "D", "t": "任意"}], "a": "B", "e": "【考点】缸序记号方向。\n【解析】连杆盖和大头打有缸号和配对记号,装时朝同一侧并对应原缸位,不得混装。故选B。\n【易错】“记号对应+同侧”。与743、846题配套。A朝前(那是活塞记号)、C朝后、D任意都错。"}, {"id": 858, "oid": "B4-137", "type": "single", "module": "汽车发动机维修", "q": "拆卸活塞连杆组前，应在连杆盖上打记缸号，目的是（　）。", "opts": [{"k": "A", "t": "美观"}, {"k": "B", "t": "保证按原缸位配对装复、不混装"}, {"k": "C", "t": "称重"}, {"k": "D", "t": "记录重量"}], "a": "B", "e": "【考点】打缸号目的。\n【解析】连杆盖与大头配对加工,打缸号保证原位装复,混装破坏配合。故选B。\n【易错】“打号=防混装”。与769题配套。A美观、C称重、D记录重量都错。"}, {"id": 859, "oid": "B4-138", "type": "single", "module": "汽车发动机维修", "q": "安装活塞时，各道活塞环开口位置应（　）。", "opts": [{"k": "A", "t": "全部朝向活塞销"}, {"k": "B", "t": "相互错开并避开活塞销方向"}, {"k": "C", "t": "全部重合"}, {"k": "D", "t": "都朝下"}], "a": "B", "e": "【考点】环口布置。\n【解析】环口相互错开120°~180°并避开活塞销方向,防直通漏气通道。故选B。\n【易错】“错开+避销”。与818题配套。A全朝销、C重合、D都朝下都错。装配口诀:环口错开、避开销孔。"}, {"id": 860, "oid": "B4-139", "type": "single", "module": "汽车发动机维修", "q": "用活塞环压缩器将活塞连杆组装入气缸时，应（　）。", "opts": [{"k": "A", "t": "用锤子直接敲入"}, {"k": "B", "t": "压缩环后用木锤柄轻轻推入，同时转动曲轴使轴颈就位"}, {"k": "C", "t": "用力压入"}, {"k": "D", "t": "从缸体下方装入"}], "a": "B", "e": "【考点】活塞连杆组装入。\n【解析】用活塞环压缩器收紧环,木锤柄轻敲活塞顶引入缸筒,转动曲轴让连杆轴颈就位。故选B。\n【易错】“压缩器+木锤柄”。A铁锤直接敲伤活塞、C用力压伤环、D从下方装入错。装活塞连杆是精细活。"}, {"id": 861, "oid": "B4-140", "type": "single", "module": "汽车发动机维修", "q": "检查活塞与气缸配合间隙的方法是（　）。", "opts": [{"k": "A", "t": "目测"}, {"k": "B", "t": "量缸表测气缸径、千分尺测活塞径，计算差值"}, {"k": "C", "t": "塞尺直接测"}, {"k": "D", "t": "直尺测"}], "a": "B", "e": "【考点】活塞缸配合间隙测量。\n【解析】量缸表测气缸内径、千分尺测活塞裙部外径,差值即配合间隙,对照标准判断。故选B。\n【易错】“量缸表+千分尺”。与799题配套。A目测、C塞尺直测(不适用)、D直尺都错。"}, {"id": 862, "oid": "B4-141", "type": "single", "module": "汽车发动机维修", "q": "活塞裙部测量位置应在（　）。", "opts": [{"k": "A", "t": "活塞顶部"}, {"k": "B", "t": "垂直于活塞销轴线的裙部规定位置"}, {"k": "C", "t": "环槽处"}, {"k": "D", "t": "任意位置"}], "a": "B", "e": "【考点】裙部测量位置。\n【解析】裙部椭圆长轴垂直销孔,在该方向规定位置测量才是裙部真实直径。故选B。\n【易错】“垂直销孔位置”。与763题配套。A顶部、C环槽、D任意都错。"}, {"id": 863, "oid": "B4-142", "type": "single", "module": "汽车发动机维修", "q": "活塞环端隙测量时，将活塞环推入气缸后，应用（　）测量。", "opts": [{"k": "A", "t": "千分尺"}, {"k": "B", "t": "塞尺"}, {"k": "C", "t": "游标卡尺"}, {"k": "D", "t": "百分表"}], "a": "B", "e": "【考点】端隙测量量具。\n【解析】端隙用塞尺测量环开口处间隙,是标准量具。故选B。\n【易错】“塞尺测端隙”。A千分尺测外径、C卡尺、D百分表。间隙小到零点几毫米,只有塞尺合适。"}, {"id": 864, "oid": "B4-143", "type": "single", "module": "汽车发动机维修", "q": "发动机大修时气缸磨损超限需镗缸，活塞应选用（　）。", "opts": [{"k": "A", "t": "标准尺寸活塞"}, {"k": "B", "t": "加大尺寸（修理尺寸）活塞"}, {"k": "C", "t": "任意活塞"}, {"k": "D", "t": "旧活塞"}], "a": "B", "e": "【考点】镗缸配活塞。\n【解析】镗缸后缸径加大,须选配加大尺寸(修理尺寸)活塞,保持正确配合间隙。故选B。\n【易错】“加大活塞”。A标准活塞间隙过大、C任意、D旧活塞都错。修理尺寸活塞分档(如+0.25/+0.50)。"}, {"id": 865, "oid": "B4-144", "type": "single", "module": "汽车发动机维修", "q": "测量气缸圆度和圆柱度所用的量具是（　）。", "opts": [{"k": "A", "t": "外径千分尺"}, {"k": "B", "t": "量缸表（内径百分表）"}, {"k": "C", "t": "游标卡尺"}, {"k": "D", "t": "塞尺"}], "a": "B", "e": "【考点】圆度圆柱度量具。\n【解析】量缸表(内径百分表)测气缸内径,在上下中截面纵横测量计算圆度圆柱度。故选B。\n【易错】“量缸表”。A外径千分尺测外圆、C卡尺精度低、D塞尺。气缸圆度圆柱度是大修必测项。"}, {"id": 866, "oid": "B4-145", "type": "single", "module": "汽车发动机维修", "q": "连杆衬套铰削加工后，活塞销与衬套的接触面积应不小于（　）。", "opts": [{"k": "A", "t": "50%"}, {"k": "B", "t": "75%~85%"}, {"k": "C", "t": "10%"}, {"k": "D", "t": "100%"}], "a": "B", "e": "【考点】衬套接触面积。\n【解析】衬套铰削后,活塞销与衬套接触面应均匀达75%~85%,保证载荷分布均匀。故选B。\n【易错】“75%~85%”。A50%太少、C10%明显不足、D100%不可能。接触率是铰削质量指标。"}, {"id": 867, "oid": "B4-146", "type": "single", "module": "汽车发动机维修", "q": "安装活塞连杆组前，应在气缸壁、活塞环和轴瓦上（　）。", "opts": [{"k": "A", "t": "涂机油润滑"}, {"k": "B", "t": "涂密封胶"}, {"k": "C", "t": "涂润滑脂"}, {"k": "D", "t": "保持干燥"}], "a": "A", "e": "【考点】装配润滑。\n【解析】安装活塞连杆组前,在气缸壁、活塞环和轴瓦上涂清洁机油,保证起动初期润滑防干摩擦拉伤。故选A。\n【易错】“涂机油”。B密封胶会堵油道、C润滑脂太稠、D干燥干摩擦。装配“油润滑、脂密封”。"}, {"id": 868, "oid": "B4-147", "type": "single", "module": "汽车发动机维修", "q": "活塞环侧隙过小，发动机热车时可能出现（　）。", "opts": [{"k": "A", "t": "环在槽内卡死、失去密封作用"}, {"k": "B", "t": "机油消耗减小"}, {"k": "C", "t": "密封增强"}, {"k": "D", "t": "敲击声减小"}], "a": "A", "e": "【考点】侧隙过小后果。\n【解析】侧隙过小环受热胀卡死在环槽中,失去弹性密封,导致漏气窜油。故选A。\n【易错】“过小卡死”。与736、811题配套。B机油消耗减小、C密封增强、D敲击声减小都错。"}, {"id": 869, "oid": "B4-148", "type": "single", "module": "汽车发动机维修", "q": "拆下的活塞连杆组应按（　）摆放，防止混装。", "opts": [{"k": "A", "t": "缸号顺序"}, {"k": "B", "t": "大小"}, {"k": "C", "t": "颜色"}, {"k": "D", "t": "轻重"}], "a": "A", "e": "【考点】拆件摆放。\n【解析】各缸活塞连杆配对,按缸号顺序摆放,装复时对号入座防混装。故选A。\n【易错】“按缸号摆放”。与769题配套。B大小、C颜色、D轻重都错。拆装管理“对号入座”。"}, {"id": 870, "oid": "B4-149", "type": "single", "module": "汽车发动机维修", "q": "检查活塞环端隙时，若端隙过大应（　）。", "opts": [{"k": "A", "t": "继续使用"}, {"k": "B", "t": "更换活塞环或重新镗缸选配"}, {"k": "C", "t": "锉小开口"}, {"k": "D", "t": "锉大开口"}], "a": "B", "e": "【考点】端隙过大处置。\n【解析】端隙过大说明环或缸壁磨损超限,应换环或镗缸选配;锉开口只能修小(端隙过小)不能修大。故选B。\n【易错】“过大换环镗缸”。C锉小开口是修“端隙过小”的方法、D锉大开口方向反。端隙判断与修法成对记。"}, {"id": 871, "oid": "B4-150", "type": "single", "module": "汽车发动机维修", "q": "连杆螺栓紧固后，应检查（　）。", "opts": [{"k": "A", "t": "连杆转动灵活无卡滞，并装好锁止装置"}, {"k": "B", "t": "螺栓外露长度"}, {"k": "C", "t": "连杆重量"}, {"k": "D", "t": "活塞颜色"}], "a": "A", "e": "【考点】连杆螺栓紧固后检查。\n【解析】紧固后应转动连杆灵活无卡滞,并装好开口销或锁片等锁止装置。故选A。\n【易错】“灵活+锁止”。B外露长度、C连杆重量、D活塞颜色都非检查项。锁止装置防松动是最后一道保险。"}, {"id": 872, "oid": "B4-151", "type": "single", "module": "汽车发动机维修", "q": "发动机冷态敲缸、热态消失，多为（　）。", "opts": [{"k": "A", "t": "活塞与气缸间隙过大（敲缸）"}, {"k": "B", "t": "活塞环折断"}, {"k": "C", "t": "连杆螺栓过紧"}, {"k": "D", "t": "机油过多"}], "a": "A", "e": "【考点】冷态敲缸诊断。\n【解析】冷车间隙大敲缸明显,热车活塞膨胀间隙减小声响消失,是典型活塞敲缸特征。故选A。\n【易错】“冷响热消=间隙大”。B环折断持续响、C螺栓过紧、D机油多无关。异响诊断“冷热对比”是方法。"}, {"id": 873, "oid": "B4-152", "type": "single", "module": "汽车发动机维修", "q": "活塞销响（怠速低速时清脆敲击声）的常见原因是（　）。", "opts": [{"k": "A", "t": "活塞销与销座或衬套间隙过大"}, {"k": "B", "t": "机油过多"}, {"k": "C", "t": "火花塞失火"}, {"k": "D", "t": "节气门脏"}], "a": "A", "e": "【考点】活塞销响诊断。\n【解析】活塞销间隙过大产生清脆敲击声,怠速低速明显、随转速升高增强,是活塞销响典型原因。故选A。\n【易错】“销间隙大=清脆响”。与853题配套。B机油多、C失火、D节气门脏都非销响原因。异响听诊:销响清脆、敲缸沉闷。"}, {"id": 874, "oid": "B4-153", "type": "single", "module": "汽车发动机维修", "q": "柴油机活塞烧顶（顶部烧蚀）的主要原因是（　）。", "opts": [{"k": "A", "t": "喷油时刻过晚、过热或冷却不良"}, {"k": "B", "t": "机油压力过高"}, {"k": "C", "t": "活塞环开口过大"}, {"k": "D", "t": "气缸压力过低"}], "a": "A", "e": "【考点】柴油机烧顶原因。\n【解析】喷油时刻过晚后燃严重、冷却润滑不良使活塞顶过热烧蚀,是柴油机烧顶主因。故选A。\n【易错】“喷油晚+过热”。B油压高、C环口大、D缸压低都非烧顶直接原因。烧顶=热负荷失控。"}, {"id": 875, "oid": "B4-154", "type": "single", "module": "汽车发动机维修", "q": "发动机大修后烧机油、冒蓝烟，测量气环端隙正常但第二道气环装反，应（　）。", "opts": [{"k": "A", "t": "重新按正确方向安装扭曲环"}, {"k": "B", "t": "继续使用"}, {"k": "C", "t": "更换活塞"}, {"k": "D", "t": "增大端隙"}], "a": "A", "e": "【考点】扭曲环装反故障。\n【解析】端隙正常但第二道气环(扭曲环)装反,丧失刮油作用反而泵油窜机油;应重新按正确方向安装。故选A。\n【易错】“装反=泵油”。与734、806、807题配套。B继续用窜油、C换活塞不对症、D增大端隙更糟。诊断:冒蓝烟→查环方向。"}];

const TYPE_META = {judge:"判断题", single:"单选题", multi:"多选题", short:"简答题", case:"案例分析题"};
