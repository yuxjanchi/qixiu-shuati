<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汽修刷题系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F4C81'/%3E%3Cpath d='M18 38l6-16h16l6 16-14 10z' fill='%23E8EEF4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%230F4C81'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#12202F; --body:#3E4C5C;
  --primary:#0B5FA5; --primary-2:#0F8BFF; --primary-soft:#E4F0FB;
  --accent:#F47A1E; --accent-soft:#FEF0E2;
  --ok:#16A34A; --ok-soft:#E7F6EC; --bad:#DC2626; --bad-soft:#FDEBEA;
  --muted:#8A94A6; --line:#E4E9F0;
  --m1:#3B82C4; --m2:#D9763B; --m3:#2F9E8F; --m4:#7A6FA6; --m5:#A68B4E;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(18,32,47,.05), 0 6px 20px rgba(18,32,47,.06);
  --shadow-lg:0 4px 10px rgba(18,32,47,.08), 0 16px 40px rgba(18,32,47,.10);
}
body.dark{
  --bg:#0F1620; --surface:#182230; --ink:#E8EDF4; --body:#B7C2D1; --line:#273547;
  --primary:#5BA3EC; --primary-2:#7FC0FF; --primary-soft:#1C3A55;
  --accent:#F79A4E; --accent-soft:#3A2A18;
  --ok:#4ADE80; --ok-soft:#12331F; --bad:#F87171; --bad-soft:#3A1B1B;
  --muted:#7C8AA0;
  --m1:#6FA9E0; --m2:#E8975F; --m3:#5FBFB0; --m4:#A89BDF; --m5:#C9B06E;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.30);
  --shadow-lg:0 4px 10px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,var(--bg) 0%,#E7EDF5 100%);color:var(--body);line-height:1.6;font-size:16px;transition:background .25s,color .25s}
body.dark{background:linear-gradient(180deg,#0F1620 0%,#131C28 100%)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* 布局 */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body.dark .topbar{background:rgba(24,34,48,.86)}
.topbar-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(11,95,165,.35)}
.brand-name{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
.top-nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.nav-btn{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--body);display:flex;align-items:center;gap:6px;min-height:40px;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--primary-soft)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px}
.theme-btn{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--body);flex:0 0 40px;transition:background .15s}
.theme-btn:hover{background:var(--primary-soft)}
.theme-btn svg{width:19px;height:19px}
@media (max-width:640px){
  .brand-sub{display:none}
  .nav-btn span{display:none}
  .nav-btn{width:46px;justify-content:center}
  .theme-btn{width:38px;flex-basis:38px}
}

main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:20px 16px 96px}
.view-title{font-size:23px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:.3px}
.view-desc{color:var(--muted);font-size:14px;margin-bottom:18px}

/* Hero 统计 */
.hero{background:linear-gradient(135deg,var(--primary) 0%,#0E7BC8 55%,var(--primary-2) 100%);border-radius:var(--radius);padding:22px 20px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(11,95,165,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:60px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .h-title{font-size:19px;font-weight:800;margin-bottom:2px}
.hero .h-sub{font-size:13px;opacity:.85;margin-bottom:16px}
.hero .h-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:1}
@media (max-width:520px){.hero .h-stats{grid-template-columns:repeat(2,1fr)}}
.hero .h-stat{padding:10px 12px;background:rgba(255,255,255,.14);border-radius:10px;backdrop-filter:blur(4px)}
.hero .h-num{font-size:24px;font-weight:800;line-height:1.15}
.hero .h-num small{font-size:12px;font-weight:600;opacity:.85}
.hero .h-label{font-size:11.5px;opacity:.9;margin-top:2px}

/* 卡片与统计 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:box-shadow .2s}
.card + .card{margin-top:14px}
.card-hover:hover{box-shadow:var(--shadow-lg)}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media (min-width:768px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2}
.stat-num small{font-size:13px;font-weight:400;color:var(--muted)}
.stat-label{font-size:13px;color:var(--muted);margin-top:2px}
.stat.ok .stat-num{color:var(--ok)}
.stat.bad .stat-num{color:var(--bad)}
.stat.fav .stat-num{color:var(--accent)}

/* 筛选器 */
.filter-block{margin-bottom:10px}
.filter-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.filter-title svg{width:15px;height:15px;color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--body);min-height:38px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{border-color:var(--primary)}
.chip.on{border-color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(11,95,165,.3)}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* 模式卡 */
.mode-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.mode-grid{grid-template-columns:repeat(3,1fr)}}
.mode-card{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.mode-card .mode-name{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.mode-card .mode-name svg{width:18px;height:18px;color:var(--primary)}
.mode-card.exam .mode-name svg{color:var(--accent)}
.mode-card .mode-desc{font-size:13px;color:var(--muted);flex:1}
.mode-card .mode-count{font-size:12px;color:var(--primary);font-weight:700}
.mode-card.exam .mode-count{color:var(--accent)}
.mode-card .badge-new{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;font-size:15px;font-weight:700;transition:background .15s,transform .05s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 3px 10px rgba(11,95,165,.3)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#F9A03F);color:#fff;box-shadow:0 3px 10px rgba(244,122,30,.3)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--body)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-ok{background:var(--ok);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 刷题视图 */
.quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.quiz-progress{flex:1;min-width:140px;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .25s}
.quiz-count{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.exam-timer{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exam-timer.warn{color:#fff;background:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.tag.type-judge{background:var(--m1)}
.tag.type-single{background:var(--m2)}
.tag.type-multi{background:var(--m3)}
.tag.type-short{background:var(--m4)}
.tag.type-case{background:var(--m5)}
.tag.module{background:var(--primary-soft);color:var(--primary);font-weight:700}

.q-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;transition:background .25s}
.q-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.7}
.q-title .q-no{color:var(--primary);margin-right:6px}
.q-title .q-case-title{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.q-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.q-title-row .q-title{flex:1;margin-bottom:0}
.star-btn{flex:0 0 40px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.star-btn:hover{background:var(--accent-soft)}
.star-btn.on{color:var(--accent)}
.star-btn svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:15px;line-height:1.5;transition:border-color .15s,background .15s}
.opt .opt-key{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.opt:hover{border-color:var(--primary)}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-key{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-key{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line)}

.judge-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge-btn{min-height:64px;font-size:17px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);transition:all .15s}
.judge-btn:hover{border-color:var(--primary);background:var(--primary-soft)}
.judge-btn.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.judge-btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;display:none;animation:fbIn .25s ease}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#14532D}
body.dark .feedback.ok{color:#86EFAC}
.feedback.bad{background:var(--bad-soft);color:#7B1F17}
body.dark .feedback.bad{color:#FCA5A5}
.feedback .fb-title{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.feedback .fb-explain{font-size:14px;line-height:1.7}
.feedback .fb-explanation{margin-top:10px;font-size:14px;color:var(--body);background:rgba(255,255,255,.6);border-radius:8px;padding:10px 12px}
body.dark .feedback .fb-explanation{background:rgba(255,255,255,.05)}
.fb-actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}

/* 案例/简答参考答案 */
.answer-panel{margin-top:16px;border:1.5px dashed var(--primary);border-radius:10px;padding:14px 16px;background:var(--primary-soft)}
.answer-panel .ap-title{font-weight:800;color:var(--primary);margin-bottom:6px}
.answer-panel .ap-text{font-size:14px;line-height:1.8}

.quiz-nav{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.quiz-nav .spacer{flex:1}

/* 答题卡 */
.sheet-wrap{margin-top:16px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sheet-head h3{font-size:15px;color:var(--ink)}
.sheet-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:700px){.sheet-grid{grid-template-columns:repeat(10,1fr)}}
.sheet-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);min-height:38px;transition:transform .1s}
.sheet-cell:hover{transform:scale(1.08)}
.sheet-cell.now{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.sheet-cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheet-cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet-cell.fav{outline:2px solid var(--accent);outline-offset:-2px}

/* 结果页 */
.done-hero{text-align:center;padding:30px 16px 20px}
.done-hero .score{font-size:52px;font-weight:800;color:var(--primary);line-height:1.1}
.done-hero .score small{font-size:18px;font-weight:600}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto}
.done-stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.done-stat .d-num{font-size:22px;font-weight:800;color:var(--ink)}
.done-stat .d-label{font-size:12px;color:var(--muted)}

/* 掌握度统计 */
.mastery{display:flex;flex-direction:column;gap:12px}
.mastery-row{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:10px}
@media (max-width:520px){.mastery-row{grid-template-columns:96px 1fr 48px}}
.mastery-name{font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mastery-bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.mastery-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#4ADE80);transition:width .4s}
.mastery-bar i.low{background:linear-gradient(90deg,var(--bad),#F87171)}
.mastery-bar i.mid{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.mastery-val{font-size:12.5px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.mastery-none{font-size:13px;color:var(--muted);text-align:center;padding:8px}

/* 成绩历史 */
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.hist-score{flex:0 0 62px;font-size:22px;font-weight:800;color:var(--primary)}
.hist-info{flex:1;min-width:0}
.hist-meta{font-size:13px;color:var(--body)}
.hist-time{font-size:12px;color:var(--muted);margin-top:2px}
.hist-rate{font-size:13px;font-weight:700;color:var(--ok)}
.hist-empty{font-size:13px;color:var(--muted);text-align:center;padding:10px}

/* 错题本 */
.wrong-list{display:flex;flex-direction:column;gap:10px}
.wrong-item{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);transition:box-shadow .15s}
.wrong-item:hover{box-shadow:var(--shadow-lg)}
.wrong-item .wi-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wrong-item .wi-q{font-size:15px;color:var(--ink);flex:1}
.wrong-item .wi-go{margin-top:8px;display:flex;gap:8px;align-items:center}
.wi-star{color:var(--muted);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.wi-star.on{color:var(--accent)}
.wi-star svg{width:18px;height:18px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:15px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;color:var(--line);display:block}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底部导航(移动) */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);min-height:56px;transition:color .15s}
.bottom-nav a.active{color:var(--primary);font-weight:700}
.bottom-nav svg{width:22px;height:22px}
@media (min-width:768px){.bottom-nav{display:none}}

@media (max-width:640px){
  main{padding:16px 12px 88px}
  .q-title{font-size:16px}
  .opt{font-size:14px;padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M4.5 9.5 9 12l3-6 3 6 4.5-2.5"/><path d="M9 18v-6"/></svg>
        </div>
        <div>
          <div class="brand-name">汽修刷题系统</div>
          <div class="brand-sub">技能高考 · 汽车维修类</div>
        </div>
      </div>

<script>
"use strict";
/* 数据在构建时注入 */
const QUESTIONS = [{"id":1,"oid":"A1-01","type":"single","module":"汽车概论与机械基础","q":"传统汽车通常由四大组成部分构成，下列不属于汽车四大组成部分的是（　）。","opts":[{"k":"A","t":"发动机"},{"k":"B","t":"底盘"},{"k":"C","t":"车身"},{"k":"D","t":"空调系统"}],"a":"D","e":"传统汽车由发动机、底盘、车身和电气设备四大组成部分构成。空调系统属于电气设备中的附属装置，不属于并列的四大组成部分。"},{"id":2,"oid":"A1-02","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车以动力蓄电池为能源，以驱动电机为动力装置，同时仍保留一台小型发动机和排气系统用于应急供电。","opts":[],"a":"×","e":"该说法错误。纯电动汽车（BEV）的动力完全来自动力蓄电池和驱动电机，没有发动机，也没有排气系统；保留小型发动机的通常是增程式或插电混动车型，不属纯电动汽车。"},{"id":3,"oid":"A1-03","type":"single","module":"汽车概论与机械基础","q":"混合动力汽车（HEV）与纯电动汽车（BEV）的主要区别在于（　）。","opts":[{"k":"A","t":"混合动力汽车没有动力电池"},{"k":"B","t":"混合动力汽车同时具有发动机和电动机两套动力源"},{"k":"C","t":"纯电动汽车以发动机为主要动力"},{"k":"D","t":"混合动力汽车不能回收制动能量"}],"a":"B","e":"混合动力汽车同时装备发动机和电动机两套动力系统，可相互配合工作；纯电动汽车只有电动机，靠动力电池供电。两者都能回收制动能量，混合动力汽车也配有动力电池。"},{"id":4,"oid":"A1-04","type":"judge","module":"汽车概论与机械基础","q":"增程式电动汽车在行驶中完全由驱动电机提供动力，发动机只用于带动发电机发电，不直接驱动车轮。","opts":[],"a":"√","e":"增程式电动汽车（增程版）的发动机不直接驱动车轮，只带动发电机发电为动力电池充电或直接向电机供电，驱动车辆行驶的动力全部来自电机。"},{"id":5,"oid":"A1-05","type":"single","module":"汽车概论与机械基础","q":"根据GB/T 3730.1的规定，汽车按用途分为乘用车和（　）两大类。","opts":[{"k":"A","t":"客车"},{"k":"B","t":"货车"},{"k":"C","t":"商用车"},{"k":"D","t":"专用车"}],"a":"C","e":"按我国国家标准GB/T 3730.1—2001，汽车分为乘用车和商用车两大类。客车、货车、专用车都属于商用车，不是与乘用车并列的大类。"},{"id":6,"oid":"A1-06","type":"single","module":"汽车概论与机械基础","q":"车辆识别代号（VIN）由17位字符组成，其中表示车辆制造厂和国际、地区代码的是（　）。","opts":[{"k":"A","t":"第1～3位（WMI）"},{"k":"B","t":"第4～9位（VDS）"},{"k":"C","t":"第10位"},{"k":"D","t":"第12～17位（VIS）"}],"a":"A","e":"VIN由三部分组成：第1～3位是世界制造厂识别代号（WMI），表示车辆制造厂、国家和地区；第4～9位是车辆说明部分（VDS）；第10～17位是车辆指示部分（VIS）。"},{"id":7,"oid":"A1-07","type":"judge","module":"汽车概论与机械基础","q":"同一辆车的VIN在世界范围内30年内不得重号，其中第10位表示车辆的生产年份。","opts":[],"a":"√","e":"VIN具有全球唯一性，30年内同一制造厂生产的车辆不得重号。VIN的第10位按规定表示车辆的生产年份，第11位表示装配厂代号。"},{"id":8,"oid":"A1-08","type":"single","module":"汽车概论与机械基础","q":"在维修作业中核对车辆识别代号（VIN），其主要作用是（　）。","opts":[{"k":"A","t":"确定车辆外观颜色"},{"k":"B","t":"唯一识别车辆身份，便于查询车型配置、生产年份及维修资料"},{"k":"C","t":"确定轮胎气压标准"},{"k":"D","t":"判断车辆是否年检"}],"a":"B","e":"VIN是车辆的唯一身份标识，通过它可以查询车辆的生产年份、产地、车型配置等信息，维修中用于准确选择配件和维修资料。"},{"id":9,"oid":"A1-09","type":"single","module":"汽车概论与机械基础","q":"汽车的最高车速、加速时间和最大爬坡度属于汽车的（　）。","opts":[{"k":"A","t":"动力性参数"},{"k":"B","t":"经济性参数"},{"k":"C","t":"制动性参数"},{"k":"D","t":"操纵稳定性参数"}],"a":"A","e":"汽车动力性主要由最高车速、加速时间（原地起步加速时间、超车加速时间）和最大爬坡度三个指标评价，它们反映汽车克服行驶阻力的能力。"},{"id":10,"oid":"A1-10","type":"single","module":"汽车概论与机械基础","q":"汽车的外廓尺寸不包括下列哪一项（　）。","opts":[{"k":"A","t":"车长"},{"k":"B","t":"车宽"},{"k":"C","t":"轴距"},{"k":"D","t":"车高"}],"a":"C","e":"汽车外廓尺寸包括车长、车宽、车高，是限制车辆外形轮廓的结构参数。轴距是前、后轴中心之间的距离，属于车辆的重要结构参数但不属于外廓尺寸。"},{"id":11,"oid":"A1-11","type":"judge","module":"汽车概论与机械基础","q":"轴距越长，车辆转弯所需的最小转弯半径越小，机动性越好。","opts":[],"a":"×","e":"该说法错误。轴距是前、后轴中心线之间的距离，轴距越长，整车转弯所需空间越大，最小转弯半径越大，机动性越差，但行驶稳定性通常更好。"},{"id":12,"oid":"A1-12","type":"single","module":"汽车概论与机械基础","q":"汽车整备质量是指（　）。","opts":[{"k":"A","t":"汽车满载时的总质量"},{"k":"B","t":"汽车按规定加足冷却液、燃油并带齐随车工具，未载人载货时的质量"},{"k":"C","t":"汽车出厂时的最大允许质量"},{"k":"D","t":"汽车各总成质量之和"}],"a":"B","e":"整备质量又称空车质量，是汽车加足冷却液、润滑油、燃油并带齐备胎、随车工具，但未载人载货时的质量。满载时的总质量称为最大总质量。"},{"id":13,"oid":"A1-13","type":"single","module":"汽车概论与机械基础","q":"活塞在气缸内运动，活塞顶距离曲轴回转中心最远时的位置称为（　）。","opts":[{"k":"A","t":"上止点"},{"k":"B","t":"下止点"},{"k":"C","t":"压缩行程终点"},{"k":"D","t":"工作行程起点"}],"a":"A","e":"上止点是活塞顶离曲轴回转中心最远、即活塞在气缸内最高位置；下止点是活塞顶离曲轴回转中心最近、即活塞最低位置。"},{"id":14,"oid":"A1-14","type":"single","module":"汽车概论与机械基础","q":"活塞从上止点运动到下止点所扫过的空间容积称为（　）。","opts":[{"k":"A","t":"气缸总容积"},{"k":"B","t":"燃烧室容积"},{"k":"C","t":"气缸工作容积"},{"k":"D","t":"发动机排量"}],"a":"C","e":"气缸工作容积（单缸排量）是活塞从上止点到下止点所扫过的容积；燃烧室容积是活塞在上止点时活塞顶上方的容积；气缸总容积=工作容积+燃烧室容积。"},{"id":15,"oid":"A1-15","type":"judge","module":"汽车概论与机械基础","q":"发动机排量等于各气缸工作容积之和，排量越大，发动机单次循环做功能力一般越弱。","opts":[],"a":"×","e":"该说法错误。排量=气缸工作容积×气缸数，排量越大，进入气缸的混合气越多，每次循环做功能力越强、动力性越好，而不是越弱。"},{"id":16,"oid":"A1-16","type":"single","module":"汽车概论与机械基础","q":"压缩比是指（　）的比值。","opts":[{"k":"A","t":"气缸总容积与燃烧室容积"},{"k":"B","t":"气缸工作容积与燃烧室容积"},{"k":"C","t":"气缸总容积与工作容积"},{"k":"D","t":"燃烧室容积与气缸工作容积"}],"a":"A","e":"压缩比=气缸总容积/燃烧室容积。压缩比越大，压缩终了时气体的温度和压力越高，发动机热效率越高，但过大会引起爆燃，因此压缩比要有一定限度。"},{"id":17,"oid":"A1-17","type":"single","module":"汽车概论与机械基础","q":"四冲程汽油机一个工作循环中，各行程的先后顺序是（　）。","opts":[{"k":"A","t":"进气、做功、压缩、排气"},{"k":"B","t":"进气、压缩、做功、排气"},{"k":"C","t":"压缩、进气、做功、排气"},{"k":"D","t":"进气、压缩、排气、做功"}],"a":"B","e":"四冲程发动机完成一个工作循环，曲轴转两圈（720°），活塞往复四个行程，顺序为：进气行程、压缩行程、做功行程、排气行程。"},{"id":18,"oid":"A1-18","type":"single","module":"汽车概论与机械基础","q":"四冲程汽油机在做功行程中，火花塞点火后，气缸内进行的能量转换是（　）。","opts":[{"k":"A","t":"机械能转化为热能"},{"k":"B","t":"热能转化为机械能"},{"k":"C","t":"化学能直接转化为机械能"},{"k":"D","t":"电能转化为机械能"}],"a":"B","e":"做功行程中，可燃混合气燃烧产生高温高压燃气，气体膨胀推动活塞下行，将热能转化为活塞的机械能，再经连杆传给曲轴形成旋转力矩。"},{"id":19,"oid":"A1-19","type":"single","module":"汽车概论与机械基础","q":"柴油机与汽油机在工作原理上的主要区别是（　）。","opts":[{"k":"A","t":"柴油机没有压缩行程"},{"k":"B","t":"柴油机采用压燃方式，混合气在气缸内靠压缩自燃"},{"k":"C","t":"柴油机只有一个行程"},{"k":"D","t":"柴油机使用火花塞点火"}],"a":"B","e":"柴油机吸入的是纯空气，压缩终了时气缸内温度远高于柴油自燃点，喷油器喷入的柴油自行着火燃烧，即压燃；汽油机则是电火花点燃，即点燃。"},{"id":20,"oid":"A1-20","type":"judge","module":"汽车概论与机械基础","q":"四冲程发动机中，做功、进气、压缩、排气四个行程都能自行完成，不需要任何外力带动曲轴。","opts":[],"a":"×","e":"该说法错误。四冲程发动机只有做功行程由燃气膨胀推动活塞对外输出动力；进气、压缩、排气三个行程都必须依靠飞轮储存的动能或其他缸的做功来带动曲轴完成。"},{"id":21,"oid":"A1-21","type":"single","module":"汽车概论与机械基础","q":"发动机的曲柄连杆机构由机体组、活塞连杆组和（　）三部分组成。","opts":[{"k":"A","t":"配气机构"},{"k":"B","t":"曲轴飞轮组"},{"k":"C","t":"冷却系统"},{"k":"D","t":"润滑系统"}],"a":"B","e":"曲柄连杆机构由机体组、活塞连杆组和曲轴飞轮组三部分组成，是发动机将活塞往复运动转变为曲轴旋转运动的机构。"},{"id":22,"oid":"A1-22","type":"single","module":"汽车概论与机械基础","q":"汽车底盘一般由传动系、行驶系、转向系和（　）四大系统组成。","opts":[{"k":"A","t":"制动系"},{"k":"B","t":"冷却系"},{"k":"C","t":"点火系"},{"k":"D","t":"起动系"}],"a":"A","e":"汽车底盘由传动系、行驶系、转向系和制动系四大系统组成，承担动力传递、行驶、转向和制动功能。点火系、起动系属于发动机电气设备。"},{"id":23,"oid":"A1-23","type":"judge","module":"汽车概论与机械基础","q":"汽车电气设备由电源和用电设备两大部分组成，采用低压直流电，负极搭铁。","opts":[],"a":"√","e":"汽车电气设备包括电源（蓄电池、发电机）和用电设备（起动、点火、照明、信号、仪表等）两大部分，采用12V（或24V）低压直流电，普遍采用负极搭铁。"},{"id":24,"oid":"A1-24","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车的三大核心系统通常不包括（　）。","opts":[{"k":"A","t":"动力蓄电池系统"},{"k":"B","t":"驱动电机系统"},{"k":"C","t":"电控系统"},{"k":"D","t":"冷却液循环系统"}],"a":"D","e":"纯电动汽车三大核心系统是动力电池系统、驱动电机系统和整车电控系统。冷却液循环系统是辅助系统，不属于三大核心系统。"},{"id":25,"oid":"A1-25","type":"single","module":"汽车概论与机械基础","q":"动力蓄电池的容量单位是（　）。","opts":[{"k":"A","t":"千瓦（kW）"},{"k":"B","t":"千瓦时（kWh）"},{"k":"C","t":"伏特（V）"},{"k":"D","t":"安培（A）"}],"a":"B","e":"动力蓄电池储存电能的多少用容量表示，常用单位为千瓦时（kWh，即“度”）。千瓦（kW）是功率单位，伏特是电压单位，安培是电流单位。"},{"id":26,"oid":"A1-26","type":"judge","module":"汽车概论与机械基础","q":"交流充电桩（慢充）输出的是直流电，可以直接为动力电池充电，无需经过车载充电机。","opts":[],"a":"×","e":"该说法错误。交流充电桩输出的是交流电，不能直接充入动力电池，必须经过车载充电机（OBC）将交流电变换为直流电，再按电池管理系统（BMS）的要求为动力电池充电。"},{"id":27,"oid":"A1-27","type":"single","module":"汽车概论与机械基础","q":"纯电动汽车的高压系统工作电压一般在（　）以上，作业时必须遵守高压安全操作规程。","opts":[{"k":"A","t":"12V"},{"k":"B","t":"24V"},{"k":"C","t":"60V（直流）"},{"k":"D","t":"380V（交流）"}],"a":"C","e":"按行业安全规范，纯电动汽车高压系统通常指直流60V以上（或交流30V以上）的回路，实际动力电池电压多在300～800V之间，属于高压危险回路，维修须断电作业。"},{"id":28,"oid":"A1-28","type":"single","module":"汽车概论与机械基础","q":"对纯电动汽车进行维修作业前，第一步应当（　）。","opts":[{"k":"A","t":"直接拆解电池包"},{"k":"B","t":"断开低压蓄电池负极，再断开高压维修开关（下电）"},{"k":"C","t":"用普通万用表测量高压线"},{"k":"D","t":"先启动车辆确认故障"}],"a":"B","e":"高压下电顺序应先在整车断电后断开12V低压蓄电池负极，再断开高压维修开关或拔下高压维修插头，并按规定等待电容放电，确认高压系统无电后方可作业。"},{"id":29,"oid":"A1-29","type":"judge","module":"汽车概论与机械基础","q":"在对新能源汽车高压部件作业时，应佩戴绝缘手套并选用带绝缘护套的工具，同时穿绝缘鞋。","opts":[],"a":"√","e":"高压作业必须使用经检验合格的绝缘手套（并套护套防磨损）、绝缘工具和绝缘鞋，避免人体直接接触高压回路，防止触电事故。"},{"id":30,"oid":"A1-30","type":"single","module":"汽车概论与机械基础","q":"按车身承载方式分类，轿车普遍采用的是（　）。","opts":[{"k":"A","t":"非承载式车身"},{"k":"B","t":"承载式车身"},{"k":"C","t":"半承载式车身"},{"k":"D","t":"框架式车身"}],"a":"B","e":"承载式车身与车架合为一体，取消了独立车架，车身承担全部载荷，质量轻、重心低，是现代轿车普遍采用的结构；非承载式车身有独立车架，多用于货车和越野车。"},{"id":31,"oid":"A1-31","type":"judge","module":"汽车概论与机械基础","q":"车身壳体是车身的基础件，包括发动机罩、车门、翼子板等都属于车身外部覆盖件。","opts":[],"a":"√","e":"车身主要由车身壳体及覆盖件（发动机罩、车门、翼子板、行李厢盖等）、车身内外饰件、附件等组成。覆盖件不承受主要载荷，主要起覆盖和美观作用。"},{"id":32,"oid":"A2-01","type":"single","module":"汽车概论与机械基础","q":"机械制图中，表示零件不可见轮廓线应采用的线型是（　）。","opts":[{"k":"A","t":"粗实线"},{"k":"B","t":"细虚线"},{"k":"C","t":"细点画线"},{"k":"D","t":"波浪线"}],"a":"B","e":"按国家标准GB/T 4457.4，零件不可见轮廓线用细虚线表示；可见轮廓线用粗实线；对称中心线、轴线用细点画线；断裂边界用波浪线或双折线。"},{"id":33,"oid":"A2-02","type":"judge","module":"汽车概论与机械基础","q":"机械图样中的尺寸以毫米（mm）为单位时，图样上必须标注单位符号“mm”。","opts":[],"a":"×","e":"该说法错误。按国家标准，机械图样中的尺寸数字默认以毫米为单位，此时不需标注单位符号；只有采用其他单位（如英寸、厘米）时才必须注明。"},{"id":34,"oid":"A2-03","type":"single","module":"汽车概论与机械基础","q":"三视图的投影规律是（　）。","opts":[{"k":"A","t":"长对正、高平齐、宽相等"},{"k":"B","t":"长相等、高对正、宽平齐"},{"k":"C","t":"长平齐、高相等、宽对正"},{"k":"D","t":"三者无固定对应关系"}],"a":"A","e":"三视图（主视图、俯视图、左视图）的投影规律为：主视图与俯视图长对正；主视图与左视图高平齐；俯视图与左视图宽相等。"},{"id":35,"oid":"A2-04","type":"judge","module":"汽车概论与机械基础","q":"直线上任意两点的投影连线若不在投影线上，则直线的投影仍可由该两点的投影确定。","opts":[],"a":"√","e":"直线是点的集合，直线上两点的投影确定后，直线的投影即可由这两点的投影连线确定，这是直线投影的基本性质。"},{"id":36,"oid":"A2-05","type":"single","module":"汽车概论与机械基础","q":"圆柱体在主视图和俯视图中的投影分别是（　）。","opts":[{"k":"A","t":"矩形和圆"},{"k":"B","t":"圆和矩形"},{"k":"C","t":"矩形和矩形"},{"k":"D","t":"圆和圆"}],"a":"A","e":"圆柱体轴线竖直放置时，主视图投影为矩形（圆柱面的投影轮廓），俯视图投影为圆（上、下端面的投影），左视图也为矩形。"},{"id":37,"oid":"A2-06","type":"single","module":"汽车概论与机械基础","q":"识读零件图时，要弄清零件的形状结构，首先应当分析（　）。","opts":[{"k":"A","t":"尺寸标注"},{"k":"B","t":"视图表达方案，找出主视图及各视图的对应关系"},{"k":"C","t":"标题栏材料"},{"k":"D","t":"表面粗糙度符号"}],"a":"B","e":"识读零件图应先看标题栏了解零件名称材料，再分析视图：找出主视图，弄清各视图的投影对应关系，想象出零件的整体形状，然后分析尺寸和技术要求。"},{"id":38,"oid":"A2-07","type":"single","module":"汽车概论与机械基础","q":"汽油的牌号（如92号、95号）表示的是汽油的（　）。","opts":[{"k":"A","t":"十六烷值"},{"k":"B","t":"辛烷值"},{"k":"C","t":"密度"},{"k":"D","t":"粘度"}],"a":"B","e":"汽油牌号按研究法辛烷值划分，92号、95号、98号表示辛烷值分别为92、95、98。辛烷值越高，汽油的抗爆性越好。"},{"id":39,"oid":"A2-08","type":"single","module":"汽车概论与机械基础","q":"评价柴油自燃性能（着火性）的指标是（　）。","opts":[{"k":"A","t":"辛烷值"},{"k":"B","t":"十六烷值"},{"k":"C","t":"闪点"},{"k":"D","t":"凝点"}],"a":"B","e":"柴油的着火性用十六烷值表示，十六烷值越高，柴油越容易自燃、工作越柔和；辛烷值是评价汽油抗爆性的指标，二者不要混淆。"},{"id":40,"oid":"A2-09","type":"single","module":"汽车概论与机械基础","q":"发动机润滑油（机油）黏度等级中的“W”表示（　）。","opts":[{"k":"A","t":"高温黏度"},{"k":"B","t":"冬季（低温）黏度等级"},{"k":"C","t":"润滑油的质量等级"},{"k":"D","t":"润滑油的密度"}],"a":"B","e":"SAE黏度分级中，带“W”的等级（如5W、10W）表示冬季用油，W取自Winter，数字越小低温流动性越好；不带W的数字（如30、40）表示高温黏度等级。"},{"id":41,"oid":"A2-10","type":"judge","module":"汽车概论与机械基础","q":"发动机润滑油中，添加剂可以弥补和改善基础油性能方面的不足，如抗磨剂、清净分散剂等。","opts":[],"a":"√","e":"发动机润滑油由基础油和添加剂组成，添加剂（清净分散剂、抗磨剂、抗氧化剂、防锈剂等）可弥补基础油性能不足，改善润滑油的综合使用性能。"},{"id":42,"oid":"B1-01","type":"judge","module":"汽车发动机维修","q":"发动机刚停机时温度很高，可以立即打开散热器盖，因为此时冷却系统已自动泄压，不会喷出高温蒸汽。","opts":[],"a":"×","e":"该说法错误。发动机刚停机时冷却系统内温度高、压力大，直接打开散热器盖会使高温蒸汽喷出造成烫伤，必须先等冷却液降温、泄压后再缓慢开启。"},{"id":43,"oid":"B1-02","type":"single","module":"汽车发动机维修","q":"在车间内起动发动机进行检查时，正确的做法是（　）。","opts":[{"k":"A","t":"在密闭车间长时间运转，不开排风"},{"k":"B","t":"将档位挂入前进挡并拉紧手刹起动"},{"k":"C","t":"确认变速器置于空挡或驻车挡，拉紧手刹，并开启排风装置"},{"k":"D","t":"用导线直接短接起动继电器试车"}],"a":"C","e":"起动发动机前必须确认空挡/驻车挡并拉紧手刹，防止车辆窜动伤人；同时应开启通风排气装置，防止一氧化碳等废气积聚中毒。"},{"id":44,"oid":"B1-03","type":"single","module":"汽车发动机维修","q":"在燃油系统维修作业中，为防止火灾，下列做法错误的是（　）。","opts":[{"k":"A","t":"拆装油管前先释放燃油系统压力"},{"k":"B","t":"作业现场严禁明火和吸烟"},{"k":"C","t":"用普通脸盆敞口盛接汽油并放置于作业区"},{"k":"D","t":"拆卸的油管用堵头封住防止燃油外溢"}],"a":"C","e":"汽油极易挥发并易燃，应使用密闭的专用容器收集废油并及时转移，敞口容器放置汽油会聚集油气，遇明火或电火花极易起火爆炸。"},{"id":45,"oid":"B2-01","type":"single","module":"汽车发动机维修","q":"电控汽油喷射系统中，负责根据各传感器信号计算喷油量和点火时刻的核心部件是（　）。","opts":[{"k":"A","t":"节气门位置传感器"},{"k":"B","t":"电子控制单元（ECU）"},{"k":"C","t":"喷油器"},{"k":"D","t":"燃油泵"}],"a":"B","e":"ECU（电子控制单元）是电控系统的核心，接收各传感器信号，经运算处理后向执行器发出指令，控制喷油量、喷油时刻和点火时刻等。"},{"id":46,"oid":"B2-02","type":"single","module":"汽车发动机维修","q":"电控燃油喷射系统按喷油器安装位置分类，现代轿车普遍采用的是（　）。","opts":[{"k":"A","t":"单点喷射（SPI）"},{"k":"B","t":"多点喷射（MPI）"},{"k":"C","t":"化油器供油"},{"k":"D","t":"缸内直喷与歧管喷射以外的方式"}],"a":"B","e":"多点喷射（MPI）在每个气缸的进气歧管处各装一个喷油器，按各缸需求精确供油，是目前电控汽油机普遍采用的形式；单点喷射在节气门体处集中喷油。"},{"id":47,"oid":"B2-03","type":"judge","module":"汽车发动机维修","q":"进气压力传感器（MAP）的作用是检测进气歧管内的真空度，ECU据此直接确定点火时刻，与进气量和喷油量无关。","opts":[],"a":"×","e":"该说法错误。MAP检测的是进气歧管内的绝对压力，在D型（速度-密度型）电控喷射系统中，ECU根据歧管绝对压力和发动机转速间接计算进气量，进而确定基本喷油量，并非与喷油量无关。"},{"id":48,"oid":"B2-04","type":"single","module":"汽车发动机维修","q":"电控汽油机起动时，为了加浓混合气、便于起动，ECU通常采用的控制方式是（　）。","opts":[{"k":"A","t":"减小喷油脉宽"},{"k":"B","t":"根据冷却液温度修正，在低温时增大喷油脉宽"},{"k":"C","t":"关闭喷油器"},{"k":"D","t":"增大点火提前角同时减小喷油量"}],"a":"B","e":"低温时燃油蒸发困难，ECU根据冷却液温度传感器信号增加喷油脉宽（加浓混合气），以保证冷起动顺利；起动时一般不根据氧传感器反馈修正。"},{"id":49,"oid":"B3-01","type":"judge","module":"汽车发动机维修","q":"发动机有效功率是发动机对外输出的功率，标定功率是制造厂按规定条件标定的最大有效功率。","opts":[],"a":"√","e":"有效功率是发动机曲轴端实际对外输出的功率；标定功率是铭牌上标定的、在规定条件下测得的最大有效功率，是发动机动力性的重要指标。"},{"id":50,"oid":"B3-02","type":"single","module":"汽车发动机维修","q":"发动机的有效转矩、有效功率随转速变化的关系曲线称为（　）。","opts":[{"k":"A","t":"万有特性曲线"},{"k":"B","t":"速度特性曲线"},{"k":"C","t":"负荷特性曲线"},{"k":"D","t":"点火提前角特性曲线"}],"a":"B","e":"速度特性曲线表示发动机有效转矩、有效功率等参数随转速变化的规律；万有特性曲线则表示油耗率等参数在转速与负荷平面上的等值线分布。"},{"id":51,"oid":"B3-03","type":"single","module":"汽车发动机维修","q":"发动机燃油经济性的主要评价指标是（　）。","opts":[{"k":"A","t":"有效热效率"},{"k":"B","t":"有效燃油消耗率"},{"k":"C","t":"机械效率"},{"k":"D","t":"容积效率"}],"a":"B","e":"有效燃油消耗率（比油耗，g/kW·h）表示单位有效功所消耗的燃油量，是评价发动机燃油经济性的主要指标，数值越低经济性越好。"},{"id":52,"oid":"B3-04","type":"judge","module":"汽车发动机维修","q":"发动机大修竣工后，应保证怠速运转平稳、无异常响声，额定转速下功率不低于原厂标定功率的90%左右，符合《汽车发动机大修竣工技术条件》。","opts":[],"a":"√","e":"按GB/T 3799《汽车发动机大修竣工技术条件》，大修后的发动机在额定转速下的功率不低于原标定功率的90%，怠速平稳、无异响，是验收的基本要求。"},{"id":53,"oid":"B4-01","type":"single","module":"汽车发动机维修","q":"活塞环按功能分为气环和（　）。","opts":[{"k":"A","t":"油环"},{"k":"B","t":"密封环"},{"k":"C","t":"卡环"},{"k":"D","t":"支承环"}],"a":"A","e":"活塞环分为气环（密封气缸、传导热量）和油环（刮油、布油）两类。普通活塞一般装2～3道气环和1道油环。"},{"id":54,"oid":"B4-02","type":"single","module":"汽车发动机维修","q":"安装活塞环时，将各道气环的开口在圆周方向错开一定角度，其目的是（　）。","opts":[{"k":"A","t":"便于装配"},{"k":"B","t":"减少漏气量，防止相邻环口形成漏气通道"},{"k":"C","t":"减小活塞环磨损"},{"k":"D","t":"增大活塞环张力"}],"a":"B","e":"各气环开口若重合会形成直通的漏气通道，加剧窜气和机油消耗，因此安装时应将相邻环口错开（通常错开120°～180°），并避开活塞销方向。"},{"id":55,"oid":"B4-03","type":"judge","module":"汽车发动机维修","q":"活塞与气缸的配合间隙过大时，会引起敲缸异响、窜气、机油消耗增加，因此选配活塞时应测量活塞裙部与气缸的配合间隙。","opts":[],"a":"√","e":"活塞与气缸间隙过大会产生敲缸声、机油上窜燃烧和窜气；间隙过小又会卡滞拉缸。修理中通过测量配合间隙来选配活塞，保证规定的配合标准。"},{"id":56,"oid":"B4-04","type":"single","module":"汽车发动机维修","q":"检查活塞环的端隙（开口间隙）时，应将活塞环平放入气缸内，用（　）测量开口处的间隙。","opts":[{"k":"A","t":"游标卡尺"},{"k":"B","t":"塞尺"},{"k":"C","t":"外径千分尺"},{"k":"D","t":"百分表"}],"a":"B","e":"活塞环端隙用塞尺测量：将环放入气缸中上部（未磨损处），用活塞顶将其推平后，用塞尺插入环开口测量间隙，端隙过大漏气、过小易卡死。"},{"id":57,"oid":"B4-05","type":"judge","module":"汽车发动机维修","q":"连杆的作用是连接活塞与曲轴，将曲轴的旋转运动转变为活塞的往复运动，并把曲轴所受的力传给活塞。","opts":[],"a":"×","e":"该说法错误。连杆小头经活塞销与活塞相连、大头与曲轴连杆轴颈相连，其作用是把活塞的往复运动转变为曲轴的旋转运动，并把活塞所受的力传给曲轴，运动转换方向说反了。"},{"id":58,"oid":"B5-01","type":"single","module":"汽车发动机维修","q":"曲轴上用于连接连杆的部分称为（　）。","opts":[{"k":"A","t":"主轴颈"},{"k":"B","t":"连杆轴颈"},{"k":"C","t":"曲柄"},{"k":"D","t":"平衡重"}],"a":"B","e":"曲轴由主轴颈（支承在机体主轴承上）、连杆轴颈（与连杆大头连接）、曲柄和平衡重等组成；连杆轴颈又称曲柄销。"},{"id":59,"oid":"B5-02","type":"judge","module":"汽车发动机维修","q":"飞轮的主要作用是增大发动机的功率，飞轮转动惯量越大，发动机输出的有效功率越高。","opts":[],"a":"×","e":"该说法错误。飞轮靠较大的转动惯量储存做功行程的能量，带动其他三个行程运转并保持转速平稳，它不产生动力，与发动机功率大小无关。"},{"id":60,"oid":"B5-03","type":"single","module":"汽车发动机维修","q":"测量曲轴主轴颈的圆度、圆柱度误差，应选用的量具是（　）。","opts":[{"k":"A","t":"游标卡尺"},{"k":"B","t":"塞尺"},{"k":"C","t":"外径千分尺"},{"k":"D","t":"直尺"}],"a":"C","e":"轴颈直径测量用外径千分尺，分别在轴颈同一截面互相垂直的两个方向和不同截面测量，计算圆度、圆柱度误差，判断曲轴是否磨损超限。"},{"id":61,"oid":"B5-04","type":"single","module":"汽车发动机维修","q":"检查曲轴弯曲变形时，常用的方法是（　）。","opts":[{"k":"A","t":"用游标卡尺测轴颈直径"},{"k":"B","t":"将曲轴两端主轴颈支承在V形铁上，用百分表测中间主轴颈的径向跳动量"},{"k":"C","t":"用塞尺测轴承间隙"},{"k":"D","t":"目视检查轴颈表面"}],"a":"B","e":"曲轴弯曲量通过测径向圆跳动检查：将曲轴两端主轴颈置于V形铁上，缓慢转动曲轴，用百分表测中间主轴颈表面的跳动量，跳动量超过标准需校正或更换。"},{"id":62,"oid":"B5-05","type":"judge","module":"汽车发动机维修","q":"曲轴主轴承（轴瓦）的配合间隙过大会造成机油压力下降、产生敲击异响，过小则可能导致烧瓦抱轴。","opts":[],"a":"√","e":"主轴承间隙过大，机油从间隙大量泄漏，油压降低，曲轴产生撞击异响；间隙过小，油膜难以建立，摩擦加剧易烧瓦。因此间隙必须符合规定值。"},{"id":63,"oid":"B6-01","type":"single","module":"汽车发动机维修","q":"四冲程发动机配气机构的作用是（　）。","opts":[{"k":"A","t":"将活塞往复运动变为旋转运动"},{"k":"B","t":"按各缸工作顺序及时开启和关闭进、排气门，保证换气"},{"k":"C","t":"将燃油喷入气缸"},{"k":"D","t":"调节发动机转速"}],"a":"B","e":"配气机构按发动机工作循环和各缸点火顺序，在规定时刻开启和关闭进、排气门，使新鲜混合气（或空气）进入气缸、废气排出气缸。"},{"id":64,"oid":"B6-02","type":"single","module":"汽车发动机维修","q":"凸轮轴上的凸轮直接（或经挺柱、推杆、摇臂）控制（　）的开启与关闭。","opts":[{"k":"A","t":"活塞环"},{"k":"B","t":"气门"},{"k":"C","t":"喷油器"},{"k":"D","t":"节流阀"}],"a":"B","e":"配气机构中凸轮轴的凸轮按配气相位推动挺柱、推杆、摇臂等传动件，最终控制气门的开启时刻、开启持续时间和升程。"},{"id":65,"oid":"B6-03","type":"single","module":"汽车发动机维修","q":"气门间隙过大的直接后果是（　）。","opts":[{"k":"A","t":"气门关闭不严，漏气"},{"k":"B","t":"气门开启晚、关闭早，进气不足排气不畅，并产生气门敲击声"},{"k":"C","t":"气门烧蚀"},{"k":"D","t":"凸轮轴弯曲"}],"a":"B","e":"气门间隙过大时，传动件与气门之间空行程大，气门开启滞后、关闭提前，充气不足、排气不净，同时产生“嗒嗒”的敲击声；间隙过小则气门关闭不严。"},{"id":66,"oid":"B6-04","type":"judge","module":"汽车发动机维修","q":"正时带（链）错位会导致配气相位错误，可能造成气门与活塞碰撞顶坏气门。","opts":[],"a":"√","e":"正时带（链）连接曲轴与凸轮轴，若错齿导致配气相位错乱，气门会在活塞到达上止点时仍处于开启状态，发生气门与活塞干涉，顶弯气门、损坏发动机。"},{"id":67,"oid":"B6-05","type":"single","module":"汽车发动机维修","q":"发动机出现“气门漏气”故障时，下列现象中不符合的是（　）。","opts":[{"k":"A","t":"气缸压力明显偏低"},{"k":"B","t":"怠速不稳、功率下降"},{"k":"C","t":"进气管回火或排气管放炮"},{"k":"D","t":"机油压力升高"}],"a":"D","e":"气门关闭不严漏气会导致气缸压缩压力下降、怠速不稳、功率不足，进气门漏气时进气管回火，排气门漏气时排气管放炮；机油压力升高与气门漏气无关。"},{"id":68,"oid":"B7-01","type":"single","module":"汽车发动机维修","q":"水冷式发动机冷却系统中，节温器安装在（　）上。","opts":[{"k":"A","t":"散热器出水管"},{"k":"B","t":"气缸盖出水口处"},{"k":"C","t":"水泵进水口"},{"k":"D","t":"暖风水管"}],"a":"B","e":"节温器一般装在气缸盖出水口（或水泵进口）处，根据冷却液温度自动控制大小循环的切换：冷车时走小循环快速暖机，热车后打开大循环散热。"},{"id":69,"oid":"B7-02","type":"judge","module":"汽车发动机维修","q":"冷却液（防冻液）具有防冻、防沸、防腐蚀和防垢的作用，因此可以用自来水长期代替使用。","opts":[],"a":"×","e":"该说法错误。冷却液具有防冻、防沸、防腐蚀、防水垢等功能，长期用水会生锈、结垢，冬天结冰还会胀裂缸体，不能用水长期代替，应使用规定牌号的冷却液并定期更换。"},{"id":70,"oid":"B7-03","type":"single","module":"汽车发动机维修","q":"发动机过热（开锅）的常见原因不包括（　）。","opts":[{"k":"A","t":"散热器外部堵塞或风扇不工作"},{"k":"B","t":"冷却液不足或水泵损坏"},{"k":"C","t":"节温器卡在关闭位置"},{"k":"D","t":"机油油位过高"}],"a":"D","e":"发动机过热的常见原因有散热器脏堵、风扇不转、冷却液不足、水泵失效、节温器卡死等；机油油位过高主要影响润滑和密封，不会直接导致过热。"},{"id":71,"oid":"B7-04","type":"single","module":"汽车发动机维修","q":"发动机冷车正常、热车后水温报警，用温度计实测水温并不高，最可能的原因是（　）。","opts":[{"k":"A","t":"冷却液不足"},{"k":"B","t":"冷却液温度传感器或线路故障"},{"k":"C","t":"节温器损坏"},{"k":"D","t":"水泵皮带打滑"}],"a":"B","e":"实测水温不高但仪表报警，说明显示信号失真，故障在温度传感器、线路或仪表本身，应检查传感器电阻和线路；冷却液不足、节温器损坏会导致真实过热。"},{"id":72,"oid":"B8-01","type":"single","module":"汽车发动机维修","q":"发动机润滑系统中，机油泵的作用是（　）。","opts":[{"k":"A","t":"过滤机油杂质"},{"k":"B","t":"建立机油压力，将机油输送到各摩擦表面"},{"k":"C","t":"冷却机油"},{"k":"D","t":"储存机油"}],"a":"B","e":"机油泵将油底壳中的机油加压后输送到各摩擦表面，保证润滑油膜形成；机油滤清器负责过滤杂质，油底壳储存机油。"},{"id":73,"oid":"B8-02","type":"judge","module":"汽车发动机维修","q":"机油压力过低时，发动机各摩擦表面润滑不良，容易造成轴瓦烧蚀、曲轴抱死等严重故障。","opts":[],"a":"√","e":"机油压力过低说明供油不足，摩擦表面难以建立油膜，处于干摩擦或边界摩擦状态，会迅速导致烧瓦、抱轴等严重机械损伤，必须立即停机检查。"},{"id":74,"oid":"B8-03","type":"single","module":"汽车发动机维修","q":"机油压力过高的常见原因是（　）。","opts":[{"k":"A","t":"机油泵磨损"},{"k":"B","t":"机油黏度过大或主油道堵塞"},{"k":"C","t":"油底壳缺油"},{"k":"D","t":"机油滤清器破损"}],"a":"B","e":"机油黏度过大、主油道或油路堵塞、限压阀卡死等会使机油压力过高，容易压裂滤清器或密封件；机油泵磨损、缺油会造成压力过低。"},{"id":75,"oid":"B8-04","type":"single","module":"汽车发动机维修","q":"机油警告灯在发动机运转中点亮（怠速时）且加油门后熄灭，最可能的原因是（　）。","opts":[{"k":"A","t":"机油泵彻底损坏"},{"k":"B","t":"怠速机油压力偏低，接近报警限值"},{"k":"C","t":"机油警告灯线路断路"},{"k":"D","t":"机油黏度过大"}],"a":"B","e":"怠速时转速低、油压相对低，若机油量不足、机油泵轻微磨损或轴承间隙偏大，油压会降到报警值以下亮灯，加速后油压升高灯灭。应检查油位、油压和轴瓦间隙。"},{"id":76,"oid":"B9-01","type":"single","module":"汽车发动机维修","q":"发动机进气系统中，空气滤清器的作用是（　）。","opts":[{"k":"A","t":"降低进气噪声"},{"k":"B","t":"滤除空气中的灰尘杂质，防止气缸和活塞早期磨损"},{"k":"C","t":"增加进气量"},{"k":"D","t":"预热空气"}],"a":"B","e":"空气滤清器滤除进气中的尘土杂质，保护气缸壁、活塞环等免受磨料磨损；消声器用于降低排气噪声。滤芯堵塞会使进气不足、动力下降。"},{"id":77,"oid":"B9-02","type":"judge","module":"汽车发动机维修","q":"排气消声器的作用是增大排气压力，使废气排出更迅速，从而提高发动机的输出功率。","opts":[],"a":"×","e":"该说法错误。消声器通过多次反射、吸收和膨胀降低排气气流的压力波动，主要作用是降低排气噪声，并有利于废气净化装置工作，而不是增大排气压力来提高功率。"},{"id":78,"oid":"B9-03","type":"single","module":"汽车发动机维修","q":"三元催化转化器安装在排气系统中，其作用是将废气中的（　）转化为无害物质。","opts":[{"k":"A","t":"CO、HC、NOx"},{"k":"B","t":"CO2、H2O"},{"k":"C","t":"O2、N2"},{"k":"D","t":"SO2、CO"}],"a":"A","e":"三元催化转化器以铂、铑、钯为催化剂，将废气中的一氧化碳（CO）、碳氢化合物（HC）氧化，并将氮氧化物（NOx）还原为CO2、H2O和N2。"},{"id":79,"oid":"B9-04","type":"single","module":"汽车发动机维修","q":"发动机排气背压过高的最常见原因是（　）。","opts":[{"k":"A","t":"空气滤清器堵塞"},{"k":"B","t":"三元催化转化器或消声器堵塞"},{"k":"C","t":"节气门积炭"},{"k":"D","t":"火花塞间隙过大"}],"a":"B","e":"三元催化转化器烧结、消声器锈蚀堵塞都会使排气不畅、背压升高，表现为动力下降、加速无力、油耗增加。空气滤清器堵塞属于进气阻力问题。"},{"id":80,"oid":"B10-01","type":"single","module":"汽车发动机维修","q":"电控燃油供给系统由燃油箱、燃油泵、燃油滤清器、（　）和喷油器等组成。","opts":[{"k":"A","t":"油压调节器"},{"k":"B","t":"节气门"},{"k":"C","t":"空气流量计"},{"k":"D","t":"氧传感器"}],"a":"A","e":"电控燃油供给系统包括燃油箱、电动燃油泵、燃油滤清器、油压调节器（调压器）、喷油器及油管等，油压调节器保持喷油压差恒定。"},{"id":81,"oid":"B10-02","type":"judge","module":"汽车发动机维修","q":"电动燃油泵一般安装在发动机舱内，靠空气自然冷却，浸在燃油中工作会损坏燃油泵。","opts":[],"a":"×","e":"该说法错误。电动燃油泵多为内装式，装在燃油箱内浸油工作，便于散热和润滑、不易产生气阻，也降低了燃油泄漏风险，而不是安装在发动机舱内。"},{"id":82,"oid":"B10-03","type":"single","module":"汽车发动机维修","q":"发动机不能起动，接通点火开关时听不到燃油泵运转声（正常应转2～3秒后停止），首先应检查（　）。","opts":[{"k":"A","t":"燃油泵继电器及熔丝"},{"k":"B","t":"喷油器堵塞"},{"k":"C","t":"气缸压力"},{"k":"D","t":"正时皮带"}],"a":"A","e":"接通点火开关后ECU会控制燃油泵继电器使油泵短暂运转建立油压。听不到运转声说明油泵电路（熔丝、继电器、油泵本身）可能断路，应先检查电路。"},{"id":83,"oid":"B10-04","type":"single","module":"汽车发动机维修","q":"检测电控汽油机燃油系统压力时，应使用（　）接在燃油分配管（油轨）的检测口处。","opts":[{"k":"A","t":"万用表"},{"k":"B","t":"燃油压力表"},{"k":"C","t":"真空表"},{"k":"D","t":"气缸压力表"}],"a":"B","e":"燃油系统压力通过专用燃油压力表连接油轨检测口测量，正常怠速时一般在250～350kPa左右（各车型不同），用于判断油泵、调压器是否正常。"},{"id":84,"oid":"B10-05","type":"judge","module":"汽车发动机维修","q":"喷油器滴漏（关闭不严）会造成混合气过浓、油耗增加、热车起动困难，并可能引起排气管冒黑烟。","opts":[],"a":"√","e":"喷油器关闭不严时燃油在非喷射期间持续渗入，混合气过浓，怠速不稳、油耗上升、热车难起动，多余燃油燃烧不充分，排气管冒黑烟。"},{"id":85,"oid":"B11-01","type":"single","module":"汽车发动机维修","q":"发动机电控系统由传感器、（　）和执行器三大部分组成。","opts":[{"k":"A","t":"继电器"},{"k":"B","t":"电子控制单元（ECU）"},{"k":"C","t":"保险丝"},{"k":"D","t":"线束插接器"}],"a":"B","e":"发动机电控系统由传感器（输入）、电子控制单元ECU（处理）和执行器（输出）三大部分组成。传感器采集工况信息，ECU运算决策，执行器执行指令。"},{"id":86,"oid":"B11-02","type":"single","module":"汽车发动机维修","q":"下列属于发动机电控系统执行器的是（　）。","opts":[{"k":"A","t":"曲轴位置传感器"},{"k":"B","t":"氧传感器"},{"k":"C","t":"喷油器"},{"k":"D","t":"冷却液温度传感器"}],"a":"C","e":"喷油器、点火线圈、怠速控制阀等属于执行器，接收ECU指令动作；曲轴位置传感器、氧传感器、水温传感器等属于传感器，向ECU输入信号。"},{"id":87,"oid":"B11-03","type":"single","module":"汽车发动机维修","q":"曲轴位置传感器（CKP）损坏后，发动机最典型的故障现象是（　）。","opts":[{"k":"A","t":"怠速抖动"},{"k":"B","t":"无法起动（无点火、无喷油）"},{"k":"C","t":"油耗略有增加"},{"k":"D","t":"水温过高"}],"a":"B","e":"曲轴位置传感器提供曲轴转角与转速信号，是ECU计算点火时刻和喷油正时的基准信号。CKP信号丢失时ECU无法判断曲轴位置，发动机通常不能起动。"},{"id":88,"oid":"B11-04","type":"judge","module":"汽车发动机维修","q":"氧传感器的作用是检测排气中氧的浓度，ECU据此对喷油量进行闭环修正，使混合气保持在理论空燃比附近。","opts":[],"a":"√","e":"氧传感器（O2S）检测排气含氧量判断混合气浓稀，ECU据此修正喷油脉宽，实现闭环控制，保证三元催化转化器高效工作。氧传感器损坏会进入开环、油耗升高。"},{"id":89,"oid":"C1-01","type":"judge","module":"汽车底盘维修","q":"在举升机下作业时，只要车辆在举升平台上停稳即可，无需拉紧手刹和检查锁止机构，因为举升机具备自动锁定功能。","opts":[],"a":"×","e":"该说法错误。举升作业必须确认车辆停放平稳、拉紧驻车制动、举升机锁止可靠，严禁在未锁止的举升机下作业，防止车辆滑落造成重大事故。"},{"id":90,"oid":"C1-02","type":"single","module":"汽车底盘维修","q":"拆装悬架、传动轴等底盘部件时，若弹簧处于压缩状态，正确的做法是（　）。","opts":[{"k":"A","t":"直接用力撬出"},{"k":"B","t":"使用专用压缩工具释放弹簧预紧力后再拆装"},{"k":"C","t":"用锤子猛击弹簧"},{"k":"D","t":"一边举升一边拆螺栓"}],"a":"B","e":"螺旋弹簧在压缩状态下储存大量能量，直接拆装会使弹簧猛然弹出伤人，必须使用专用弹簧压缩器先压缩固定，再安全拆装。"},{"id":91,"oid":"C2-01","type":"single","module":"汽车底盘维修","q":"汽车传动系的作用是（　）。","opts":[{"k":"A","t":"将发动机的动力传给驱动车轮"},{"k":"B","t":"使汽车减速停车"},{"k":"C","t":"改变汽车行驶方向"},{"k":"D","t":"支承车身质量"}],"a":"A","e":"传动系将发动机输出的动力经离合器、变速器、万向传动装置、主减速器、差速器和半轴传递给驱动车轮，实现动力传递。减速制动属制动系，转向属转向系。"},{"id":92,"oid":"C2-02","type":"judge","module":"汽车底盘维修","q":"前置前驱（FF）布置的汽车，变速器、主减速器和差速器通常组合为一体安装在前桥上。","opts":[],"a":"√","e":"前置前驱（FF）车型将发动机横置（或纵置），变速器与主减速器、差速器集成为一体（变速驱动桥），直接驱动前轮，传动效率高、结构紧凑。"},{"id":93,"oid":"C2-03","type":"single","module":"汽车底盘维修","q":"差速器的作用是（　）。","opts":[{"k":"A","t":"增大扭矩"},{"k":"B","t":"使两侧驱动轮以不同转速转动，适应转弯等行驶工况"},{"k":"C","t":"改变旋转方向"},{"k":"D","t":"缓冲传动冲击"}],"a":"B","e":"差速器允许两侧驱动轮转速不同，转弯时外侧轮转速高于内侧轮，避免轮胎拖滑；同时把主减速器传来的转矩分配给左右半轴。"},{"id":94,"oid":"C3-01","type":"single","module":"汽车底盘维修","q":"摩擦式离合器由主动部分、从动部分、压紧机构和（　）四部分组成。","opts":[{"k":"A","t":"操纵机构"},{"k":"B","t":"飞轮"},{"k":"C","t":"分离轴承"},{"k":"D","t":"压盘"}],"a":"A","e":"摩擦离合器由主动部分（飞轮、压盘）、从动部分（从动盘）、压紧机构（膜片弹簧等）和操纵机构（踏板、拉索/液压、分离轴承等）组成。"},{"id":95,"oid":"C3-02","type":"judge","module":"汽车底盘维修","q":"离合器的功用是保证汽车平稳起步、便于换挡，并防止传动系过载。","opts":[],"a":"√","e":"离合器通过分离与接合实现动力传递的切断与接通：起步时逐渐接合使车辆平稳起步，换挡时分离切断动力便于挂挡，载荷突变时打滑可防止传动系过载。"},{"id":96,"oid":"C3-03","type":"single","module":"汽车底盘维修","q":"离合器踏板自由行程过小或没有自由行程时，会造成（　）。","opts":[{"k":"A","t":"离合器分离不彻底"},{"k":"B","t":"离合器打滑"},{"k":"C","t":"离合器发抖"},{"k":"D","t":"变速器乱挡"}],"a":"B","e":"自由行程过小时分离轴承长期压在分离杠杆（膜片弹簧）上，压盘不能压紧从动盘，产生离合器打滑；自由行程过大则分离行程不足，导致分离不彻底。"},{"id":97,"oid":"C3-04","type":"single","module":"汽车底盘维修","q":"汽车起步时，完全松开离合器踏板车辆仍不能起步（发动机正常、变速器挡位正常），最可能的原因是（　）。","opts":[{"k":"A","t":"离合器分离不彻底"},{"k":"B","t":"离合器打滑"},{"k":"C","t":"离合器发抖"},{"k":"D","t":"离合器踏板自由行程过大"}],"a":"B","e":"起步时离合器打滑，发动机动力不能有效传给变速器，表现为起步困难、加速无力、上坡无力且伴有烧焦味。分离不彻底表现为挂挡困难或起步时熄火。"},{"id":98,"oid":"C3-05","type":"single","module":"汽车底盘维修","q":"诊断离合器发抖时，通常应重点检查（　）。","opts":[{"k":"A","t":"从动盘翘曲、压盘工作面不平或压紧弹簧弹力不均"},{"k":"B","t":"离合器踏板高度"},{"k":"C","t":"变速器油量"},{"k":"D","t":"万向节润滑"}],"a":"A","e":"离合器发抖（起步时车身抖振）多因从动盘翘曲、摩擦片局部烧蚀、压盘不平、膜片弹簧弹力不均或飞轮端面偏摆等造成压紧力不均匀所致。"},{"id":99,"oid":"C4-01","type":"single","module":"汽车底盘维修","q":"手动变速器由变速传动机构、（　）和变速操纵机构组成。","opts":[{"k":"A","t":"壳体"},{"k":"B","t":"换挡拨叉"},{"k":"C","t":"齿轮"},{"k":"D","t":"同步器"}],"a":"A","e":"手动变速器由变速传动机构（齿轮轴系）、变速操纵机构（换挡杆、拨叉、拨叉轴等）和变速器壳体三部分组成；同步器属于传动机构中的换挡元件。"},{"id":100,"oid":"C4-02","type":"judge","module":"汽车底盘维修","q":"同步器的作用是增大换挡时齿轮的撞击声，使驾驶员能够清晰地感知挡位已经啮合。","opts":[],"a":"×","e":"该说法错误。同步器通过锥面摩擦使结合套与待啮合齿圈转速同步后再啮合，作用是消除换挡冲击和齿轮撞击声、实现无冲击换挡，而不是制造撞击声。"},{"id":101,"oid":"C4-03","type":"single","module":"汽车底盘维修","q":"手动变速器挂挡困难、有“打齿”声，在离合器分离彻底的前提下，最可能的原因是（　）。","opts":[{"k":"A","t":"同步器磨损损坏"},{"k":"B","t":"变速器缺油"},{"k":"C","t":"万向节磨损"},{"k":"D","t":"轮胎气压不足"}],"a":"A","e":"同步器锥面磨损后失去同步作用，换挡时齿轮直接撞击产生“打齿”声、挂挡困难；变速器缺油表现为运转噪声大、温度高，但不会直接打齿。"},{"id":102,"oid":"C4-04","type":"single","module":"汽车底盘维修","q":"手动变速器自动跳挡（行驶中自行脱挡）的常见原因是（　）。","opts":[{"k":"A","t":"同步器磨损"},{"k":"B","t":"自锁装置失效、拨叉轴定位凹槽磨损或齿轮磨损成锥形"},{"k":"C","t":"变速器油过多"},{"k":"D","t":"离合器踏板自由行程过大"}],"a":"B","e":"自锁（定位）装置弹簧变软、拨叉轴凹槽磨损使挡位定位不可靠，或啮合齿轮磨损成锥形产生轴向推力，都会引起行驶中自动跳挡。"},{"id":103,"oid":"C4-05","type":"judge","module":"汽车底盘维修","q":"变速器异响随转速升高而增大、挂挡后消失或改变，多为变速器轴承、齿轮磨损或油量不足所致。","opts":[],"a":"√","e":"变速器运转噪声与转速相关，空挡时噪声大多为输入轴轴承、中间轴轴承磨损；行驶挂挡后噪声变化多为齿轮啮合不良，缺油会加剧全部噪声，应检查油量和轴承齿轮。"},{"id":104,"oid":"C5-01","type":"single","module":"汽车底盘维修","q":"万向传动装置一般由万向节、传动轴和（　）组成。","opts":[{"k":"A","t":"中间支承"},{"k":"B","t":"差速器"},{"k":"C","t":"半轴"},{"k":"D","t":"主减速器"}],"a":"A","e":"万向传动装置由万向节、传动轴和中间支承（长轴距车辆）组成，用于连接变速器输出轴与驱动桥，适应两者间的角度和距离变化。"},{"id":105,"oid":"C5-02","type":"judge","module":"汽车底盘维修","q":"十字轴式刚性万向节用于传动轴时，为减小转速波动，通常由两个万向节按一定规律组合使用（等速排列）。","opts":[],"a":"√","e":"单个十字轴万向节传动的转速有波动，为消除波动需成对使用并保证传动轴两端万向节叉在同一平面、夹角相等，实现近似等速传动。"},{"id":106,"oid":"C5-03","type":"single","module":"汽车底盘维修","q":"汽车行驶中，传动轴出现周期性“咯噔”异响并伴随车身抖动，随车速升高抖动加剧，最可能的原因是（　）。","opts":[{"k":"A","t":"传动轴弯曲或动平衡被破坏"},{"k":"B","t":"轮胎气压不足"},{"k":"C","t":"制动器拖滞"},{"k":"D","t":"离合器打滑"}],"a":"A","e":"传动轴弯曲、失去动平衡或万向节磨损后，高速旋转产生周期性振动，表现为周期异响和车身抖动，转速越高越明显。应检查传动轴平衡及万向节。"},{"id":107,"oid":"C5-04","type":"single","module":"汽车底盘维修","q":"等速万向节（球笼式）一般用于（　）。","opts":[{"k":"A","t":"前置后驱车的传动轴两端"},{"k":"B","t":"前轮驱动汽车的内、外半轴（驱动轴）两端"},{"k":"C","t":"主减速器与差速器之间"},{"k":"D","t":"转向器与转向节之间"}],"a":"B","e":"前驱车转向驱动桥的半轴两端需要大角度且等速传动，采用球笼式等速万向节（内、外万向节）；普通十字轴万向节用于前置后驱车的传动轴。"},{"id":108,"oid":"C6-01","type":"single","module":"汽车底盘维修","q":"主减速器的作用是（　）。","opts":[{"k":"A","t":"降低转速、增大转矩，并将旋转方向改变90°（纵置后驱）"},{"k":"B","t":"使两侧车轮转速不同"},{"k":"C","t":"切断动力"},{"k":"D","t":"缓冲冲击"}],"a":"A","e":"主减速器降低转速、增大转矩，纵置后驱车还改变动力传递方向90°，使半轴沿汽车横向布置驱动车轮；使两侧车轮转速不同是差速器的功能。"},{"id":109,"oid":"C6-02","type":"judge","module":"汽车底盘维修","q":"主减速器传动比越大，汽车最高车速越高，但加速能力和爬坡能力越弱。","opts":[],"a":"×","e":"该说法错误。主减速比大则减速增扭作用强，低速时驱动力大、加速爬坡能力强，但相同车速下发动机转速高，最高车速反而降低；主减速比小则相反。"},{"id":110,"oid":"C6-03","type":"single","module":"汽车底盘维修","q":"锥齿轮式主减速器中，调整主、从动锥齿轮啮合间隙和啮合印痕时，应（　）。","opts":[{"k":"A","t":"只调整轴承预紧力"},{"k":"B","t":"通过增减调整垫片或调整螺母，同时保证啮合间隙和啮合印痕符合规定"},{"k":"C","t":"只更换润滑油"},{"k":"D","t":"重新焊接齿轮"}],"a":"B","e":"主、从动锥齿轮的啮合间隙和啮合印痕必须同时符合要求，通过增减调整垫片、旋动调整螺母改变齿轮轴向位置来调整，间隙与印痕互相影响，需反复配合调整。"},{"id":111,"oid":"C6-04","type":"judge","module":"汽车底盘维修","q":"差速器在直线行驶时，两侧半轴齿轮转速不相等，行星齿轮自转；转弯时两侧半轴转速相等，行星齿轮不自转。","opts":[],"a":"×","e":"该说法错误。直线行驶时两侧阻力相等，行星齿轮随差速器壳公转而不自转，两半轴齿轮同速；转弯时外侧阻力小，行星齿轮自转补偿转速差，使两侧半轴转速不等。两种情况正好说反了。"},{"id":112,"oid":"C7-01","type":"single","module":"汽车底盘维修","q":"轮胎在汽车上的作用不包括（　）。","opts":[{"k":"A","t":"支承汽车总质量"},{"k":"B","t":"缓和路面冲击，保证行驶平顺"},{"k":"C","t":"产生驱动力和制动力，保证附着"},{"k":"D","t":"减小转向角度"}],"a":"D","e":"轮胎支承整车质量、缓和冲击、保证附着性能、传递驱动力与制动力并影响行驶方向；转向角度由转向系决定，与轮胎功能无关。"},{"id":113,"oid":"C7-02","type":"judge","module":"汽车底盘维修","q":"轮胎气压过低时胎体变形减小、滚动阻力降低，因此适当降低气压可以节约燃油。","opts":[],"a":"×","e":"该说法错误。气压过低时胎体变形大、帘布层疲劳加剧，滚动阻力增大、油耗升高，行驶中反复屈挠生热还易导致胎体脱层、爆胎，必须保持标准气压。"},{"id":114,"oid":"C7-03","type":"single","module":"汽车底盘维修","q":"轮胎异常磨损中，若两侧胎肩磨损严重，通常表明（　）。","opts":[{"k":"A","t":"轮胎气压过高"},{"k":"B","t":"轮胎气压过低"},{"k":"C","t":"前束不正确"},{"k":"D","t":"车轮不平衡"}],"a":"B","e":"气压过低时胎面中部内凹，两侧胎肩与地面接触压力大而磨损严重；气压过高则胎面中部磨损严重；前束不正确引起胎面羽状磨损；车轮不平衡造成轮胎点状磨损。"},{"id":115,"oid":"C7-04","type":"single","module":"汽车底盘维修","q":"为防止轮胎早期损坏，下列做法不正确的是（　）。","opts":[{"k":"A","t":"保持标准气压并定期检查"},{"k":"B","t":"定期进行轮胎换位"},{"k":"C","t":"前轮采用新旧程度不一致的轮胎"},{"k":"D","t":"避免超载和高速急转弯"}],"a":"C","e":"同轴轮胎应规格、花纹、磨损程度一致，否则两侧滚动半径和附着不同，会造成跑偏、异常磨损并影响制动稳定性；定期换位和保持气压是正确做法。"},{"id":116,"oid":"C8-01","type":"single","module":"汽车底盘维修","q":"汽车行驶系由车架（或承载式车身）、车桥、（　）和车轮四部分组成。","opts":[{"k":"A","t":"悬架"},{"k":"B","t":"转向器"},{"k":"C","t":"制动器"},{"k":"D","t":"差速器"}],"a":"A","e":"行驶系由车架（或车身）、车桥、悬架和车轮四部分组成。悬架连接车架与车桥，弹性地传递力和力矩并缓和冲击。转向器属转向系，制动器属制动系。"},{"id":117,"oid":"C8-02","type":"judge","module":"汽车底盘维修","q":"悬架一般由弹性元件、减振器和导向机构（含横向稳定杆）组成，弹性元件用于缓冲冲击，减振器用于衰减振动。","opts":[],"a":"√","e":"悬架中弹性元件（钢板弹簧、螺旋弹簧等）缓和冲击，减振器消耗振动能量衰减振动，导向机构（摆臂、连杆）传递力和确定车轮运动轨迹，横向稳定杆防侧倾。"},{"id":118,"oid":"C8-03","type":"single","module":"汽车底盘维修","q":"行驶中车身持续颠簸振动、车轮与路面冲击感强，且按压车身时回弹不止，最可能的原因是（　）。","opts":[{"k":"A","t":"减振器失效"},{"k":"B","t":"轮胎气压过低"},{"k":"C","t":"转向器间隙大"},{"k":"D","t":"制动器拖滞"}],"a":"A","e":"减振器失效后不能衰减弹簧的振动，车身会持续颠簸、余振不断；轮胎气压过低主要表现为转向沉重和胎面磨损。减振器失效还常伴有漏油。"},{"id":119,"oid":"C8-04","type":"single","module":"汽车底盘维修","q":"行驶中前轮出现“摆振”（方向发抖），速度越高越明显，常见原因是（　）。","opts":[{"k":"A","t":"车轮动不平衡"},{"k":"B","t":"制动液不足"},{"k":"C","t":"离合器分离不彻底"},{"k":"D","t":"变速器缺油"}],"a":"A","e":"车轮动不平衡时，高速旋转产生周期性离心力引起前轮摆振、方向抖动，并加速轮胎异常磨损，应做车轮动平衡试验并加配重块。"},{"id":120,"oid":"C9-01","type":"single","module":"汽车底盘维修","q":"机械转向系统由转向操纵机构、转向器和（　）三部分组成。","opts":[{"k":"A","t":"转向传动机构"},{"k":"B","t":"制动踏板"},{"k":"C","t":"差速器"},{"k":"D","t":"半轴"}],"a":"A","e":"机械转向系由转向操纵机构（转向盘、转向轴）、转向器（将转向力放大并改变方向）和转向传动机构（转向摇臂、直拉杆、转向节臂、横拉杆等）组成。"},{"id":121,"oid":"C9-02","type":"judge","module":"汽车底盘维修","q":"液压动力转向系统以蓄电池带动电动油泵产生液压助力，助力大小固定不变，与发动机转速无关。","opts":[],"a":"×","e":"该说法错误。液压动力转向由发动机带动转向油泵产生液压助力，减轻转向操纵力；怠速或低速时助力大、转向轻便，高速时助力减小，助力随工况变化，且不是由蓄电池驱动电动油泵。"},{"id":122,"oid":"C9-03","type":"single","module":"汽车底盘维修","q":"转向盘自由行程（游隙）过大的常见原因是（　）。","opts":[{"k":"A","t":"转向器啮合间隙过大或转向传动机构各球头松旷"},{"k":"B","t":"轮胎气压过高"},{"k":"C","t":"前束过大"},{"k":"D","t":"减振器失效"}],"a":"A","e":"转向盘自由行程过大说明转向系传动间隙过大，主要源于转向器齿轮齿条（或蜗杆滚轮）啮合间隙大、球头销磨损松旷、轴承松动等，应及时调整消除。"},{"id":123,"oid":"C9-04","type":"single","module":"汽车底盘维修","q":"液压动力转向系统转向沉重，发动机怠速运转时原地打方向费力，首先应检查（　）。","opts":[{"k":"A","t":"转向油泵皮带松紧及油液液位"},{"k":"B","t":"前束值"},{"k":"C","t":"转向器啮合间隙过小"},{"k":"D","t":"车轮动平衡"}],"a":"A","e":"动力转向沉重应先检查助力系统：油泵皮带松滑、储油罐油液不足或油路进气等都会使助力失效；排除助力系统原因后再检查机械部分和前束。"},{"id":124,"oid":"C9-05","type":"judge","module":"汽车底盘维修","q":"汽车直线行驶时自动跑偏，除转向系外，还可能与两侧轮胎气压不等、制动器拖滞、前轮定位失准有关。","opts":[],"a":"√","e":"跑偏是多因素故障：轮胎气压不等使两侧滚动半径不同、制动器单侧拖滞产生附加阻力、前轮定位（前束、外倾）失准都会造成行驶跑偏，诊断时应逐项排查。"},{"id":125,"oid":"C10-01","type":"single","module":"汽车底盘维修","q":"液压制动系统由制动踏板、制动主缸、（　）、制动轮缸（分泵）和车轮制动器组成。","opts":[{"k":"A","t":"制动管路"},{"k":"B","t":"转向油泵"},{"k":"C","t":"差速器"},{"k":"D","t":"离合器"}],"a":"A","e":"液压制动系由制动踏板、制动主缸（总泵）、制动管路、制动轮缸（分泵）和车轮制动器组成，以制动液传递制动压力。"},{"id":126,"oid":"C10-02","type":"judge","module":"汽车底盘维修","q":"行车制动器主要用于停车后防止车辆溜动，驻车制动器主要用于行驶中使汽车减速或停车。","opts":[],"a":"×","e":"该说法错误。行车制动（脚制动）用于行驶中减速或停车，驻车制动（手刹/电子手刹）用于停车后可靠驻留、防止溜车，两者功能正好说反了。"},{"id":127,"oid":"C10-03","type":"single","module":"汽车底盘维修","q":"制动踏板踩下后感觉“软”（发绵）、制动距离明显变长，最可能的原因是（　）。","opts":[{"k":"A","t":"制动管路内有空气"},{"k":"B","t":"制动器拖滞"},{"k":"C","t":"制动液过多"},{"k":"D","t":"制动踏板自由行程过小"}],"a":"A","e":"制动管路进空气后，气体可压缩，踩踏板时先压缩空气再传力，踏板发软、制动效能下降，需排空气（放气）；拖滞表现为不制动也发热阻滞。"},{"id":128,"oid":"C10-04","type":"single","module":"汽车底盘维修","q":"制动器拖滞（放松制动后车轮仍不能自由转动）的常见原因是（　）。","opts":[{"k":"A","t":"制动液不足"},{"k":"B","t":"制动踏板自由行程过大"},{"k":"C","t":"制动主缸回位不良或轮缸卡滞、制动器回位弹簧折断"},{"k":"D","t":"制动管路有空气"}],"a":"C","e":"拖滞多为机械或液压回位不良：主缸回位弹簧失效、皮碗发胀、轮缸活塞卡滞、回位弹簧折断等使制动器不能完全松开，表现为行驶阻力大、轮毂发热。"},{"id":129,"oid":"C10-05","type":"judge","module":"汽车底盘维修","q":"制动跑偏（制动时汽车向一侧偏驶）时，应重点检查两侧制动器制动力是否均衡、轮胎气压是否一致及前轮定位是否正确。","opts":[],"a":"√","e":"制动跑偏主要因两侧制动器制动力不均（轮缸卡滞、摩擦片油污烧蚀、间隙不一）或两侧附着条件不同所致，也受胎压和前轮定位影响，须对称性检查。"},{"id":130,"oid":"C11-01","type":"single","module":"汽车底盘维修","q":"轮胎规格“205/55 R16”中，“R”表示（　）。","opts":[{"k":"A","t":"轮胎内径"},{"k":"B","t":"子午线轮胎"},{"k":"C","t":"斜交轮胎"},{"k":"D","t":"载重等级"}],"a":"B","e":"规格205/55 R16中：205为胎面宽度（mm），55为扁平率（高宽比%），R表示子午线轮胎，16为轮辋直径（英寸）。"},{"id":131,"oid":"C11-02","type":"judge","module":"汽车底盘维修","q":"更换轮胎时，应选用与原车规格、结构和速度级别相同的轮胎，不能随意混用不同规格的轮胎。","opts":[],"a":"√","e":"轮胎规格影响整车性能与安全，混用不同规格会使滚动半径、承载和速度能力不一致，导致行驶跑偏、ABS异常和安全隐患，必须按原车规格选用。"},{"id":132,"oid":"C11-03","type":"single","module":"汽车底盘维修","q":"高速行驶的轿车选用轮胎时，除规格外还应特别注意轮胎的（　）。","opts":[{"k":"A","t":"速度级别（如H、V、W级）"},{"k":"B","t":"颜色"},{"k":"C","t":"品牌产地"},{"k":"D","t":"花纹方向"}],"a":"A","e":"速度级别表示轮胎允许的最高行驶速度（H=210km/h，V=240km/h，W=270km/h等），高速车辆必须选用不低于原车要求的速度级别，保证高速安全。"},{"id":133,"oid":"C12-01","type":"single","module":"汽车底盘维修","q":"液力自动变速器（AT）主要由液力变矩器、（　）、液压控制系统和电子控制系统等组成。","opts":[{"k":"A","t":"齿轮变速机构"},{"k":"B","t":"同步器"},{"k":"C","t":"主减速器"},{"k":"D","t":"差速器"}],"a":"A","e":"液力自动变速器由液力变矩器（液力传动）、行星齿轮变速机构（或平行轴齿轮机构）、液压控制系统（阀体）和电子控制系统（TCU及电磁阀）组成。"},{"id":134,"oid":"C12-02","type":"judge","module":"汽车底盘维修","q":"液力变矩器只起传递动力的作用，不能变速变矩，汽车起步平稳主要依靠发动机怠速控制实现。","opts":[],"a":"×","e":"该说法错误。液力变矩器由泵轮、涡轮、导轮组成，不仅能传递动力，还能在一定范围内自动变速变矩：涡轮转速低时输出扭矩增大，保证汽车起步平稳、换挡柔和。"},{"id":135,"oid":"C12-03","type":"single","module":"汽车底盘维修","q":"自动变速器（AT）换挡规律的控制，主要依据（　）两个信号。","opts":[{"k":"A","t":"车速和节气门开度（负荷）"},{"k":"B","t":"发动机转速和机油压力"},{"k":"C","t":"水温与油温"},{"k":"D","t":"制动踏板与离合器位置"}],"a":"A","e":"自动变速器根据车速和节气门开度（发动机负荷）两个基本信号确定换挡时机：车速高升挡、负荷大推迟升挡，实现随行驶工况自动换挡。"},{"id":136,"oid":"C12-04","type":"judge","module":"汽车底盘维修","q":"自动变速器油（ATF）除传递液力变矩器动力外，还用于润滑齿轮机构、冷却和操纵液压控制系统，必须使用规定牌号的ATF。","opts":[],"a":"√","e":"ATF同时承担传递动力、润滑、冷却和液压操纵介质多重功能，不同牌号ATF性能差异大，混用或误用会造成换挡冲击、油液劣化甚至损坏变速器。"},{"id":137,"oid":"D1-01","type":"single","module":"汽车电子与电器维修","q":"在串联电路中，各电阻两端电压的关系是（　）。","opts":[{"k":"A","t":"各电阻电压相等"},{"k":"B","t":"总电压等于各电阻电压之和，各电阻电流相等"},{"k":"C","t":"各电阻电流不同"},{"k":"D","t":"总电流等于各支路电流之和"}],"a":"B","e":"串联电路电流处处相等，总电压等于各串联电阻电压之和；并联电路各支路两端电压相等，总电流等于各支路电流之和。"},{"id":138,"oid":"D1-02","type":"single","module":"汽车电子与电器维修","q":"两个12Ω的电阻并联后，其总电阻为（　）。","opts":[{"k":"A","t":"24Ω"},{"k":"B","t":"12Ω"},{"k":"C","t":"6Ω"},{"k":"D","t":"3Ω"}],"a":"C","e":"n个相同电阻R并联的总电阻为R/n，两个12Ω并联总电阻为6Ω。并联电阻越并越小，总电阻小于其中任一电阻。"},{"id":139,"oid":"D1-03","type":"judge","module":"汽车电子与电器维修","q":"汽车前照灯灯泡（12V、55W）正常点亮时，流过灯泡的电流约为0.46A。","opts":[],"a":"×","e":"该说法错误。由P=UI可得I=P/U=55W÷12V≈4.58A，约为4.6A，而不是0.46A。欧姆定律与功率公式是汽车电路计算的基本工具。"},{"id":140,"oid":"D1-04","type":"single","module":"汽车电子与电器维修","q":"某灯泡额定电压12V、额定功率24W，其正常工作时电阻约为（　）。","opts":[{"k":"A","t":"2Ω"},{"k":"B","t":"6Ω"},{"k":"C","t":"12Ω"},{"k":"D","t":"24Ω"}],"a":"B","e":"由P=U²/R得R=U²/P=12²/24=144/24=6Ω。注意白炽灯冷态电阻比热态小，此处按额定工况计算。"},{"id":141,"oid":"D1-05","type":"single","module":"汽车电子与电器维修","q":"我国工业与民用交流电的频率（工频）为（　）。","opts":[{"k":"A","t":"50Hz"},{"k":"B","t":"60Hz"},{"k":"C","t":"100Hz"},{"k":"D","t":"25Hz"}],"a":"A","e":"我国电网标准频率为50Hz（工频），周期0.02s；美国、日本等部分国家采用60Hz。"},{"id":142,"oid":"D1-06","type":"judge","module":"汽车电子与电器维修","q":"交流电的有效值等于其最大值除以√2，即U=Um/√2。","opts":[],"a":"√","e":"正弦交流电的有效值是产生相同热效应的等效直流值，U=Um/√2≈0.707Um，I=Im/√2。普通电压表测得的都是有效值。"},{"id":143,"oid":"D1-07","type":"single","module":"汽车电子与电器维修","q":"纯电容电路中，电流与电压的相位关系是（　）。","opts":[{"k":"A","t":"电流超前电压90°"},{"k":"B","t":"电流滞后电压90°"},{"k":"C","t":"同相"},{"k":"D","t":"反相"}],"a":"A","e":"纯电容电路中电流超前电压90°；纯电感电路中电流滞后电压90°；纯电阻电路两者同相。"},{"id":144,"oid":"D1-08","type":"single","module":"汽车电子与电器维修","q":"三相交流电源的三相电压相位依次相差（　）。","opts":[{"k":"A","t":"60°"},{"k":"B","t":"90°"},{"k":"C","t":"120°"},{"k":"D","t":"180°"}],"a":"C","e":"三相对称交流电的U、V、W三相电压相位依次相差120°（电角度），这是三相交流电的基本特征。"},{"id":145,"oid":"D1-09","type":"judge","module":"汽车电子与电器维修","q":"三相绕组星形（Y形）连接时，线电压等于相电压；三角形（Δ形）连接时，线电压是相电压的√3倍。","opts":[],"a":"×","e":"该说法错误。星形连接时线电压=√3×相电压、线电流=相电流；三角形连接时线电压=相电压、线电流=√3×相电流，两种接法的电压关系正好说反了。"},{"id":146,"oid":"D1-10","type":"single","module":"汽车电子与电器维修","q":"汽车三相交流发电机定子绕组采用星形连接时，其线电压为14V，则每相绕组的相电压约为（　）。","opts":[{"k":"A","t":"8V"},{"k":"B","t":"14V"},{"k":"C","t":"24V"},{"k":"D","t":"7V"}],"a":"A","e":"星形连接线电压=√3×相电压，故相电压=线电压/√3=14/1.732≈8.1V，约为8V。发电机输出的三相交流电经整流后给蓄电池充电。"},{"id":147,"oid":"D1-11","type":"single","module":"汽车电子与电器维修","q":"电磁继电器的工作原理是（　）。","opts":[{"k":"A","t":"利用电流的热效应"},{"k":"B","t":"利用电磁铁吸合带动触点通断电路"},{"k":"C","t":"利用静电感应"},{"k":"D","t":"利用晶体管的放大作用"}],"a":"B","e":"电磁继电器由线圈、铁芯和触点组成，线圈通电产生电磁吸力吸合衔铁，带动触点闭合或断开，实现以小电流控制大电流电路。"},{"id":148,"oid":"D1-12","type":"single","module":"汽车电子与电器维修","q":"直流电动机的工作原理是（　）。","opts":[{"k":"A","t":"通电导体在磁场中受电磁力作用而运动"},{"k":"B","t":"电磁感应产生电流"},{"k":"C","t":"电流的热效应"},{"k":"D","t":"压电效应"}],"a":"A","e":"直流电动机利用通电导体在磁场中受安培力（电磁力）作用而转动，实现电能向机械能的转换；发电机则是利用电磁感应将机械能转为电能，二者可逆。"},{"id":149,"oid":"D1-13","type":"judge","module":"汽车电子与电器维修","q":"汽车点火线圈是一个降压变压器，将蓄电池的高压电降低为火花塞点火所需的低压电。","opts":[],"a":"×","e":"该说法错误。点火线圈是升压变压器，初级绕组通断电流时，次级绕组因电磁感应产生1.5万～3万伏的高压电，供火花塞跳火点燃混合气。"},{"id":150,"oid":"D1-14","type":"single","module":"汽车电子与电器维修","q":"步进电动机的特点是（　）。","opts":[{"k":"A","t":"连续旋转，转速可调"},{"k":"B","t":"按脉冲信号步进式转动，转角与脉冲数成正比"},{"k":"C","t":"只能正转不能反转"},{"k":"D","t":"需要高压驱动"}],"a":"B","e":"步进电动机每收到一个脉冲转过一个固定步距角，转角由脉冲数决定、转速由脉冲频率决定，常用于怠速控制阀等精确位置控制场合。"},{"id":151,"oid":"D1-15","type":"single","module":"汽车电子与电器维修","q":"二极管最重要的特性是（　）。","opts":[{"k":"A","t":"放大作用"},{"k":"B","t":"单向导电性"},{"k":"C","t":"稳压作用"},{"k":"D","t":"开关作用"}],"a":"B","e":"二极管具有单向导电性：正向导通、反向截止，用于整流、检波等；稳压管利用反向击穿特性稳压；三极管具有电流放大和开关作用。"},{"id":152,"oid":"D1-16","type":"judge","module":"汽车电子与电器维修","q":"汽车交流发电机中的整流器由晶闸管组成，作用是将蓄电池的直流电逆变为三相交流电。","opts":[],"a":"×","e":"该说法错误。整流器由六只（或九只）硅二极管组成三相桥式整流电路，将发电机定子产生的三相交流电整流为直流电，供用电设备使用并给蓄电池充电。"},{"id":153,"oid":"D1-17","type":"single","module":"汽车电子与电器维修","q":"用万用表电阻挡检测二极管时，正常的检测现象是（　）。","opts":[{"k":"A","t":"正反向都导通"},{"k":"B","t":"正向导通（阻值小），反向截止（阻值大）"},{"k":"C","t":"正反向都截止"},{"k":"D","t":"正反向阻值相同"}],"a":"B","e":"好的二极管正向电阻小（导通）、反向电阻很大（截止）；若正反向阻值都为零为击穿短路，都无穷大为断路损坏，不能使用。"},{"id":154,"oid":"D1-18","type":"judge","module":"汽车电子与电器维修","q":"三极管有电流放大作用，其放大能力用电流放大倍数β表示，基极电流的微小变化可引起集电极电流的较大变化。","opts":[],"a":"√","e":"三极管（BJT）在放大状态时Ic=β·Ib，基极电流控制集电极电流，实现电流放大，在点火控制、电压调节器等电路中广泛应用。"},{"id":155,"oid":"D2-01","type":"single","module":"汽车电子与电器维修","q":"铅酸蓄电池的电解液是（　）。","opts":[{"k":"A","t":"稀盐酸"},{"k":"B","t":"稀硫酸"},{"k":"C","t":"蒸馏水"},{"k":"D","t":"氢氧化钠溶液"}],"a":"B","e":"铅酸蓄电池电解液为密度约1.26～1.28g/cm³（25℃）的稀硫酸溶液；补充液面应加蒸馏水（或去离子水），不能加自来水。"},{"id":156,"oid":"D2-02","type":"judge","module":"汽车电子与电器维修","q":"蓄电池在放电过程中，正负极板上的活性物质逐渐转化为二氧化铅，电解液密度升高。","opts":[],"a":"×","e":"该说法错误。放电时正极板PbO2和负极板Pb都生成硫酸铅（PbSO4），并消耗硫酸，电解液密度下降；充电时过程相反，密度回升。可用密度判断蓄电池荷电状态。"},{"id":157,"oid":"D2-03","type":"single","module":"汽车电子与电器维修","q":"蓄电池自行放电过快、存电不足，最可能的内部原因是（　）。","opts":[{"k":"A","t":"电解液密度过高"},{"k":"B","t":"极板硫化或内部短路"},{"k":"C","t":"液面过高"},{"k":"D","t":"外壳破裂"}],"a":"B","e":"极板硫化、内部短路、电解液不纯都会加速自放电，表现为存放不久电压就明显下降、起动无力。应检查液面、密度和内部有无短路。"},{"id":158,"oid":"D2-04","type":"judge","module":"汽车电子与电器维修","q":"测量蓄电池端电压判断存电情况时，应在发动机运转状态下测量，此时读数最能反映蓄电池的实际存电。","opts":[],"a":"×","e":"该说法错误。发动机运转时发电机给蓄电池充电，端电压被充电电压抬高，不能真实反映存电；应在发动机不运转且蓄电池静置后测量，用高率放电计带负载测量更准确。"},{"id":159,"oid":"D2-05","type":"single","module":"汽车电子与电器维修","q":"汽车交流发电机由转子、（　）、整流器、前后端盖及电刷等组成。","opts":[{"k":"A","t":"定子"},{"k":"B","t":"换向器"},{"k":"C","t":"磁极"},{"k":"D","t":"集电环"}],"a":"A","e":"交流发电机由转子（磁场）、定子（电枢绕组）、整流器、端盖、电刷（滑环）等组成。转子绕组通电产生旋转磁场，定子绕组切割磁力线产生三相交流电。"},{"id":160,"oid":"D2-06","type":"single","module":"汽车电子与电器维修","q":"发电机在汽车上的主要作用是（　）。","opts":[{"k":"A","t":"起动发动机"},{"k":"B","t":"在发动机运转时向用电设备供电并向蓄电池充电"},{"k":"C","t":"产生点火高压"},{"k":"D","t":"驱动空调压缩机"}],"a":"B","e":"发动机运转后由发电机向全车用电设备供电，并给蓄电池充电，维持蓄电池电量；起动机用于起动发动机，点火线圈产生高压电。"},{"id":161,"oid":"D2-07","type":"judge","module":"汽车电子与电器维修","q":"用万用表电阻挡检测发电机定子绕组时，三相对中性点（星形连接）的电阻应基本相等，若某相电阻无穷大则说明该相断路。","opts":[],"a":"√","e":"星形连接的定子三相绕组应对称，各相绕组到中性点的电阻基本相等（约零点几欧）；阻值无穷大为断路，阻值过小或为零可能匝间短路或搭铁。"},{"id":162,"oid":"D2-08","type":"single","module":"汽车电子与电器维修","q":"汽车运行中充电指示灯常亮（不熄灭），说明（　）。","opts":[{"k":"A","t":"发电机不发电或充电电路故障"},{"k":"B","t":"蓄电池已充满"},{"k":"C","t":"大灯开启"},{"k":"D","t":"发动机转速过高"}],"a":"A","e":"充电指示灯由发电机中性点电压或调节器控制：发电机正常发电时指示灯熄灭，指示灯常亮说明发电机不发电（皮带断、调节器坏、转子断路等）或充电电路异常。"},{"id":163,"oid":"D2-09","type":"single","module":"汽车电子与电器维修","q":"汽车起动机由直流电动机、（　）和单向离合器（驱动机构）三部分组成。","opts":[{"k":"A","t":"传动机构"},{"k":"B","t":"整流器"},{"k":"C","t":"飞轮"},{"k":"D","t":"调节器"}],"a":"A","e":"起动机由直流串励电动机、传动机构（啮合机构，含单向离合器）和控制装置（电磁开关）组成，将电能转为机械能带动飞轮起动发动机。"},{"id":164,"oid":"D2-10","type":"single","module":"汽车电子与电器维修","q":"起动机单向离合器的作用是（　）。","opts":[{"k":"A","t":"起动时单向传递扭矩，发动机起动后自动打滑，防止飞轮带动电枢超速旋转"},{"k":"B","t":"增大起动扭矩"},{"k":"C","t":"降低起动电流"},{"k":"D","t":"改变电动机旋转方向"}],"a":"A","e":"单向离合器（滚柱式/摩擦片式）保证起动时单向传递扭矩（电动机→飞轮），发动机起动后自动打滑，防止飞轮带动电枢超速旋转而“飞散”损坏。"},{"id":165,"oid":"D2-11","type":"single","module":"汽车电子与电器维修","q":"接通起动开关后起动机只发出“咔”的一声或毫无反应，灯光明显变暗，最可能的原因是（　）。","opts":[{"k":"A","t":"蓄电池严重亏电或起动机内部短路"},{"k":"B","t":"点火开关接触不良"},{"k":"C","t":"起动机继电器线圈断路"},{"k":"D","t":"起动电路熔丝熔断"}],"a":"A","e":"灯光明显变暗说明起动电流很大，蓄电池亏电或起动机内部短路（如电刷搭铁、绕组短路）都会拉低电压；继电器断路、熔丝熔断时电流小、灯光不会明显变暗。"},{"id":166,"oid":"D2-12","type":"judge","module":"汽车电子与电器维修","q":"起动机运转无力且转速低，蓄电池正常时，应重点检查电刷磨损、换向器烧蚀和轴承（衬套）磨损等机械电气原因。","opts":[],"a":"√","e":"蓄电池正常而起动机无力，多因电刷过度磨损或弹簧弹力不足、换向器脏污烧蚀、绕组匝间短路、衬套磨损使电枢扫膛等，应分解检查起动机。"},{"id":167,"oid":"D2-13","type":"single","module":"汽车电子与电器维修","q":"传统（触点式）点火系统主要由点火线圈、分电器、火花塞和（　）等组成。","opts":[{"k":"A","t":"高压线"},{"k":"B","t":"喷油器"},{"k":"C","t":"起动继电器"},{"k":"D","t":"稳压器"}],"a":"A","e":"传统点火系由蓄电池、点火开关、点火线圈、断电器（触点）、配电器（分电器盖分火头）、高压线和火花塞组成，将低压电变为高压电并按点火顺序点火。"},{"id":168,"oid":"D2-14","type":"single","module":"汽车电子与电器维修","q":"火花塞的电极间隙过大会造成（　）。","opts":[{"k":"A","t":"点火电压要求升高，高速时易断火（失火）"},{"k":"B","t":"火花减弱"},{"k":"C","t":"点火提前角增大"},{"k":"D","t":"火花塞短路"}],"a":"A","e":"电极间隙过大需要更高的击穿电压，高速时次级电压下降易断火；间隙过小火花弱、易积炭短路。间隙应按规定调整（普通火花塞约0.6～1.3mm）。"},{"id":169,"oid":"D2-15","type":"judge","module":"汽车电子与电器维修","q":"电控点火系统用点火线圈直接（或经分电器）向火花塞提供高压电，其点火时刻由ECU根据发动机转速和负荷等信号精确控制。","opts":[],"a":"√","e":"电控（计算机）点火系统由ECU控制点火线圈初级电流的通断时刻，实现精确控制点火提前角，并具有爆燃控制等功能，取代了传统机械点火提前装置。"},{"id":170,"oid":"D2-16","type":"single","module":"汽车电子与电器维修","q":"某汽油机有一缸不工作，拔下该缸高压线做跳火试验火花正常，但装回后该缸仍不工作，最可能的原因是（　）。","opts":[{"k":"A","t":"火花塞损坏"},{"k":"B","t":"点火线圈损坏"},{"k":"C","t":"分电器盖裂纹"},{"k":"D","t":"蓄电池亏电"}],"a":"A","e":"高压线跳火正常说明点火能量充足、高压线路良好，装回后仍不工作则故障在火花塞本身（积炭、电极烧蚀、绝缘体击穿）或机械/供油问题，应拆检火花塞。"},{"id":171,"oid":"D2-17","type":"single","module":"汽车电子与电器维修","q":"汽车电路图中，表示搭铁（接地）的图形符号是（　）。","opts":[{"k":"A","t":"由长到短的横线汇聚的“伞形”符号"},{"k":"B","t":"一个圆圈"},{"k":"C","t":"一个箭头"},{"k":"D","t":"波浪线"}],"a":"A","e":"搭铁符号是几根由长到短的横线汇聚（呈“伞形”），表示该点与车身（电源负极）相连。汽车电器采用单线制，各用电设备通过搭铁形成回路。"},{"id":172,"oid":"D2-18","type":"judge","module":"汽车电子与电器维修","q":"汽车电路普遍采用双线制：每个用电设备都需两根导线分别连接电源正极和负极，不通过车身搭铁构成回路。","opts":[],"a":"×","e":"该说法错误。汽车电路普遍采用单线制：电源正极经导线连到各用电设备，负极通过车身搭铁构成回路，利用车身作公共负极可节省导线、简化线路。"},{"id":173,"oid":"D2-19","type":"single","module":"汽车电子与电器维修","q":"识读汽车电路图时，一般应先（　）。","opts":[{"k":"A","t":"找到电源，沿“电源→熔丝→开关→用电器→搭铁”的回路逐条分析"},{"k":"B","t":"从用电器向电源方向倒推"},{"k":"C","t":"只看线束颜色和插接器"},{"k":"D","t":"先查熔丝盒位置"}],"a":"A","e":"识读汽车电路图应先找到电源（蓄电池、发电机），沿“电源→熔丝→开关→用电器→搭铁”的回路逐条分析，弄清各用电设备的供电与控制关系。"},{"id":174,"oid":"D2-20","type":"single","module":"汽车电子与电器维修","q":"汽车前照灯（大灯）的远光灯丝位于反射镜（　）。","opts":[{"k":"A","t":"焦点处"},{"k":"B","t":"焦点上方"},{"k":"C","t":"焦点下方"},{"k":"D","t":"反射镜前方"}],"a":"A","e":"远光灯丝位于抛物面反射镜的焦点处，光线经反射后形成平行光束射向远方，照射距离远；近光灯丝位于焦点上方（偏前），光线经反射后向下偏折，防眩目。"},{"id":175,"oid":"D2-21","type":"single","module":"汽车电子与电器维修","q":"夜间行车对面来车时，应使用近光灯，其主要目的是（　）。","opts":[{"k":"A","t":"节约电能"},{"k":"B","t":"避免远光造成对方驾驶员眩目，保证会车安全"},{"k":"C","t":"延长灯泡寿命"},{"k":"D","t":"照亮路边行人"}],"a":"B","e":"远光灯光线平行强烈，会使对向驾驶员眩目引发事故；会车时切换近光，光束向下偏折，既照亮车前路面又不眩目，是交通法规和安全要求。"},{"id":176,"oid":"D2-22","type":"judge","module":"汽车电子与电器维修","q":"前照灯光束调整（灯光校准）时，应按规定将车停放在水平地面、轮胎气压正常，按车辆规定距离对光屏调整光束的照射位置和高度。","opts":[],"a":"√","e":"前照灯调整有严格条件：空载、水平地面、标准胎压，通过灯光检测仪或光屏按规定距离（通常10m）调整近光的明暗截止线位置和照射高度。"},{"id":177,"oid":"D2-23","type":"judge","module":"汽车电子与电器维修","q":"转向信号灯由制动灯开关控制而常亮，闪光器只用于控制危险报警灯（双闪）。","opts":[],"a":"×","e":"该说法错误。转向信号灯由闪光器控制按60～120次/分钟的频率闪烁，闪光器同时用于转向灯和危险报警灯；制动灯由制动灯开关控制常亮，与闪光器无关。"},{"id":178,"oid":"D2-24","type":"single","module":"汽车电子与电器维修","q":"踩下制动踏板时制动灯不亮，而灯泡完好，应首先检查（　）。","opts":[{"k":"A","t":"制动灯开关及其线路、熔丝"},{"k":"B","t":"发电机"},{"k":"C","t":"蓄电池电解液"},{"k":"D","t":"转向闪光器"}],"a":"A","e":"制动灯由制动灯开关控制，踩踏板闭合开关点亮制动灯。灯泡完好而不亮，重点查制动灯开关、熔丝和线路连接；若两侧都不亮基本为公共电路问题。"},{"id":179,"oid":"D2-25","type":"single","module":"汽车电子与电器维修","q":"汽车组合仪表中，燃油表、水温表等指示仪表通常由（　）传感器提供信号。","opts":[{"k":"A","t":"燃油液位（浮子变阻式）和水温（热敏电阻式）传感器"},{"k":"B","t":"车速传感器"},{"k":"C","t":"曲轴位置传感器"},{"k":"D","t":"氧传感器"}],"a":"A","e":"燃油表配油箱内燃油液位（浮子式变阻）传感器，水温表配发动机水温（热敏电阻式）传感器，仪表根据传感器电阻变化指示读数。"},{"id":180,"oid":"D2-26","type":"judge","module":"汽车电子与电器维修","q":"发动机运转中机油压力过低时，仪表盘上的机油压力报警灯会点亮报警，提醒驾驶员立即停车检查。","opts":[],"a":"√","e":"机油压力过低开关（传感器）在压力低于设定值时闭合，点亮报警灯，提示润滑系统异常，继续行驶可能造成烧瓦抱轴等严重故障。"},{"id":181,"oid":"D2-27","type":"single","module":"汽车电子与电器维修","q":"电动雨刮器一般由雨刮电动机、（　）和雨刮臂、刮片组成。","opts":[{"k":"A","t":"传动机构（蜗轮蜗杆减速及连杆）"},{"k":"B","t":"压缩机"},{"k":"C","t":"继电器"},{"k":"D","t":"真空泵"}],"a":"A","e":"雨刮器由永磁式雨刮电动机经蜗轮蜗杆减速并带动曲柄连杆机构，将旋转运动变为刮臂的往复摆动，实现刮水。雨刮电动机常为三速（低速/高速/间歇）。"},{"id":182,"oid":"D2-28","type":"judge","module":"汽车电子与电器维修","q":"雨刮器不工作但能听到电动机“嗡嗡”声，多为传动机构卡滞或连杆脱落，应断电检查，防止电动机烧毁。","opts":[],"a":"√","e":"电机转不动但通电会堵转发热，长时间可能烧毁电动机；应先断电，检查连杆铰接、球头是否脱落卡死、蜗轮蜗杆是否损坏。"},{"id":183,"oid":"D2-29","type":"judge","module":"汽车电子与电器维修","q":"电动车窗电动机只能单向旋转，车窗玻璃的升降依靠机械装置强制改变运动方向实现。","opts":[],"a":"×","e":"该说法错误。电动车窗电动机为永磁式直流电机，通过改变电枢电流方向即可实现正反转，再经齿轮减速和升降器带动玻璃上升或下降，并非只能单向旋转。"},{"id":184,"oid":"D2-30","type":"single","module":"汽车电子与电器维修","q":"中控门锁系统的作用是（　）。","opts":[{"k":"A","t":"集中控制全部车门锁止与开启"},{"k":"B","t":"只控制驾驶员车门"},{"k":"C","t":"仅用于防盗报警"},{"k":"D","t":"控制车窗升降"}],"a":"A","e":"中控门锁可集中控制全部车门锁止/开启：驾驶员操作一个开关即可同时锁止或开启所有车门，提高便利性与安全性，常与遥控钥匙联动。"},{"id":185,"oid":"D2-31","type":"single","module":"汽车电子与电器维修","q":"汽车音响系统一般由主机（收音机/CD/多媒体播放器）、功放和（　）组成。","opts":[{"k":"A","t":"扬声器（喇叭）"},{"k":"B","t":"压缩机"},{"k":"C","t":"发电机"},{"k":"D","t":"起动机"}],"a":"A","e":"汽车音响由音源主机（收音、CD、USB、蓝牙等）、功率放大器（或主机内置功放）和扬声器（喇叭）组成，可外加低音炮、天线等附件。"},{"id":186,"oid":"D3-01","type":"single","module":"汽车电子与电器维修","q":"汽车空调制冷系统的四大主要部件是压缩机、冷凝器、（　）和蒸发器。","opts":[{"k":"A","t":"膨胀阀（节流装置）"},{"k":"B","t":"干燥器"},{"k":"C","t":"鼓风机"},{"k":"D","t":"节温器"}],"a":"A","e":"制冷系统由压缩机、冷凝器、膨胀阀（节流装置）和蒸发器四大部件组成，其间以管路相连构成密封制冷循环，制冷剂（R134a）在其中循环流动。"},{"id":187,"oid":"D3-02","type":"judge","module":"汽车电子与电器维修","q":"空调压缩机将高温高压的气态制冷剂膨胀为低温低压液体，是制冷循环中的节流元件。","opts":[],"a":"×","e":"该说法错误。压缩机吸入蒸发器出口的低压气态制冷剂并压缩成高温高压气体送入冷凝器，是制冷循环的动力源（俗称空调“心脏”）；起节流降压作用的是膨胀阀。"},{"id":188,"oid":"D3-03","type":"single","module":"汽车电子与电器维修","q":"制冷循环中，制冷剂在蒸发器内发生的变化是（　）。","opts":[{"k":"A","t":"低压液态制冷剂蒸发吸热，使流过的空气降温"},{"k":"B","t":"高温高压气体冷凝放热"},{"k":"C","t":"制冷剂被压缩升压"},{"k":"D","t":"制冷剂节流降压"}],"a":"A","e":"高压低温液态制冷剂经膨胀阀节流降压后进入蒸发器，在蒸发器内低压蒸发（沸腾）吸热，吸收车厢内热量，使空气降温；气态制冷剂再被压缩机吸入。"},{"id":189,"oid":"D3-04","type":"single","module":"汽车电子与电器维修","q":"冷凝器的作用是（　）。","opts":[{"k":"A","t":"使高温高压气态制冷剂冷凝放热，变为高压液态制冷剂"},{"k":"B","t":"使液态制冷剂蒸发吸热"},{"k":"C","t":"储存制冷剂并过滤杂质"},{"k":"D","t":"调节制冷剂流量"}],"a":"A","e":"冷凝器（装在散热器前方）使高温高压气态制冷剂散热，冷凝为高压液态制冷剂，放出热量由迎面气流和冷却风扇带走。"},{"id":190,"oid":"D3-05","type":"single","module":"汽车电子与电器维修","q":"储液干燥器（干燥瓶）的作用是（　）。","opts":[{"k":"A","t":"储存制冷剂、过滤杂质并吸收系统水分"},{"k":"B","t":"节流降压"},{"k":"C","t":"压缩制冷剂"},{"k":"D","t":"加热制冷剂"}],"a":"A","e":"储液干燥器储存和补充制冷剂、过滤杂质，并通过干燥剂吸收系统中的水分，防止水分造成冰堵和腐蚀；视液镜可观察制冷剂流动状态。"},{"id":191,"oid":"D3-06","type":"judge","module":"汽车电子与电器维修","q":"膨胀阀安装在蒸发器入口处，通过节流降压使高压液态制冷剂变为低压低温状态，并随蒸发器出口过热变化自动调节制冷剂流量。","opts":[],"a":"√","e":"热力膨胀阀的感温包感知蒸发器出口温度，通过调节阀开度控制制冷剂流量，保证蒸发器出口有一定过热度，防止液态制冷剂回液损坏压缩机。"},{"id":192,"oid":"D3-07","type":"single","module":"汽车电子与电器维修","q":"传统燃油汽车暖风装置利用（　）作为热源，将空气加热后送入车厢。","opts":[{"k":"A","t":"发动机冷却液的余热"},{"k":"B","t":"排气余热"},{"k":"C","t":"空调制冷剂"},{"k":"D","t":"蓄电池电能"}],"a":"A","e":"传统燃油汽车暖风利用发动机冷却液的余热：冷却液流经暖风水箱（加热器芯）加热空气，由鼓风机送入车厢；电动车多采用PTC电加热。"},{"id":193,"oid":"D3-08","type":"judge","module":"汽车电子与电器维修","q":"空调配风系统通过风道和风门（模式风门、温度风门）将冷风或热风按除霜、吹面、吹脚等模式送到车厢不同位置。","opts":[],"a":"√","e":"空调箱内设多个风门（混风门、模式风门），由拉索或伺服电机驱动，按需分配气流方向（除霜/吹面/吹脚/双区等），实现出风模式与温度调节。"},{"id":194,"oid":"D3-09","type":"judge","module":"汽车电子与电器维修","q":"空调制冷剂R134a与早期使用的R12（氟利昂）不可混用，检修时应使用专用压力表和加注设备。","opts":[],"a":"√","e":"R134a与R12的接头规格、冷冻机油和密封件不同，混用会损坏系统；R12破坏臭氧层已被淘汰，检漏、回收、加注必须用专用设备。"},{"id":195,"oid":"D3-10","type":"single","module":"汽车电子与电器维修","q":"用歧管压力表（空调压力表组）判断系统状态时，发动机怠速、制冷正常时，低压侧压力一般为（　）。","opts":[{"k":"A","t":"0.15～0.25MPa"},{"k":"B","t":"0.5～0.7MPa"},{"k":"C","t":"1.3～1.6MPa"},{"k":"D","t":"2.0MPa以上"}],"a":"A","e":"R134a系统怠速制冷正常时低压侧约0.15～0.25MPa，高压侧约1.3～1.6MPa（环境温度影响）。低压过高、高压过低多为压缩机压缩不良；高低压均高多为制冷剂过多或冷凝不良。"},{"id":196,"oid":"D3-11","type":"single","module":"汽车电子与电器维修","q":"系统维修后加注制冷剂前，必须对系统进行（　）操作，否则水分和空气进入系统会造成冰堵、腐蚀和制冷不良。","opts":[{"k":"A","t":"抽真空（用真空泵排除系统内的水分和空气）"},{"k":"B","t":"直接加注"},{"k":"C","t":"检漏后直接加注"},{"k":"D","t":"排放系统内制冷剂"}],"a":"A","e":"系统维修后需用真空泵抽真空（通常抽真空至规定真空度并保持稳定），排出水分和空气，然后按规定量加注制冷剂；加注过量或不足都会影响制冷效果。"},{"id":197,"oid":"D3-12","type":"judge","module":"汽车电子与电器维修","q":"用电子检漏仪或荧光检漏法检查制冷系统泄漏点，是空调维修的常用手段；检漏应在系统有一定压力时进行。","opts":[],"a":"√","e":"系统带压力时检漏才能发现泄漏：电子检漏仪探头沿管路接头缓慢移动，荧光检漏则先注入荧光剂再用紫外灯观察。泄漏点应重点检查接头、轴封和软管。"},{"id":198,"oid":"D3-13","type":"single","module":"汽车电子与电器维修","q":"空调制冷不良，歧管压力表显示低压侧和高压侧压力都偏低，最可能的原因是（　）。","opts":[{"k":"A","t":"制冷剂不足（系统泄漏）"},{"k":"B","t":"制冷剂过多"},{"k":"C","t":"冷凝器堵塞"},{"k":"D","t":"蒸发器结霜"}],"a":"A","e":"高低压均偏低多为制冷剂不足（系统泄漏）所致，应检漏并按规定量补充制冷剂；制冷剂过多表现为高低压均偏高，冷凝不良表现为高压过高。"},{"id":199,"oid":"E1-01","type":"judge","module":"汽车维修工操作知识","q":"汽车维修车间应配备灭火器材，汽油、机油等易燃物品可以存放在车间作业区附近，便于随时取用。","opts":[],"a":"×","e":"该说法错误。汽油、机油等易燃物品必须存放在远离火源、通风良好的专用区域，不得堆放在作业区；车间按消防规定配置灭火器材，防止火灾事故。"},{"id":200,"oid":"E1-02","type":"single","module":"汽车维修工操作知识","q":"更换下来的废机油、废电池、废防冻液等属于（　），必须按环保规定分类收集处理。","opts":[{"k":"A","t":"一般生活垃圾"},{"k":"B","t":"危险废物（HW类）"},{"k":"C","t":"可回收普通废品"},{"k":"D","t":"建筑垃圾"}],"a":"B","e":"废机油、废电池、废制动液、废防冻液、含油棉纱等均属于危险废物，随意倾倒会污染土壤和水源，必须分类收集、交有资质单位处理。"},{"id":201,"oid":"E1-03","type":"single","module":"汽车维修工操作知识","q":"在烤漆房或喷漆作业中，除个人防护外，还应注意（　）。","opts":[{"k":"A","t":"关闭通风系统"},{"k":"B","t":"保持良好通风，防止油漆蒸气积聚引发火灾和中毒"},{"k":"C","t":"使用普通照明灯具"},{"k":"D","t":"打开门窗即可，无需其他措施"}],"a":"B","e":"油漆溶剂蒸气易燃易爆且有毒，喷漆作业必须保持通风排风，使用防爆灯具，佩戴防毒面具，避免蒸气积聚引发火灾、爆炸和职业中毒。"},{"id":202,"oid":"E1-04","type":"judge","module":"汽车维修工操作知识","q":"排放的废气（如发动机运转时）含有CO等有毒气体，维修车间应开启通风排气装置，避免长时间在密闭空间运转发动机。","opts":[],"a":"√","e":"发动机废气中的CO无色无味但毒性强，在密闭空间易致人中毒死亡。试车、诊断时须开启排风或把尾气管接到室外，严禁密闭空间长时间运转发动机。"},{"id":203,"oid":"E2-01","type":"single","module":"汽车维修工操作知识","q":"汽车修理中，将螺栓按规定力矩拧紧时，应使用（　）。","opts":[{"k":"A","t":"普通扳手"},{"k":"B","t":"扭力扳手"},{"k":"C","t":"套筒扳手"},{"k":"D","t":"活动扳手"}],"a":"B","e":"对缸盖螺栓、连杆螺栓等重要部位必须用扭力扳手按规定力矩分次拧紧，防止力矩不足或过大造成松动、变形和密封失效。"},{"id":204,"oid":"E2-02","type":"judge","module":"汽车维修工操作知识","q":"拆卸配合较紧的轴承、齿轮等过盈配合件时，可直接用锤子猛击零件，这样拆卸速度快、效率高。","opts":[],"a":"×","e":"该说法错误。过盈配合件应使用拉拔器（拉马）等专用工具沿轴向均匀施力拆卸，直接锤击会造成零件变形、破裂，还容易伤手，属违章作业。"},{"id":205,"oid":"E2-03","type":"single","module":"汽车维修工操作知识","q":"装配时对螺纹紧固件涂抹密封胶或螺纹锁固胶的目的不包括（　）。","opts":[{"k":"A","t":"防松"},{"k":"B","t":"密封防漏"},{"k":"C","t":"防止螺纹锈蚀咬死"},{"k":"D","t":"增加螺纹强度"}],"a":"D","e":"螺纹胶用于防松、密封和防锈，不会增加螺纹本身强度；螺纹强度由材料和尺寸决定。对关键部位应按维修手册要求使用指定胶品。"},{"id":206,"oid":"E2-04","type":"judge","module":"汽车维修工操作知识","q":"拆卸下来的零件应按拆装顺序和部位分类摆放，重要零件做好标记，防止装错和丢失，这也是文明生产的基本要求。","opts":[],"a":"√","e":"按顺序、按部位摆放零件并做标记（如各缸活塞、气门等），是保证装配正确的关键工艺要求，同时保持工位整洁（5S管理）。"},{"id":207,"oid":"E3-01","type":"single","module":"汽车维修工操作知识","q":"零件清洗时，应选用的清洗剂是（　）。","opts":[{"k":"A","t":"汽油"},{"k":"B","t":"专用金属清洗剂（或柴油、煤油）"},{"k":"C","t":"强酸溶液"},{"k":"D","t":"自来水"}],"a":"B","e":"应使用专用清洗剂或煤油、柴油清洗零件，汽油闪点低易燃且成本高、禁止大量使用；强酸会腐蚀零件。清洗后零件应干燥并防锈。"},{"id":208,"oid":"E3-02","type":"judge","module":"汽车维修工操作知识","q":"零件检验凭经验目测即可判断零件是否可用，无需对照维修手册的标准值和使用极限进行测量。","opts":[],"a":"×","e":"该说法错误。检验零件必须依据维修手册规定的标准值和使用极限（如轴颈圆度圆柱度、孔径、间隙等），用正确量具测量判断并做好记录，不能凭目测经验代替。"},{"id":209,"oid":"E3-03","type":"single","module":"汽车维修工操作知识","q":"发动机大修时，气缸体、曲轴等关键件在检验合格后，装配前必须（　）。","opts":[{"k":"A","t":"彻底清洗零件，特别是油道、水套内的金属屑和杂质必须清除干净"},{"k":"B","t":"直接装配，无需清洗"},{"k":"C","t":"只清洁零件外表面"},{"k":"D","t":"仅用压缩空气吹一遍即可"}],"a":"A","e":"关键件装配前必须彻底清洗，特别是油道、水套内的金属屑和杂质必须清除干净，否则会堵塞油道造成烧瓦等严重事故。"},{"id":210,"oid":"E3-04","type":"judge","module":"汽车维修工操作知识","q":"对有配合关系的零件（如轴与轴承、活塞与气缸）应成组选配、成对更换，以保证配合精度。","opts":[],"a":"√","e":"配合件应按公差分组选配（如活塞按分组选配到规定间隙），易损件（如轴瓦、油封）通常成套更换，避免新旧搭配造成配合不均。"},{"id":211,"oid":"E4-01","type":"single","module":"汽车维修工操作知识","q":"进行故障诊断时，正确的思路是（　）。","opts":[{"k":"A","t":"凭经验直接更换高价总成"},{"k":"B","t":"先问诊了解故障现象，再按由简到繁、由外到内的原则检测分析"},{"k":"C","t":"盲目拆检发动机"},{"k":"D","t":"先更换全部传感器"}],"a":"B","e":"故障诊断应遵循“先问后查、先简后繁、先外后内、先电后机”等原则，通过现象分析、检测验证逐步缩小范围，避免盲目换件和拆检。"},{"id":212,"oid":"E4-02","type":"judge","module":"汽车维修工操作知识","q":"电控发动机故障诊断时，应先读取故障码（DTC），再结合数据流和电路检测确认故障部位，故障码清除后还应路试验证。","opts":[],"a":"√","e":"电控诊断流程：读故障码→看数据流→测电路（电阻、电压、波形）→确认故障点→维修→清码→路试验证，避免只清码不维修造成故障复现。"},{"id":213,"oid":"E4-03","type":"single","module":"汽车维修工操作知识","q":"用万用表测量电路时，测量电压应（　），测量电流应（　）。","opts":[{"k":"A","t":"并联接入电路；串联接入电路"},{"k":"B","t":"串联接入电路；并联接入电路"},{"k":"C","t":"都并联接入"},{"k":"D","t":"都串联接入"}],"a":"A","e":"电压表内阻大，并联测量不影响电路；电流表内阻小，必须串联在回路中测量，否则会短路烧表。测量电阻时必须断电进行。"},{"id":214,"oid":"E4-04","type":"judge","module":"汽车维修工操作知识","q":"发动机“起动困难”故障诊断时，应首先拆检发动机内部零件，无需检查蓄电池电压和燃油供给情况。","opts":[],"a":"×","e":"该说法错误。起动困难的原因涉及电、油、机多方面，应系统排查：先查电源（蓄电池电压、搭铁）、燃油（油量、压力、喷射），再查点火和压缩（缸压、正时），先简后繁，不能盲目拆检。"},{"id":215,"oid":"E5-01","type":"judge","module":"汽车维修工操作知识","q":"新车交付前的PDI（售前检查）包括外观检查、功能检查、油液检查、轮胎气压和紧固件检查等项目。","opts":[],"a":"√","e":"PDI（Pre-Delivery Inspection）是新车交付前的标准检查流程，覆盖外观、灯光、油液、轮胎、蓄电池、紧固件及各功能项目，确保车辆交付状态良好。"},{"id":216,"oid":"E5-02","type":"single","module":"汽车维修工操作知识","q":"新车走合期（磨合期）内，正确的使用要求是（　）。","opts":[{"k":"A","t":"高速满载长时间行驶，尽快磨合"},{"k":"B","t":"控制车速和负荷，避免超载和猛加速、急制动"},{"k":"C","t":"不更换机油"},{"k":"D","t":"添加抗磨剂代替磨合"}],"a":"B","e":"走合期内应控制发动机转速和车速、避免满载超载和急加速急制动，按规定里程更换机油，使配合表面逐步磨合，延长使用寿命。"},{"id":217,"oid":"E5-03","type":"single","module":"汽车维修工操作知识","q":"新车（或大修车）在交付使用前，还应对（　）进行专门检查，防止运输或存放期间松动。","opts":[{"k":"A","t":"底盘螺栓、轮胎螺母、蓄电池接线等紧固件"},{"k":"B","t":"音响系统"},{"k":"C","t":"空调滤芯"},{"k":"D","t":"车身漆面"}],"a":"A","e":"新车经运输存放，底盘螺栓、轮胎螺母、蓄电池接线等可能松动，交付前应按规定力矩复紧关键紧固件，并检查各油液液位。"},{"id":218,"oid":"E6-01","type":"judge","module":"汽车维修工操作知识","q":"日常维护（例行保养）由维修技师在车辆定期进厂时进行，主要内容是更换机油和机油滤清器。","opts":[],"a":"×","e":"该说法错误。日常维护由驾驶员在出车前、行车中、收车后进行，主要内容是清洁、检查、补给和紧固；定期更换机油及滤清器属于定期维护项目。"},{"id":219,"oid":"E6-02","type":"single","module":"汽车维修工操作知识","q":"出车前检查发动机机油液位，正确的方法是（　）。","opts":[{"k":"A","t":"冷车（或停机数分钟后）拔出机油尺擦净再插入，拔出观察油位在上下限之间"},{"k":"B","t":"热车立即拔尺观察"},{"k":"C","t":"只要有机油就行"},{"k":"D","t":"加满到油尺上限以上"}],"a":"A","e":"机油尺检查应在发动机熄火后静置数分钟（或冷车）进行，使机油回落到油底壳，油位应在油尺上下刻度之间，不足补充、过多会增大阻力并引起烧机油。"},{"id":220,"oid":"E6-03","type":"judge","module":"汽车维修工操作知识","q":"行车中若发现仪表报警（水温、机油压力、充电等），应立即安全停车检查，不可继续强行行驶。","opts":[],"a":"√","e":"水温过高、机油压力过低等报警灯点亮说明发动机处于危险状态，继续行驶可能造成拉缸、烧瓦等严重损坏，应停车熄火排查后再行驶。"},{"id":221,"oid":"E7-01","type":"single","module":"汽车维修工操作知识","q":"我国汽车维护制度中，定期维护分为日常维护、（　）和二级维护三个等级。","opts":[{"k":"A","t":"一级维护"},{"k":"B","t":"走合维护"},{"k":"C","t":"季节性维护"},{"k":"D","t":"换季维护"}],"a":"A","e":"按GB/T 18344《汽车维护、检测、诊断技术规范》，汽车维护分日常维护、一级维护和二级维护。一级维护以清洁、润滑、紧固为主；二级维护以检查、调整为主。"},{"id":222,"oid":"E7-02","type":"single","module":"汽车维修工操作知识","q":"一级维护的中心内容是（　）。","opts":[{"k":"A","t":"清洁、润滑、紧固"},{"k":"B","t":"检测调整各总成"},{"k":"C","t":"更换全部易损件"},{"k":"D","t":"大修发动机"}],"a":"A","e":"一级维护以清洁、润滑、紧固为中心：清洗滤清器、检查补充油液、按规定润滑部位加注润滑脂、紧固各连接螺栓，并检查电气和制动。"},{"id":223,"oid":"E7-03","type":"single","module":"汽车维修工操作知识","q":"二级维护作业中，除一级维护项目外，重点应（　）。","opts":[{"k":"A","t":"检查调整发动机、制动系、转向系、行驶系等各总成的工作状况"},{"k":"B","t":"只更换机油"},{"k":"C","t":"只清洗车身"},{"k":"D","t":"只检查轮胎气压"}],"a":"A","e":"二级维护以检查、调整为中心：检测调整发动机、制动系、转向系、行驶系各总成的工作状况，检查调整气门间隙、制动间隙、前束等，并更换规定油液滤芯。"},{"id":224,"oid":"E7-04","type":"judge","module":"汽车维修工操作知识","q":"定期更换机油及机油滤清器是发动机保养的基本项目，更换周期应遵循车辆维修手册的规定，并同时更换放油螺塞垫片。","opts":[],"a":"√","e":"机油在高温下会氧化变质、添加剂消耗，必须按手册周期（通常5000～10000km或半年～一年）更换机油和滤芯，并更换放油螺塞垫片防漏。"},{"id":225,"oid":"E8-01","type":"judge","module":"汽车维修工操作知识","q":"拆装发动机气缸盖螺栓时，应按由两端向中间、一次性全部松开或拧紧的顺序操作。","opts":[],"a":"×","e":"该说法错误。缸盖螺栓必须按“由中间向两端、分2～3次”的顺序拧紧（拆卸方向相反），防止缸盖翘曲变形和密封不严，最终按规定的力矩拧紧。"},{"id":226,"oid":"E8-02","type":"single","module":"汽车维修工操作知识","q":"安装油封（骨架油封）时，正确的做法是（　）。","opts":[{"k":"A","t":"检查唇口无损伤，装配面涂润滑油（脂），用专用工具均匀压入"},{"k":"B","t":"直接用力敲入"},{"k":"C","t":"不涂油直接压入"},{"k":"D","t":"用锤子猛击油封外圈"}],"a":"A","e":"安装油封前检查唇口无损伤，装配面涂少量润滑油（脂），用专用压入工具均匀压入，使油封与座孔垂直，防止偏斜、变形导致漏油。"},{"id":227,"oid":"E8-03","type":"judge","module":"汽车维修工操作知识","q":"拆装正时带（链）前，应核对曲轴和凸轮轴的正时标记，拆下后转动曲轴前必须确认气门不与活塞干涉。","opts":[],"a":"√","e":"正时带（链）拆装必须对正标记，安装时保证曲轴、凸轮轴正时关系正确；未装正时带时不得随意转动曲轴，防止活塞顶气门造成损坏。"},{"id":228,"oid":"A1-032","type":"judge","module":"汽车概论与机械基础","q":"传统汽车的电气设备主要由电源和用电设备两大部分组成，普遍采用低压直流供电、负极搭铁。","opts":[],"a":"√","e":"传统汽车电气设备由电源（蓄电池、发电机）和用电设备组成，采用12V或24V低压直流电，普遍负极搭铁；正极搭铁会腐蚀机件，故不采用。"},{"id":229,"oid":"A1-033","type":"judge","module":"汽车概论与机械基础","q":"发动机是汽车的动力装置，其作用是使燃料燃烧并将热能转化为机械能对外输出。","opts":[],"a":"√","e":"发动机将燃料化学能经燃烧变为热能，再通过曲柄连杆机构转化为曲轴旋转的机械能，是传统汽车的动力来源。"},{"id":230,"oid":"A1-034","type":"judge","module":"汽车概论与机械基础","q":"汽车底盘中的行驶系由车架（或车身）、车桥、悬架和车轮组成，用于支承汽车总质量并保证正常行驶。","opts":[],"a":"√","e":"行驶系由车架（或承载式车身）、车桥、悬架和车轮四部分组成，承受整车质量、传递力和力矩，保证行驶平顺与操纵稳定。"},{"id":231,"oid":"A1-035","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车没有发动机，也没有传统的多挡变速器和排气系统。","opts":[],"a":"√","e":"纯电动汽车以动力电池和驱动电机为动力，取消了发动机、多挡变速器和排气净化与消声系统，一般只配固定速比减速器。"},{"id":232,"oid":"A1-036","type":"judge","module":"汽车概论与机械基础","q":"新能源汽车是指采用非常规车用燃料作为动力来源的汽车，纯电动汽车属于新能源汽车。","opts":[],"a":"√","e":"新能源汽车包括纯电动、插电式混合动力、燃料电池等，以电能等非常规能源驱动；传统汽油、柴油车属内燃机汽车。"},{"id":233,"oid":"A1-037","type":"judge","module":"汽车概论与机械基础","q":"混合动力汽车（HEV）必须外接充电，其动力电池容量较大，可纯电行驶较长距离。","opts":[],"a":"×","e":"该说法错误。油电混动HEV不能外接充电，动力电池容量较小，靠发动机和回收制动能量充电；可外接充电、大容量电池的是插电混动PHEV。"},{"id":234,"oid":"A1-038","type":"judge","module":"汽车概论与机械基础","q":"插电式混合动力汽车（PHEV）既可外接充电、纯电行驶，电量不足时又可由发动机驱动或发电。","opts":[],"a":"√","e":"PHEV装有发动机、驱动电机和可外接充电的大容量动力电池，短途纯电、长途混动，兼顾纯电经济与燃油续驶。"},{"id":235,"oid":"A1-039","type":"judge","module":"汽车概论与机械基础","q":"燃料电池汽车（FCEV）行驶过程中直接向大气排放二氧化碳和水。","opts":[],"a":"×","e":"该说法错误。燃料电池车上氢气与氧气反应只生成水，不排放CO、HC和CO2；排放二氧化碳的是燃烧化石燃料的内燃机汽车。"},{"id":236,"oid":"A1-040","type":"judge","module":"汽车概论与机械基础","q":"驱动电机是纯电动汽车的动力装置，可将动力电池的电能转化为机械能驱动车轮。","opts":[],"a":"√","e":"驱动电机在电机控制器（MCU）控制下把动力电池直流电逆变为三相交流电，输出转矩，经减速器驱动车轮。"},{"id":237,"oid":"A1-041","type":"judge","module":"汽车概论与机械基础","q":"纯电动汽车上的DC/DC转换器用于把动力电池的高压直流电变换为低压直流电，为12V用电设备供电并给低压蓄电池充电。","opts":[],"a":"√","e":"动力电池为高压直流，不能直接供12V设备；DC/DC将高压降至低压，代替传统车上发电机向低压系统供电。"},{"id":238,"oid":"A1-042","type":"judge","module":"汽车概论与机械基础","q":"车载充电机（OBC）的作用是把交流充电桩输出的交流电变换为直流电，为动力电池充电。","opts":[],"a":"√","e":"交流充电桩只输出交流电，必须经车载充电机OBC整流为直流，并按BMS要求为动力电池充电；直流快充桩则省去OBC。"},{"id":239,"oid":"A1-043","type":"judge","module":"汽车概论与机械基础","q":"增程式电动汽车在动力电池电量充足时由发动机直接驱动车轮，电量不足时才由驱动电机驱动。","opts":[],"a":"×","e":"该说法错误。增程车全程由驱动电机驱动车轮，发动机只带动发电机发电给电池或供电动机，发动机并不直接驱动车轮。"},{"id":240,"oid":"A1-044","type":"judge","module":"汽车概论与机械基础","q":"传统燃油汽车的暖风主要利用发动机冷却液余热，而纯电动汽车多采用PTC电加热器取暖。","opts":[],"a":"√","e":"燃油车靠冷却液经暖风水箱加热空气；纯电动车无发动机余热，常用PTC电加热或热泵空调采暖。"},{"id":241,"oid":"A1-045","type":"judge","module":"汽车概论与机械基础","q":"与传统燃油汽车相比，纯电动汽车取消了发动机、变速器和排气系统，但仍保留12V低压蓄电池。","opts":[],"a":"√","e":"纯电动车取消发动机、排气等，高压系统经DC/DC供电；但保留12V蓄电池为控制器和低压设备供电，仍需它上下电。"},{"id":242,"oid":"A1-046"
