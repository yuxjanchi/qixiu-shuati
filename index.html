<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汽修刷题系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F4C81'/%3E%3Cpath d='M18 38l6-16h16l6 16-14 10z' fill='%23E8EEF4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%230F4C81'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#12202F; --body:#3E4C5C;
  --primary:#0B5FA5; --primary-2:#0F8BFF; --primary-soft:#E4F0FB;
  --accent:#F47A1E; --accent-soft:#FEF0E2;
  --ok:#16A34A; --ok-soft:#E7F6EC; --bad:#DC2626; --bad-soft:#FDEBEA;
  --muted:#8A94A6; --line:#E4E9F0;
  --m1:#3B82C4; --m2:#D9763B; --m3:#2F9E8F; --m4:#7A6FA6; --m5:#A68B4E;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(18,32,47,.05), 0 6px 20px rgba(18,32,47,.06);
  --shadow-lg:0 4px 10px rgba(18,32,47,.08), 0 16px 40px rgba(18,32,47,.10);
}
body.dark{
  --bg:#0F1620; --surface:#182230; --ink:#E8EDF4; --body:#B7C2D1; --line:#273547;
  --primary:#5BA3EC; --primary-2:#7FC0FF; --primary-soft:#1C3A55;
  --accent:#F79A4E; --accent-soft:#3A2A18;
  --ok:#4ADE80; --ok-soft:#12331F; --bad:#F87171; --bad-soft:#3A1B1B;
  --muted:#7C8AA0;
  --m1:#6FA9E0; --m2:#E8975F; --m3:#5FBFB0; --m4:#A89BDF; --m5:#C9B06E;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.30);
  --shadow-lg:0 4px 10px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,var(--bg) 0%,#E7EDF5 100%);color:var(--body);line-height:1.6;font-size:16px;transition:background .25s,color .25s}
body.dark{background:linear-gradient(180deg,#0F1620 0%,#131C28 100%)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* 布局 */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body.dark .topbar{background:rgba(24,34,48,.86)}
.topbar-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(11,95,165,.35)}
.brand-name{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
.top-nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.nav-btn{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--body);display:flex;align-items:center;gap:6px;min-height:40px;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--primary-soft)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px}
.theme-btn{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--body);flex:0 0 40px;transition:background .15s}
.theme-btn:hover{background:var(--primary-soft)}
.theme-btn svg{width:19px;height:19px}
@media (max-width:640px){
  .brand-sub{display:none}
  .nav-btn span{display:none}
  .nav-btn{width:46px;justify-content:center}
  .theme-btn{width:38px;flex-basis:38px}
}

main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:20px 16px 96px}
.view-title{font-size:23px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:.3px}
.view-desc{color:var(--muted);font-size:14px;margin-bottom:18px}

/* Hero 统计 */
.hero{background:linear-gradient(135deg,var(--primary) 0%,#0E7BC8 55%,var(--primary-2) 100%);border-radius:var(--radius);padding:22px 20px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(11,95,165,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:60px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .h-title{font-size:19px;font-weight:800;margin-bottom:2px}
.hero .h-sub{font-size:13px;opacity:.85;margin-bottom:16px}
.hero .h-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:1}
@media (max-width:520px){.hero .h-stats{grid-template-columns:repeat(2,1fr)}}
.hero .h-stat{padding:10px 12px;background:rgba(255,255,255,.14);border-radius:10px;backdrop-filter:blur(4px)}
.hero .h-num{font-size:24px;font-weight:800;line-height:1.15}
.hero .h-num small{font-size:12px;font-weight:600;opacity:.85}
.hero .h-label{font-size:11.5px;opacity:.9;margin-top:2px}

/* 卡片与统计 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:box-shadow .2s}
.card + .card{margin-top:14px}
.card-hover:hover{box-shadow:var(--shadow-lg)}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media (min-width:768px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2}
.stat-num small{font-size:13px;font-weight:400;color:var(--muted)}
.stat-label{font-size:13px;color:var(--muted);margin-top:2px}
.stat.ok .stat-num{color:var(--ok)}
.stat.bad .stat-num{color:var(--bad)}
.stat.fav .stat-num{color:var(--accent)}

/* 筛选器 */
.filter-block{margin-bottom:10px}
.filter-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.filter-title svg{width:15px;height:15px;color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--body);min-height:38px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{border-color:var(--primary)}
.chip.on{border-color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(11,95,165,.3)}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* 模式卡 */
.mode-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.mode-grid{grid-template-columns:repeat(3,1fr)}}
.mode-card{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.mode-card .mode-name{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.mode-card .mode-name svg{width:18px;height:18px;color:var(--primary)}
.mode-card.exam .mode-name svg{color:var(--accent)}
.mode-card .mode-desc{font-size:13px;color:var(--muted);flex:1}
.mode-card .mode-count{font-size:12px;color:var(--primary);font-weight:700}
.mode-card.exam .mode-count{color:var(--accent)}
.mode-card .badge-new{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;font-size:15px;font-weight:700;transition:background .15s,transform .05s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 3px 10px rgba(11,95,165,.3)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#F9A03F);color:#fff;box-shadow:0 3px 10px rgba(244,122,30,.3)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--body)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-ok{background:var(--ok);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 刷题视图 */
.quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.quiz-progress{flex:1;min-width:140px;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .25s}
.quiz-count{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.exam-timer{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exam-timer.warn{color:#fff;background:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.tag.type-judge{background:var(--m1)}
.tag.type-single{background:var(--m2)}
.tag.type-multi{background:var(--m3)}
.tag.type-short{background:var(--m4)}
.tag.type-case{background:var(--m5)}
.tag.module{background:var(--primary-soft);color:var(--primary);font-weight:700}

.q-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;transition:background .25s}
.q-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.7}
.q-title .q-no{color:var(--primary);margin-right:6px}
.q-title .q-case-title{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.q-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.q-title-row .q-title{flex:1;margin-bottom:0}
.star-btn{flex:0 0 40px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.star-btn:hover{background:var(--accent-soft)}
.star-btn.on{color:var(--accent)}
.star-btn svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:15px;line-height:1.5;transition:border-color .15s,background .15s}
.opt .opt-key{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.opt:hover{border-color:var(--primary)}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-key{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-key{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line)}

.judge-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge-btn{min-height:64px;font-size:17px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);transition:all .15s}
.judge-btn:hover{border-color:var(--primary);background:var(--primary-soft)}
.judge-btn.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.judge-btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;display:none;animation:fbIn .25s ease}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#14532D}
body.dark .feedback.ok{color:#86EFAC}
.feedback.bad{background:var(--bad-soft);color:#7B1F17}
body.dark .feedback.bad{color:#FCA5A5}
.feedback .fb-title{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.feedback .fb-explain{font-size:14px;line-height:1.7}
.feedback .fb-explanation{margin-top:10px;font-size:14px;color:var(--body);background:rgba(255,255,255,.6);border-radius:8px;padding:10px 12px}
body.dark .feedback .fb-explanation{background:rgba(255,255,255,.05)}
.fb-actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}

/* 案例/简答参考答案 */
.answer-panel{margin-top:16px;border:1.5px dashed var(--primary);border-radius:10px;padding:14px 16px;background:var(--primary-soft)}
.answer-panel .ap-title{font-weight:800;color:var(--primary);margin-bottom:6px}
.answer-panel .ap-text{font-size:14px;line-height:1.8}

.quiz-nav{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.quiz-nav .spacer{flex:1}

/* 答题卡 */
.sheet-wrap{margin-top:16px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sheet-head h3{font-size:15px;color:var(--ink)}
.sheet-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:700px){.sheet-grid{grid-template-columns:repeat(10,1fr)}}
.sheet-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);min-height:38px;transition:transform .1s}
.sheet-cell:hover{transform:scale(1.08)}
.sheet-cell.now{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.sheet-cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheet-cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet-cell.fav{outline:2px solid var(--accent);outline-offset:-2px}

/* 结果页 */
.done-hero{text-align:center;padding:30px 16px 20px}
.done-hero .score{font-size:52px;font-weight:800;color:var(--primary);line-height:1.1}
.done-hero .score small{font-size:18px;font-weight:600}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto}
.done-stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.done-stat .d-num{font-size:22px;font-weight:800;color:var(--ink)}
.done-stat .d-label{font-size:12px;color:var(--muted)}

/* 掌握度统计 */
.mastery{display:flex;flex-direction:column;gap:12px}
.mastery-row{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:10px}
@media (max-width:520px){.mastery-row{grid-template-columns:96px 1fr 48px}}
.mastery-name{font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mastery-bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.mastery-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#4ADE80);transition:width .4s}
.mastery-bar i.low{background:linear-gradient(90deg,var(--bad),#F87171)}
.mastery-bar i.mid{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.mastery-val{font-size:12.5px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.mastery-none{font-size:13px;color:var(--muted);text-align:center;padding:8px}

/* 成绩历史 */
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.hist-score{flex:0 0 62px;font-size:22px;font-weight:800;color:var(--primary)}
.hist-info{flex:1;min-width:0}
.hist-meta{font-size:13px;color:var(--body)}
.hist-time{font-size:12px;color:var(--muted);margin-top:2px}
.hist-rate{font-size:13px;font-weight:700;color:var(--ok)}
.hist-empty{font-size:13px;color:var(--muted);text-align:center;padding:10px}

/* 错题本 */
.wrong-list{display:flex;flex-direction:column;gap:10px}
.wrong-item{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);transition:box-shadow .15s}
.wrong-item:hover{box-shadow:var(--shadow-lg)}
.wrong-item .wi-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wrong-item .wi-q{font-size:15px;color:var(--ink);flex:1}
.wrong-item .wi-go{margin-top:8px;display:flex;gap:8px;align-items:center}
.wi-star{color:var(--muted);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.wi-star.on{color:var(--accent)}
.wi-star svg{width:18px;height:18px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:15px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;color:var(--line);display:block}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底部导航(移动) */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);min-height:56px;transition:color .15s}
.bottom-nav a.active{color:var(--primary);font-weight:700}
.bottom-nav svg{width:22px;height:22px}
@media (min-width:768px){.bottom-nav{display:none}}

@media (max-width:640px){
  main{padding:16px 12px 88px}
  .q-title{font-size:16px}
  .opt{font-size:14px;padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

/* 功能宫格 */
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:420px){.icon-grid{grid-template-columns:repeat(4,1fr)}}
.icon-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;font-size:12px;color:var(--body);border-radius:12px;transition:background .15s,transform .15s;min-height:86px;min-width:0}
.icon-item:hover{background:var(--primary-soft)}
.icon-item:active{transform:scale(.95)}
.icon-box{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 10px rgba(18,32,47,.14);flex:0 0 46px}
.icon-box svg{width:23px;height:23px}
.icon-box.bl{background:linear-gradient(135deg,#3B82C4,#0F8BFF)}
.icon-box.or{background:linear-gradient(135deg,#F47A1E,#F9A03F)}
.icon-box.gr{background:linear-gradient(135deg,#16A34A,#4ADE80)}
.icon-box.pu{background:linear-gradient(135deg,#7A6FA6,#A89BDF)}
.icon-box.cy{background:linear-gradient(135deg,#2F9E8F,#5FBFB0)}
.icon-box.te{background:linear-gradient(135deg,#0B5FA5,#5BA3EC)}
.icon-box.rd{background:linear-gradient(135deg,#DC2626,#F87171)}
.icon-box.gy{background:linear-gradient(135deg,#64748B,#94A3B8)}
.badge-mini{display:inline-block;font-size:9px;font-weight:700;background:var(--accent);color:#fff;padding:1px 5px;border-radius:999px;margin-left:2px;vertical-align:1px}

/* 快速练习行 */
.quick-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.quick-row{grid-template-columns:repeat(4,1fr)}}
.quick-btn{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s}
.quick-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.quick-btn .qk-name{font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.quick-btn .qk-name svg{width:16px;height:16px;color:var(--primary)}
.quick-btn .qk-sub{font-size:11.5px;color:var(--muted)}

/* 搜索页 */
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-input{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:16px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--primary)}
.search-input::placeholder{color:var(--muted)}
.search-result{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.search-result .sr-q{font-size:15px;color:var(--ink);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-result .sr-ans{font-size:12.5px;color:var(--muted);margin-top:4px}

/* 报告页 */
.report-head{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(11,95,165,.25)}
.report-head .rh-score{font-size:42px;font-weight:800;line-height:1.1}
.report-head .rh-sub{font-size:13px;opacity:.85;margin-top:4px}
.tip-box{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--body);margin-top:14px;margin-bottom:14px}

/* 结构化解析卡片 */
.explain-card{margin-top:8px;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.75;color:var(--body)}
.expl-pt{background:rgba(11,95,165,.08);border-left:3px solid var(--primary)}
.expl-an{background:rgba(255,255,255,.72);border-left:3px solid #94A3B8}
.expl-warn{background:rgba(244,122,30,.10);border-left:3px solid #F47A1E}
body.dark .expl-an{background:rgba(255,255,255,.05)}
.explain-tag{display:inline-block;font-weight:800;margin-right:6px}
.expl-pt .explain-tag{color:var(--primary)}
.expl-warn .explain-tag{color:#F47A1E}
</style>
</head>

<script>
"use strict";
/* 数据在构建时注入 */
const QUESTIONS = [{"id": 1, "oid": "A1-01", "type": "single", "module": "汽车概论与机械基础", "q": "传统汽车通常由四大组成部分构成，下列不属于汽车四大组成部分的是（　）。", "opts": [{"k": "A", "t": "发动机"}, {"k": "B", "t": "底盘"}, {"k": "C", "t": "车身"}, {"k": "D", "t": "空调系统"}], "a": "D", "e": "【考点】传统汽车的四大组成部分及各总成归属。\n【解析】传统汽车的四大组成部分是发动机、底盘、车身和电气设备：发动机提供动力，底盘负责传递动力和行驶、转向、制动，车身承载乘员与货物，电气设备负责供电和用电。空调系统虽然装在车上，但它只是电气设备中的附属用电装置，不是与四大组成部分并列的独立总成，所以选D。\n【易错】容易凭“空调系统很大、很独立”的感觉误选，判断时要牢记“四大组成”是固定说法，附属装置（空调、音响、电动车窗等）都归在电气设备内。"}, {"id": 2, "oid": "A1-02", "type": "judge", "module": "汽车概论与机械基础", "q": "纯电动汽车以动力蓄电池为能源，以驱动电机为动力装置，同时仍保留一台小型发动机和排气系统用于应急供电。", "opts": [], "a": "×", "e": "【考点】纯电动汽车（BEV）的能源与动力结构。\n【解析】纯电动汽车的能量完全来自动力蓄电池，动力完全由驱动电机提供，因此它没有发动机，也就没有排气系统。题干说“保留一台小型发动机和排气系统用于应急供电”，这是增程式或插电混动汽车的结构，不属于纯电动汽车，判断为×。\n【易错】把增程式、插电混动、纯电动三种车型混为一谈。记口诀：纯电=电池+电机（无发动机）；增程=发动机只发电不驱动车轮；插混=发动机和电机都能驱动车轮。"}, {"id": 3, "oid": "A1-03", "type": "single", "module": "汽车概论与机械基础", "q": "混合动力汽车（HEV）与纯电动汽车（BEV）的主要区别在于（　）。", "opts": [{"k": "A", "t": "混合动力汽车没有动力电池"}, {"k": "B", "t": "混合动力汽车同时具有发动机和电动机两套动力源"}, {"k": "C", "t": "纯电动汽车以发动机为主要动力"}, {"k": "D", "t": "混合动力汽车不能回收制动能量"}], "a": "B", "e": "【考点】混合动力汽车（HEV）与纯电动汽车（BEV）的结构区别。\n【解析】HEV同时装备发动机和电动机两套动力源，可以单独或联合驱动车轮；BEV只有动力电池和驱动电机，没有发动机。A、C明显错误（HEV有动力电池、BEV不以发动机为动力）；D也错误，因为HEV同样回收制动能量。所以B正确。\n【易错】误以为“混合动力=有发动机+没有电池”，实际HEV必有动力电池（电量较小），区别在“同时具备两套动力源”。"}, {"id": 4, "oid": "A1-04", "type": "judge", "module": "汽车概论与机械基础", "q": "增程式电动汽车在行驶中完全由驱动电机提供动力，发动机只用于带动发电机发电，不直接驱动车轮。", "opts": [], "a": "√", "e": "【考点】增程式电动汽车的驱动方式。\n【解析】增程式电动汽车的发动机只带动发电机发电（为电池充电或直接供电给电机），不直接驱动车轮；车轮始终由驱动电机带动。题干表述完全符合增程式的工作特点，判断为√。\n【易错】容易把增程式与插电混动混淆：增程式的发动机永远不直接驱动车轮，而插电混动在高速等工况下发动机可以直接驱动车轮。一句话记：增程=发动机“发电不驱动”，插混=发动机“既能发电又能驱动”。"}, {"id": 5, "oid": "A1-05", "type": "single", "module": "汽车概论与机械基础", "q": "根据GB/T 3730.1的规定，汽车按用途分为乘用车和（　）两大类。", "opts": [{"k": "A", "t": "客车"}, {"k": "B", "t": "货车"}, {"k": "C", "t": "商用车"}, {"k": "D", "t": "专用车"}], "a": "C", "e": "【考点】汽车按用途的分类标准（GB/T 3730.1）。\n【解析】按GB/T 3730.1—2001，汽车按用途首先分为乘用车和商用车两大类：乘用车主要用于载运乘客及随身行李（9座以下）；商用车用于运送人员和货物，包括客车、货车、半挂牵引车、专用车等。所以与“乘用车”并列的大类只能是C商用车。\n【易错】看到“客车、货车、专用车”都是具体车型名称，容易误选。注意它们是商用车下面的小类，不是与乘用车并列的一级分类。"}, {"id": 6, "oid": "A1-06", "type": "single", "module": "汽车概论与机械基础", "q": "车辆识别代号（VIN）由17位字符组成，其中表示车辆制造厂和国际、地区代码的是（　）。", "opts": [{"k": "A", "t": "第1～3位（WMI）"}, {"k": "B", "t": "第4～9位（VDS）"}, {"k": "C", "t": "第10位"}, {"k": "D", "t": "第12～17位（VIS）"}], "a": "A", "e": "【考点】车辆识别代号（VIN）的构成及各段含义。\n【解析】VIN共17位，分三段：第1～3位是世界制造厂识别代号WMI，标明制造厂、国家和地理区域；第4～9位是车辆说明部分VDS，表示车辆类型、发动机、车身形式等特征；第10～17位是车辆指示部分VIS，其中第10位为生产年份、第11位为装配厂。题目问“表示制造厂和国家地区”，对应第1～3位WMI，选A。\n【易错】年份在第10位（VIS段内）而非常见的第一位；VDS是第4～9位，不要与WMI混淆。"}, {"id": 7, "oid": "A1-07", "type": "judge", "module": "汽车概论与机械基础", "q": "同一辆车的VIN在世界范围内30年内不得重号，其中第10位表示车辆的生产年份。", "opts": [], "a": "√", "e": "【考点】VIN的唯一性要求与第10位含义。\n【解析】VIN在全球范围内具有唯一性，按标准要求，同一制造厂在30年内生产的车辆VIN不得重号，用于车辆识别与追溯。VIN第10位按规定表示生产年份（用数字或字母循环编码），第11位表示装配厂。题干两句话都正确，判断为√。\n【易错】年份编码是循环使用的（数字0～9和字母，不含I、O、Q），不要误以为第10位就是年份的阿拉伯数字直读；同时注意年份编码字母与数字的对应关系需查表。"}, {"id": 8, "oid": "A1-08", "type": "single", "module": "汽车概论与机械基础", "q": "在维修作业中核对车辆识别代号（VIN），其主要作用是（　）。", "opts": [{"k": "A", "t": "确定车辆外观颜色"}, {"k": "B", "t": "唯一识别车辆身份，便于查询车型配置、生产年份及维修资料"}, {"k": "C", "t": "确定轮胎气压标准"}, {"k": "D", "t": "判断车辆是否年检"}], "a": "B", "e": "【考点】维修作业中VIN的实际用途。\n【解析】VIN是车辆唯一的“身份证”。维修时核对VIN，可准确查得车型、生产年份、产地、发动机型号、配置等级等，从而选择正确的配件、维修资料和诊断数据，避免张冠李戴。A、C、D（颜色、胎压、年检）都与VIN的主要用途无关，选B。\n【易错】容易把“核对VIN”理解为看外观或查年检。牢记VIN的核心作用是“身份识别+资料匹配”，这是维修管理的第一步。"}, {"id": 9, "oid": "A1-09", "type": "single", "module": "汽车概论与机械基础", "q": "汽车的最高车速、加速时间和最大爬坡度属于汽车的（　）。", "opts": [{"k": "A", "t": "动力性参数"}, {"k": "B", "t": "经济性参数"}, {"k": "C", "t": "制动性参数"}, {"k": "D", "t": "操纵稳定性参数"}], "a": "A", "e": "【考点】汽车动力性评价指标。\n【解析】汽车动力性指汽车在良好路面上直线行驶时由汽车受到的纵向外力决定的、所能达到的平均行驶速度，用三个指标评价：最高车速、加速时间（含起步加速和超车加速）、最大爬坡度。它们共同反映汽车克服行驶阻力的能力，属于动力性参数，选A。\n【易错】加速时间、最高车速容易误归到“操纵稳定性”，区别：凡与“跑得快不快、爬坡行不行”有关的都是动力性；与经济性（油耗）、制动性（刹车距离）、操纵稳定性（操控）区分开。"}, {"id": 10, "oid": "A1-10", "type": "single", "module": "汽车概论与机械基础", "q": "汽车的外廓尺寸不包括下列哪一项（　）。", "opts": [{"k": "A", "t": "车长"}, {"k": "B", "t": "车宽"}, {"k": "C", "t": "轴距"}, {"k": "D", "t": "车高"}], "a": "C", "e": "【考点】汽车外廓尺寸与结构参数的区分。\n【解析】外廓尺寸指限定车辆外部轮廓的尺寸，包括车长（前后最外点距离）、车宽（左右最外点距离）、车高（地面到最高点距离），是决定车辆能否通过道路、车库的依据。轴距是前轴与后轴中心线之间的距离，属于影响稳定性和转弯半径的重要结构参数，但不属于外廓尺寸，所以选C。\n【易错】轴距、轮距、离地间隙都容易与外廓尺寸混在一起。记住：外廓尺寸只有长、宽、高三个“外形”参数；轴距等属于“内部结构”参数。"}, {"id": 11, "oid": "A1-11", "type": "judge", "module": "汽车概论与机械基础", "q": "轴距越长，车辆转弯所需的最小转弯半径越小，机动性越好。", "opts": [], "a": "×", "e": "【考点】轴距与转弯半径、机动性的关系。\n【解析】最小转弯半径指转向时前外轮中心轨迹的最小半径。轴距越长，汽车转弯时需要扫过的空间越大，最小转弯半径越大，通过狭窄弯道越困难，机动性越差。题干说“轴距越长转弯半径越小、机动性越好”，与事实相反，判断为×。\n【易错】把“轴距长=稳”和“轴距长=好转弯”混淆。可这样记：轴距长→更稳（行驶稳定性好）但更笨（转弯半径大、机动性差）；轴距短→灵活但稳定性差。"}, {"id": 12, "oid": "A1-12", "type": "single", "module": "汽车概论与机械基础", "q": "汽车整备质量是指（　）。", "opts": [{"k": "A", "t": "汽车满载时的总质量"}, {"k": "B", "t": "汽车按规定加足冷却液、燃油并带齐随车工具，未载人载货时的质量"}, {"k": "C", "t": "汽车出厂时的最大允许质量"}, {"k": "D", "t": "汽车各总成质量之和"}], "a": "B", "e": "【考点】整备质量与最大总质量的区别。\n【解析】整备质量（空车质量）指汽车加足冷却液、润滑油、燃油，带齐备胎和随车工具，但未载人载货时的质量。它反映汽车的基本“体重”，用于计算载质量、推重比等。A是满载总质量，C是最大允许总质量，D表述不完整，只有B定义准确，选B。\n【易错】“整备”≠“满载”：整备质量是空车状态，最大总质量是满载状态，两者相差的正是载人和载货的能力（载质量）。"}, {"id": 13, "oid": "A1-13", "type": "single", "module": "汽车概论与机械基础", "q": "活塞在气缸内运动，活塞顶距离曲轴回转中心最远时的位置称为（　）。", "opts": [{"k": "A", "t": "上止点"}, {"k": "B", "t": "下止点"}, {"k": "C", "t": "压缩行程终点"}, {"k": "D", "t": "工作行程起点"}], "a": "A", "e": "【考点】上止点、下止点的定义。\n【解析】活塞在气缸内往复运动，活塞顶离曲轴回转中心最远（活塞位置最高）时叫上止点，最近（位置最低）时叫下止点。上止点和下止点是计算行程、工作容积的基础，选A。压缩行程终点、工作行程起点不是固定的“位置名称”，只是过程节点。\n【易错】“上止点”指位置不是时刻：判断时只看活塞顶与曲轴中心的距离——最远=上止点、最近=下止点。另外注意上止点不是“最高转速点”。"}, {"id": 14, "oid": "A1-14", "type": "single", "module": "汽车概论与机械基础", "q": "活塞从上止点运动到下止点所扫过的空间容积称为（　）。", "opts": [{"k": "A", "t": "气缸总容积"}, {"k": "B", "t": "燃烧室容积"}, {"k": "C", "t": "气缸工作容积"}, {"k": "D", "t": "发动机排量"}], "a": "C", "e": "【考点】气缸工作容积（单缸排量）的定义。\n【解析】活塞从上止点运动到下止点所扫过的空间容积叫气缸工作容积（单缸排量）。气缸总容积=工作容积+燃烧室容积；燃烧室容积是活塞在上止点时活塞顶上方的空间。题目问的是“扫过的容积”，选C。\n【易错】三个容积易混：①工作容积——活塞扫过的（最大-最小之间）；②燃烧室容积——上止点上方剩余空间；③总容积=①+②。压缩比=总容积÷燃烧室容积。"}, {"id": 15, "oid": "A1-15", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机排量等于各气缸工作容积之和，排量越大，发动机单次循环做功能力一般越弱。", "opts": [], "a": "×", "e": "【考点】发动机排量的定义及与动力性的关系。\n【解析】排量=气缸工作容积×气缸数，表示发动机每循环理论吸入的混合气总体积。排量越大，每次循环能吸入和燃烧的混合气越多，产生的能量越大，发动机的动力性越好。题干说“排量越大做功能力一般越弱”，与事实相反，判断为×。\n【易错】把“排量大=油耗高”记成“排量大=动力弱”。正确理解：排量是衡量发动机“肺活量”的指标，肺活量越大，吸得多烧得多，动力越强（同时油耗也高）。"}, {"id": 16, "oid": "A1-16", "type": "single", "module": "汽车概论与机械基础", "q": "压缩比是指（　）的比值。", "opts": [{"k": "A", "t": "气缸总容积与燃烧室容积"}, {"k": "B", "t": "气缸工作容积与燃烧室容积"}, {"k": "C", "t": "气缸总容积与工作容积"}, {"k": "D", "t": "燃烧室容积与气缸工作容积"}], "a": "A", "e": "【考点】压缩比的定义及影响。\n【解析】压缩比=气缸总容积÷燃烧室容积，表示气体在气缸内被压缩的程度。压缩比越大，压缩终了气体温度压力越高，做功能力越强、热效率越高；但压缩比过大会引起爆燃（不正常燃烧），所以汽油机压缩比有一定限度。选A。\n【易错】分子分母记反：压缩比是“总容积”比“燃烧室容积”，不是工作容积比燃烧室容积。记法：压缩比描述的是把混合气“压缩”到什么程度——总容积（最大空间）÷燃烧室容积（最小空间）。"}, {"id": 17, "oid": "A1-17", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程汽油机一个工作循环中，各行程的先后顺序是（　）。", "opts": [{"k": "A", "t": "进气、做功、压缩、排气"}, {"k": "B", "t": "进气、压缩、做功、排气"}, {"k": "C", "t": "压缩、进气、做功、排气"}, {"k": "D", "t": "进气、压缩、排气、做功"}], "a": "B", "e": "【考点】四冲程汽油机的工作循环顺序。\n【解析】四冲程汽油机一个工作循环包含四个行程，顺序固定：进气行程（吸入混合气）→压缩行程（压缩混合气）→做功行程（点火燃烧膨胀）→排气行程（排出废气）。曲轴转两圈（720°）完成一个循环。选B。\n【易错】四个行程顺序记不住时可这样联想：先“吸气”再“捏紧”（压缩），然后“点火爆发”（做功），最后“吐气”（排气），即进、压、功、排。"}, {"id": 18, "oid": "A1-18", "type": "single", "module": "汽车概论与机械基础", "q": "四冲程汽油机在做功行程中，火花塞点火后，气缸内进行的能量转换是（　）。", "opts": [{"k": "A", "t": "机械能转化为热能"}, {"k": "B", "t": "热能转化为机械能"}, {"k": "C", "t": "化学能直接转化为机械能"}, {"k": "D", "t": "电能转化为机械能"}], "a": "B", "e": "【考点】做功行程中的能量转换。\n【解析】做功行程中，火花塞点燃混合气，燃烧产生高温高压燃气，气体膨胀推动活塞下行，把燃料燃烧的化学能→热能→活塞的机械能，再经连杆和曲轴变成旋转力矩输出。所以本行程的能量转换是“热能转化为机械能”，选B。\n【易错】容易选“化学能直接转化为机械能”，实际上燃烧先变成热能（高温高压燃气），再由气体膨胀把热能变成机械能，中间必须经过热能这一环节。"}, {"id": 19, "oid": "A1-19", "type": "single", "module": "汽车概论与机械基础", "q": "柴油机与汽油机在工作原理上的主要区别是（　）。", "opts": [{"k": "A", "t": "柴油机没有压缩行程"}, {"k": "B", "t": "柴油机采用压燃方式，混合气在气缸内靠压缩自燃"}, {"k": "C", "t": "柴油机只有一个行程"}, {"k": "D", "t": "柴油机使用火花塞点火"}], "a": "B", "e": "【考点】柴油机与汽油机着火方式的区别。\n【解析】柴油机压缩比高，压缩终了气缸内温度（可达500℃以上）高于柴油自燃点，喷入的柴油自行着火，这种着火方式叫压燃，柴油机没有火花塞；汽油机靠火花塞电火花点燃混合气，叫点燃。选B。\n【易错】易误选“柴油机有火花塞”或“柴油机只压缩不燃烧”。记住一句话：汽油机“点”着（火花塞点燃），柴油机“压”着（压缩自燃）——汽油机火花塞点火、柴油机喷油器喷油压燃。"}, {"id": 20, "oid": "A1-20", "type": "judge", "module": "汽车概论与机械基础", "q": "四冲程发动机中，做功、进气、压缩、排气四个行程都能自行完成，不需要任何外力带动曲轴。", "opts": [], "a": "×", "e": "【考点】四冲程发动机四个行程的能量来源。\n【解析】四冲程发动机只有做功行程是由燃气膨胀推动活塞、对外输出动力的；进气、压缩、排气三个行程都需要外界提供能量来推动曲轴，这些能量来自飞轮储存的转动惯量（以及多缸发动机中其他缸的做功）。若没有飞轮，单缸发动机无法自行完成循环。题干说“四个行程都能自行完成”，判断为×。\n【易错】误以为四个行程都能自己产生动力。记法：只有“做功”是出力行程，其余三个都是“耗能”行程，靠飞轮惯性“带飞”完成。"}, {"id": 21, "oid": "A1-21", "type": "single", "module": "汽车概论与机械基础", "q": "发动机的曲柄连杆机构由机体组、活塞连杆组和（　）三部分组成。", "opts": [{"k": "A", "t": "配气机构"}, {"k": "B", "t": "曲轴飞轮组"}, {"k": "C", "t": "冷却系统"}, {"k": "D", "t": "润滑系统"}], "a": "B", "e": "【考点】曲柄连杆机构的组成。\n【解析】曲柄连杆机构是发动机将活塞往复运动变为曲轴旋转运动的机构，由三部分组成：机体组（气缸体、气缸盖等）、活塞连杆组（活塞、活塞环、活塞销、连杆等）和曲轴飞轮组（曲轴、飞轮等）。缺一不可，选B。\n【易错】配气机构、冷却系、润滑系都是独立的系统，容易混入。判断标准：凡与“活塞上下动变曲轴转”直接相关的零件才属于曲柄连杆机构。"}, {"id": 22, "oid": "A1-22", "type": "single", "module": "汽车概论与机械基础", "q": "汽车底盘一般由传动系、行驶系、转向系和（　）四大系统组成。", "opts": [{"k": "A", "t": "制动系"}, {"k": "B", "t": "冷却系"}, {"k": "C", "t": "点火系"}, {"k": "D", "t": "起动系"}], "a": "A", "e": "【考点】汽车底盘的组成。\n【解析】汽车底盘是整车的骨架与行走部分，由四大系统组成：传动系（离合器、变速器、传动轴等）、行驶系（车架、车轮、悬架等）、转向系（转向器、转向节等）和制动系（制动器、制动传动装置等）。选A。\n【易错】点火系、起动系属于发动机电气设备，冷却系属于发动机冷却系统，都不属于底盘。记住底盘“四系”：传、行、转、制。"}, {"id": 23, "oid": "A1-23", "type": "judge", "module": "汽车概论与机械基础", "q": "汽车电气设备由电源和用电设备两大部分组成，采用低压直流电，负极搭铁。", "opts": [], "a": "√", "e": "【考点】汽车电气设备的组成与电气特点。\n【解析】汽车电气设备由电源（蓄电池、发电机）和用电设备（起动系、点火系、照明、信号、仪表等）两大部分组成，采用低压直流电（汽油车多为12V，柴油车多为24V），普遍采用“负极搭铁”（车身作负极公共回路）。题干表述正确，判断为√。\n【易错】注意“负极搭铁”是负极接车身，正极经导线供电；接反会烧坏用电设备。另外混合动力/纯电动的高压系统是例外，但低压电气设备仍负极搭铁。"}, {"id": 24, "oid": "A1-24", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车的三大核心系统通常不包括（　）。", "opts": [{"k": "A", "t": "动力蓄电池系统"}, {"k": "B", "t": "驱动电机系统"}, {"k": "C", "t": "电控系统"}, {"k": "D", "t": "冷却液循环系统"}], "a": "D", "e": "【考点】纯电动汽车三大核心系统。\n【解析】纯电动汽车的三大核心系统是：动力蓄电池系统（储能）、驱动电机系统（动力输出）、整车电控系统（电池管理BMS、电机控制MCU、整车控制VCU等）。冷却液循环系统只是电池/电机的辅助热管理部件，不属于三大核心系统，选D。\n【易错】“电池、电机、电控”是纯电车的三大件（类似燃油车的发动机、底盘、车身），背熟这六个字。冷却、空调等辅助系统不要混入。"}, {"id": 25, "oid": "A1-25", "type": "single", "module": "汽车概论与机械基础", "q": "动力蓄电池的容量单位是（　）。", "opts": [{"k": "A", "t": "千瓦（kW）"}, {"k": "B", "t": "千瓦时（kWh）"}, {"k": "C", "t": "伏特（V）"}, {"k": "D", "t": "安培（A）"}], "a": "B", "e": "【考点】动力蓄电池容量的单位。\n【解析】动力蓄电池容量表示电池储存电能的能力，单位是千瓦时（kWh），1kWh就是俗称的“1度电”。千瓦（kW）是功率单位，表示做功快慢；伏特（V）是电压单位；安培（A）是电流单位。题目问容量单位，选B。\n【易错】kW与kWh只差一个“h”：kW（功率，表示“多快”）、kWh（能量，表示“多少”）。电池容量说“多少度电”用kWh。"}, {"id": 26, "oid": "A1-26", "type": "judge", "module": "汽车概论与机械基础", "q": "交流充电桩（慢充）输出的是直流电，可以直接为动力电池充电，无需经过车载充电机。", "opts": [], "a": "×", "e": "【考点】交流充电桩（慢充）的工作原理。\n【解析】交流充电桩输出的是交流电，动力电池只能充直流电，因此交流电必须先经车载充电机（OBC）整流变换为直流电，再在电池管理系统（BMS）控制下充入电池。题干说“输出直流电、无需车载充电机”，判断为×。\n【易错】直流快充桩才直接输出直流电给电池；交流慢充桩输出交流电必须经过OBC。一句话：慢充过OBC，快充不过OBC。"}, {"id": 27, "oid": "A1-27", "type": "single", "module": "汽车概论与机械基础", "q": "纯电动汽车的高压系统工作电压一般在（　）以上，作业时必须遵守高压安全操作规程。", "opts": [{"k": "A", "t": "12V"}, {"k": "B", "t": "24V"}, {"k": "C", "t": "60V（直流）"}, {"k": "D", "t": "380V（交流）"}], "a": "C", "e": "【考点】新能源汽车高压系统界定与安全。\n【解析】按行业安全规范，新能源汽车高压系统一般指直流60V以上（或交流30V以上）的回路；实际动力电池工作电压多为300～800V，远高于人体安全电压，属于高压危险回路，作业必须先断电。选C。\n【易错】容易误选380V交流（那是工业三相电）或12/24V（那是低压）。高压判定线是直流60V/交流30V，记住这两个数字。"}, {"id": 28, "oid": "A1-28", "type": "single", "module": "汽车概论与机械基础", "q": "对纯电动汽车进行维修作业前，第一步应当（　）。", "opts": [{"k": "A", "t": "直接拆解电池包"}, {"k": "B", "t": "断开低压蓄电池负极，再断开高压维修开关（下电）"}, {"k": "C", "t": "用普通万用表测量高压线"}, {"k": "D", "t": "先启动车辆确认故障"}], "a": "B", "e": "【考点】纯电动汽车维修安全下电顺序。\n【解析】高压维修第一步是“下电”并确认无电：先断开12V低压蓄电池负极，使高压接触器断电；再断开高压维修开关（或拔维修插头）；按规范等待高压电容放电（一般需数分钟）；用电压表确认高压回路无电后，才可开始作业。选B。\n【易错】顺序不能颠倒：必须先断低压再断高压（否则高压系统无法可靠泄放）；严禁直接拆电池包、用普通表测高压、先启动车辆。安全顺序是考点核心。"}, {"id": 29, "oid": "A1-29", "type": "judge", "module": "汽车概论与机械基础", "q": "在对新能源汽车高压部件作业时，应佩戴绝缘手套并选用带绝缘护套的工具，同时穿绝缘鞋。", "opts": [], "a": "√", "e": "【考点】高压作业的个人防护装备。\n【解析】在新能源汽车高压部件上作业，必须佩戴经检验合格的绝缘手套（且套上护套防止刺穿）、使用带绝缘护套的工具、穿绝缘鞋，必要时佩戴护目镜，避免人体形成电流通路造成触电。题干表述正确，判断为√。\n【易错】普通线手套无绝缘作用；绝缘手套要定期耐压检测、用前检查破损。防护是实操考核重点，安全第一。"}, {"id": 30, "oid": "A1-30", "type": "single", "module": "汽车概论与机械基础", "q": "按车身承载方式分类，轿车普遍采用的是（　）。", "opts": [{"k": "A", "t": "非承载式车身"}, {"k": "B", "t": "承载式车身"}, {"k": "C", "t": "半承载式车身"}, {"k": "D", "t": "框架式车身"}], "a": "B", "e": "【考点】承载式与非承载式车身。\n【解析】承载式车身把车架与车身壳体做成一个整体，由车身承受全部载荷，没有独立车架，质量轻、重心低、乘坐舒适性好，是现代轿车普遍采用的形式；非承载式有独立车架（车身装在大梁上），强度大，多用于货车、越野车。选B。\n【易错】“承载”指的是车身自己承受载荷（无独立车架）；非承载式才有“大梁”。轿车=承载式，卡车/越野=非承载式。"}, {"id": 31, "oid": "A1-31", "type": "judge", "module": "汽车概论与机械基础", "q": "车身壳体是车身的基础件，包括发动机罩、车门、翼子板等都属于车身外部覆盖件。", "opts": [], "a": "√", "e": "【考点】车身壳体与覆盖件的组成。\n【解析】车身由车身壳体（基础件）、覆盖件、内外饰件和附件组成。覆盖件包括发动机罩、车门、翼子板、行李厢盖等，它们不承受主要载荷，主要起覆盖、保护和美观作用。题干表述正确，判断为√。\n【易错】注意“覆盖件不承受主要载荷”这个细节——它只是“皮肤”，受力靠壳体骨架。判断题常考覆盖件与结构件的载荷区分。"}, {"id": 32, "oid": "A2-01", "type": "single", "module": "汽车概论与机械基础", "q": "机械制图中，表示零件不可见轮廓线应采用的线型是（　）。", "opts": [{"k": "A", "t": "粗实线"}, {"k": "B", "t": "细虚线"}, {"k": "C", "t": "细点画线"}, {"k": "D", "t": "波浪线"}], "a": "B", "e": "【考点】机械制图基本线型的应用（GB/T 4457.4）。\n【解析】按国家标准：可见轮廓线用粗实线；不可见轮廓线用细虚线；对称中心线和轴线用细点画线；断裂边界线用波浪线或双折线。题目问“不可见轮廓线”，选B细虚线。\n【易错】线型对应关系要背熟：粗实线=看得见的边；细虚线=看不见的边；细点画线=中心/对称轴；波浪线=断裂处。虚线“断断续续”正好暗示“看不见”。"}, {"id": 33, "oid": "A2-02", "type": "judge", "module": "汽车概论与机械基础", "q": "机械图样中的尺寸以毫米（mm）为单位时，图样上必须标注单位符号“mm”。", "opts": [], "a": "×", "e": "【考点】机械图样尺寸单位的规定。\n【解析】按国家标准，机械图样中标注的尺寸数字默认以毫米（mm）为单位，此时不需要在数字后标注“mm”；只有当尺寸采用其他单位（如英寸）时，才必须标注单位符号。题干说“必须标注mm”，判断为×。\n【易错】这是常见判断题陷阱：默认mm不需标注，只有非mm单位才标注。另外尺寸数字是“实际尺寸”而非绘图比例尺寸。"}, {"id": 34, "oid": "A2-03", "type": "single", "module": "汽车概论与机械基础", "q": "三视图的投影规律是（　）。", "opts": [{"k": "A", "t": "长对正、高平齐、宽相等"}, {"k": "B", "t": "长相等、高对正、宽平齐"}, {"k": "C", "t": "长平齐、高相等、宽对正"}, {"k": "D", "t": "三者无固定对应关系"}], "a": "A", "e": "【考点】三视图的投影规律。\n【解析】三视图指主视图（正面）、俯视图（上面）、左视图（左面）。投影规律三句话：主视图与俯视图“长对正”（长度方向对齐）；主视图与左视图“高平齐”（高度方向对齐）；俯视图与左视图“宽相等”（宽度方向一致）。选A。\n【易错】“长、高、宽”的对应关系易乱。记法：长=左右方向（主↔俯）；高=上下方向（主↔左）；宽=前后方向（俯↔左）。"}, {"id": 35, "oid": "A2-04", "type": "judge", "module": "汽车概论与机械基础", "q": "直线上任意两点的投影连线若不在投影线上，则直线的投影仍可由该两点的投影确定。", "opts": [], "a": "√", "e": "【考点】直线的投影性质。\n【解析】直线是点的集合，直线上任意两点的投影确定后，连接这两点的投影，即可得到整条直线的投影（两点确定一条直线）。题干表述符合投影原理，判断为√。\n【易错】题目措辞“若不在投影线上”其实不影响结论：无论两点位置如何，投影连线就是直线的投影。直线投影仍为直线（特殊位置可能是点或积聚线）。"}, {"id": 36, "oid": "A2-05", "type": "single", "module": "汽车概论与机械基础", "q": "圆柱体在主视图和俯视图中的投影分别是（　）。", "opts": [{"k": "A", "t": "矩形和圆"}, {"k": "B", "t": "圆和矩形"}, {"k": "C", "t": "矩形和矩形"}, {"k": "D", "t": "圆和圆"}], "a": "A", "e": "【考点】圆柱体的三视图投影。\n【解析】圆柱体轴线竖直放置时：主视图（正面看）投影是矩形（圆柱侧面轮廓），俯视图（从上看）投影是圆（上下端面圆），左视图（侧面看）也是矩形。题目问主视图和俯视图，分别是矩形和圆，选A。\n【易错】容易把主、俯视图搞反。想象看一个直立的罐头：正面看是长方形，从上面看是圆形——主视矩形、俯视圆。"}, {"id": 37, "oid": "A2-06", "type": "single", "module": "汽车概论与机械基础", "q": "识读零件图时，要弄清零件的形状结构，首先应当分析（　）。", "opts": [{"k": "A", "t": "尺寸标注"}, {"k": "B", "t": "视图表达方案，找出主视图及各视图的对应关系"}, {"k": "C", "t": "标题栏材料"}, {"k": "D", "t": "表面粗糙度符号"}], "a": "B", "e": "【考点】识读零件图的方法步骤。\n【解析】识读零件图应先看标题栏（名称、材料、比例等），再分析视图表达方案：找出主视图，理清各视图间的投影对应关系，逐步想象出零件的整体形状结构，最后再读尺寸标注和技术要求。题目问“首先应当分析什么”，选B。\n【易错】容易选“先看尺寸”或“先看标题栏”。正确顺序：标题栏→视图（找主视、看对应）→想象形状→尺寸→技术要求。视图分析是弄清形状结构的第一步。"}, {"id": 38, "oid": "A2-07", "type": "single", "module": "汽车概论与机械基础", "q": "汽油的牌号（如92号、95号）表示的是汽油的（　）。", "opts": [{"k": "A", "t": "十六烷值"}, {"k": "B", "t": "辛烷值"}, {"k": "C", "t": "密度"}, {"k": "D", "t": "粘度"}], "a": "B", "e": "【考点】汽油牌号与辛烷值。\n【解析】汽油的牌号（92号、95号、98号）按研究法辛烷值（RON）划分：数字越大，辛烷值越高，抗爆性越好，越不易发生爆燃。高压缩比、涡轮增压发动机应使用高牌号汽油。选B。\n【易错】辛烷值（汽油抗爆性）与十六烷值（柴油自燃性）方向相反：汽油怕“自燃”（爆燃）所以要抗爆（高辛烷值）；柴油要“好自燃”所以要高十六烷值。两个值别记混。"}, {"id": 39, "oid": "A2-08", "type": "single", "module": "汽车概论与机械基础", "q": "评价柴油自燃性能（着火性）的指标是（　）。", "opts": [{"k": "A", "t": "辛烷值"}, {"k": "B", "t": "十六烷值"}, {"k": "C", "t": "闪点"}, {"k": "D", "t": "凝点"}], "a": "B", "e": "【考点】柴油自燃性的评价指标。\n【解析】柴油的着火（自燃）性能用十六烷值评价：十六烷值越高，柴油越容易自燃、燃烧越平稳、起动越容易；十六烷值过低会引起工作粗暴（敲缸）。辛烷值是汽油抗爆性指标，两者别混淆。选B。\n【易错】“汽油辛烷值、柴油十六烷值”成对记忆。柴油机是压燃，希望柴油“一点就着”=高十六烷值；汽油机怕爆燃，希望汽油“难自燃”=高辛烷值。"}, {"id": 40, "oid": "A2-09", "type": "single", "module": "汽车概论与机械基础", "q": "发动机润滑油（机油）黏度等级中的“W”表示（　）。", "opts": [{"k": "A", "t": "高温黏度"}, {"k": "B", "t": "冬季（低温）黏度等级"}, {"k": "C", "t": "润滑油的质量等级"}, {"k": "D", "t": "润滑油的密度"}], "a": "B", "e": "【考点】润滑油SAE黏度等级的含义。\n【解析】SAE黏度等级中带“W”的（5W、10W、15W等）表示冬季（低温）黏度等级，W取Winter的首字母，数字越小表示低温流动性越好、冷起动越容易；不带W的数字（30、40等）表示高温（100℃）黏度等级，数字越大高温黏度越大。选B。\n【易错】“5W-30”中的“5W”是低温性能（越小越耐寒），“30”是高温性能（越大越黏）。W≠质量等级（质量看API的SJ/SL/SM等）。"}, {"id": 41, "oid": "A2-10", "type": "judge", "module": "汽车概论与机械基础", "q": "发动机润滑油中，添加剂可以弥补和改善基础油性能方面的不足，如抗磨剂、清净分散剂等。", "opts": [], "a": "√", "e": "【考点】发动机润滑油的组成与添加剂作用。\n【解析】发动机润滑油由基础油和添加剂两部分组成：基础油提供基本润滑性能，添加剂用于改善和弥补基础油的不足，主要包括清净分散剂（清除积炭油泥）、抗磨剂（减少磨损）、抗氧化剂、防锈防腐剂、降凝剂等。题干表述正确，判断为√。\n【易错】不要以为“添加剂=造假”，添加剂是正规配方的重要组成部分，决定机油的档次和综合性能。考题常问“添加剂的种类与作用”。"}, {"id": 42, "oid": "B1-01", "type": "judge", "module": "汽车发动机维修", "q": "发动机刚停机时温度很高，可以立即打开散热器盖，因为此时冷却系统已自动泄压，不会喷出高温蒸汽。", "opts": [], "a": "×", "e": "【考点】发动机冷却系统热态安全操作。\n【解析】发动机刚停机时，冷却液温度很高（可达90℃以上甚至更高），冷却系统内保持一定压力，冷却液沸点相应升高。此时若立即打开散热器盖，高压高温蒸汽会猛然喷出造成严重烫伤，因此必须等发动机冷却、系统泄压后，再缓慢拧开散热器盖。题干说“已自动泄压、不会喷出”，判断为×。\n【易错】高温开盖=烫伤事故，是安全操作必考点。正确做法：等冷却→用手帕垫着缓慢拧盖放气→完全泄压后再打开。"}, {"id": 43, "oid": "B1-02", "type": "single", "module": "汽车发动机维修", "q": "在车间内起动发动机进行检查时，正确的做法是（　）。", "opts": [{"k": "A", "t": "在密闭车间长时间运转，不开排风"}, {"k": "B", "t": "将档位挂入前进挡并拉紧手刹起动"}, {"k": "C", "t": "确认变速器置于空挡或驻车挡，拉紧手刹，并开启排风装置"}, {"k": "D", "t": "用导线直接短接起动继电器试车"}], "a": "C", "e": "【考点】车间内起动发动机的安全操作规范。\n【解析】起动前必须确认变速器在空挡（自动挡在P挡）并拉紧手刹，防止起动瞬间车辆窜动；同时开启排风装置排出尾气。A密闭不开排风会一氧化碳中毒，B挂前进挡起动危险，D短接继电器是违章操作，故选C。\n【易错】“空挡+手刹+排风”三步缺一不可：空挡防窜车、手刹防溜车、排风防中毒。短接起动继电器属于严重违章，考试和实操都禁止。"}, {"id": 44, "oid": "B1-03", "type": "single", "module": "汽车发动机维修", "q": "在燃油系统维修作业中，为防止火灾，下列做法错误的是（　）。", "opts": [{"k": "A", "t": "拆装油管前先释放燃油系统压力"}, {"k": "B", "t": "作业现场严禁明火和吸烟"}, {"k": "C", "t": "用普通脸盆敞口盛接汽油并放置于作业区"}, {"k": "D", "t": "拆卸的油管用堵头封住防止燃油外溢"}], "a": "C", "e": "【考点】燃油系统维修的防火安全要求。\n【解析】汽油极易挥发，蒸气比空气重、会在地面聚集，遇明火或电火花即爆燃。正确做法：拆装油管前先释放油压、严禁明火吸烟、油管用堵头封住。C用敞口脸盆盛接汽油会让油气大量挥发积聚，是最危险的做法，故选C（题干问“错误的”）。\n【易错】注意题干问的是“错误的是”，选C而不是A。盛油必须用密闭容器并及时转移，油气积聚是汽修车间火灾的头号隐患。"}, {"id": 45, "oid": "B2-01", "type": "single", "module": "汽车发动机维修", "q": "电控汽油喷射系统中，负责根据各传感器信号计算喷油量和点火时刻的核心部件是（　）。", "opts": [{"k": "A", "t": "节气门位置传感器"}, {"k": "B", "t": "电子控制单元（ECU）"}, {"k": "C", "t": "喷油器"}, {"k": "D", "t": "燃油泵"}], "a": "B", "e": "【考点】电控燃油喷射系统的核心——ECU。\n【解析】电控系统的“大脑”是电子控制单元ECU：它接收各传感器（节气门位置、转速、水温、进气量等）信号，通过运算确定喷油量、喷油时刻和点火时刻，再输出指令给执行器。传感器负责“感知”，执行器负责“执行”，ECU负责“决策”，故选B。\n【易错】分清三类部件：传感器（输入信号，如节气门位置传感器）、ECU（运算决策）、执行器（如喷油器、点火线圈）。题目问“计算”的部件只能是ECU。"}, {"id": 46, "oid": "B2-02", "type": "single", "module": "汽车发动机维修", "q": "电控燃油喷射系统按喷油器安装位置分类，现代轿车普遍采用的是（　）。", "opts": [{"k": "A", "t": "单点喷射（SPI）"}, {"k": "B", "t": "多点喷射（MPI）"}, {"k": "C", "t": "化油器供油"}, {"k": "D", "t": "缸内直喷与歧管喷射以外的方式"}], "a": "B", "e": "【考点】电控燃油喷射按喷油器位置的分类。\n【解析】按喷油器安装位置分：单点喷射SPI（只在节气门体处设一个喷油器）和多点喷射MPI（每个气缸的进气歧管各设一个喷油器）。多点喷射供油精确、各缸均匀，是现代轿车普遍采用的形式，故选B。缸内直喷则是喷油器装在气缸内直接喷入气缸。\n【易错】“单点”是早期经济型方案（一个喷油器供全部缸），现代主流是“多点”（每缸一个）。注意MPI喷在进气歧管，GDI缸内直喷直接喷进气缸，两者别混。"}, {"id": 47, "oid": "B2-03", "type": "judge", "module": "汽车发动机维修", "q": "进气压力传感器（MAP）的作用是检测进气歧管内的真空度，ECU据此直接确定点火时刻，与进气量和喷油量无关。", "opts": [], "a": "×", "e": "【考点】进气压力传感器（MAP）的作用。\n【解析】MAP检测进气歧管内的绝对压力，反映发动机负荷。在D型（速度-密度型）系统中，ECU根据“歧管压力+转速”间接算出进气量，进而确定基本喷油量。题干说MAP“与喷油量无关”，明显错误；它也确实不直接决定点火时刻，判断为×。\n【易错】MAP≠真空度传感器（它测的是绝对压力不是真空度）；“压力-转速法算喷油量”是D型系统的核心逻辑。记住：MAP数据用于算喷油量，是负荷信号。"}, {"id": 48, "oid": "B2-04", "type": "single", "module": "汽车发动机维修", "q": "电控汽油机起动时，为了加浓混合气、便于起动，ECU通常采用的控制方式是（　）。", "opts": [{"k": "A", "t": "减小喷油脉宽"}, {"k": "B", "t": "根据冷却液温度修正，在低温时增大喷油脉宽"}, {"k": "C", "t": "关闭喷油器"}, {"k": "D", "t": "增大点火提前角同时减小喷油量"}], "a": "B", "e": "【考点】冷起动时的喷油加浓控制。\n【解析】低温时汽油雾化差、蒸发困难，混合气偏稀不易着火。ECU根据冷却液温度传感器信号，在低温时增大喷油脉宽（喷油时间加长）来加浓混合气，保证冷起动顺利。故选B。起动工况不按氧传感器反馈修正（氧传感器需热机后才工作）。\n【易错】“加浓”=增大喷油脉宽而不是减小；起动时氧传感器不参与闭环（冷机未达工作温度）。水温越低、加浓越多，这是电控起动的常识。"}, {"id": 49, "oid": "B3-01", "type": "judge", "module": "汽车发动机维修", "q": "发动机有效功率是发动机对外输出的功率，标定功率是制造厂按规定条件标定的最大有效功率。", "opts": [], "a": "√", "e": "【考点】有效功率与标定功率。\n【解析】有效功率是发动机曲轴端实际对外输出的功率（扣除内部损耗后）；标定功率是制造厂在规定大气条件、规定转速下测定的最大有效功率，印在铭牌上作为动力性指标。两者是“实际输出”与“标定最大值”的关系，题干正确，判断为√。\n【易错】标定功率是“按规定条件测出的最大有效功率”，不等于发动机时刻都在这个功率下工作。常用标定：15分钟功率、1小时功率等。"}, {"id": 50, "oid": "B3-02", "type": "single", "module": "汽车发动机维修", "q": "发动机的有效转矩、有效功率随转速变化的关系曲线称为（　）。", "opts": [{"k": "A", "t": "万有特性曲线"}, {"k": "B", "t": "速度特性曲线"}, {"k": "C", "t": "负荷特性曲线"}, {"k": "D", "t": "点火提前角特性曲线"}], "a": "B", "e": "【考点】发动机速度特性曲线。\n【解析】速度特性曲线表示有效转矩、有效功率随转速的变化规律：转矩先升后降、功率持续上升到最高后下降。万有特性曲线表示油耗率在转速-负荷平面上的等高线分布，用于经济性分析。故选B。\n【易错】速度特性（转矩功率随转速变）vs 负荷特性（同一转速下随负荷变）vs 万有特性（转速+负荷二维）。题目关键词“随转速变化”对应速度特性。"}, {"id": 51, "oid": "B3-03", "type": "single", "module": "汽车发动机维修", "q": "发动机燃油经济性的主要评价指标是（　）。", "opts": [{"k": "A", "t": "有效热效率"}, {"k": "B", "t": "有效燃油消耗率"}, {"k": "C", "t": "机械效率"}, {"k": "D", "t": "容积效率"}], "a": "B", "e": "【考点】燃油经济性评价指标。\n【解析】有效燃油消耗率be（比油耗，单位g/kW·h）表示产生1千瓦时有效功消耗的燃油克数，是评价发动机经济性的主要指标，数值越低越省油。故选B。有效热效率反映能量利用程度，但工程上常用be衡量。\n【易错】“有效燃油消耗率越低越经济”常考；注意单位g/kW·h（克每千瓦时）。热效率与比油耗互为倒数关系（be=3.6×10⁶/(ηe·Hu)）。"}, {"id": 52, "oid": "B3-04", "type": "judge", "module": "汽车发动机维修", "q": "发动机大修竣工后，应保证怠速运转平稳、无异常响声，额定转速下功率不低于原厂标定功率的90%左右，符合《汽车发动机大修竣工技术条件》。", "opts": [], "a": "√", "e": "【考点】发动机大修竣工技术条件（GB/T 3799）。\n【解析】按《汽车发动机大修竣工技术条件》，大修竣工发动机应在额定转速下功率不低于原标定功率的90%，怠速运转平稳、无异常响声、无漏油漏水漏气，排放达标。题干符合规范，判断为√。\n【易错】“90%”是关键数字：大修后功率不低于原标定功率的90%。同理还有油耗不高于原标定的105%等验收标准。"}, {"id": 53, "oid": "B4-01", "type": "single", "module": "汽车发动机维修", "q": "活塞环按功能分为气环和（　）。", "opts": [{"k": "A", "t": "油环"}, {"k": "B", "t": "密封环"}, {"k": "C", "t": "卡环"}, {"k": "D", "t": "支承环"}], "a": "A", "e": "【考点】活塞环的分类。\n【解析】活塞环按功能分为气环（密封环，用于密封气缸防止漏气、传导活塞热量）和油环（刮除缸壁多余机油、均匀布油）两类。一般活塞装2～3道气环+1道油环，故选A。\n【易错】气环管“密封”，油环管“刮油”，功能别混。常见误解是“密封环”是独立第三类——其实密封环就是气环的别称。"}, {"id": 54, "oid": "B4-02", "type": "single", "module": "汽车发动机维修", "q": "安装活塞环时，将各道气环的开口在圆周方向错开一定角度，其目的是（　）。", "opts": [{"k": "A", "t": "便于装配"}, {"k": "B", "t": "减少漏气量，防止相邻环口形成漏气通道"}, {"k": "C", "t": "减小活塞环磨损"}, {"k": "D", "t": "增大活塞环张力"}], "a": "B", "e": "【考点】活塞环开口错位安装的目的。\n【解析】若各道气环的开口都在同一方向，会形成一条直通的漏气通道，造成气缸严重窜气和机油上窜。安装时把相邻环口错开（一般错120°～180°），并避开活塞销方向，可减少漏气，故选B。\n【易错】错开的是“相邻两道环的开口角度”，不是随便乱放；且要避开活塞销孔方向（销孔处环受力大易变形）。目的是防漏气不是防磨损。"}, {"id": 55, "oid": "B4-03", "type": "judge", "module": "汽车发动机维修", "q": "活塞与气缸的配合间隙过大时，会引起敲缸异响、窜气、机油消耗增加，因此选配活塞时应测量活塞裙部与气缸的配合间隙。", "opts": [], "a": "√", "e": "【考点】活塞与气缸配合间隙的检测与影响。\n【解析】间隙过大：活塞在缸内晃动产生敲缸异响，密封变差导致窜气、机油上窜燃烧；间隙过小：活塞受热膨胀后卡滞甚至拉缸。因此选配活塞时须实测活塞裙部与气缸的配合间隙，保证在规定范围内，题干正确，判断为√。\n【易错】“敲缸”是间隙大的典型症状（冷车明显、热车减轻）；“拉缸”是间隙过小的后果。测量部位是活塞裙部（不是头部），因裙部尺寸最大。"}, {"id": 56, "oid": "B4-04", "type": "single", "module": "汽车发动机维修", "q": "检查活塞环的端隙（开口间隙）时，应将活塞环平放入气缸内，用（　）测量开口处的间隙。", "opts": [{"k": "A", "t": "游标卡尺"}, {"k": "B", "t": "塞尺"}, {"k": "C", "t": "外径千分尺"}, {"k": "D", "t": "百分表"}], "a": "B", "e": "【考点】活塞环端隙的测量方法。\n【解析】端隙（开口间隙）测量：将活塞环平放入气缸上部未磨损处，用活塞顶把环推平，再用塞尺插入环开口处测间隙。端隙过大漏气，过小受热膨胀会顶死，故选B塞尺。\n【易错】量具选择常考：塞尺量“间隙”（环端隙、气门间隙、火花塞间隙），外径千分尺量“直径”，游标卡尺量“长度/孔径”。端隙是间隙，用塞尺。"}, {"id": 57, "oid": "B4-05", "type": "judge", "module": "汽车发动机维修", "q": "连杆的作用是连接活塞与曲轴，将曲轴的旋转运动转变为活塞的往复运动，并把曲轴所受的力传给活塞。", "opts": [], "a": "×", "e": "【考点】连杆的作用与运动转换方向。\n【解析】连杆小头连活塞、大头连曲轴，作用是把活塞的往复直线运动转变为曲轴的旋转运动，并把活塞所受的力传给曲轴。题干说“把曲轴的旋转运动转变为活塞的往复运动”，方向说反了（那是曲柄连杆机构反向应用，如压缩机），判断为×。\n【易错】发动机中活塞是主动、曲轴是从动：往复→旋转。反过来说“旋转→往复”的是活塞式压缩机等，别在发动机语境里说反。"}, {"id": 58, "oid": "B5-01", "type": "single", "module": "汽车发动机维修", "q": "曲轴上用于连接连杆的部分称为（　）。", "opts": [{"k": "A", "t": "主轴颈"}, {"k": "B", "t": "连杆轴颈"}, {"k": "C", "t": "曲柄"}, {"k": "D", "t": "平衡重"}], "a": "B", "e": "【考点】曲轴的组成及各轴颈作用。\n【解析】曲轴由主轴颈（支承在机体主轴承上）、连杆轴颈（与连杆大头相连，又称曲柄销）、曲柄（连接主轴颈与连杆轴颈）、平衡重（平衡离心力）组成。题目问“连接连杆的部分”，选B连杆轴颈。\n【易错】主轴颈=支承在机体上；连杆轴颈=连连杆。看名字对应：主（机体）轴颈、连杆（连杆）轴颈。直列四缸曲轴通常有5道主轴颈、4个连杆轴颈。"}, {"id": 59, "oid": "B5-02", "type": "judge", "module": "汽车发动机维修", "q": "飞轮的主要作用是增大发动机的功率，飞轮转动惯量越大，发动机输出的有效功率越高。", "opts": [], "a": "×", "e": "【考点】飞轮的作用。\n【解析】飞轮质量大、转动惯量大，在做功行程储存动能，在进气、压缩、排气行程释放动能带动曲轴，使曲轴转速均匀平稳，还能储存能量帮助起动和怠速稳定。飞轮不产生动力，与功率大小无关，题干说“增大发动机功率”错误，判断为×。\n【易错】飞轮=“蓄能器”不是“发电机”。转动惯量越大转速越平稳（但过大影响加速响应）。别把“平稳转速”理解成“增大功率”。"}, {"id": 60, "oid": "B5-03", "type": "single", "module": "汽车发动机维修", "q": "测量曲轴主轴颈的圆度、圆柱度误差，应选用的量具是（　）。", "opts": [{"k": "A", "t": "游标卡尺"}, {"k": "B", "t": "塞尺"}, {"k": "C", "t": "外径千分尺"}, {"k": "D", "t": "直尺"}], "a": "C", "e": "【考点】曲轴轴颈圆度圆柱度测量量具。\n【解析】测量轴颈直径用外径千分尺：在轴颈同一截面互相垂直的两个方向测（圆度），再在不同截面测（圆柱度），判断磨损是否超限。故选C外径千分尺。\n【易错】量具对应：外径千分尺→轴颈直径（0.01mm精度）；塞尺→间隙；百分表→跳动量/平面度；游标卡尺→一般尺寸。圆度=同一截面两垂直方向直径差，圆柱度=各截面直径差。"}, {"id": 61, "oid": "B5-04", "type": "single", "module": "汽车发动机维修", "q": "检查曲轴弯曲变形时，常用的方法是（　）。", "opts": [{"k": "A", "t": "用游标卡尺测轴颈直径"}, {"k": "B", "t": "将曲轴两端主轴颈支承在V形铁上，用百分表测中间主轴颈的径向跳动量"}, {"k": "C", "t": "用塞尺测轴承间隙"}, {"k": "D", "t": "目视检查轴颈表面"}], "a": "B", "e": "【考点】曲轴弯曲变形的检查方法。\n【解析】检查曲轴弯曲：将曲轴两端主轴颈支承在V形铁上，缓慢转动曲轴，用百分表测量中间主轴颈表面的径向跳动量（摆差），跳动量超过标准（一般0.04～0.06mm）说明弯曲超限，需校正或更换。故选B。\n【易错】测“弯曲”用“百分表+径向跳动”，测“直径磨损”用“外径千分尺”。V形铁支承+百分表是曲轴弯曲检测的标准工装。"}, {"id": 62, "oid": "B5-05", "type": "judge", "module": "汽车发动机维修", "q": "曲轴主轴承（轴瓦）的配合间隙过大会造成机油压力下降、产生敲击异响，过小则可能导致烧瓦抱轴。", "opts": [], "a": "√", "e": "【考点】曲轴主轴承间隙过大过小的影响。\n【解析】主轴承间隙过大：机油从间隙大量泄漏→油压下降→曲轴与轴承撞击产生敲击异响；间隙过小：油膜难以建立→摩擦加剧发热→烧瓦抱轴。所以间隙必须符合规定值（通过塑料线规或千分尺测量），题干正确，判断为√。\n【易错】间隙大→油压低+异响；间隙小→烧瓦抱轴。两个方向症状正好相反，是判断题和故障题的高频考点。"}, {"id": 63, "oid": "B6-01", "type": "single", "module": "汽车发动机维修", "q": "四冲程发动机配气机构的作用是（　）。", "opts": [{"k": "A", "t": "将活塞往复运动变为旋转运动"}, {"k": "B", "t": "按各缸工作顺序及时开启和关闭进、排气门，保证换气"}, {"k": "C", "t": "将燃油喷入气缸"}, {"k": "D", "t": "调节发动机转速"}], "a": "B", "e": "【考点】配气机构的作用。\n【解析】配气机构按发动机工作循环和各缸点火顺序，在规定时刻开启和关闭进、排气门，让新鲜混合气（或空气）及时进入气缸、废气及时排出，保证换气质量。故选B。“将往复变旋转”是曲柄连杆机构，别混。\n【易错】配气机构管“气门的开和关”；曲柄连杆机构管“往复变旋转”。记口诀：曲柄连杆管动力转换，配气机构管换气。"}, {"id": 64, "oid": "B6-02", "type": "single", "module": "汽车发动机维修", "q": "凸轮轴上的凸轮直接（或经挺柱、推杆、摇臂）控制（　）的开启与关闭。", "opts": [{"k": "A", "t": "活塞环"}, {"k": "B", "t": "气门"}, {"k": "C", "t": "喷油器"}, {"k": "D", "t": "节流阀"}], "a": "B", "e": "【考点】凸轮轴对气门的控制。\n【解析】凸轮轴上的凸轮按配气相位推动挺柱、推杆、摇臂等传动件，最终控制气门的开启时刻、开启持续时间和升程。凸轮轮廓形状决定了气门运动规律，故选B气门。\n【易错】凸轮直接或间接（经挺柱推杆摇臂）控制的都是气门，不是活塞环、喷油器。气门间隙调整的本质就是保证凸轮与传动件之间预留热胀间隙。"}, {"id": 65, "oid": "B6-03", "type": "single", "module": "汽车发动机维修", "q": "气门间隙过大的直接后果是（　）。", "opts": [{"k": "A", "t": "气门关闭不严，漏气"}, {"k": "B", "t": "气门开启晚、关闭早，进气不足排气不畅，并产生气门敲击声"}, {"k": "C", "t": "气门烧蚀"}, {"k": "D", "t": "凸轮轴弯曲"}], "a": "B", "e": "【考点】气门间隙过大的后果。\n【解析】气门间隙过大：传动件与气门间空行程增大，气门开启滞后、关闭提前，进气不足、排气不净，同时产生“嗒嗒”的敲击声（气门脚响）。故选B。间隙过小才导致气门关闭不严漏气。\n【易错】间隙过大→敲击声+充气不足；间隙过小→关闭不严漏气。两者症状相反。冷车响声明显、热车响声减轻是间隙过大的特征。"}, {"id": 66, "oid": "B6-04", "type": "judge", "module": "汽车发动机维修", "q": "正时带（链）错位会导致配气相位错误，可能造成气门与活塞碰撞顶坏气门。", "opts": [], "a": "√", "e": "【考点】正时带（链）错位的严重后果。\n【解析】正时带连接曲轴和凸轮轴，保证配气相位正确。若跳齿/错位，气门会在活塞到达上止点时仍开启，发生气门与活塞干涉碰撞，顶弯气门、损坏活塞和气门座，属严重机械事故。题干正确，判断为√。\n【易错】“顶气门”是正时错乱的典型后果，也是“为什么换正时带要按时”的原因。拆装正时必须对好正时标记，装后手动转动曲轴验证。"}, {"id": 67, "oid": "B6-05", "type": "single", "module": "汽车发动机维修", "q": "发动机出现“气门漏气”故障时，下列现象中不符合的是（　）。", "opts": [{"k": "A", "t": "气缸压力明显偏低"}, {"k": "B", "t": "怠速不稳、功率下降"}, {"k": "C", "t": "进气管回火或排气管放炮"}, {"k": "D", "t": "机油压力升高"}], "a": "D", "e": "【考点】气门漏气的故障现象诊断。\n【解析】气门关闭不严漏气：气缸压缩压力下降→怠速不稳、功率下降；进气门漏气时新鲜混合气反喷入进气管→回火；排气门漏气时废气窜入排气管→放炮。机油压力升高与气门漏气无关，故选D（题干问“不符合的”）。\n【易错】注意题干问“不符合的是”，要选D。回火=进气门漏气（进气管），放炮=排气门漏气（排气管），压缩压力下降是共同点。"}, {"id": 68, "oid": "B7-01", "type": "single", "module": "汽车发动机维修", "q": "水冷式发动机冷却系统中，节温器安装在（　）上。", "opts": [{"k": "A", "t": "散热器出水管"}, {"k": "B", "t": "气缸盖出水口处"}, {"k": "C", "t": "水泵进水口"}, {"k": "D", "t": "暖风水管"}], "a": "B", "e": "【考点】节温器的安装位置与大小循环。\n【解析】节温器一般装在气缸盖出水口处（或水泵进口），感受冷却液温度自动控制大小循环：冷车时阀门关闭走小循环（不经散热器）快速暖机；热车后阀门打开走大循环（经散热器）散热。故选B。\n【易错】“节温器卡在关闭位”=过热，“卡在打开位”=暖机慢。安装位置常在缸盖出水口，不在散热器出水管上。"}, {"id": 69, "oid": "B7-02", "type": "judge", "module": "汽车发动机维修", "q": "冷却液（防冻液）具有防冻、防沸、防腐蚀和防垢的作用，因此可以用自来水长期代替使用。", "opts": [], "a": "×", "e": "【考点】冷却液的作用与正确使用。\n【解析】冷却液具备防冻、防沸、防腐蚀、防水垢四大功能。长期用自来水：高温结水垢堵塞水道、生锈腐蚀、冬天结冰胀裂缸体，故不能用水代替。题干说“可以用自来水长期代替”，错误，判断为×。\n【易错】“四防”（防冻防沸防腐蚀防水垢）常考。水垢是发动机过热的重要原因之一。更换周期一般2年或4万公里。"}, {"id": 70, "oid": "B7-03", "type": "single", "module": "汽车发动机维修", "q": "发动机过热（开锅）的常见原因不包括（　）。", "opts": [{"k": "A", "t": "散热器外部堵塞或风扇不工作"}, {"k": "B", "t": "冷却液不足或水泵损坏"}, {"k": "C", "t": "节温器卡在关闭位置"}, {"k": "D", "t": "机油油位过高"}], "a": "D", "e": "【考点】发动机过热的原因分析。\n【解析】过热（开锅）的常见原因：散热器外部脏堵或内部水垢堵塞、风扇不转（或耦合器失效）、冷却液不足、水泵损坏、节温器卡在关闭位、皮带打滑。机油油位过高主要影响润滑与密封，不会直接引起过热，故选D（题干问“不包括的”）。\n【易错】“机油过多”≠过热原因。从散热三环节记忆：散热能力（散热器/风扇）→循环动力（水泵/皮带）→流路开关（节温器/液量）。"}, {"id": 71, "oid": "B7-04", "type": "single", "module": "汽车发动机维修", "q": "发动机冷车正常、热车后水温报警，用温度计实测水温并不高，最可能的原因是（　）。", "opts": [{"k": "A", "t": "冷却液不足"}, {"k": "B", "t": "冷却液温度传感器或线路故障"}, {"k": "C", "t": "节温器损坏"}, {"k": "D", "t": "水泵皮带打滑"}], "a": "B", "e": "【考点】水温报警但实际不高的故障判断。\n【解析】冷车正常、热车后水温报警，但温度计实测水温不高，说明仪表显示失真——故障在水温传感器、传感器线路或仪表本身，应检查传感器电阻和线路是否正常。A、C、D会导致真实过热。故选B。\n【易错】“报警但实测不高”=信号失真（传感器/线路/仪表）；“报警且实测也高”=真实过热（冷却系统故障）。先分清真假过热再动手。"}, {"id": 72, "oid": "B8-01", "type": "single", "module": "汽车发动机维修", "q": "发动机润滑系统中，机油泵的作用是（　）。", "opts": [{"k": "A", "t": "过滤机油杂质"}, {"k": "B", "t": "建立机油压力，将机油输送到各摩擦表面"}, {"k": "C", "t": "冷却机油"}, {"k": "D", "t": "储存机油"}], "a": "B", "e": "【考点】机油泵的作用。\n【解析】机油泵将油底壳中的机油吸入并加压，输送到各摩擦表面，建立机油压力形成润滑油膜。过滤杂质是机油滤清器的职责，储存机油是油底壳的职责，故选B。\n【易错】润滑系统各部件职责：机油泵=加压输送、滤清器=过滤、油底壳=储存、集滤器=粗滤。机油压力低首先要查机油泵和相关泄漏。"}, {"id": 73, "oid": "B8-02", "type": "judge", "module": "汽车发动机维修", "q": "机油压力过低时，发动机各摩擦表面润滑不良，容易造成轴瓦烧蚀、曲轴抱死等严重故障。", "opts": [], "a": "√", "e": "【考点】机油压力过低的危害。\n【解析】机油压力过低说明供油不足，摩擦表面无法建立油膜，形成干摩擦或边界摩擦，温度急剧升高，会迅速导致轴瓦烧蚀（烧瓦）、曲轴抱死（抱轴）等严重故障。题干正确，判断为√。\n【易错】机油压力过低必须立即停机，继续行驶后果=烧瓦抱轴。机油灯亮起继续跑是维修事故的高发原因，也是安全类考点。"}, {"id": 74, "oid": "B8-03", "type": "single", "module": "汽车发动机维修", "q": "机油压力过高的常见原因是（　）。", "opts": [{"k": "A", "t": "机油泵磨损"}, {"k": "B", "t": "机油黏度过大或主油道堵塞"}, {"k": "C", "t": "油底壳缺油"}, {"k": "D", "t": "机油滤清器破损"}], "a": "B", "e": "【考点】机油压力过高的原因。\n【解析】机油压力过高常见原因：机油黏度过大（牌号不符）、主油道或油路堵塞、限压阀卡死打不开、轴承间隙过小。压力过大会压裂滤清器、密封件。机油泵磨损、缺油则会造成压力过低。故选B。\n【易错】“过高”和“过低”原因要分清：过高=油路堵/油太黏/限压阀卡；过低=油泵磨损/缺油/间隙过大。限压阀是油压“安全阀”。"}, {"id": 75, "oid": "B8-04", "type": "single", "module": "汽车发动机维修", "q": "机油警告灯在发动机运转中点亮（怠速时）且加油门后熄灭，最可能的原因是（　）。", "opts": [{"k": "A", "t": "机油泵彻底损坏"}, {"k": "B", "t": "怠速机油压力偏低，接近报警限值"}, {"k": "C", "t": "机油警告灯线路断路"}, {"k": "D", "t": "机油黏度过大"}], "a": "B", "e": "【考点】怠速机油报警灯亮、加速熄灭的诊断。\n【解析】怠速转速低、油压本就近报警下限，若机油量偏少、机油泵轻微磨损或轴承间隙偏大，怠速油压会低于报警值亮灯；加油门转速升高、油压上升灯灭。故选B。应查油位、油压和轴瓦间隙。\n【易错】“加速灯灭”说明油泵还能建立压力，多为怠速工况下油压不足（缺油/磨损/间隙大），不是油泵彻底损坏。彻底损坏时任何转速都无油压。"}, {"id": 76, "oid": "B9-01", "type": "single", "module": "汽车发动机维修", "q": "发动机进气系统中，空气滤清器的作用是（　）。", "opts": [{"k": "A", "t": "降低进气噪声"}, {"k": "B", "t": "滤除空气中的灰尘杂质，防止气缸和活塞早期磨损"}, {"k": "C", "t": "增加进气量"}, {"k": "D", "t": "预热空气"}], "a": "B", "e": "【考点】空气滤清器的作用。\n【解析】空气滤清器滤除进气中的灰尘、沙粒等杂质，防止磨料进入气缸磨损气缸壁、活塞环，并防止杂质磨损空气流量计等元件。降低噪声是消声器的事，故选B。滤芯堵塞会进气不足、动力下降、油耗升高。\n【易错】“空气滤清器=保护发动机免受磨料磨损”。滤芯要定期清洁/更换（一般1万公里检查、脏了更换），堵了反而费油无力。"}, {"id": 77, "oid": "B9-02", "type": "judge", "module": "汽车发动机维修", "q": "排气消声器的作用是增大排气压力，使废气排出更迅速，从而提高发动机的输出功率。", "opts": [], "a": "×", "e": "【考点】排气消声器的作用。\n【解析】消声器利用多次反射、吸声材料吸收和气流膨胀，降低排气气流的压力波动和噪声，主要作用是降噪（并配合三元催化器净化），不是增大排气压力提高功率。题干说反了，判断为×。\n【易错】消声器=降噪，不是增压。别与涡轮增压器的“废气能量利用”混淆。排气背压过高反而会降低发动机功率。"}, {"id": 78, "oid": "B9-03", "type": "single", "module": "汽车发动机维修", "q": "三元催化转化器安装在排气系统中，其作用是将废气中的（　）转化为无害物质。", "opts": [{"k": "A", "t": "CO、HC、NOx"}, {"k": "B", "t": "CO2、H2O"}, {"k": "C", "t": "O2、N2"}, {"k": "D", "t": "SO2、CO"}], "a": "A", "e": "【考点】三元催化转化器的作用。\n【解析】三元催化转化器以铂、铑、钯为催化剂，同时处理三种有害气体：CO氧化为CO2、HC氧化为CO2和H2O、NOx还原为N2，所以叫“三元”。故选A。\n【易错】“三元”=CO+HC+NOx三种有害物。记住：CO/HC氧化（还原变无害），NOx还原。使用含铅汽油会使催化剂“中毒”失效。"}, {"id": 79, "oid": "B9-04", "type": "single", "module": "汽车发动机维修", "q": "发动机排气背压过高的最常见原因是（　）。", "opts": [{"k": "A", "t": "空气滤清器堵塞"}, {"k": "B", "t": "三元催化转化器或消声器堵塞"}, {"k": "C", "t": "节气门积炭"}, {"k": "D", "t": "火花塞间隙过大"}], "a": "B", "e": "【考点】排气背压过高的原因。\n【解析】排气背压过高的最常见原因是排气系统堵塞：三元催化转化器烧结堵塞、消声器内部锈蚀塌陷等，表现为动力下降、加速无力、油耗增加、发动机过热。A空气滤清器堵塞是进气阻力问题，故选B。\n【易错】“排气堵”与“进气堵”症状相似（都无力费油），但部位不同：背压高查排气（三元催化、消声器），进气不足查空滤、节气门。"}, {"id": 80, "oid": "B10-01", "type": "single", "module": "汽车发动机维修", "q": "电控燃油供给系统由燃油箱、燃油泵、燃油滤清器、（　）和喷油器等组成。", "opts": [{"k": "A", "t": "油压调节器"}, {"k": "B", "t": "节气门"}, {"k": "C", "t": "空气流量计"}, {"k": "D", "t": "氧传感器"}], "a": "A", "e": "【考点】电控燃油供给系统的组成。\n【解析】电控燃油供给系统包括：燃油箱、电动燃油泵、燃油滤清器、油压调节器（调压器）、喷油器及油管。油压调节器保持喷油器压差恒定（油轨压力-进气歧管压力恒定），保证不同工况喷油量准确。故选A。\n【易错】油压调节器是“保持喷油压差恒定”的部件，易漏选。空气流量计、氧传感器属于信号采集（传感器），不属于供油系统。"}, {"id": 81, "oid": "B10-02", "type": "judge", "module": "汽车发动机维修", "q": "电动燃油泵一般安装在发动机舱内，靠空气自然冷却，浸在燃油中工作会损坏燃油泵。", "opts": [], "a": "×", "e": "【考点】电动燃油泵的安装方式。\n【解析】电动燃油泵多为内装式（装在燃油箱内），浸在燃油中工作：燃油兼作冷却和润滑介质，泵体散热好、不易产生气阻，也减少泄漏风险。题干说“装在发动机舱、靠空气冷却”，错误，判断为×。\n【易错】“内装式油箱内”是主流。注意别长时间把油开到底（燃油不足会让泵散热变差、易烧毁）。外装式一般装在车架下、油箱外。"}, {"id": 82, "oid": "B10-03", "type": "single", "module": "汽车发动机维修", "q": "发动机不能起动，接通点火开关时听不到燃油泵运转声（正常应转2～3秒后停止），首先应检查（　）。", "opts": [{"k": "A", "t": "燃油泵继电器及熔丝"}, {"k": "B", "t": "喷油器堵塞"}, {"k": "C", "t": "气缸压力"}, {"k": "D", "t": "正时皮带"}], "a": "A", "e": "【考点】燃油泵不工作的电路诊断。\n【解析】接通点火开关时，ECU控制燃油泵继电器使油泵运转2～3秒建立油压（未起动时短暂工作）。听不到运转声，说明油泵电路有断路：先查燃油泵熔丝、燃油泵继电器及其控制线路，再查油泵本身。故选A。\n【易错】诊断顺序“先电路后油路”：继电器、熔丝是故障高发点。喷油器堵、缸压低、正时错都不会让油泵不转。"}, {"id": 83, "oid": "B10-04", "type": "single", "module": "汽车发动机维修", "q": "检测电控汽油机燃油系统压力时，应使用（　）接在燃油分配管（油轨）的检测口处。", "opts": [{"k": "A", "t": "万用表"}, {"k": "B", "t": "燃油压力表"}, {"k": "C", "t": "真空表"}, {"k": "D", "t": "气缸压力表"}], "a": "B", "e": "【考点】燃油系统压力的检测。\n【解析】测量燃油系统压力用专用燃油压力表，接在燃油分配管（油轨）的检测口（压力测试口）处。怠速正常压力一般250～350kPa（各车型不同，按手册），用于判断油泵供油能力和调压器是否正常。故选B。\n【易错】测油压用“燃油压力表”，测真空用“真空表”，测缸压用“气缸压力表”，测电压电阻用“万用表”。测量部位是油轨检测口。"}, {"id": 84, "oid": "B10-05", "type": "judge", "module": "汽车发动机维修", "q": "喷油器滴漏（关闭不严）会造成混合气过浓、油耗增加、热车起动困难，并可能引起排气管冒黑烟。", "opts": [], "a": "√", "e": "【考点】喷油器滴漏的故障现象。\n【解析】喷油器关闭不严时，在非喷射期间燃油持续渗入气缸，混合气过浓：怠速不稳、油耗增加、热车难起动（热车时燃油易蒸发更浓）、燃烧不充分排气管冒黑烟、氧传感器反馈浓信号。题干正确，判断为√。\n【易错】“滴漏→过浓→冒黑烟”，是电控燃油系统的经典故障链。与“喷油器堵塞→过稀→冒白烟/失火”方向相反，对比记忆。"}, {"id": 85, "oid": "B11-01", "type": "single", "module": "汽车发动机维修", "q": "发动机电控系统由传感器、（　）和执行器三大部分组成。", "opts": [{"k": "A", "t": "继电器"}, {"k": "B", "t": "电子控制单元（ECU）"}, {"k": "C", "t": "保险丝"}, {"k": "D", "t": "线束插接器"}], "a": "B", "e": "【考点】发动机电控系统的三大组成。\n【解析】发动机电控系统由三大部分组成：传感器（输入信号，如曲轴位置、水温、氧传感器）、电子控制单元ECU（处理运算）、执行器（输出动作，如喷油器、点火线圈）。故选B。\n【易错】“传感器—ECU—执行器”是电控系统的铁三角，即“感知—决策—执行”。继电器、熔丝、线束是辅助元件，不属三大组成。"}, {"id": 86, "oid": "B11-02", "type": "single", "module": "汽车发动机维修", "q": "下列属于发动机电控系统执行器的是（　）。", "opts": [{"k": "A", "t": "曲轴位置传感器"}, {"k": "B", "t": "氧传感器"}, {"k": "C", "t": "喷油器"}, {"k": "D", "t": "冷却液温度传感器"}], "a": "C", "e": "【考点】电控系统执行器的识别。\n【解析】执行器是接收ECU指令并动作的部件：喷油器（喷油）、点火线圈（点火）、怠速控制阀（控制怠速转速）等。曲轴位置传感器、氧传感器、水温传感器都是传感器（输入信号），故选C。\n【易错】识别口诀：传感器“感觉”（测什么什么sensor），执行器“干活”（喷、点、阀）。看名字带“传感器”的都是输入件。"}, {"id": 87, "oid": "B11-03", "type": "single", "module": "汽车发动机维修", "q": "曲轴位置传感器（CKP）损坏后，发动机最典型的故障现象是（　）。", "opts": [{"k": "A", "t": "怠速抖动"}, {"k": "B", "t": "无法起动（无点火、无喷油）"}, {"k": "C", "t": "油耗略有增加"}, {"k": "D", "t": "水温过高"}], "a": "B", "e": "【考点】曲轴位置传感器（CKP）损坏的典型故障。\n【解析】CKP提供曲轴转角（位置）和转速信号，是ECU计算点火时刻、喷油正时和转速的基准。CKP信号丢失，ECU不知道曲轴在什么位置、转得多快，无法点火和喷油，发动机通常无法起动。故选B。\n【易错】CKP是电控发动机“最关键的传感器”。怠速抖动、油耗增加是其他传感器问题的表现，CKP坏=起不来。同样起不来还有曲轴位置传感器线路断路。"}, {"id": 88, "oid": "B11-04", "type": "judge", "module": "汽车发动机维修", "q": "氧传感器的作用是检测排气中氧的浓度，ECU据此对喷油量进行闭环修正，使混合气保持在理论空燃比附近。", "opts": [], "a": "√", "e": "【考点】氧传感器的闭环控制原理。\n【解析】氧传感器检测排气中的氧浓度，判断混合气偏浓还是偏稀，ECU据此修正喷油脉宽，使混合气保持在理论空燃比（约14.7:1）附近，保证三元催化转化器净化效率最高，这叫闭环控制。题干正确，判断为√。\n【易错】闭环=氧传感器反馈修正；开环=不修正（冷起动、全负荷时）。氧传感器损坏→系统进入开环→油耗升高、排放超标。前后氧传感器职责不同（前氧调空燃比、后氧监控催化器）。"}, {"id": 89, "oid": "C1-01", "type": "judge", "module": "汽车底盘维修", "q": "在举升机下作业时，只要车辆在举升平台上停稳即可，无需拉紧手刹和检查锁止机构，因为举升机具备自动锁定功能。", "opts": [], "a": "×", "e": "【考点】举升机作业安全。\n【解析】举升作业前必须：车辆停稳、拉紧手刹、举升到需要高度后确认锁止机构（安全棘爪/锁块）到位，严禁在未锁止状态下钻入车底作业，防止车辆坠落造成伤亡。题干说“无需锁止”，错误，判断为×。\n【易错】“锁止”是举升作业的铁律：举升机都配机械锁止装置，升到位必须锁上。先锁止再进车底，是实操考核和安全生产的核心。"}, {"id": 90, "oid": "C1-02", "type": "single", "module": "汽车底盘维修", "q": "拆装悬架、传动轴等底盘部件时，若弹簧处于压缩状态，正确的做法是（　）。", "opts": [{"k": "A", "t": "直接用力撬出"}, {"k": "B", "t": "使用专用压缩工具释放弹簧预紧力后再拆装"}, {"k": "C", "t": "用锤子猛击弹簧"}, {"k": "D", "t": "一边举升一边拆螺栓"}], "a": "B", "e": "【考点】压缩弹簧的安全拆装。\n【解析】螺旋弹簧在压缩状态储存了大量弹性势能，直接撬、敲、猛拆会使弹簧猛然弹出伤人。必须用专用弹簧压缩器压缩并固定弹簧，再拆装，确保能量受控释放。故选B。\n【易错】弹簧弹射是底盘维修的常见伤害源。涉及弹簧的作业（悬架、离合器压盘、气门弹簧）一律用专用压缩工具，禁止锤击硬撬。"}, {"id": 91, "oid": "C2-01", "type": "single", "module": "汽车底盘维修", "q": "汽车传动系的作用是（　）。", "opts": [{"k": "A", "t": "将发动机的动力传给驱动车轮"}, {"k": "B", "t": "使汽车减速停车"}, {"k": "C", "t": "改变汽车行驶方向"}, {"k": "D", "t": "支承车身质量"}], "a": "A", "e": "【考点】传动系的作用。\n【解析】传动系把发动机动力经离合器、变速器、万向传动装置、主减速器、差速器、半轴传给驱动车轮，实现动力传递。减速停车是制动系、改变方向是转向系、支承质量是行驶系，故选A。\n【易错】“传动系=传动力给驱动轮”。四大系统功能一句话：传动系传动力、行驶系支承行驶、转向系控制方向、制动系减速停车。"}, {"id": 92, "oid": "C2-02", "type": "judge", "module": "汽车底盘维修", "q": "前置前驱（FF）布置的汽车，变速器、主减速器和差速器通常组合为一体安装在前桥上。", "opts": [], "a": "√", "e": "【考点】前置前驱（FF）的布置特点。\n【解析】FF车型发动机横置（少数纵置），变速器与主减速器、差速器集成一体（叫变速驱动桥/Transaxle），直接驱动前轮，省去长传动轴，结构紧凑、传动效率高。题干正确，判断为√。\n【易错】FF=前发动机+前驱动（变速驱动桥一体）；FR=前发动机+后驱动（长传动轴+后桥）；记住“FF省传动轴、FR有传动轴”。"}, {"id": 93, "oid": "C2-03", "type": "single", "module": "汽车底盘维修", "q": "差速器的作用是（　）。", "opts": [{"k": "A", "t": "增大扭矩"}, {"k": "B", "t": "使两侧驱动轮以不同转速转动，适应转弯等行驶工况"}, {"k": "C", "t": "改变旋转方向"}, {"k": "D", "t": "缓冲传动冲击"}], "a": "B", "e": "【考点】差速器的作用。\n【解析】差速器使两侧驱动轮能以不同转速转动：转弯时外侧轮要走更长的弧线、转速必须高于内侧轮，否则轮胎会拖滑磨损、转向困难。差速器同时把主减速器传来的转矩分配给左右半轴。故选B。\n【易错】差速器≠增扭（那是主减速器）。直线行驶两轮同速（行星齿轮不自转），转弯差速（行星齿轮自转）。对称式差速器会把转矩平分给两轮。"}, {"id": 94, "oid": "C3-01", "type": "single", "module": "汽车底盘维修", "q": "摩擦式离合器由主动部分、从动部分、压紧机构和（　）四部分组成。", "opts": [{"k": "A", "t": "操纵机构"}, {"k": "B", "t": "飞轮"}, {"k": "C", "t": "分离轴承"}, {"k": "D", "t": "压盘"}], "a": "A", "e": "【考点】摩擦式离合器的组成。\n【解析】摩擦离合器四部分：主动部分（飞轮、压盘，随发动机转）、从动部分（从动盘，连变速器输入轴）、压紧机构（膜片弹簧等，压紧从动盘）、操纵机构（踏板、传动件、分离轴承）。故选A。\n【易错】分离轴承属于操纵机构不是压紧机构；压盘属于主动部分。四部分缺一不可，多选题和组成题常考。"}, {"id": 95, "oid": "C3-02", "type": "judge", "module": "汽车底盘维修", "q": "离合器的功用是保证汽车平稳起步、便于换挡，并防止传动系过载。", "opts": [], "a": "√", "e": "【考点】离合器的三大功用。\n【解析】离合器通过接合与分离控制动力通断：起步时逐渐接合，传递扭矩由小到大，保证平稳起步；换挡时分离切断动力，便于挂挡减少冲击；传动系过载（如突然卡死）时从动盘打滑，保护传动系不损坏。题干正确，判断为√。\n【易错】“打滑”在正常工况是故障，但在“防止过载”时是保护机制。离合器的三大功用：平稳起步、便于换挡、防止过载。"}, {"id": 96, "oid": "C3-03", "type": "single", "module": "汽车底盘维修", "q": "离合器踏板自由行程过小或没有自由行程时，会造成（　）。", "opts": [{"k": "A", "t": "离合器分离不彻底"}, {"k": "B", "t": "离合器打滑"}, {"k": "C", "t": "离合器发抖"}, {"k": "D", "t": "变速器乱挡"}], "a": "B", "e": "【考点】离合器自由行程的影响。\n【解析】自由行程过小：分离轴承长期压在膜片弹簧上，压盘不能完全压紧从动盘→离合器打滑（动力传递不足）。自由行程过大：踏板压下时分离行程不足→分离不彻底（挂挡困难）。题干问自由行程过小，故选B打滑。\n【易错】“过大→分离不彻底，过小→打滑”方向相反，是高频判断点。口诀：行程大分不开（不彻底），行程小压不紧（打滑）。"}, {"id": 97, "oid": "C3-04", "type": "single", "module": "汽车底盘维修", "q": "汽车起步时，完全松开离合器踏板车辆仍不能起步（发动机正常、变速器挡位正常），最可能的原因是（　）。", "opts": [{"k": "A", "t": "离合器分离不彻底"}, {"k": "B", "t": "离合器打滑"}, {"k": "C", "t": "离合器发抖"}, {"k": "D", "t": "离合器踏板自由行程过大"}], "a": "B", "e": "【考点】离合器打滑的诊断。\n【解析】起步时完全松开离合器仍不能起步（发动机和挡位正常），说明动力传递打滑：离合器打滑时摩擦片压不紧，动力损失，表现为起步困难、加速无力、上坡无力、有烧焦味。故选B。\n【易错】打滑vs分离不彻底：打滑=动力传不出去（起步难、无力）；分离不彻底=动力切不断（挂挡响、难挂、怠速踩离合熄火）。"}, {"id": 98, "oid": "C3-05", "type": "single", "module": "汽车底盘维修", "q": "诊断离合器发抖时，通常应重点检查（　）。", "opts": [{"k": "A", "t": "从动盘翘曲、压盘工作面不平或压紧弹簧弹力不均"}, {"k": "B", "t": "离合器踏板高度"}, {"k": "C", "t": "变速器油量"}, {"k": "D", "t": "万向节润滑"}], "a": "A", "e": "【考点】离合器发抖的原因。\n【解析】离合器发抖（起步时整车抖振）源于压紧力分布不均：从动盘翘曲变形、摩擦片局部烧蚀、压盘工作面不平、膜片弹簧弹力不均、飞轮端面偏摆。故选A。踏板高度、变速器油、万向节润滑与发抖无关。\n【易错】发抖=压紧力“不均匀”；打滑=压紧力“整体不足”；分离不彻底=分离“不到位”。三个故障三个机理，对比记忆。"}, {"id": 99, "oid": "C4-01", "type": "single", "module": "汽车底盘维修", "q": "手动变速器由变速传动机构、（　）和变速操纵机构组成。", "opts": [{"k": "A", "t": "壳体"}, {"k": "B", "t": "换挡拨叉"}, {"k": "C", "t": "齿轮"}, {"k": "D", "t": "同步器"}], "a": "A", "e": "【考点】手动变速器的组成。\n【解析】手动变速器由变速传动机构（齿轮、轴、轴承、同步器）、变速操纵机构（换挡杆、拨叉、拨叉轴、自锁互锁装置）和变速器壳体三部分组成。故选A壳体。\n【易错】“传动机构+操纵机构+壳体”三部分。同步器属于传动机构（实现无冲击换挡），拨叉属于操纵机构（推动结合套），别混。"}, {"id": 100, "oid": "C4-02", "type": "judge", "module": "汽车底盘维修", "q": "同步器的作用是增大换挡时齿轮的撞击声，使驾驶员能够清晰地感知挡位已经啮合。", "opts": [], "a": "×", "e": "【考点】同步器的作用。\n【解析】同步器通过同步环锥面摩擦，先使结合套与待啮合齿轮的转速同步，再平稳啮合，消除换挡冲击和齿轮撞击声。题干说“增大撞击声让驾驶员感知”，完全说反，判断为×。\n【易错】同步器=消除撞击声（静音同步），不是制造声音。没有同步器的老式变速器才需要“两脚离合”来同步。"}, {"id": 101, "oid": "C4-03", "type": "single", "module": "汽车底盘维修", "q": "手动变速器挂挡困难、有“打齿”声，在离合器分离彻底的前提下，最可能的原因是（　）。", "opts": [{"k": "A", "t": "同步器磨损损坏"}, {"k": "B", "t": "变速器缺油"}, {"k": "C", "t": "万向节磨损"}, {"k": "D", "t": "轮胎气压不足"}], "a": "A", "e": "【考点】手动变速器挂挡困难、打齿的故障诊断。\n【解析】在离合器分离彻底的前提下挂挡打齿、困难,是同步器磨损损坏所致:同步环锥面磨损后失去摩擦同步作用,结合套直接与齿轮撞击。变速器缺油表现为运转噪声大,不直接打齿,故选A。\n【易错】“打齿”=同步器失效(齿轮直接撞击);“挂挡响且难挂”优先查同步器,前提是离合器分离正常。同步器锁环间隙超标就要更换。"}, {"id": 102, "oid": "C4-04", "type": "single", "module": "汽车底盘维修", "q": "手动变速器自动跳挡（行驶中自行脱挡）的常见原因是（　）。", "opts": [{"k": "A", "t": "同步器磨损"}, {"k": "B", "t": "自锁装置失效、拨叉轴定位凹槽磨损或齿轮磨损成锥形"}, {"k": "C", "t": "变速器油过多"}, {"k": "D", "t": "离合器踏板自由行程过大"}], "a": "B", "e": "【考点】变速器自动跳挡的原因。\n【解析】跳挡(行驶中自行脱挡)的常见原因:自锁装置失效(自锁弹簧变软、拨叉轴定位凹槽磨损)使挡位锁不住;啮合齿轮磨损成锥形产生轴向推力,把齿轮推出啮合。故选B。同步器磨损主要造成挂挡困难/打齿。\n【易错】自锁装置管“挂住挡位”,互锁装置管“不能同时挂两个挡”。跳挡查自锁;乱挡查互锁。“齿轮磨成锥形→轴向力→跳挡”是经典机理。"}, {"id": 103, "oid": "C4-05", "type": "judge", "module": "汽车底盘维修", "q": "变速器异响随转速升高而增大、挂挡后消失或改变，多为变速器轴承、齿轮磨损或油量不足所致。", "opts": [], "a": "√", "e": "【考点】变速器异响的规律判断。\n【解析】变速器噪声与转速相关:空挡运转时噪声增大多为输入轴、中间轴轴承磨损;行驶挂挡后噪声变化多为齿轮啮合不良(齿面磨损、间隙大);缺油会加剧各部位噪声。题干表述符合规律,判断为√。\n【易错】判断变速器异响部位看工况:空挡响=轴承(输入轴/中间轴);行驶挂挡响=齿轮;急加速响=齿轮间隙大。缺油是“放大器”,先查油量。"}, {"id": 104, "oid": "C5-01", "type": "single", "module": "汽车底盘维修", "q": "万向传动装置一般由万向节、传动轴和（　）组成。", "opts": [{"k": "A", "t": "中间支承"}, {"k": "B", "t": "差速器"}, {"k": "C", "t": "半轴"}, {"k": "D", "t": "主减速器"}], "a": "A", "e": "【考点】万向传动装置的组成。\n【解析】万向传动装置由万向节、传动轴和中间支承组成:万向节连接传动轴两端并适应角度变化,传动轴传递动力,中间支承(带轴承和支架)用于长轴距车辆分段支承传动轴。故选A。\n【易错】半轴、差速器、主减速器属于驱动桥,不属于万向传动装置。“中间支承”只出现在传动轴较长的后驱车上。"}, {"id": 105, "oid": "C5-02", "type": "judge", "module": "汽车底盘维修", "q": "十字轴式刚性万向节用于传动轴时，为减小转速波动，通常由两个万向节按一定规律组合使用（等速排列）。", "opts": [], "a": "√", "e": "【考点】十字轴万向节等速排列原理。\n【解析】单个十字轴万向节传动时输出转速有波动(夹角越大波动越大)。为消除波动,把两个万向节成对使用,且保证传动轴两端万向节叉在同一平面内、两轴夹角相等,实现近似等速传动。题干正确,判断为√。\n【易错】“同平面+等夹角”是成对安装的两个条件,缺一不可。这解释了为什么传动轴两端万向节叉要对正安装,装错会振动。"}, {"id": 106, "oid": "C5-03", "type": "single", "module": "汽车底盘维修", "q": "汽车行驶中，传动轴出现周期性“咯噔”异响并伴随车身抖动，随车速升高抖动加剧，最可能的原因是（　）。", "opts": [{"k": "A", "t": "传动轴弯曲或动平衡被破坏"}, {"k": "B", "t": "轮胎气压不足"}, {"k": "C", "t": "制动器拖滞"}, {"k": "D", "t": "离合器打滑"}], "a": "A", "e": "【考点】传动轴振动异响的故障诊断。\n【解析】传动轴弯曲、动平衡破坏或万向节磨损后,高速旋转产生周期性离心力,表现为周期“咯噔”异响和车身抖动,车速越高越明显。故选A。应做传动轴动平衡试验、检查万向节。\n【易错】“周期性异响+车速越快越抖”=传动轴动平衡问题;“低速抖高速稳”多为其他问题。传动轴平衡块脱落是常见原因。"}, {"id": 107, "oid": "C5-04", "type": "single", "module": "汽车底盘维修", "q": "等速万向节（球笼式）一般用于（　）。", "opts": [{"k": "A", "t": "前置后驱车的传动轴两端"}, {"k": "B", "t": "前轮驱动汽车的内、外半轴（驱动轴）两端"}, {"k": "C", "t": "主减速器与差速器之间"}, {"k": "D", "t": "转向器与转向节之间"}], "a": "B", "e": "【考点】等速万向节(球笼式)的应用。\n【解析】前驱车转向驱动桥的半轴需要满足大角度转向且转速恒定(等速)传动,采用球笼式等速万向节,半轴两端分别为内万向节(接变速驱动桥)和外万向节(接轮毂)。十字轴万向节用于后驱车传动轴。故选B。\n【易错】“转向轮上的半轴必须用等速万向节”(否则转向时车轮抖动)。球笼式内外两个,传动轴用十字轴式(加等速排列)。"}, {"id": 108, "oid": "C6-01", "type": "single", "module": "汽车底盘维修", "q": "主减速器的作用是（　）。", "opts": [{"k": "A", "t": "降低转速、增大转矩，并将旋转方向改变90°（纵置后驱）"}, {"k": "B", "t": "使两侧车轮转速不同"}, {"k": "C", "t": "切断动力"}, {"k": "D", "t": "缓冲冲击"}], "a": "A", "e": "【考点】主减速器的作用。\n【解析】主减速器的作用:一是降低转速、增大转矩(减速增扭);二是纵置后驱时把动力方向改变90°(从纵向变横向),使半轴横向布置驱动车轮。使两侧车轮转速不同是差速器的功能,故选A。\n【易错】“主减速器=减速增扭+改变方向”,差速器=差速。“改变90°方向”只在纵置后驱车上需要,横置前驱车不需转向。"}, {"id": 109, "oid": "C6-02", "type": "judge", "module": "汽车底盘维修", "q": "主减速器传动比越大，汽车最高车速越高，但加速能力和爬坡能力越弱。", "opts": [], "a": "×", "e": "【考点】主减速比与动力性、车速的关系。\n【解析】主减速比大:减速增扭作用强,相同车速下发动机转速高、驱动力大,加速爬坡能力强,但最高车速反而降低;主减速比小则相反(极速高但爬坡弱)。题干说“比越大极速越高”,正好说反,判断为×。\n【易错】主减速比类似“大齿轮”:“比大”=有劲但跑不快,“比小”=跑得快但没劲。重型车比大、轿车比小。"}, {"id": 110, "oid": "C6-03", "type": "single", "module": "汽车底盘维修", "q": "锥齿轮式主减速器中，调整主、从动锥齿轮啮合间隙和啮合印痕时，应（　）。", "opts": [{"k": "A", "t": "只调整轴承预紧力"}, {"k": "B", "t": "通过增减调整垫片或调整螺母，同时保证啮合间隙和啮合印痕符合规定"}, {"k": "C", "t": "只更换润滑油"}, {"k": "D", "t": "重新焊接齿轮"}], "a": "B", "e": "【考点】主减速器锥齿轮啮合调整。\n【解析】主、从动锥齿轮的啮合间隙和啮合印痕必须同时符合要求:通过增减调整垫片、旋动调整螺母改变齿轮轴向位置,使两者兼顾。间隙和印痕互相影响,需反复调整。故选B。\n【易错】“间隙+印痕”双指标:间隙过大噪声、过小卡滞;印痕(接触区)应在齿面中部偏小端。调整靠垫片和螺母,不是焊、不是只换油。"}, {"id": 111, "oid": "C6-04", "type": "judge", "module": "汽车底盘维修", "q": "差速器在直线行驶时，两侧半轴齿轮转速不相等，行星齿轮自转；转弯时两侧半轴转速相等，行星齿轮不自转。", "opts": [], "a": "×", "e": "【考点】差速器行星齿轮的工作状态。\n【解析】直线行驶:两侧驱动轮阻力相等,行星齿轮随差速器壳公转、不自转,两半轴齿轮转速相同;转弯:外侧轮需转得快,行星齿轮开始自转,补偿内外轮转速差。题干两种情况说反了,判断为×。\n【易错】口诀:直线=公转不自转(同速);转弯=自转(差速)。行星齿轮“自转”是差速发生的标志。"}, {"id": 112, "oid": "C7-01", "type": "single", "module": "汽车底盘维修", "q": "轮胎在汽车上的作用不包括（　）。", "opts": [{"k": "A", "t": "支承汽车总质量"}, {"k": "B", "t": "缓和路面冲击，保证行驶平顺"}, {"k": "C", "t": "产生驱动力和制动力，保证附着"}, {"k": "D", "t": "减小转向角度"}], "a": "D", "e": "【考点】轮胎的作用。\n【解析】轮胎的作用:支承整车质量、缓和路面冲击保证平顺、产生驱动力和制动力保证附着、影响行驶方向。减小转向角度由转向系(转向角)决定,不是轮胎的功能,故选D(题干问“不包括的”)。\n【易错】注意“影响行驶方向”≠“减小转向角度”。转向角度大小是转向系设计参数,与轮胎无关。"}, {"id": 113, "oid": "C7-02", "type": "judge", "module": "汽车底盘维修", "q": "轮胎气压过低时胎体变形减小、滚动阻力降低，因此适当降低气压可以节约燃油。", "opts": [], "a": "×", "e": "【考点】轮胎气压过低的影响。\n【解析】气压过低:胎体变形加大,帘布层反复屈挠疲劳、生热,滚动阻力增大→油耗升高,严重时胎体脱层、爆胎。题干说“变形减小、降低油耗”,完全错误,判断为×。\n【易错】“气压低→变形大→阻力大→费油→易爆胎”,链条要记熟。很多人误以为胎压低更软更省油,实际相反。"}, {"id": 114, "oid": "C7-03", "type": "single", "module": "汽车底盘维修", "q": "轮胎异常磨损中，若两侧胎肩磨损严重，通常表明（　）。", "opts": [{"k": "A", "t": "轮胎气压过高"}, {"k": "B", "t": "轮胎气压过低"}, {"k": "C", "t": "前束不正确"}, {"k": "D", "t": "车轮不平衡"}], "a": "B", "e": "【考点】轮胎异常磨损与气压的关系。\n【解析】气压过低:胎面中部内凹,两侧胎肩着地压力大→两肩磨损;气压过高:胎面中部凸起→中部磨损;前束失准:胎面羽状(锯齿)磨损;车轮不平衡:点状磨损。题干问“两肩磨损”,选B气压过低。\n【易错】磨损部位对应:两肩磨=气压低,中部磨=气压高,单边磨=外倾角不对,羽状磨=前束不对,点状磨=不平衡。对比记忆最有效。"}, {"id": 115, "oid": "C7-04", "type": "single", "module": "汽车底盘维修", "q": "为防止轮胎早期损坏，下列做法不正确的是（　）。", "opts": [{"k": "A", "t": "保持标准气压并定期检查"}, {"k": "B", "t": "定期进行轮胎换位"}, {"k": "C", "t": "前轮采用新旧程度不一致的轮胎"}, {"k": "D", "t": "避免超载和高速急转弯"}], "a": "C", "e": "【考点】轮胎正确使用与保养。\n【解析】A保持标准气压、B定期换位(前后交叉换位使磨损均匀)、D避免超载和高速急转都是正确做法。C前轮装新旧不一致轮胎:同轴轮胎规格花纹磨损必须一致,否则两侧滚动半径和附着不同→跑偏、制动不稳定,故选C(题干问“不正确的”)。\n【易错】“同轴轮胎必须一致”(规格、花纹、磨损程度),这是安全和法规要求。新胎配旧胎、不同品牌混装都是错误的。"}, {"id": 116, "oid": "C8-01", "type": "single", "module": "汽车底盘维修", "q": "汽车行驶系由车架（或承载式车身）、车桥、（　）和车轮四部分组成。", "opts": [{"k": "A", "t": "悬架"}, {"k": "B", "t": "转向器"}, {"k": "C", "t": "制动器"}, {"k": "D", "t": "差速器"}], "a": "A", "e": "【考点】行驶系的组成。\n【解析】行驶系由车架(或承载式车身)、车桥、悬架和车轮四部分组成:车架支承、车桥连接车轮、悬架弹性连接车架与车桥并缓冲、车轮与地面接触。转向器属转向系、制动器属制动系,故选A。\n【易错】“行驶系四件:车架、车桥、悬架、车轮”。悬架是行驶系的标志性部件,别与转向系、制动系部件混。"}, {"id": 117, "oid": "C8-02", "type": "judge", "module": "汽车底盘维修", "q": "悬架一般由弹性元件、减振器和导向机构（含横向稳定杆）组成，弹性元件用于缓冲冲击，减振器用于衰减振动。", "opts": [], "a": "√", "e": "【考点】悬架的组成与各元件作用。\n【解析】悬架由弹性元件(弹簧,缓冲冲击)、减振器(衰减振动)、导向机构(摆臂连杆,传递力和决定车轮轨迹)组成,横向稳定杆防侧倾。弹性元件缓冲、减振器衰减,题干表述正确,判断为√。\n【易错】“弹性元件管缓冲、减振器管衰减”,一“缓冲”一“衰减”分工不同。没有减振器,弹簧会一直颠(余振)。横向稳定杆是防侧倾的辅助件。"}, {"id": 118, "oid": "C8-03", "type": "single", "module": "汽车底盘维修", "q": "行驶中车身持续颠簸振动、车轮与路面冲击感强，且按压车身时回弹不止，最可能的原因是（　）。", "opts": [{"k": "A", "t": "减振器失效"}, {"k": "B", "t": "轮胎气压过低"}, {"k": "C", "t": "转向器间隙大"}, {"k": "D", "t": "制动器拖滞"}], "a": "A", "e": "【考点】减振器失效的故障现象。\n【解析】减振器失效(漏油、阻尼丧失)后,弹簧振动得不到衰减,车身持续颠簸、按压回弹不止(余振),行驶冲击感强。故选A。胎压过低表现为转向沉重、胎肩磨损;转向器间隙大是方向松旷;拖滞是制动发热。\n【易错】“回弹不止/余振不断”是减振器失效的经典信号。检查:按压车身松手,回弹超过2次说明减振器失效。失效常伴漏油。"}, {"id": 119, "oid": "C8-04", "type": "single", "module": "汽车底盘维修", "q": "行驶中前轮出现“摆振”（方向发抖），速度越高越明显，常见原因是（　）。", "opts": [{"k": "A", "t": "车轮动不平衡"}, {"k": "B", "t": "制动液不足"}, {"k": "C", "t": "离合器分离不彻底"}, {"k": "D", "t": "变速器缺油"}], "a": "A", "e": "【考点】前轮摆振的原因。\n【解析】车轮动不平衡时,高速旋转产生周期性离心力,引起前轮摆振(方向发抖),车速越高越明显,还加速轮胎磨损。故选A。解决:做车轮动平衡,在轮辋加配重块。\n【易错】“高速摆振”第一嫌疑=车轮动平衡(前轮尤甚)。与之区分:低速摆振多为轮胎变形/定位问题;制动时抖动多为制动盘端面跳动。"}, {"id": 120, "oid": "C9-01", "type": "single", "module": "汽车底盘维修", "q": "机械转向系统由转向操纵机构、转向器和（　）三部分组成。", "opts": [{"k": "A", "t": "转向传动机构"}, {"k": "B", "t": "制动踏板"}, {"k": "C", "t": "差速器"}, {"k": "D", "t": "半轴"}], "a": "A", "e": "【考点】机械转向系的组成。\n【解析】机械转向系由转向操纵机构(转向盘、转向轴、转向管柱)、转向器(放大转向力、改变传动方向)和转向传动机构(转向摇臂、直拉杆、转向节臂、横拉杆)三部分组成。故选A。\n【易错】“操纵机构—转向器—传动机构”三环节:盘上操作→转向器放大→杆件带动车轮。差速器、半轴属传动系,制动踏板属制动系。"}, {"id": 121, "oid": "C9-02", "type": "judge", "module": "汽车底盘维修", "q": "液压动力转向系统以蓄电池带动电动油泵产生液压助力，助力大小固定不变，与发动机转速无关。", "opts": [], "a": "×", "e": "【考点】液压动力转向的助力来源与特性。\n【解析】液压动力转向由发动机通过皮带带动转向油泵产生液压助力,助力随发动机转速变化:怠速/低速时泵油量大、助力大,转向轻便;高速时助力减小,避免发飘。题干说“蓄电池驱动电动油泵、助力固定”,错误,判断为×。\n【易错】“液压助力=发动机带泵”(不是电动泵);“助力随转速变化”(不是固定)。电动助力(EPS)才用电动机且助力随车速调节。两种助力别混。"}, {"id": 122, "oid": "C9-03", "type": "single", "module": "汽车底盘维修", "q": "转向盘自由行程（游隙）过大的常见原因是（　）。", "opts": [{"k": "A", "t": "转向器啮合间隙过大或转向传动机构各球头松旷"}, {"k": "B", "t": "轮胎气压过高"}, {"k": "C", "t": "前束过大"}, {"k": "D", "t": "减振器失效"}], "a": "A", "e": "【考点】转向盘自由行程过大的原因。\n【解析】自由行程(游隙)过大说明转向系各连接处间隙累积过大:转向器啮合间隙大、转向传动机构球头销磨损松旷、轴承松动、转向管柱连接松旷。故选A。应调整啮合间隙、更换磨损球头。\n【易错】“自由行程大=间隙大”。安全规定自由行程一般不超过转向盘转角的一定角度(约10°),过大会影响转向灵敏和行车安全。"}, {"id": 123, "oid": "C9-04", "type": "single", "module": "汽车底盘维修", "q": "液压动力转向系统转向沉重，发动机怠速运转时原地打方向费力，首先应检查（　）。", "opts": [{"k": "A", "t": "转向油泵皮带松紧及油液液位"}, {"k": "B", "t": "前束值"}, {"k": "C", "t": "转向器啮合间隙过小"}, {"k": "D", "t": "车轮动平衡"}], "a": "A", "e": "【考点】动力转向转向沉重的诊断顺序。\n【解析】动力转向沉重,先查助力系统:转向油泵皮带松滑打滑、储油罐油液不足、油路进气(油液泡沫)、泵内部磨损。排除助力原因后再查机械(转向器卡滞、前束、轮胎气压)。故选A。\n【易错】“先简后繁、先助力后机械”:助力系统是动力转向沉重的最常见原因。皮带松、油少是首查项。别一上来就调前束拆转向器。"}, {"id": 124, "oid": "C9-05", "type": "judge", "module": "汽车底盘维修", "q": "汽车直线行驶时自动跑偏，除转向系外，还可能与两侧轮胎气压不等、制动器拖滞、前轮定位失准有关。", "opts": [], "a": "√", "e": "【考点】汽车跑偏的多因素诊断。\n【解析】跑偏原因:两侧轮胎气压不等(滚动半径不同)、制动器单侧拖滞(附加阻力)、前轮定位失准(前束、外倾、主销参数)、左右悬架高度不等、轮胎磨损不一致。题干列举正确,判断为√。\n【易错】“跑偏”是综合性故障:定位、胎压、制动拖滞、悬架都查。诊断顺序:先查胎压→再查制动拖滞→最后查定位。单侧拖滞跑偏方向与拖滞侧一致。"}, {"id": 125, "oid": "C10-01", "type": "single", "module": "汽车底盘维修", "q": "液压制动系统由制动踏板、制动主缸、（　）、制动轮缸（分泵）和车轮制动器组成。", "opts": [{"k": "A", "t": "制动管路"}, {"k": "B", "t": "转向油泵"}, {"k": "C", "t": "差速器"}, {"k": "D", "t": "离合器"}], "a": "A", "e": "【考点】液压制动系统的组成。\n【解析】液压制动系由制动踏板、制动主缸(总泵)、制动管路、制动轮缸(分泵)和车轮制动器组成,靠制动液传递压力。故选A。\n【易错】“主缸(总泵)→管路→轮缸(分泵)→制动器”是液压传力链。双回路制动系统有两套独立管路,保证一个回路失效时仍有制动。"}, {"id": 126, "oid": "C10-02", "type": "judge", "module": "汽车底盘维修", "q": "行车制动器主要用于停车后防止车辆溜动，驻车制动器主要用于行驶中使汽车减速或停车。", "opts": [], "a": "×", "e": "【考点】行车制动与驻车制动的区别。\n【解析】行车制动(脚制动/制动踏板)用于行驶中减速或停车;驻车制动(手刹/电子手刹)用于停车后防止溜动。题干把两者功能说反,判断为×。\n【易错】口诀:行车制动“减速停车”,驻车制动“停稳不溜”。驻车制动多作用于后轮(鼓式/卡钳式),行车制动作用于全部车轮。"}, {"id": 127, "oid": "C10-03", "type": "single", "module": "汽车底盘维修", "q": "制动踏板踩下后感觉“软”（发绵）、制动距离明显变长，最可能的原因是（　）。", "opts": [{"k": "A", "t": "制动管路内有空气"}, {"k": "B", "t": "制动器拖滞"}, {"k": "C", "t": "制动液过多"}, {"k": "D", "t": "制动踏板自由行程过小"}], "a": "A", "e": "【考点】制动踏板发软的原因。\n【解析】制动管路进入空气后,气体可压缩,踩踏板时先压缩空气才能传递压力,表现为踏板发软(发绵)、制动距离变长、制动效能下降,需排空气。故选A。拖滞是不制动也发热阻滞,踏板发硬。\n【易错】踏板“软”=管路有空气(压缩行程大);踏板“硬且低”=制动液不足;踏板“硬且高”=真空助力失效。三症状三原因。"}, {"id": 128, "oid": "C10-04", "type": "single", "module": "汽车底盘维修", "q": "制动器拖滞（放松制动后车轮仍不能自由转动）的常见原因是（　）。", "opts": [{"k": "A", "t": "制动液不足"}, {"k": "B", "t": "制动踏板自由行程过大"}, {"k": "C", "t": "制动主缸回位不良或轮缸卡滞、制动器回位弹簧折断"}, {"k": "D", "t": "制动管路有空气"}], "a": "C", "e": "【考点】制动器拖滞的原因。\n【解析】拖滞(不制动时车轮仍被拖住)是回位不良:制动主缸回位不良(回位孔堵塞、皮碗发胀)、轮缸活塞卡滞、制动器回位弹簧折断、手刹调整过紧。表现为行驶阻力大、轮毂发热、油耗增加。故选C。\n【易错】“拖滞=松不开”:主缸/轮缸回位不良+回位弹簧断。管路有空气是踏板软,不是拖滞。单侧拖滞还会引起跑偏。"}, {"id": 129, "oid": "C10-05", "type": "judge", "module": "汽车底盘维修", "q": "制动跑偏（制动时汽车向一侧偏驶）时，应重点检查两侧制动器制动力是否均衡、轮胎气压是否一致及前轮定位是否正确。", "opts": [], "a": "√", "e": "【考点】制动跑偏的原因分析。\n【解析】制动跑偏:两侧制动力不均衡(轮缸卡滞、摩擦片油污烧蚀、间隙不一致)、两侧轮胎气压或花纹不同、前轮定位失准、悬架变形。应做对称性检查。题干正确,判断为√。\n【易错】“跑偏”与“制动跑偏”区分:制动时跑偏=制动力不均(查制动器对称性);行驶跑偏=定位/胎压/拖滞。制动跑偏是安全事故高发点。"}, {"id": 130, "oid": "C11-01", "type": "single", "module": "汽车底盘维修", "q": "轮胎规格“205/55 R16”中，“R”表示（　）。", "opts": [{"k": "A", "t": "轮胎内径"}, {"k": "B", "t": "子午线轮胎"}, {"k": "C", "t": "斜交轮胎"}, {"k": "D", "t": "载重等级"}], "a": "B", "e": "【考点】轮胎规格的识读。\n【解析】规格“205/55 R16”:205=胎面宽度205mm;55=扁平率(胎高÷胎宽×100%);R=子午线轮胎(Radial);16=轮辋直径16英寸。故选B。\n【易错】“R”=子午线轮胎,不是直径半径。斜交轮胎用“-”或“×”表示(如6.50-16)。扁平率越小胎越扁、操控越好。"}, {"id": 131, "oid": "C11-02", "type": "judge", "module": "汽车底盘维修", "q": "更换轮胎时，应选用与原车规格、结构和速度级别相同的轮胎，不能随意混用不同规格的轮胎。", "opts": [], "a": "√", "e": "【考点】轮胎更换的选用原则。\n【解析】轮胎规格、结构和速度级别直接决定滚动半径、承载能力和最高安全车速。混用不同规格(如205/55R16与215/55R16)会使两侧滚动半径不一致,导致跑偏、ABS轮速信号异常和安全隐患。题干正确,判断为√。\n【易错】换胎三原则:“同规格、同结构、同速度级别”,且同轴花纹一致。只换一条胎时,尽量保证与新胎同品牌同花纹。"}, {"id": 132, "oid": "C11-03", "type": "single", "module": "汽车底盘维修", "q": "高速行驶的轿车选用轮胎时，除规格外还应特别注意轮胎的（　）。", "opts": [{"k": "A", "t": "速度级别（如H、V、W级）"}, {"k": "B", "t": "颜色"}, {"k": "C", "t": "品牌产地"}, {"k": "D", "t": "花纹方向"}], "a": "A", "e": "【考点】轮胎速度级别的含义。\n【解析】速度级别表示轮胎允许的最高行驶速度:如H=210km/h、V=240km/h、W=270km/h、Y=300km/h。高速轿车必须选用不低于原车要求的速度级别,否则高速行驶轮胎过载爆胎。故选A。\n【易错】速度级别是“允许的最高速度”不是“建议速度”。级别越靠后字母越能跑高速。花纹方向只针对单导向轮胎。"}, {"id": 133, "oid": "C12-01", "type": "single", "module": "汽车底盘维修", "q": "液力自动变速器（AT）主要由液力变矩器、（　）、液压控制系统和电子控制系统等组成。", "opts": [{"k": "A", "t": "齿轮变速机构"}, {"k": "B", "t": "同步器"}, {"k": "C", "t": "主减速器"}, {"k": "D", "t": "差速器"}], "a": "A", "e": "【考点】液力自动变速器(AT)的组成。\n【解析】液力自动变速器四大组成:液力变矩器(液力偶合,可增扭)、齿轮变速机构(行星齿轮机构)、液压控制系统(阀体、油泵)、电子控制系统(TCU、电磁阀)。故选A齿轮变速机构。\n【易错】同步器是手动变速器部件;主减速器、差速器是驱动桥部件。AT的挡位变化靠液压油推动离合器和制动器锁止行星齿轮实现。"}, {"id": 134, "oid": "C12-02", "type": "judge", "module": "汽车底盘维修", "q": "液力变矩器只起传递动力的作用，不能变速变矩，汽车起步平稳主要依靠发动机怠速控制实现。", "opts": [], "a": "×", "e": "【考点】液力变矩器的组成与作用。\n【解析】液力变矩器由泵轮(主动,连发动机)、涡轮(从动,连变速器)、导轮(固定于壳体,反作用力增扭)组成:泵轮搅动ATF带动涡轮,涡轮转速低时导轮改变液流方向使输出扭矩增大,实现自动变速变矩。题干说“不能变速变矩”,错误,判断为×。\n【易错】“变矩器=泵轮+涡轮+导轮”,导轮是增扭的关键。涡轮转速越低、增扭越大(起动时可达2倍以上),这就是汽车起步平稳的原因。"}, {"id": 135, "oid": "C12-03", "type": "single", "module": "汽车底盘维修", "q": "自动变速器（AT）换挡规律的控制，主要依据（　）两个信号。", "opts": [{"k": "A", "t": "车速和节气门开度（负荷）"}, {"k": "B", "t": "发动机转速和机油压力"}, {"k": "C", "t": "水温与油温"}, {"k": "D", "t": "制动踏板与离合器位置"}], "a": "A", "e": "【考点】自动变速器的换挡控制信号。\n【解析】自动变速器换挡时机主要由两个信号决定:车速信号(车快则升挡)和节气门开度/负荷信号(油门大则推迟升挡、降挡增扭)。两个信号经TCU运算确定换挡点。故选A。\n【易错】“车速+负荷”是换挡两大依据:“车速决定该不该换,负荷决定什么时候换”。油门踩到底会强制降挡(Kick-down)。"}, {"id": 136, "oid": "C12-04", "type": "judge", "module": "汽车底盘维修", "q": "自动变速器油（ATF）除传递液力变矩器动力外，还用于润滑齿轮机构、冷却和操纵液压控制系统，必须使用规定牌号的ATF。", "opts": [], "a": "√", "e": "【考点】ATF的多重作用。\n【解析】ATF(自动变速器油)同时承担:传递液力变矩器动力、润滑齿轮和轴承、冷却变速器、作为液压控制系统的工作介质(推动离合器和制动器)。不同牌号ATF性能(黏度、摩擦特性)差异大,混用误用会损坏变速器。题干正确,判断为√。\n【易错】ATF是“一油四用”:传动+润滑+冷却+液压。必须用厂家指定牌号(Dexron III、ATF-3309等),不能拿普通机油代替。"}, {"id": 137, "oid": "D1-01", "type": "single", "module": "汽车电子与电器维修", "q": "在串联电路中，各电阻两端电压的关系是（　）。", "opts": [{"k": "A", "t": "各电阻电压相等"}, {"k": "B", "t": "总电压等于各电阻电压之和，各电阻电流相等"}, {"k": "C", "t": "各电阻电流不同"}, {"k": "D", "t": "总电流等于各支路电流之和"}], "a": "B", "e": "【考点】串联电路电压电流规律。\n【解析】串联电路:电流处处相等;总电压等于各电阻电压之和(U=U1+U2+…),电阻越大分压越大。并联电路:各支路电压相等;总电流等于各支路电流之和。题干问串联,故选B。\n【易错】“串联分压、并联分流”是口诀:串联管电压分配、并联管电流分配。D选项“总电流等于各支路电流之和”是并联电路的规律,不能选。"}, {"id": 138, "oid": "D1-02", "type": "single", "module": "汽车电子与电器维修", "q": "两个12Ω的电阻并联后，其总电阻为（　）。", "opts": [{"k": "A", "t": "24Ω"}, {"k": "B", "t": "12Ω"}, {"k": "C", "t": "6Ω"}, {"k": "D", "t": "3Ω"}], "a": "C", "e": "【考点】并联电阻的总电阻计算。\n【解析】n个相同电阻R并联,总电阻R总=R/n。两个12Ω并联:12÷2=6Ω。并联总电阻一定小于其中任何一个电阻(越并越小)。故选C。\n【易错】“并联越并越小、串联越串越大”。串联总电阻=相加(12+12=24Ω是串联值,是干扰项A)。记住公式1/R总=1/R1+1/R2。"}, {"id": 139, "oid": "D1-03", "type": "judge", "module": "汽车电子与电器维修", "q": "汽车前照灯灯泡（12V、55W）正常点亮时，流过灯泡的电流约为0.46A。", "opts": [], "a": "×", "e": "【考点】电功率公式计算电流。\n【解析】由P=UI得I=P/U=55W÷12V≈4.58A,不是0.46A。题干数字差了10倍。故选×。\n【易错】三个功率公式记牢:P=UI(已知电压电流)、P=U²/R、P=I²R。计算时注意单位:W配V、A。0.46A是有人误用55÷120得出的。"}, {"id": 140, "oid": "D1-04", "type": "single", "module": "汽车电子与电器维修", "q": "某灯泡额定电压12V、额定功率24W，其正常工作时电阻约为（　）。", "opts": [{"k": "A", "t": "2Ω"}, {"k": "B", "t": "6Ω"}, {"k": "C", "t": "12Ω"}, {"k": "D", "t": "24Ω"}], "a": "B", "e": "【考点】由功率电压求电阻。\n【解析】由P=U²/R得R=U²/P=12²÷24=144÷24=6Ω。故选B。\n【易错】选对公式是关键:已知U和P求R用P=U²/R;已知U和I求R用R=U/I。注意:白炽灯冷态电阻比热态小得多,题目按额定工况计算。"}, {"id": 141, "oid": "D1-05", "type": "single", "module": "汽车电子与电器维修", "q": "我国工业与民用交流电的频率（工频）为（　）。", "opts": [{"k": "A", "t": "50Hz"}, {"k": "B", "t": "60Hz"}, {"k": "C", "t": "100Hz"}, {"k": "D", "t": "25Hz"}], "a": "A", "e": "【考点】我国电网工频。\n【解析】我国工业与民用交流电频率(工频)为50Hz,周期T=1/f=0.02s。美国、日本部分地区用60Hz。故选A。\n【易错】“中国50Hz,美日60Hz”是常识考点。周期与频率互为倒数:T=1/f,50Hz对应周期0.02秒。"}, {"id": 142, "oid": "D1-06", "type": "judge", "module": "汽车电子与电器维修", "q": "交流电的有效值等于其最大值除以√2，即U=Um/√2。", "opts": [], "a": "√", "e": "【考点】交流电有效值与最大值的关系。\n【解析】正弦交流电有效值=最大值÷√2(约0.707倍),即U=Um/√2、I=Im/√2。电压表、电流表测得的都是有效值,家用电220V也是有效值(峰值约311V)。题干正确,判断为√。\n【易错】“√2”是正弦交流电的关键系数:有效值=峰值/√2。220V市电的峰值约311V。别把平均值(0.637倍)与有效值混淆。"}, {"id": 143, "oid": "D1-07", "type": "single", "module": "汽车电子与电器维修", "q": "纯电容电路中，电流与电压的相位关系是（　）。", "opts": [{"k": "A", "t": "电流超前电压90°"}, {"k": "B", "t": "电流滞后电压90°"}, {"k": "C", "t": "同相"}, {"k": "D", "t": "反相"}], "a": "A", "e": "【考点】纯电容、纯电感电路的相位关系。\n【解析】纯电容电路:电流超前电压90°(电容充电先有电流);纯电感电路:电流滞后电压90°(电感阻碍电流变化);纯电阻:同相。故选A。\n【易错】口诀“容流超、感流滞”:电容电流超前(IC超UL),电感电流滞后。记“C超前、L滞后”,谐音“提
